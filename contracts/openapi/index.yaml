openapi: 3.1.0
info:
  title: BThwani Canonical API Index
  version: 1.0.0
  description: >-
    The single canonical platform OpenAPI aggregation index. It references one
    owned entry contract per bounded context and owns no runtime paths, domain
    schemas, or service operations.
  contact:
    name: BThwani API Governance
servers:
  - url: /
    description: Gateway-relative index; runtime servers are declared by owned contracts.
paths: {}
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-contract-role: MASTER_INDEX_ONLY
x-bthwani-owner: platform-contract-governance
x-bthwani-generation: DISABLED_FOR_MASTER
x-bthwani-client-generation: DISABLED
x-bthwani-runtime-dependency: false
x-bthwani-manual-paths-forbidden: true
x-bthwani-contracts:
  core:
    identity: ../../core/identity/contracts/identity.openapi.yaml
    platformControl: ../../core/platform-control/contracts/platform-control.openapi.yaml
    providers: ../../core/providers/contracts/providers.openapi.yaml
    workforce: ../../core/workforce/contracts/workforce.openapi.yaml
  services:
    dsh: ../../services/dsh/contracts/dsh.openapi.yaml
    wlt: ../../services/wlt/contracts/wlt.openapi.yaml
