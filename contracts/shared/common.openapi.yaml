openapi: 3.1.0
info:
  title: BThwani Shared Contract Components
  version: 1.0.0
  description: >-
    Canonical cross-context transport components: authentication schemes,
    trust headers, the runtime error envelope, pagination, and money. Domain
    schemas remain owned by their bounded-context contracts.

    This file is the single source of truth these shapes should converge to.
    It models services/wlt/contracts/wlt.common.openapi.yaml, the one context
    that already centralizes its own shared components, and matches the wire
    shapes the Go backends actually emit today (the {code, message} error
    body every `sendError` helper writes; the amountMinorUnits + currency
    pair every financial handler already uses) rather than introducing a new
    convention.

    NOT YET WIRED: no context currently $refs into this file. Wiring it in
    requires teaching each of the three bundlers
    (tools/scripts/openapi-context-composer.mjs,
    tools/scripts/dsh-openapi-modular-lib.mjs,
    tools/scripts/wlt-openapi-bundle-lib.mjs) to resolve a $ref outside its
    own context directory, then replacing every local re-declaration this
    file supersedes and regenerating all six clients. That is its own slice,
    consistent with contracts/README.md's existing "Layout ownership" note.
x-bthwani-owner: contracts/shared
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: DISABLED
x-bthwani-runtime-dependency: false
paths:
  x-bthwani-components-only: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    serviceBearer:
      type: http
      scheme: bearer
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema: { type: string, minLength: 8, pattern: '^Bearer .+' }
    ServiceCaller:
      name: X-Service-Caller
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    OperatorContextId:
      name: X-Operator-Context-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 120 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    CorrelationIdOptional:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    PageCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      description: >-
        The wire shape every Go `sendError(w, status, code, message)` helper
        already emits across all six backends. Domain-specific error schemas
        (DshError, WltError, ...) should $ref this instead of redeclaring it.
      properties:
        code: { type: string }
        message: { type: string }
    Money:
      type: object
      additionalProperties: false
      required: [amountMinorUnits, currency]
      description: >-
        Matches the amountMinorUnits (int64) + currency (ISO 4217) pair
        already used throughout services/wlt/backend and services/dsh/backend
        (e.g. internal/cod/cod.go). Never a floating-point amount.
      properties:
        amountMinorUnits: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
    PageInfo:
      type: object
      additionalProperties: false
      required: [hasNextPage]
      properties:
        nextCursor: { type: string }
        hasNextPage: { type: boolean }
  responses:
    Error:
      description: Governed error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: The request is missing or carries an invalid credential.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The authenticated caller is not permitted to perform this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The requested resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: The caller has exceeded the allowed request rate.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: An unexpected server-side failure occurred.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
