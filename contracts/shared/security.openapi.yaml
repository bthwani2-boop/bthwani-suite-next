openapi: 3.0.3
info:
  title: BThwani Security Schemes
  version: 1.0.0
  contact:
    name: Platform Engineering
    email: platform@bthwani.com
x-bthwani-owner: contracts/shared
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: DISABLED
x-bthwani-runtime-dependency: false

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Standard operator JWT bearer token.
        Required scopes are defined in the x-bthwani-scopes enum.
    serviceBearer:
      type: http
      scheme: bearer
      description: Internal service-to-service communication token.

  x-bthwani-scopes:
    type: string
    enum:
      - administration.approve
      - administration.audit.read
      - administration.diagnostics.read
      - administration.manage
      - administration.read
      - administration.role.approve
      - administration.role.request
      - administration.rollback.approve
      - administration.rollback.request
      - administration.staff.approve
      - administration.staff.request
      - analytics.read
      - audit:read
      - catalog.approval.manage
