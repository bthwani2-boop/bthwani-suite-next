openapi: 3.1.0
info:
  title: BThwani WLT Shared Transport Components
  version: 1.1.0
  description: >-
    Canonical cross-contract transport components for the WLT service. Domain
    schemas remain owned by their journey contracts; authentication headers,
    correlation, idempotency and the runtime error envelope are defined exactly
    once here. X-Delegated-Operator-Context is the authenticated service-to-service
    transport for the canonical OperatorContext and is accepted only after the
    service credential and caller identity have been verified. End-user reference
    reads derive OperatorContext from Identity and do not accept a client-selected
    financial scope.
x-bthwani-owner: services/wlt
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: DISABLED
x-bthwani-runtime-dependency: true
x-bthwani-financial-owner: true
paths:
  x-bthwani-components-only: true
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema: { type: string, minLength: 8, pattern: '^Bearer .+' }
    ServiceCaller:
      name: X-Service-Caller
      in: header
      required: true
      schema: { type: string, const: dsh }
    OperatorContextId:
      name: X-Delegated-Operator-Context
      in: header
      required: true
      description: >-
        Canonical OperatorContext delegated by an authenticated internal service.
        Delegated describes the transport boundary only; the domain and persisted
        financial ownership field remains operatorContextId.
      schema: { type: string, minLength: 1, maxLength: 120 }
    DelegatedFinancePrincipalId:
      name: X-Delegated-Principal-ID
      in: header
      required: true
      description: >-
        Identity-authenticated finance operator delegated by the authenticated
        DSH service. It is the sole actor authority for sensitive finance
        transitions and must never be supplied in a request body.
      schema: { type: string, minLength: 1, maxLength: 200 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    CorrelationIdOptional:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    OutboxEventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PayoutId:
      name: payoutId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    SettlementId:
      name: settlementId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    Error: { $ref: '../../../contracts/shared/common.openapi.yaml#/components/schemas/Error' }
  responses:
    Error:
      description: Governed WLT error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
