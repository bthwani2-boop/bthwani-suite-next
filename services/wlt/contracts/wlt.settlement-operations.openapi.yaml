openapi: 3.1.0
info:
  title: BThwani WLT Settlement Operations API
  version: 1.0.0
  description: Tenant-scoped settlement reads, financial summary and governed posting transition.
x-bthwani-owner: services/wlt
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: ENABLED
x-bthwani-runtime-dependency: true
x-bthwani-financial-owner: true
servers:
  - url: http://localhost:58083
security:
  - serviceBearer: []
paths:
  /wlt/settlements:
    get:
      operationId: listWltSettlements
      tags: [WltSettlements]
      summary: List tenant-local settlements.
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - name: partnerId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Tenant-local settlements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementListResponse' }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '401': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '403': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/settlements/summary:
    get:
      operationId: getWltSettlementSummary
      tags: [WltSettlements]
      summary: Return the tenant-local settlement summary computed by WLT.
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
      responses:
        '200': { description: Tenant-local settlement summary }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '401': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '403': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/settlements/{settlementId}:
    get:
      operationId: getWltSettlement
      tags: [WltSettlements]
      summary: Read one tenant-local settlement.
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/SettlementId'
      responses:
        '200': { description: Tenant-local settlement }
        '401': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '403': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '404': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/settlements/{settlementId}/post:
    post:
      operationId: postWltSettlement
      tags: [WltSettlements]
      summary: Post a pending tenant-local settlement and its balanced journal atomically.
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/SettlementId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operatorId: { type: string, minLength: 1 }
      responses:
        '200': { description: Settlement posted or exactly replayed }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '403': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '404': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '409': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
components:
  securitySchemes:
    serviceBearer:
      $ref: './wlt.common.openapi.yaml#/components/securitySchemes/serviceBearer'
  schemas:
    SettlementListItem:
      type: object
      required: [id, partnerId, periodStart, periodEnd, grossAmount, platformFee, netAmount, currency, orderCount, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        partnerId: { type: string }
        periodStart: { type: string }
        periodEnd: { type: string }
        grossAmount: { type: integer }
        platformFee: { type: integer }
        netAmount: { type: integer }
        currency: { type: string }
        orderCount: { type: integer }
        status: { type: string }
        settledAt: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
    SettlementListResponse:
      type: object
      required: [settlements]
      properties:
        settlements:
          type: array
          items: { $ref: '#/components/schemas/SettlementListItem' }
