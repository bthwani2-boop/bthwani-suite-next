openapi: 3.1.0
info:
  title: BThwani WLT Core Service API
  version: 1.0.0
  description: >-
    Canonical WLT liveness, trusted financial references, actor wallets,
    reconciliation administration and read-only ledger inspection.
x-bthwani-owner: services/wlt
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: ENABLED
x-bthwani-runtime-dependency: true
x-bthwani-financial-owner: true
servers:
  - url: http://localhost:58083
paths:
  /wlt/health:
    get:
      operationId: getWltHealth
      tags: [WltSystem]
      responses:
        '200':
          description: WLT process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /wlt/readiness:
    get:
      operationId: getWltReadiness
      tags: [WltSystem]
      responses:
        '200':
          description: WLT dependencies are ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503': { $ref: '#/components/responses/Error' }
  /wlt/references/payment-status:
    get:
      operationId: getWltPaymentStatusRef
      tags: [WltReferences]
      parameters:
        - $ref: '#/components/parameters/OrderIdQuery'
      responses:
        '200': { $ref: '#/components/responses/ReferenceResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /wlt/references/settlement-status:
    get:
      operationId: getWltSettlementStatusRef
      tags: [WltReferences]
      parameters:
        - $ref: '#/components/parameters/OrderIdQuery'
      responses:
        '200': { $ref: '#/components/responses/ReferenceResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /wlt/references/refund-status:
    get:
      operationId: getWltRefundStatusRef
      tags: [WltReferences]
      parameters:
        - $ref: '#/components/parameters/OrderIdQuery'
      responses:
        '200': { $ref: '#/components/responses/ReferenceResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /wlt/references/wallet-status:
    get:
      operationId: getWltWalletStatusRef
      tags: [WltReferences]
      parameters:
        - name: actorType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ActorType' }
        - name: actorId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/ReferenceResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /wlt/wallets/{actorType}/{actorId}:
    get:
      operationId: getWltWallet
      tags: [WltWallets]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ActorTypePath'
        - $ref: '#/components/parameters/ActorIdPath'
      responses:
        '200':
          description: Tenant-local actor wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletEnvelope' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /wlt/reconciliation-cases:
    get:
      operationId: listWltReconciliationCases
      tags: [WltReconciliation]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved] }
      responses:
        '200':
          description: Tenant-local reconciliation cases.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /wlt/reconciliation-cases/{caseId}:
    get:
      operationId: getWltReconciliationCase
      tags: [WltReconciliation]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Tenant-local reconciliation case.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Error' }
  /wlt/reconciliation-cases/{caseId}/assign:
    post:
      operationId: assignWltReconciliationCase
      tags: [WltReconciliation]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Reconciliation case assigned.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { $ref: '#/components/responses/Error' }
  /wlt/reconciliation-cases/{caseId}/resolve:
    post:
      operationId: resolveWltReconciliationCase
      tags: [WltReconciliation]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Reconciliation case resolved.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { $ref: '#/components/responses/Error' }
  /wlt/ledger/entries:
    get:
      operationId: listWltLedgerEntries
      tags: [WltLedger]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
        - name: actorId
          in: query
          schema: { type: string }
        - name: actorType
          in: query
          schema: { $ref: '#/components/schemas/ActorType' }
        - name: orderId
          in: query
          schema: { type: string }
        - name: entryType
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Tenant-local immutable ledger entries.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Error' }
  /wlt/ledger/entries/{entryId}:
    get:
      operationId: getWltLedgerEntry
      tags: [WltLedger]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
        - name: entryId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Tenant-local immutable ledger entry.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Error' }
  /wlt/ledger/financial-summary:
    get:
      operationId: getWltLedgerFinancialSummary
      tags: [WltLedger]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Account-type-aware tenant-local financial summary.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema: { type: string, minLength: 8 }
    ServiceCaller:
      name: X-Service-Caller
      in: header
      required: true
      schema: { type: string, const: dsh }
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 120 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    OrderIdQuery:
      name: orderId
      in: query
      required: true
      schema: { type: string, minLength: 1 }
    ActorTypePath:
      name: actorType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ActorType' }
    ActorIdPath:
      name: actorId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    ReferenceResponse:
      description: Canonical WLT reference.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    Error:
      description: Governed WLT error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ActorType:
      type: string
      enum: [client, partner, captain, field, system, platform]
    HealthResponse:
      type: object
      required: [service, status]
      properties:
        service: { type: string, const: wlt }
        status: { type: string }
    WalletEnvelope:
      type: object
      additionalProperties: true
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
