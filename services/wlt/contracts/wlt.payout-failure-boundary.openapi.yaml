openapi: 3.1.0
info:
  title: BThwani WLT Payout Failure Boundary
  version: 1.0.0
  description: Fail-closed route proving that ambiguous provider payouts cannot be manually failed or release held funds outside reconciliation.
x-bthwani-owner: services/wlt
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: ENABLED
x-bthwani-runtime-dependency: true
x-bthwani-financial-owner: true
servers:
  - url: http://localhost:58083
security:
  - serviceBearer: []
paths:
  /wlt/payout-requests/{payoutId}/fail:
    post:
      operationId: failWltPayoutRequestClosed
      tags: [WltPayoutRequests]
      summary: Reject manual payout failure and require provider reconciliation.
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/OperatorContextId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/PayoutId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operatorId]
              properties:
                operatorId: { type: string, minLength: 1 }
      responses:
        '403': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '409':
          description: RECONCILIATION_REQUIRED; held funds remain unchanged.
          content:
            application/json:
              schema: { $ref: './wlt.common.openapi.yaml#/components/schemas/Error' }
components:
  securitySchemes:
    serviceBearer:
      $ref: './wlt.common.openapi.yaml#/components/securitySchemes/serviceBearer'
