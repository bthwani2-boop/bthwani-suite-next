openapi: 3.1.0
x-bthwani-owner: services/wlt
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-capability: payouts-destinations
info:
  title: WLT Payout Destinations and Outbound Payments
  version: 2.0.0
  description: >-
    WLT-owned official-wallet payout destinations, automatically destination-bound
    payout requests, separated finance-operator transitions, immutable provider
    proof and governed reconciliation. Beneficiary surfaces never create, replace,
    verify or deactivate payout master data and never choose a destination id.
servers:
  - url: http://localhost:18083
paths:
  /wlt/payout-destinations/{actorType}/{actorId}:
    parameters:
      - $ref: '#/components/parameters/ActorType'
      - $ref: '#/components/parameters/ActorId'
    get:
      tags: [ "wlt-payout-destinations" ]
      operationId: getWltTypedPayoutDestination
      responses:
        '200':
          description: Active masked payout destination.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDestinationEnvelope' }
        '404': { $ref: '#/components/responses/PayoutNotFound' }
      security: [ { serviceBearer: [] } ]
    put:
      tags: [ "wlt-payout-destinations" ]
      operationId: upsertWltTypedPayoutDestination
      description: >-
        Finance-controlled master-data mutation. Caller identity comes only from
        the delegated Identity principal. A material change creates a fresh
        unverified version; verification never carries across versions.
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/DelegatedFinancePrincipalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutDestinationInput' }
      responses:
        '200':
          description: Exact idempotent replay or unchanged current destination.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDestinationEnvelope' }
        '201':
          description: New destination version encrypted and activated; prior destination superseded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDestinationEnvelope' }
        '400': { $ref: '#/components/responses/PayoutInvalidRequest' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
        '409': { $ref: '#/components/responses/PayoutConflict' }
      security: [ { serviceBearer: [] } ]
  /wlt/payout-destinations/{actorType}/{actorId}/verify:
    parameters:
      - $ref: '#/components/parameters/ActorType'
      - $ref: '#/components/parameters/ActorId'
      - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
      - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      - $ref: './wlt.common.openapi.yaml#/components/parameters/DelegatedFinancePrincipalId'
    post:
      tags: [ "wlt-payout-destinations" ]
      operationId: verifyWltOfficialWalletDestination
      description: >-
        Records an independent finance verification decision against the exact
        destination version reviewed. The maker of that version cannot verify it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutDestinationVerificationInput' }
      responses:
        '200':
          description: Verification decision recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDestinationEnvelope' }
        '400': { $ref: '#/components/responses/PayoutInvalidRequest' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
        '404': { $ref: '#/components/responses/PayoutNotFound' }
        '409': { $ref: '#/components/responses/PayoutConflict' }
      security: [ { serviceBearer: [] } ]
  /wlt/payout-destinations/{actorType}/{actorId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ActorType'
      - $ref: '#/components/parameters/ActorId'
      - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
      - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      - $ref: './wlt.common.openapi.yaml#/components/parameters/DelegatedFinancePrincipalId'
    post:
      tags: [ "wlt-payout-destinations" ]
      operationId: deactivateWltTypedPayoutDestination
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutDestinationChangeReason' }
      responses:
        '204': { description: Destination deactivated and audited. }
        '400': { $ref: '#/components/responses/PayoutInvalidRequest' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
        '404': { $ref: '#/components/responses/PayoutNotFound' }
      security: [ { serviceBearer: [] } ]
  /wlt/payout-requests:
    get:
      tags: [ "wlt-payout-requests" ]
      operationId: listWltPayoutRequests
      parameters:
        - name: beneficiaryActorId
          in: query
          schema: { type: string }
        - name: beneficiaryActorType
          in: query
          schema: { $ref: '#/components/schemas/PayoutActorType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PayoutStatus' }
      responses:
        '200':
          description: Scoped canonical payout requests.
          content:
            application/json:
              schema:
                type: object
                required: [ payoutRequests, total ]
                properties:
                  payoutRequests:
                    type: array
                    items: { $ref: '#/components/schemas/PayoutRequest' }
                  total: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/PayoutInvalidRequest' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
      security: [ { serviceBearer: [] } ]
    post:
      tags: [ "wlt-payout-requests" ]
      operationId: createWltDestinationBoundPayoutRequest
      description: >-
        Beneficiary intent only. WLT resolves the current active verified
        official-wallet destination inside the transaction. FULL_AVAILABLE is
        calculated from the locked canonical wallet/settlement projection;
        SPECIFIED accepts a positive minor-unit amount not exceeding eligibility.
        The resolved amount is atomically reserved in pending balance.
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePayoutRequest' }
      responses:
        '201':
          description: Eligible funds reserved and request bound to the current verified destination.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequestEnvelope' }
        '200':
          description: Exact idempotent replay of the first resolved request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequestEnvelope' }
        '400': { $ref: '#/components/responses/PayoutInvalidRequest' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
        '409': { $ref: '#/components/responses/PayoutConflict' }
      security: [ { serviceBearer: [] } ]
  /wlt/payout-requests/{payoutId}:
    parameters:
      - $ref: './wlt.common.openapi.yaml#/components/parameters/PayoutId'
    get:
      tags: [ "wlt-payout-requests" ]
      operationId: getWltPayoutRequest
      responses:
        '200':
          description: Canonical payout state and provider proof.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequestEnvelope' }
        '404': { $ref: '#/components/responses/PayoutNotFound' }
      security: [ { serviceBearer: [] } ]
  /wlt/payout-requests/{payoutId}/approve:
    post:
      tags: [ "wlt-payout-requests" ]
      operationId: approveWltPayoutRequest
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/PayoutId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/DelegatedFinancePrincipalId'
      requestBody: { $ref: '#/components/requestBodies/OperatorBody' }
      responses:
        '200': { $ref: '#/components/responses/PayoutResponse' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
        '409': { $ref: '#/components/responses/PayoutConflict' }
      security: [ { serviceBearer: [] } ]
  /wlt/payout-requests/{payoutId}/reject:
    post:
      tags: [ "wlt-payout-requests" ]
      operationId: rejectWltPayoutRequest
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/PayoutId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/DelegatedFinancePrincipalId'
      requestBody: { $ref: '#/components/requestBodies/OperatorBody' }
      responses:
        '200': { $ref: '#/components/responses/PayoutResponse' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
        '409': { $ref: '#/components/responses/PayoutConflict' }
      security: [ { serviceBearer: [] } ]
  /wlt/payout-requests/{payoutId}/complete:
    post:
      tags: [ "wlt-payout-requests" ]
      operationId: completeWltPayoutRequest
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/PayoutId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/DelegatedFinancePrincipalId'
      requestBody: { $ref: '#/components/requestBodies/OperatorBody' }
      responses:
        '200': { $ref: '#/components/responses/PayoutResponse' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
        '409': { $ref: '#/components/responses/PayoutConflict' }
      security: [ { serviceBearer: [] } ]
  /wlt/payout-requests/{payoutId}/reconcile:
    post:
      tags: [ "wlt-payout-requests" ]
      operationId: reconcileWltPayoutFourWay
      description: Records an immutable four-way match of approved payout, frozen batch, verified execution evidence and authoritative provider statement.
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/PayoutId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/DelegatedFinancePrincipalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcilePayoutFourWayInput' }
      responses:
        '200':
          description: Immutable reconciliation fact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FourWayReconciliationEnvelope' }
        '400': { $ref: '#/components/responses/PayoutInvalidRequest' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
        '409': { $ref: '#/components/responses/PayoutConflict' }
      security: [ { serviceBearer: [] } ]
  /wlt/external-provider-accounts/{providerKey}/{accountReferenceHash}:
    put:
      tags: [ "wlt-external-reconciliation" ]
      operationId: registerWltExternalProviderAccount
      parameters:
        - name: providerKey
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: accountReferenceHash
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
        - $ref: './wlt.common.openapi.yaml#/components/parameters/DelegatedFinancePrincipalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalProviderAccountInput' }
      responses:
        '200':
          description: Canonical external provider account, idempotently registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalProviderAccountEnvelope' }
        '400': { $ref: '#/components/responses/PayoutInvalidRequest' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
      security: [ { serviceBearer: [] } ]
  /wlt/external-provider-statements:
    post:
      tags: [ "wlt-external-reconciliation" ]
      operationId: importWltAuthoritativeExternalStatement
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/DelegatedFinancePrincipalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportAuthoritativeStatementInput' }
      responses:
        '201':
          description: Immutable authoritative external statement and its normalized lines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthoritativeStatementEnvelope' }
        '200':
          description: Exact idempotent statement import.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthoritativeStatementEnvelope' }
        '400': { $ref: '#/components/responses/PayoutInvalidRequest' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
        '409': { $ref: '#/components/responses/PayoutConflict' }
      security: [ { serviceBearer: [] } ]
  /wlt/payout-requests/{payoutId}/audit:
    get:
      tags: [ "wlt-payout-requests" ]
      operationId: listWltPayoutAudit
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/PayoutId'
      responses:
        '200':
          description: Append-only correlation-linked audit.
          content:
            application/json:
              schema:
                type: object
                required: [ auditEvents ]
                properties:
                  auditEvents:
                    type: array
                    items: { $ref: '#/components/schemas/PayoutAuditEvent' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
        '404': { $ref: '#/components/responses/PayoutNotFound' }
      security: [ { serviceBearer: [] } ]
  /wlt/settlement-batches:
    post:
      tags: [ "wlt-settlement-batches" ]
      operationId: createWltSettlementBatch
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ providerId, currency, operatorId ]
              properties:
                providerId: { type: string, minLength: 1 }
                currency: { type: string, minLength: 3, maxLength: 3 }
                operatorId: { type: string, minLength: 1 }
      responses:
        '201':
          description: Settlement batch created from open approved payout snapshots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementBatchEnvelope' }
        '400': { $ref: '#/components/responses/PayoutInvalidRequest' }
      security: [ { serviceBearer: [] } ]
  /wlt/settlement-batches/{batchId}/freeze:
    post:
      tags: [ "wlt-settlement-batches" ]
      operationId: freezeWltSettlementBatch
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string }
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/OperatorBody' }
      responses:
        '200':
          description: Settlement batch frozen and artifact hashed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementBatchEnvelope' }
        '400': { $ref: '#/components/responses/PayoutInvalidRequest' }
        '409': { $ref: '#/components/responses/PayoutConflict' }
      security: [ { serviceBearer: [] } ]
  /wlt/settlement-batches/{batchId}/export:
    get:
      tags: [ "wlt-settlement-batches" ]
      operationId: exportWltSettlementBatch
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Settlement batch export structure.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/PayoutInvalidRequest' }
      security: [ { serviceBearer: [] } ]
  /wlt/settlement-batches/{batchId}/evidence:
    post:
      tags: [ "wlt-settlement-batches" ]
      operationId: recordWltManualTransferExecution
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string }
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ approvedSnapshotId, externalTransferReference, amountMinorUnits, currency, operatorId ]
              properties:
                approvedSnapshotId: { type: string, minLength: 1 }
                externalTransferReference: { type: string, minLength: 1 }
                evidenceReference: { type: string }
                amountMinorUnits: { type: integer, minimum: 1 }
                currency: { type: string, minLength: 3, maxLength: 3 }
                operatorId: { type: string, minLength: 1 }
      responses:
        '201':
          description: Transfer execution evidence recorded, awaiting independent verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualTransferEvidenceEnvelope' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
        '409': { $ref: '#/components/responses/PayoutConflict' }
      security: [ { serviceBearer: [] } ]
  /wlt/settlement-batches/{batchId}/evidence/{evidenceId}/verify:
    post:
      tags: [ "wlt-settlement-batches" ]
      operationId: verifyWltManualTransferExecution
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string }
        - name: evidenceId
          in: path
          required: true
          schema: { type: string }
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
      requestBody: { $ref: '#/components/requestBodies/OperatorBody' }
      responses:
        '200':
          description: External transfer independently verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualTransferEvidenceEnvelope' }
        '403': { $ref: '#/components/responses/PayoutForbidden' }
        '409': { $ref: '#/components/responses/PayoutConflict' }
      security: [ { serviceBearer: [] } ]
  /wlt/finance-close:
    post:
      tags: [ "wlt-finance-close" ]
      operationId: executeWltDailyFinanceClose
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ businessDate ]
              properties:
                businessDate: { type: string, format: date }
      responses:
        '201':
          description: Daily finance closed and audit pack compiled.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { $ref: '#/components/responses/PayoutConflict' }
      security: [ { serviceBearer: [] } ]
  /wlt/internal/outbox-readback/loyalty:
    get:
      tags: [ "wlt-internal-readback" ]
      operationId: readWltLoyaltyOutboxEffect
      parameters:
        - name: idempotencyKey
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 300 }
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/OperatorContextId'
      responses:
        '200':
          description: Canonical loyalty entry identified by its idempotency key.
          content:
            application/json:
              schema:
                type: object
                required: [ loyaltyEntry ]
                properties:
                  loyaltyEntry: { type: object }
        '404': { description: No canonical effect exists yet. }
      security: [ { serviceBearer: [] } ]
components:
  securitySchemes: {}
  parameters:
    ActorType:
      name: actorType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PayoutActorType' }
    ActorId:
      name: actorId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  requestBodies:
    OperatorBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            maxProperties: 0
            description: Finance actor identity is supplied only by X-Delegated-Principal-ID.
  responses:
    PayoutResponse:
      description: Updated canonical payout state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PayoutRequestEnvelope' }
    PayoutInvalidRequest:
      description: Invalid request.
      content:
        { application/json: { schema: { $ref: './wlt.common.openapi.yaml#/components/schemas/Error' } } }
    PayoutForbidden:
      description: Actor scope or maker-checker rule failed.
      content:
        { application/json: { schema: { $ref: './wlt.common.openapi.yaml#/components/schemas/Error' } } }
    PayoutNotFound:
      description: Resource not found.
      content:
        { application/json: { schema: { $ref: './wlt.common.openapi.yaml#/components/schemas/Error' } } }
    PayoutConflict:
      description: Invalid transition, destination state, balance reservation drift, or idempotency conflict.
      content:
        { application/json: { schema: { $ref: './wlt.common.openapi.yaml#/components/schemas/Error' } } }
  schemas:
    ReconcilePayoutFourWayInput:
      type: object
      additionalProperties: false
      required: [ statementLineId ]
      properties:
        statementLineId: { type: string, minLength: 1 }
    FourWayReconciliationEnvelope:
      type: object
      required: [ reconciliation ]
      properties:
        reconciliation:
          type: object
          required: [ id, payoutRequestId, approvedSnapshotId, settlementBatchId, manualTransferEvidenceId, statementLineId, result ]
          properties:
            id: { type: string }
            payoutRequestId: { type: string }
            approvedSnapshotId: { type: string }
            settlementBatchId: { type: string }
            manualTransferEvidenceId: { type: string }
            statementLineId: { type: string }
            result: { type: string, enum: [ MATCHED, UNMATCHED, AMOUNT_MISMATCH, DESTINATION_MISMATCH, DUPLICATE_REFERENCE, MISSING_TRANSFER, UNKNOWN_EXTERNAL_TRANSACTION, NEEDS_REVIEW ] }
    ExternalProviderAccountInput:
      type: object
      additionalProperties: false
      required: [ currency ]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        openingBalanceMinorUnits: { type: integer, format: int64, minimum: 0 }
    ExternalProviderAccountEnvelope:
      type: object
      required: [ account ]
      properties:
        account:
          type: object
          required: [ id, providerKey, accountReferenceHash, currency ]
          properties:
            id: { type: string }
            providerKey: { type: string }
            accountReferenceHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            currency: { type: string }
    AuthoritativeStatementLineInput:
      type: object
      additionalProperties: false
      required: [ externalTransferReference, direction, amountMinorUnits, currency, destinationReferenceHash ]
      properties:
        externalTransferReference: { type: string, minLength: 1 }
        direction: { type: string, enum: [ incoming, outgoing ] }
        amountMinorUnits: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        destinationReferenceHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        occurredAt: { type: string, format: date-time }
        sourceRecord: { type: object, additionalProperties: true }
    ImportAuthoritativeStatementInput:
      type: object
      additionalProperties: false
      required: [ externalProviderAccountId, statementReference, artifactSha256, businessDate, closingBalanceMinorUnits, currency, lines ]
      properties:
        externalProviderAccountId: { type: string, minLength: 1 }
        statementReference: { type: string, minLength: 1 }
        artifactSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        businessDate: { type: string, format: date }
        closingBalanceMinorUnits: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AuthoritativeStatementLineInput' }
    AuthoritativeStatementEnvelope:
      type: object
      required: [ statement ]
      properties:
        statement:
          type: object
          required: [ id, statementReference, artifactSha256 ]
          properties:
            id: { type: string }
            statementReference: { type: string }
            artifactSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    PayoutActorType:
      type: string
      enum: [ partner, captain, field ]
    PayoutStatus:
      type: string
      description: >-
        Governed manual external settlement lifecycle is pending -> approved ->
        executed -> verified -> completed. provider_* values remain historical.
      enum: [ pending, approved, executed, verified, completed, rejected, failed, provider_pending, provider_result_unknown, processing ]
    ReconciliationStatus:
      type: string
      enum: [ not_required, required, inquiry_pending, resolved_success, resolved_failed ]
    PayoutDestinationInput:
      type: object
      additionalProperties: false
      description: >-
        Finance master-data candidate for a governed official wallet. Reason and
        evidenceReference are mandatory; operator identity never comes from the body.
      required: [ beneficiaryName, officialWalletProviderKey, destinationReference, reason, evidenceReference ]
      properties:
        beneficiaryName: { type: string, minLength: 1, maxLength: 200 }
        officialWalletProviderKey: { type: string, minLength: 1, maxLength: 64 }
        destinationReference: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        evidenceReference: { type: string, minLength: 1, maxLength: 500 }
    PayoutDestinationVerificationInput:
      type: object
      additionalProperties: false
      description: Independent finance decision on the exact destination version reviewed.
      required: [ destinationVersion, decision, reason, evidenceReference ]
      properties:
        destinationVersion: { type: integer, minimum: 1 }
        decision: { type: string, enum: [ verified, rejected ] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        evidenceReference: { type: string, minLength: 1, maxLength: 500 }
    PayoutDestinationChangeReason:
      type: object
      additionalProperties: false
      required: [ reason, evidenceReference ]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        evidenceReference: { type: string, minLength: 1, maxLength: 500 }
    PayoutDestination:
      type: object
      required: [ id, ownerActorId, ownerActorType, officialWalletProviderKey, destinationVersion, destinationMethod, maskedDestinationReference, destinationVerificationStatus, beneficiaryName, active, updatedAt ]
      properties:
        id: { type: string }
        ownerActorId: { type: string }
        ownerActorType: { $ref: '#/components/schemas/PayoutActorType' }
        officialWalletProviderKey: { type: string }
        destinationVersion: { type: integer, minimum: 1 }
        destinationMethod:
          type: string
          description: Current writes are always official_wallet; other values are legacy history only.
          enum: [ official_wallet, bank, mobile_money, manual ]
        maskedDestinationReference: { type: string }
        destinationVerificationStatus:
          type: string
          enum: [ unverified, verified, requires_reverification, rejected ]
        beneficiaryName: { type: string }
        active: { type: boolean }
        updatedAt: { type: string, format: date-time }
    PayoutDestinationEnvelope:
      type: object
      required: [ payoutDestination ]
      properties:
        payoutDestination: { $ref: '#/components/schemas/PayoutDestination' }
    CreatePayoutRequest:
      type: object
      additionalProperties: false
      description: >-
        Beneficiary intent. payoutDestinationId is forbidden. FULL_AVAILABLE must
        omit amountMinorUnits; SPECIFIED requires a positive amountMinorUnits.
      required: [ beneficiaryActorId, beneficiaryActorType, amountMode, currency, idempotencyKey ]
      properties:
        beneficiaryActorId: { type: string, minLength: 1 }
        beneficiaryActorType: { $ref: '#/components/schemas/PayoutActorType' }
        amountMode: { type: string, enum: [ FULL_AVAILABLE, SPECIFIED ] }
        amountMinorUnits: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    PayoutRequest:
      type: object
      required: [ id, beneficiaryActorId, beneficiaryActorType, payoutDestinationId, amountMinorUnits, currency, status, reconciliationStatus, requestedAt ]
      properties:
        id: { type: string }
        beneficiaryActorId: { type: string }
        beneficiaryActorType: { $ref: '#/components/schemas/PayoutActorType' }
        payoutDestinationId: { type: string }
        amountMinorUnits: { type: integer }
        currency: { type: string }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        reconciliationStatus: { $ref: '#/components/schemas/ReconciliationStatus' }
        requestedAt: { type: string, format: date-time }
        approvedAt: { type: [ string, 'null' ], format: date-time }
        rejectedAt: { type: [ string, 'null' ], format: date-time }
        executedAt: { type: [ string, 'null' ], format: date-time }
        verifiedAt: { type: [ string, 'null' ], format: date-time }
        completedAt: { type: [ string, 'null' ], format: date-time }
        failedAt: { type: [ string, 'null' ], format: date-time }
        failureReason: { type: string }
        approvedByOperatorId: { type: string }
        rejectedByOperatorId: { type: string }
        executedByOperatorId: { type: string }
        verifiedByOperatorId: { type: string }
        completedByOperatorId: { type: string }
        failedByOperatorId: { type: string }
    PayoutRequestEnvelope:
      type: object
      required: [ payoutRequest ]
      properties:
        payoutRequest: { $ref: '#/components/schemas/PayoutRequest' }
    ManualTransferEvidence:
      type: object
      required: [ id, batchId, approvedSnapshotId, externalTransferReference, amountMinorUnits, currency, executedByOperatorId, executedAt ]
      properties:
        id: { type: string }
        batchId: { type: string }
        approvedSnapshotId: { type: string }
        externalTransferReference: { type: string }
        evidenceReference: { type: string }
        amountMinorUnits: { type: integer }
        currency: { type: string }
        executedByOperatorId: { type: string }
        executedAt: { type: string, format: date-time }
        verifiedByOperatorId: { type: string }
        verifiedAt: { type: [ string, 'null' ], format: date-time }
    ManualTransferEvidenceEnvelope:
      type: object
      required: [ manualTransferEvidence ]
      properties:
        manualTransferEvidence: { $ref: '#/components/schemas/ManualTransferEvidence' }
    PayoutAuditEvent:
      type: object
      required: [ id, aggregateType, aggregateId, action, actorId, actorType, correlationId, metadata, createdAt ]
      properties:
        id: { type: string }
        aggregateType: { type: string }
        aggregateId: { type: string }
        action: { type: string }
        actorId: { type: string }
        actorType: { type: string }
        reason: { type: string }
        correlationId: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    SettlementBatch:
      type: object
      required: [ id, providerId, currency, batchHash, controlTotalMinorUnits, rowCount, status, createdAt ]
      properties:
        id: { type: string }
        providerId: { type: string }
        currency: { type: string }
        batchHash: { type: string }
        controlTotalMinorUnits: { type: integer }
        rowCount: { type: integer }
        status: { type: string, enum: [ open, frozen, cancelled, completed ] }
        createdAt: { type: string, format: date-time }
        frozenAt: { type: [ string, 'null' ], format: date-time }
        createdByOperatorId: { type: string }
    SettlementBatchEnvelope:
      type: object
      required: [ settlementBatch ]
      properties:
        settlementBatch: { $ref: '#/components/schemas/SettlementBatch' }
