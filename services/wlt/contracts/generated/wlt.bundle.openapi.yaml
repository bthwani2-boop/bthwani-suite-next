        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: Provider penalty ledger effect recorded. }
        '400': { $ref: '#/components/responses/WorkforceFinanceBadRequest' }
        '401': { $ref: '#/components/responses/WorkforceFinanceUnauthorized' }
        '403': { $ref: '#/components/responses/WorkforceFinanceForbidden' }
        '409': { $ref: '#/components/responses/WorkforceFinanceConflict' }

  /wlt/provider-penalties/{penaltyId}/reverse:
    post:
      operationId: reverseProviderPenalty
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PenaltyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Provider penalty reversed through a compensating ledger entry. }
        '400': { $ref: '#/components/responses/WorkforceFinanceBadRequest' }
        '401': { $ref: '#/components/responses/WorkforceFinanceUnauthorized' }
        '403': { $ref: '#/components/responses/WorkforceFinanceForbidden' }
        '404': { $ref: '#/components/responses/WorkforceFinanceNotFound' }
        '409': { $ref: '#/components/responses/WorkforceFinanceConflict' }

components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer

    bearerAuth:
      type: http
      scheme: bearer

    DshServiceBearer:
      type: http
      scheme: bearer

    DshServiceCaller:
      type: apiKey
      in: header
      name: X-Service-Caller

  parameters:
    OrderIdQuery:
      name: orderId
      in: query
      required: true
      schema: { type: string, minLength: 1 }

    ActorTypePath:
      name: actorType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ActorType' }

    ActorIdPath:
      name: actorId
      in: path
      required: true
      schema: { type: string, minLength: 1 }

    Authorization:
      name: Authorization
      in: header
      required: true
      schema: { type: string, minLength: 8, pattern: '^Bearer .+' }

    ServiceCaller:
      name: X-Service-Caller
      in: header
      required: true
      schema: { type: string, const: dsh }

    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 120 }

    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }

    CorrelationIdOptional:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }

    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, minLength: 1 }

    CodRecordId:
      name: codRecordId
      in: path
      required: true
      schema: { type: string, minLength: 1 }

    CorrelationHeader:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, minLength: 1 }

    IdempotencyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 255 }

    PayoutId:
      name: payoutId
      in: path
      required: true
      schema: { type: string, minLength: 1 }

    SettlementId:
      name: settlementId
      in: path
      required: true
      schema: { type: string, minLength: 1 }

    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: true
      schema: { type: string, minLength: 1 }

    PaymentSessionId:
      name: paymentSessionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }

    RefundId:
      name: refundId
      in: path
      required: true
      schema: { type: string, minLength: 1 }

    CommissionId:
      name: commissionId
      in: path
      required: true
      schema: { type: string }

    PartnerId:
      name: partnerId
      in: path
      required: true
      schema: { type: string }

    ActorType:
      name: actorType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PayoutActorType' }

    ActorId:
      name: actorId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }

    ProductReference:
      name: productReference
      in: path
      required: true
      schema: { type: string, minLength: 1 }

    ReservationId:
      name: reservationId
      in: path
      required: true
      schema: { type: string, pattern: '^pfr_[a-f0-9]{32}$' }

    PartnerCategory:
      name: partnerCategory
      in: path
      required: true
      schema: { type: string, minLength: 1 }

    PenaltyId:
      name: penaltyId
      in: path
      required: true
      schema: { type: string, minLength: 1 }

  responses:
    ReferenceResponse:
      description: Canonical WLT reference.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }

    Error:
      description: Governed WLT error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    CollectionInvalidRequest:
      description: Invalid request

    CollectionUnauthorized:
      description: Missing or invalid service authentication

    CollectionForbidden:
      description: Caller is not permitted to read financial custody truth

    CollectionFeatureNotEnabled:
      description: FEATURE_NOT_ENABLED unless WLT_MUTATIONS_ENABLED=true

    CollectionNotFound:
      description: Delivery collection or tenant-local payment session not found

    CollectionConflict:
      description: Invalid custody transition, replay conflict, or actor mismatch

    BadRequest:
      description: Invalid request or evidence
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    RefundUnauthorized:
      description: Missing or invalid service authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    RefundForbidden:
      description: Tenant, feature gate, or authority denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    MakerCheckerViolation:
      description: Request maker attempted to review the same refund, or feature gate denied the transition
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    RefundNotFound:
      description: Refund not found in the trusted tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    RefundConflict:
      description: Lifecycle, amount, changed-payload or in-progress idempotency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    MutationReceiptFailure:
      description: The mutation receipt could not be claimed or completed durably
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MutationReceiptError' }

    CompletionPersistenceFailure:
      description: Provider outcome or mutation replay evidence could not be persisted; automatic provider retry is forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CompletionPersistenceError' }

    ProviderFailure:
      description: Definitive provider failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    SettlementConflict:
      description: Missing policy, invalid evidence, illegal state or idempotency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    PayoutResponse:
      description: Updated canonical payout state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PayoutRequestEnvelope' }

    PayoutInvalidRequest:
      description: Invalid request.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    PayoutForbidden:
      description: Actor scope or maker-checker rule failed.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    PayoutNotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    PayoutConflict:
      description: Invalid transition, inactive destination, balance mismatch, or idempotency conflict.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    ProviderError:
      description: Provider unavailable, declined, invalid, or still ambiguous.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    CustodyInvalidRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    CustodyUnauthorized:
      description: Missing or invalid service authentication.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    CustodyForbidden:
      description: Actor or mutation gate forbids the operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    CustodyNotFound:
      description: COD record was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    CustodyConflict:
      description: State, evidence or idempotency conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    ObjectResponse:
      description: Governed WLT commercial object.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }

    ErrorResponse:
      description: Governed error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    Unauthenticated:
      description: Service authentication failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WltErrorResponse" }

    Forbidden:
      description: Caller is forbidden.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WltErrorResponse" }

    ReservationResponse:
      description: Governed promotion-funding reservation.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reservation]
            properties:
              reservation: { $ref: '#/components/schemas/PromotionFundingReservation' }

    WorkforceFinanceBadRequest:
      description: Invalid request.

    WorkforceFinanceUnauthorized:
      description: Authentication or service authorization required.

    WorkforceFinanceForbidden:
      description: Caller lacks the required financial authority.

    WorkforceFinanceNotFound:
      description: Financial record not found.

    WorkforceFinanceConflict:
      description: Idempotency or lifecycle conflict.

  schemas:
    ActorType:
      type: string
      enum: [client, partner, captain, field, system, platform]

    HealthResponse:
      type: object
      required: [service, status]
      properties:
        service: { type: string, const: wlt }
        status: { type: string }

    WalletEnvelope:
      type: object
      additionalProperties: true

    LedgerEntry:
      type: object
      required: [id, entryType, actorId, actorType, sourceType, sourceId, referenceId, referenceType, amountMinorUnits, currency, debitCredit, balanceAfter, description, createdAt]
      properties:
        id: { type: string }
        entryType: { type: string }
        actorId: { type: string }
        actorType: { type: string }
        sourceType: { type: string }
        sourceId: { type: string }
        orderId: { type: string, nullable: true }
        visitId: { type: string, nullable: true }
        storeId: { type: string, nullable: true }
        partnerId: { type: string, nullable: true }
        commissionEventId: { type: string, nullable: true }
        referenceId: { type: string }
        referenceType: { type: string }
        amountMinorUnits: { type: integer, format: int64 }
        currency: { type: string }
        debitCredit: { type: string }
        balanceAfter: { type: integer, format: int64 }
        description: { type: string }
        idempotencyKey: { type: string, nullable: true }
        createdAt: { type: string }

    LedgerEntryListResponse:
      type: object
      required: [ledgerEntries]
      properties:
        ledgerEntries:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }

    WltPaymentSession:
      type: object
      properties:
        status:
          type: string
          enum: [reference_created, pending_provider, authorization_pending, authorized, capture_pending, captured, cod_pending, cod_collected, failed, expired, provider_result_unknown]

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    PaymentStatus:
      type: string
      enum: [reference_created, pending_provider, authorization_pending, authorized, capture_pending, captured, cod_pending, cod_collected, failed, expired, provider_result_unknown]

    PaymentSession:
      type: object
      required: [id, tenantId, clientId, storeId, paymentMethod, status, providerReference, amountMinorUnits, currency, createdAt, updatedAt]
      properties:
        id: { type: string }
        checkoutIntentId: { type: [string, 'null'] }
        specialRequestId: { type: [string, 'null'] }
        subscriptionPurchaseId: { type: [string, 'null'] }
        commercialProductReference: { type: [string, 'null'] }
        tenantId: { type: string }
        clientId: { type: string }
        storeId: { type: string }
        paymentMethod: { type: string, enum: [cod, wallet, mixed, official_wallet] }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        providerReference: { type: string }
        amountMinorUnits: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        capturedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreatePaymentSessionRequest:
      type: object
      required: [tenantId, clientId, storeId, paymentMethod, amountMinorUnits, currency]
      properties:
        checkoutIntentId: { type: string }
        specialRequestId: { type: string }
        subscriptionPurchaseId: { type: string }
        commercialProductReference: { type: string }
        tenantId: { type: string }
        clientId: { type: string }
        storeId: { type: string }
        paymentMethod: { type: string, enum: [cod, wallet, mixed, official_wallet] }
        amountMinorUnits: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, default: YER }
        cartSnapshotHash: { type: string }
      oneOf:
        - required: [checkoutIntentId]
        - required: [specialRequestId]
        - required: [subscriptionPurchaseId, commercialProductReference]

    PaymentSessionResponse:
      type: object
      required: [paymentSession]
      properties:
        paymentSession: { $ref: '#/components/schemas/PaymentSession' }

    PaymentOperationResponse:
      allOf:
        - $ref: '#/components/schemas/PaymentSessionResponse'
        - type: object
          properties:
            idempotentReplay: { type: boolean }
            receiptState: { type: string }
            ledgerTransactionId: { type: string }

    ProviderWebhookRequest:
      type: object
      required: [eventId, type, tenantId, paymentSessionId, status]
      additionalProperties: false
      properties:
        eventId: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [payment.authorized, payment.captured, payment.failed, payment.expired] }
        tenantId: { type: string, minLength: 1 }
        paymentSessionId: { type: string, minLength: 1 }
        status: { type: string, enum: [authorized, captured, failed, expired] }
        providerReference: { type: string }
        occurredAt: { type: string, format: date-time }

    PaymentTimeline:
      type: object
      required: [paymentSession, operationReceipts, providerEvents, reconciliationCases]
      properties:
        paymentSession: { $ref: '#/components/schemas/PaymentSession' }
        captureLedgerTransactionId: { type: string }
        lastProviderEventId: { type: string }
        lastProviderStatus: { type: string }
        operationReceipts:
          type: array
          items: { $ref: '#/components/schemas/PaymentOperationReceipt' }
        providerEvents:
          type: array
          items: { $ref: '#/components/schemas/PaymentProviderEvent' }
        reconciliationCases:
          type: array
          items: { $ref: '#/components/schemas/PaymentReconciliationCase' }

    PaymentOperationReceipt:
      type: object
      required: [id, operation, state, responseStatus, createdAt, updatedAt]
      properties:
        id: { type: string }
        operation: { type: string, enum: [authorize, capture, provider_status_refresh] }
        state: { type: string, enum: [in_progress, completed, failed, provider_result_unknown] }
        responseStatus: { type: string }
        providerReference: { type: string }
        correlationId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }

    PaymentProviderEvent:
      type: object
      required: [providerEventId, eventType, providerStatus, processingState, signatureTime, receivedAt]
      properties:
        providerEventId: { type: string }
        eventType: { type: string }
        providerStatus: { type: string }
        providerReference: { type: string }
        processingState: { type: string, enum: [received, applied, ignored, conflict] }
        processingResult: { type: string }
        signatureTime: { type: string, format: date-time }
        occurredAt: { type: [string, 'null'], format: date-time }
        receivedAt: { type: string, format: date-time }
        processedAt: { type: [string, 'null'], format: date-time }

    PaymentReconciliationCase:
      type: object
