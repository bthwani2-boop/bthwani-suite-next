      operationId: getWltSettlementSummary
      tags: [WltSettlements]
      summary: Return the tenant-local settlement summary computed by WLT.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: Tenant-local settlement summary }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /wlt/settlements/{settlementId}:
    get:
      operationId: getWltSettlement
      tags: [WltSettlements]
      summary: Read one tenant-local settlement.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SettlementId'
      responses:
        '200': { description: Tenant-local settlement }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

