        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommissionPolicyInput' }
      responses:
        '200':
          description: Append-only commission policy version created, or original version replayed for an exact retry
        '409': { $ref: '#/components/responses/SettlementConflict' }

  /wlt/commissions:
    get:
      tags: ["wlt-commissions"]
      operationId: listWltGovernedCommissions
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
