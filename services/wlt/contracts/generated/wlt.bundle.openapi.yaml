        '403': { $ref: '#/components/responses/CollectionFeatureNotEnabled' }
        '404': { $ref: '#/components/responses/CollectionNotFound' }
        '409': { $ref: '#/components/responses/CollectionConflict' }

  /wlt/delivery-collections/{codRecordId}/remit:
    post:
      operationId: remitWltDeliveryCollection
      summary: Commit evidence-backed remittance against WLT-owned custody truth.
      tags: [WltDeliveryCollections]
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CodRecordId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemitDeliveryCollectionRequest' }
      responses:
        '200': { description: Remittance committed atomically or replayed exactly }
        '400': { $ref: '#/components/responses/CollectionInvalidRequest' }
        '401': { $ref: '#/components/responses/CollectionUnauthorized' }
        '403': { $ref: '#/components/responses/CollectionFeatureNotEnabled' }
        '404': { $ref: '#/components/responses/CollectionNotFound' }
        '409': { $ref: '#/components/responses/CollectionConflict' }

  /wlt/refunds:
    get:
      tags: [wlt-refunds]
      operationId: listWltRefunds
      summary: List tenant-scoped refunds
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/CorrelationIdOptional'
        - name: orderId
          in: query
          schema: { type: string, minLength: 1 }
        - name: clientId
          in: query
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Canonical refunds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/RefundUnauthorized' }
        '403': { $ref: '#/components/responses/RefundForbidden' }
    post:
      tags: [wlt-refunds]
      operationId: createWltRefund
      summary: Create a partial or full remaining refund request
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/CorrelationHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefundRequest' }
      responses:
        '201':
          description: Refund request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundEnvelope' }
        '200':
          description: Idempotent replay of the same request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/RefundUnauthorized' }
        '403': { $ref: '#/components/responses/RefundForbidden' }
        '409': { $ref: '#/components/responses/RefundConflict' }
        '500': { $ref: '#/components/responses/MutationReceiptFailure' }

  /wlt/refunds/{refundId}:
    get:
      tags: [wlt-refunds]
      operationId: getWltRefund
      summary: Read one tenant-scoped refund
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/RefundId'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/CorrelationIdOptional'
      responses:
        '200':
          description: Canonical refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundEnvelope' }
        '401': { $ref: '#/components/responses/RefundUnauthorized' }
        '403': { $ref: '#/components/responses/RefundForbidden' }
        '404': { $ref: '#/components/responses/RefundNotFound' }

  /wlt/refunds/{refundId}/approve:
    post:
      tags: [wlt-refunds]
      operationId: approveWltRefund
      summary: Independently approve a requested refund
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/RefundId'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/CorrelationHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Approved refund or exact idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundEnvelope' }
        '403': { $ref: '#/components/responses/MakerCheckerViolation' }
        '404': { $ref: '#/components/responses/RefundNotFound' }
        '409': { $ref: '#/components/responses/RefundConflict' }
        '500': { $ref: '#/components/responses/MutationReceiptFailure' }

  /wlt/refunds/{refundId}/reject:
    post:
      tags: [wlt-refunds]
      operationId: rejectWltRefund
      summary: Independently reject a requested refund
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/RefundId'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/CorrelationHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Rejected refund or exact idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundEnvelope' }
        '403': { $ref: '#/components/responses/MakerCheckerViolation' }
        '404': { $ref: '#/components/responses/RefundNotFound' }
        '409': { $ref: '#/components/responses/RefundConflict' }
        '500': { $ref: '#/components/responses/MutationReceiptFailure' }

  /wlt/refunds/{refundId}/complete:
    post:
      tags: [wlt-refunds]
      operationId: completeWltRefund
      summary: Claim and execute an approved refund through the provider
      description: >-
        The mutation receipt and approved-to-processing claim are committed before
        the provider call. An ambiguous provider result returns 202 only after
        provider_unknown and its reconciliation case are durably persisted.
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/RefundId'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/CorrelationHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteRequest' }
      responses:
        '200':
          description: Provider-confirmed, ledger-posted and outbox-enqueued refund or exact replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundEnvelope' }
        '202':
          description: Provider result is unknown, durably recorded and requires reconciliation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderUnknownError' }
        '403': { $ref: '#/components/responses/RefundForbidden' }
        '404': { $ref: '#/components/responses/RefundNotFound' }
        '409': { $ref: '#/components/responses/RefundConflict' }
        '500': { $ref: '#/components/responses/CompletionPersistenceFailure' }
        '502': { $ref: '#/components/responses/ProviderFailure' }

  /wlt/refunds/{refundId}/reconcile:
    post:
      tags: [wlt-refunds]
      operationId: reconcileWltRefund
      summary: Resolve a provider-unknown refund with external evidence
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/RefundId'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/CorrelationHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcileRequest' }
      responses:
        '200':
          description: Reconciled refund or exact idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/RefundForbidden' }
        '404': { $ref: '#/components/responses/RefundNotFound' }
        '409': { $ref: '#/components/responses/RefundConflict' }
        '500': { $ref: '#/components/responses/MutationReceiptFailure' }

  /wlt/refunds/{refundId}/audit:
    get:
      tags: [wlt-refunds]
      operationId: listWltRefundAudit
      summary: List append-only refund audit evidence
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/RefundId'
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/CorrelationIdOptional'
      responses:
        '200':
          description: Ordered audit events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEnvelope' }
        '401': { $ref: '#/components/responses/RefundUnauthorized' }
        '403': { $ref: '#/components/responses/RefundForbidden' }
        '404': { $ref: '#/components/responses/RefundNotFound' }

  /wlt/settlements:
    post:
      tags: ["wlt-settlements"]
      operationId: createWltEvidenceBackedSettlement
      x-bthwani-mutation-approved: true
      x-bthwani-default-enabled: false
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSettlementRequest'
      responses:
        '201':
          description: Settlement calculated by WLT from verified DSH sources and completed refunds
          content:
            application/json:
              schema:
                type: object
                required: [settlement]
                properties:
                  settlement: { $ref: '#/components/schemas/Settlement' }
        '403': { description: FEATURE_NOT_ENABLED when WLT_MUTATIONS_ENABLED is not true }
        '409': { $ref: '#/components/responses/SettlementConflict' }
    get:
      operationId: listWltSettlements
      tags: [WltSettlements]
      summary: List tenant-local settlements.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
        - name: partnerId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Tenant-local settlements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementListResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /wlt/settlements/{settlementId}/evidence:
    get:
      tags: ["wlt-settlements"]
