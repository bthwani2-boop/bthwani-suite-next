    post:
      operationId: postWltSettlement
      tags: [WltSettlements]
      summary: Post a pending tenant-local settlement and its balanced journal atomically.
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SettlementId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operatorId: { type: string, minLength: 1 }
      responses:
        '200': { description: Settlement posted or exactly replayed }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

