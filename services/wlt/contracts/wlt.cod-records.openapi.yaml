openapi: 3.1.0
info:
  title: BThwani WLT COD Record Core API
  version: 1.0.0
  description: OperatorContext-scoped COD record creation and read surface. Amount
    and currency are derived from WLT payment-session truth.
x-bthwani-owner: services/wlt
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: ENABLED
x-bthwani-runtime-dependency: true
x-bthwani-financial-owner: true
servers:
  - url: http://localhost:58083
paths:
  /wlt/cod-reservations/reserve:
    post:
      operationId: reserveWltCodCapacity
      tags: [ WltCodReservations ]
      summary: Reserve COD capacity for an order.
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/OperatorContextId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveCodCapacityRequest' }
      responses:
        '200':
          description: Reserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReserveCodCapacityResponse' }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '409': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
      security:
        - serviceBearer: []
  /wlt/cod-reservations/release:
    post:
      operationId: releaseWltCodReservation
      tags: [ WltCodReservations ]
      summary: Release COD capacity for an order.
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/OperatorContextId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseCodReservationRequest' }
      responses:
        '200':
          description: Released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseCodReservationResponse' }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '409': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
      security:
        - serviceBearer: []
  /wlt/cod-reservations/{orderId}:
    get:
      operationId: getWltCodReservation
      tags: [ WltCodReservations ]
      summary: Get COD reservation for an order.
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/OperatorContextId'
        - name: orderId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Retrieved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseCodReservationResponse' }
        '404': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
      security:
        - serviceBearer: []
  /wlt/cod-records:
    post:
      operationId: createWltCodRecord
      tags: [ WltCodRecords ]
      summary: Create or replay OperatorContext-local COD custody from WLT payment
        truth.
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/OperatorContextId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCodRecordRequest' }
      responses:
        '201': { description: OperatorContext-local COD record created }
        '200': { description: Exact replay of the existing COD record }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '403': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '409': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
      security:
        - serviceBearer: []
    get:
      operationId: listWltCodRecords
      tags: [ WltCodRecords ]
      summary: List OperatorContext-local COD records by one governed filter.
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/OperatorContextId'
        - name: captainId
          in: query
          schema: { type: string }
        - name: partnerId
          in: query
          schema: { type: string }
        - name: orderId
          in: query
          schema: { type: string }
      responses:
        '200': { description: OperatorContext-local COD records }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '401': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '403': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
      security:
        - serviceBearer: []
  /wlt/cod-records/{codRecordId}:
    get:
      operationId: getWltCodRecord
      tags: [ WltCodRecords ]
      summary: Read one OperatorContext-local COD record.
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/OperatorContextId'
        - name: codRecordId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: OperatorContext-local COD record }
        '401': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '403': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '404': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
      security:
        - serviceBearer: []
components:
  securitySchemes: {}
  schemas:
    CreateCodRecordRequest:
      type: object
      additionalProperties: false
      required: [ orderId, collectorType, collectorId, partnerId, checkoutIntentId ]
      properties:
        orderId: { type: string, minLength: 1 }
        captainId: { type: string }
        collectorType: { type: string, enum: [ captain, store_courier, partner_store ] }
        collectorId: { type: string, minLength: 1 }
        partnerId: { type: string, minLength: 1 }
        checkoutIntentId: { type: string, minLength: 1 }
    CodReservation:
      type: object
      required: [id, operatorContextId, orderId, captainId, amountMinorUnits, currency, status, idempotencyKey, createdAt, updatedAt]
      properties:
        id: { type: string }
        operatorContextId: { type: string }
        orderId: { type: string }
        captainId: { type: string }
        amountMinorUnits: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string }
        idempotencyKey: { type: string }
        releaseReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    ReserveCodCapacityRequest:
      type: object
      required: [orderId, captainId, amountMinorUnits, currency]
      properties:
        orderId: { type: string }
        captainId: { type: string }
        amountMinorUnits: { type: integer, format: int64 }
        currency: { type: string }
    ReserveCodCapacityResponse:
      type: object
      required: [codReservation, replayed]
      properties:
        codReservation: { $ref: '#/components/schemas/CodReservation' }
        replayed: { type: boolean }
    ReleaseCodReservationRequest:
      type: object
      required: [orderId, reason]
      properties:
        orderId: { type: string }
        reason: { type: string }
    ReleaseCodReservationResponse:
      type: object
      required: [codReservation]
      properties:
        codReservation: { $ref: '#/components/schemas/CodReservation' }
