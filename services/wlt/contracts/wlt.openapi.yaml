openapi: 3.1.0
info:
  title: BThwani WLT Core Service API
  version: 1.1.0
  description: >-
    Canonical WLT core contract for liveness, trusted financial references,
    actor wallets, reconciliation administration and read-only ledger
    inspection. Specialized financial journeys remain in the indexed module
    contracts. Retired runtime operations are not declared here.
x-bthwani-owner: services/wlt
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: ENABLED
x-bthwani-runtime-dependency: true
x-bthwani-contract-layout: INDEXED
x-bthwani-bundle: ./generated/wlt.bundle.openapi.yaml
x-bthwani-financial-owner: true
x-bthwani-contracts:
  common: ./wlt.common.openapi.yaml
  payments: ./wlt.payments.openapi.yaml
  deliveryCollections: ./wlt.delivery-collections.openapi.yaml
  refunds: ./wlt.refunds.openapi.yaml
  settlementsCommissions: ./wlt.settlements-commissions.openapi.yaml
  settlementOperations: ./wlt.settlement-operations.openapi.yaml
  payoutsDestinations: ./wlt.payouts-destinations.openapi.yaml
  payoutFailureBoundary: ./wlt.payout-failure-boundary.openapi.yaml
  codCustody: ./wlt.cod-custody.openapi.yaml
  codRecords: ./wlt.cod-records.openapi.yaml
  commercial: ./wlt.commercial.openapi.yaml
  commercialSummary: ./wlt.commercial-summary.openapi.yaml
  promotionFunding: ./wlt.promotion-funding.openapi.yaml
  workforceFinance: ./wlt.workforce-finance.openapi.yaml
servers:
  - url: http://localhost:58083
paths:
  /wlt/health:
    get:
      operationId: getWltHealth
      summary: Return WLT liveness state.
      tags: [WltSystem]
      responses:
        '200':
          description: WLT process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /wlt/readiness:
    get:
      operationId: getWltReadiness
      summary: Return WLT dependency readiness.
      tags: [WltSystem]
      responses:
        '200':
          description: WLT dependencies are ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/references/payment-status:
    get:
      operationId: getWltPaymentStatusRef
      summary: Return the tenant-bound payment status reference for an order.
      tags: [WltReferences]
      parameters:
        - $ref: '#/components/parameters/OrderIdQuery'
      responses:
        '200': { $ref: '#/components/responses/ReferenceResponse' }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '404': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/references/settlement-status:
    get:
      operationId: getWltSettlementStatusRef
      summary: Return the tenant-bound settlement status reference for an order.
      tags: [WltReferences]
      parameters:
        - $ref: '#/components/parameters/OrderIdQuery'
      responses:
        '200': { $ref: '#/components/responses/ReferenceResponse' }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '404': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/references/refund-status:
    get:
      operationId: getWltRefundStatusRef
      summary: Return the tenant-bound refund status reference for an order.
      tags: [WltReferences]
      parameters:
        - $ref: '#/components/parameters/OrderIdQuery'
      responses:
        '200': { $ref: '#/components/responses/ReferenceResponse' }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '404': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/references/wallet-status:
    get:
      operationId: getWltWalletStatusRef
      summary: Return the tenant-bound wallet status reference for an actor.
      tags: [WltReferences]
      parameters:
        - name: actorType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ActorType' }
        - name: actorId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/ReferenceResponse' }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '404': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/wallets/{actorType}/{actorId}:
    get:
      operationId: getWltWallet
      summary: Return the tenant-local operational wallet for an actor.
      tags: [WltWallets]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ActorTypePath'
        - $ref: '#/components/parameters/ActorIdPath'
      responses:
        '200':
          description: Tenant-local actor wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletEnvelope' }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '404': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/reconciliation-cases:
    get:
      operationId: listWltReconciliationCases
      summary: List tenant-local reconciliation cases.
      tags: [WltReconciliation]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved] }
      responses:
        '200':
          description: Tenant-local reconciliation cases.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/reconciliation-cases/{caseId}:
    get:
      operationId: getWltReconciliationCase
      summary: Read one tenant-local reconciliation case.
      tags: [WltReconciliation]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CaseId'
      responses:
        '200':
          description: Tenant-local reconciliation case.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/reconciliation-cases/{caseId}/assign:
    post:
      operationId: assignWltReconciliationCase
      summary: Assign a tenant-local reconciliation case.
      tags: [WltReconciliation]
      security: [{ serviceBearer: [] }]
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CaseId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Reconciliation case assigned }
        '403': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '409': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/reconciliation-cases/{caseId}/resolve:
    post:
      operationId: resolveWltReconciliationCase
      summary: Resolve a tenant-local reconciliation case.
      tags: [WltReconciliation]
      security: [{ serviceBearer: [] }]
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CaseId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Reconciliation case resolved }
        '403': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
        '409': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/ledger/entries:
    get:
      operationId: listWltLedgerEntries
      summary: List tenant-local immutable ledger entries.
      tags: [WltLedger]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - name: actorId
          in: query
          schema: { type: string }
        - name: actorType
          in: query
          schema: { $ref: '#/components/schemas/ActorType' }
        - name: orderId
          in: query
          schema: { type: string }
        - name: entryType
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Tenant-local immutable ledger entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEntryListResponse' }
        '400': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/ledger/entries/{entryId}:
    get:
      operationId: getWltLedgerEntry
      summary: Read one tenant-local immutable ledger entry.
      tags: [WltLedger]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - name: entryId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Tenant-local immutable ledger entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEntry' }
        '404': { $ref: './wlt.common.openapi.yaml#/components/responses/Error' }
  /wlt/ledger/financial-summary:
    get:
      operationId: getWltLedgerFinancialSummary
      summary: Return account-type-aware tenant-local financial totals.
      tags: [WltLedger]
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
      responses:
        '200': { description: Tenant-local financial summary }
components:
  securitySchemes:
    serviceBearer:
      $ref: './wlt.common.openapi.yaml#/components/securitySchemes/serviceBearer'
  parameters:
    OrderIdQuery:
      name: orderId
      in: query
      required: true
      schema: { type: string, minLength: 1 }
    ActorTypePath:
      name: actorType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ActorType' }
    ActorIdPath:
      name: actorId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    ReferenceResponse:
      description: Canonical WLT reference.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  schemas:
    ActorType:
      type: string
      enum: [client, partner, captain, field, system, platform]
    HealthResponse:
      type: object
      required: [service, status]
      properties:
        service: { type: string, const: wlt }
        status: { type: string }
    WalletEnvelope:
      type: object
      additionalProperties: true
    LedgerEntry:
      type: object
      required: [id, entryType, actorId, actorType, sourceType, sourceId, referenceId, referenceType, amountMinorUnits, currency, debitCredit, balanceAfter, description, createdAt]
      properties:
        id: { type: string }
        entryType: { type: string }
        actorId: { type: string }
        actorType: { type: string }
        sourceType: { type: string }
        sourceId: { type: string }
        orderId: { type: string, nullable: true }
        visitId: { type: string, nullable: true }
        storeId: { type: string, nullable: true }
        partnerId: { type: string, nullable: true }
        commissionEventId: { type: string, nullable: true }
        referenceId: { type: string }
        referenceType: { type: string }
        amountMinorUnits: { type: integer, format: int64 }
        currency: { type: string }
        debitCredit: { type: string }
        balanceAfter: { type: integer, format: int64 }
        description: { type: string }
        idempotencyKey: { type: string, nullable: true }
        createdAt: { type: string }
    LedgerEntryListResponse:
      type: object
      required: [ledgerEntries]
      properties:
        ledgerEntries:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }
    WltPaymentSession:
      type: object
      properties:
        status:
          type: string
          enum: [reference_created, pending_provider, authorization_pending, authorized, capture_pending, captured, cod_pending, cod_collected, failed, expired, provider_result_unknown]
