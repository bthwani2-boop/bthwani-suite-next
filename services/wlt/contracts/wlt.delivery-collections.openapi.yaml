openapi: 3.1.0
info:
  title: BThwani WLT Delivery Collection Custody API
  version: 1.1.0
  description: >-
    Fulfillment-neutral collection custody routes. WLT owns amount, currency,
    custody state, ledger linkage and reconciliation. DSH supplies only trusted
    delivery and collector identities through the authenticated tenant boundary.
x-bthwani-owner: services/wlt
x-bthwani-journey: JRN-038
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: DISABLED
x-bthwani-client-binding: MANUAL_TYPED_ADAPTER
x-bthwani-adapter-owner: services/dsh/backend/internal/wlt/client.go
x-bthwani-runtime-dependency: true
x-bthwani-financial-owner: true
servers:
  - url: http://localhost:58083
security:
  - serviceBearer: []
paths:
  /wlt/delivery-collections:
    post:
      operationId: createWltDeliveryCollectionHandoff
      summary: Derive tenant-local collection custody from WLT payment-session truth.
      tags: [WltDeliveryCollections]
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeliveryCollectionRequest' }
      responses:
        '200': { description: Delivery was prepaid and no COD custody record is applicable, or an existing record was replayed }
        '201': { description: Tenant-local COD custody record created from WLT payment truth }
        '400': { $ref: '#/components/responses/CollectionInvalidRequest' }
        '401': { $ref: '#/components/responses/CollectionUnauthorized' }
        '403': { $ref: '#/components/responses/CollectionFeatureNotEnabled' }
        '404': { $ref: '#/components/responses/CollectionNotFound' }
        '409': { $ref: '#/components/responses/CollectionConflict' }
    get:
      operationId: listWltDeliveryCollections
      summary: List tenant-local delivery collection custody records.
      tags: [WltDeliveryCollections]
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - name: captainId
          in: query
          schema: { type: string }
        - name: partnerId
          in: query
          schema: { type: string }
        - name: collectorId
          in: query
          schema: { type: string }
        - name: collectorType
          in: query
          schema: { type: string }
      responses:
        '200': { description: Delivery collection custody records }
        '400': { $ref: '#/components/responses/CollectionInvalidRequest' }
        '401': { $ref: '#/components/responses/CollectionUnauthorized' }
        '403': { $ref: '#/components/responses/CollectionForbidden' }
  /wlt/delivery-collections/{codRecordId}:
    get:
      operationId: getWltDeliveryCollection
      summary: Read one tenant-local delivery collection custody record.
      tags: [WltDeliveryCollections]
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CodRecordId'
      responses:
        '200': { description: Delivery collection custody record }
        '400': { $ref: '#/components/responses/CollectionInvalidRequest' }
        '401': { $ref: '#/components/responses/CollectionUnauthorized' }
        '403': { $ref: '#/components/responses/CollectionForbidden' }
        '404': { $ref: '#/components/responses/CollectionNotFound' }
  /wlt/delivery-collections/{codRecordId}/collect:
    post:
      operationId: collectWltDeliveryCollection
      summary: Commit evidence-backed collection against WLT-owned custody truth.
      tags: [WltDeliveryCollections]
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CodRecordId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectDeliveryCollectionRequest' }
      responses:
        '200': { description: Collection committed atomically or replayed exactly }
        '400': { $ref: '#/components/responses/CollectionInvalidRequest' }
        '401': { $ref: '#/components/responses/CollectionUnauthorized' }
        '403': { $ref: '#/components/responses/CollectionFeatureNotEnabled' }
        '404': { $ref: '#/components/responses/CollectionNotFound' }
        '409': { $ref: '#/components/responses/CollectionConflict' }
  /wlt/delivery-collections/{codRecordId}/remit:
    post:
      operationId: remitWltDeliveryCollection
      summary: Commit evidence-backed remittance against WLT-owned custody truth.
      tags: [WltDeliveryCollections]
      x-bthwani-mutation-approved: false
      x-bthwani-default-enabled: false
      parameters:
        - $ref: './wlt.common.openapi.yaml#/components/parameters/Authorization'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/ServiceCaller'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/TenantId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CodRecordId'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/IdempotencyKey'
        - $ref: './wlt.common.openapi.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemitDeliveryCollectionRequest' }
      responses:
        '200': { description: Remittance committed atomically or replayed exactly }
        '400': { $ref: '#/components/responses/CollectionInvalidRequest' }
        '401': { $ref: '#/components/responses/CollectionUnauthorized' }
        '403': { $ref: '#/components/responses/CollectionFeatureNotEnabled' }
        '404': { $ref: '#/components/responses/CollectionNotFound' }
        '409': { $ref: '#/components/responses/CollectionConflict' }
components:
  securitySchemes:
    serviceBearer:
      $ref: './wlt.common.openapi.yaml#/components/securitySchemes/serviceBearer'
  schemas:
    CollectionActorType:
      type: string
      enum: [captain, store_courier, partner_store, partner, operator]
    CreateDeliveryCollectionRequest:
      type: object
      additionalProperties: false
      required: [orderId, collectorType, collectorId, partnerId, checkoutIntentId]
      properties:
        orderId: { type: string, minLength: 1 }
        collectorType: { type: string, enum: [captain, store_courier, partner_store] }
        collectorId: { type: string, minLength: 1 }
        captainId: { type: string }
        partnerId: { type: string, minLength: 1 }
        checkoutIntentId: { type: string, minLength: 1 }
    CollectDeliveryCollectionRequest:
      type: object
      additionalProperties: false
      required: [actualAmountMinorUnits, proofReference, actorId, actorType]
      properties:
        actualAmountMinorUnits: { type: integer, format: int64, minimum: 1 }
        proofReference: { type: string, minLength: 3, maxLength: 512 }
        actorId: { type: string, minLength: 1 }
        actorType: { $ref: '#/components/schemas/CollectionActorType' }
        note: { type: string, maxLength: 4000 }
    RemitDeliveryCollectionRequest:
      type: object
      additionalProperties: false
      required: [proofReference, actorId, actorType]
      properties:
        proofReference: { type: string, minLength: 3, maxLength: 512 }
        actorId: { type: string, minLength: 1 }
        actorType: { $ref: '#/components/schemas/CollectionActorType' }
        note: { type: string, maxLength: 4000 }
  responses:
    CollectionInvalidRequest:
      description: Invalid request
    CollectionUnauthorized:
      description: Missing or invalid service authentication
    CollectionForbidden:
      description: Caller is not permitted to read financial custody truth
    CollectionFeatureNotEnabled:
      description: FEATURE_NOT_ENABLED unless WLT_MUTATIONS_ENABLED=true
    CollectionNotFound:
      description: Delivery collection or tenant-local payment session not found
    CollectionConflict:
      description: Invalid custody transition, replay conflict, or actor mismatch
