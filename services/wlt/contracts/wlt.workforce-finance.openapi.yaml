openapi: 3.1.0
info:
  title: BThwani WLT Workforce Finance API
  version: 0.1.0
  description: >-
    Financial mutations initiated by governed Workforce and DSH operational
    journeys. WLT remains the exclusive owner of commission and penalty truth.
x-bthwani-owner: services/wlt
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-runtime-dependency: true
x-bthwani-client-generation: DISABLED
servers:
  - url: http://localhost:18083
paths:
  /wlt/field-commission-category-policies/{partnerCategory}:
    put:
      operationId: upsertFieldCommissionCategoryPolicy
      tags: [ WltWorkforceFinance ]
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/PartnerCategory'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Category commission policy stored. }
        '400': { $ref: '#/components/responses/WorkforceFinanceBadRequest' }
        '401': { $ref: '#/components/responses/WorkforceFinanceUnauthorized' }
        '403': { $ref: '#/components/responses/WorkforceFinanceForbidden' }
  /wlt/field-commissions:
    post:
      operationId: createFieldCategoryCommission
      tags: [ WltWorkforceFinance ]
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: Field commission recorded idempotently. }
        '400': { $ref: '#/components/responses/WorkforceFinanceBadRequest' }
        '401': { $ref: '#/components/responses/WorkforceFinanceUnauthorized' }
        '403': { $ref: '#/components/responses/WorkforceFinanceForbidden' }
        '409': { $ref: '#/components/responses/WorkforceFinanceConflict' }
  /wlt/provider-penalties:
    post:
      operationId: createProviderPenalty
      tags: [ WltWorkforceFinance ]
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ incidentId, providerActorId, providerActorType, policyId, reason, postedByActorId ]
              properties:
                incidentId: { type: string, minLength: 1 }
                providerActorId: { type: string, minLength: 1 }
                providerActorType: { type: string, enum: [ captain, field ] }
                policyId: { type: string, minLength: 1 }
                reason: { type: string, minLength: 3 }
                postedByActorId: { type: string, minLength: 1 }
      responses:
        '201': { description: Provider penalty ledger effect recorded. }
        '400': { $ref: '#/components/responses/WorkforceFinanceBadRequest' }
        '401': { $ref: '#/components/responses/WorkforceFinanceUnauthorized' }
        '403': { $ref: '#/components/responses/WorkforceFinanceForbidden' }
        '409': { $ref: '#/components/responses/WorkforceFinanceConflict' }
  /wlt/provider-penalty-policies/{policyId}:
    put:
      operationId: upsertProviderPenaltyPolicy
      tags: [ WltWorkforceFinance ]
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ expectedVersion, providerActorType, amountMinorUnits, currency, changeReason, updatedByActorId ]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 0 }
                providerActorType: { type: string, enum: [ captain, field, any ] }
                amountMinorUnits: { type: integer, format: int64, minimum: 1 }
                currency: { type: string, minLength: 3, maxLength: 3 }
                enabled: { type: boolean }
                changeReason: { type: string, minLength: 3 }
                updatedByActorId: { type: string, minLength: 1 }
      responses:
        '200': { description: WLT provider penalty policy stored. }
        '400': { $ref: '#/components/responses/WorkforceFinanceBadRequest' }
        '401': { $ref: '#/components/responses/WorkforceFinanceUnauthorized' }
        '403': { $ref: '#/components/responses/WorkforceFinanceForbidden' }
        '409': { $ref: '#/components/responses/WorkforceFinanceConflict' }
  /wlt/provider-penalties/reverse/{penaltyId}:
    post:
      operationId: reverseProviderPenalty
      tags: [ WltWorkforceFinance ]
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/PenaltyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ reason, reversedByActorId ]
              properties:
                reason: { type: string, minLength: 3 }
                reversedByActorId: { type: string, minLength: 1 }
      responses:
        '200': { description: Provider penalty reversed through a compensating ledger entry. }
        '400': { $ref: '#/components/responses/WorkforceFinanceBadRequest' }
        '401': { $ref: '#/components/responses/WorkforceFinanceUnauthorized' }
        '403': { $ref: '#/components/responses/WorkforceFinanceForbidden' }
        '404': { $ref: '#/components/responses/WorkforceFinanceNotFound' }
        '409': { $ref: '#/components/responses/WorkforceFinanceConflict' }
  /wlt/provider-penalties/by-incident/{incidentId}:
    get:
      operationId: getProviderPenaltyByIncident
      tags: [ WltWorkforceFinance ]
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: Authoritative provider penalty readback. }
        '401': { $ref: '#/components/responses/WorkforceFinanceUnauthorized' }
        '403': { $ref: '#/components/responses/WorkforceFinanceForbidden' }
        '404': { $ref: '#/components/responses/WorkforceFinanceNotFound' }
  /wlt/provider-penalties/{penaltyId}:
    get:
      operationId: getProviderPenalty
      tags: [ WltWorkforceFinance ]
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/PenaltyId'
      responses:
        '200': { description: Authoritative provider penalty readback. }
        '401': { $ref: '#/components/responses/WorkforceFinanceUnauthorized' }
        '403': { $ref: '#/components/responses/WorkforceFinanceForbidden' }
        '404': { $ref: '#/components/responses/WorkforceFinanceNotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    PartnerCategory:
      name: partnerCategory
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    PenaltyId:
      name: penaltyId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    WorkforceFinanceBadRequest:
      description: Invalid request.
    WorkforceFinanceUnauthorized:
      description: Authentication or service authorization required.
    WorkforceFinanceForbidden:
      description: Caller lacks the required financial authority.
    WorkforceFinanceNotFound:
      description: Financial record not found.
    WorkforceFinanceConflict:
      description: Idempotency or lifecycle conflict.
