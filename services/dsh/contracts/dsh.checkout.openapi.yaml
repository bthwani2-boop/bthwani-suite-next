openapi: 3.1.0
info:
  title: DSH Checkout and WLT Handoff
  version: 1.1.0
  description: Checkout path shard. Canonical request, response and status schemas
    are owned by components/schemas/checkout.schemas.yaml through dsh.openapi.yaml.
x-bthwani-owner: services/dsh
x-bthwani-capability: checkout
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-truth-boundary:
  dsh: checkout intent, snapshots, operational projection
  wlt: payment session, authorization, capture, refund, ledger
paths:
  /dsh/client/checkout-intents:
    post:
      tags:
      - dsh-client
      operationId: createDshCheckoutIntent
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./dsh.openapi.yaml#/components/schemas/DshCreateCheckoutIntentRequest
      responses:
        '200':
          $ref: '#/components/responses/CheckoutIntentResponse'
        '201':
          $ref: '#/components/responses/CheckoutIntentResponse'
        '202':
          $ref: '#/components/responses/CheckoutIntentResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /dsh/client/checkout-intents/{intentId}:
    get:
      tags:
      - dsh-client
      operationId: getDshCheckoutIntent
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IntentId'
      responses:
        '200':
          $ref: '#/components/responses/CheckoutIntentResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /dsh/client/checkout-intents/{intentId}/cancel:
    post:
      tags:
      - dsh-client
      operationId: cancelDshCheckoutIntent
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IntentId'
      responses:
        '200':
          $ref: '#/components/responses/CheckoutIntentResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /dsh/operator/checkout-intents:
    get:
      tags:
      - dsh-operator
      operationId: listOperatorCheckoutIntents
      security:
      - bearerAuth: []
      parameters:
      - name: state
        in: query
        schema:
          $ref: ./dsh.openapi.yaml#/components/schemas/DshCheckoutIntentState
      responses:
        '200':
          description: Operator-context-visible operational checkout projections.
          content:
            application/json:
              schema:
                $ref: ./dsh.openapi.yaml#/components/schemas/DshOperatorCheckoutIntentsResponse
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /dsh/operator/checkout-intents/{intentId}/reconcile:
    post:
      tags:
      - dsh-operator
      operationId: reconcileDshCheckoutIntent
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IntentId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          $ref: '#/components/responses/CheckoutIntentResponse'
        '202':
          $ref: '#/components/responses/CheckoutIntentResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /dsh/internal/wlt/payment-session-events:
    post:
      tags:
      - dsh-internal
      operationId: reportWltPaymentSessionEvent
      security:
      - serviceToken: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: X-Service-Caller
        in: header
        required: true
        schema:
          type: string
          enum:
          - wlt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./dsh.openapi.yaml#/components/schemas/DshWltPaymentSessionEvent
      responses:
        '200':
          description: Event receipt and atomically updated DSH projection.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required: [intent, eventReference, replayed]
                  properties:
                    intent:
                      $ref: ./dsh.openapi.yaml#/components/schemas/DshCheckoutIntent
                    eventReference: { type: string }
                    replayed: { type: boolean }
                - type: object
                  additionalProperties: false
                  required: [specialRequest, eventReference, replayed]
                  properties:
                    specialRequest:
                      $ref: ./dsh.openapi.yaml#/components/schemas/DshSpecialRequestResponse
                    eventReference: { type: string }
                    replayed: { type: boolean }
        '409':
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    serviceToken:
      type: apiKey
      in: header
      name: Authorization
  parameters:
    IntentId:
      name: intentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
  responses:
    CheckoutIntentResponse:
      description: Canonical DSH checkout projection.
      content:
        application/json:
          schema:
            $ref: ./dsh.openapi.yaml#/components/schemas/DshCheckoutIntentResponse
    ErrorResponse:
      description: Governed error envelope.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - error
            properties:
              error:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
