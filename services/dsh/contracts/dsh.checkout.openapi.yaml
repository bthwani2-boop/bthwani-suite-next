openapi: 3.1.0
info:
  title: DSH Checkout and WLT Handoff
  version: 1.1.0
  description: Checkout path shard. Canonical request, response and status schemas
    are owned by components/schemas/checkout.schemas.yaml through dsh.openapi.yaml.
x-bthwani-owner: services/dsh
x-bthwani-capability: checkout
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-truth-boundary:
  dsh: checkout intent, snapshots, operational projection
  wlt: payment session, authorization, capture, refund, ledger
paths:
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    serviceToken:
      type: apiKey
      in: header
      name: Authorization
  parameters:
    IntentId:
      name: intentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
  responses:
    CheckoutIntentResponse:
      description: Canonical DSH checkout projection.
      content:
        application/json:
          schema:
            $ref: ./dsh.openapi.yaml#/components/schemas/DshCheckoutIntentResponse
    ErrorResponse:
      description: Governed error envelope.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - error
            properties:
              error:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
