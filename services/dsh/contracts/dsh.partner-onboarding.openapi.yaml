components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PartnerId:
      name: partnerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DocumentId:
      name: docId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ExpectedVersion:
      name: version
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    PartnerCreationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
      description: Retry identity scoped to the authenticated actor and trusted OperatorContext.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
      description: Omission is accepted only where the server derives a deterministic
        key from the versioned command.
    PartnerFleetIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 240
      description: Retry identity for one authenticated partner fleet mutation.
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
  schemas:
    PartnerFleetIssueRequest:
      type: object
      additionalProperties: false
      properties:
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 48
          default: 24
    PartnerFleetRevokeRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
    PartnerFleetConnectionCode:
      type: object
      additionalProperties: false
      required: [id, storeId, teamMemberId, codeLast4, status, expiresAt, createdByActorId, version, createdAt, updatedAt]
      properties:
        id: { type: string, minLength: 1 }
        storeId: { type: string, minLength: 1 }
        teamMemberId: { type: string, minLength: 1 }
        codeLast4: { type: string, minLength: 4, maxLength: 4 }
        status: { type: string, enum: [pending, redeemed, revoked, expired] }
        expiresAt: { type: string, minLength: 1 }
        createdByActorId: { type: string, minLength: 1 }
        redeemedByCaptainActorId: { type: string, minLength: 1 }
        redeemedAt: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, minLength: 1 }
        updatedAt: { type: string, minLength: 1 }
    PartnerFleetIssuedConnection:
      type: object
      additionalProperties: false
      required: [connection, code]
      properties:
        connection: { $ref: '#/components/schemas/PartnerFleetConnectionCode' }
        code:
          type: string
          minLength: 8
          maxLength: 16
          pattern: '^[A-Z0-9-]+$'
    PartnerFleetIssueResponse:
      type: object
      additionalProperties: false
      required: [issued]
      properties:
        issued: { $ref: '#/components/schemas/PartnerFleetIssuedConnection' }
    PartnerFleetConnectionResponse:
      type: object
      additionalProperties: false
      required: [connection]
      properties:
        connection: { $ref: '#/components/schemas/PartnerFleetConnectionCode' }
    PartnerFleetConnectionListResponse:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          items: { $ref: '#/components/schemas/PartnerFleetConnectionCode' }
    ActivationStatus:
      type: string
      enum:
      - draft
      - submitted
      - field_visit_scheduled
      - field_visit_completed
      - documents_missing
      - documents_uploaded
      - documents_verified
      - catalog_not_ready
      - catalog_ready
      - delivery_modes_not_ready
      - delivery_modes_ready
      - ops_review
      - ops_approved
      - ops_rejected
      - partner_active
      - partner_terminated
      - client_visible
      - client_hidden
    PartnerCreateRequest:
      type: object
      additionalProperties: false
      required:
      - legalNameAr
      - displayName
      - legalIdentityType
      - legalIdentityNumber
      - primaryPhone
      properties:
        legalNameAr:
          type: string
          minLength: 1
        legalNameEn:
          type: string
        displayName:
          type: string
          minLength: 1
        legalIdentityType:
          type: string
          enum:
          - commercial_register
          - national_id
          - freelancer_certificate
        legalIdentityNumber:
          type: string
          minLength: 1
        ownerActorId:
          type: string
        workforcePersonId:
          type: string
        primaryPhone:
          type: string
          minLength: 8
          maxLength: 20
        secondaryPhone:
          type: string
          maxLength: 20
        email:
          type: string
        category:
          type: string
          enum:
          - restaurant
          - grocery
          - pharmacy
          - bakery
          - default
        notes:
          type: string
    PartnerCreationResult:
      type: object
      required:
      - id
      - legalNameAr
      - displayName
      - legalIdentityType
      - legalIdentityNumber
      - primaryPhone
      - category
      - activationStatus
      - createdByActorId
      - createdBySurface
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        legalNameAr:
          type: string
        legalNameEn:
          type: string
        displayName:
          type: string
        legalIdentityType:
          type: string
        legalIdentityNumber:
          type: string
        ownerActorId:
          type: string
        workforcePersonId:
          type: string
        onboardingCaseStatus:
          type: string
        primaryPhone:
          type: string
        secondaryPhone:
          type: string
        email:
          type: string
        category:
          type: string
        activationStatus:
          $ref: '#/components/schemas/ActivationStatus'
        createdByActorId:
          type: string
        createdBySurface:
          type: string
        notes:
          type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PartnerState:
      type: object
      required:
      - id
      - displayName
      - activationStatus
      - version
      - allowedActions
      - allowedTransitions
      properties:
        id:
          type: string
        legalNameAr:
          type: string
        legalNameEn:
          type: string
        displayName:
          type: string
        ownerActorId:
          type: string
        workforcePersonId:
          type: string
        onboardingCaseStatus:
          type: string
        primaryPhone:
          type: string
        category:
          type: string
        activationStatus:
          $ref: '#/components/schemas/ActivationStatus'
        payoutDestinationId:
          type: string
          description: WLT reference only.
        destinationMethod:
          type: string
        maskedDestinationReference:
          type: string
        destinationVerificationStatus:
          type: string
          enum: [ unverified, verified, rejected ]
        version:
          type: integer
          minimum: 1
        allowedActions:
          type: array
          items:
            type: string
        allowedTransitions:
          type: array
          items:
            $ref: '#/components/schemas/ActivationStatus'
    PartnerUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
        ownerActorId:
          type: string
        workforcePersonId:
          type: string
        primaryPhone:
          type: string
        secondaryPhone:
          type: string
        email:
          type: string
        notes:
          type: string
        beneficiaryName:
          type: string
        bankName:
          type: string
        bankBranch:
          type: string
        accountNumber:
          type: string
          writeOnly: true
        iban:
          type: string
          writeOnly: true
        payoutMobileNumber:
          type: string
          writeOnly: true
        settlementPreference:
          type: string
          enum:
          - bank_transfer
          - mobile_wallet
          - manual
        bankAccountHolderMatchesOwner:
          type: boolean
        bankNotes:
          type: string
    PartnerTransitionRequest:
      type: object
      additionalProperties: false
      required:
      - toStatus
      properties:
        toStatus:
          $ref: '#/components/schemas/ActivationStatus'
        reason:
          type: string
          maxLength: 500
      allOf:
      - if:
          properties:
            toStatus:
              enum:
              - ops_approved
              - ops_rejected
               - partner_terminated
          required:
          - toStatus
        then:
          required:
          - reason
          properties:
            reason:
              type: string
              minLength: 1
              maxLength: 500
    PartnerTransitionResponse:
      type: object
      required:
      - partner
      - event
      properties:
        partner:
          $ref: '#/components/schemas/PartnerState'
        event:
          $ref: '#/components/schemas/ActivationEvent'
    ActivationEvent:
      type: object
      required:
      - id
      - partnerId
      - fromStatus
      - toStatus
      - actorId
      - actorSurface
      - reason
      - createdAt
      properties:
        id:
          type: string
        partnerId:
          type: string
        fromStatus:
          oneOf:
          - $ref: '#/components/schemas/ActivationStatus'
          - type: string
            const: none
          description: none is used only by the immutable Partner creation event.
        toStatus:
          $ref: '#/components/schemas/ActivationStatus'
        actorId:
          type: string
        actorSurface:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
    DocumentReviewRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
          - needs_resubmit
        reason:
          type: string
          minLength: 1
          maxLength: 500
    DocumentReviewResponse:
      type: object
      required:
      - document
      - review
      properties:
        document:
          type: object
          additionalProperties: true
        review:
          type: object
          required:
          - id
          - documentId
          - partnerId
          - reviewedByActorId
          - decision
          - reason
          - createdAt
          properties:
            id:
              type: string
            documentId:
              type: string
            partnerId:
              type: string
            reviewedByActorId:
              type: string
            decision:
              type: string
            reason:
              type: string
            correlationId:
              type: string
            createdAt:
              type: string
              format: date-time
    LinkedStore:
      type: object
      required:
      - storeId
      - displayName
      properties:
        storeId:
          type: string
        displayName:
          type: string
        status:
          type: string
        isVisible:
          type: boolean
        partnerReadiness:
          type: string
        publicationDecision:
          type: string
          enum: [PUBLISHED, BLOCKED]
        blockingReasons:
          type: array
          items:
            type: string
    FieldVisitRequest:
      type: object
      additionalProperties: false
      properties:
        storeId:
          type: string
        visitNotes:
          type: string
        locationLatitude:
          type: number
          minimum: -90
          maximum: 90
        locationLongitude:
          type: number
          minimum: -180
          maximum: 180
        evidenceMediaRefs:
          type: array
          items:
            type: string
      anyOf:
      - required:
        - visitNotes
      - required:
        - locationLatitude
        - locationLongitude
      - required:
        - evidenceMediaRefs
    FieldVisit:
      type: object
      required:
      - id
      - partnerId
      - storeId
      - fieldActorId
      - visitStatus
      - createdAt
      properties:
        id:
          type: string
        partnerId:
          type: string
        storeId:
          type: string
        fieldActorId:
          type: string
        visitStatus:
          type: string
        visitNotes:
          type: string
        evidenceMediaRefs:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    Readiness:
      type: object
      required:
      - ready
      - missingRequirements
      - currentStatus
      properties:
        ready:
          type: boolean
        missingRequirements:
          type: array
          items:
            type: string
        currentStatus:
          $ref: '#/components/schemas/ActivationStatus'
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    InvalidRequest:
      description: Request validation failed or Idempotency-Key is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DecisionReasonRequired:
      description: Approval, rejection, deactivation, and evidence review require
        an auditable reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IndependentReviewRequired:
      description: The creator or evidence uploader cannot approve the same owned
        record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Actor is not authorized for this partner or surface.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Partner, document, or store was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Version conflict, duplicate legal identity or primary phone, or
        idempotency key reuse with another payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StoreOwnershipConflict:
      description: Store already belongs to another partner.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ReadinessFailed:
      description: Required onboarding evidence or publication gate is incomplete.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VersionRequired:
      description: A positive expected version is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WltUnavailable:
      description: The WLT payout owner is unavailable or rejected the handoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
