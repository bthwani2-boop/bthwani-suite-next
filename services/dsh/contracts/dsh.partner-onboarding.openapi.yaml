openapi: 3.1.0
x-bthwani-owner: services/dsh
x-bthwani-contract-state: CONTRACT_ACTIVE
info:
  title: BThwani DSH Partner Onboarding API
  version: 1.2.0
  description: Governed contract for retry-safe partner creation, independent evidence
    review, audited lifecycle decisions, first-store ownership, and synchronized partner
    readback.
servers:
- url: http://localhost:18080
paths:
  /dsh/operator/partners/{partnerId}/stores:
    get:
      operationId: listDshPartnerStores
      summary: List stores linked to a partner.
      tags:
      - dsh-operator
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PartnerId'
      responses:
        '200':
          description: Partner stores.
          content:
            application/json:
              schema:
                $ref: ./dsh.openapi.yaml#/components/schemas/DshPartnerStoresListResponse
        '401':
          $ref: ./dsh.openapi.yaml#/components/responses/Unauthenticated
        '404':
          $ref: ./dsh.openapi.yaml#/components/responses/NotFound
    post:
      tags:
      - dsh-operator
      operationId: linkDshPartnerStore
      summary: Link an unowned store to a partner
      parameters:
      - $ref: '#/components/parameters/PartnerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - storeId
              properties:
                storeId:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Store ownership is linked or the existing same ownership is
            returned.
          content:
            application/json:
              schema:
                type: object
                required:
                - stores
                - total
                properties:
                  stores:
                    type: array
                    items:
                      $ref: '#/components/schemas/LinkedStore'
                  total:
                    type: integer
                    minimum: 0
        '409':
          $ref: '#/components/responses/StoreOwnershipConflict'
      security:
      - bearerAuth: []
