openapi: 3.1.0
info:
  title: BThwani DSH Catalog Readback API
  version: 1.1.0
  description: >-
    Governed readback contract for one sovereign master product and for product
    proposals submitted by partner and field surfaces. Actor and store ownership
    are resolved from authenticated context and cannot be supplied as arbitrary
    trust inputs.

x-bthwani-owner: services/dsh
x-bthwani-parent-contract: contracts/dsh.catalog.openapi.yaml
x-bthwani-contract-role: executable-fragment
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: DISABLED
x-bthwani-client-binding: MANUAL_TYPED_ADAPTER
x-bthwani-adapter-owner: frontend/shared/catalog
x-bthwani-runtime-dependency: true

# The three readback operations this fragment originally owned (operator
# master-product detail, partner and field product-proposal listing) are now
# declared directly in dsh.catalog.openapi.yaml, which dsh.openapi.yaml's
# MODULAR entry actually composes. This file is kept registered (its
# x-bthwani-owner/parent-contract metadata and the manual typed adapter at
# frontend/shared/catalog still reference it) but carries no path content of
# its own to avoid a duplicate-operation violation against the live source.
paths: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
