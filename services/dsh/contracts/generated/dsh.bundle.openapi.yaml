                  type: integer
                  minimum: 1
                status:
                  type: string
                  enum:
                    - inbound
                    - review
                    - marketing-ready
                    - published
                    - paused
                    - rejected
                title:
                  type: string
                  minLength: 1
                valueLabel:
                  type: string
                  minLength: 1
                eligibility:
                  type: string
                  enum:
                    - all
                    - client
                activeFromDate:
                  type: string
                  format: date
                activeToDate:
                  type: string
                  format: date
                rejectionReason:
                  type: string
                marginRiskNote:
                  type: string
                couponId:
                  type: string
