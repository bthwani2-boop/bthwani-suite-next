    get:
      tags:
        - operator-admin
      operationId: listDshAdministrationSupportSessionRequests
      description: Lists governed support-session requests without exposing issued bearer tokens.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - approved
              - rejected
              - issued
              - revoked
              - expired
      responses:
        "200":
          description: Support-session request queue.
          content:
            application/json:
              schema:
                type: object
                required:
                  - requests
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "400":
          description: Invalid status filter.
        "401":
          description: Authentication required.
        "403":
          description: Administration read permission required.
    post:
      tags:
        - operator-admin
      operationId: createDshAdministrationSupportSessionRequest
      description: Creates a pending support-session request; issuance requires an independent checker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - targetActorId
                - reason
                - durationMinutes
              properties:
                targetActorId:
                  type: string
                  minLength: 1
                reason:
                  type: string
                  minLength: 5
                  maxLength: 1000
                durationMinutes:
                  type: integer
                  minimum: 1
                  maximum: 120
      responses:
        "202":
          description: Pending support-session request created.
        "400":
          description: Invalid request.
        "401":
          description: Authentication required.
        "403":
          description: Administration manage permission required.
        "409":
          description: Equivalent request is active or source state changed.
        "503":
          description: Identity support-session integration is not configured.
  /operator/admin/support-sessions/{requestId}/review:
    post:
      tags:
        - operator-admin
      operationId: reviewDshAdministrationSupportSessionRequest
      description: Independently approves or rejects a pending support-session request.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - decision
                - expectedVersion
              properties:
                decision:
                  type: string
                  enum:
                    - approved
                    - rejected
                reviewNote:
                  type: string
                  maxLength: 1000
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
