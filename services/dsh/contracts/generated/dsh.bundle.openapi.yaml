  /dsh/field/partners/{partnerId}/stores/{storeId}/assortment/batch:
    post:
      operationId: fieldUpsertStoreAssortmentBatch
      summary: Link up to 100 approved central products to a field-onboarded partner store in one governed request.
      tags:
        - CentralCatalog
      security:
        - bearerAuth: []
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - masterProductId
                      - unitPrice
                      - currency
                      - available
                      - stockStatus
                      - localNote
                      - publicationStatus
                    properties:
                      masterProductId:
                        type: string
                        minLength: 1
                      unitPrice:
                        type: number
                        minimum: 0
                      currency:
                        type: string
                        minLength: 1
                      available:
                        type: boolean
                      stockStatus:
                        type: string
                        enum:
                          - in_stock
                          - low_stock
                          - out_of_stock
                      localNote:
                        type: string
                      customImageObjectKey:
                        type:
                          - string
                          - "null"
                      publicationStatus:
                        type: string
                        enum:
                          - draft
                          - submitted
                      expectedVersion:
                        type: integer
                        minimum: 1
      responses:
        "200":
          description: Per-item batch result. Successful rows remain committed when another row fails validation or OCC.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - results
                  - succeeded
                  - failed
                properties:
                  succeeded:
                    type: integer
                    minimum: 0
                  failed:
                    type: integer
                    minimum: 0
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - index
                        - masterProductId
                        - status
                      properties:
                        index:
                          type: integer
                          minimum: 0
                        masterProductId:
                          type: string
                        status:
                          type: string
                          enum:
                            - saved
                            - failed
                        assortment:
                          type: object
                          additionalProperties: true
                        code:
                          type: string
                        message:
                          type: string
                        currentVersion:
                          type: integer
                          minimum: 1
                        expectedVersion:
                          type: integer
                          minimum: 1
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
