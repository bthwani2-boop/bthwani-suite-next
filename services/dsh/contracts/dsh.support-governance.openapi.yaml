openapi: 3.1.0
x-bthwani-owner: services/dsh
info:
  title: DSH Governed Support API
  version: 1.0.0
  description: Owner-scoped client support and permission-scoped operator support,
    messages, state transitions, and audit readback.
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-runtime-dependency: true
x-bthwani-generation: DISABLED
x-bthwani-client-binding: MANUAL_TYPED_ADAPTER
