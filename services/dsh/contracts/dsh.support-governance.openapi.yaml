components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
  schemas:
    TicketStatus:
      type: string
      enum:
      - open
      - in_review
      - pending_user
      - resolved
      - closed
    TicketPriority:
      type: string
      enum:
      - low
      - normal
      - high
      - urgent
    TicketCategory:
      type: string
      enum:
      - order_issue
      - delivery_issue
      - store_quality
      - payment_reference
      - account_access
      - app_bug
      - other
    CreateTicketInput:
      type: object
      required:
      - subject
      - description
      - category
      properties:
        storeId:
          type: string
        orderId:
          type: string
        subject:
          type: string
          minLength: 3
          maxLength: 160
        description:
          type: string
          minLength: 5
          maxLength: 4000
        category:
          $ref: '#/components/schemas/TicketCategory'
        priority:
          $ref: '#/components/schemas/TicketPriority'
    AddMessageInput:
      type: object
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
        isInternal:
          type: boolean
          default: false
    UpdateTicketInput:
      type: object
      required:
      - status
      properties:
        expectedStatus:
          $ref: '#/components/schemas/TicketStatus'
        status:
          $ref: '#/components/schemas/TicketStatus'
        assignedTo:
          type: string
    Ticket:
      type: object
      required:
      - id
      - reporterId
      - reporterRole
      - subject
      - description
      - category
      - priority
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        storeId:
          type: string
        reporterId:
          type: string
        reporterRole:
          type: string
        subject:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/TicketCategory'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        status:
          $ref: '#/components/schemas/TicketStatus'
        assignedTo:
          type: string
        orderId:
          type: string
        resolvedAt:
          type:
          - string
          - 'null'
          format: date-time
        closedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Message:
      type: object
      required:
      - id
      - ticketId
      - senderId
      - senderRole
      - body
      - isInternal
      - createdAt
      properties:
        id:
          type: string
        ticketId:
          type: string
        senderId:
          type: string
        senderRole:
          type: string
        body:
          type: string
        isInternal:
          type: boolean
        createdAt:
          type: string
          format: date-time
    TicketEvent:
      type: object
      required:
      - id
      - ticketId
      - reporterId
      - actorId
      - actorRole
      - eventType
      - createdAt
      properties:
        id:
          type: string
        ticketId:
          type: string
        reporterId:
          type: string
        actorId:
          type: string
        actorRole:
          type: string
        eventType:
          type: string
          enum:
          - created
          - message_added
          - status_changed
          - escalated
          - closed
        createdAt:
          type: string
          format: date-time
  responses:
    Ticket:
      description: Support ticket.
      content:
        application/json:
          schema:
            type: object
            required:
            - ticket
            properties:
              ticket:
                $ref: '#/components/schemas/Ticket'
    TicketList:
      description: Support tickets.
      content:
        application/json:
          schema:
            type: object
            required:
            - tickets
            properties:
              tickets:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
    Message:
      description: Support message.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              message:
                $ref: '#/components/schemas/Message'
    MessageList:
      description: Support messages.
      content:
        application/json:
          schema:
            type: object
            required:
            - messages
            properties:
              messages:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
    Error:
      description: Governed error response.
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
