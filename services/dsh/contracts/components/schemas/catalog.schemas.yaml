# BThwani DSH OpenAPI schemas module: catalog.
# Source of truth. Referenced by ../dsh.openapi.yaml; do not add an openapi root here.

DshStoreCategory:
  type: string
  description: Sovereign central catalog domain identifier assigned to the store.
  pattern: ^domain-[a-z0-9-]+$

DshCatalogAsset:
  $ref: "../../dsh.catalog.openapi.yaml#/components/schemas/Asset"

DshCatalogAssetListResponse:
  type: object
  required: [assets, total, limit, offset]
  properties:
    assets:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshCatalogAsset" }
    total: { type: integer }
    limit: { type: integer }
    offset: { type: integer }

MasterProductSummary:
  type: object
  required: [id, domainId, canonicalNameAr, canonicalNameEn, brand, unit, measurementType, approvalStatus, isActive, updatedAt, version]
  properties:
    id: { type: string }
    domainId: { type: string }
    categoryNodeId: { type: [string, "null"] }
    canonicalNameAr: { type: string }
    canonicalNameEn: { type: string }
    brand: { type: string }
    barcode: { type: [string, "null"] }
    sku: { type: [string, "null"] }
    unit: { type: string }
    measurementType: { type: string }
    approvalStatus: { type: string }
    isActive: { type: boolean }
    effectiveImage: { type: [string, "null"] }
    thumbnailUrl: { type: [string, "null"] }
    imageAltAr: { type: [string, "null"] }
    imageStatus: { type: string }
    updatedAt: { type: string, format: date-time }
    version: { type: integer }

DshMasterProductListResponse:
  type: object
  required: [masterProducts, total, limit, offset]
  properties:
    masterProducts:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/MasterProductSummary" }
    total: { type: integer }
    limit: { type: integer }
    offset: { type: integer }

DshProductProposalListResponse:
  type: object
  required: [proposals, total, limit, offset]
  properties:
    proposals:
      type: array
      items: { $ref: "../../dsh.catalog.openapi.yaml#/components/schemas/Proposal" }
    total: { type: integer }
    limit: { type: integer }
    offset: { type: integer }

DshClientCatalogProduct:
  type: object
  required: [id, domainId, canonicalNameAr, canonicalNameEn, brand, unit, measurementType, approvalStatus, isActive, unitPrice, currency, stockStatus, imageObjectKey]
  properties:
    id: { type: string }
    domainId: { type: string }
    categoryNodeId: { type: ["string", "null"] }
    canonicalNameAr: { type: string }
    canonicalNameEn: { type: string }
    brand: { type: string }
    barcode: { type: ["string", "null"] }
    gtin: { type: ["string", "null"] }
    sku: { type: ["string", "null"] }
    unit: { type: string }
    measurementType: { type: string }
    canonicalImageObjectKey: { type: ["string", "null"] }
    approvalStatus: { type: string, enum: [approved] }
    isActive: { type: boolean }
    unitPrice: { type: number, format: double, minimum: 0 }
    currency: { type: string }
    stockStatus: { type: string, enum: [in_stock, low_stock, out_of_stock] }
    imageObjectKey: { type: string, deprecated: true, description: "Deprecated: use effectiveImage instead." }
    effectiveImage:
      type: [object, 'null']
      description: >
        DAM-computed effective product image. Priority: approved store-assortment
        partner_custom_product_image (when policy allows) > approved master-product
        canonical_product_image > null.
      properties:
        url: { type: string }
        altAr: { type: string }
        source: { type: string, enum: [store_custom, canonical] }

DshStoreAssortment:
  type: object
  required: [id, version, storeId, masterProductId, unitPrice, currency, available, stockStatus, localNote, customImageObjectKey, publicationStatus, submittedBy, approvedBy, createdAt, updatedAt]
  properties:
    id: { type: string }
    version: { type: integer, minimum: 1 }
    storeId: { type: string }
    masterProductId: { type: string }
    unitPrice: { type: number, format: double, minimum: 0, description: Compatibility projection of the canonical price resource. }
    currency: { type: string, description: Compatibility projection of the canonical price resource. }
    available: { type: boolean, description: Compatibility projection of the canonical inventory resource. }
    stockStatus: { type: string, enum: [in_stock, low_stock, out_of_stock], description: Compatibility projection of the canonical inventory resource. }
    localNote: { type: string }
    customImageObjectKey: { type: [string, "null"] }
    publicationStatus: { type: string, enum: [draft, submitted, approved, client_visible, rejected, hidden] }
    submittedBy: { type: string }
    approvedBy: { type: string }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }

DshStoreAssortmentInventory:
  type: object
  required: [storeAssortmentId, policyType, quantity, reservedQuantity, minOrderQuantity, maxOrderQuantity, stepQuantity, version, updatedAt]
  properties:
    storeAssortmentId: { type: string }
    policyType: { type: string, enum: [signal, quantity, infinite] }
    quantity: { type: integer, minimum: 0 }
    reservedQuantity: { type: integer, minimum: 0 }
    minOrderQuantity: { type: integer, minimum: 1 }
    maxOrderQuantity: { type: integer, minimum: 1 }
    stepQuantity: { type: integer, minimum: 1 }
    version: { type: integer, minimum: 1 }
    updatedAt: { type: string, format: date-time }

DshStoreAssortmentPrice:
  type: object
  required: [id, storeAssortmentId, amountMinor, currency, prepTimeMin, prepTimeMax, effectiveFrom, effectiveUntil, version]
  properties:
    id: { type: string }
    storeAssortmentId: { type: string }
    amountMinor: { type: integer, minimum: 0 }
    currency: { type: string, minLength: 3, maxLength: 3 }
    prepTimeMin: { type: integer, minimum: 0 }
    prepTimeMax: { type: integer, minimum: 0 }
    effectiveFrom: { type: string, format: date-time }
    effectiveUntil: { type: [string, "null"], format: date-time }
    version: { type: integer, minimum: 1 }

DshStoreAssortmentInput:
  type: object
  additionalProperties: false
  required: [unitPrice, currency, available, stockStatus, localNote, customImageObjectKey, publicationStatus]
  properties:
    unitPrice: { type: number, format: double, minimum: 0, description: Bootstrap-only compatibility projection; existing rows use canonical price resources. }
    currency: { type: string }
    available: { type: boolean, description: Bootstrap-only compatibility projection; existing rows use canonical inventory resources. }
    stockStatus: { type: string, enum: [in_stock, low_stock, out_of_stock], description: Bootstrap-only compatibility projection; existing rows use canonical inventory resources. }
    localNote: { type: string }
    customImageObjectKey: { type: [string, "null"] }
    publicationStatus: { type: string, enum: [draft, submitted, approved, client_visible, rejected, hidden] }
    expectedVersion: { type: integer, minimum: 1, description: Required when updating an existing assortment; omitted during bootstrap creation. }

DshStoreAssortmentMetadataUpdateInput:
  type: object
  additionalProperties: false
  required: [localNote, customImageObjectKey, publicationStatus, expectedVersion]
  properties:
    localNote: { type: string }
    customImageObjectKey: { type: [string, "null"] }
    publicationStatus: { type: string, enum: [draft, submitted, approved, client_visible, rejected, hidden] }
    expectedVersion: { type: integer, minimum: 1 }

DshStoreAssortmentInventoryInput:
  type: object
  additionalProperties: false
  required: [policyType, quantity, minOrderQuantity, maxOrderQuantity, stepQuantity]
  properties:
    policyType: { type: string, enum: [signal, quantity, infinite] }
    quantity: { type: integer, minimum: 0 }
    minOrderQuantity: { type: integer, minimum: 1 }
    maxOrderQuantity: { type: integer, minimum: 1 }
    stepQuantity: { type: integer, minimum: 1 }
    expectedVersion: { type: integer, minimum: 0, description: Required by an update after canonical GET; zero is reserved for first-time bootstrap. }

DshStoreAssortmentPriceInput:
  type: object
  additionalProperties: false
  required: [amountMinor, currency, prepTimeMin, prepTimeMax, effectiveFrom]
  properties:
    amountMinor: { type: integer, minimum: 0 }
    currency: { type: string, minLength: 3, maxLength: 3 }
    prepTimeMin: { type: integer, minimum: 0 }
    prepTimeMax: { type: integer, minimum: 0 }
    effectiveFrom: { type: string, format: date-time }
    effectiveUntil: { type: [string, "null"], format: date-time }

DshStoreAssortmentResponse:
  type: object
  required: [assortment]
  properties:
    assortment: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshStoreAssortment" }

DshStoreAssortmentInventoryResponse:
  type: object
  required: [inventory]
  properties:
    inventory: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshStoreAssortmentInventory" }

DshStoreAssortmentPriceResponse:
  type: object
  required: [price]
  properties:
    price: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshStoreAssortmentPrice" }

DshStoreAssortmentPricesResponse:
  type: object
  required: [prices]
  properties:
    prices:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshStoreAssortmentPrice" }

DshCatalogAssetLink:
  type: object
  required: [id, assetId, entityType, entityId, role, sortOrder, isPrimary, status]
  properties:
    id: { type: string }
    assetId: { type: string }
    entityType: { type: string }
    entityId: { type: string }
    role: { type: string }
    sortOrder: { type: integer }
    isPrimary: { type: boolean }
    status: { type: string }

DshCatalogPolicySnapshot:
  type: object
  required: [id, policyScope, isActive, version]
  properties:
    id: { type: string }
    domainId: { type: ["string", "null"] }
    nodeId: { type: ["string", "null"] }
    policyScope: { type: string, enum: [default, domain, node] }
    isActive: { type: boolean }
    allowsStoreProductCustomImage: { type: boolean }
    allowsProductProposal: { type: boolean }
    requiresBarcode: { type: boolean }
    requiresCatalogReview: { type: boolean }
    requiresProductImage: { type: boolean }
    version: { type: integer, minimum: 1 }

DshCatalogResponse:
  type: object
  required: [domains, nodes, products, media, policySnapshot]
  properties:
    domains:
      type: array
      items: { $ref: "../../dsh.catalog.openapi.yaml#/components/schemas/Domain" }
    nodes:
      type: array
      items: { $ref: "../../dsh.catalog.openapi.yaml#/components/schemas/Node" }
    products:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshClientCatalogProduct" }
    media:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshCatalogAssetLink" }
    policySnapshot:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshCatalogPolicySnapshot" }

DshHomeCategory:
  type: object
  required:
    - id
    - label
    - sortOrder
    - destinationType
    - destinationTarget
  properties:
    id:
      type: string
    label:
      type: string
    iconUrl:
      type: string
    sortOrder:
      type: integer
    destinationType:
      type: string
      enum: [catalog_domain, special_request]
    destinationTarget:
      type: string
      description: Central catalog domain id or sovereign special-request type.

DshEscalationCategory:
  type: string
  enum: [document_missing, safety_violation, location_mismatch, product_compliance, equipment_failure, other]

DshTicketCategory:
  type: string
  enum: [order_issue, delivery_issue, store_quality, payment_reference, account_access, app_bug, other]

DshTicketCategoryCount:
  type: object
  required: [category, count]
  properties:
    category: { type: string }
    count: { type: integer }
