# BThwani DSH OpenAPI schemas module: checkout.
# Canonical checkout request/response/status authority. Referenced by
# ../dsh.openapi.yaml and all checkout contract shards.

DshCheckoutIntentState:
  type: string
  enum:
    - pending
    - wlt_handoff_failed
    - wlt_outcome_unknown
    - payment_pending
    - confirmed
    - cancelled
    - payment_confirmed
    - payment_failed
    - expired

DshCheckoutPaymentMethod:
  type: string
  enum: [cod, wallet, mixed, official_wallet]

DshCheckoutFulfillmentMode:
  type: string
  enum: [bthwani_delivery, partner_delivery, pickup]

DshCheckoutIntent:
  type: object
  additionalProperties: false
  required:
    - id
    - operatorContextId
    - clientId
    - cartId
    - storeId
    - fulfillmentMode
    - state
    - paymentMethod
    - wltPaymentSessionId
    - subtotalMinorUnits
    - deliveryFeeMinorUnits
    - discountMinorUnits
    - totalMinorUnits
    - currency
    - pricingSnapshotHash
    - version
    - createdAt
    - updatedAt
  properties:
    id: { type: string, format: uuid }
    operatorContextId: { type: string, minLength: 1 }
    clientId: { type: string, minLength: 1 }
    cartId: { type: string, format: uuid }
    storeId: { type: string, minLength: 1 }
    fulfillmentMode:
      $ref: "../../dsh.openapi.yaml#/components/schemas/DshCheckoutFulfillmentMode"
    state:
      $ref: "../../dsh.openapi.yaml#/components/schemas/DshCheckoutIntentState"
    paymentMethod:
      $ref: "../../dsh.openapi.yaml#/components/schemas/DshCheckoutPaymentMethod"
    wltPaymentSessionId:
      type: string
      description: "Opaque WLT-owned payment-session reference. DSH never mutates financial truth."
    deliveryAddress: { type: string }
    note: { type: string }
    subtotalMinorUnits: { type: integer, format: int64, minimum: 0 }
    deliveryFeeMinorUnits: { type: integer, format: int64, minimum: 0 }
    discountMinorUnits: { type: integer, format: int64, minimum: 0 }
    totalMinorUnits: { type: integer, format: int64, minimum: 0 }
    currency: { type: string, minLength: 3, maxLength: 3 }
    pricingSnapshotHash: { type: string, minLength: 1 }
    couponId: { type: string }
    couponRedemptionId: { type: string }
    couponCodeLast4: { type: string, maxLength: 4 }
    reconciliationRequired: { type: boolean }
    reconciliationAgeSeconds: { type: integer, format: int64, minimum: 0 }
    version: { type: integer, minimum: 1 }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }

DshCreateCheckoutIntentRequest:
  type: object
  additionalProperties: false
  required: [cartId, storeId]
  properties:
    cartId: { type: string, format: uuid }
    storeId: { type: string, minLength: 1 }
    fulfillmentMode:
      $ref: "../../dsh.openapi.yaml#/components/schemas/DshCheckoutFulfillmentMode"
    paymentMethod:
      $ref: "../../dsh.openapi.yaml#/components/schemas/DshCheckoutPaymentMethod"
    deliveryAddressId: { type: string, format: uuid }
    note: { type: string, maxLength: 1000 }
    couponCode: { type: string, maxLength: 32 }

DshCheckoutIntentResponse:
  type: object
  additionalProperties: false
  required: [intent]
  properties:
    intent:
      $ref: "../../dsh.openapi.yaml#/components/schemas/DshCheckoutIntent"

DshOperatorCheckoutIntentsResponse:
  type: object
  additionalProperties: false
  required: [intents]
  properties:
    intents:
      type: array
      items:
        $ref: "../../dsh.openapi.yaml#/components/schemas/DshCheckoutIntent"

DshWltPaymentSessionEvent:
  type: object
  additionalProperties: false
  required: [operatorContextId, checkoutIntentId, paymentSessionId, status]
  properties:
    eventId: { type: string, minLength: 8, maxLength: 200 }
    operatorContextId: { type: string, minLength: 1 }
    checkoutIntentId: { type: string, format: uuid }
    paymentSessionId: { type: string, minLength: 1 }
    status:
      type: string
      enum:
        - authorized
        - reference_created
        - cod_pending
        - captured
        - cod_collected
        - failed
        - expired

