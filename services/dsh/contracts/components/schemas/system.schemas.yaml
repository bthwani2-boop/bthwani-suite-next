# BThwani DSH OpenAPI schemas module: system.
# Source of truth. Referenced by ../dsh.openapi.yaml; do not add an openapi root here.

CaptainPickupReadinessRequest:
  type: object
  additionalProperties: false
  required: [expectedVersion, readiness, reason]
  properties:
    expectedVersion:
      type: integer
      minimum: 1
    readiness:
      type: string
      enum: [ready, blocked]
    reason:
      type: string
      minLength: 3
      maxLength: 500

DshHealthResponse:
  type: object
  required:
    - service
    - status
    - checkedAt
  properties:
    service:
      type: string
      const: dsh
    status:
      type: string
      enum:
        - healthy
    checkedAt:
      type: string
      format: date-time

DshReadinessResponse:
  type: object
  required:
    - service
    - status
    - dependencies
    - checkedAt
  properties:
    service:
      type: string
      const: dsh
    status:
      type: string
      enum:
        - HEALTHY
        - DEGRADED
        - NOT_READY
    dependencies:
      type: object
      additionalProperties:
        type: string
        enum:
          - HEALTHY
          - DEGRADED
          - NOT_READY
          - configured
          - missing
    checkedAt:
      type: string
      format: date-time

DshReadinessChecklistPolicyItem:
  type: object
  required: [checkType, labelAr, required, critical, evidenceRequired, displayOrder]
  properties:
    checkType: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshCheckType" }
    labelAr: { type: string, minLength: 2, maxLength: 160 }
    required: { type: boolean }
    critical: { type: boolean }
    evidenceRequired: { type: boolean }
    displayOrder: { type: integer, minimum: 0, maximum: 1000 }

DshReadinessChecklistPolicy:
  type: object
  required: [businessVerticalId, version, items]
  properties:
    businessVerticalId: { type: string }
    version: { type: integer, minimum: 0 }
    items:
      type: array
      minItems: 1
      maxItems: 50
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshReadinessChecklistPolicyItem" }

DshReadinessChecklistPolicyResponse:
  type: object
  required: [policy]
  properties:
    policy: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshReadinessChecklistPolicy" }

DshReplaceReadinessChecklistPolicyRequest:
  type: object
  required: [expectedVersion, items]
  properties:
    expectedVersion: { type: integer, minimum: 0 }
    items:
      type: array
      minItems: 1
      maxItems: 50
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshReadinessChecklistPolicyItem" }

DshReadinessCheck:
  type: object
  required: [id, visitId, storeId, checkType, status, evidenceUrl, notes, verifiedBy, createdAt, updatedAt, labelAr, required, critical, displayOrder]
  properties:
    id: { type: string }
    visitId: { type: string }
    storeId: { type: string }
    checkType: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshCheckType" }
    status: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshCheckStatus" }
    evidenceUrl: { type: string }
    notes: { type: string }
    verifiedBy: { type: string }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }
    labelAr: { type: string }
    required: { type: boolean }
    critical: { type: boolean }
    displayOrder: { type: integer }

DshReadinessCheckResponse:
  type: object
  required: [check]
  properties:
    check: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshReadinessCheck" }

DshReadinessChecksResponse:
  type: object
  required: [checks]
  properties:
    checks:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshReadinessCheck" }

DshUpsertReadinessCheckRequest:
  type: object
  required: [checkType, status]
  properties:
    checkType: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshCheckType" }
    status: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshCheckStatus" }
    evidenceUrl: { type: string }
    notes: { type: string }

DshReadinessEscalation:
  type: object
  required: [id, visitId, storeId, raisedBy, severity, category, description, status, resolutionNote, createdAt, updatedAt]
  properties:
    id: { type: string }
    visitId: { type: string }
    storeId: { type: string }
    raisedBy: { type: string }
    severity: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshEscalationSeverity" }
    category: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshEscalationCategory" }
    description: { type: string }
    status: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshEscalationStatus" }
    resolvedBy: { type: string }
    resolvedAt: { type: ["string", "null"], format: date-time }
    resolutionNote: { type: string }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }

DshPartnerReadiness:
  type: object
  required: [partnerId, canActivate, canActivatePartner, intakeComplete, publicationDecision, blockingReasons, checklist, storeSummary, stores, generatedAt]
  properties:
    partnerId: { type: string }
    canActivate: { type: boolean }
    canActivatePartner: { type: boolean }
    intakeComplete: { type: boolean }
    publicationDecision: { type: string, enum: [PUBLISHED, BLOCKED] }
    blockingReasons:
      type: array
      items: { type: string }
    blockedReason: { type: string }
    partnerActivationBlockedReason: { type: string }
    checklist:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshPartnerReadinessItem" }
    storeSummary:
      type: object
      required: [totalStores, readyStores, blockedStores, clientVisibleStores]
      properties:
        totalStores: { type: integer, minimum: 0 }
        readyStores: { type: integer, minimum: 0 }
        blockedStores: { type: integer, minimum: 0 }
        clientVisibleStores: { type: integer, minimum: 0 }
    stores:
      type: array
      items:
        type: object
        required: [storeId, displayName, publicationDecision, blockingReasons, isClientVisible]
        properties:
          storeId: { type: string }
          displayName: { type: string }
          publicationDecision: { type: string, enum: [PUBLISHED, BLOCKED] }
          blockingReasons:
            type: array
            items: { type: string }
          isClientVisible: { type: boolean }
    generatedAt: { type: string, format: date-time }

DshPartnerReadinessItem:
  type: object
  required: [id, label, satisfied]
  properties:
    id: { type: string }
    label: { type: string }
    satisfied: { type: boolean }
    blockedReason: { type: string }
