# BThwani DSH OpenAPI schemas module: dispatch.
# Source of truth. Referenced by ../dsh.openapi.yaml; do not add an openapi root here.

DshDispatchDelivery:
  type: object
  required: [id, assignmentId, orderId, specialRequestId, captainId, status, podMethod, podReference, note, createdAt, updatedAt]
  properties:
    id: { type: string }
    assignmentId: { type: string }
    orderId: { type: [string, "null"] }
    specialRequestId: { type: [string, "null"] }
    captainId: { type: string }
    status: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshDeliveryStatus" }
    podMethod: { type: string }
    podReference: { type: string }
    note: { type: string }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }
  oneOf:
    - required: [orderId]
      properties:
        orderId: { type: string }
        specialRequestId: { type: "null" }
    - required: [specialRequestId]
      properties:
        orderId: { type: "null" }
        specialRequestId: { type: string }

DshDispatchAssignment:
  type: object
  required: [id, orderId, specialRequestId, requestType, captainId, assignedBy, status, responseDeadlineAt, createdAt, updatedAt, version, delivery]
  properties:
    id: { type: string }
    orderId: { type: [string, "null"] }
    specialRequestId: { type: [string, "null"] }
    requestType: { type: string }
    captainId: { type: string }
    assignedBy: { type: string }
    status: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshAssignmentStatus" }
    responseDeadlineAt: { type: string, format: date-time }
    acceptedAt: { type: ["string", "null"], format: date-time }
    declinedAt: { type: ["string", "null"], format: date-time }
    completedAt: { type: ["string", "null"], format: date-time }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }
    version: { type: integer, minimum: 1 }
    # Only the captain's latest foreground location sample is retained —
    # no history — and it is purged (set back to null) once the
    # assignment reaches a terminal state (declined/completed).
    lastLatitude: { type: ["number", "null"] }
    lastLongitude: { type: ["number", "null"] }
    locationRecordedAt: { type: ["string", "null"], format: date-time }
    delivery: { $ref: "#/DshDispatchDelivery" }
  oneOf:
    - required: [orderId]
      properties:
        orderId: { type: string }
        specialRequestId: { type: "null" }
    - required: [specialRequestId, requestType]
      properties:
        orderId: { type: "null" }
        specialRequestId: { type: string }
        requestType: { type: string, minLength: 1 }

DshDispatchAssignmentResponse:
  type: object
  required: [assignment]
  properties:
    assignment: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshDispatchAssignment" }

DshPartnerDispatchReference:
  type: object
  required: [id, orderId, captainId, status, createdAt, updatedAt, deliveryStatus]
  description: >-
    Partner-facing reference status only. Never includes the
    captain's location or proof-of-delivery reference.
  properties:
    id: { type: string }
    orderId: { type: string }
    captainId: { type: string }
    status: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshAssignmentStatus" }
    acceptedAt: { type: ["string", "null"], format: date-time }
    completedAt: { type: ["string", "null"], format: date-time }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }
    deliveryStatus: { type: string }

DshPartnerDispatchReferenceResponse:
  type: object
  required: [assignment]
  properties:
    assignment:
      oneOf:
        - $ref: "../../dsh.openapi.yaml#/components/schemas/DshPartnerDispatchReference"
        - type: "null"

DshDispatchAssignmentsResponse:
  type: object
  required: [assignments]
  properties:
    assignments:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshDispatchAssignment" }

DshPushDispatchLocationRequest:
  type: object
  additionalProperties: false
  required: [latitude, longitude, accuracyMeters, recordedAt]
  description: >-
    Foreground-only location sample (register item 14 + 42 — no live
    tracking, no background location). Sent by the captain app roughly
    every 3 minutes while a delivery assignment is active.
  properties:
    latitude:
      type: number
      minimum: -90
      maximum: 90
    longitude:
      type: number
      minimum: -180
      maximum: 180
    accuracyMeters:
      type: number
      exclusiveMinimum: 0
      maximum: 100
    recordedAt:
      type: string
      format: date-time

# ── Field Readiness ──────────────────────────────────────────────
DshCaptainAvailability:
  type: object
  additionalProperties: false
  required: [status, version, updatedAt]
  properties:
    status:
      type: string
      enum: [available, unavailable, break, planned-leave]
    version:
      type: integer
      minimum: 1
    updatedAt:
      type: string
      format: date-time

DshSetCaptainAvailabilityRequest:
  type: object
  additionalProperties: false
  required: [status, expectedVersion]
  properties:
    status:
      type: string
      enum: [available, unavailable]
    expectedVersion:
      type: integer
      minimum: 0
