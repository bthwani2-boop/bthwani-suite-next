# BThwani DSH OpenAPI schemas module: support.
# Source of truth. Referenced by ../dsh.openapi.yaml; do not add an openapi root here.

DshTicketStatus:
  type: string
  enum: [open, in_review, pending_user, resolved, closed]

DshTicketPriority:
  type: string
  enum: [low, normal, high, urgent]

DshSupportTicket:
  type: object
  required: [id, storeId, reporterId, reporterRole, subject, description, category, priority, status, assignedTo, orderId, version, createdAt, updatedAt]
  properties:
    id: { type: string }
    storeId: { type: string }
    reporterId: { type: string }
    reporterRole: { type: string }
    subject: { type: string }
    description: { type: string }
    category: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshTicketCategory" }
    priority: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshTicketPriority" }
    status: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshTicketStatus" }
    version: { type: integer, minimum: 1 }
    assignedTo: { type: string }
    orderId: { type: string }
    resolvedAt: { type: ["string", "null"], format: date-time }
    closedAt: { type: ["string", "null"], format: date-time }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }

DshTicketResponse:
  type: object
  required: [ticket]
  properties:
    ticket: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshSupportTicket" }

DshTicketsResponse:
  type: object
  required: [tickets]
  properties:
    tickets:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshSupportTicket" }

DshCreateTicketRequest:
  type: object
  required: [subject, description, category]
  properties:
    subject: { type: string, minLength: 3 }
    description: { type: string, minLength: 10 }
    category: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshTicketCategory" }
    priority: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshTicketPriority" }
    storeId: { type: string }
    orderId: { type: string }

DshUpdateTicketRequest:
  type: object
  required: [status, expectedVersion]
  properties:
    expectedVersion: { type: integer, minimum: 1 }
    status: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshTicketStatus" }
    assignedTo: { type: string }

DshSupportMediaKind:
  type: string
  enum: [image, audio, video, document]

DshSupportMediaUploadStatus:
  type: string
  enum: [uploaded, processing, ready, failed]

DshSupportMessageAttachmentInput:
  type: object
  additionalProperties: false
  required: [mediaAssetId, fileName, mimeType, sizeBytes, kind]
  properties:
    mediaAssetId: { type: string, minLength: 1, maxLength: 240 }
    fileName: { type: string, minLength: 1, maxLength: 240 }
    mimeType: { type: string, minLength: 1, maxLength: 160 }
    sizeBytes: { type: integer, minimum: 1, maximum: 104857600 }
    kind: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshSupportMediaKind" }
    durationMs: { type: ["integer", "null"], minimum: 0 }
    thumbnailMediaAssetId: { type: string, maxLength: 240 }
    waveformRef: { type: string, maxLength: 2000 }
    uploadStatus:
      allOf:
        - { $ref: "../../dsh.openapi.yaml#/components/schemas/DshSupportMediaUploadStatus" }
      default: ready

DshSupportMessageAttachment:
  allOf:
    - { $ref: "../../dsh.openapi.yaml#/components/schemas/DshSupportMessageAttachmentInput" }
    - type: object
      additionalProperties: false
      required: [id, ticketId, messageId, attachedBy, isInternal, createdAt, uploadStatus]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        attachedBy: { type: string }
        isInternal: { type: boolean }
        createdAt: { type: string, format: date-time }

DshRichMessageRequest:
  type: object
  additionalProperties: false
  properties:
    body: { type: string, minLength: 1, maxLength: 4000 }
    isInternal: { type: boolean, default: false }
    attachments:
      type: array
      maxItems: 10
      uniqueItems: true
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshSupportMessageAttachmentInput" }
  anyOf:
    - required: [body]
    - required: [attachments]
      properties:
        attachments:
          type: array
          minItems: 1
          items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshSupportMessageAttachmentInput" }

DshSupportMessage:
  type: object
  additionalProperties: false
  required: [id, ticketId, senderId, senderRole, body, isInternal, attachments, createdAt]
  properties:
    id: { type: string, format: uuid }
    ticketId: { type: string, format: uuid }
    senderId: { type: string }
    senderRole: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshSenderRole" }
    body: { type: string, maxLength: 4000 }
    isInternal: { type: boolean }
    attachments:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshSupportMessageAttachment" }
    createdAt: { type: string, format: date-time }

DshSupportAnalyticsResponse:
  type: object
  required: [totalTickets, openTickets, resolvedTickets, byCategory, period, generatedAt]
  properties:
    totalTickets: { type: integer }
    openTickets: { type: integer }
    resolvedTickets: { type: integer }
    byCategory:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshTicketCategoryCount" }
    period: { type: string }
    generatedAt: { type: string, format: date-time }

DshPartnerSupportAggregate:
  type: object
  additionalProperties: false
  required: [partnerId, operatorContextId, activationStatus, onboardingCaseStatus, category, archivedAt, activeStoresCount, activeOrdersCount, activeTicketsCount]
  properties:
    partnerId: { type: string }
    operatorContextId: { type: string }
    activationStatus: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshPartnerActivationStatusValue" }
    onboardingCaseStatus: { type: string }
    category: { type: string }
    archivedAt: { type: [string, 'null'], format: date-time }
    activeStoresCount: { type: integer, minimum: 0 }
    activeOrdersCount: { type: integer, minimum: 0 }
    activeTicketsCount: { type: integer, minimum: 0 }

DshPartnerOperationalStore:
  type: object
  additionalProperties: false
  required: [id, displayName, status, isVisible, serviceabilityStatus, partnerReadiness, catalogApprovalStatus, marketingVisibility, publicationDecision, blockingReasonCodes]
  properties:
    id: { type: string }
    displayName: { type: string }
    status: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshStoreStatus" }
    isVisible: { type: boolean }
    serviceabilityStatus: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshStoreServiceabilityStatus" }
    partnerReadiness: { type: string, enum: [pending, ready, blocked] }
    catalogApprovalStatus: { type: string }
    marketingVisibility: { type: string, enum: [hidden, visible] }
    publicationDecision: { type: string, enum: [PUBLISHED, BLOCKED] }
    blockingReasonCodes: { type: array, items: { type: string } }

DshPartnerOperationalOrder:
  type: object
  additionalProperties: false
  required: [id, storeId, status, fulfillmentMode, version, createdAt, updatedAt]
  properties:
    id: { type: string }
    storeId: { type: string }
    status: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshOrderStatus" }
    fulfillmentMode: { type: string, enum: [bthwani_delivery, partner_delivery, pickup] }
    version: { type: integer, minimum: 1 }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }

DshPartnerOperationalTicket:
  type: object
  additionalProperties: false
  required: [id, storeId, orderId, category, priority, status, assignedTo, version, createdAt, updatedAt]
  properties:
    id: { type: string }
    storeId: { type: string }
    orderId: { type: string }
    category: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshTicketCategory" }
    priority: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshTicketPriority" }
    status: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshTicketStatus" }
    assignedTo: { type: string }
    version: { type: integer, minimum: 1 }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }

DshPartnerSupportOperations:
  type: object
  additionalProperties: false
  required: [partnerId, operatorContextId, activationStatus, onboardingCaseStatus, category, archivedAt, stores, orders, tickets, generatedAt]
  properties:
    partnerId: { type: string }
    operatorContextId: { type: string }
    activationStatus: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshPartnerActivationStatusValue" }
    onboardingCaseStatus: { type: string }
    category: { type: string }
    archivedAt: { type: [string, 'null'], format: date-time }
    stores: { type: array, items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshPartnerOperationalStore" } }
    orders: { type: array, items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshPartnerOperationalOrder" } }
    tickets: { type: array, items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshPartnerOperationalTicket" } }
    generatedAt: { type: string, format: date-time }

DshOnboardingCollaborationThread:
  type: object
  required: [id, operatorContextId, partnerId, status, createdByActorId, version, createdAt, updatedAt]
  properties:
    id: { type: string, format: uuid }
    operatorContextId: { type: string }
    partnerId: { type: string }
    assignmentId: { type: string, format: uuid }
    documentId: { type: string }
    status: { type: string, enum: [open, resolved, closed] }
    createdByActorId: { type: string }
    version: { type: integer, minimum: 1 }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }

DshOnboardingCollaborationMessage:
  type: object
  required: [id, threadId, senderActorId, senderSurface, body, attachmentMediaRefs, clientMessageId, sequenceNumber, createdAt]
  properties:
    id: { type: string, format: uuid }
    threadId: { type: string, format: uuid }
    senderActorId: { type: string }
    senderSurface: { type: string, enum: [app-field, control-panel] }
    body: { type: string, minLength: 1, maxLength: 4000 }
    attachmentMediaRefs: { type: array, items: { type: string }, maxItems: 10 }
    clientMessageId: { type: string, minLength: 1, maxLength: 240 }
    sequenceNumber: { type: integer, minimum: 1 }
    createdAt: { type: string, format: date-time }

DshOnboardingChangeRequest:
  type: object
  required: [id, threadId, targetKind, targetId, requestedByActorId, reason, status, createdAt]
  properties:
    id: { type: string, format: uuid }
    threadId: { type: string, format: uuid }
    targetKind: { type: string, enum: [draft, document, assignment] }
    targetId: { type: string }
    requestedByActorId: { type: string }
    reason: { type: string, minLength: 5, maxLength: 2000 }
    status: { type: string, enum: [open, responded, resolved, cancelled] }
    resolvedByActorId: { type: string }
    resolvedAt: { type: [string, 'null'], format: date-time }
    createdAt: { type: string, format: date-time }

DshOnboardingCollaborationResponse:
  type: object
  required: [thread, partnerVersion, messages, changeRequests, unreadCount]
  properties:
    thread: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshOnboardingCollaborationThread" }
    partnerVersion: { type: integer, minimum: 1 }
    messages:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshOnboardingCollaborationMessage" }
    changeRequests:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshOnboardingChangeRequest" }
    unreadCount: { type: integer, minimum: 0 }

DshOnboardingCollaborationMessageRequest:
  type: object
  additionalProperties: false
  required: [body, clientMessageId]
  properties:
    body: { type: string, minLength: 1, maxLength: 4000 }
    attachmentMediaRefs: { type: array, items: { type: string }, maxItems: 10, uniqueItems: true }
    clientMessageId: { type: string, minLength: 1, maxLength: 240 }

DshOnboardingChangeRequestRequest:
  type: object
  additionalProperties: false
  required: [targetKind, targetId, reason, expectedVersion, toStatus]
  properties:
    targetKind: { type: string, enum: [draft, document, assignment] }
    targetId: { type: string }
    reason: { type: string, minLength: 5, maxLength: 2000 }
    expectedVersion: { type: integer, minimum: 1 }
    toStatus: { type: string, enum: [documents_missing, ops_rejected] }
    idempotencyKey: { type: string }
    correlationId: { type: string }

DshOnboardingWorkloadItem:
  type: object
  required: [assignmentId, fieldActorId, assignmentStatus, storeNameHint, openChangeRequests, unreadCount, updatedAt]
  properties:
    assignmentId: { type: string, format: uuid }
    fieldActorId: { type: string }
    assignmentStatus: { type: string, enum: [assigned, in_progress, draft_linked, cancelled] }
    storeNameHint: { type: string }
    phoneHint: { type: string }
    addressHint: { type: string }
    partnerId: { type: string }
    partnerStatus: { type: string }
    partnerVersion: { type: integer, minimum: 0 }
    openChangeRequests: { type: integer, minimum: 0 }
    unreadCount: { type: integer, minimum: 0 }
    updatedAt: { type: string, format: date-time }

DshOnboardingWorkloadResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: "../../dsh.openapi.yaml#/components/schemas/DshOnboardingWorkloadItem" }
