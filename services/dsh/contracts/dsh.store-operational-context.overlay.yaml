overlay: 1.0.0
info:
  title: BThwani DSH Store Operational Context Overlay
  version: 1.0.0
actions:
  - target: $.components.schemas
    description: Add the canonical operational context returned by governed store detail projections.
    update:
      DshStoreOperationalContext:
        type: object
        additionalProperties: false
        required:
          - addressLine
          - coverageSummary
          - operatingHours
          - deliveryReadiness
        properties:
          addressLine:
            type: string
            minLength: 1
          coverageSummary:
            type: string
            minLength: 1
          operatingHours:
            type: string
            minLength: 1
          deliveryReadiness:
            type: string
            minLength: 1
