overlay: 1.0.0
info:
  title: DSH central-catalog product detail operation
  version: 1.0.0
actions:
  - target: $.paths['/dsh/operator/catalog/master-products/{productId}']
    update:
      get:
        operationId: getMasterProductOperator
        tags: [CentralCatalog]
        security:
          - bearerAuth: []
        parameters:
          - name: productId
            in: path
            required: true
            schema:
              type: string
              minLength: 1
        responses:
          "200":
            description: Sovereign master-product detail.
            content:
              application/json:
                schema:
                  type: object
                  required: [masterProduct]
                  properties:
                    masterProduct:
                      $ref: "#/components/schemas/DshMasterProduct"
          "400":
            $ref: "#/components/responses/InvalidRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
