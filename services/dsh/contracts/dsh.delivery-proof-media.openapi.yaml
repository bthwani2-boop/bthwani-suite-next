openapi: 3.1.0
info:
  title: BThwani DSH Delivery Proof Media API
  version: 1.0.0
  description: Governed binary proof-of-delivery upload contract for BThwani captains
    and partner-owned store couriers. The operation uploads the binary, registers
    actor-owned media truth, and completes the delivery only after DSH accepts the
    current lifecycle transition.
x-bthwani-owner: services/dsh
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-runtime-dependency: true
x-bthwani-parent-contract: services/dsh/contracts/dsh.openapi.yaml
x-bthwani-client-generation: DISABLED
x-bthwani-client-binding: MANUAL_TYPED_ADAPTER
servers:
- url: http://localhost:18080
paths:
  /dsh/operator/delivery-proofs:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_delivery_proofs
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
  /dsh/operator/delivery-proofs/{proofId}:
    parameters:
    - name: proofId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - operator
      operationId: get_dsh_operator_delivery_proofs__proofId_
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
  /dsh/operator/delivery-proofs/{proofId}/accept:
    parameters:
    - name: proofId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_delivery_proofs__proofId__accept
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
  /dsh/operator/delivery-proofs/{proofId}/reject:
    parameters:
    - name: proofId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_delivery_proofs__proofId__reject
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: true
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    DispatchAssignmentEnvelope:
      type: object
      additionalProperties: false
      required:
      - assignment
      properties:
        assignment:
          type: object
          additionalProperties: true
    PartnerDeliveryTaskEnvelope:
      type: object
      additionalProperties: false
      required:
      - task
      properties:
        task:
          type: object
          additionalProperties: true
  responses:
    InvalidRequest:
      description: Invalid multipart body or unsupported media type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The actor does not own the requested partner order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Assignment, order, or delivery task was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Actor ownership, command identity, version, or delivery state conflicts
        with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UploadTooLarge:
      description: Uploaded proof exceeds the governed media size limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidTransition:
      description: Delivery has not reached the proof-eligible state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MediaUnavailable:
      description: Governed media storage is not configured or unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
