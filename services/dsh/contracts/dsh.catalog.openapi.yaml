openapi: 3.1.0
info:
  title: BThwani DSH Sovereign Central Catalog API
  version: 1.0.0
  description: Executable contract fragment for the sovereign central catalog. It
    mirrors the paths registered by the DSH runtime and requires optimistic concurrency
    control for every mutation of an existing versioned entity.
x-bthwani-owner: services/dsh
x-bthwani-parent-contract: contracts/dsh.openapi.yaml
x-bthwani-contract-role: executable-fragment
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: DISABLED
x-bthwani-adapter-owner: frontend/shared/catalog/central-catalog.api.ts
x-bthwani-runtime-dependency: true
paths:
  /dsh/operator/catalog/master-products/{productId}:
    get:
      operationId: getMasterProductOperator
      tags:
      - CentralCatalog
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Sovereign master-product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterProductResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateMasterProduct
      tags:
      - CentralCatalog
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMasterProductRequest'
      responses:
        '200':
          description: Master product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterProductResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /dsh/partner/catalog/product-proposals:
    get:
      operationId: listPartnerProductProposals
      tags:
      - CentralCatalog
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: storeId
        in: query
        description: Required when the authenticated partner has more than one active store scope.
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Proposals belonging to the authenticated partner store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPartnerProductProposal
      tags:
      - CentralCatalog
      security:
      - bearerAuth: []
      parameters:
      - name: storeId
        in: query
        description: Required when the authenticated partner has more than one active store scope.
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
      responses:
        '201':
          description: Proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /dsh/partner/catalog/product-proposals/{proposalId}:
    patch:
      operationId: patchPartnerProductProposal
      tags:
      - CentralCatalog
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProposalRequest'
      responses:
        '200':
          description: Proposal resubmitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /dsh/field/partners/{partnerId}/catalog/product-proposals:
    get:
      operationId: listFieldProductProposals
      tags:
      - CentralCatalog
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PartnerId'
      - name: status
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Proposals belonging to the field-authorized partner store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createFieldProductProposal
      tags:
      - CentralCatalog
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PartnerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
      responses:
        '201':
          description: Field proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /dsh/field/partners/{partnerId}/catalog/product-proposals/{proposalId}:
    patch:
      operationId: patchFieldProductProposal
      tags:
      - CentralCatalog
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PartnerId'
      - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProposalRequest'
      responses:
        '200':
          description: Field proposal resubmitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /dsh/operator/catalog/assets/{assetId}:
    patch:
      operationId: updateCatalogAsset
      tags:
      - CentralCatalog
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetRequest'
      responses:
        '200':
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteCatalogAsset
      tags:
      - CentralCatalog
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/AssetId'
      responses:
        '204':
          description: Asset deleted (only draft/uploaded/rejected with no active
            links).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /dsh/field/catalog/domains:
    get:
      tags:
      - field
      operationId: get_dsh_field_catalog_domains
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
