components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    DomainId:
      name: domainId
      in: path
      required: true
      schema:
        type: string
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    MasterProductId:
      name: masterProductId
      in: path
      required: true
      schema:
        type: string
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        type: string
    PartnerId:
      name: partnerId
      in: path
      required: true
      schema:
        type: string
  responses:
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Missing or invalid identity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission or ownership denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Version conflict; reload before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictResponse'
    InvalidTransition:
      description: Governed state transition rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PositiveVersion:
      type: integer
      minimum: 1
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    ConflictResponse:
      type: object
      required:
      - code
      - message
      - entityId
      - currentVersion
      properties:
        code:
          const: CONFLICT
        message:
          type: string
        entityId:
          type: string
        expectedVersion:
          type:
          - integer
          - 'null'
          minimum: 1
        currentVersion:
          type: integer
          minimum: 1
    VersionedEntity:
      type: object
      required:
      - id
      - version
      properties:
        id:
          type: string
        version:
          $ref: '#/components/schemas/PositiveVersion'
    Domain:
      allOf:
      - $ref: '#/components/schemas/VersionedEntity'
      - type: object
        required:
        - slug
        - nameAr
        - nameEn
        - icon
        - sortOrder
        - isActive
        - isClientVisible
        - requiresProductCatalog
        - isManualRequest
        - createdAt
        - updatedAt
        properties:
          slug:
            type: string
          nameAr:
            type: string
          nameEn:
            type: string
          icon:
            type: string
          sortOrder:
            type: integer
          isActive:
            type: boolean
          isClientVisible:
            type: boolean
          requiresProductCatalog:
            type: boolean
          isManualRequest:
            type: boolean
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
    CreateDomainRequest:
      type: object
      required:
      - slug
      - nameAr
      - nameEn
      - icon
      - sortOrder
      - isActive
      - isClientVisible
      - requiresProductCatalog
      - isManualRequest
      properties:
        slug:
          type: string
          minLength: 1
        nameAr:
          type: string
          minLength: 1
        nameEn:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        isClientVisible:
          type: boolean
        requiresProductCatalog:
          type: boolean
        isManualRequest:
          type: boolean
    UpdateDomainRequest:
      type: object
      required:
      - expectedVersion
      properties:
        expectedVersion:
          $ref: '#/components/schemas/PositiveVersion'
        nameAr:
          type: string
          minLength: 1
        nameEn:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        isClientVisible:
          type: boolean
        requiresProductCatalog:
          type: boolean
        isManualRequest:
          type: boolean
    Node:
      allOf:
      - $ref: '#/components/schemas/VersionedEntity'
      - type: object
        required:
        - domainId
        - level
        - slug
        - nameAr
        - nameEn
        - sortOrder
        - isActive
        - isClientVisible
        - lifecycleStatus
        - createdAt
        - updatedAt
        properties:
          domainId:
            type: string
          parentId:
            type:
            - string
            - 'null'
          level:
            type: string
          slug:
            type: string
          nameAr:
            type: string
          nameEn:
            type: string
          icon:
            type: string
          sortOrder:
            type: integer
          isActive:
            type: boolean
          isClientVisible:
            type: boolean
          requiresBarcode:
            type: boolean
          allowsProductProposal:
            type: boolean
          allowsStoreProductCustomImage:
            type: boolean
          requiresCatalogReview:
            type: boolean
          requiresProductCatalog:
            type: boolean
          lifecycleStatus:
            type: string
            enum:
            - active
            - deprecated
            - merged
            description: Taxonomy lifecycle; merged nodes point at their replacement
              through mergedIntoId and disappear from listing queries.
          mergedIntoId:
            type:
            - string
            - 'null'
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
    CreateNodeRequest:
      type: object
      required:
      - domainId
      - level
      - slug
      - nameAr
      - nameEn
      - icon
      - sortOrder
      - isActive
      - isClientVisible
      - requiresBarcode
      - allowsProductProposal
      - allowsStoreProductCustomImage
      - requiresCatalogReview
      - requiresProductCatalog
      properties:
        domainId:
          type: string
        parentId:
          type:
          - string
          - 'null'
        level:
          type: string
        slug:
          type: string
          minLength: 1
        nameAr:
          type: string
          minLength: 1
        nameEn:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        isClientVisible:
          type: boolean
        requiresBarcode:
          type: boolean
        allowsProductProposal:
          type: boolean
        allowsStoreProductCustomImage:
          type: boolean
        requiresCatalogReview:
          type: boolean
        requiresProductCatalog:
          type: boolean
    UpdateNodeRequest:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      properties:
        expectedVersion:
          $ref: '#/components/schemas/PositiveVersion'
        nameAr:
          type: string
          minLength: 1
        nameEn:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        isClientVisible:
          type: boolean
        requiresBarcode:
          type: boolean
        allowsProductProposal:
          type: boolean
        allowsStoreProductCustomImage:
          type: boolean
        requiresCatalogReview:
          type: boolean
        requiresProductCatalog:
          type: boolean
    MasterProduct:
      allOf:
      - $ref: '#/components/schemas/VersionedEntity'
      - type: object
        required:
        - domainId
        - canonicalNameAr
        - canonicalNameEn
        - brand
        - unit
        - measurementType
        - approvalStatus
        - isActive
        - createdSource
        - isStandalone
        - createdAt
        - updatedAt
        properties:
          domainId:
            type: string
          categoryNodeId:
            type:
            - string
            - 'null'
          canonicalNameAr:
            type: string
          canonicalNameEn:
            type: string
          brand:
            type: string
          barcode:
            type:
            - string
            - 'null'
          gtin:
            type:
            - string
            - 'null'
          sku:
            type:
            - string
            - 'null'
          unit:
            type: string
          measurementType:
            type: string
          canonicalImageObjectKey:
            type:
            - string
            - 'null'
          approvalStatus:
            type: string
            enum:
            - draft
            - pending_review
            - approved
            - rejected
            - archived
          isActive:
            type: boolean
          duplicateGroupId:
            type:
            - string
            - 'null'
