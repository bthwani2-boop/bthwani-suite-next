openapi: 3.1.0
info:
  title: BThwani DSH Delivery Proof Completion API
  version: 1.0.0
  description: 'Actor-owned proof-of-delivery contract. DSH owns proof and order completion
    state. WLT receives only the durable delivery_completed handoff and remains the
    sole owner of financial truth.

    '
x-bthwani-owner: services/dsh
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: DISABLED
x-bthwani-runtime-dependency: true
x-bthwani-adapter-owner: frontend/shared/delivery-proof
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProofId:
      name: proofId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 160
    StandardIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 160
  schemas:
    DeliveryEvidenceKind:
      type: string
      enum:
      - photo
      - signature
      description: Classifies the multipart image so DSH binds it to the correct governed
        media purpose.
    DeliveryProofMethod:
      type: string
      enum:
      - otp_pin
      - photo
      - signature
      - composite
    DeliveryProofStatus:
      type: string
      enum:
      - submitted
      - pending_review
      - accepted
      - rejected
      - superseded
    DeliveryPinChallenge:
      type: object
      required:
      - id
      - orderId
      - assignmentId
      - expiresAt
      - maxAttempts
      - version
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        assignmentId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 10
        version:
          type: integer
          minimum: 1
    DeliveryPinResponse:
      type: object
      required:
      - challenge
      - pin
      properties:
        challenge:
          $ref: '#/components/schemas/DeliveryPinChallenge'
        pin:
          type: string
          pattern: ^[0-9]{6}$
    SubmitDeliveryProofRequest:
      type: object
      required:
      - method
      properties:
        method:
          $ref: '#/components/schemas/DeliveryProofMethod'
        pin:
          type: string
          pattern: ^[0-9]{6}$
        photoMediaRef:
          type:
          - string
          - 'null'
        signatureMediaRef:
          type:
          - string
          - 'null'
        capturedLatitude:
          type:
          - number
          - 'null'
          minimum: -90
          maximum: 90
        capturedLongitude:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
        capturedAt:
          type:
          - string
          - 'null'
          format: date-time
    ReviewDeliveryProofRequest:
      type: object
      required:
      - expectedVersion
      - reason
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 5
          maxLength: 500
    DeliveryProof:
      type: object
      required:
      - id
      - assignmentId
      - orderId
      - captainId
      - method
      - status
      - hasPhoto
      - hasSignature
      - capturedAt
      - submittedAt
      - version
      properties:
        id:
          type: string
          format: uuid
        assignmentId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        captainId:
          type: string
        method:
          $ref: '#/components/schemas/DeliveryProofMethod'
        status:
          $ref: '#/components/schemas/DeliveryProofStatus'
        hasPhoto:
          type: boolean
        hasSignature:
          type: boolean
        photoMediaRef:
          type:
          - string
          - 'null'
        signatureMediaRef:
          type:
          - string
          - 'null'
        capturedLatitude:
          type:
          - number
          - 'null'
        capturedLongitude:
          type:
          - number
          - 'null'
        capturedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
        reviewedByActorId:
          type:
          - string
          - 'null'
        reviewReason:
          type:
          - string
          - 'null'
        acceptedAt:
          type:
          - string
          - 'null'
          format: date-time
        rejectedAt:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          minimum: 1
    ClientDeliveryProof:
      type: object
      required:
      - id
      - orderId
      - method
      - status
      - hasPhoto
      - hasSignature
      - capturedAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        method:
          $ref: '#/components/schemas/DeliveryProofMethod'
        status:
          type: string
          const: accepted
        hasPhoto:
          type: boolean
        hasSignature:
          type: boolean
        capturedAt:
          type: string
          format: date-time
        acceptedAt:
          type:
          - string
          - 'null'
          format: date-time
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    InvalidRequest:
      description: Invalid delivery proof request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Actor is not allowed to access this proof.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Order, assignment, challenge, or proof was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State, PIN, version, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
