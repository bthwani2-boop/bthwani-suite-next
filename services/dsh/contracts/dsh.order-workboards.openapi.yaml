openapi: 3.1.0
info:
  title: BThwani DSH Order Workboards API
  version: 1.0.0
  description: >-
    Actor-scoped operational read models for partner preparation and operator
    oversight. DSH derives scope and executable actions from the authenticated
    actor.
x-bthwani-owner: services/dsh
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: MANUAL_TYPED_ADAPTER
x-bthwani-runtime-dependency: true
servers:
  - url: http://localhost:18080
paths:
  /dsh/control-panel/finance/checkout-closures/{outboxId}/retry:
    post:
      tags: [ "dsh-finance" ]
      operationId: retryDshCheckoutFinancialClosure
      summary: Schedule an eligible definitive checkout closure failure for retry.
      parameters:
        - name: outboxId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/RecoveryResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /dsh/control-panel/finance/checkout-closures/{outboxId}/reconcile:
    post:
      tags: [ "dsh-finance" ]
      operationId: reconcileDshCheckoutFinancialClosure
      summary: Schedule canonical WLT readback for an unknown checkout closure.
      parameters:
        - name: outboxId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/RecoveryResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /dsh/operator/order-workboard:
    get:
      tags: [ "dsh-operator" ]
      operationId: getDshOperatorOrderWorkboard
      summary: Return the governed cross-store operator order workboard.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200': { $ref: '#/components/responses/WorkboardResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StatusFilter:
      name: status
      in: query
      required: false
      schema: { type: string, minLength: 1 }
  responses:
    RecoveryResponse:
      description: Recovery request accepted by the DSH outbox state machine.
      content:
        application/json:
          schema:
            type: object
            required: [outboxId, status]
            properties:
              outboxId: { type: string, format: uuid }
              status: { type: string, enum: [retry_scheduled, reconciliation_scheduled] }
    WorkboardResponse:
      description: Actor-scoped order workboard.
      content:
        application/json:
          schema:
            type: object
            required: [ orders, total ]
            properties:
              orders:
                type: array
                items: { type: object, additionalProperties: true }
              total:
                type: integer
                minimum: 0
    ErrorResponse:
      description: Governed error response.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
