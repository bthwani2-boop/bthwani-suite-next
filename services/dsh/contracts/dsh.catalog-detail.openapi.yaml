openapi: 3.1.0
info:
  title: BThwani DSH Master Product Detail API
  version: 1.0.0
  description: Operator-only read contract for one sovereign central-catalog master product.
x-bthwani-owner: services/dsh
x-bthwani-parent-contract: contracts/dsh.catalog.openapi.yaml
x-bthwani-contract-role: executable-fragment
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: ENABLED
x-bthwani-runtime-dependency: true
paths:
  /dsh/operator/catalog/master-products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: getMasterProductOperator
      tags: [CentralCatalog]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sovereign master-product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterProductResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components: {}
