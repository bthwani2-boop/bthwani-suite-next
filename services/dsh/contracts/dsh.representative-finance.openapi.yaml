openapi: 3.1.0
x-bthwani-owner: services/dsh
x-bthwani-capability: representative-finance
x-bthwani-contract-state: CONTRACT_ACTIVE
info:
  title: BThwani DSH Representative Finance
  version: 1.2.0
  description: >-
    Canonical actor-scoped wallet and ledger read contract. WLT remains the
    financial truth owner; DSH resolves self-service identity and applies
    finance.read to explicit operator lookups.
servers:
  - url: http://localhost:18080
paths:
  /dsh/client/me/finance/wallet:
    get:
      operationId: getDshClientOwnWallet
      tags: [ representative-finance ]
      responses:
        '200': { $ref: '#/components/responses/WalletResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/client/me/finance/ledger-entries:
    get:
      operationId: listDshClientOwnLedgerEntries
      tags: [ representative-finance ]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EntryType'
      responses:
        '200': { $ref: '#/components/responses/LedgerResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/partner/me/finance/wallet:
    get:
      operationId: getDshPartnerOwnWallet
      tags: [ representative-finance ]
      responses:
        '200': { $ref: '#/components/responses/WalletResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/partner/me/finance/ledger-entries:
    get:
      operationId: listDshPartnerOwnLedgerEntries
      tags: [ representative-finance ]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EntryType'
      responses:
        '200': { $ref: '#/components/responses/LedgerResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/partner/me/finance/commissions:
    get:
      operationId: listDshPartnerOwnCommissions
      tags: [ representative-finance ]
      responses:
        '200': { $ref: '#/components/responses/CommissionCollectionResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/partner/me/finance/payout-requests:
    get:
      operationId: listDshPartnerOwnPayoutRequests
      tags: [ representative-finance ]
      responses:
        '200': { $ref: '#/components/responses/PayoutRequestCollectionResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
    post:
      operationId: createDshPartnerOwnPayoutRequest
      tags: [ representative-finance ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/PayoutRequestBody'
      responses:
        '201': { $ref: '#/components/responses/PayoutRequestItemResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/captain/me/finance/wallet:
    get:
      operationId: getDshCaptainOwnWallet
      tags: [ representative-finance ]
      responses:
        '200': { $ref: '#/components/responses/WalletResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/captain/me/finance/ledger-entries:
    get:
      operationId: listDshCaptainOwnLedgerEntries
      tags: [ representative-finance ]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EntryType'
      responses:
        '200': { $ref: '#/components/responses/LedgerResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/captain/me/finance/commissions:
    get:
      operationId: listDshCaptainOwnCommissions
      tags: [ representative-finance ]
      responses:
        '200': { $ref: '#/components/responses/CommissionCollectionResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/captain/me/finance/payout-requests:
    get:
      operationId: listDshCaptainOwnPayoutRequests
      tags: [ representative-finance ]
      responses:
        '200': { $ref: '#/components/responses/PayoutRequestCollectionResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
    post:
      operationId: createDshCaptainOwnPayoutRequest
      tags: [ representative-finance ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/PayoutRequestBody'
      responses:
        '201': { $ref: '#/components/responses/PayoutRequestItemResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/captain/me/finance/topup-sessions:
    post:
      operationId: createDshCaptainOwnTopUpSession
      tags: [ representative-finance ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        $ref: '#/components/requestBodies/TopUpRequestBody'
      responses:
        '201': { $ref: '#/components/responses/TopUpSessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/captain/me/finance/topup-sessions/{topUpSessionId}:
    get:
      operationId: getDshCaptainOwnTopUpSession
      tags: [ representative-finance ]
      parameters:
        - $ref: '#/components/parameters/TopUpSessionId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { $ref: '#/components/responses/TopUpSessionResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/captain/me/finance/topup-sessions/{topUpSessionId}/{operation}:
    post:
      operationId: mutateDshCaptainOwnTopUpSession
      tags: [ representative-finance ]
      parameters:
        - $ref: '#/components/parameters/TopUpSessionId'
        - $ref: '#/components/parameters/TopUpOperation'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { $ref: '#/components/responses/TopUpSessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/captain/me/finance/collateral:
    get:
      operationId: getDshCaptainOwnCollateral
      tags: [ representative-finance ]
      responses:
        '200': { $ref: '#/components/responses/ReferenceItemResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/captain/me/finance/collateral/allocate:
    post:
      operationId: allocateDshCaptainOwnCollateral
      tags: [ representative-finance ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ paymentSessionId ]
              properties:
                paymentSessionId: { type: string, minLength: 1, maxLength: 200 }
              additionalProperties: false
      responses:
        '200': { $ref: '#/components/responses/ReferenceItemResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/captain/me/finance/collateral/release:
    post:
      operationId: releaseDshCaptainOwnCollateral
      tags: [ representative-finance ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ positionId, releaseReason ]
              properties:
                positionId: { type: string, minLength: 1, maxLength: 200 }
                releaseReason: { type: string, minLength: 1, maxLength: 500 }
              additionalProperties: false
      responses:
        '200': { $ref: '#/components/responses/ReferenceItemResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/field/me/finance/wallet:
    get:
      operationId: getDshFieldMeWallet
      tags: [ representative-finance ]
      responses:
        '200': { $ref: '#/components/responses/WalletResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/field/me/finance/ledger-entries:
    get:
      operationId: getDshFieldMeLedgerEntries
      tags: [ representative-finance ]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EntryType'
      responses:
        '200': { $ref: '#/components/responses/LedgerResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/field/me/finance/commissions:
    get:
      operationId: getDshFieldMeCommissions
      tags: [ representative-finance ]
      responses:
        '200': { $ref: '#/components/responses/CommissionCollectionResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/field/me/finance/payout-requests:
    get:
      operationId: getDshFieldMePayoutRequests
      tags: [ representative-finance ]
      responses:
        '200': { $ref: '#/components/responses/PayoutRequestCollectionResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
    post:
      operationId: submitDshFieldMePayoutRequest
      tags: [ representative-finance ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/PayoutRequestBody'
      responses:
        '201': { $ref: '#/components/responses/PayoutRequestItemResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/control-panel/finance/wallets/{actorType}/{actorId}:
    get:
      operationId: getDshRepresentativeWallet
      tags: [ representative-finance ]
      description: Requires finance.read and returns a no-store WLT-owned wallet.
      parameters:
        - $ref: '#/components/parameters/ActorTypePath'
        - $ref: '#/components/parameters/ActorIdPath'
      responses:
        '200': { $ref: '#/components/responses/WalletResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
  /dsh/control-panel/finance/wallets/{actorType}/{actorId}/ledger-entries:
    get:
      operationId: listDshRepresentativeLedgerEntries
      tags: [ representative-finance ]
      description: >-
        Requires finance.read. Actor scope is taken from the path; actorId and
        actorType query overrides are ignored by the implementation.
      parameters:
        - $ref: '#/components/parameters/ActorTypePath'
        - $ref: '#/components/parameters/ActorIdPath'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EntryType'
      responses:
        '200': { $ref: '#/components/responses/LedgerResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/WltUnavailable' }
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ActorTypePath:
      name: actorType
      in: path
      required: true
      schema:
        type: string
        enum: [ client, partner, captain, field ]
    ActorIdPath:
      name: actorId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 500 }
    EntryType:
      name: entryType
      in: query
      required: false
      schema: { type: string, maxLength: 80 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    TopUpSessionId:
      name: topUpSessionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    TopUpOperation:
      name: operation
      in: path
      required: true
      schema: { type: string, enum: [ authorize, capture ] }
  requestBodies:
    PayoutRequestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PayoutRequestInput' }
    TopUpRequestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TopUpRequestInput' }
  responses:
    WalletResponse:
      description: WLT-owned representative wallet.
      headers:
        Cache-Control:
          schema: { type: string, example: 'private, no-store' }
        Pragma:
          schema: { type: string, example: 'no-cache' }
      content:
        application/json:
          schema:
            type: object
            required: [ wallet ]
            properties:
              wallet: { $ref: '#/components/schemas/RepresentativeWallet' }
    LedgerResponse:
      description: Actor-scoped ledger references from WLT.
      headers:
        Cache-Control:
          schema: { type: string, example: 'private, no-store' }
        Pragma:
          schema: { type: string, example: 'no-cache' }
      content:
        application/json:
          schema:
            type: object
            required: [ ledgerEntries ]
            properties:
              ledgerEntries:
                type: array
                items: { $ref: '#/components/schemas/RepresentativeLedgerEntry' }
    CommissionCollectionResponse:
      description: Actor-scoped commission references owned by WLT.
      content:
        application/json:
          schema:
            type: object
            required: [ commissions ]
            properties:
              commissions:
                type: array
                items: { $ref: '#/components/schemas/RepresentativeCommission' }
    PayoutRequestCollectionResponse:
      description: Actor-scoped payout-request references owned by WLT.
      content:
        application/json:
          schema:
            type: object
            required: [ payoutRequests, total ]
            properties:
              payoutRequests:
                type: array
                items: { $ref: '#/components/schemas/RepresentativePayoutRequest' }
              total: { type: integer, format: int32, minimum: 0 }
    PayoutRequestItemResponse:
      description: Governed WLT payout request readback.
      content:
        application/json:
          schema:
            type: object
            required: [ payoutRequest ]
            properties:
              payoutRequest: { $ref: '#/components/schemas/RepresentativePayoutRequest' }
    ReferenceItemResponse:
      description: Governed WLT reference item.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    TopUpSessionResponse:
      description: WLT-owned Captain Cash-In session and canonical readback.
      headers:
        Cache-Control:
          schema: { type: string, example: 'private, no-store' }
        Pragma:
          schema: { type: string, example: 'no-cache' }
      content:
        application/json:
          schema:
            type: object
            required: [ paymentSession ]
            properties:
              paymentSession: { $ref: '#/components/schemas/CaptainTopUpSession' }
    AuthError:
      description: Authentication or authorization failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Invalid actor or request input.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    WltUnavailable:
      description: WLT is not configured or unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    RepresentativeWallet:
      type: object
      required:
        - id
        - actorId
        - actorType
        - status
        - currency
        - availableBalanceMinorUnits
        - pendingBalanceMinorUnits
        - heldBalanceMinorUnits
        - earnedTotalMinorUnits
        - settledTotalMinorUnits
        - paidTotalMinorUnits
        - collateralReservedBalanceMinorUnits
        - protectedMinimumCollateralMinorUnits
        - releasableCollateralExcessMinorUnits
        - outstandingDebtMinorUnits
        - activeCollateralPositionCount
      properties:
        id: { type: string }
        actorId: { type: string }
        actorType: { type: string, enum: [ client, partner, captain, field ] }
        status: { type: string, enum: [ active, suspended, frozen, closed ] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        availableBalanceMinorUnits: { type: integer, format: int64 }
        pendingBalanceMinorUnits: { type: integer, format: int64 }
        heldBalanceMinorUnits: { type: integer, format: int64 }
        earnedTotalMinorUnits: { type: integer, format: int64 }
        settledTotalMinorUnits: { type: integer, format: int64 }
        paidTotalMinorUnits: { type: integer, format: int64 }
        collateralReservedBalanceMinorUnits: { type: integer, format: int64 }
        protectedMinimumCollateralMinorUnits: { type: integer, format: int64 }
        releasableCollateralExcessMinorUnits: { type: integer, format: int64 }
        outstandingDebtMinorUnits: { type: integer, format: int64 }
        activeCollateralPositionCount: { type: integer, format: int32, minimum: 0 }
        lastLedgerEntryAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    RepresentativeLedgerEntry:
      type: object
      required:
        [
          id,
          entryType,
          actorId,
          actorType,
          amountMinorUnits,
          currency,
          debitCredit,
          balanceAfter,
          createdAt
        ]
      properties:
        id: { type: string }
        entryType: { type: string }
        actorId: { type: string }
        actorType: { type: string, enum: [ client, partner, captain, field ] }
        sourceType: { type: string }
        sourceId: { type: string }
        referenceId: { type: string }
        referenceType: { type: string }
        amountMinorUnits: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        debitCredit: { type: string, enum: [ debit, credit ] }
        balanceAfter: { type: integer, format: int64 }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    RepresentativeCommission:
      type: object
      description: WLT-owned commission readback (wlt_commissions row projection).
      required:
        [
          id,
          beneficiaryActorId,
          beneficiaryActorType,
          sourceType,
          sourceId,
          commissionType,
          amountMinorUnits,
          currency,
          status,
          resolutionNote,
          createdAt,
          updatedAt
        ]
      properties:
        id: { type: string }
        beneficiaryActorId: { type: string }
        beneficiaryActorType: { type: string }
        sourceType: { type: string }
        sourceId: { type: string }
        visitId: { type: [string, 'null'] }
        storeId: { type: [string, 'null'] }
        commissionPolicyId: { type: [string, 'null'] }
        commissionType:
          type: string
          enum: [ delivery_fee, platform_fee, cod_fee, partner_discount, field_visit_fee ]
        amountMinorUnits: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        status:
          type: string
          enum: [ pending, confirmed, settled, reversed, earned_pending_review, approved_pending_posting, posted_pending_settlement, held, rejected, paid ]
        settledAt: { type: [string, 'null'], format: date-time }
        confirmedAt: { type: [string, 'null'], format: date-time }
        rejectedAt: { type: [string, 'null'], format: date-time }
        reversedAt: { type: [string, 'null'], format: date-time }
        resolutionNote: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RepresentativePayoutRequest:
      type: object
      description: Governed manual-settlement payout request readback (wlt_payout_requests row projection).
      required:
        [
          id,
          beneficiaryActorId,
          beneficiaryActorType,
          payoutDestinationId,
          amountMinorUnits,
          currency,
          status,
          reconciliationStatus,
          requestedAt,
          failureReason,
          operatorId,
          approvedByOperatorId,
          rejectedByOperatorId,
          executedByOperatorId,
          verifiedByOperatorId,
          completedByOperatorId,
          failedByOperatorId,
          idempotencyKey
        ]
      properties:
        id: { type: string }
        beneficiaryActorId: { type: string }
        beneficiaryActorType: { type: string, enum: [ client, partner, captain, field ] }
        payoutDestinationId: { type: string }
        amountMinorUnits: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        status:
          type: string
          enum: [ pending, approved, rejected, executed, verified, completed, failed, provider_pending, processing, provider_result_unknown ]
        reconciliationStatus: { type: string }
        requestedAt: { type: string, format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        rejectedAt: { type: [string, 'null'], format: date-time }
        executedAt: { type: [string, 'null'], format: date-time }
        verifiedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        failedAt: { type: [string, 'null'], format: date-time }
        failureReason: { type: string }
        operatorId: { type: string }
        approvedByOperatorId: { type: string }
        rejectedByOperatorId: { type: string }
        executedByOperatorId: { type: string }
        verifiedByOperatorId: { type: string }
        completedByOperatorId: { type: string }
        failedByOperatorId: { type: string }
        idempotencyKey: { type: string }
    PayoutRequestInput:
      type: object
      required: [ amountMode, currency, idempotencyKey ]
      properties:
        amountMode: { type: string, enum: [ FULL_AVAILABLE, SPECIFIED ] }
        amountMinorUnits: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
      additionalProperties: false
    TopUpRequestInput:
      type: object
      required: [ topupReference, amountMinorUnits, currency ]
      properties:
        topupReference: { type: string, minLength: 1, maxLength: 200 }
        amountMinorUnits: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
      additionalProperties: false
    CaptainTopUpSession:
      type: object
      required: [ id, clientId, topupActorType, financialPurpose, status, amountMinorUnits, currency ]
      properties:
        id: { type: string }
        clientId: { type: string }
        topupReference: { type: [ string, 'null' ] }
        topupActorType: { type: [ string, 'null' ], enum: [ captain, null ] }
        financialPurpose: { type: string, enum: [ captain_topup ] }
        paymentMethod: { type: string, enum: [ official_wallet ] }
        status: { type: string }
        providerReference: { type: string }
        amountMinorUnits: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        capturedAt: { type: [ string, 'null' ], format: date-time }
    ErrorResponse:
      type: object
      required: [ code, message ]
      properties:
        code: { type: string }
        message: { type: string }
      additionalProperties: true
