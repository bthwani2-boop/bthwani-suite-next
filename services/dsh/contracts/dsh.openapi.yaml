info:
  title: BThwani DSH Service API
  version: 0.7.0
  description: 'Delivery and shopping hub service contract. Core capabilities include
    Store Discovery, Home Discovery, Catalog Management, Cart & Serviceability, Checkout
    & WLT Handoff, Order Fulfillment, Dispatch & Captain Delivery, Partner Onboarding
    & Store Publication, Support, and Analytics. WLT handoff uses reference fields
    only; no financial mutation inside DSH.

    '
