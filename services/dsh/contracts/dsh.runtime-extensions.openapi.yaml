components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    serviceToken:
      type: http
      scheme: bearer
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    ServiceCaller:
      name: X-Service-Caller
      in: header
      required: true
      schema: { const: workforce }
    OperatorContextId:
      name: X-Operator-Context-ID
      in: header
      required: false
      schema: { type: string }
    ServiceAreaCode:
      name: serviceAreaCode
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    BadRequest: { description: Invalid request. }
    Unauthorized: { description: Authentication required. }
    Forbidden: { description: Caller lacks required authority. }
    Conflict: { description: Version or idempotency conflict. }
