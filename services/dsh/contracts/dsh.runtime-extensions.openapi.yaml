openapi: 3.1.0
info:
  title: BThwani DSH Runtime Extensions API
  version: 0.1.0
  description: Governed runtime extensions for Workforce availability projection and
    operator dispatch capacity readback. DSH owns operational truth only.
x-bthwani-owner: services/dsh
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-runtime-dependency: true
x-bthwani-client-generation: DISABLED
x-bthwani-adapter-owner: frontend/shared/dispatch + core/workforce availability outbox
servers:
- url: http://localhost:18080
paths:
  /dsh/internal/workforce/provider-media-refs/validate:
    post:
      operationId: validateWorkforceProviderMediaReference
      summary: Validate a DSH-owned provider document reference before Workforce linking
      security:
      - serviceToken: []
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/ServiceCaller'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ actorId, actorRole, mediaRef ]
              properties:
                actorId: { type: string, minLength: 1 }
                actorRole: { type: string, enum: [ field, captain, employee ] }
                mediaRef: { type: string, minLength: 1 }
      responses:
        '204': { description: Reference is owned by the actor and safe to link. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Reference is not owned by the actor or is not linkable. }
        '503': { description: DSH media authority is unavailable. }
  /dsh/internal/workforce/availability-projections:
    post:
      operationId: projectWorkforceAvailabilityIntoDsh
      security:
      - serviceToken: []
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/ServiceCaller'
      - $ref: '#/components/parameters/OperatorContextId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: Availability projection accepted idempotently.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /dsh/internal/workforce/captains/{captainId}/financial-eligibility:
    get:
      operationId: getWorkforceCaptainFinancialEligibility
      summary: Read the DSH projection of a WLT-owned captain financial eligibility decision for Workforce dispatch gating
      description: Workforce consumes this bounded projection; DSH stores only opaque WLT decision metadata and does not own financial policy.
      security:
      - serviceToken: []
      parameters:
      - name: captainId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/ServiceCaller'
      - name: X-Operator-Context-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          $ref: './dsh.captain-financial-eligibility.openapi.yaml#/components/responses/EligibilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: WLT financial eligibility has not been projected for the captain.
        '503':
          description: The DSH financial eligibility projection is unavailable.
