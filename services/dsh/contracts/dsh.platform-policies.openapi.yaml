openapi: 3.1.0
info:
  title: BThwani DSH Platform Operational Policies API
  version: 0.3.0
  description: Governed DSH zones, SLA, capacity, serviceability, and store-onboarding
    fee policy. WLT remains the sole financial truth owner; DSH exposes an authenticated
    proxy projection and never owns or recomputes monetary state.
x-bthwani-owner: services/dsh
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: DISABLED
x-bthwani-client-binding: MANUAL_TYPED_ADAPTER
x-bthwani-runtime-dependency: true
paths:
  /dsh/operator/platform/map-provider-health:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_platform_map_provider_health
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
  /dsh/operator/platform/service-areas:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_platform_service_areas
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
  /dsh/operator/platform/service-areas/{serviceAreaCode}:
    parameters:
    - name: serviceAreaCode
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - operator
      operationId: get_dsh_operator_platform_service_areas__serviceAreaCode_
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
    put:
      tags:
      - operator
      operationId: put_dsh_operator_platform_service_areas__serviceAreaCode_
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  schemas:
    DshZone:
      type: object
      required:
      - id
      - name
      - serviceAreaCode
      - isActive
      - description
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        serviceAreaCode:
          type: string
        isActive:
          type: boolean
        description:
          type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DshCreateZoneInput:
      type: object
      additionalProperties: false
      required:
      - name
      - serviceAreaCode
      - reason
      properties:
        id:
          type: string
          description: Optional stable code used as the DSH service-area identifier.
        name:
          type: string
          minLength: 2
          maxLength: 160
        serviceAreaCode:
          type: string
          minLength: 1
          maxLength: 80
          description: Governed service-area code from dsh_service_area_geofences bound to this operational zone.
        description:
          type: string
          maxLength: 1000
        reason:
          type: string
          minLength: 3
          maxLength: 500
    DshUpdateZoneInput:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - reason
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        description:
          type: string
          maxLength: 1000
        isActive:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 3
          maxLength: 500
    DshSlaRule:
      type: object
      required:
      - id
      - zoneId
      - category
      - maxPrepMins
      - maxDeliveryMins
      - version
      - updatedBy
      - updatedAt
      properties:
        id:
          type: string
        zoneId:
          type: string
        category:
          type: string
        maxPrepMins:
          type: integer
        maxDeliveryMins:
          type: integer
        version:
          type: integer
          minimum: 1
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    DshCapacityConfig:
      type: object
      required:
      - id
      - zoneId
      - maxConcurrentOrders
      - maxCaptainsOnline
      - throttleThreshold
      - version
      - updatedBy
      - updatedAt
      properties:
        id:
          type: string
        zoneId:
          type: string
        maxConcurrentOrders:
          type: integer
        maxCaptainsOnline:
          type: integer
        throttleThreshold:
          type: number
          minimum: 0
          maximum: 1
        version:
          type: integer
          minimum: 1
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    DshZoneServiceability:
      type: object
      required:
      - zoneId
      - isActive
      - activeStores
      - slaAvailable
      properties:
        zoneId:
          type: string
        isActive:
          type: boolean
        activeStores:
          type: integer
          minimum: 0
        slaAvailable:
          type: boolean
    DshStoreOnboardingFeePolicy:
      type: object
      additionalProperties: false
      required:
      - enabled
      - amountMinorUnits
      - currency
      - appliesTo
      - chargeTiming
      - actorCharged
      - notes
      - updatedBy
      - updatedAt
      - version
      - isConfigured
      properties:
        enabled:
          type: boolean
        amountMinorUnits:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        appliesTo:
          type: string
          enum:
          - first_store
          - additional_store
          - all_stores
        chargeTiming:
          type: string
          enum:
          - on_approval
          - on_publication
          - on_first_order
          - manual
        actorCharged:
          type: string
          enum:
          - partner
        effectiveFrom:
          type:
          - string
          - 'null'
          format: date-time
        notes:
          type: string
          maxLength: 1000
        updatedBy:
          type: string
          maxLength: 200
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
        isConfigured:
          type: boolean
        blockedReason:
          type: string
          enum:
          - POLICY_NOT_CONFIGURED
    DshStoreOnboardingFeePolicyInput:
      type: object
      additionalProperties: false
      required:
      - enabled
      - amountMinorUnits
      - currency
      - appliesTo
      - chargeTiming
      - expectedVersion
      - reason
      properties:
        enabled:
          type: boolean
        amountMinorUnits:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        appliesTo:
          type: string
          enum:
          - first_store
          - additional_store
          - all_stores
        chargeTiming:
          type: string
          enum:
          - on_approval
          - on_publication
          - on_first_order
          - manual
        effectiveFrom:
          type:
          - string
          - 'null'
          format: date-time
        notes:
          type: string
          maxLength: 1000
        expectedVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    DshError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DshError'
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DshError'
    Forbidden:
      description: Permission required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DshError'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DshError'
    Conflict:
      description: Version or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DshError'
