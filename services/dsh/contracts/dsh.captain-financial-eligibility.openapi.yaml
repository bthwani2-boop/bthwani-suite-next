openapi: 3.1.0
x-bthwani-owner: services/dsh
info:
  title: BThwani DSH Captain Financial Eligibility API
  version: 1.1.0
  description: >-
    OperatorContext-scoped WLT financial eligibility decision projection for
    dispatch gating. WLT owns wallet state, balances, currency, thresholds,
    and financial policy. DSH stores only opaque WLT decision metadata and a
    short-lived eligibility boolean for assignment gating.
servers:
  - url: /api/dsh
paths:
  /dsh/operator/platform/dispatch-balance-policy:
    get:
      operationId: getDispatchBalancePolicy
      summary: Retired DSH dispatch-balance policy endpoint; WLT owns this policy.
      tags: [DispatchFinancialEligibility]
      responses:
        '410': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
    put:
      operationId: upsertDispatchBalancePolicy
      summary: Retired DSH dispatch-balance policy mutation; WLT owns this policy.
      tags: [DispatchFinancialEligibility]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '410': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /dsh/operator/dispatch/captains/{captainId}/financial-eligibility:
    parameters:
      - $ref: '#/components/parameters/CaptainId'
    get:
      operationId: getOperatorCaptainFinancialEligibility
      tags: [DispatchFinancialEligibility]
      responses:
        '200': { $ref: '#/components/responses/EligibilityResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /dsh/operator/dispatch/captains/{captainId}/financial-eligibility/refresh:
    parameters:
      - $ref: '#/components/parameters/CaptainId'
      - $ref: '#/components/parameters/CorrelationId'
    post:
      operationId: refreshOperatorCaptainFinancialEligibility
      tags: [DispatchFinancialEligibility]
      responses:
        '200': { $ref: '#/components/responses/EligibilityResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /dsh/captain/dispatch/financial-eligibility:
    get:
      operationId: getOwnCaptainFinancialEligibility
      tags: [DispatchFinancialEligibility]
      responses:
        '200': { $ref: '#/components/responses/EligibilityResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /dsh/captain/dispatch/financial-eligibility/refresh:
    post:
      operationId: refreshOwnCaptainFinancialEligibility
      tags: [DispatchFinancialEligibility]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { $ref: '#/components/responses/EligibilityResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CaptainId:
      name: captainId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, minLength: 8 }
  responses:
    ErrorResponse:
      description: Governed error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EligibilityResponse:
      description: Short-lived WLT-owned captain financial eligibility decision projection.
      content:
        application/json:
          schema:
            type: object
            required: [ financialEligibility ]
            properties:
              financialEligibility: { $ref: '#/components/schemas/CaptainFinancialEligibility' }
  schemas:
    Error:
      type: object
      required: [ code, message ]
      properties:
        code: { type: string }
        message: { type: string }
    CaptainFinancialEligibility:
      type: object
      required:
        - operatorContextId
        - captainId
        - wltDecisionId
        - wltReasonCode
        - wltPolicyVersion
        - eligible
        - snapshotReference
        - checkedAt
        - evaluatedAt
        - expiresAt
      properties:
        operatorContextId: { type: string, minLength: 1 }
        captainId: { type: string, minLength: 1 }
        wltDecisionId: { type: string, minLength: 1 }
        wltReasonCode: { type: string, minLength: 1 }
        wltPolicyVersion: { type: string, minLength: 1 }
        eligible: { type: boolean }
        ineligibilityReason: { type: string }
        snapshotReference: { type: string, minLength: 1 }
        checkedAt: { type: string, format: date-time }
        evaluatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
x-bthwani-service: dsh
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-financial-boundary: WLT_DECISION_REFERENCE_ONLY
