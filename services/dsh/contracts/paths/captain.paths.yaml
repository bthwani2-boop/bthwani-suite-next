      required: true
      content:
        application/json:
          schema:
            $ref: "../dsh.openapi.yaml#/components/schemas/CaptainPickupReadinessRequest"
    responses:
      "200":
        description: Pickup readiness report recorded.
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/DshStoreActionResponse"
      "400":
        $ref: "../dsh.openapi.yaml#/components/responses/InvalidRequest"
