    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: []
            properties:
              settlementCycleDays: { type: integer, minimum: 1 }
              minimumSettlementAmountMinorUnits: { type: integer, minimum: 0 }
              currency: { type: string }
    responses:
      "200":
