# BThwani DSH OpenAPI path-items module: home-discovery.
# Source of truth. Referenced by ../dsh.openapi.yaml; do not add an openapi root here.

/dsh/home-discovery:
  get:
    operationId: getDshHomeDiscovery
    security: []
    summary: Return home discovery payload for the client home screen.
    tags:
      - DshHomeDiscovery
    parameters:
      - name: cityCode
        in: query
        required: false
        schema:
          type: string
        description: Filter by city code.
      - name: serviceAreaCode
        in: query
        required: false
        schema:
          type: string
        description: Filter by service area code.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        description: Maximum number of stores to return.
      - name: audienceSegment
        in: query
        required: false
        description: Resolved client audience used with city and service area targeting.
        schema:
          type: string
          enum: [guest, authenticated]
          default: guest
    responses:
      "200":
        description: Home discovery payload.
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/DshHomeDiscoveryResponse"
      "400":
        description: Invalid query parameters.
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/DshErrorResponse"
      "503":
        description: Service unavailable.
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/DshErrorResponse"

/dsh/public/reels:
  get:
    operationId: listPublicReels
    security: []
    tags: [DshHomeDiscovery]
    parameters:
      - name: limit
        in: query
        required: false
        schema: { type: integer, default: 20 }
    responses:
      "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidRequest" }
      "200":
        description: Approved reels for public home screen carousel.
        content:
          application/json:
            schema:
              type: object
              properties:
                reels:
                  type: array
                  items: { $ref: "../dsh.openapi.yaml#/components/schemas/DshPublicReel" }
