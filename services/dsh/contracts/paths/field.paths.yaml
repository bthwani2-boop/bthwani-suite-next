# BThwani DSH OpenAPI path-items module: field.
# Source of truth. Referenced by ../dsh.openapi.yaml; do not add an openapi root here.

/dsh/field/me/readiness:
  get:
    operationId: getDshFieldSelfReadiness
    summary: Return the authenticated field agent's DSH start-work readiness.
    description: Workforce activation is composed at this DSH boundary. Store and visit prerequisites remain action-specific and are enforced by their canonical handlers.
    tags: [ DshFieldReadiness ]
    security: [ { bearerAuth: [] } ]
    responses:
      "200":
        description: Field start-work readiness returned successfully.
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DshFieldOperationalReadiness" }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
      "503": { $ref: "../dsh.openapi.yaml#/components/responses/ServiceUnavailable" }

/dsh/field/stores/{storeId}/verifications:
  post:
    operationId: submitFieldStoreVerification
    summary: Submit a verification outcome for the authenticated field actor's
      assigned store.
    tags: [ DshStoreGovernance ]
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKey"
      - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../dsh.openapi.yaml#/components/schemas/FieldStoreVerificationRequest"
    responses:
      "200":
        description: Verification recorded.
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/DshStoreActionResponse"
      "400":
        $ref: "../dsh.openapi.yaml#/components/responses/InvalidRequest"
      "401":
        $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
      "403":
        $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../dsh.openapi.yaml#/components/responses/Conflict"

/dsh/field/partners/{partnerId}/collaboration/read:
  post:
    operationId: markDshFieldOnboardingCollaborationRead
    summary: Advance the field actor read cursor for an onboarding thread.
    tags: [DshPartnerActivation]
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: partnerId, in: path, required: true, schema: { type: string } }
      - { name: threadId, in: query, required: true, schema: { type: string, format: uuid } }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [sequence]
            properties:
              sequence: { type: integer, minimum: 0 }
    responses:
      "200": { description: Read cursor advanced. }
      "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }

/dsh/field/onboarding/workload:
