  patch:
    operationId: updateFieldPartnerStore
    summary: Field agent updates first-store draft data without publishing it to
      clients.
    tags: [ DshPartnerActivation ]
    security:
      - bearerAuth: []
    parameters:
      - name: partnerId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            {
              $ref: "../dsh.openapi.yaml#/components/schemas/DshUpdateFieldPartnerStoreDraftR\
                equest"
            }
    responses:
      "200":
        description: Store draft updated.
        content:
          application/json:
            schema:
              type: object
              required: [ storeId, store, audit ]
              properties:
                storeId: { type: string }
                store: { $ref: "../dsh.openapi.yaml#/components/schemas/DshFieldPartnerStoreDraft" }
                audit: { type: object }
      "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidRequest" }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }

/dsh/field/partners/{partnerId}/documents:
  get:
    operationId: listFieldPartnerDocuments
    summary: Field agent lists documents uploaded for a partner draft it owns.
    tags: [ DshPartnerActivation ]
    security:
      - bearerAuth: []
    parameters:
      - name: partnerId
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Partner documents.
        content:
          application/json:
            schema:
              type: object
              required: [ documents ]
              properties:
                documents:
                  type: array
                  items: { $ref: "../dsh.openapi.yaml#/components/schemas/DshPartnerDocument" }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
  post:
    operationId: uploadFieldPartnerDocument
    summary: Field agent uploads a document for partner onboarding.
    tags: [ DshPartnerActivation ]
    security:
      - bearerAuth: []
    parameters:
      - name: partnerId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DshAddPartnerDocumentRequest" }
    responses:
      "201":
        description: Document uploaded.
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DshPartnerDocument" }
      "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidRequest" }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }

/dsh/field/media/uploads:
  post:
    operationId: uploadFieldMedia
    summary: Field agent uploads a legal document or visit evidence and receives a mediaRef.
    tags: [ DshPartnerActivation ]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            oneOf:
              - required: [ partnerId, file ]
              - required: [ storeId, file ]
            properties:
              partnerId: { type: string }
              storeId: { type: string }
              mediaKind:
                type: string
                enum: [legal_document, visit_evidence]
              file: { type: string, format: binary }
    responses:
      "201":
        description: Media uploaded.
        content:
          application/json:
            schema:
              type: object
              required: [ mediaRef ]
              properties:
                mediaRef: { type: string }
      "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidRequest" }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }

/dsh/field/partners/{partnerId}/visits:
  post:
    operationId: createFieldPartnerVisit
    summary: Field agent records a partner-level onboarding visit.
    tags: [ DshPartnerActivation ]
    security:
      - bearerAuth: []
    parameters:
      - name: partnerId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            {
              $ref: "../dsh.openapi.yaml#/components/schemas/DshCreatePartnerFieldVisitReques\
                t"
            }
    responses:
      "201":
        description: Partner field visit recorded.
