    responses:
      "201":
        description: Document uploaded.
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DshPartnerDocument" }
      "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidRequest" }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }

/dsh/field/media/uploads:
  post:
    operationId: uploadFieldMedia
    summary: Field agent uploads a legal document or visit evidence and receives a mediaRef.
    tags: [ DshPartnerActivation ]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            oneOf:
              - required: [ partnerId, file ]
              - required: [ storeId, file ]
            properties:
              partnerId: { type: string }
              storeId: { type: string }
              mediaKind:
                type: string
                enum: [legal_document, visit_evidence]
              file: { type: string, format: binary }
    responses:
      "201":
        description: Media uploaded.
        content:
          application/json:
            schema:
              type: object
              required: [ mediaRef ]
              properties:
                mediaRef: { type: string }
      "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidRequest" }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }

/dsh/field/partners/{partnerId}/visits:
  post:
    operationId: createFieldPartnerVisit
    summary: Field agent records a partner-level onboarding visit.
    tags: [ DshPartnerActivation ]
    security:
      - bearerAuth: []
    parameters:
      - name: partnerId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            {
              $ref: "../dsh.openapi.yaml#/components/schemas/DshCreatePartnerFieldVisitReques\
                t"
            }
    responses:
      "201":
        description: Partner field visit recorded.
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DshPartnerFieldVisit" }
      "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidRequest" }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }

/dsh/field/partners/{partnerId}/field-visits:
  get:
    operationId: listFieldPartnerFieldVisits
    summary: Field agent lists field visits recorded for a partner draft it owns.
    tags: [ DshPartnerActivation ]
    security:
      - bearerAuth: []
    parameters:
      - name: partnerId
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Partner field visits.
        content:
          application/json:
            schema:
              type: object
              required: [ visits ]
              properties:
                visits:
                  type: array
                  items: { $ref: "../dsh.openapi.yaml#/components/schemas/DshPartnerFieldVisit" }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }

/dsh/field/partners/{partnerId}/submit:
  post:
    operationId: submitFieldPartnerDraft
    summary: Field agent submits partner draft for review.
    tags: [ DshPartnerActivation ]
    security:
      - bearerAuth: []
    parameters:
      - name: partnerId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason: { type: string }
    responses:
      "200":
        description: Partner submitted.
        content:
          application/json:
            schema:
              type: object
              properties:
                partner: { $ref: "../dsh.openapi.yaml#/components/schemas/DshPartner" }
                event: { $ref: "../dsh.openapi.yaml#/components/schemas/DshPartnerAuditEvent" }
      "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidRequest" }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
      "422":
        description: Invalid transition.

/dsh/operator/field-onboarding-assignments:
  get:
    operationId: listOperatorFieldOnboardingAssignments
    summary: List field onboarding assignments in the authenticated operator context.
    tags: [ DshFieldOnboardingAssignment ]
    security: [{ bearerAuth: [] }]
    responses:
      "200":
        description: Assignment list.
        content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DshFieldOnboardingAssignmentListResponse" } } }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
  post:
    operationId: createFieldOnboardingAssignment
    summary: Assign a minimal onboarding lead to an active field worker.
    tags: [ DshFieldOnboardingAssignment ]
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DshCreateFieldOnboardingAssignmentRequest" } } }
    responses:
      "201":
        description: Assignment created.
        content: { application/json: { schema: { type: object, required: [assignment], properties: { assignment: { $ref: "../dsh.openapi.yaml#/components/schemas/DshFieldOnboardingAssignment" } } } } }
      "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidRequest" }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
      "503": { $ref: "../dsh.openapi.yaml#/components/responses/ServiceUnavailable" }

/dsh/operator/field-onboarding-assignments/{assignmentId}/reassign:
  post:
    operationId: reassignFieldOnboardingAssignment
    summary: Reassign an unopened onboarding assignment to another active field worker.
    tags: [ DshFieldOnboardingAssignment ]
    security: [{ bearerAuth: [] }]
    parameters: [{ name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DshReassignFieldOnboardingAssignmentRequest" } } }
    responses:
      "200": { description: Assignment reassigned. }
      "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidRequest" }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
      "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
      "503": { $ref: "../dsh.openapi.yaml#/components/responses/ServiceUnavailable" }

/dsh/operator/field-onboarding-assignments/{assignmentId}/cancel:
  post:
    operationId: cancelFieldOnboardingAssignment
    summary: Cancel an unopened onboarding assignment while preserving history.
    tags: [ DshFieldOnboardingAssignment ]
    security: [{ bearerAuth: [] }]
    parameters: [{ name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DshFieldOnboardingAssignmentTransitionRequest" } } }
    responses:
      "200": { description: Assignment cancelled. }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
      "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

/dsh/field/onboarding-assignments:
  get:
    operationId: listFieldOnboardingAssignments
    summary: List assignments owned by the authenticated field worker.
    tags: [ DshFieldOnboardingAssignment ]
    security: [{ bearerAuth: [] }]
    responses:
      "200":
        description: Field assignment list.
        content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DshFieldOnboardingAssignmentListResponse" } } }
      "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
      "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
      "503": { $ref: "../dsh.openapi.yaml#/components/responses/ServiceUnavailable" }

/dsh/field/onboarding-assignments/{assignmentId}:
  get:
    operationId: getFieldOnboardingAssignment
    summary: Read one field-owned onboarding assignment.
