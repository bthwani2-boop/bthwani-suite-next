openapi: 3.1.0
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-owner: services/dsh
x-bthwani-capability: administration-governance
info:
  title: DSH Administration Governance API
  version: 2.0.0
  description: Governed roles, maker-checker approvals, append-only audit, rollback,
    and privacy-safe diagnostics.
servers:
- url: /dsh
paths:
  /dsh/operator/admin/support-sessions:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_admin_support_sessions
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-bthwani-required-scope: support.read
      security:
      - bearerAuth: []
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_support_sessions
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-bthwani-required-scope: support.manage
      security:
      - bearerAuth: []
  /dsh/operator/admin/support/snapshot:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_admin_support_snapshot
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-bthwani-required-scope: support.read
      security:
      - bearerAuth: []
  /dsh/operator/admin/support-sessions/{requestId}/review:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_support_sessions__requestId__review
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-bthwani-required-scope: support.manage
      security:
      - bearerAuth: []
  /dsh/operator/admin/support-sessions/{requestId}/revoke:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_support_sessions__requestId__revoke
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-bthwani-required-scope: support.manage
      security:
      - bearerAuth: []
  /dsh/operator/admin/approvals/{approvalId}/review:
    parameters:
    - name: approvalId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_approvals__approvalId__review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalReviewInput'
      responses:
        '200':
          description: Reviewed role assignment decision and canonical Identity readback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentReviewResponse'
        '400':
          description: Invalid review input or separation-of-duties violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '404':
          description: Review target was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '409':
          description: Request state conflict, canonical mutation is reconciling, or canonical mutation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '500':
          description: Internal administration failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '503':
          description: Identity is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
      x-bthwani-required-scope: administration.staff.approve
      security:
      - bearerAuth: []
  /dsh/operator/admin/approvals/{approvalId}/rollback-requests:
    parameters:
    - name: approvalId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_approvals__approvalId__rollback_requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequestInput'
      responses:
        '200':
          description: Fresh pending rollback maker request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackCreateResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-bthwani-required-scope: administration.rollback.request
      security:
      - bearerAuth: []
  /dsh/operator/admin/role-requests/{requestId}/review:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_role_requests__requestId__review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalReviewInput'
      responses:
        '200':
          description: Reviewed role definition decision and canonical role readback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinitionReviewResponse'
        '400':
          description: Invalid review input or separation-of-duties violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '404':
          description: Review target was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '409':
          description: Request state conflict, canonical mutation is reconciling, or canonical mutation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '500':
          description: Internal administration failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '503':
          description: Identity is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
      x-bthwani-required-scope: administration.role.approve
      security:
      - bearerAuth: []
  /dsh/operator/admin/permission-vocabulary:
    get:
      tags: [operator]
      operationId: get_dsh_operator_admin_permission_vocabulary
      responses:
        '200':
          description: Canonical Identity permission vocabulary for DSH control-panel roles.
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermissionVocabularyEntry'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '503': { description: Identity unavailable }
      x-bthwani-required-scope: administration.role.request
      security:
      - bearerAuth: []
  /dsh/operator/admin/roles:
    get:
      tags: [operator]
      operationId: listDshAdminRoles
      responses:
        '200':
          description: Canonical Identity-owned role definitions projected as action strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesListResponse'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '503': { description: Identity unavailable }
      x-bthwani-required-scope: administration.role.read
      security:
      - bearerAuth: []
  /dsh/operator/admin/staff:
    get:
      tags: [operator]
      operationId: listDshAdminStaff
      responses:
        '200':
          description: Canonical Identity effective staff projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffListResponse'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '503': { description: Identity unavailable }
      x-bthwani-required-scope: administration.staff.read
      security:
      - bearerAuth: []
  /dsh/operator/admin/staff/{staffId}/roles:
    parameters:
    - $ref: '#/components/parameters/StaffId'
    post:
      tags: [operator]
      operationId: assignDshStaffRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChangeRequestInput'
      responses:
        '200':
          description: Fresh pending maker request; no role authority is granted by this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentCreateResponse'
        '400': { description: Invalid request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Canonical role not found }
        '409': { description: Conflicting pending request }
        '503': { description: Identity unavailable }
      x-bthwani-required-scope: administration.staff.request
      security:
      - bearerAuth: []
  /dsh/operator/admin/audit:
    get:
      tags: [operator]
      operationId: listDshAdminAudit
      parameters:
      - name: actorId
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Privacy-safe append-only administration audit envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
      x-bthwani-required-scope: administration.audit.read
      security:
      - bearerAuth: []
  /dsh/operator/admin/roles/requests:
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_roles_requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleDefinitionRequestInput'
      responses:
        '200':
          description: Fresh pending role-definition maker request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinitionCreateResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-bthwani-required-scope: administration.role.request
      security:
      - bearerAuth: []
  /dsh/operator/admin/role-requests/{requestId}/replacements:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags: [operator]
      operationId: post_dsh_operator_admin_role_requests__requestId__replacements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalFailureReplacementInput'
      responses:
        '200':
          description: Old failed-terminal request superseded and a fresh pending maker request created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinitionCreateResponse'
        '400': { description: Invalid replacement input }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Request or canonical role not found }
        '409': { description: Version or lifecycle conflict }
        '503': { description: Identity unavailable }
      x-bthwani-required-scope: administration.role.request
      security:
      - bearerAuth: []
  /dsh/operator/admin/approvals/{approvalId}/replacements:
    parameters:
    - $ref: '#/components/parameters/ApprovalId'
    post:
      tags: [operator]
      operationId: post_dsh_operator_admin_approvals__approvalId__replacements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalFailureReplacementInput'
      responses:
        '200':
          description: Old failed-terminal assignment request superseded and a fresh pending maker request created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentCreateResponse'
        '400': { description: Invalid replacement input }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Request or canonical role not found }
        '409': { description: Version or lifecycle conflict }
        '503': { description: Identity unavailable }
      x-bthwani-required-scope: administration.staff.request
      security:
      - bearerAuth: []
  /dsh/operator/admin/rollback-requests/{requestId}/replacements:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    post:
      tags: [operator]
      operationId: post_dsh_operator_admin_rollback_requests__requestId__replacements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalFailureReplacementInput'
      responses:
        '200':
          description: Old failed-terminal rollback request superseded and a fresh pending maker request created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackCreateResponse'
        '400': { description: Invalid replacement input }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Request or canonical role not found }
        '409': { description: Version or lifecycle conflict }
        '503': { description: Identity unavailable }
      x-bthwani-required-scope: administration.rollback.request
      security:
      - bearerAuth: []
  /dsh/operator/admin/rollback-requests/{requestId}/review:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_rollback_requests__requestId__review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalReviewInput'
      responses:
        '200':
          description: Reviewed rollback decision and canonical lifecycle readback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackReviewResponse'
        '400':
          description: Invalid review input or separation-of-duties violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '404':
          description: Review target was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '409':
          description: Request state conflict, canonical mutation is reconciling, or canonical mutation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '500':
          description: Internal administration failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '503':
          description: Identity is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
      x-bthwani-required-scope: administration.rollback.approve
      security:
      - bearerAuth: []
  /dsh/operator/admin/approvals:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_admin_approvals
      parameters:
      - $ref: '#/components/parameters/ApprovalStatus'
      responses:
        '200':
          description: Role-assignment approval requests matching the optional status filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-bthwani-required-scope: administration.staff.approve
      security:
      - bearerAuth: []
  /dsh/operator/admin/diagnostics:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_admin_diagnostics
      responses:
        '200':
          description: Privacy-safe administration diagnostics and lifecycle counts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [diagnostics]
                properties:
                  diagnostics:
                    $ref: '#/components/schemas/AdministrationDiagnostics'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-bthwani-required-scope: administration.diagnostics.read
      security:
      - bearerAuth: []
  /dsh/operator/admin/role-requests:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_admin_role_requests
      parameters:
      - $ref: '#/components/parameters/ApprovalStatus'
      responses:
        '200':
          description: Role-definition requests matching the optional status filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinitionListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-bthwani-required-scope: administration.role.approve
      security:
      - bearerAuth: []
  /dsh/operator/admin/rollback-requests:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_admin_rollback_requests
      parameters:
      - $ref: '#/components/parameters/ApprovalStatus'
      responses:
        '200':
          description: Rollback requests matching the optional status filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-bthwani-required-scope: administration.rollback.approve
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ApprovalStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ApprovalStatus'
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    ApprovalStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - superseded
    MutationExecutionStatus:
      type: string
      enum:
      - not_started
      - pending
      - reconciling
      - retryable_failure
      - failed_terminal
      - applied
    AdministrationSurface:
      type: string
      enum:
      - control-panel
    RoleChangeAction:
      type: string
      enum:
      - staff_role_assignment
      - staff_role_revocation
    Role:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - permissions
      - surfaces
      - active
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          pattern: ^[a-z][a-z0-9_-]{2,79}$
        description:
          type: string
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionAction'
        surfaces:
          type: array
          minItems: 1
          uniqueItems: true
          contains:
            const: control-panel
          items:
            $ref: '#/components/schemas/AdministrationSurface'
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PermissionAction:
      type: string
      minLength: 1
      pattern: ^[a-z][a-z0-9._:-]*$
    PermissionVocabularyEntry:
      type: object
      additionalProperties: false
      required: [id, service, surface, action, description]
      properties:
        id: { type: string }
        service: { type: string }
        surface: { type: string }
        action: { type: string }
        description: { type: string }
    RoleDefinitionRequestInput:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - active
      - permissions
      - reason
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_-]{2,79}$
        description:
          type: string
          maxLength: 1000
        active:
          type: boolean
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionAction'
        reason:
          type: string
          minLength: 5
          maxLength: 1000
    RoleDefinitionRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - roleName
      - description
      - active
      - permissions
      - surfaces
      - expectedRoleVersion
      - requestedBy
      - reason
      - status
      - executionStatus
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        roleName:
          type: string
          pattern: ^[a-z][a-z0-9_-]{2,79}$
        description:
          type: string
        active:
          type: boolean
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionAction'
        surfaces:
          type: array
          minItems: 1
          uniqueItems: true
          contains:
            const: control-panel
          items:
            $ref: '#/components/schemas/AdministrationSurface'
        expectedRoleVersion:
          type: integer
          minimum: 0
        requestedBy:
          type: string
        reason:
          type: string
          minLength: 5
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        executionStatus:
          $ref: '#/components/schemas/MutationExecutionStatus'
        reviewedBy:
          type:
          - string
          - 'null'
        reviewNote:
          type:
          - string
          - 'null'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
