openapi: 3.1.0
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-owner: services/dsh
x-bthwani-capability: administration-governance
info:
  title: DSH Administration Governance API
  version: 2.0.0
  description: Governed roles, maker-checker approvals, append-only audit, rollback,
    and privacy-safe diagnostics.
servers:
- url: /dsh
paths:
  /dsh/operator/admin/support-sessions:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_admin_support_sessions
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: [ support.read ]
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_support_sessions
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: [ support.manage ]
  /dsh/operator/admin/support/snapshot:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_admin_support_snapshot
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: [ support.read ]
  /dsh/operator/admin/support-sessions/{requestId}/review:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_support_sessions__requestId__review
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: [ support.manage ]
  /dsh/operator/admin/support-sessions/{requestId}/revoke:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_support_sessions__requestId__revoke
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: [ support.manage ]
  /dsh/operator/admin/approvals/{approvalId}/review:
    parameters:
    - name: approvalId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_approvals__approvalId__review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalReviewInput'
      responses:
        '200':
          description: Reviewed role assignment decision and canonical Identity readback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentReviewResponse'
        '400':
          description: Invalid review input or separation-of-duties violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '404':
          description: Review target was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '409':
          description: Request state conflict, canonical mutation is reconciling, or canonical mutation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '500':
          description: Internal administration failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '503':
          description: Identity is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
      security:
      - bearerAuth: [ administration.staff.approve ]
  /dsh/operator/admin/approvals/{approvalId}/rollback-requests:
    parameters:
    - name: approvalId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_approvals__approvalId__rollback_requests
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: [ administration.rollback.request ]
  /dsh/operator/admin/role-requests/{requestId}/review:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_role_requests__requestId__review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalReviewInput'
      responses:
        '200':
          description: Reviewed role definition decision and canonical role readback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinitionReviewResponse'
        '400':
          description: Invalid review input or separation-of-duties violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '404':
          description: Review target was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '409':
          description: Request state conflict, canonical mutation is reconciling, or canonical mutation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '500':
          description: Internal administration failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '503':
          description: Identity is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
      security:
      - bearerAuth: [ administration.role.approve ]
  /dsh/operator/admin/permission-vocabulary:
    get:
      tags: [operator]
      operationId: get_dsh_operator_admin_permission_vocabulary
      responses:
        '200':
          description: Canonical Identity permission vocabulary for DSH control-panel roles.
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermissionVocabularyEntry'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '503': { description: Identity unavailable }
      security:
      - bearerAuth: [ administration.role.request ]
  /dsh/operator/admin/roles/requests:
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_roles_requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleDefinitionRequestInput'
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: [ administration.role.request ]
  /dsh/operator/admin/rollback-requests/{requestId}/review:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - operator
      operationId: post_dsh_operator_admin_rollback_requests__requestId__review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalReviewInput'
      responses:
        '200':
          description: Reviewed rollback decision and canonical lifecycle readback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackReviewResponse'
        '400':
          description: Invalid review input or separation-of-duties violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '404':
          description: Review target was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '409':
          description: Request state conflict, canonical mutation is reconciling, or canonical mutation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '500':
          description: Internal administration failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
        '503':
          description: Identity is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrationError'
      security:
      - bearerAuth: [ administration.rollback.approve ]
  /dsh/operator/admin/approvals:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_admin_approvals
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: [ administration.staff.approve ]
  /dsh/operator/admin/diagnostics:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_admin_diagnostics
      responses:
        '200':
          description: Privacy-safe administration diagnostics and lifecycle counts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [diagnostics]
                properties:
                  diagnostics:
                    $ref: '#/components/schemas/AdministrationDiagnostics'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: [ administration.diagnostics.read ]
  /dsh/operator/admin/role-requests:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_admin_role_requests
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: [ administration.role.approve ]
  /dsh/operator/admin/rollback-requests:
    get:
      tags:
      - operator
      operationId: get_dsh_operator_admin_rollback_requests
      responses:
        '200':
          description: Auto-generated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: [ administration.rollback.approve ]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ApprovalStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ApprovalStatus'
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    ApprovalStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
    MutationExecutionStatus:
      type: string
      enum:
      - not_started
      - pending
      - reconciling
      - retryable_failure
      - terminal_failure
      - applied
    AdministrationPermission:
      type: string
      minLength: 1
      description: Canonical Identity vocabulary action; the live vocabulary endpoint is authoritative.
    AdministrationSurface:
      type: string
      enum:
      - control-panel
    RoleChangeAction:
      type: string
      enum:
      - staff_role_assignment
      - staff_role_revocation
    Role:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - permissions
      - surfaces
      - active
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,79}$
        description:
          type: string
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionBinding'
        surfaces:
          type: array
          minItems: 1
          uniqueItems: true
          contains:
            const: control-panel
          items:
            $ref: '#/components/schemas/AdministrationSurface'
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PermissionBinding:
      type: object
      additionalProperties: false
      required: [service, surface, action, scope]
      properties:
        service: { type: string }
        surface: { type: string }
        action: { type: string }
        scope: { type: string }
    PermissionVocabularyEntry:
      type: object
      additionalProperties: false
      required: [id, service, surface, action, description]
      properties:
        id: { type: string }
        service: { type: string }
        surface: { type: string }
        action: { type: string }
        description: { type: string }
    RoleDefinitionRequestInput:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - active
      - permissions
      - reason
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,79}$
        description:
          type: string
          maxLength: 1000
        active:
          type: boolean
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdministrationPermission'
        reason:
          type: string
          minLength: 5
          maxLength: 1000
    RoleDefinitionRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - roleName
      - description
      - active
      - permissions
      - surfaces
      - expectedRoleVersion
      - requestedBy
      - reason
      - status
      - executionStatus
      - reviewedBy
      - reviewNote
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        roleName:
          type: string
        description:
          type: string
        active:
          type: boolean
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdministrationPermission'
        surfaces:
          type: array
          minItems: 1
          uniqueItems: true
          contains:
            const: control-panel
          items:
            $ref: '#/components/schemas/AdministrationSurface'
        expectedRoleVersion:
          type: integer
          minimum: 0
        requestedBy:
          type: string
        reason:
          type: string
          minLength: 5
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        executionStatus:
          $ref: '#/components/schemas/MutationExecutionStatus'
        reviewedBy:
          type: string
        reviewNote:
          type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
    StaffAssignment:
      type: object
      additionalProperties: false
      required:
      - id
      - actorId
      - roleName
      - assignedBy
      - assignedAt
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
        roleName:
          type: string
        assignedBy:
          type: string
        assignedAt:
          type: string
          format: date-time
    RoleChangeRequestInput:
      type: object
      additionalProperties: false
      required:
      - roleName
      - actionType
      - reason
      properties:
        roleName:
          type: string
        actionType:
          $ref: '#/components/schemas/RoleChangeAction'
        reason:
          type: string
          minLength: 5
          maxLength: 1000
    ApprovalReviewInput:
      type: object
      additionalProperties: false
      required:
      - decision
      - reviewNote
      - expectedVersion
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
        reviewNote:
          type: string
          maxLength: 1000
        expectedVersion:
          type: integer
          minimum: 1
    AdministrationError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
          - INVALID_JSON
          - INVALID_REQUEST
          - SEPARATION_OF_DUTIES_VIOLATION
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - REQUEST_STATE_CONFLICT
          - CANONICAL_MUTATION_FAILED
          - CANONICAL_MUTATION_RECONCILING
          - INTERNAL_ERROR
          - IDENTITY_UNAVAILABLE
        message:
          type: string
          minLength: 1
    CanonicalRoleAssignment:
      type: object
      additionalProperties: false
      required: [actorId, roleId, roleName, grantedBy]
      properties:
        actorId:
          type: string
        roleId:
          type: string
        roleName:
          type: string
        grantedBy:
          type: string
    RoleDefinitionReviewResponse:
      type: object
      additionalProperties: false
      required: [request, role]
      properties:
        request:
          $ref: '#/components/schemas/RoleDefinitionRequest'
        role:
          oneOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
    RoleAssignmentReviewResponse:
      type: object
      additionalProperties: false
      required: [approval, assignment]
      properties:
        approval:
          $ref: '#/components/schemas/RoleAssignmentApproval'
        assignment:
          oneOf:
          - $ref: '#/components/schemas/CanonicalRoleAssignment'
          - type: 'null'
    RollbackReviewResponse:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request:
          $ref: '#/components/schemas/RollbackRequest'
    RoleAssignmentApproval:
      type: object
      additionalProperties: false
      required:
      - id
      - actionType
      - targetActorId
      - roleName
      - requestedBy
      - reason
      - status
      - executionStatus
      - reviewedBy
      - reviewNote
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        actionType:
          $ref: '#/components/schemas/RoleChangeAction'
        targetActorId:
          type: string
        roleName:
          type: string
        requestedBy:
          type: string
        reason:
          type: string
          minLength: 5
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        executionStatus:
          $ref: '#/components/schemas/MutationExecutionStatus'
        reviewedBy:
          type: string
        reviewNote:
          type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
    RollbackRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - sourceApprovalId
      - sourceActionType
      - inverseActionType
      - targetActorId
      - roleName
      - requestedBy
      - reason
      - status
      - executionStatus
      - reviewedBy
      - reviewNote
      - version
      - createdAt
      - updatedAt
      - sourceApprovedBy
      properties:
        id:
          type: string
          format: uuid
        sourceApprovalId:
          type: string
          format: uuid
        sourceActionType:
          $ref: '#/components/schemas/RoleChangeAction'
        inverseActionType:
          $ref: '#/components/schemas/RoleChangeAction'
        targetActorId:
          type: string
        roleName:
          type: string
        requestedBy:
          type: string
        reason:
          type: string
          minLength: 5
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        executionStatus:
          $ref: '#/components/schemas/MutationExecutionStatus'
        reviewedBy:
          type: string
        reviewNote:
          type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
        sourceApprovedBy:
          type: string
    AdministrationDiagnostics:
      type: object
      additionalProperties: false
      required:
      - status
      - activeRoleCount
      - approvedAssignmentCount
      - pendingRoleDefinitionCount
      - pendingRoleAssignmentCount
      - pendingRollbackCount
      - recentRestrictedAuditCount
      - generatedAt
      properties:
        status:
          type: string
          enum:
          - healthy
          - attention
        activeRoleCount:
          type: integer
          minimum: 0
        approvedAssignmentCount:
          type: integer
          minimum: 0
        pendingRoleDefinitionCount:
          type: integer
          minimum: 0
        pendingRoleAssignmentCount:
          type: integer
          minimum: 0
        pendingRollbackCount:
          type: integer
          minimum: 0
        recentRestrictedAuditCount:
          type: integer
          minimum: 0
        generatedAt:
          type: string
          format: date-time
        details:
          type: string
          description: Sanitized component-level diagnostic detail without PII, credentials, or secrets.
    AuditEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - actorId
      - action
      - targetId
      - detail
      - sensitivity
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
        action:
          type: string
