components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ApprovalStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ApprovalStatus'
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    ApprovalStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
    AdministrationPermission:
      type: string
      enum:
      - administration.read
      - administration.manage
      - administration.approve
      - administration.role.request
      - administration.role.approve
      - administration.staff.request
      - administration.staff.approve
      - administration.audit.read
      - administration.diagnostics.read
      - administration.rollback.request
      - administration.rollback.approve
    AdministrationSurface:
      type: string
      enum:
      - control-panel
      - app-client
      - app-partner
      - app-captain
      - app-field
      - webapp
      - website
    RoleChangeAction:
      type: string
      enum:
      - staff_role_assignment
      - staff_role_revocation
    Role:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - permissions
      - surfaces
      - active
      - version
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,79}$
        description:
          type: string
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdministrationPermission'
        surfaces:
          type: array
          minItems: 1
          uniqueItems: true
          contains:
            const: control-panel
          items:
            $ref: '#/components/schemas/AdministrationSurface'
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    RoleDefinitionRequestInput:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - permissions
      - surfaces
      - reason
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,79}$
        description:
          type: string
          maxLength: 1000
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdministrationPermission'
        surfaces:
          type: array
          minItems: 1
          uniqueItems: true
          contains:
            const: control-panel
          items:
            $ref: '#/components/schemas/AdministrationSurface'
        reason:
          type: string
          minLength: 5
          maxLength: 1000
    RoleDefinitionRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - roleName
      - description
      - permissions
      - surfaces
      - requestedBy
      - reason
      - status
      - reviewedBy
      - reviewNote
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        roleName:
          type: string
        description:
          type: string
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdministrationPermission'
        surfaces:
          type: array
          minItems: 1
          uniqueItems: true
          contains:
            const: control-panel
          items:
            $ref: '#/components/schemas/AdministrationSurface'
        requestedBy:
          type: string
        reason:
          type: string
          minLength: 5
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        reviewedBy:
          type: string
        reviewNote:
          type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
    StaffAssignment:
      type: object
      additionalProperties: false
      required:
      - id
      - actorId
      - roleId
      - roleName
      - assignedBy
      - assignedAt
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        assignedBy:
          type: string
        assignedAt:
          type: string
          format: date-time
    RoleChangeRequestInput:
      type: object
      additionalProperties: false
      required:
      - roleId
      - actionType
      - reason
      properties:
        roleId:
          type: string
          format: uuid
        actionType:
          $ref: '#/components/schemas/RoleChangeAction'
        reason:
          type: string
          minLength: 5
          maxLength: 1000
    ApprovalReviewInput:
      type: object
      additionalProperties: false
      required:
      - decision
      - reviewNote
      - expectedVersion
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
        reviewNote:
          type: string
          maxLength: 1000
        expectedVersion:
          type: integer
          minimum: 1
    RoleAssignmentApproval:
      type: object
      additionalProperties: false
      required:
      - id
      - actionType
      - targetActorId
      - roleId
      - roleName
      - requestedBy
      - reason
      - status
      - reviewedBy
      - reviewNote
      - version
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        actionType:
          $ref: '#/components/schemas/RoleChangeAction'
        targetActorId:
          type: string
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        requestedBy:
          type: string
        reason:
          type: string
          minLength: 5
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        reviewedBy:
          type: string
        reviewNote:
          type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
    RollbackRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - sourceApprovalId
      - sourceActionType
      - inverseActionType
      - targetActorId
      - roleId
      - roleName
      - requestedBy
      - reason
      - status
      - reviewedBy
      - reviewNote
      - version
      - createdAt
      - updatedAt
      - sourceApprovedBy
      properties:
        id:
          type: string
          format: uuid
        sourceApprovalId:
          type: string
          format: uuid
        sourceActionType:
          $ref: '#/components/schemas/RoleChangeAction'
        inverseActionType:
          $ref: '#/components/schemas/RoleChangeAction'
        targetActorId:
          type: string
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        requestedBy:
          type: string
        reason:
          type: string
          minLength: 5
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        reviewedBy:
          type: string
        reviewNote:
          type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewedAt:
          type:
          - string
          - 'null'
          format: date-time
        sourceApprovedBy:
          type: string
    AdministrationDiagnostics:
      type: object
      additionalProperties: false
      required:
      - status
      - activeRoleCount
      - approvedAssignmentCount
      - pendingRoleDefinitionCount
      - pendingRoleAssignmentCount
      - pendingRollbackCount
      - recentRestrictedAuditCount
      - generatedAt
      properties:
        status:
          type: string
          enum:
          - healthy
          - attention
        activeRoleCount:
          type: integer
          minimum: 0
        approvedAssignmentCount:
          type: integer
          minimum: 0
        pendingRoleDefinitionCount:
          type: integer
          minimum: 0
        pendingRoleAssignmentCount:
          type: integer
          minimum: 0
        pendingRollbackCount:
          type: integer
          minimum: 0
        recentRestrictedAuditCount:
          type: integer
          minimum: 0
        generatedAt:
          type: string
          format: date-time
    AuditEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - actorId
      - action
      - targetId
      - detail
      - sensitivity
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
        action:
          type: string
        targetId:
          type: string
        detail:
          type: string
          description: Redacted allowlisted metadata only; never raw reason, review
            note, phone, credential, document, token, or secret.
        sensitivity:
          type: string
          enum:
          - internal
          - restricted
        createdAt:
          type: string
          format: date-time
