# Bounded-context contract manifest.
# Owns DSH contract composition and generated-client materialization metadata.

context: services/dsh
entry: ./dsh.openapi.yaml
owner: services/dsh
contractState: CONTRACT_ACTIVE
layout: MODULAR
bundle: ./generated/dsh.bundle.openapi.yaml
client: ../clients/generated/dsh-api.ts
regenerateScript: pnpm run openapi:generate:dsh
modules:
