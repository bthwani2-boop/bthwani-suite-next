  - ./dsh.analytics-extensions.openapi.yaml
  - ./dsh.captain-financial-eligibility.openapi.yaml
  - ./dsh.catalog-governance.openapi.yaml
  - ./dsh.checkout.openapi.yaml
  - ./dsh.client-address-privacy.openapi.yaml
  - ./dsh.client-address.openapi.yaml
  - ./dsh.client-map.openapi.yaml
  - ./dsh.delivery-proof-completion.openapi.yaml
  - ./dsh.delivery-proof-media.openapi.yaml
  - ./dsh.dispatch-governance.openapi.yaml
  - ./dsh.home-marketing-events.openapi.yaml
  - ./dsh.home-marketing-governance.openapi.yaml
  - ./dsh.incident-governance.openapi.yaml
  - ./dsh.live-tracking.openapi.yaml
  - ./dsh.marketing-commercial.openapi.yaml
  - ./dsh.notifications-governance.openapi.yaml
  - ./dsh.operational-policy.openapi.yaml
  - ./dsh.order-rescue.openapi.yaml
  - ./dsh.order-truth.openapi.yaml
  - ./dsh.order-workboards.openapi.yaml
  - ./dsh.partner-commercial-closure.openapi.yaml
  - ./dsh.partner-delivery.openapi.yaml
  - ./dsh.partner-fleet.openapi.yaml
  - ./dsh.partner-onboarding.openapi.yaml
  - ./dsh.payment-sessions.openapi.yaml
  - ./dsh.payouts-destinations.openapi.yaml
  - ./dsh.platform-policies.openapi.yaml
  - ./dsh.reels.openapi.yaml
  - ./dsh.refunds.openapi.yaml
  - ./dsh.representative-finance.openapi.yaml
  - ./dsh.runtime-extensions.openapi.yaml
  - ./dsh.settlements-commissions.openapi.yaml
  - ./dsh.support-governance.openapi.yaml
  - ./dsh.support-message-delivery.openapi.yaml
  - ./dsh.workforce-scopes.openapi.yaml

overlays:
  - ./dsh.store-operational-context.overlay.yaml
  - ./dsh.operational-policy-permissions.overlay.yaml

# Per-contract client strategy is canonical metadata owned by this manifest.
# The OpenAPI documents remain the source for contract state and runtime flags.
clientMetadata:
  - id: dsh-main
    contract: ./dsh.openapi.yaml
    clientStrategy: PRIMARY_GENERATED
    generatedClient: ../clients/generated/dsh-api.ts
  - id: dsh-administration
    contract: ./dsh.administration.openapi.yaml
    clientStrategy: PARENT_GENERATED_SUBSET
    generatedClient: ../clients/generated/dsh-api.ts
  - id: dsh-analytics-extensions
    contract: ./dsh.analytics-extensions.openapi.yaml
