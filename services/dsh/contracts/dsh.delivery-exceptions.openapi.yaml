openapi: 3.1.0
info:
  title: BThwani DSH Delivery Exceptions and Return-to-Store API
  version: 1.0.0
  description: >
    Canonical operational contract for reporting delivery exceptions,
    acknowledging operational ownership, resolving
    retry/reassignment/return/cancellation, returning custody to the store, and
    cross-surface readback. DSH owns operational state only. Any cancellation
    financial effect is delegated to the governed WLT handoff.

x-bthwani-owner: services/dsh
x-bthwani-capability: delivery-exceptions
x-bthwani-truth-owner: services/dsh/backend/internal/dispatch/delivery_exceptions.go
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-client-generation: DISABLED
x-bthwani-adapter-owner: frontend/shared/dispatch/dispatch.api.ts
x-bthwani-runtime-dependency: true
x-bthwani-financial-boundary: WLT_OWNS_ALL_FINANCIAL_MUTATION

paths:
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    DeliveryExceptionReasonCode:
      type: string
      enum:
        - customer_unreachable
        - recipient_refused
        - wrong_address
        - unsafe_location
        - vehicle_breakdown
        - accident
        - damaged_order
        - weather_or_road_block
        - proof_unavailable
        - handoff_shortage
        - handoff_mismatch
        - other

    DeliveryExceptionStatus:
      type: string
      enum: [ open, acknowledged, resolved ]

    DeliveryExceptionSeverity:
      type: string
      enum: [ medium, high, critical ]

    DeliveryExceptionResolutionAction:
      type: string
      enum: [ retry_same_captain, reassign_captain, return_to_store, cancel_order ]

    ReportDeliveryExceptionRequest:
      type: object
      additionalProperties: false
      required: [ reasonCode, note ]
      properties:
        reasonCode: { $ref: '#/components/schemas/DeliveryExceptionReasonCode' }
        note: { type: string, minLength: 5, maxLength: 1000 }
        latitude: { type: [number, 'null'], format: double, minimum: -90, maximum: 90 }
        longitude:
          {
            type: [number, 'null'],
            format: double,
            minimum: -180,
            maximum: 180
          }

    AcknowledgeDeliveryExceptionRequest:
      type: object
      additionalProperties: false
      required: [ expectedVersion ]
      properties:
        expectedVersion: { type: integer, minimum: 1 }

    ResolveDeliveryExceptionRequest:
      type: object
      additionalProperties: false
      required: [ expectedVersion, action, note ]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        action: { $ref: '#/components/schemas/DeliveryExceptionResolutionAction' }
        note: { type: string, minLength: 5, maxLength: 1000 }
        newCaptainId:
          type: string
          minLength: 1
          description: Required only when action is reassign_captain.

    DeliveryException:
      type: object
      additionalProperties: false
      required:
        - id
        - operatorContextId
        - assignmentId
        - orderId
        - captainId
        - reasonCode
        - note
        - deliveryStatusAtReport
        - severity
        - status
        - reportedAt
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        operatorContextId: { type: string }
        assignmentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        captainId: { type: string }
        reasonCode: { $ref: '#/components/schemas/DeliveryExceptionReasonCode' }
        note: { type: string, minLength: 5, maxLength: 1000 }
        deliveryStatusAtReport:
          type: string
          enum: [ driver_assigned, driver_arrived_store, picked_up, arrived_customer ]
        severity: { $ref: '#/components/schemas/DeliveryExceptionSeverity' }
        status: { $ref: '#/components/schemas/DeliveryExceptionStatus' }
        reportedLatitude: { type: [number, 'null'], format: double }
        reportedLongitude: { type: [number, 'null'], format: double }
        reportedAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        acknowledgedByActorId: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedByActorId: { type: [string, 'null'] }
        resolutionAction:
          anyOf:
            - $ref: '#/components/schemas/DeliveryExceptionResolutionAction'
            - type: 'null'
        resolutionNote: { type: [string, 'null'] }
        replacementAssignmentId: { type: [string, 'null'], format: uuid }
        replacementCaptainId: { type: [string, 'null'] }
        returnStartedAt: { type: [string, 'null'], format: date-time }
        returnArrivedAt: { type: [string, 'null'], format: date-time }
        returnedAt: { type: [string, 'null'], format: date-time }
        returnAcceptedByActorId: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DeliveryExceptionResponse:
      type: object
      additionalProperties: false
      required: [ exception ]
      properties:
        exception: { $ref: '#/components/schemas/DeliveryException' }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [ code, message ]
      properties:
        code: { type: string }
        message: { type: string }

  responses:
    InvalidRequest:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: Authentication is required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The authenticated actor cannot perform this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Assignment, exception, order, or return state was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Optimistic version or lifecycle state conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
