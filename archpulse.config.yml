# ArchPulse runtime architecture configuration.
# ArchPulse CLI auto-discovers this file from the repository root.
# Keep this file focused on production/runtime architecture rather than tooling,
# generated artifacts, tests, plans, governance, or diagnostics.

ignore:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.pnpm-store/**"
  - "**/.nx/**"
  - "**/.next/**"
  - "**/.expo/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/.cache/**"
  - "**/.gocache*/**"
  - "**/.gomodcache*/**"
  - "**/.graphify/**"
  - "**/graphify-out/**"
  - "**/.codeatlas/**"
  - "**/.yagni-out/**"
  - "**/.diagnostics/**"
  - "**/.artifacts/**"
  - ".agents/**"
  - ".claude/**"
  - ".gemini/**"
  - ".github/**"
  - "docs/**"
  - "governance/**"
  - "infra/**"
  - "plans/**"
  - "tools/**"
  - "**/generated/**"
  - "**/__tests__/**"
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.js"
  - "**/*.test.jsx"
  - "**/*.test.mjs"
  - "**/*.test.cjs"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/*.spec.js"
  - "**/*.spec.jsx"
  - "**/*_test.go"

output:
  directory: docs
  filename: architecture
  formats:
    - drawio
