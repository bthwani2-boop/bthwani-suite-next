# ArchPulse Configuration
# See https://github.com/ThanhNguyxn/ArchPulse for documentation

# Directories and patterns to ignore
ignore:
  - node_modules/
  - dist/
  - build/
  - coverage/
  - "**/*.test.ts"
  - "**/*.spec.ts"

# Custom grouping rules
grouping:
  - pattern: "core/**"
    label: "Core"
    color: "#c0392b"
  - pattern: "services/**"
    label: "Services"
    color: "#e74c3c"
  - pattern: "apps/**"
    label: "Apps"
    color: "#3498db"
  - pattern: "shared/**"
    label: "Shared"
    color: "#f39c12"
  - pattern: "contracts/**"
    label: "Contracts"
    color: "#9b59b6"
  - pattern: "infra/**"
    label: "Infrastructure"
    color: "#34495e"
  - pattern: "tools/**"
    label: "Tools"
    color: "#95a5a6"

# Output configuration
output:
  directory: docs
  filename: architecture
  formats:
    - drawio
    - png

# Color scheme for component types
styles:
  frontend: "#3498db"
  backend: "#2ecc71"
  database: "#9b59b6"
  external: "#95a5a6"
  shared: "#f39c12"

# Allowed file extensions
extensions:
  - ".ts"
  - ".tsx"
  - ".js"
  - ".jsx"
  - ".mjs"
  - ".cjs"
  - ".py"
  - ".java"
  - ".go"
