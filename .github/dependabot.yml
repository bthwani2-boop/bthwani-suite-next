version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: {interval: "weekly"}
    cooldown: {default-days: 7}
    # Routine update PRs remain visible as alerts but are frozen during the assurance campaign.
    open-pull-requests-limit: 0
    labels: ["dependencies", "gate:ci-required"]
    commit-message: {prefix: "chore(deps)"}
    groups:
      observability-non-major:
        patterns: ["@opentelemetry/*"]
        update-types: ["minor", "patch"]
      e2e-and-accessibility-non-major:
        patterns: ["@playwright/*", "@axe-core/*"]
        update-types: ["minor", "patch"]
      quality-tools-non-major:
        patterns: ["@ast-grep/*", "jscpd", "knip", "size-limit"]
        update-types: ["minor", "patch"]
      typescript-major:
        patterns: ["typescript"]
        update-types: ["major"]
      nx-major:
        patterns: ["nx"]
        update-types: ["major"]
      eslint-major:
        patterns: ["eslint"]
        update-types: ["major"]
      node-types-major:
        patterns: ["@types/node"]
        update-types: ["major"]
      production-non-major:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-non-major:
        dependency-type: "development"
        update-types: ["minor", "patch"]
  - package-ecosystem: "gomod"
    directory: "/services/wlt/backend"
    schedule: {interval: "weekly"}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 0
    labels: ["dependencies", "gate:ci-required"]
    commit-message: {prefix: "chore(deps)"}
  - package-ecosystem: "gomod"
    directory: "/services/dsh/backend"
    schedule: {interval: "weekly"}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 0
    labels: ["dependencies", "gate:ci-required"]
    commit-message: {prefix: "chore(deps)"}
  - package-ecosystem: "gomod"
    directory: "/core/identity/backend"
    schedule: {interval: "weekly"}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 0
    labels: ["dependencies", "gate:ci-required"]
    commit-message: {prefix: "chore(deps)"}
  - package-ecosystem: "gomod"
    directory: "/core/workforce/backend"
    schedule: {interval: "weekly"}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 0
