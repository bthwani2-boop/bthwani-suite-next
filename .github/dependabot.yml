    open-pull-requests-limit: 0
    labels: ["dependencies", "gate:ci-required"]
    commit-message: {prefix: "chore(deps)"}
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly"}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 0
    labels: ["dependencies", "gate:ci-required"]
    commit-message: {prefix: "chore(deps)"}
