name: Assurance Control Plane Trial
run-name: Assurance trial PR ${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/**"
      - ".agents/**"
      - "tools/scripts/**"
      - "tools/guards/**"
      - "tools/prompting/**"
      - "package.json"

# Diagnostic only. This workflow is candidate-owned and therefore must never
# publish or satisfy the privileged BThwani CI / PR result or Final Closure
# statuses. Trusted merge authority remains on the protected default branch.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: assurance-control-plane-trial-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  self-qualification:
    name: Candidate assurance self-qualification (non-authoritative)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          package-manager-cache: false

      - name: Verify exact candidate identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_HEAD_SHA}" ]]

      - name: Run assurance regression and bootstrap structural proof
        run: |
          node --test \
            tools/scripts/detect-ci-context.test.mjs \
            tools/scripts/assurance-experience-binding.test.mjs \
            tools/scripts/assurance-hardening.test.mjs \
            tools/scripts/assurance-system.test.mjs
          node tools/scripts/verify-assurance-bootstrap.mjs

      - name: Verify candidate workflow source immutability policy
        run: node tools/scripts/check-ci-source-immutability.mjs

  trusted-control-runtime:
    name: Trusted-control bundle runtime qualification (non-authoritative)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head as data target
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          package-manager-cache: false

      - name: Materialize candidate control bundle as simulated future trust root
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          trusted_root="${RUNNER_TEMP}/bthwani-qualified-controls"
          mkdir -p \
            "${trusted_root}/tools/guards" \
            "${trusted_root}/tools/scripts/lib" \
            "${trusted_root}/tools/mobile/lib" \
            "${trusted_root}/tools/verification"
          fetch_qualified() {
            local relative="$1" target="${trusted_root}/$1"
            mkdir -p "$(dirname "${target}")"
            gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/contents/${relative}" \
              -f "ref=${QUALIFICATION_SHA}" --jq '.content' | base64 --decode > "${target}"
            [[ -s "${target}" ]] || { echo "::error::qualified control missing: ${relative}"; exit 1; }
          }
          fetch_qualified tools/scripts/verify-assurance-authority-drift.mjs
          fetch_qualified tools/guards/migration-manifest-drift-gate.mjs
          fetch_qualified tools/guards/sonar-coverage-ownership-gate.mjs
          fetch_qualified tools/guards/_guard-utils.mjs
          fetch_qualified tools/scripts/generate-sonar-node-coverage.mjs
          fetch_qualified tools/scripts/lib/package-manager-invocation.mjs
          fetch_qualified tools/mobile/lib/package-manager-invocation.mjs
          fetch_qualified tools/verification/ownership.manifest.json
          {
            echo "QUALIFIED_AUTHORITY_DRIFT=${trusted_root}/tools/scripts/verify-assurance-authority-drift.mjs"
            echo "QUALIFIED_MIGRATION_GUARD=${trusted_root}/tools/guards/migration-manifest-drift-gate.mjs"
            echo "QUALIFIED_SONAR_GUARD=${trusted_root}/tools/guards/sonar-coverage-ownership-gate.mjs"
          } >> "${GITHUB_ENV}"

      - name: Execute qualified assurance authority drift gate in simulated trust-root mode
        shell: bash
        env:
          BTHWANI_TARGET_REPO: ${{ github.workspace }}
          BTHWANI_TRUSTED_SHA: ${{ github.event.pull_request.head.sha }}
          BTHWANI_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node "${QUALIFIED_AUTHORITY_DRIFT}"

      - name: Execute qualified migration authority against exact candidate data
        shell: bash
        run: >-
          BTHWANI_TARGET_REPO="${GITHUB_WORKSPACE}"
          node "${QUALIFIED_MIGRATION_GUARD}"
          --immutable-baseline "${{ github.event.pull_request.base.sha }}"

      - name: Execute qualified Sonar ownership authority against exact candidate data
        shell: bash
        run: BTHWANI_TARGET_REPO="${GITHUB_WORKSPACE}" node "${QUALIFIED_SONAR_GUARD}"

  remote-security:
    name: Candidate remote analyzer trial (non-authoritative)
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/security-remote.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_ref: ${{ github.event.pull_request.head.ref }}
      base_ref: ${{ github.event.pull_request.base.ref }}
