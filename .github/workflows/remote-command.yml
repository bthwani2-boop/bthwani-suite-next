name: Remote Command

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: remote-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate and dispatch canonical remote authority
    if: ${{ github.event.issue.title == '[remote-command]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - name: Parse, authorize, pin, and dispatch
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          fail() {
            local message="$1"
            gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "Remote command rejected: ${message}" >/dev/null || true
            echo "::error::${message}"
            exit 1
          }

          case "${ISSUE_AUTHOR_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) fail "issue author association '${ISSUE_AUTHOR_ASSOCIATION}' is not authorized" ;;
          esac

          permission="$(gh api --method GET \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/collaborators/${ISSUE_AUTHOR}/permission" \
            --jq '.permission')"
          case "${permission}" in
            admin|maintain|write) ;;
            *) fail "issue author '${ISSUE_AUTHOR}' does not have write-equivalent repository permission" ;;
          esac

          raw="$(printf '%s' "${ISSUE_BODY}" | sed -e '/^```[a-zA-Z0-9_-]*$/d' -e '/^```$/d')"
          printf '%s' "${raw}" | jq -e . >/dev/null 2>&1 || fail "issue body must be one valid JSON object"
          [[ "$(printf '%s' "${raw}" | jq -r 'type')" == "object" ]] || fail "issue body must be a JSON object"

          extra_keys="$(printf '%s' "${raw}" | jq -r 'keys - ["schema_version","command","target_ref","expected_sha","journey","tool","base_ref"] | .[]' || true)"
          [[ -z "${extra_keys}" ]] || fail "unsupported command field(s): ${extra_keys//$'\n'/, }"

          schema_version="$(printf '%s' "${raw}" | jq -r '.schema_version // empty')"
          command="$(printf '%s' "${raw}" | jq -r '.command // empty')"
          target_ref="$(printf '%s' "${raw}" | jq -r '.target_ref // empty')"
          expected_sha="$(printf '%s' "${raw}" | jq -r '.expected_sha // empty')"
          journey="$(printf '%s' "${raw}" | jq -r '.journey // empty')"
          tool="$(printf '%s' "${raw}" | jq -r '.tool // empty')"
          base_ref="$(printf '%s' "${raw}" | jq -r '.base_ref // empty')"

          [[ "${schema_version}" == "2" ]] || fail "schema_version must equal 2"
          [[ -n "${command}" && -n "${target_ref}" && -n "${expected_sha}" ]] || fail "command, target_ref, and expected_sha are required"
          [[ "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || fail "expected_sha must be a full 40-character commit SHA"
          git check-ref-format --branch "${target_ref}" >/dev/null 2>&1 || fail "target_ref is not a valid branch name"

          live_sha="$(gh api --method GET \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/branches/${target_ref//\//%2F}" \
            --jq '.commit.sha')" || fail "target_ref '${target_ref}' does not resolve to a live branch"
          [[ "${live_sha}" == "${expected_sha}" ]] || fail "branch moved: expected=${expected_sha} live=${live_sha}"

          allowed_security_tools='^(semgrep|gitleaks|osv|trivy|actionlint|zizmor|pinact|shellcheck|hadolint|yamllint)$'
          case "${command}" in
            ci-affected|ci-full|ci-runtime|ci-journey|codeql-full|codeql-hygiene|sonar-full|security-full|security-tool|semgrep-full|opencodereview-full|opencodereview-diff|dependency-review|lockfile-integrity|remote-evidence) ;;
            *) fail "unsupported remote command '${command}'" ;;
          esac

          if [[ "${command}" == "ci-journey" ]]; then
            [[ -n "${journey}" ]] || fail "ci-journey requires journey"
          elif [[ -n "${journey}" ]]; then
            fail "journey is only valid with ci-journey"
          fi

          if [[ "${command}" == "security-tool" ]]; then
            [[ "${tool}" =~ ${allowed_security_tools} ]] || fail "security-tool requires one supported tool"
          elif [[ -n "${tool}" ]]; then
            fail "tool is only valid with security-tool"
          fi

          if [[ -n "${base_ref}" ]]; then
            case "${command}" in
              opencodereview-diff|dependency-review) ;;
              *) fail "base_ref is only valid with opencodereview-diff or dependency-review" ;;
            esac
          fi

          workflow=""
          payload='{}'
          case "${command}" in
            ci-affected)
              workflow="ci.yml"
              payload="$(jq -nc --arg ref "${target_ref}" '{ref:$ref,inputs:{mode:"affected",runtime_proof:"false"}}')"
              ;;
            ci-full)
              workflow="ci.yml"
              payload="$(jq -nc --arg ref "${target_ref}" '{ref:$ref,inputs:{mode:"full",runtime_proof:"false"}}')"
              ;;
            ci-runtime)
              workflow="ci.yml"
              payload="$(jq -nc --arg ref "${target_ref}" '{ref:$ref,inputs:{mode:"full",runtime_proof:"true"}}')"
              ;;
            ci-journey)
              workflow="ci.yml"
              payload="$(jq -nc --arg ref "${target_ref}" --arg journey "${journey}" '{ref:$ref,inputs:{mode:"affected",journey:$journey,runtime_proof:"true"}}')"
              ;;
            codeql-full)
              workflow="codeql.yml"
              payload="$(jq -nc --arg ref "${target_ref}" '{ref:$ref}')"
              ;;
            codeql-hygiene)
              workflow="codeql-hygiene.yml"
              payload="$(jq -nc --arg ref "${target_ref}" '{ref:$ref}')"
              ;;
            sonar-full)
              workflow="sonarqube.yml"
              payload="$(jq -nc --arg ref "${target_ref}" '{ref:$ref}')"
              ;;
            security-full)
              workflow="security-remote.yml"
              payload="$(jq -nc --arg ref "${target_ref}" '{ref:$ref,inputs:{profile:"full",tool:""}}')"
              ;;
            security-tool)
              workflow="security-remote.yml"
              payload="$(jq -nc --arg ref "${target_ref}" --arg tool "${tool}" '{ref:$ref,inputs:{profile:"tool",tool:$tool}}')"
              ;;
            semgrep-full)
              workflow="security-remote.yml"
              payload="$(jq -nc --arg ref "${target_ref}" '{ref:$ref,inputs:{profile:"tool",tool:"semgrep"}}')"
              ;;
            opencodereview-full)
              workflow="opencodereview.yml"
              payload="$(jq -nc --arg ref "${target_ref}" --arg sha "${expected_sha}" '{ref:$ref,inputs:{mode:"full",base_ref:"",expected_sha:$sha}}')"
              ;;
            opencodereview-diff)
              workflow="opencodereview.yml"
              resolved_base="${base_ref:-${DEFAULT_BRANCH}}"
              payload="$(jq -nc --arg ref "${target_ref}" --arg sha "${expected_sha}" --arg base "${resolved_base}" '{ref:$ref,inputs:{mode:"diff",base_ref:$base,expected_sha:$sha}}')"
              ;;
            dependency-review)
              workflow="dependency-review.yml"
              resolved_base="${base_ref:-${DEFAULT_BRANCH}}"
              payload="$(jq -nc --arg ref "${target_ref}" --arg sha "${expected_sha}" --arg base "${resolved_base}" '{ref:$ref,inputs:{base_ref:$base,head_ref:$sha,expected_sha:$sha}}')"
              ;;
            lockfile-integrity)
              workflow="lockfile-integrity.yml"
              payload="$(jq -nc --arg ref "${target_ref}" '{ref:$ref}')"
              ;;
            remote-evidence)
              workflow="remote-analysis-evidence.yml"
              payload="$(jq -nc --arg ref "${target_ref}" --arg sha "${expected_sha}" '{ref:$ref,inputs:{target_ref:$ref,target_sha:$sha}}')"
              ;;
          esac

          before_ids="$(gh api --method GET \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[].id' || true)"

          gh api --method POST \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
            --input - <<<"${payload}" >/dev/null

          run_id=""
          for _ in $(seq 1 40); do
            sleep 3
            while IFS=$'\t' read -r candidate_id candidate_sha candidate_branch; do
              [[ -n "${candidate_id}" ]] || continue
              if grep -qx "${candidate_id}" <<<"${before_ids}"; then continue; fi
              if [[ "${candidate_sha}" == "${expected_sha}" && "${candidate_branch}" == "${target_ref}" ]]; then
                run_id="${candidate_id}"
                break
              fi
            done < <(gh api --method GET \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=${target_ref}&per_page=20" \
              --jq '.workflow_runs[] | [.id,.head_sha,.head_branch] | @tsv')
            [[ -n "${run_id}" ]] && break
          done
          [[ -n "${run_id}" ]] || fail "workflow was dispatched but the exact-SHA run could not be correlated"

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "Remote command accepted: \`${command}\` → \`${workflow}\` on \`${target_ref}@${expected_sha}\`. Run: ${run_url}" >/dev/null

          conclusion=""
          for _ in $(seq 1 240); do
            status="$(gh api --method GET \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '.status')"
            if [[ "${status}" == "completed" ]]; then
              conclusion="$(gh api --method GET \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --jq '.conclusion')"
              break
            fi
            sleep 30
          done
          [[ -n "${conclusion}" ]] || fail "timed out waiting for ${workflow} run ${run_id}"

          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "Remote command completed: \`${command}\` → \`${conclusion}\`. Candidate: \`${target_ref}@${expected_sha}\`. Run: ${run_url}" >/dev/null
          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::remote command workflow concluded ${conclusion}"
            exit 1
          fi
          gh issue close "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --reason completed >/dev/null
          echo "workflow=${workflow}" >> "${GITHUB_OUTPUT}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "candidate_sha=${expected_sha}" >> "${GITHUB_OUTPUT}"
