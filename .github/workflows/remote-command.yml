name: BThwani Remote Command

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  dispatch:
    name: Validate and dispatch canonical remote command
    if: ${{ github.event.issue.title == '[remote-command]' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    concurrency:
      group: bthwani-remote-command-dispatch
      cancel-in-progress: false
    outputs:
      command: ${{ steps.request.outputs.command }}
      target_kind: ${{ steps.request.outputs.target_kind }}
      target_ref: ${{ steps.request.outputs.target_ref }}
      pr_number: ${{ steps.request.outputs.pr_number }}
      expected_head_sha: ${{ steps.request.outputs.expected_head_sha }}
      expected_base_sha: ${{ steps.request.outputs.expected_base_sha }}
      request_id: ${{ steps.request.outputs.request_id }}
      workflow: ${{ steps.route.outputs.workflow }}
      run_id: ${{ steps.run.outputs.run_id }}
      run_url: ${{ steps.run.outputs.run_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REQUEST_ACTOR: ${{ github.actor }}
      REQUEST_BODY: ${{ github.event.issue.body }}
    steps:
      - name: Validate requester and schema v2 envelope
        id: request
        shell: bash
        run: |
          set -euo pipefail
          permission="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/collaborators/${REQUEST_ACTOR}/permission" --jq '.permission')"
          case "${permission}" in admin|maintain|write) ;; *) echo "::error::remote command requires write/maintain/admin"; exit 1;; esac

          printf '%s' "${REQUEST_BODY}" > "${RUNNER_TEMP}/request.json"
          jq -e '
            type=="object" and .schema_version==2 and
            (.request_id|type=="string" and test("^[A-Za-z0-9._:-]{8,128}$")) and
            (.command|type=="string" and length>0) and
            (.target_kind=="branch" or .target_kind=="pull_request") and
            ((.target_ref // "")|type=="string") and
            ((.pr_number // 0)|type=="number") and
            (.expected_head_sha|type=="string" and test("^[0-9a-fA-F]{40}$")) and
            (((.expected_base_sha // "") == "") or ((.expected_base_sha|type=="string") and (.expected_base_sha|test("^[0-9a-fA-F]{40}$")))) and
            ((.journey // "")|type=="string") and
            ((keys-["schema_version","request_id","command","target_kind","target_ref","pr_number","expected_head_sha","expected_base_sha","journey"])|length==0)
          ' "${RUNNER_TEMP}/request.json" >/dev/null

          command="$(jq -r '.command' "${RUNNER_TEMP}/request.json")"
          target_kind="$(jq -r '.target_kind' "${RUNNER_TEMP}/request.json")"
          target_ref="$(jq -r '.target_ref // ""' "${RUNNER_TEMP}/request.json")"
          pr_number="$(jq -r '.pr_number // 0' "${RUNNER_TEMP}/request.json")"
          expected_head_sha="$(jq -r '.expected_head_sha' "${RUNNER_TEMP}/request.json")"
          expected_base_sha="$(jq -r '.expected_base_sha // ""' "${RUNNER_TEMP}/request.json")"
          journey="$(jq -r '.journey // ""' "${RUNNER_TEMP}/request.json")"
          request_id="$(jq -r '.request_id' "${RUNNER_TEMP}/request.json")"

          case "${command}" in
            ci-affected|ci-full|ci-runtime|ci-journey|pr-closure|codeql-full|codeql-hygiene|sonar-full|security-full|semgrep-full|lockfile-integrity|remote-evidence) ;;
            *) echo "::error::unsupported remote command: ${command}"; exit 1;;
          esac
          [[ "${command}" != "ci-journey" || -n "${journey}" ]] || { echo "::error::ci-journey requires journey"; exit 1; }
          [[ "${command}" != "pr-closure" || "${target_kind}" == "pull_request" ]] || { echo "::error::pr-closure requires target_kind=pull_request"; exit 1; }

          default_branch="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          if [[ "${target_kind}" == "pull_request" ]]; then
            [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr_number required"; exit 1; }
            pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || { echo "::error::PR is not open"; exit 1; }
            actual_head="$(jq -r '.head.sha' <<<"${pr}")"
            actual_base="$(jq -r '.base.sha' <<<"${pr}")"
            target_ref="$(jq -r '.head.ref' <<<"${pr}")"
            [[ "${actual_head}" == "${expected_head_sha}" ]] || { echo "::error::PR head moved: expected=${expected_head_sha} actual=${actual_head}"; exit 1; }
            [[ -z "${expected_base_sha}" || "${actual_base}" == "${expected_base_sha}" ]] || { echo "::error::PR base moved: expected=${expected_base_sha} actual=${actual_base}"; exit 1; }
            expected_base_sha="${actual_base}"
          else
            [[ -n "${target_ref}" ]] || { echo "::error::branch target_ref required"; exit 1; }
            git check-ref-format --branch "${target_ref}" >/dev/null
            encoded="$(jq -rn --arg v "${target_ref}" '$v|@uri')"
            actual_head="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/branches/${encoded}" --jq '.commit.sha')"
            [[ "${actual_head}" == "${expected_head_sha}" ]] || { echo "::error::branch moved: expected=${expected_head_sha} actual=${actual_head}"; exit 1; }
          fi

          [[ "${command}" != "codeql-hygiene" || "${target_ref}" == "${default_branch}" ]] || { echo "::error::codeql-hygiene is default-branch only"; exit 1; }
          [[ "${command}" != "remote-evidence" || "${target_ref}" == "${default_branch}" ]] || { echo "::error::remote-evidence is default-branch only"; exit 1; }

          {
            echo "command=${command}"
            echo "target_kind=${target_kind}"
            echo "target_ref=${target_ref}"
            echo "pr_number=${pr_number}"
            echo "expected_head_sha=${expected_head_sha}"
            echo "expected_base_sha=${expected_base_sha}"
            echo "journey=${journey}"
            echo "request_id=${request_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve canonical workflow
        id: route
        shell: bash
        env:
          COMMAND: ${{ steps.request.outputs.command }}
        run: |
          set -euo pipefail
          case "${COMMAND}" in
            ci-affected|ci-full|ci-runtime|ci-journey|pr-closure) workflow=ci.yml ;;
            codeql-full) workflow=codeql.yml ;;
            codeql-hygiene) workflow=codeql-hygiene.yml ;;
            sonar-full) workflow=sonarqube.yml ;;
            security-full) workflow=security-remote.yml ;;
            semgrep-full) workflow=semgrep.yml ;;
            lockfile-integrity) workflow=lockfile-integrity.yml ;;
            remote-evidence) workflow=remote-analysis-evidence.yml ;;
          esac
          echo "workflow=${workflow}" >> "${GITHUB_OUTPUT}"

      - name: Snapshot existing dispatch runs
        shell: bash
        env:
          WORKFLOW: ${{ steps.route.outputs.workflow }}
          TARGET_REF: ${{ steps.request.outputs.target_ref }}
        run: |
          encoded="$(jq -rn --arg v "${TARGET_REF}" '$v|@uri')"
          gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?branch=${encoded}&event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id' > "${RUNNER_TEMP}/before.txt"

      - name: Dispatch canonical workflow
        shell: bash
        env:
          COMMAND: ${{ steps.request.outputs.command }}
          TARGET_KIND: ${{ steps.request.outputs.target_kind }}
          TARGET_REF: ${{ steps.request.outputs.target_ref }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          HEAD_SHA: ${{ steps.request.outputs.expected_head_sha }}
          BASE_SHA: ${{ steps.request.outputs.expected_base_sha }}
          JOURNEY: ${{ steps.request.outputs.journey }}
          WORKFLOW: ${{ steps.route.outputs.workflow }}
        run: |
          set -euo pipefail
          inputs='{}'
          case "${COMMAND}" in
            ci-affected) inputs="$(jq -cn --arg kind "${TARGET_KIND}" --arg pr "${PR_NUMBER}" --arg head "${HEAD_SHA}" --arg base "${BASE_SHA}" '{mode:"affected",journey:"",runtime_proof:false,target_kind:$kind,pr_number:$pr,expected_head_sha:$head,expected_base_sha:$base}')" ;;
            ci-full) inputs="$(jq -cn --arg kind "${TARGET_KIND}" --arg pr "${PR_NUMBER}" --arg head "${HEAD_SHA}" --arg base "${BASE_SHA}" '{mode:"full",journey:"",runtime_proof:false,target_kind:$kind,pr_number:$pr,expected_head_sha:$head,expected_base_sha:$base}')" ;;
            ci-runtime|pr-closure) inputs="$(jq -cn --arg kind "${TARGET_KIND}" --arg pr "${PR_NUMBER}" --arg head "${HEAD_SHA}" --arg base "${BASE_SHA}" '{mode:"full",journey:"",runtime_proof:true,target_kind:$kind,pr_number:$pr,expected_head_sha:$head,expected_base_sha:$base}')" ;;
            ci-journey) inputs="$(jq -cn --arg kind "${TARGET_KIND}" --arg pr "${PR_NUMBER}" --arg head "${HEAD_SHA}" --arg base "${BASE_SHA}" --arg journey "${JOURNEY}" '{mode:"affected",journey:$journey,runtime_proof:false,target_kind:$kind,pr_number:$pr,expected_head_sha:$head,expected_base_sha:$base}')" ;;
            semgrep-full) inputs='{"mode":"full","base_ref":""}' ;;
            remote-evidence) inputs="$(jq -cn --arg ref "${TARGET_REF}" --arg sha "${HEAD_SHA}" '{target_ref:$ref,target_sha:$sha}')" ;;
          esac
          payload="$(jq -n --arg ref "${TARGET_REF}" --argjson inputs "${inputs}" '{ref:$ref,inputs:$inputs}')"
          printf '%s' "${payload}" | gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" --input - >/dev/null

      - name: Correlate exact dispatched run
        id: run
        shell: bash
        env:
          WORKFLOW: ${{ steps.route.outputs.workflow }}
          TARGET_REF: ${{ steps.request.outputs.target_ref }}
          HEAD_SHA: ${{ steps.request.outputs.expected_head_sha }}
        run: |
          set -euo pipefail
          encoded="$(jq -rn --arg v "${TARGET_REF}" '$v|@uri')"
          run_id=""
          for _ in $(seq 1 60); do
            while IFS= read -r candidate; do
              [[ -n "${candidate}" ]] || continue
              grep -qx "${candidate}" "${RUNNER_TEMP}/before.txt" && continue
              sha="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}" --jq '.head_sha')"
              if [[ "${sha}" == "${HEAD_SHA}" ]]; then run_id="${candidate}"; break; fi
            done < <(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?branch=${encoded}&event=workflow_dispatch&per_page=20" --jq '.workflow_runs[].id')
            [[ -n "${run_id}" ]] && break
            sleep 3
          done
          [[ -n "${run_id}" ]] || { echo "::error::unable to correlate exact run"; exit 1; }
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Publish accepted request
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          COMMAND: ${{ steps.request.outputs.command }}
          TARGET_KIND: ${{ steps.request.outputs.target_kind }}
          TARGET_REF: ${{ steps.request.outputs.target_ref }}
          HEAD_SHA: ${{ steps.request.outputs.expected_head_sha }}
          RUN_URL: ${{ steps.run.outputs.run_url }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "Accepted \`${REQUEST_ID}\`: \`${COMMAND}\` target=\`${TARGET_KIND}:${TARGET_REF}@${HEAD_SHA}\`. Canonical run: ${RUN_URL}"

  wait:
    name: Wait for canonical remote result
    needs: [dispatch]
    runs-on: ubuntu-24.04
    timeout-minutes: 195
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_ID: ${{ needs.dispatch.outputs.run_id }}
      RUN_URL: ${{ needs.dispatch.outputs.run_url }}
      COMMAND: ${{ needs.dispatch.outputs.command }}
      REQUEST_ID: ${{ needs.dispatch.outputs.request_id }}
      HEAD_SHA: ${{ needs.dispatch.outputs.expected_head_sha }}
    steps:
      - name: Wait for exact canonical run
        id: result
        shell: bash
        run: |
          set -euo pipefail
          conclusion=""
          for _ in $(seq 1 1140); do
            run="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
            [[ "$(jq -r '.head_sha' <<<"${run}")" == "${HEAD_SHA}" ]] || { echo "::error::run SHA drift"; exit 1; }
            if [[ "$(jq -r '.status' <<<"${run}")" == "completed" ]]; then conclusion="$(jq -r '.conclusion // "unknown"' <<<"${run}")"; break; fi
            sleep 10
          done
          [[ -n "${conclusion}" ]] || { echo "::error::timed out"; exit 1; }
          echo "conclusion=${conclusion}" >> "${GITHUB_OUTPUT}"

      - name: Publish result and enforce
        if: ${{ always() }}
        shell: bash
        env:
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
        run: |
          conclusion="${CONCLUSION:-failed-before-completion}"
          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "Remote request \`${REQUEST_ID}\` / \`${COMMAND}\` completed with **${conclusion}**. ${RUN_URL}"
          if [[ "${conclusion}" == "success" ]]; then gh issue close "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --reason completed; fi
          [[ "${conclusion}" == "success" ]]
