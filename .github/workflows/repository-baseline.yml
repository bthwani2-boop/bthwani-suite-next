name: BThwani Repository Health
run-name: Repository Health ${{ github.sha }}

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bthwani-repository-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL repository baseline
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      head_sha: ${{ github.sha }}
      base_sha: ${{ github.event.before || github.sha }}
      full_scope: true

  sonar:
    name: Sonar repository baseline
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit
    with:
      head_sha: ${{ github.sha }}
      base_sha: ${{ github.event.before || github.sha }}
      trusted_scan: true
      full_scope: true

  health:
    name: BThwani / Repository Health
    needs: [codeql, sonar]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      statuses: write
    env:
      HEAD_SHA: ${{ github.sha }}
      CODEQL_RESULT: ${{ needs.codeql.result }}
      SONAR_RESULT: ${{ needs.sonar.result }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          package-manager-cache: false
      - name: Load trusted baseline evidence tools
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trusted_classifier="${RUNNER_TEMP}/classify-semgrep-evidence.mjs"
          trusted_comparator="${RUNNER_TEMP}/compare-assurance-baseline.mjs"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/tools/scripts/classify-semgrep-evidence.mjs" \
            -f "ref=${TRUSTED_WORKFLOW_SHA}" --jq '.content' | base64 --decode > "${trusted_classifier}"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/tools/scripts/compare-assurance-baseline.mjs" \
            -f "ref=${TRUSTED_WORKFLOW_SHA}" --jq '.content' | base64 --decode > "${trusted_comparator}"
          [[ -s "${trusted_classifier}" && -s "${trusted_comparator}" ]] || {
            echo "::error::trusted Repository Health tools are missing"; exit 1;
          }
          node --check "${trusted_classifier}"
          node --check "${trusted_comparator}"
          echo "TRUSTED_SEMGREP_CLASSIFIER=${trusted_classifier}" >> "${GITHUB_ENV}"
          echo "TRUSTED_BASELINE_COMPARATOR=${trusted_comparator}" >> "${GITHUB_ENV}"
      - name: Install pinned Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/semgrep-1.172.0"
          "${RUNNER_TEMP}/semgrep-1.172.0/bin/python" -m pip install --disable-pip-version-check --no-input semgrep==1.172.0
          echo "${RUNNER_TEMP}/semgrep-1.172.0/bin" >> "${GITHUB_PATH}"
      - name: Collect full Semgrep baseline evidence
        id: semgrep
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "${RUNNER_TEMP}/repository-baseline"
          semgrep scan --config p/default --config p/security-audit --json --metrics=off --exclude=".github/workflows/**" . \
            > "${RUNNER_TEMP}/repository-baseline/semgrep.json" \
            2> "${RUNNER_TEMP}/repository-baseline/semgrep.stderr.log"
          status=$?
          set -e
          if (( status == 0 || status == 1 )) && jq -e 'type == "object" and (.results | type == "array")' \
            "${RUNNER_TEMP}/repository-baseline/semgrep.json" >/dev/null 2>&1; then
            execution_status=success
          else
            execution_status=failure
          fi
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          echo "execution_status=${execution_status}" >> "${GITHUB_OUTPUT}"
          [[ -s "${RUNNER_TEMP}/repository-baseline/semgrep.json" ]] || echo "{}" > "${RUNNER_TEMP}/repository-baseline/semgrep.json"
      - name: Evaluate exact candidate baseline
        id: evaluate
        shell: bash
        env:
          EXECUTION_STATUS: ${{ steps.semgrep.outputs.execution_status }}
        run: |
          set -euo pipefail
          if node "${TRUSTED_SEMGREP_CLASSIFIER}" \
            --input "${RUNNER_TEMP}/repository-baseline/semgrep.json" \
            --output-dir "${RUNNER_TEMP}/repository-baseline/classified" \
            --head-sha "${HEAD_SHA}" \
            --mode full \
            --base-sha "${HEAD_SHA}"; then
            classifier_exit=0
          else
            classifier_exit=$?
          fi
          if (( classifier_exit != 0 )); then
            echo "::warning::baseline classifier returned ${classifier_exit}; evidence disposition remains explicit"
          fi
          [[ -s "${RUNNER_TEMP}/repository-baseline/classified/assurance-evidence.json" ]] || {
            echo "::error::baseline classifier did not produce evidence"; exit 1;
          }
          node "${TRUSTED_BASELINE_COMPARATOR}" \
            --candidate "${RUNNER_TEMP}/repository-baseline/classified/assurance-evidence.json" \
            --head-sha "${HEAD_SHA}" \
            --execution-status "${EXECUTION_STATUS}" \
            --output "${RUNNER_TEMP}/repository-baseline/baseline.json"
          jq -e '.schema == "bthwani-assurance-baseline/1"' "${RUNNER_TEMP}/repository-baseline/baseline.json" >/dev/null
          state="$(jq -r '.repositoryHealth.state' "${RUNNER_TEMP}/repository-baseline/baseline.json")"
          reasons="$(jq -r '.repositoryHealth.reasons | join(", ")' "${RUNNER_TEMP}/repository-baseline/baseline.json")"
          {
            echo "### BThwani / Repository Health"
            echo "- exact candidate: \`${HEAD_SHA}\`"
            echo "- CodeQL baseline: \`${CODEQL_RESULT}\`"
            echo "- Sonar baseline: \`${SONAR_RESULT}\`"
            echo "- state: \`${state}\`"
            echo "- material findings: $(jq -r '.counts.candidateMaterial' "${RUNNER_TEMP}/repository-baseline/baseline.json")"
            echo "- unknown required coverage: $(jq -r '.counts.unknownRequiredCoverage' "${RUNNER_TEMP}/repository-baseline/baseline.json")"
            echo "- disposition: ${reasons:-none}"
            echo "- BASELINE_OPEN is not Repository Closure"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload baseline evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-baseline-${{ env.HEAD_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/repository-baseline
          if-no-files-found: error
          retention-days: 30
      - name: Publish Repository Health status
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          state="failure"
          description="Repository Health is BASELINE_OPEN or evidence is incomplete"
          if [[ "${CODEQL_RESULT}" == "success" && "${SONAR_RESULT}" == "success" && -s "${RUNNER_TEMP}/repository-baseline/baseline.json" ]]; then
            baseline_state="$(jq -r '.repositoryHealth.state' "${RUNNER_TEMP}/repository-baseline/baseline.json")"
            if [[ "${baseline_state}" == "HEALTHY" ]]; then
              state="success"
              description="Exact Repository Health is healthy; this is not a closure claim"
            else
              description="Repository Health ${baseline_state}: $(jq -r '.repositoryHealth.reasons | join(", ")' "${RUNNER_TEMP}/repository-baseline/baseline.json")"
            fi
          fi
          if [[ "${CODEQL_RESULT}" != "success" || "${SONAR_RESULT}" != "success" ]]; then
            description="Repository Health BASELINE_OPEN: CodeQL=${CODEQL_RESULT}, Sonar=${SONAR_RESULT}"
          fi
          gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f context='BThwani / Repository Health' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
