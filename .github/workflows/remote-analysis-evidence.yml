name: Remote Analysis Evidence

on:
  workflow_run:
    workflows: ["BThwani Contextual CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact branch name to re-read; defaults to repository default branch
        required: false
        type: string
      target_sha:
        description: Exact live branch SHA to re-read; defaults to live target branch SHA
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: read
  statuses: write

concurrency:
  group: remote-analysis-evidence-${{ github.event.workflow_run.head_sha || inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Read back exact remote analysis evidence
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Resolve exact live branch target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
          REQUESTED_REF: ${{ inputs.target_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            target_branch="${WORKFLOW_RUN_BRANCH}"
            target_sha="${WORKFLOW_RUN_SHA}"
          else
            target_branch="${REQUESTED_REF:-${DEFAULT_BRANCH}}"
            encoded_branch="$(jq -rn --arg value "${target_branch}" '$value|@uri')"
            live_sha="$(gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" \
              --jq '.commit.sha')"
            target_sha="${REQUESTED_SHA:-${live_sha}}"
          fi

          [[ -n "${target_branch}" ]] || { echo "::error::target branch is required"; exit 1; }
          [[ "${target_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::target SHA must be a full SHA"; exit 1; }

          encoded_branch="$(jq -rn --arg value "${target_branch}" '$value|@uri')"
          live_sha="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" \
            --jq '.commit.sha')"

          [[ "${target_sha}" == "${live_sha}" ]] || {
            echo "::error::target=${target_branch}@${target_sha} is superseded by live=${live_sha}"
            exit 1
          }

          skip=false
          if [[ "${EVENT_NAME}" == "workflow_run" && "${target_branch}" != "${DEFAULT_BRANCH}" ]]; then
            open_pr_count="$(gh api --method GET \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open \
              -f head="${GITHUB_REPOSITORY_OWNER}:${target_branch}" \
              -f per_page=1 \
              --jq 'length')"
            if [[ "${open_pr_count}" != "0" ]]; then
              skip=true
            fi
          fi

          {
            echo "branch=${target_branch}"
            echo "sha=${target_sha}"
            echo "default_branch=${DEFAULT_BRANCH}"
            echo "skip_duplicate_push=${skip}"
          } >> "${GITHUB_OUTPUT}"

      - name: Fetch trusted collector from repository default branch
        if: ${{ steps.target.outputs.skip_duplicate_push != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
        run: |
          set -euo pipefail
          collector_dir="${RUNNER_TEMP}/trusted-remote-analysis"
          mkdir -p "${collector_dir}"
          fetch_file() {
            local repository_path="$1"
            local output_path="$2"
            gh api --method GET \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/contents/${repository_path}" \
              -f "ref=${DEFAULT_BRANCH}" \
              --jq '.content' | base64 --decode > "${output_path}"
            [[ -s "${output_path}" ]] || { echo \
            "::error::trusted collector file is empty: ${repository_path}"; exit 1; }
          }
          fetch_file "tools/scripts/collect-remote-analysis-evidence.mjs" \
          "${collector_dir}/collect-remote-analysis-evidence.mjs"
          fetch_file "sonar-project.properties" "${collector_dir}/sonar-project.properties"

      - name: Set up locked Node runtime
        if: ${{ steps.target.outputs.skip_duplicate_push != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Validate SonarQube Cloud token
        if: ${{ steps.target.outputs.skip_duplicate_push != 'true' }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          [[ -n "${SONAR_TOKEN}" ]] || { echo "::error::SONAR_TOKEN is required for Sonar read-back"; exit 1; }

      - name: Collect complete remote analysis evidence
        id: collect
        if: ${{ steps.target.outputs.skip_duplicate_push != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_REF: refs/heads/${{ steps.target.outputs.branch }}
          TARGET_EVENT: push
          SONAR_BRANCH: ${{ steps.target.outputs.branch }}
          DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
          WAIT_FOR_WORKFLOWS_SECONDS: "1800"
          WORKFLOW_POLL_SECONDS: "15"
        run: |
          set +e
          mkdir -p "${RUNNER_TEMP}/remote-analysis-evidence"
          pushd "${RUNNER_TEMP}/trusted-remote-analysis" >/dev/null
          node ./collect-remote-analysis-evidence.mjs > "${RUNNER_TEMP}/remote-analysis-evidence/evidence.json"
          status=$?
          popd >/dev/null
          set -e
          jq '.summary // {targetSha, targetRef, evidenceComplete, policyStatus, policyFailures, error}' \
            "${RUNNER_TEMP}/remote-analysis-evidence/evidence.json" > \
            "${RUNNER_TEMP}/remote-analysis-evidence/summary.json"
          exit "${status}"

      - name: Upload exact-SHA remote analysis evidence
        id: artifact
        if: ${{ always() && steps.target.outputs.skip_duplicate_push != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-analysis-evidence-${{ steps.target.outputs.sha }}
          path: ${{ runner.temp }}/remote-analysis-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Publish evidence summary
        id: summary
        if: ${{ always() && steps.target.outputs.skip_duplicate_push != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/remote-analysis-evidence/summary.json"
          [[ -f "${summary}" ]] || { echo "::error::evidence summary was not produced"; exit 1; }
          {
            echo "### Remote Analysis Evidence"
            echo '```json'
            cat "${summary}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish discoverable exact-SHA evidence status
        id: status
        if: ${{ always() && steps.target.outputs.skip_duplicate_push != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo \
          "::error::cannot publish evidence status without a validated target SHA"; exit 1; }
          state=failure
          description="Remote evidence incomplete or blocking findings remain"
          if [[ "${COLLECT_OUTCOME}" == "success" && "${ARTIFACT_OUTCOME}" == "success" && \
          "${SUMMARY_OUTCOME}" == "success" ]]; then
            state=success
            description="Remote CodeQL and Sonar evidence complete and policy passed"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="${state}" \
            -f context='Remote Analysis Evidence' \
            -f description="${description}" \
            -f target_url="${run_url}" >/dev/null

      - name: Enforce evidence and finding policy
        if: ${{ always() && steps.target.outputs.skip_duplicate_push != 'true' }}
        shell: bash
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          STATUS_OUTCOME: ${{ steps.status.outcome }}
        run: |
          set -euo pipefail
          [[ "${COLLECT_OUTCOME}" == "success" ]]
          [[ "${ARTIFACT_OUTCOME}" == "success" ]]
          [[ "${SUMMARY_OUTCOME}" == "success" ]]
          [[ "${STATUS_OUTCOME}" == "success" ]]

      - name: Record duplicate push suppression
        if: ${{ steps.target.outputs.skip_duplicate_push == 'true' }}
        shell: bash
        run: echo "Remote evidence skipped because an open PR owns verification for this branch."
