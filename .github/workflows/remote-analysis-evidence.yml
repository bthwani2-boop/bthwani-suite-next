name: Remote Analysis Evidence

on:
  workflow_run:
    workflows: ["BThwani Contextual CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact master SHA to re-read
        required: false
        type: string

permissions:
  actions: read
  contents: read
  security-events: read

concurrency:
  group: remote-analysis-evidence-${{ github.event.workflow_run.head_sha || inputs.target_sha || github.sha }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Read back canonical remote analysis evidence
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted evidence collector from master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Resolve exact canonical master SHA
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_master="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/${GITHUB_REPOSITORY}/branches/master" --jq '.commit.sha')"
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            target_sha="${WORKFLOW_RUN_SHA}"
          else
            target_sha="${REQUESTED_SHA:-${live_master}}"
          fi
          if [[ ! "${target_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::target SHA must be a full 40-character commit SHA"
            exit 1
          fi
          if [[ "${target_sha}" != "${live_master}" ]]; then
            echo "::error::Canonical evidence is master-only and fail-closed: target=${target_sha} live_master=${live_master}"
            exit 1
          fi
          echo "sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          echo "Live master exact SHA: ${target_sha}"

      - name: Validate SonarQube Cloud token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo "::error::SONAR_TOKEN is required for canonical Sonar read-back"
            exit 1
          fi

      - name: Collect complete remote analysis evidence
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_REF: refs/heads/master
          TARGET_EVENT: push
          SONAR_BRANCH: master
          EVIDENCE_ROOT: ${{ runner.temp }}/remote-analysis-evidence
          WAIT_FOR_WORKFLOWS_SECONDS: "1800"
          WORKFLOW_POLL_SECONDS: "15"
        run: node tools/scripts/collect-remote-analysis-evidence.mjs

      - name: Upload exact-SHA remote analysis evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-analysis-evidence-${{ steps.target.outputs.sha }}
          path: ${{ runner.temp }}/remote-analysis-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Publish evidence summary
        if: ${{ always() }}
        shell: bash
        run: |
          summary="${RUNNER_TEMP}/remote-analysis-evidence/normalized/summary.json"
          if [[ -f "${summary}" ]]; then
            {
              echo "### Remote Analysis Evidence"
              echo '```json'
              cat "${summary}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::error::normalized evidence summary was not produced"
          fi

      - name: Enforce evidence and finding policy
        if: ${{ always() }}
        shell: bash
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          [[ "${COLLECT_OUTCOME}" == "success" ]]
