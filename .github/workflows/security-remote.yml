name: BThwani h Security

on:
  workflow_call:
    inputs:
      head_sha: {type: string, required: true}
      base_sha: {type: string, required: true}

permissions:
  contents: read

concurrency:
  group: bthwani-h-security-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  security:
    name: Security (${{ matrix.analyzer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        analyzer: [gitleaks, osv-scanner, trivy, actionlint, zizmor, pinact, shellcheck, hadolint, yamllint]
    steps:
      - name: Checkout exact h candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Verify exact candidate and base
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${HEAD_SHA}" ]] || { echo "::error::security candidate drift"; exit 1; }
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          package-manager-cache: false
      - name: Set up locked Go runtime when required
        if: ${{ matrix.analyzer == 'osv-scanner' || matrix.analyzer == 'actionlint' || matrix.analyzer == 'pinact' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache: false
      - name: Install pinned analyzer toolchain
        shell: bash
        env:
          ANALYZER: ${{ matrix.analyzer }}
        run: bash tools/scripts/install-oss-toolchain-binaries.sh "security:${ANALYZER}"
      - name: Run exact-h analyzer
        shell: bash
        env:
          ANALYZER: ${{ matrix.analyzer }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/security-${ANALYZER}"
          mkdir -p "${evidence}"
          log="${evidence}/${ANALYZER}.log"
          case "${ANALYZER}" in
            gitleaks)
              gitleaks detect --gitleaks-ignore-path .gitleaksignore --log-opts="${BASE_SHA}..${HEAD_SHA}" --source . --no-banner --redact --verbose --report-format=json --report-path="${evidence}/gitleaks.json" >"${log}" 2>&1
              ;;
            osv-scanner) node tools/scripts/run-osv-scanner.mjs >"${log}" 2>&1 ;;
            trivy) node tools/scripts/run-trivy.mjs >"${log}" 2>&1 ;;
            actionlint) node tools/scripts/run-actionlint.mjs >"${log}" 2>&1 ;;
            zizmor) node tools/scripts/run-zizmor.mjs >"${log}" 2>&1 ;;
            pinact) node tools/scripts/run-pinact.mjs --verify >"${log}" 2>&1 ;;
            shellcheck) node tools/scripts/run-shellcheck.mjs >"${log}" 2>&1 ;;
            hadolint) node tools/scripts/run-hadolint.mjs >"${log}" 2>&1 ;;
            yamllint) node tools/scripts/run-yamllint.mjs >"${log}" 2>&1 ;;
            *) echo "unknown analyzer ${ANALYZER}" >"${log}"; exit 125 ;;
          esac
          cat "${log}"
      - name: Upload analyzer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h-security-${{ matrix.analyzer }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/security-${{ matrix.analyzer }}
            .diagnostics/security
            .diagnostics/workflow-security
          if-no-files-found: warn
          retention-days: 14
