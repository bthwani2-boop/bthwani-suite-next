name: Remote Security

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Remote security execution profile
        required: true
        default: full
        type: choice
        options: [full, tool]
      tool:
        description: Tool for profile=tool
        required: false
        default: ""
        type: string
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["**"]
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: remote-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    name: Resolve branch event ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip_duplicate_push: ${{ steps.owner.outputs.skip_duplicate_push }}
    steps:
      - name: Resolve push versus PR ownership
        id: owner
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "${EVENT_NAME}" == "push" && "${BRANCH}" != "${DEFAULT_BRANCH}" ]]; then
            open_pr_count="$(gh api --method GET -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/pulls" -f state=open \
              -f head="${GITHUB_REPOSITORY_OWNER}:${BRANCH}" -f per_page=1 --jq 'length')"
            [[ "${open_pr_count}" == "0" ]] || skip=true
          fi
          echo "skip_duplicate_push=${skip}" >> "${GITHUB_OUTPUT}"

  authority:
    name: Verify remote analysis authority
    needs: [ownership]
    if: ${{ needs.ownership.outputs.skip_duplicate_push != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
      - name: Validate requested security profile
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          TOOL: ${{ inputs.tool }}
        run: |
          set -euo pipefail
          allowed='^(semgrep|gitleaks|osv|trivy|actionlint|zizmor|pinact|shellcheck|hadolint|yamllint)$'
          if [[ "${PROFILE}" == "full" ]]; then
            [[ -z "${TOOL}" ]] || { echo "::error::tool must be empty when profile=full"; exit 1; }
          elif [[ "${PROFILE}" == "tool" ]]; then
            [[ "${TOOL}" =~ ${allowed} ]] || { echo "::error::unsupported Remote Security tool '${TOOL}'"; exit 1; }
          else
            echo "::error::unsupported Remote Security profile '${PROFILE}'"
            exit 1
          fi
      - name: Enforce canonical remote analysis authority
        run: node tools/guards/remote-analysis-authority-gate.mjs
      - name: Validate SonarQube Cloud repository configuration
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/check-sonarqube-config.ps1

  security:
    name: OSS security and workflow analysis
    needs: [ownership, authority]
    if: >-
      ${{ needs.ownership.outputs.skip_duplicate_push != 'true' && needs.authority.result == 'success' &&
          (github.event_name != 'workflow_dispatch' || inputs.profile == 'full' || inputs.tool != 'semgrep') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
      - name: Set up locked Go runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache: false
      - name: Install locked remote security toolchain
        id: install
        continue-on-error: true
        shell: bash
        env:
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'full' }}
          TOOL: ${{ inputs.tool }}
        run: |
          set -euo pipefail
          selected=all
          [[ "${PROFILE}" != "tool" ]] || selected="${TOOL}"
          bash tools/scripts/install-oss-toolchain-binaries.sh security "${selected}"
      - name: Run all applicable OSS analyzers and retain every outcome
        id: scan
        continue-on-error: true
        shell: bash
        env:
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'full' }}
          TOOL: ${{ inputs.tool }}
        run: |
          set -u
          mkdir -p .diagnostics/security
          failures=()
          applicable() { [[ "${PROFILE}" == "full" || "${TOOL}" == "$1" ]]; }
          run_analyzer() {
            local name="$1"; shift
            applicable "${name}" || return 0
            echo "=== ${name} ===" | tee ".diagnostics/security/${name}.log"
            set +e
            "$@" 2>&1 | tee -a ".diagnostics/security/${name}.log"
            local status=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "${status}" > ".diagnostics/security/${name}.exit-code"
            [[ ${status} -eq 0 ]] || failures+=("${name}=${status}")
          }
          set -e
          run_analyzer gitleaks gitleaks detect --source . --no-banner --redact --report-format json --report-path .diagnostics/security/gitleaks-report.json
          run_analyzer osv node tools/scripts/run-osv-scanner.mjs
          run_analyzer trivy node tools/scripts/run-trivy.mjs
          if applicable trivy; then node tools/scripts/run-trivy.mjs --diagnostic-only >> .diagnostics/security/trivy.log 2>&1 || true; fi
          run_analyzer actionlint node tools/scripts/run-actionlint.mjs
          run_analyzer zizmor node tools/scripts/run-zizmor.mjs
          run_analyzer pinact pinact run --verify
          run_analyzer shellcheck node tools/scripts/run-shellcheck.mjs
          run_analyzer hadolint node tools/scripts/run-hadolint.mjs
          run_analyzer yamllint node tools/scripts/run-yamllint.mjs
          if ((${#failures[@]})); then
            printf '%s\n' "${failures[@]}" > .diagnostics/security/failed-analyzers.txt
            printf '::error title=Remote OSS security findings/failures::%s\n' "${failures[*]}"
            exit 1
          fi
          echo "All applicable OSS analyzers passed."
      - name: Upload OSS security evidence
        id: artifact
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-security-oss-${{ github.sha }}
          path: .diagnostics/security/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce OSS execution and evidence
        if: ${{ always() }}
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          SCAN: ${{ steps.scan.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
        run: |
          set -euo pipefail
          [[ "${INSTALL}" == "success" ]] || { echo "::error::remote tool installation=${INSTALL}"; exit 1; }
          [[ "${SCAN}" == "success" ]] || { echo "::error::one or more OSS analyzers failed; inspect retained evidence"; exit 1; }
          [[ "${ARTIFACT}" == "success" ]] || { echo "::error::OSS evidence artifact=${ARTIFACT}"; exit 1; }

  semgrep:
    name: Semgrep Code Remote
    needs: [ownership, authority]
    if: >-
      ${{ needs.ownership.outputs.skip_duplicate_push != 'true' && needs.authority.result == 'success' &&
          (github.event_name != 'workflow_dispatch' || inputs.profile == 'full' || inputs.tool == 'semgrep') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout immutable candidate history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Install pinned Semgrep on the hosted runner
        id: install
        continue-on-error: true
        run: bash tools/scripts/install-oss-toolchain-binaries.sh security semgrep
      - name: Run Semgrep Community Edition
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .diagnostics/security
          semgrep scan --config auto --metrics=off --sarif \
            --output .diagnostics/security/semgrep.sarif . \
            2>&1 | tee .diagnostics/security/semgrep.log
      - name: Upload Semgrep SARIF to GitHub code scanning
        id: sarif
        if: ${{ always() && hashFiles('.diagnostics/security/semgrep.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: .diagnostics/security/semgrep.sarif
          category: semgrep-code-remote
      - name: Upload Semgrep evidence
        id: artifact
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-code-remote-${{ github.sha }}
          path: |
            .diagnostics/security/semgrep.sarif
            .diagnostics/security/semgrep.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce Semgrep execution and evidence publication
        if: ${{ always() }}
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          SCAN: ${{ steps.scan.outcome }}
          SARIF: ${{ steps.sarif.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
        run: |
          set -euo pipefail
          failures=()
          [[ "${INSTALL}" == "success" ]] || failures+=("install=${INSTALL}")
          [[ "${SCAN}" == "success" ]] || failures+=("scan=${SCAN}")
          [[ "${SARIF}" == "success" ]] || failures+=("sarif=${SARIF}")
          [[ "${ARTIFACT}" == "success" ]] || failures+=("artifact=${ARTIFACT}")
          if ((${#failures[@]})); then
            printf '::error title=Semgrep Code Remote failed::%s\n' "${failures[*]}"
            exit 1
          fi
          echo "Semgrep completed remotely and published SARIF plus retained evidence."

  result:
    name: Remote Security result
    needs: [ownership, authority, security, semgrep]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce applicable remote security jobs
        shell: bash
        env:
          SKIP_DUPLICATE_PUSH: ${{ needs.ownership.outputs.skip_duplicate_push }}
          AUTHORITY: ${{ needs.authority.result }}
          OSS_SECURITY: ${{ needs.security.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          EVENT_NAME: ${{ github.event_name }}
          PROFILE: ${{ inputs.profile }}
          TOOL: ${{ inputs.tool }}
        run: |
          set -euo pipefail
          if [[ "${SKIP_DUPLICATE_PUSH}" == "true" ]]; then echo "Open PR owns candidate security analysis."; exit 0; fi
          [[ "${AUTHORITY}" == "success" ]] || { echo "::error::authority=${AUTHORITY}"; exit 1; }
          profile=full; tool=""
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then profile="${PROFILE}"; tool="${TOOL}"; fi
          if [[ "${profile}" == "full" ]]; then
            [[ "${OSS_SECURITY}" == "success" && "${SEMGREP}" == "success" ]]
          elif [[ "${tool}" == "semgrep" ]]; then
            [[ "${SEMGREP}" == "success" ]]
          else
            [[ "${OSS_SECURITY}" == "success" ]]
          fi
