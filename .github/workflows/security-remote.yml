name: Remote Security

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["**"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: remote-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    name: Resolve branch event ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip_duplicate_push: ${{ steps.owner.outputs.skip_duplicate_push }}
    steps:
      - name: Resolve push versus PR ownership
        id: owner
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "${EVENT_NAME}" == "push" && "${BRANCH}" != "${DEFAULT_BRANCH}" ]]; then
            open_pr_count="$(gh api --method GET \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open \
              -f head="${GITHUB_REPOSITORY_OWNER}:${BRANCH}" \
              -f per_page=1 \
              --jq 'length')"
            if [[ "${open_pr_count}" != "0" ]]; then
              skip=true
            fi
          fi
          echo "skip_duplicate_push=${skip}" >> "${GITHUB_OUTPUT}"

  authority:
    name: Remote analysis authority
    needs: [ownership]
    if: ${{ needs.ownership.outputs.skip_duplicate_push != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Enforce remote-only Sonar and CodeQL authority
        run: node tools/guards/remote-analysis-authority-gate.mjs

      - name: Verify SonarQube Cloud CI configuration
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/check-sonarqube-config.ps1

  security:
    name: Remote security and workflow hygiene
    needs: [ownership]
    if: ${{ needs.ownership.outputs.skip_duplicate_push != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable candidate with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Set up locked Go runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache: false

      - name: Install locked remote security toolchain
        shell: bash
        run: bash tools/scripts/install-oss-toolchain-binaries.sh security

      - name: Run Gitleaks
        shell: bash
        run: gitleaks detect --gitleaks-ignore-path .gitleaksignore --log-opts="HEAD" --source . --no-banner --redact --verbose

      - name: Run OSV Scanner
        run: node tools/scripts/run-osv-scanner.mjs

      - name: Run Trivy
        run: node tools/scripts/run-trivy.mjs

      - name: Run actionlint
        run: node tools/scripts/run-actionlint.mjs

      - name: Run zizmor
        run: node tools/scripts/run-zizmor.mjs

      - name: Verify action pins
        run: node tools/scripts/run-pinact.mjs --verify

      - name: Run ShellCheck
        run: node tools/scripts/run-shellcheck.mjs

      - name: Run Hadolint
        run: node tools/scripts/run-hadolint.mjs

      - name: Run yamllint
        run: node tools/scripts/run-yamllint.mjs

  result:
    name: Remote security result
    needs: [ownership, authority, security]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce remote security results
        shell: bash
        env:
          SKIP_DUPLICATE_PUSH: ${{ needs.ownership.outputs.skip_duplicate_push }}
          OWNERSHIP_RESULT: ${{ needs.ownership.result }}
          AUTHORITY_RESULT: ${{ needs.authority.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          [[ "${OWNERSHIP_RESULT}" == "success" ]] || {
            echo "::error title=Remote security ownership failed::ownership:${OWNERSHIP_RESULT}"
            exit 1
          }

          if [[ "${SKIP_DUPLICATE_PUSH}" == "true" ]]; then
            echo "development push skipped because an open PR owns security verification"
            exit 0
          fi

          failures=()
          [[ "${AUTHORITY_RESULT}" == "success" ]] || failures+=("authority:${AUTHORITY_RESULT}")
          [[ "${SECURITY_RESULT}" == "success" ]] || failures+=("security:${SECURITY_RESULT}")

          if [[ "${#failures[@]}" -ne 0 ]]; then
            echo "::error title=Remote security failed::$(IFS=,; echo "${failures[*]}")"
            exit 1
          fi

          echo "All remote security gates passed."