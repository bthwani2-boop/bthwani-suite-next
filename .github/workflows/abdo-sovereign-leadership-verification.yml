name: Abdo Sovereign Leadership Verification

on:
  push:
    branches:
      - abdo
    paths:
      - "core/identity/**"
      - "core/workforce/**"
      - "services/dsh/frontend/**"
      - "apps/control-panel/runtime/**"
      - "openapi.yaml"
      - ".github/workflows/abdo-sovereign-leadership-verification.yml"
  pull_request:
    branches:
      - master
    paths:
      - "core/identity/**"
      - "core/workforce/**"
      - "services/dsh/frontend/**"
      - "apps/control-panel/runtime/**"
      - "openapi.yaml"
      - ".github/workflows/abdo-sovereign-leadership-verification.yml"

permissions:
  contents: read

concurrency:
  group: abdo-sovereign-leadership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/identity/backend/go.mod
          cache-dependency-path: |
            core/identity/backend/go.sum
            core/workforce/backend/go.sum
      - name: Test Identity
        working-directory: core/identity/backend
        run: go test ./...
      - name: Test Workforce
        working-directory: core/workforce/backend
        run: go test ./...

  control-panel-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
      - name: Enable pnpm
        run: corepack enable
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Run control-panel typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm --dir apps/control-panel/runtime typecheck > typecheck.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat typecheck.log
          exit 0
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abdo-control-panel-typecheck-${{ github.run_id }}
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce typecheck result
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
