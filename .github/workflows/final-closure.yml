name: BThwani Final Closure
run-name: Final Closure PR ${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to close exactly
        required: true
        type: string
      expected_head_sha:
        description: Optional exact expected PR head SHA
        required: false
        type: string
      expected_base_sha:
        description: Optional exact expected PR base SHA
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  security-events: write
  statuses: write

concurrency:
  group: bthwani-final-closure-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  resolve:
    name: Resolve exact live PR candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      pr_number: ${{ steps.identity.outputs.pr_number }}
      head_ref: ${{ steps.identity.outputs.head_ref }}
      head_sha: ${{ steps.identity.outputs.head_sha }}
      base_ref: ${{ steps.identity.outputs.base_ref }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
      dependency_changed: ${{ steps.identity.outputs.dependency_changed }}
      docker_changed: ${{ steps.identity.outputs.docker_changed }}
    steps:
      - name: Resolve live PR identity
        id: identity
        shell: bash
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          [[ "${INPUT_PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::an open PR number is required"; exit 1; }
          pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR_NUMBER}")"
          [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || { echo "::error::PR is not open"; exit 1; }
          [[ "$(jq -r '.draft' <<<"${pr}")" == "false" ]] || { echo "::error::Final Closure requires a non-draft PR"; exit 1; }
          head_ref="$(jq -r '.head.ref' <<<"${pr}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr}")"
          base_sha="$(jq -r '.base.sha' <<<"${pr}")"
          [[ -z "${EXPECTED_HEAD_SHA:-}" || "${EXPECTED_HEAD_SHA}" == "${head_sha}" ]] || { echo "::error::expected head SHA is stale"; exit 1; }
          [[ -z "${EXPECTED_BASE_SHA:-}" || "${EXPECTED_BASE_SHA}" == "${base_sha}" ]] || { echo "::error::expected base SHA is stale"; exit 1; }
          {
            echo "pr_number=${INPUT_PR_NUMBER}"
            echo "head_ref=${head_ref}"
            echo "head_sha=${head_sha}"
            echo "base_ref=${base_ref}"
            echo "base_sha=${base_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout exact candidate and derive the canonical changed-file truth
        id: diff
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.identity.outputs.head_sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Classify the exact Base-to-Head diff
        id: classification
        shell: bash
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          HEAD_SHA: ${{ steps.identity.outputs.head_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRDTUXB "${BASE_SHA}" "${HEAD_SHA}" --)
          dependency=false
          docker=false
          for file in "${files[@]}"; do
            if [[ "${file}" =~ (^|/)(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|go\.mod|go\.sum|requirements[^/]*\.txt|poetry\.lock|Cargo\.lock)$ ]]; then
              dependency=true
            fi
            if [[ "${file}" == ".dockerignore" || "${file}" =~ (^|/)(Dockerfile(\..*)?|[^/]*\.dockerfile)$ || "${file}" == infra/* ]]; then
              docker=true
            fi
          done
          echo "dependency_changed=${dependency}" >> "${GITHUB_OUTPUT}"
          echo "docker_changed=${docker}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Exact final candidate"
            echo "- PR: #${{ steps.identity.outputs.pr_number }}"
            echo "- Head: ${{ steps.identity.outputs.head_ref }}@${HEAD_SHA}"
            echo "- Base: ${{ steps.identity.outputs.base_ref }}@${BASE_SHA}"
            echo "- Changed files: ${#files[@]}"
          } >> "${GITHUB_STEP_SUMMARY}"

  ci:
    name: Full CI preflight
    needs: [resolve]
    if: ${{ needs.resolve.result == 'success' }}
    uses: ./.github/workflows/ci-check.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      expected_head_sha: ${{ needs.resolve.outputs.head_sha }}
      expected_base_sha: ${{ needs.resolve.outputs.base_sha }}
      # Final Closure is the last exact-candidate gate before merge: its
      # preflight must never be able to skip a proof dimension for a material
      # change. The router's risk classes keep normal CI proportional; the
      # final candidate proves the full scope.
      full_scope: true

  sonar:
    name: SonarQube exact analysis
    needs: [resolve, ci]
    if: ${{ needs.resolve.result == 'success' && needs.ci.result == 'success' }}
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      head_ref: ${{ needs.resolve.outputs.head_ref }}
      base_ref: ${{ needs.resolve.outputs.base_ref }}

  codeql:
    name: CodeQL exact analysis
    needs: [resolve, ci]
    if: ${{ needs.resolve.result == 'success' && needs.ci.result == 'success' }}
    uses: ./.github/workflows/codeql.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      head_ref: ${{ needs.resolve.outputs.head_ref }}
      base_ref: ${{ needs.resolve.outputs.base_ref }}

  semgrep:
    name: Semgrep exact analysis
    needs: [resolve, ci]
    if: ${{ needs.resolve.result == 'success' && needs.ci.result == 'success' }}
    uses: ./.github/workflows/semgrep.yml
    with:
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}

  security:
    name: Security exact analysis
    needs: [resolve, ci]
    if: ${{ needs.resolve.result == 'success' && needs.ci.result == 'success' }}
    uses: ./.github/workflows/security-remote.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      head_ref: ${{ needs.resolve.outputs.head_ref }}
      base_ref: ${{ needs.resolve.outputs.base_ref }}

  dependency:
    name: Dependency review when applicable
    needs: [resolve, ci]
    if: ${{ needs.resolve.result == 'success' && needs.ci.result == 'success' && needs.resolve.outputs.dependency_changed == 'true' }}
    uses: ./.github/workflows/dependency-review.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      base_ref: ${{ needs.resolve.outputs.base_ref }}
      head_ref: ${{ needs.resolve.outputs.head_ref }}
      expected_sha: ${{ needs.resolve.outputs.head_sha }}

  lockfile:
    name: Lockfile integrity when applicable
    needs: [resolve, ci]
    if: ${{ needs.resolve.result == 'success' && needs.ci.result == 'success' && needs.resolve.outputs.dependency_changed == 'true' }}
    uses: ./.github/workflows/lockfile-integrity.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}

  docker:
    name: Docker policy when applicable
    needs: [resolve, ci]
    if: ${{ needs.resolve.result == 'success' && needs.ci.result == 'success' && needs.resolve.outputs.docker_changed == 'true' }}
    uses: ./.github/workflows/docker-runtime-hardening.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}

  final:
    name: BThwani / Final Closure
    needs: [resolve, ci, sonar, codeql, semgrep, security, dependency, lockfile, docker]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Enforce fail-closed exact closure
        shell: bash
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          CI_RESULT: ${{ needs.ci.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency.result }}
          DEPENDENCY_CHANGED: ${{ needs.resolve.outputs.dependency_changed }}
          LOCKFILE_RESULT: ${{ needs.lockfile.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DOCKER_CHANGED: ${{ needs.resolve.outputs.docker_changed }}
        run: |
          set -euo pipefail
          failures=()
          for pair in \
            "resolve:${RESOLVE_RESULT}" \
            "full-ci:${CI_RESULT}" \
            "sonar:${SONAR_RESULT}" \
            "codeql:${CODEQL_RESULT}" \
            "semgrep:${SEMGREP_RESULT}" \
            "security:${SECURITY_RESULT}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            [[ "${result}" == "success" ]] || failures+=("${name}:${result}")
          done
          if [[ "${DEPENDENCY_CHANGED}" == "true" ]]; then
            [[ "${DEPENDENCY_RESULT}" == "success" ]] || failures+=("dependency:${DEPENDENCY_RESULT}")
            [[ "${LOCKFILE_RESULT}" == "success" ]] || failures+=("lockfile:${LOCKFILE_RESULT}")
          fi
          if [[ "${DOCKER_CHANGED}" == "true" ]]; then
            [[ "${DOCKER_RESULT}" == "success" ]] || failures+=("docker:${DOCKER_RESULT}")
          fi
          if (( ${#failures[@]} == 0 )); then
            live_pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            [[ "$(jq -r '.state' <<<"${live_pr}")" == "open" ]] || failures+=("target:closed")
            [[ "$(jq -r '.draft' <<<"${live_pr}")" == "false" ]] || failures+=("target:draft")
            [[ "$(jq -r '.head.sha' <<<"${live_pr}")" == "${HEAD_SHA}" ]] || failures+=("target:head-moved")
            [[ "$(jq -r '.base.sha' <<<"${live_pr}")" == "${BASE_SHA}" ]] || failures+=("target:base-moved")
          fi
          if (( ${#failures[@]} == 0 )); then
            # Catastrophic-harm domains (identity, WLT/finance, migrations,
            # auth/authorization, cancellation, workflows) require explicit
            # human review bound to the exact candidate. GitHub cannot grant
            # an actor approval for their own pull request, so an approval
            # with commit_id == HEAD is an independent human decision on this
            # exact byte state. Stale approvals on older heads do not count.
            reviews="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" || echo '[]')"
            approvals_on_head="$(jq -r --arg head "${HEAD_SHA}" '[.[] | select(.state == "APPROVED" and .commit_id == $head)] | length' <<<"${reviews}" || echo 0)"
            if (( approvals_on_head < 1 )); then
              failures+=("human-review:0-approvals-bound-to-${HEAD_SHA}")
            fi
          fi
          if (( ${#failures[@]} )); then
            gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=failure -f context='BThwani / Final Closure' \
              -f description="Final Closure failed: $(IFS=,; echo "${failures[*]}")" >/dev/null || true
            echo "::error::Final Closure failed for ${HEAD_SHA}: $(IFS=,; echo "${failures[*]}")"
            exit 1
          fi
          gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context='BThwani / Final Closure' \
            -f description="Exact PR #${PR_NUMBER} closure passed" >/dev/null
          echo "Exact PR #${PR_NUMBER} closure passed for ${HEAD_SHA}"
      - name: Checkout exact candidate for the closure manifest
        if: ${{ !cancelled() && needs.resolve.result == 'success' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Publish the generated exact-candidate closure manifest
        if: ${{ !cancelled() && needs.resolve.result == 'success' }}
        shell: bash
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          CI_RESULT: ${{ needs.ci.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency.result }}
          LOCKFILE_RESULT: ${{ needs.lockfile.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"
          merge_base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRDTUXB "${BASE_SHA}" "${HEAD_SHA}" --)
          mapfile -t migrations < <(printf '%s\n' "${files[@]}" | grep -E '/database/migrations/' || true)
          mapfile -t manifests < <(printf '%s\n' "${files[@]}" | grep -E '/database/migrations/manifest\.json$' || true)
          amendments_touched="false"
          printf '%s\n' "${files[@]}" | grep -qx 'tools/verification/migration-amendments.json' && amendments_touched="true"
          classifier="$(CI_BASE_SHA="${BASE_SHA}" CI_HEAD_SHA="${HEAD_SHA}" node tools/scripts/detect-ci-context.mjs)"
          risk_classes="$(jq -r '.risk_classes | join(",")' <<<"${classifier}")"
          required_jobs="$(jq -r '.required_jobs | join(",")' <<<"${classifier}")"
          reviews="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" || echo '[]')"
          approvals_on_head="$(jq -r --arg head "${HEAD_SHA}" '[.[] | select(.state == "APPROVED" and .commit_id == $head)] | length' <<<"${reviews}" || echo 0)"
          manifest="$(mktemp -d)/closure-manifest.json"
          jq -n \
            --arg schema "bthwani-closure-manifest/1" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg prNumber "${PR_NUMBER}" \
            --arg headRef "${HEAD_REF}" \
            --arg headSha "${HEAD_SHA}" \
            --arg baseRef "${BASE_REF}" \
            --arg baseSha "${BASE_SHA}" \
            --arg mergeBase "${merge_base}" \
            --argjson changedFiles "${#files[@]}" \
            --argjson files "$(printf '%s\n' "${files[@]}" | jq -R . | jq -s .)" \
            --arg riskClasses "${risk_classes}" \
            --arg requiredJobs "${required_jobs}" \
            --argjson migrations "$(printf '%s\n' "${migrations[@]}" | jq -R . | jq -s .)" \
            --argjson migrationManifests "$(printf '%s\n' "${manifests[@]}" | jq -R . | jq -s .)" \
            --arg amendmentsTouched "${amendments_touched}" \
            --arg ciResult "${CI_RESULT}" \
            --arg sonarResult "${SONAR_RESULT}" \
            --arg codeqlResult "${CODEQL_RESULT}" \
            --arg semgrepResult "${SEMGREP_RESULT}" \
            --arg securityResult "${SECURITY_RESULT}" \
            --arg dependencyResult "${DEPENDENCY_RESULT}" \
            --arg lockfileResult "${LOCKFILE_RESULT}" \
            --arg dockerResult "${DOCKER_RESULT}" \
            --argjson approvalsOnHead "${approvals_on_head}" \
            '{
              schema: $schema,
              source: "generated-from-git-truth",
              repository: $repository,
              generatedAt: $generatedAt,
              runUrl: $runUrl,
              pr: {number: ($prNumber | tonumber), headRef: $headRef, headSha: $headSha, baseRef: $baseRef, baseSha: $baseSha, mergeBaseSha: $mergeBase},
              candidate: {changedFiles: $changedFiles, files: $files},
              mandatoryProofs: {riskClasses: ($riskClasses | split(",") | map(select(length > 0))), requiredJobs: ($requiredJobs | split(",") | map(select(length > 0)))},
              migrations: {changed: $migrations, manifests: $migrationManifests, amendmentsRegistryTouched: ($amendmentsTouched == "true")},
              analysis: {ci: $ciResult, sonar: $sonarResult, codeql: $codeqlResult, semgrep: $semgrepResult, security: $securityResult, dependency: $dependencyResult, lockfile: $lockfileResult, docker: $dockerResult},
              humanReview: {required: true, approvalsBoundToHead: $approvalsOnHead}
            }' > "${manifest}"
          mkdir -p closure-evidence
          cp "${manifest}" closure-evidence/closure-manifest.json
          {
            echo "### BThwani generated closure manifest (Git truth)"
            echo "- PR #${PR_NUMBER}: ${HEAD_REF}@${HEAD_SHA} <- ${BASE_REF}@${BASE_SHA}"
            echo "- Changed files: ${#files[@]} (migrations: ${#migrations[@]}, amendment registry touched: ${amendments_touched})"
            echo "- Risk classes: ${risk_classes:-none}"
            echo "- Required jobs: ${required_jobs:-none}"
            echo "- Approvals bound to head: ${approvals_on_head}"
            echo "- Manifest artifact: closure-manifest.json (this run)"
          } >> "${GITHUB_STEP_SUMMARY}"
          cat "${manifest}"
      - name: Upload the generated closure manifest
        if: ${{ !cancelled() && needs.resolve.result == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: closure-manifest-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.head_sha }}
          path: closure-evidence/closure-manifest.json
          if-no-files-found: error
          retention-days: 90
