name: BThwani h Final Baseline
run-name: h final ${{ inputs.expected_head_sha || github.sha }} @ ${{ inputs.expected_base_sha || 'parent' }}

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact h candidate SHA; defaults to dispatched h SHA
        required: false
        type: string
      expected_base_sha:
        description: Exact ancestor base SHA; defaults to candidate first parent
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bthwani-h-final-${{ inputs.expected_head_sha || github.sha }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  TRUSTED_H_BRANCH: h

jobs:
  resolve:
    name: Resolve exact h final candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      head_sha: ${{ steps.identity.outputs.head_sha }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
    steps:
      - name: Checkout exact h candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.expected_head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Verify exact h candidate identity
        id: identity
        shell: bash
        env:
          INPUT_HEAD_SHA: ${{ inputs.expected_head_sha }}
          INPUT_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "${TRUSTED_H_BRANCH}" ]] || {
            echo "::error::Final baseline must run from h; got ${GITHUB_REF_NAME}"
            exit 1
          }
          actual_head="$(git rev-parse HEAD)"
          head_sha="${INPUT_HEAD_SHA:-${GITHUB_SHA}}"
          [[ "${head_sha}" =~ ^[0-9a-fA-F]{40}$ && "${actual_head}" == "${head_sha}" ]] || {
            echo "::error::exact h candidate mismatch"
            exit 1
          }
          base_sha="${INPUT_BASE_SHA:-}"
          if [[ -z "${base_sha}" ]]; then
            base_sha="$(git rev-parse "${head_sha}^")"
          fi
          [[ "${base_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::exact base SHA required"
            exit 1
          }
          git cat-file -e "${base_sha}^{commit}"
          git merge-base --is-ancestor "${base_sha}" "${head_sha}" || {
            echo "::error::final base is not an ancestor of h candidate"
            exit 1
          }
          {
            echo "head_sha=${head_sha}"
            echo "base_sha=${base_sha}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### h final exact candidate"
            echo "- head: ${head_sha}"
            echo "- base: ${base_sha}"
            echo "- authority: h"
          } >> "${GITHUB_STEP_SUMMARY}"

  ci:
    name: Full exact-h verification
    needs: [resolve]
    if: ${{ needs.resolve.result == 'success' }}
    permissions:
      actions: read
      contents: read
      statuses: write
    uses: ./.github/workflows/ci-check.yml
    with:
      expected_head_sha: ${{ needs.resolve.outputs.head_sha }}
      expected_base_sha: ${{ needs.resolve.outputs.base_sha }}
      full_scope: true

  sonar:
    name: Sonar full exact-h analysis
    needs: [resolve]
    if: ${{ needs.resolve.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit
    with:
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}

  codeql:
    name: CodeQL full exact-h analysis
    needs: [resolve]
    if: ${{ needs.resolve.result == 'success' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}

  semgrep:
    name: Semgrep full exact-h analysis
    needs: [resolve]
    if: ${{ needs.resolve.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/semgrep.yml
    with:
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}

  security:
    name: Security exact-h analysis
    needs: [resolve]
    if: ${{ needs.resolve.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/security-remote.yml
    with:
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}

  rendered-web:
    name: Rendered Web exact-h evidence
    needs: [resolve]
    if: ${{ needs.resolve.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/rendered-web-evidence.yml
    with:
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}

  dependency:
    name: Dependency exact-h review
    needs: [resolve]
    if: ${{ needs.resolve.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/dependency-review.yml
    with:
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}

  lockfile:
    name: Lockfile exact-h integrity
    needs: [resolve]
    if: ${{ needs.resolve.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/lockfile-integrity.yml
    with:
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}

  docker:
    name: Docker exact-h hardening
    needs: [resolve]
    if: ${{ needs.resolve.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/docker-runtime-hardening.yml
    with:
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}

  final:
    name: BThwani / h Final Baseline
    needs: [resolve, ci, sonar, codeql, semgrep, security, rendered-web, dependency, lockfile, docker]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Enforce complete exact-h evidence collection
        shell: bash
        env:
          RESOLVE: ${{ needs.resolve.result }}
          CI: ${{ needs.ci.result }}
          SONAR: ${{ needs.sonar.result }}
          CODEQL: ${{ needs.codeql.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          SECURITY: ${{ needs.security.result }}
          RENDERED_WEB: ${{ needs.rendered-web.result }}
          DEPENDENCY: ${{ needs.dependency.result }}
          LOCKFILE: ${{ needs.lockfile.result }}
          DOCKER: ${{ needs.docker.result }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha || inputs.expected_head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "${TRUSTED_H_BRANCH}" ]] || {
            echo "::error::final status authority is h only"
            exit 1
          }
          failures=()
          for pair in \
            "resolve:${RESOLVE}" "ci:${CI}" "sonar:${SONAR}" "codeql:${CODEQL}" \
            "semgrep:${SEMGREP}" "security:${SECURITY}" "rendered-web:${RENDERED_WEB}" \
            "dependency:${DEPENDENCY}" "lockfile:${LOCKFILE}" "docker:${DOCKER}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            [[ "${result}" == "success" ]] || failures+=("${name}:${result}")
          done

          context='BThwani / h Final Baseline'
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          state=success
          description='Exact h final baseline evidence passed'
          if (( ${#failures[@]} )); then
            state=failure
            description="h final baseline OPEN: $(IFS=,; echo "${failures[*]}")"
          fi

          gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f context="${context}" \
            -f description="${description:0:140}" \
            -f target_url="${target_url}" >/dev/null

          if [[ "${state}" != "success" ]]; then
            echo "::error::${description}"
            exit 1
          fi
          echo "Exact h final baseline evidence passed for ${HEAD_SHA}."
