name: BThwani Final Closure

run-name: >-
  Final Closure PR ${{ inputs.pr_number || github.event.pull_request.number || 'live' }}

"on":
  pull_request:
    types: [ready_for_review]
    branches: ["**"]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to close exactly
        required: true
        type: string
      expected_head_sha:
        description: Optional expected exact PR head SHA
        required: false
        type: string
      expected_base_sha:
        description: Optional expected exact PR base SHA
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  security-events: read
  statuses: write

concurrency:
  group: bthwani-final-closure-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  resolve:
    name: Resolve exact live PR candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pr_number: ${{ steps.identity.outputs.pr_number }}
      head_ref: ${{ steps.identity.outputs.head_ref }}
      head_sha: ${{ steps.identity.outputs.head_sha }}
      base_ref: ${{ steps.identity.outputs.base_ref }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
      changed_files: ${{ steps.identity.outputs.changed_files }}
      dependency_changed: ${{ steps.identity.outputs.dependency_changed }}
      docker_changed: ${{ steps.identity.outputs.docker_changed }}
    steps:
      - name: Resolve live PR identity and exact candidate
        id: identity
        shell: bash
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          pr_number="${INPUT_PR_NUMBER:-${EVENT_PR_NUMBER:-}}"
          [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::an open PR number is required"; exit 1; }
          pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || { echo "::error::PR is not open"; exit 1; }
          [[ "$(jq -r '.draft' <<<"${pr}")" == "false" ]] || { echo "::error::Final Closure requires a non-draft PR"; exit 1; }
          head_ref="$(jq -r '.head.ref' <<<"${pr}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr}")"
          base_sha="$(jq -r '.base.sha' <<<"${pr}")"
          [[ -z "${EXPECTED_HEAD_SHA:-}" || "${EXPECTED_HEAD_SHA}" == "${head_sha}" ]] || { echo "::error::expected head SHA is stale"; exit 1; }
          [[ -z "${EXPECTED_BASE_SHA:-}" || "${EXPECTED_BASE_SHA}" == "${base_sha}" ]] || { echo "::error::expected base SHA is stale"; exit 1; }
          changed_files="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files?per_page=100" --jq '.[].filename' | paste -sd, -)"
          dependency_changed=false
          docker_changed=false
          IFS=',' read -r -a files <<< "${changed_files}"
          for file in "${files[@]}"; do
            case "${file}" in
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|*/package.json|*/go.mod|*/go.sum|*/requirements*.txt|*/Cargo.lock) dependency_changed=true ;;
            esac
            case "${file}" in
              .dockerignore|infra/docker/*|*Dockerfile*|*.dockerfile|tools/scripts/*.ps1|services/*/database/scripts/*.ps1|apps/*/runtime/*.ps1|core/*/Dockerfile) docker_changed=true ;;
            esac
          done
          {
            echo "pr_number=${pr_number}"
            echo "head_ref=${head_ref}"
            echo "head_sha=${head_sha}"
            echo "base_ref=${base_ref}"
            echo "base_sha=${base_sha}"
            echo "changed_files=${changed_files}"
            echo "dependency_changed=${dependency_changed}"
            echo "docker_changed=${docker_changed}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Exact final candidate"
            echo "- PR: #${pr_number}"
            echo "- Head: ${head_ref}@${head_sha}"
            echo "- Base: ${base_ref}@${base_sha}"
          } >> "${GITHUB_STEP_SUMMARY}"

  ci:
    name: Fast PR Gate
    needs: [resolve]
    uses: ./.github/workflows/ci.yml
    with:
      mode: affected
      journey: ""
      runtime_proof: false
      target_kind: pull_request
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      expected_head_sha: ${{ needs.resolve.outputs.head_sha }}
      expected_base_sha: ${{ needs.resolve.outputs.base_sha }}

  sonar:
    name: SonarQube exact analysis
    needs: [resolve]
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      head_ref: ${{ needs.resolve.outputs.head_ref }}
      base_ref: ${{ needs.resolve.outputs.base_ref }}

  codeql:
    name: CodeQL exact analysis
    needs: [resolve]
    uses: ./.github/workflows/codeql.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      head_ref: ${{ needs.resolve.outputs.head_ref }}
      base_ref: ${{ needs.resolve.outputs.base_ref }}

  semgrep:
    name: Semgrep exact analysis
    needs: [resolve]
    uses: ./.github/workflows/semgrep.yml
    with:
      mode: full
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      base_ref: ${{ needs.resolve.outputs.base_ref }}
      head_ref: ${{ needs.resolve.outputs.head_ref }}

  security:
    name: Security exact analysis
    needs: [resolve]
    uses: ./.github/workflows/security-remote.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      head_ref: ${{ needs.resolve.outputs.head_ref }}
      base_ref: ${{ needs.resolve.outputs.base_ref }}

  semantic:
    name: Deterministic semantic review context
    needs: [resolve]
    uses: ./.github/workflows/open-code-review.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      base_ref: ${{ needs.resolve.outputs.base_ref }}

  dependency:
    name: Dependency review when applicable
    needs: [resolve]
    if: ${{ needs.resolve.outputs.dependency_changed == 'true' }}
    uses: ./.github/workflows/dependency-review.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      base_ref: ${{ needs.resolve.outputs.base_ref }}
      head_ref: ${{ needs.resolve.outputs.head_ref }}
      expected_sha: ${{ needs.resolve.outputs.head_sha }}

  docker:
    name: Docker policy when applicable
    needs: [resolve]
    if: ${{ needs.resolve.outputs.docker_changed == 'true' }}
    uses: ./.github/workflows/docker-runtime-hardening.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}

  final:
    name: BThwani / Final Closure
    needs: [resolve, ci, sonar, codeql, semgrep, security, semantic, dependency, docker]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce fail-closed exact closure
        shell: bash
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          CI_RESULT: ${{ needs.ci.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SEMANTIC_RESULT: ${{ needs.semantic.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          failures=()
          for pair in \
            "resolve:${RESOLVE_RESULT}" \
            "fast-gate:${CI_RESULT}" \
            "sonar:${SONAR_RESULT}" \
            "codeql:${CODEQL_RESULT}" \
            "semgrep:${SEMGREP_RESULT}" \
            "security:${SECURITY_RESULT}" \
            "semantic:${SEMANTIC_RESULT}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            [[ "${result}" == "success" ]] || failures+=("${name}:${result}")
          done
          [[ "${DEPENDENCY_RESULT}" == "success" || "${DEPENDENCY_RESULT}" == "skipped" ]] || failures+=("dependency:${DEPENDENCY_RESULT}")
          [[ "${DOCKER_RESULT}" == "success" || "${DOCKER_RESULT}" == "skipped" ]] || failures+=("docker:${DOCKER_RESULT}")
          if (( ${#failures[@]} )); then
            gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=failure -f context='BThwani / Final Closure' \
              -f description="Final Closure failed: $(IFS=,; echo "${failures[*]}")" >/dev/null || true
            echo "::error::Final Closure failed: $(IFS=,; echo "${failures[*]}")"
            exit 1
          fi
          gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context='BThwani / Final Closure' \
            -f description="Exact PR #${PR_NUMBER} closure passed" >/dev/null
          echo "Exact PR #${PR_NUMBER} closure passed for ${HEAD_SHA}"
