name: CodeQL

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect CodeQL scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      actions: ${{ steps.route.outputs.actions }}
      javascript: ${{ steps.route.outputs.javascript }}
      go_matrix: ${{ steps.route.outputs.go_matrix }}
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Reuse contextual CI routing
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          MODE=affected
          BASE_SHA="${PR_BASE_SHA:-}"

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            MODE=full
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "${HEAD_SHA}")"
          elif [[ -z "${BASE_SHA}" ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "${HEAD_SHA}")"
          elif git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- | grep -Eq '^\.github/workflows/'; then
            # CI verification machinery must never certify itself partially.
            MODE=full
          fi

          CI_BASE_SHA="${BASE_SHA}" \
          CI_HEAD_SHA="${HEAD_SHA}" \
          CI_MODE="${MODE}" \
          node tools/scripts/detect-ci-context.mjs

      - name: Build CodeQL execution matrix
        id: route
        shell: bash
        env:
          FULL: ${{ steps.scope.outputs.full_verification }}
          WORKFLOW: ${{ steps.scope.outputs.workflow }}
          GOVERNANCE: ${{ steps.scope.outputs.governance }}
          SECURITY: ${{ steps.scope.outputs.security }}
          NODE: ${{ steps.scope.outputs.node }}
          DSH: ${{ steps.scope.outputs.dsh }}
          WLT: ${{ steps.scope.outputs.wlt }}
          IDENTITY: ${{ steps.scope.outputs.identity }}
          WORKFORCE: ${{ steps.scope.outputs.workforce }}
          PLATFORM: ${{ steps.scope.outputs.platform }}
          PROVIDERS: ${{ steps.scope.outputs.providers }}
        run: |
          set -euo pipefail

          actions=false
          javascript=false
          if [[ "${WORKFLOW}" == "true" ]]; then actions=true; fi
          if [[ "${NODE}" == "true" || "${GOVERNANCE}" == "true" || "${SECURITY}" == "true" ]]; then javascript=true; fi

          include='[]'
          add_go() {
            local key="$1" mod="$2" dir="$3"
            include="$(jq -c --arg key "$key" --arg mod "$mod" --arg dir "$dir" '. + [{key:$key,go_mod:$mod,workdir:$dir}]' <<<"${include}")"
          }

          if [[ "${DSH}" == "true" ]]; then add_go dsh services/dsh/backend/go.mod services/dsh/backend; fi
          if [[ "${WLT}" == "true" ]]; then add_go wlt services/wlt/backend/go.mod services/wlt/backend; fi
          if [[ "${IDENTITY}" == "true" ]]; then add_go identity core/identity/backend/go.mod core/identity/backend; fi
          if [[ "${WORKFORCE}" == "true" ]]; then add_go workforce core/workforce/backend/go.mod core/workforce/backend; fi
          if [[ "${PLATFORM}" == "true" ]]; then add_go platform-control core/platform-control/backend/go.mod core/platform-control/backend; fi
          if [[ "${PROVIDERS}" == "true" ]]; then add_go providers core/providers/backend/go.mod core/providers/backend; fi

          {
            printf 'actions=%s\n' "${actions}"
            printf 'javascript=%s\n' "${javascript}"
            printf 'go_matrix={"include":%s}\n' "${include}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### CodeQL contextual routing"
            echo "- Actions: ${actions}"
            echo "- JavaScript/TypeScript: ${javascript}"
            echo "- Go matrix: ${include}"
          } >> "${GITHUB_STEP_SUMMARY}"

  analyze-actions:
    name: Analyze actions
    needs: [scope]
    if: ${{ needs.scope.outputs.actions == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          show-progress: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:actions"

  analyze-javascript-typescript:
    name: Analyze javascript-typescript
    needs: [scope]
    if: ${{ needs.scope.outputs.javascript == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          show-progress: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:javascript-typescript"

  analyze-go:
    name: Analyze go (${{ matrix.key }})
    needs: [scope]
    if: ${{ needs.scope.outputs.go_matrix != '{"include":[]}' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.go_matrix) }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up locked Go runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache-dependency-path: ${{ matrix.workdir }}/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: go
          build-mode: manual
          queries: security-extended
          dependency-caching: true

      - name: Build ${{ matrix.key }} backend for analysis
        working-directory: ${{ matrix.workdir }}
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:go-${{ matrix.key }}"

  result:
    name: CodeQL result
    needs: [scope, analyze-actions, analyze-javascript-typescript, analyze-go]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce routed CodeQL results
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          ACTIONS_RESULT: ${{ needs.analyze-actions.result }}
          JAVASCRIPT_RESULT: ${{ needs.analyze-javascript-typescript.result }}
          GO_RESULT: ${{ needs.analyze-go.result }}
        run: |
          set -euo pipefail
          printf 'scope=%s actions=%s javascript=%s go=%s\n' \
            "${SCOPE_RESULT}" "${ACTIONS_RESULT}" "${JAVASCRIPT_RESULT}" "${GO_RESULT}"

          if [[ "${SCOPE_RESULT}" != "success" ]]; then
            echo "::error title=CodeQL routing failed::scope classifier did not complete successfully"
            exit 1
          fi

          for result in "${ACTIONS_RESULT}" "${JAVASCRIPT_RESULT}" "${GO_RESULT}"; do
            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "::error title=CodeQL analysis failed::one or more required routed analyzers failed or were cancelled"
              exit 1
            fi
          done

          echo "CodeQL routed analysis passed. Skipped analyzers were outside the affected scope."
