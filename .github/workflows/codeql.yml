name: CodeQL

run-name: >-
  ${{ github.event_name == 'pull_request' && format('CodeQL PR {0}', github.event.pull_request.number) ||
  github.event_name == 'push' && format('CodeQL push {0}', github.sha) || format('CodeQL dispatched candidate
  {0}', inputs.head_sha || github.sha) }}

on:
  workflow_call:
    inputs:
      pr_number: {type: string, required: false, default: ""}
      head_sha: {type: string, required: true}
      base_sha: {type: string, required: true}
      head_ref: {type: string, required: false, default: ""}
      base_ref: {type: string, required: false, default: ""}
      full_scope: {type: boolean, required: false, default: false}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codeql-${{ inputs.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect CodeQL scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      languages: ${{ steps.scope.outputs.languages }}
      go_matrix: ${{ steps.scope.outputs.go_matrix }}
      actions_required: ${{ steps.scope.outputs.actions_required }}
      skip_duplicate_push: ${{ steps.scope.outputs.skip_duplicate_push }}
      full_scope: ${{ steps.scope.outputs.full_scope }}
    steps:
      - name: Checkout immutable candidate history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Resolve affected CodeQL languages
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_FULL_SCOPE: ${{ inputs.full_scope }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          all_modules=(
            dsh=services/dsh/backend
            wlt=services/wlt/backend
            identity=core/identity/backend
            workforce=core/workforce/backend
            platform-control=core/platform-control/backend
            providers=core/providers/backend
          )
          head_sha="$(git rev-parse HEAD)"
          [[ "${head_sha}" == "${EXPECTED_HEAD_SHA}" ]] || {
            echo \
            "::error::CodeQL scope checkout SHA mismatch: expected=${EXPECTED_HEAD_SHA:-<empty>} actual=${head_sha}"
            exit 1
          }
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_PR_NUMBER:-}" ]]; then
            [[ "${INPUT_PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || { echo \
            "::error::pr_number must be a positive integer"; exit 1; }
            [[ "${INPUT_BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::base_sha must be a full SHA"; exit 1; }
            pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR_NUMBER}")"
            [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || { echo "::error::closure PR is not open"; exit 1; }
            [[ "$(jq -r '.head.sha' <<<"${pr}")" == "${EXPECTED_HEAD_SHA}" ]] || { echo \
            "::error::closure PR head drift"; exit 1; }
            [[ "$(jq -r '.base.sha' <<<"${pr}")" == "${INPUT_BASE_SHA}" ]] || { echo \
            "::error::closure PR base drift"; exit 1; }
          fi
          full=false
          skip_duplicate=false
          if [[ "${INPUT_FULL_SCOPE}" == "true" ]]; then
            full=true
          elif [[ "${EVENT_NAME}" == "schedule" || \
                  ( "${EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ) || \
                  ( "${EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ) ]]; then
            full=true
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            open_pr_count="$(gh api --method GET \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open \
              -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
              -f per_page=1 \
              --jq 'length')"
            if [[ "${open_pr_count}" != "0" ]]; then skip_duplicate=true; fi
          fi

          js=false
          go=false
          actions=false
          modules=()
          add_module() {
            local candidate="$1"
            for existing in "${modules[@]:-}"; do
              if [[ "${existing}" == "${candidate}" ]]; then return; fi
            done
            modules+=("${candidate}")
          }

          if [[ "${full}" == "true" ]]; then
            js=true
            go=true
            actions=true
            modules=("${all_modules[@]}")
          elif [[ "${skip_duplicate}" != "true" ]]; then
            base_sha="${PR_BASE_SHA:-${EVENT_BEFORE:-}}"
            if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
              base_sha="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "${head_sha}")"
            fi
            while IFS= read -r file; do
              [[ -n "${file}" ]] || continue
              case "${file}" in
                .github/actions/*|.github/workflows/*) actions=true ;;
              esac
              case "${file}" in
                *.js|*.jsx|*.ts|*.tsx|*.mjs|*.cjs|package.json|pnpm-lock.yaml) js=true ;;
              esac
              case "${file}" in
                go.work|.go-version)
                  go=true
                  modules=("${all_modules[@]}")
                  ;;
                services/dsh/backend/*) go=true; add_module dsh=services/dsh/backend ;;
                services/wlt/backend/*) go=true; add_module wlt=services/wlt/backend ;;
                core/identity/backend/*) go=true; add_module identity=core/identity/backend ;;
                core/workforce/backend/*) go=true; add_module workforce=core/workforce/backend ;;
                core/platform-control/backend/*) go=true; add_module platform-control=core/platform-control/backend ;;
                core/providers/backend/*) go=true; add_module providers=core/providers/backend ;;
              esac
            done < <(git diff --name-only "${base_sha}" "${head_sha}")
          fi

          languages='[]'
          if [[ "${js}" == "true" ]]; then languages="$(jq -c '. + ["javascript-typescript"]' <<<"${languages}")"; fi
          if [[ "${go}" == "true" ]]; then languages="$(jq -c '. + ["go"]' <<<"${languages}")"; fi
          go_modules_filter='split("\n") | map(select(length > 0) | split("=") | {key: .[0], workdir: .[1]})'
          go_modules="$(printf '%s\n' "${modules[@]:-}" | jq -Rsc "${go_modules_filter}")"
          {
            echo "languages=${languages}"
            echo "go_matrix=${go_modules}"
            echo "actions_required=${actions}"
            echo "skip_duplicate_push=${skip_duplicate}"
            echo "full_scope=${full}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### CodeQL scope"
            echo "- Full scope: ${full}"
            echo "- Languages: ${languages}"
            echo "- Go modules: ${go_modules:-[]}"
            echo "- Actions: ${actions}"
            echo "- Duplicate development push skipped: ${skip_duplicate}"
          } >> "${GITHUB_STEP_SUMMARY}"

  analyze-javascript-typescript:
    name: Analyze javascript-typescript
    needs: [scope]
    if: >-
      ${{ needs.scope.outputs.skip_duplicate_push != 'true' && contains(needs.scope.outputs.languages,
      'javascript-typescript') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:javascript-typescript"
          upload: never
          output: ${{ runner.temp }}/codeql-sarif

      - name: Upload unprivileged JavaScript CodeQL evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-javascript-typescript-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          retention-days: 2

  analyze-go:
    name: Analyze go (${{ matrix.key }})
    needs: [scope]
    if: >-
      ${{ needs.scope.outputs.skip_duplicate_push != 'true' && contains(needs.scope.outputs.languages, 'go')
      && needs.scope.outputs.go_matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.go_matrix) }}
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Set up locked Go runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache-dependency-path: |
            services/dsh/backend/go.sum
            services/wlt/backend/go.sum
            core/identity/backend/go.sum
            core/workforce/backend/go.sum
            core/platform-control/backend/go.sum
            core/providers/backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: go
          build-mode: manual
          queries: security-extended

      - name: Build affected Go module
        shell: bash
        env:
          GOWORK: off
          GO_MODULE: ${{ matrix.workdir }}
        run: |
          set -euo pipefail
          echo "CodeQL build: ${GO_MODULE}"
          cd "${GO_MODULE}"
          go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:go-${{ matrix.key }}"
          upload: never
          output: ${{ runner.temp }}/codeql-sarif

      - name: Upload unprivileged Go CodeQL evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-go-${{ matrix.key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          retention-days: 2

  analyze-actions:
    name: Analyze actions
    needs: [scope]
    if: ${{ needs.scope.outputs.skip_duplicate_push != 'true' && needs.scope.outputs.actions_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:actions"
          upload: never
          output: ${{ runner.temp }}/codeql-sarif

      - name: Upload unprivileged Actions CodeQL evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-actions-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          retention-days: 2

  disposition:
    name: Consume CodeQL findings and diff scope
    needs: [scope, analyze-javascript-typescript, analyze-go, analyze-actions]
    if: >-
      ${{ always() && needs.scope.result == 'success' &&
      needs.scope.outputs.skip_duplicate_push != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      status: ${{ steps.classify.outputs.status }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ inputs.head_sha || github.sha }}
      BASE_SHA: ${{ inputs.base_sha || github.event.before || '' }}
      # Full analyzers still run for exact closure; PR disposition is diff-scoped so inherited
      # baseline alerts do not masquerade as new change findings.
      MODE: ${{ inputs.pr_number != '' && 'affected' || (needs.scope.outputs.full_scope == 'true' && 'full' || 'affected') }}
      LANGUAGES: ${{ needs.scope.outputs.languages }}
      ACTIONS_REQUIRED: ${{ needs.scope.outputs.actions_required }}
      SCOPE_RESULT: ${{ needs.scope.result }}
      JAVASCRIPT_RESULT: ${{ needs.analyze-javascript-typescript.result }}
      GO_RESULT: ${{ needs.analyze-go.result }}
      ACTIONS_RESULT: ${{ needs.analyze-actions.result }}
    steps:
      - name: Checkout immutable candidate history for the diff boundary
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify analyzer outcomes and candidate ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]] || {
            echo "::error::CodeQL disposition candidate checkout drift"
            exit 1
          }
          if [[ -n "${BASE_SHA}" ]]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            git merge-base --is-ancestor "${BASE_SHA}" "${CANDIDATE_SHA}" || {
              echo "::error::CodeQL disposition base is not an ancestor of the candidate"
              exit 1
            }
          fi
          [[ "${LANGUAGES}" != *javascript-typescript* || "${JAVASCRIPT_RESULT}" == "success" ]] || {
            echo "::error::CodeQL JavaScript analysis did not complete"
            exit 1
          }
          [[ "${LANGUAGES}" != *go* || "${GO_RESULT}" == "success" ]] || {
            echo "::error::CodeQL Go analysis did not complete"
            exit 1
          }
          [[ "${ACTIONS_REQUIRED}" != "true" || "${ACTIONS_RESULT}" == "success" ]] || {
            echo "::error::CodeQL Actions analysis did not complete"
            exit 1
          }
          if [[ -n "${BASE_SHA}" && "${MODE}" == "affected" ]]; then
            git diff --no-ext-diff --unified=0 "${BASE_SHA}" "${CANDIDATE_SHA}" -- > "${RUNNER_TEMP}/codeql.diff"
          else
            : > "${RUNNER_TEMP}/codeql.diff"
          fi

      - name: Load trusted CodeQL evidence classifier
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted_classifier="${RUNNER_TEMP}/classify-codeql-evidence.mjs"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/tools/scripts/classify-codeql-evidence.mjs" \
            -f "ref=${TRUSTED_WORKFLOW_SHA}" --jq '.content' | base64 --decode > "${trusted_classifier}"
          [[ -s "${trusted_classifier}" ]] || { echo "::error::trusted CodeQL classifier missing"; exit 1; }
          node --check "${trusted_classifier}"
          echo "TRUSTED_CODEQL_CLASSIFIER=${trusted_classifier}" >> "${GITHUB_ENV}"

      - name: Download unprivileged CodeQL SARIF evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LANGUAGES}" == "[]" && "${ACTIONS_REQUIRED}" != "true" ]]; then
            mkdir -p "${RUNNER_TEMP}/codeql-sarif"
            echo "No CodeQL analyzer is applicable to this exact candidate."
            exit 0
          fi
          artifacts="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          destination="${RUNNER_TEMP}/codeql-sarif"
          mkdir -p "${destination}"
          mapfile -t artifact_ids < <(jq -r '.artifacts[] | select(.name | startswith("codeql-sarif-")) | .id' <<<"${artifacts}")
          for artifact_id in "${artifact_ids[@]}"; do
            archive="${RUNNER_TEMP}/codeql-${artifact_id}.zip"
            target="${destination}/${artifact_id}"
            mkdir -p "${target}"
            gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${archive}"
            while IFS= read -r entry; do
              [[ -n "${entry}" && "${entry}" != ".." && "${entry}" != /* && "${entry}" != ../* && \
                "${entry}" != */../* && "${entry}" != */.. ]] || {
                echo "::error::unsafe CodeQL SARIF artifact path"
                exit 1
              }
            done < <(unzip -Z1 "${archive}")
            unzip -q "${archive}" -d "${target}"
          done

      # Consume CodeQL findings with explicit disposition before the trusted upload boundary.
      # Consume exact CodeQL findings before trusted upload.
      # Related CodeQL locations are evaluated against the same exact candidate diff cone.
      - name: Consume CodeQL findings with explicit disposition
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/codeql-evidence"
          if [[ "${LANGUAGES}" == "[]" && "${ACTIONS_REQUIRED}" != "true" ]]; then
            mkdir -p "${output_dir}"
            jq -n \
              --arg headSha "${CANDIDATE_SHA}" \
              --arg baseSha "${BASE_SHA}" \
              '{schema:"bthwani-codeql-evidence/1",candidate:{headSha:$headSha,baseSha:$baseSha},mode:"not-applicable",status:"NOT_APPLICABLE",executionStatus:"NOT_APPLICABLE",coverageStatus:"NOT_APPLICABLE",findingStatus:"NOT_APPLICABLE",evidenceConsumption:"NOT_APPLICABLE",evidenceComplete:true,closureClaim:false,counts:{documents:0,categories:0,findings:0,materialFindings:0,scopedFindings:0,scopedMaterialFindings:0,inheritedFindings:0,errors:0}}' \
              > "${output_dir}/summary.json"
            echo "status=NOT_APPLICABLE" >> "${GITHUB_OUTPUT}"
            cat "${output_dir}/summary.json"
            exit 0
          fi
          node "${TRUSTED_CODEQL_CLASSIFIER}" \
            --input-dir "${RUNNER_TEMP}/codeql-sarif" \
            --output-dir "${output_dir}" \
            --head-sha "${CANDIDATE_SHA}" \
            --base-sha "${BASE_SHA}" \
            --mode "${MODE}" \
            --diff-file "${RUNNER_TEMP}/codeql.diff" || classifier_exit=$?
          classifier_exit="${classifier_exit:-0}"
          [[ -s "${output_dir}/summary.json" ]] || {
            echo "::error::CodeQL classifier did not produce evidence"
            exit 1
          }
          status="$(jq -r '.status' "${output_dir}/summary.json")"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          cat "${output_dir}/summary.json"
          # Findings are not execution failures. They remain explicit in the disposition artifact;
          # only incomplete SARIF is a collection failure here.
          [[ "${classifier_exit}" == "0" || "${status}" == "FINDINGS_OPEN" ]] || {
            echo "::error::CodeQL evidence is incomplete"
            exit 1
          }

      - name: Upload CodeQL finding disposition evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-disposition-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-evidence
          if-no-files-found: error
          retention-days: 14

  upload:
    name: Upload trusted CodeQL SARIF
    needs: [scope, analyze-javascript-typescript, analyze-go, analyze-actions, disposition]
    if: >-
      ${{ needs.scope.outputs.skip_duplicate_push != 'true' && needs.scope.outputs.full_scope == 'true' &&
      needs.analyze-javascript-typescript.result == 'success' && needs.analyze-go.result == 'success' &&
      needs.analyze-actions.result == 'success' && needs.disposition.result == 'success' &&
      (github.event_name == 'workflow_call' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ inputs.head_sha || github.sha }}
      CANDIDATE_REF: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || inputs.head_ref && format('refs/heads/{0}', inputs.head_ref) || github.ref }}
      PR_NUMBER: ${{ inputs.pr_number }}
      BASE_SHA: ${{ inputs.base_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Revalidate trusted definition and immutable upload identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]] || {
            echo "::error::CodeQL SARIF upload requires the default-branch workflow definition"
            exit 1
          }
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::CodeQL candidate SHA is invalid"; exit 1; }
          [[ "${CANDIDATE_REF}" == refs/* ]] || { echo "::error::CodeQL candidate ref is invalid"; exit 1; }
          if [[ -n "${PR_NUMBER:-}" ]]; then
            pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || { echo "::error::CodeQL closure PR is not open"; exit 1; }
            [[ "$(jq -r '.head.sha' <<<"${pr}")" == "${CANDIDATE_SHA}" ]] || { echo \
            "::error::CodeQL closure PR head drift"; exit 1; }
            [[ "$(jq -r '.base.sha' <<<"${pr}")" == "${BASE_SHA}" ]] || { echo \
            "::error::CodeQL closure PR base drift"; exit 1; }
          fi

      - name: Download unprivileged CodeQL SARIF artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
          "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          mapfile -t artifact_ids < <(jq -r \
          '.artifacts[] | select(.name | startswith("codeql-sarif-")) | .id' <<<"${artifacts}")
          [[ "${#artifact_ids[@]}" -eq 8 ]] || { echo \
          "::error::expected 8 full-baseline CodeQL SARIF artifacts"; exit 1; }
          destination="${RUNNER_TEMP}/codeql-sarif"
          mkdir -p "${destination}"
          for artifact_id in "${artifact_ids[@]}"; do
            archive="${RUNNER_TEMP}/codeql-${artifact_id}.zip"
            target="${destination}/${artifact_id}"
            mkdir -p "${target}"
            gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${archive}"
            while IFS= read -r entry; do
              [[ -n "${entry}" && "${entry}" != ".." && "${entry}" != /* && "${entry}" != ../* && \
              "${entry}" != */../* && "${entry}" != */.. ]] || {
                echo "::error::unsafe CodeQL SARIF artifact path"
                exit 1
              }
            done < <(unzip -Z1 "${archive}")
            unzip -q "${archive}" -d "${target}"
          done
          mapfile -d '' sarif_files < <(find "${destination}" -type f -name '*.sarif' -print0)
          [[ "${#sarif_files[@]}" -eq 8 ]] || { echo "::error::expected 8 full-baseline SARIF documents"; exit 1; }
          for sarif in "${sarif_files[@]}"; do
            jq -e '.version=="2.1.0" and (.runs | type=="array" and length>0)' "${sarif}" >/dev/null
          done
          expected_categories=(
            /language:javascript-typescript
            /language:actions
            /language:go-dsh
            /language:go-wlt
            /language:go-identity
            /language:go-workforce
            /language:go-platform-control
            /language:go-providers
          )
          mapfile -t actual_categories < <(jq -r '.runs[]?.automationDetails.id // empty' "${sarif_files[@]}" | sed -E 's:/+$::')
          [[ "${#actual_categories[@]}" -eq 8 ]] || { echo \
          "::error::expected one CodeQL automation category per SARIF"; exit 1; }
          for category in "${expected_categories[@]}"; do
            occurrences="$(printf '%s\n' "${actual_categories[@]}" | awk -v expected="${category}" '$0 == \
            expected { count += 1 } END { print count + 0 }')"
            [[ "${occurrences}" == "1" ]] || { echo \
            "::error::CodeQL SARIF category ${category} count=${occurrences}"; exit 1; }
          done
          printf '%s\0' "${sarif_files[@]}" > "${RUNNER_TEMP}/codeql-sarif-files"

      - name: Upload exact CodeQL SARIF through the trusted API boundary
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/codeql-upload-ids.txt"
          : > "${RUNNER_TEMP}/codeql-upload-metadata.tsv"
          printf '%s\n' '[]' > "${RUNNER_TEMP}/codeql-upload-status.json"
          while IFS= read -r -d '' sarif; do
            encoded="${RUNNER_TEMP}/$(basename "${sarif}").gz.b64"
            payload="${encoded}.json"
            category="$(jq -r '.runs[0].automationDetails.id // empty' "${sarif}" | sed -E 's:/+$::')"
            [[ -n "${category}" ]] || { echo "::error::CodeQL SARIF automation category missing"; exit 1; }
            gzip -c -- "${sarif}" | base64 -w0 > "${encoded}"
            jq -Rs --arg commit_sha "${CANDIDATE_SHA}" --arg ref "${CANDIDATE_REF}" \
            '{commit_sha:$commit_sha,ref:$ref,sarif:.}' "${encoded}" > "${payload}"
            upload_id="$(gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs" --input "${payload}" --jq '.id')"
            [[ -n "${upload_id}" ]] || { echo "::error::CodeQL SARIF upload id missing"; exit 1; }
            echo "${upload_id}" >> "${RUNNER_TEMP}/codeql-upload-ids.txt"
            printf '%s\t%s\n' "${upload_id}" "${category}" >> "${RUNNER_TEMP}/codeql-upload-metadata.tsv"
          done < "${RUNNER_TEMP}/codeql-sarif-files"

          [[ -s "${RUNNER_TEMP}/codeql-upload-ids.txt" ]] || {
            echo "::error::CodeQL SARIF upload ids missing"
            exit 1
          }
          while IFS=$'\t' read -r upload_id expected_category; do
            [[ -n "${upload_id}" && -n "${expected_category}" ]] || {
              echo "::error::CodeQL upload lifecycle metadata is incomplete"
              exit 1
            }
            sarif_status_endpoint="/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs/${upload_id}"
            processing_status=""
            analyses_url=""
            for attempt in $(seq 1 60); do
              sarif_status="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "${sarif_status_endpoint}")"
              processing_status="$(jq -r '.processing_status // empty' <<<"${sarif_status}")"
              analyses_url="$(jq -r '.analyses_url // empty' <<<"${sarif_status}")"
              case "${processing_status}" in
                complete)
                  break
                  ;;
                pending|processing|working)
                  sleep 2
                  ;;
                failed|error)
                  echo "::error::CodeQL SARIF processing failed for upload ${upload_id}: ${processing_status}"
                  exit 1
                  ;;
                *)
                  echo "::error::Unknown CodeQL SARIF processing status for upload ${upload_id}: ${processing_status:-<empty>}"
                  exit 1
                  ;;
              esac
            done
            [[ "${processing_status}" == "complete" ]] || {
              echo "::error::CodeQL SARIF processing did not complete for upload ${upload_id}"
              exit 1
            }
            [[ "${analyses_url}" == https://api.github.com/repos/*/code-scanning/analyses* ]] || {
              echo "::error::CodeQL analyses URL is not a GitHub API URL for upload ${upload_id}"
              exit 1
            }
            analyses_endpoint="${analyses_url#https://api.github.com}"
            analyses="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "${analyses_endpoint}")"
            exact_matches="$(jq --arg upload_id "${upload_id}" --arg candidate_sha "${CANDIDATE_SHA}" \
              --arg candidate_ref "${CANDIDATE_REF}" --arg expected_category "${expected_category}" \
              '[.analyses[]? | select((.sarif_id|tostring) == $upload_id and .commit_sha == $candidate_sha and .ref == $candidate_ref and ((.category // "") | rtrimstr("/")) == $expected_category)] | length' \
              <<<"${analyses}")"
            [[ "${exact_matches}" == "1" ]] || {
              echo "::error::CodeQL analysis binding mismatch for upload ${upload_id}: matches=${exact_matches}"
              exit 1
            }
            jq --arg upload_id "${upload_id}" --arg category "${expected_category}" \
              --arg status "${processing_status}" --arg analyses_url "${analyses_url}" \
              '. += [{uploadId:$upload_id,category:$category,processingStatus:$status,analysesUrl:$analyses_url,exactBinding:true}]' \
              "${RUNNER_TEMP}/codeql-upload-status.json" > "${RUNNER_TEMP}/codeql-upload-status.next.json"
            mv "${RUNNER_TEMP}/codeql-upload-status.next.json" "${RUNNER_TEMP}/codeql-upload-status.json"
          done < "${RUNNER_TEMP}/codeql-upload-metadata.tsv"
          echo "CodeQL SARIF uploads processed and bound to the exact candidate"

      - name: Upload CodeQL trusted ingestion lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-upload-lifecycle-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-upload-status.json
          if-no-files-found: error
          retention-days: 14

  result:
    name: >-
      ${{ github.event_name == 'pull_request' && 'CodeQL / PR result' || github.event_name == 'push' &&
      'CodeQL / push result' || 'CodeQL / dispatched result' }}
    needs: [scope, analyze-javascript-typescript, analyze-go, analyze-actions, disposition, upload]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce CodeQL findings were consumed and dispositioned
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          JAVASCRIPT_RESULT: ${{ needs.analyze-javascript-typescript.result }}
          GO_RESULT: ${{ needs.analyze-go.result }}
          ACTIONS_RESULT: ${{ needs.analyze-actions.result }}
          DISPOSITION_RESULT: ${{ needs.disposition.result }}
          DISPOSITION_STATUS: ${{ needs.disposition.outputs.status }}
          UPLOAD_RESULT: ${{ needs.upload.result }}
          MODE: ${{ inputs.pr_number != '' && 'affected' || (needs.scope.outputs.full_scope == 'true' && 'full' || 'affected') }}
          LANGUAGES: ${{ needs.scope.outputs.languages }}
          ACTIONS_REQUIRED: ${{ needs.scope.outputs.actions_required }}
          FULL_SCOPE: ${{ needs.scope.outputs.full_scope }}
          SKIP_DUPLICATE_PUSH: ${{ needs.scope.outputs.skip_duplicate_push }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${SCOPE_RESULT}" != "success" ]]; then
            echo "::error title=CodeQL scope failed::scope resolution did not complete"
            exit 1
          fi
          if [[ "${SKIP_DUPLICATE_PUSH}" == "true" ]]; then
            echo "CodeQL development push skipped because an open PR owns the same branch analysis."
            exit 0
          fi
          if [[ "${LANGUAGES}" == "[]" && "${ACTIONS_REQUIRED}" != "true" ]]; then
            [[ "${DISPOSITION_RESULT}" == "success" && "${DISPOSITION_STATUS}" == "NOT_APPLICABLE" ]] || {
              echo "::error title=CodeQL applicability unresolved::no analyzer was applicable but disposition was not explicit"
              exit 1
            }
            [[ "${UPLOAD_RESULT}" == "skipped" ]] || {
              echo "::error::non-applicable CodeQL analysis unexpectedly ran the write boundary"
              exit 1
            }
            echo "CodeQL is not applicable to this exact candidate."
            exit 0
          fi
          [[ "${DISPOSITION_RESULT}" == "success" ]] || {
            echo "::error title=CodeQL evidence incomplete::SARIF evidence was not consumed successfully"
            exit 1
          }
          [[ "${DISPOSITION_STATUS}" == "PASS" ]] || {
            echo "::error title=CodeQL findings require treatment::status=${DISPOSITION_STATUS}; inspect the disposition artifact"
            exit 1
          }
          if [[ "${MODE}" == "affected" ]]; then
            echo "CodeQL changed-cone verification passed; inherited baseline findings are not a repository-clean claim."
          fi
          if [[ "${LANGUAGES}" == *javascript-typescript* && "${JAVASCRIPT_RESULT}" != "success" ]]; then
            echo "::error title=CodeQL JavaScript analysis failed::applicable source-language analysis failed"
            exit 1
          fi
          if [[ "${LANGUAGES}" == *'go'* && "${GO_RESULT}" != "success" ]]; then
            echo "::error title=CodeQL Go analysis failed::applicable source-language analysis failed"
            exit 1
          fi
          if [[ "${ACTIONS_REQUIRED}" == "true" && "${ACTIONS_RESULT}" != "success" ]]; then
            echo "::error title=CodeQL actions analysis failed::workflow analysis failed"
            exit 1
          fi
          trusted_upload_required=false
          if [[ "${FULL_SCOPE}" == "true" && ( \
                "${EVENT_NAME}" == "workflow_call" || \
                ( "${EVENT_NAME}" == "workflow_dispatch" && "${REF_NAME}" == "${DEFAULT_BRANCH}" ) || \
                "${EVENT_NAME}" == "schedule" || \
                ( "${EVENT_NAME}" == "push" && "${REF_NAME}" == "${DEFAULT_BRANCH}" ) ) ]]; then
            trusted_upload_required=true
          fi
          if [[ "${trusted_upload_required}" == "true" ]]; then
            [[ "${UPLOAD_RESULT}" == "success" ]] || { echo \
            "::error title=CodeQL trusted upload failed::upload:${UPLOAD_RESULT}"; exit 1; }
          else
            [[ "${UPLOAD_RESULT}" == "skipped" ]] || { echo \
            "::error::non-full or untrusted analysis unexpectedly ran the CodeQL write boundary"; exit 1; }
          fi
          echo "All applicable CodeQL analyses passed."
