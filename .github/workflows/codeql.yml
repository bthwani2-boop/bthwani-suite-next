name: CodeQL

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the historic `analyze/language:*` configuration identity used by the
  # master CodeQL baseline. Splitting this job into differently named jobs or
  # per-module categories makes GitHub Advanced Security treat the base
  # configurations as missing and can misattribute existing alerts to a PR.
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build_mode: none
          - language: go
            build_mode: manual
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Set up locked Go runtime
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache-dependency-path: |
            services/dsh/backend/go.sum
            services/wlt/backend/go.sum
            core/identity/backend/go.sum
            core/workforce/backend/go.sum
            core/platform-control/backend/go.sum
            core/providers/backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          queries: security-extended

      - name: Build all Go backends for one governed analysis database
        if: ${{ matrix.language == 'go' }}
        shell: bash
        run: |
          set -euo pipefail
          for workdir in \
            services/dsh/backend \
            services/wlt/backend \
            core/identity/backend \
            core/workforce/backend \
            core/platform-control/backend \
            core/providers/backend
          do
            echo "CodeQL build: ${workdir}"
            (cd "${workdir}" && go build ./...)
          done

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4

  analyze-actions:
    name: Analyze actions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:actions"

  result:
    name: CodeQL result
    needs: [analyze, analyze-actions]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce CodeQL results
        shell: bash
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          ACTIONS_RESULT: ${{ needs.analyze-actions.result }}
        run: |
          set -euo pipefail
          printf 'analyze=%s actions=%s\n' "${ANALYZE_RESULT}" "${ACTIONS_RESULT}"
          if [[ "${ANALYZE_RESULT}" != "success" || "${ACTIONS_RESULT}" != "success" ]]; then
            echo "::error title=CodeQL analysis failed::one or more required analyzers did not complete successfully"
            exit 1
          fi
          echo "CodeQL analysis passed with baseline-compatible configuration identities."
