name: CodeQL exact-h baseline

on:
  workflow_call:
    inputs:
      head_sha: {type: string, required: true}
      base_sha: {type: string, required: true}

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-h-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL ${{ matrix.key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: javascript-typescript
            language: javascript-typescript
            build_mode: none
            workdir: "."
          - key: actions
            language: actions
            build_mode: none
            workdir: "."
          - key: go-dsh
            language: go
            build_mode: manual
            workdir: services/dsh/backend
          - key: go-wlt
            language: go
            build_mode: manual
            workdir: services/wlt/backend
          - key: go-identity
            language: go
            build_mode: manual
            workdir: core/identity/backend
          - key: go-workforce
            language: go
            build_mode: manual
            workdir: core/workforce/backend
          - key: go-platform-control
            language: go
            build_mode: manual
            workdir: core/platform-control/backend
          - key: go-providers
            language: go
            build_mode: manual
            workdir: core/providers/backend
    env:
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - name: Checkout exact h candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
          show-progress: false

      - name: Verify exact h identity and ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "h" ]] || {
            echo "::error::CodeQL baseline authority is h only"
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${HEAD_SHA}" ]] || {
            echo "::error::CodeQL candidate drift"
            exit 1
          }
          [[ "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::CodeQL exact base SHA required"
            exit 1
          }
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"

      - name: Set up locked Go runtime
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache: true
          cache-dependency-path: |
            services/dsh/backend/go.sum
            services/wlt/backend/go.sum
            core/identity/backend/go.sum
            core/workforce/backend/go.sum
            core/platform-control/backend/go.sum
            core/providers/backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          queries: security-extended

      - name: Build Go module
        if: ${{ matrix.language == 'go' }}
        shell: bash
        env:
          GOWORK: off
          GO_MODULE: ${{ matrix.workdir }}
        run: |
          set -euo pipefail
          cd "${GO_MODULE}"
          go build ./...

      - name: Analyze exact candidate
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: /language:${{ matrix.key }}
          upload: always
          output: ${{ runner.temp }}/codeql-sarif

      - name: Upload CodeQL SARIF evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          retention-days: 14

  disposition:
    name: Consume complete CodeQL baseline
    needs: [analyze]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - name: Require every analyzer to succeed
        shell: bash
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          set -euo pipefail
          [[ "${ANALYZE_RESULT}" == "success" ]] || {
            echo "::error::One or more CodeQL analyzers failed: ${ANALYZE_RESULT}"
            exit 1
          }

      - name: Checkout exact h candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
          show-progress: false

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "h" ]]
          [[ "$(git rev-parse HEAD)" == "${HEAD_SHA}" ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"

      - name: Download every SARIF artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/codeql-sarif"
          mkdir -p "${destination}"
          artifacts="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          mapfile -t artifact_ids < <(
            jq -r '.artifacts[] | select(.name | startswith("codeql-sarif-")) | .id' <<<"${artifacts}"
          )
          [[ "${#artifact_ids[@]}" -eq 8 ]] || {
            echo "::error::Expected exactly 8 CodeQL SARIF artifacts, found ${#artifact_ids[@]}"
            exit 1
          }
          for artifact_id in "${artifact_ids[@]}"; do
            archive="${RUNNER_TEMP}/codeql-${artifact_id}.zip"
            target="${destination}/${artifact_id}"
            mkdir -p "${target}"
            gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${archive}"
            while IFS= read -r entry; do
              [[ -n "${entry}" && "${entry}" != ".." && "${entry}" != /* && \
                "${entry}" != ../* && "${entry}" != */../* && "${entry}" != */.. ]] || {
                echo "::error::Unsafe CodeQL artifact path"
                exit 1
              }
            done < <(unzip -Z1 "${archive}")
            unzip -q "${archive}" -d "${target}"
          done

      - name: Classify and require zero CodeQL findings
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/codeql-evidence"
          node tools/scripts/classify-codeql-evidence.mjs \
            --input-dir "${RUNNER_TEMP}/codeql-sarif" \
            --output-dir "${evidence}" \
            --head-sha "${HEAD_SHA}" \
            --base-sha "${BASE_SHA}" \
            --mode full

          summary="${evidence}/summary.json"
          jq -e '
            .schema == "bthwani-codeql-evidence/1" and
            .mode == "full" and
            .evidenceComplete == true and
            .counts.documents == 8 and
            .counts.categories == 8 and
            .counts.errors == 0 and
            .counts.materialFindings == 0 and
            .status == "PASS"
          ' "${summary}" >/dev/null || {
            echo "::error::CodeQL exact-h baseline is not clean"
            cat "${summary}"
            exit 1
          }

          {
            echo "### CodeQL exact-h baseline"
            echo "- Candidate: \`${HEAD_SHA}\`"
            echo "- SARIF documents: \`$(jq -r '.counts.documents' "${summary}")\`"
            echo "- Categories: \`$(jq -r '.counts.categories' "${summary}")\`"
            echo "- Material findings: \`$(jq -r '.counts.materialFindings' "${summary}")\`"
            echo "- Result: PASS"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload consumed CodeQL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-disposition-${{ env.HEAD_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-evidence
          if-no-files-found: error
          retention-days: 14
