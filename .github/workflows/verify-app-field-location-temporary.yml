name: Temporary App Field Location Verification

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout abdo head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: abdo
          fetch-depth: 1
          persist-credentials: true
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify app-field location correction
        run: |
          pnpm --filter @bthwani/app-field-runtime typecheck
          pnpm --filter @bthwani/app-field-runtime lint
          pnpm --filter @bthwani/app-field-runtime test
          pnpm --dir services/dsh build
          node --test --test-name-pattern="field onboarding validation" services/dsh/tests/field-onboarding-validation.test.mjs
      - name: Remove temporary verifier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-app-field-location-temporary.yml
          git diff --cached --check
          git commit -m "ci(app-field): remove temporary location verifier"
          git push origin HEAD:abdo
