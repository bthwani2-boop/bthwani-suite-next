name: BThwani Runtime Verification

on:
  workflow_call:
    inputs:
      candidate_sha: {type: string, required: true}

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  RUNTIME_COMPONENTS: identity,workforce,dsh,wlt,providers,platform,financial-simulators,mail,media-storage

jobs:
  proof:
    name: Full runtime verification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ && "${ROUTED_CANDIDATE_SHA}" == "${CANDIDATE_SHA}" ]] || {
            echo "::error::Invalid routed candidate SHA"; exit 1;
          }
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Materialize contracts
        run: pnpm exec nx run contracts:materialize
      - name: Bootstrap runtime and read back catalog
        shell: pwsh
        env:
          SOURCE_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw "Runtime checkout SHA mismatch" }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action bootstrap-dev -Profiles $env:RUNTIME_COMPONENTS -Force
          if ($LASTEXITCODE -ne 0) { throw "runtime bootstrap failed" }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action catalog-readback -Profiles $env:RUNTIME_COMPONENTS
          if ($LASTEXITCODE -ne 0) { throw "runtime catalog readback failed" }
      - name: Execute DSH operator governance preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/runtime/smoke-dsh-operator-governance-preflight.ps1
          if ($LASTEXITCODE -ne 0) { throw "DSH operator governance preflight failed" }
      - name: Execute full runtime smoke
        shell: pwsh
        env:
          SOURCE_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw "Runtime checkout SHA mismatch" }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action smoke -Profiles $env:RUNTIME_COMPONENTS
          if ($LASTEXITCODE -ne 0) { throw "runtime smoke failed" }
      - name: Capture runtime diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          docker ps -aq | xargs -r -n1 docker logs --tail 100
      - name: Stop runtime
        if: ${{ always() }}
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File infra/docker/scripts/runtime.ps1 -Action down -Profiles $env:RUNTIME_COMPONENTS
