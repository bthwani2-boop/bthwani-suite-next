name: BThwani Runtime Proof

on:
  workflow_call:
    inputs:
      full_verification:
        type: string
        required: true
      runtime:
        type: string
        required: true
      runtime_proof:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  proof:
    name: Execute scoped runtime proof
    if: ${{ inputs.runtime_proof || (inputs.full_verification == 'true' && inputs.runtime == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Start and verify full runtime
        shell: pwsh
        run: |
          pnpm run runtime:full:up
          pnpm run runtime:full:bootstrap-dev
          pnpm run runtime:full:smoke
      - name: Stop runtime
        if: always()
        shell: pwsh
        run: pnpm run runtime:full:down
