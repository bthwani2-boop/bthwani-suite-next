name: BThwani Runtime Proof

on:
  workflow_call:
    inputs:
      full_verification:
        type: string
        required: true
      runtime:
        type: string
        required: true
      runtime_profile:
        type: string
        required: true
      runtime_proof:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  proof:
    name: Execute scoped Ubuntu runtime proof
    if: ${{ inputs.runtime_proof || inputs.full_verification == 'true' || inputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Execute selected runtime profile
        id: runtime
        shell: pwsh
        env:
          RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $profile = if ([string]::IsNullOrWhiteSpace($env:RUNTIME_PROFILE)) { "none" } else { $env:RUNTIME_PROFILE }
          $sourceSha = if ([string]::IsNullOrWhiteSpace($env:SOURCE_SHA)) { throw "SOURCE_SHA is required" } else { $env:SOURCE_SHA }
          $checkedOutSha = (git rev-parse HEAD).Trim()
          if ($checkedOutSha -ne $sourceSha) { throw "Runtime checkout SHA mismatch: expected $sourceSha, got $checkedOutSha" }
          $logPath = Join-Path $PWD "runtime-smoke.log"
          $resultPath = Join-Path $PWD "runtime-proof.json"
          "Runtime proof started for $sourceSha profile=$profile os=ubuntu" | Set-Content -LiteralPath $logPath

          function Invoke-Phase {
            param([string] $Name, [scriptblock] $Command)
            "=== $Name ===" | Tee-Object -FilePath $logPath -Append
            $global:LASTEXITCODE = 0
            & $Command *>&1 | Tee-Object -FilePath $logPath -Append
            $exitCode = if ($null -eq $LASTEXITCODE) { 0 } else { [int]$LASTEXITCODE }
            "phase=$Name exitCode=$exitCode" | Tee-Object -FilePath $logPath -Append
            if ($exitCode -ne 0) { throw "$Name failed with exit code $exitCode" }
          }

          $profiles = switch ($profile) {
            "identity-security" { "identity,workforce,dsh,media" }
            "dsh" { "dsh,media" }
            "workforce" { "identity,workforce" }
            "wlt-finance" { "identity,dsh,wlt,financial-simulators" }
            "provider" { "wlt,financial-simulators" }
            "full" { "identity,workforce,dsh,wlt,financial-simulators,mail,media" }
            "mobile-config" { "" }
            "mobile-native" { "" }
            default { throw "Unsupported runtime profile: $profile" }
          }

          try {
            if ($profile -in @("mobile-config", "mobile-native")) {
              Invoke-Phase "mobile:apps:check" { pnpm run mobile:apps:check }
              Invoke-Phase "mobile:expo:verify" { pnpm run mobile:expo:verify }
            } else {
              $requiresDshBootstrap = @($profiles.Split(",") | ForEach-Object { $_.Trim() }) -contains "dsh"
              if ($requiresDshBootstrap) {
                Invoke-Phase "runtime:bootstrap-dev" { & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action bootstrap-dev -Profiles $profiles -Force }
              } else {
                Invoke-Phase "runtime:up" { & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action up -Profiles $profiles }
              }
              Invoke-Phase "runtime:catalog-readback" { & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action catalog-readback -Profiles $profiles }
              if ($profile -eq "full") {
                Invoke-Phase "dsh-operator-governance-preflight" { & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/runtime/smoke-dsh-operator-governance-preflight.ps1 }
                Invoke-Phase "runtime:full:smoke" { pnpm run runtime:full:smoke }
                Invoke-Phase "mobile:four-app-integration" { & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/test-dsh-multisurface-runtime-matrix-v2.ps1 }
              } else {
                Invoke-Phase "runtime:smoke" { & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action smoke -Profiles $profiles }
              }
              if ($profile -in @("identity-security", "full")) {
                Invoke-Phase "mobile:lan-runtime" { & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/verify-mobile-lan-runtime.ps1 }
              }
              if ($profile -in @("wlt-finance", "full")) {
                Invoke-Phase "representative-financial-readback" { & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/finance/smoke-dsh-wlt-representative-readback.ps1 }
              }
            }

            $evidenceScope = if ($profile -in @("mobile-native", "mobile-config")) { "mobile-config" } else { "ubuntu-runtime" }
            @{
              schemaVersion = 2
              sourceSha = $sourceSha
              profile = $profile
              evidenceScope = $evidenceScope
              operatingSystem = "ubuntu"
              result = "PASS"
            } | ConvertTo-Json | Set-Content -LiteralPath $resultPath
            "RUNTIME_PROOF_RESULT=PASS scope=$evidenceScope" | Tee-Object -FilePath $logPath -Append
          } catch {
            @{
              schemaVersion = 2
              sourceSha = $sourceSha
              profile = $profile
              evidenceScope = "ubuntu-runtime"
              operatingSystem = "ubuntu"
              result = "FAIL"
              error = $_.Exception.Message
            } | ConvertTo-Json | Set-Content -LiteralPath $resultPath
            "RUNTIME_PROOF_RESULT=FAIL" | Tee-Object -FilePath $logPath -Append
            throw
          }

      - name: Stop runtime
        if: ${{ always() }}
        shell: pwsh
        env:
          RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
        run: |
          $profile = $env:RUNTIME_PROFILE
          $profiles = switch ($profile) {
            "identity-security" { "identity,workforce,dsh,media" }
            "dsh" { "dsh,media" }
            "workforce" { "identity,workforce" }
            "wlt-finance" { "identity,dsh,wlt,financial-simulators" }
            "provider" { "wlt,financial-simulators" }
            "full" { "identity,workforce,dsh,wlt,financial-simulators,mail,media" }
            default { "" }
          }
          if ($profiles) { & pwsh -NoProfile -ExecutionPolicy Bypass -File infra/docker/scripts/runtime.ps1 -Action down -Profiles $profiles }

      - name: Upload Ubuntu runtime proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-proof-ubuntu-${{ github.run_id }}
          path: |
            runtime-smoke.log
            runtime-proof.json
          if-no-files-found: error
          retention-days: 7

  windows-mobile-contracts:
    name: Windows mobile contract proof
    if: ${{ inputs.full_verification == 'true' || inputs.runtime_profile == 'mobile-config' || inputs.runtime_profile == 'mobile-native' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify immutable Windows checkout
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "Windows checkout SHA mismatch: expected $env:SOURCE_SHA, got $actual" }
      - name: Execute Windows-native mobile contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --test apps/mobile/tests/mobile-runtime-transport.contract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows mobile transport contracts failed" }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/verify-mobile-test-stack.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows mobile verification stack failed" }

  android-native:
    name: Android native build proof
    if: ${{ inputs.full_verification == 'true' || inputs.runtime_profile == 'mobile-native' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify canonical configuration and Android build
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          java -version
          pnpm run mobile:apps:check
          pnpm run mobile:expo:verify
          node apps/mobile/verify-mobile-native.mjs --platform android --build
          mkdir -p .diagnostics/mobile-evidence
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('tools/mobile/mobile-apps.manifest.json','utf8'));
          const receipt = {schemaVersion:1,sourceSha:process.env.SOURCE_SHA,result:'PASS',producer:'.github/workflows/ci-runtime.yml#android-native',apps:Object.keys(manifest.apps).sort(),tiers:['mobile:android:native-build'],platform:'android',physicalDevice:false};
          fs.writeFileSync('.diagnostics/mobile-evidence/android-native.json', JSON.stringify(receipt,null,2)+'\n');
          NODE
      - name: Upload Android native evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-evidence-android-native-${{ github.run_id }}
          path: .diagnostics/mobile-evidence/android-native.json
          if-no-files-found: error
          retention-days: 7

  ios-native:
    name: iOS Xcode and Simulator proof
    if: ${{ inputs.full_verification == 'true' || inputs.runtime_profile == 'mobile-native' }}
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify immutable macOS checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          xcodebuild -version
          xcrun simctl help >/dev/null
          pod --version
      - name: Build and launch all iOS Dev Clients in Simulator
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          pnpm run mobile:apps:check
          pnpm run mobile:expo:verify
          node apps/mobile/verify-mobile-native.mjs --platform ios --build --simulator
          mkdir -p .diagnostics/mobile-evidence
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('tools/mobile/mobile-apps.manifest.json','utf8'));
          const receipt = {schemaVersion:1,sourceSha:process.env.SOURCE_SHA,result:'PASS',producer:'.github/workflows/ci-runtime.yml#ios-native',apps:Object.keys(manifest.apps).sort(),tiers:['mobile:ios:native-build','mobile:ios:simulator-launch'],platform:'ios',physicalDevice:false};
          fs.writeFileSync('.diagnostics/mobile-evidence/ios-native-simulator.json', JSON.stringify(receipt,null,2)+'\n');
          NODE
      - name: Upload iOS native evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-evidence-ios-native-${{ github.run_id }}
          path: .diagnostics/mobile-evidence/ios-native-simulator.json
          if-no-files-found: error
          retention-days: 7

  not-required:
    name: Runtime proof not required
    if: ${{ !inputs.runtime_proof && inputs.full_verification != 'true' && inputs.runtime != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm runtime proof not required
        run: echo "runtime proof not required"
