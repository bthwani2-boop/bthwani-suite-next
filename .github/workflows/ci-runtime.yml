name: BThwani Runtime Proof

on:
  workflow_call:
    inputs:
      full_verification:
        type: string
        required: true
      runtime:
        type: string
        required: true
      runtime_proof:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  proof:
    name: Execute scoped runtime proof
    if: ${{ inputs.runtime_proof || (inputs.full_verification == 'true' && inputs.runtime == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Runtime proof
        shell: pwsh
        run: |
          "Runtime proof started for $env:GITHUB_SHA" | Set-Content -LiteralPath runtime-smoke.log

          pnpm run runtime:full:up
          if ($LASTEXITCODE -ne 0) {
            throw "runtime:full:up failed with exit code $LASTEXITCODE"
          }

          pnpm run runtime:full:bootstrap-dev
          if ($LASTEXITCODE -ne 0) {
            throw "runtime:full:bootstrap-dev failed with exit code $LASTEXITCODE"
          }

          pnpm run runtime:full:smoke 2>&1 | Tee-Object -LiteralPath runtime-smoke.log -Append
          if ($LASTEXITCODE -ne 0) {
            throw "runtime:full:smoke failed with exit code $LASTEXITCODE"
          }
      - name: Stop runtime
        if: always()
        shell: pwsh
        run: pnpm run runtime:full:down
      - name: Upload runtime proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: runtime-proof-${{ github.run_id }}
          path: runtime-smoke.log
          if-no-files-found: error
          retention-days: 7

  not-required:
    name: Runtime proof not required
    if: ${{ !inputs.runtime_proof && !(inputs.full_verification == 'true' && inputs.runtime == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm runtime proof not required
        run: echo "runtime proof not required"
