name: BThwani Runtime Proof

on:
  workflow_call:
    inputs:
      head_sha:
        type: string
        required: true
      full_verification:
        type: string
        required: true
      runtime:
        type: string
        required: true
      runtime_profile:
        type: string
        required: true
      runtime_proof:
        type: boolean
        required: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  proof:
    name: Execute scoped runtime proof
    if: ${{ inputs.runtime_proof || inputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${CANDIDATE_SHA}" || "${ROUTED_HEAD_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "::error::Routed head SHA mismatch: routed=${ROUTED_HEAD_SHA:-<empty>} event=${CANDIDATE_SHA:-<empty>}"
            exit 1
          fi
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Materialize contracts through the Nx owner
        if: ${{ inputs.runtime_profile != 'mobile-config' && inputs.runtime_profile != 'mobile-native' }}
        run: pnpm exec nx run contracts:materialize

      - name: Resolve runtime component scope
        id: runtime_scope
        shell: pwsh
        env:
          RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
        run: |
          $ErrorActionPreference = "Stop"
          $profile = if ([string]::IsNullOrWhiteSpace($env:RUNTIME_PROFILE)) { "none" } else { $env:RUNTIME_PROFILE }
          # CI needs MinIO for real upload/evidence flows, but it must never
          # depend on workstation seed images. media-storage selects storage
          # infrastructure only; the local seed-media overlay remains `media`.
          $profiles = switch ($profile) {
            "identity-security" { "identity,workforce,dsh,wlt,media-storage" }
            "dsh" { "dsh,media-storage" }
            "workforce" { "identity,workforce" }
            "wlt-finance" { "identity,dsh,wlt,financial-simulators" }
            "provider" { "wlt,financial-simulators" }
            "full" { "identity,workforce,dsh,wlt,providers,platform,financial-simulators,mail,media-storage" }
            "mobile-config" { "" }
            "mobile-native" { "" }
            default { throw "Unsupported runtime profile: $profile" }
          }
          "profiles=$profiles" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Execute selected runtime profile
        id: runtime
        shell: pwsh
        env:
          RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
          RUNTIME_COMPONENTS: ${{ steps.runtime_scope.outputs.profiles }}
          SOURCE_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          $ErrorActionPreference = "Stop"
          $profile = if ([string]::IsNullOrWhiteSpace($env:RUNTIME_PROFILE)) { "none" } else { $env:RUNTIME_PROFILE }
          $profiles = if ($null -eq $env:RUNTIME_COMPONENTS) { "" } else { $env:RUNTIME_COMPONENTS.Trim() }
          $sourceSha = if ([string]::IsNullOrWhiteSpace($env:SOURCE_SHA)) { throw "SOURCE_SHA is required" } else { $env:SOURCE_SHA }
          $checkedOutSha = (git rev-parse HEAD).Trim()
          if ($checkedOutSha -ne $sourceSha) {
            throw "Runtime checkout SHA mismatch: expected $sourceSha, got $checkedOutSha"
          }
          $logPath = Join-Path $PWD "runtime-smoke.log"
          $resultPath = Join-Path $PWD "runtime-proof.json"
          "Runtime proof started for $sourceSha profile=$profile components=$profiles" | Set-Content -LiteralPath $logPath

          function Invoke-Phase {
            param([string] $Name, [scriptblock] $Command)
            "=== $Name ===" | Tee-Object -FilePath $logPath -Append
            $global:LASTEXITCODE = 0
            & $Command *>&1 | Tee-Object -FilePath $logPath -Append
            $exitCode = if ($null -eq $LASTEXITCODE) { 0 } else { [int]$LASTEXITCODE }
            "phase=$Name exitCode=$exitCode" | Tee-Object -FilePath $logPath -Append
            if ($exitCode -ne 0) { throw "$Name failed with exit code $exitCode" }
          }

          try {
            if ($profile -eq "mobile-config") {
              Invoke-Phase "mobile:apps:check" { pnpm run mobile:apps:check }
              Invoke-Phase "mobile:expo:verify" { pnpm run mobile:expo:verify }
            } elseif ($profile -eq "mobile-native") {
              Invoke-Phase "mobile:apps:check" { pnpm run mobile:apps:check }
              Invoke-Phase "mobile:expo:verify" { pnpm run mobile:expo:verify }
              Invoke-Phase "mobile:native:prebuild" { node apps/mobile/verify-mobile-native.mjs --platform android }
            } else {
              if ([string]::IsNullOrWhiteSpace($profiles)) {
                throw "Runtime profile '$profile' resolved to an empty component scope."
              }
              $requiresDshBootstrap = @($profiles.Split(",") | ForEach-Object { $_.Trim() }) -contains "dsh"
              if ($requiresDshBootstrap) {
                Invoke-Phase "runtime:bootstrap-dev" {
                  & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action bootstrap-dev -Profiles $profiles -Force
                }
              } else {
                Invoke-Phase "runtime:up" {
                  & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action up -Profiles $profiles
                }
              }
              Invoke-Phase "runtime:catalog-readback" {
                & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action catalog-readback -Profiles $profiles
              }
              if ($profile -eq "full") {
                Invoke-Phase "dsh-operator-governance-preflight" {
                  & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/runtime/smoke-dsh-operator-governance-preflight.ps1
                }
                Invoke-Phase "runtime:full:smoke" {
                  & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action smoke -Profiles $profiles
                }
                Invoke-Phase "mobile:four-app-dispatch-readiness" {
                  & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/prepare-dsh-runtime-captain-dispatch.ps1
                }
                Invoke-Phase "mobile:four-app-integration" {
                  & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/test-dsh-multisurface-runtime-matrix-v2.ps1
                }
              } else {
                Invoke-Phase "runtime:smoke" {
                  & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action smoke -Profiles $profiles
                }
              }
              if ($profile -in @("wlt-finance", "full")) {
                Invoke-Phase "representative-financial-readback" {
                  & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/finance/smoke-dsh-wlt-representative-readback.ps1
                }
              }
            }

            @{
              schemaVersion = 1
              sourceSha = $sourceSha
              profile = $profile
              result = "PASS"
            } | ConvertTo-Json | Set-Content -LiteralPath $resultPath
            "RUNTIME_PROOF_RESULT=PASS" | Tee-Object -FilePath $logPath -Append
          } catch {
            @{
              schemaVersion = 1
              sourceSha = $sourceSha
              profile = $profile
              result = "FAIL"
              error = $_.Exception.Message
            } | ConvertTo-Json | Set-Content -LiteralPath $resultPath
            "RUNTIME_PROOF_RESULT=FAIL" | Tee-Object -FilePath $logPath -Append
            throw
          }

      - name: Capture runtime failure diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          log="runtime-container-diagnostics.log"
          : >"${log}"
          {
            echo "=== docker ps -a ==="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            for container in \
              bthwani-identity-api-runtime \
              bthwani-workforce-api-runtime \
              bthwani-dsh-api-runtime \
              bthwani-wlt-api-runtime \
              bthwani-providers-api-runtime \
              bthwani-platform-control-api-runtime; do
              if ! docker inspect "${container}" >/dev/null 2>&1; then
                continue
              fi
              echo
              echo "=== ${container} state ==="
              docker inspect "${container}" --format 'status={{.State.Status}} running={{.State.Running}} exitCode={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'
              echo "=== ${container} logs ==="
              docker logs --tail 250 "${container}" 2>&1
            done
          } | tee -a "${log}"
          exit 0

      - name: Stop runtime
        if: ${{ always() }}
        shell: pwsh
        env:
          RUNTIME_COMPONENTS: ${{ steps.runtime_scope.outputs.profiles }}
        run: |
          $profiles = if ($null -eq $env:RUNTIME_COMPONENTS) { "" } else { $env:RUNTIME_COMPONENTS.Trim() }
          if (-not [string]::IsNullOrWhiteSpace($profiles)) {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File infra/docker/scripts/runtime.ps1 -Action down -Profiles $profiles
          }

      - name: Upload runtime proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-proof-${{ github.run_id }}
          path: |
            runtime-smoke.log
            runtime-proof.json
            runtime-container-diagnostics.log
          if-no-files-found: warn
          retention-days: 7

  not-required:
    name: Runtime proof not required
    if: ${{ !inputs.runtime_proof && inputs.runtime != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm runtime proof not required
        run: echo "runtime proof not required"
