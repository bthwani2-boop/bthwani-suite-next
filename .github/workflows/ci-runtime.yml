name: BThwani Runtime Proof

on:
  workflow_call:
    inputs:
      full_verification:
        type: string
        required: true
      runtime:
        type: string
        required: true
      runtime_proof:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  proof:
    name: Execute scoped runtime proof
    if: ${{ inputs.runtime_proof || inputs.full_verification == 'true' || inputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Runtime proof
        shell: pwsh
        run: |
          $logPath = Join-Path $PWD "runtime-smoke.log"
          "Runtime proof started for $env:GITHUB_SHA" | Set-Content -LiteralPath $logPath

          function Add-RuntimeLog {
            param([Parameter(Mandatory)][string] $Text)
            $Text | Tee-Object -LiteralPath $logPath -Append
          }

          function Invoke-LoggedPhase {
            param(
              [Parameter(Mandatory)][string] $Name,
              [Parameter(Mandatory)][scriptblock] $Command
            )

            Add-RuntimeLog "=== $Name ==="
            try {
              $global:LASTEXITCODE = 0
              & $Command *>&1 | Tee-Object -LiteralPath $logPath -Append
              $exitCode = if ($null -eq $LASTEXITCODE) { 0 } else { [int]$LASTEXITCODE }
              Add-RuntimeLog "phase=$Name exitCode=$exitCode"
              if ($exitCode -ne 0) {
                throw "$Name failed with exit code $exitCode"
              }
            } catch {
              Add-RuntimeLog "PHASE_FAILURE=$Name"
              ($_ | Format-List * -Force | Out-String) | Add-Content -LiteralPath $logPath
              throw
            }
          }

          try {
            $pnpmCommand = Get-Command pnpm -ErrorAction Stop
            Add-RuntimeLog "pwsh=$($PSVersionTable.PSVersion)"
            Add-RuntimeLog "pnpm=$($pnpmCommand.Source)"

            Invoke-LoggedPhase "runtime:full:up" {
              pnpm run runtime:full:up
            }

            Invoke-LoggedPhase "runtime:full:bootstrap-dev" {
              pnpm run runtime:full:bootstrap-dev
            }

            Invoke-LoggedPhase "runtime:full:smoke" {
              pnpm run runtime:full:smoke
            }

            Invoke-LoggedPhase "representative-financial-readback" {
              & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/finance/smoke-dsh-wlt-representative-readback.ps1
            }

            $proof = Get-Content -LiteralPath $logPath -Raw
            if ($proof -notmatch [regex]::Escape("DSH/WLT representative financial readback smoke: PASS")) {
              throw "runtime proof did not record the representative financial readback PASS marker"
            }
            Add-RuntimeLog "RUNTIME_PROOF_RESULT=PASS"
          } catch {
            Add-RuntimeLog "RUNTIME_PROOF_RESULT=FAIL"
            ($_ | Format-List * -Force | Out-String) | Add-Content -LiteralPath $logPath
            throw
          }
      - name: Stop runtime
        if: always()
        shell: pwsh
        run: pnpm run runtime:full:down
      - name: Upload runtime proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: runtime-proof-${{ github.run_id }}
          path: runtime-smoke.log
          if-no-files-found: error
          retention-days: 7

  not-required:
    name: Runtime proof not required
    if: ${{ !inputs.runtime_proof && inputs.full_verification != 'true' && inputs.runtime != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm runtime proof not required
        run: echo "runtime proof not required"
