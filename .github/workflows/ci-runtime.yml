name: BThwani Runtime Verification

on:
  workflow_call:
    inputs:
      candidate_sha: {type: string, required: true}

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  RUNTIME_COMPONENTS: identity,workforce,dsh,wlt,providers,platform,financial-simulators,mail,media-storage

jobs:
  proof:
    name: Full runtime verification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ && "${ROUTED_CANDIDATE_SHA}" == "${CANDIDATE_SHA}" ]] || {
            echo "::error::Invalid routed candidate SHA"; exit 1;
          }
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Materialize contracts
        id: materialize
        continue-on-error: true
        run: pnpm exec nx run contracts:materialize --skip-nx-cache

      - name: Bootstrap full runtime
        id: bootstrap
        if: ${{ steps.materialize.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          SOURCE_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw "Runtime checkout SHA mismatch" }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action bootstrap-dev -Profiles $env:RUNTIME_COMPONENTS -Force
          if ($LASTEXITCODE -ne 0) { throw "runtime bootstrap failed" }

      - name: Read back canonical runtime catalog
        id: catalog
        if: ${{ steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action catalog-readback -Profiles $env:RUNTIME_COMPONENTS
          if ($LASTEXITCODE -ne 0) { throw "runtime catalog readback failed" }

      - name: Execute DSH operator governance preflight
        id: operator_preflight
        if: ${{ steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/runtime/smoke-dsh-operator-governance-preflight.ps1
          if ($LASTEXITCODE -ne 0) { throw "DSH operator governance preflight failed" }

      - name: Execute full runtime smoke
        id: runtime_smoke
        if: ${{ steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          SOURCE_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw "Runtime checkout SHA mismatch" }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-runtime-phase.ps1 -Action smoke -Profiles $env:RUNTIME_COMPONENTS
          if ($LASTEXITCODE -ne 0) { throw "runtime smoke failed" }

      - name: Execute non-destructive DSH API property checks with pinned Schemathesis
        id: schemathesis
        if: ${{ steps.bootstrap.outcome == 'success' && steps.materialize.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/schemathesis-venv"
          python3 -m venv "${venv}"
          "${venv}/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            -r tools/verification/schemathesis-requirements.lock
          "${venv}/bin/schemathesis" --version

          "${venv}/bin/schemathesis" run \
            services/dsh/contracts/generated/dsh.bundle.openapi.yaml \
            --url http://127.0.0.1:18080 \
            --include-name 'GET /dsh/health' \
            --include-name 'GET /dsh/readiness' \
            --include-name 'GET /dsh/stores' \
            --include-name 'GET /dsh/stores/{storeId}' \
            --include-name 'GET /dsh/storefront/{storeId}' \
            --workers 1

      - name: Capture runtime diagnostics
        if: ${{ always() && (steps.materialize.outcome == 'failure' || steps.bootstrap.outcome == 'failure' || steps.catalog.outcome == 'failure' || steps.operator_preflight.outcome == 'failure' || steps.runtime_smoke.outcome == 'failure') }}
        shell: bash
        run: |
          set +e
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          docker ps -aq | xargs -r -n1 docker logs --tail 100

      - name: Enforce complete runtime evidence collection
        if: ${{ always() }}
        shell: bash
        env:
          MATERIALIZE: ${{ steps.materialize.outcome }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome }}
          CATALOG: ${{ steps.catalog.outcome }}
          OPERATOR_PREFLIGHT: ${{ steps.operator_preflight.outcome }}
          RUNTIME_SMOKE: ${{ steps.runtime_smoke.outcome }}
          SCHEMATHESIS: ${{ steps.schemathesis.outcome }}
        run: |
          set -euo pipefail
          failures=()
          [[ "${MATERIALIZE}" == "success" ]] || failures+=("contracts:${MATERIALIZE}")
          if [[ "${MATERIALIZE}" == "success" ]]; then
            [[ "${BOOTSTRAP}" == "success" ]] || failures+=("bootstrap:${BOOTSTRAP}")
          else
            echo "Runtime bootstrap BLOCKED_BY contracts:${MATERIALIZE}"
          fi
          if [[ "${BOOTSTRAP}" == "success" ]]; then
            [[ "${CATALOG}" == "success" ]] || failures+=("catalog-readback:${CATALOG}")
            [[ "${OPERATOR_PREFLIGHT}" == "success" ]] || failures+=("operator-preflight:${OPERATOR_PREFLIGHT}")
            [[ "${RUNTIME_SMOKE}" == "success" ]] || failures+=("runtime-smoke:${RUNTIME_SMOKE}")
            [[ "${SCHEMATHESIS}" == "success" ]] || failures+=("schemathesis:${SCHEMATHESIS}")
          else
            echo "Catalog/operator-preflight/runtime-smoke BLOCKED_BY bootstrap:${BOOTSTRAP}"
          fi
          if (( ${#failures[@]} )); then
            echo "::error::Runtime verification failed after collecting all independently executable checks: $(IFS=,; echo "${failures[*]}")"
            exit 1
          fi
          echo "Complete runtime evidence collection passed."

      - name: Stop runtime
        if: ${{ always() }}
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File infra/docker/scripts/runtime.ps1 -Action down -Profiles $env:RUNTIME_COMPONENTS
