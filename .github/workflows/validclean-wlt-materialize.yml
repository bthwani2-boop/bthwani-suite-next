name: Validclean WLT Materialization

on:
  push:
    branches: [validclean]
    paths: &wlt_materialization_paths
      - "services/wlt/contracts/**"
      - "services/wlt/clients/generated/wlt-api.ts"
      - "services/wlt/package.json"
      - "services/wlt/tests/wlt-api-client.test.mjs"
      - "tools/scripts/wlt-openapi-bundle-lib.mjs"
      - "tools/scripts/wlt-openapi-bundle-lib.test.mjs"
      - "tools/scripts/compose-wlt-openapi.mjs"
      - "tools/guards/wlt-openapi-bundle-gate.mjs"
      - "tools/guards/backend-api-binding-gate.mjs"
      - "tools/important-scripts/contracts-typecheck.mjs"
      - "tools/validclean-repository-reconstruction/apply-vc004.mjs"
      - "tools/validclean-repository-reconstruction/apply-vc004-contract-dedup.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/validclean-wlt-materialize.yml"
  pull_request:
    branches: [abdo]
    paths: *wlt_materialization_paths

permissions:
  contents: write

concurrency:
  group: validclean-wlt-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: validclean

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Enable locked pnpm runtime
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply VC-004 source migration
        run: |
          set -euo pipefail
          node tools/validclean-repository-reconstruction/apply-vc004.mjs
          node tools/validclean-repository-reconstruction/apply-vc004-contract-dedup.mjs

      - name: Generate canonical WLT bundle and client
        run: pnpm --dir services/wlt openapi:generate

      - name: Verify generated provenance and coverage
        run: |
          set -euo pipefail
          node tools/guards/wlt-openapi-bundle-gate.mjs
          node --test tools/scripts/wlt-openapi-bundle-lib.test.mjs services/wlt/tests/wlt-api-client.test.mjs
          pnpm --dir services/wlt typecheck

      - name: Commit deterministic artifacts and source wiring
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            services/wlt/package.json \
            services/wlt/contracts/wlt.openapi.yaml \
            services/wlt/contracts/generated/wlt.bundle.openapi.yaml \
            services/wlt/clients/generated/wlt-api.ts \
            services/wlt/tests/wlt-api-client.test.mjs \
            tools/guards/backend-api-binding-gate.mjs \
            tools/guards/wlt-openapi-bundle-gate.mjs \
            tools/important-scripts/contracts-typecheck.mjs \
            tools/scripts/compose-wlt-openapi.mjs \
            tools/scripts/wlt-openapi-bundle-lib.mjs \
            tools/scripts/wlt-openapi-bundle-lib.test.mjs
          if git diff --cached --quiet; then
            echo "No materialized changes were required."
            exit 0
          fi
          git commit -m "build(wlt): materialize canonical generated artifacts"
          git push origin HEAD:validclean
