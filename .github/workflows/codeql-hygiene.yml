name: CodeQL Metadata Hygiene

on:
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-metadata-hygiene-default
  cancel-in-progress: true

jobs:
  hygiene:
    name: Retire obsolete CodeQL configuration
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Resolve exact live default-branch candidate
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            candidate_sha="${TRIGGER_SHA}"
          else
            candidate_sha="${DISPATCH_SHA}"
          fi
          [[ "${candidate_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::CodeQL hygiene candidate must be a full SHA"
            exit 1
          }
          encoded_default_branch="$(jq -rn --arg value "${DEFAULT_BRANCH}" '$value|@uri')"
          live_default="$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/branches/${encoded_default_branch}" \
            --jq '.commit.sha')"
          superseded=false
          if [[ "${candidate_sha}" != "${live_default}" ]]; then
            superseded=true
            echo "Candidate ${candidate_sha} is superseded by live default branch ${live_default}; no CodeQL metadata will be mutated."
          fi
          {
            echo "sha=${candidate_sha}"
            echo "live_default=${live_default}"
            echo "superseded=${superseded}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify canonical CodeQL workflow metadata without checkout
        if: ${{ steps.target.outputs.superseded != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          encoded_sha="$(jq -rn --arg value "${CANDIDATE_SHA}" '$value|@uri')"
          workflow_base64="$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/codeql.yml?ref=${encoded_sha}" \
            --jq '.content')"
          workflow="$(printf '%s' "${workflow_base64}" | tr -d '\n' | base64 --decode)"
          for job in \
            "analyze-javascript-typescript:" \
            "analyze-go:" \
            "analyze-actions:"
          do
            grep -Fq "${job}" <<<"${workflow}" || {
              echo "::error::canonical CodeQL job is missing: ${job}"
              exit 1
            }
          done
          if grep -Eq '^  analyze:[[:space:]]*$' <<<"${workflow}"; then
            echo "::error::obsolete generic analyze job unexpectedly exists"
            exit 1
          fi

      - name: Remove only proven obsolete CodeQL analysis keys
        if: ${{ steps.target.outputs.superseded != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.target.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          default_ref="refs/heads/${DEFAULT_BRANCH}"
          encoded_default_branch="$(jq -rn --arg value "${DEFAULT_BRANCH}" '$value|@uri')"
          prefix='.github/workflows/codeql.yml:'
          key_js='.github/workflows/codeql.yml:analyze-javascript-typescript'
          key_go='.github/workflows/codeql.yml:analyze-go'
          key_actions='.github/workflows/codeql.yml:analyze-actions'
          deleted=0

          assert_live_default() {
            local live
            live="$(gh api \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/branches/${encoded_default_branch}" \
              --jq '.commit.sha')"
            if [[ "${live}" != "${CANDIDATE_SHA}" ]]; then
              echo "::error::default branch moved during CodeQL hygiene: candidate=${CANDIDATE_SHA} live=${live:-<unknown>}"
              exit 1
            fi
          }

          obsolete_analyses() {
            gh api --paginate --method GET \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/analyses" \
              -f ref="${default_ref}" \
              -f tool_name=CodeQL \
              -f per_page=100 | jq -s \
                --arg prefix "${prefix}" \
                --arg js "${key_js}" \
                --arg go "${key_go}" \
                --arg actions "${key_actions}" \
                '[.[][] | select(((.analysis_key // "") | startswith($prefix)) and .analysis_key != $js and .analysis_key != $go and .analysis_key != $actions)]'
          }

          obsolete_open_alerts() {
            gh api --paginate --method GET \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
              -f state=open \
              -f ref="${default_ref}" \
              -f tool_name=CodeQL \
              -f per_page=100 | jq -s \
                --arg prefix "${prefix}" \
                --arg js "${key_js}" \
                --arg go "${key_go}" \
                --arg actions "${key_actions}" \
                '[.[][] | select((((.most_recent_instance.analysis_key // "") | startswith($prefix))) and .most_recent_instance.analysis_key != $js and .most_recent_instance.analysis_key != $go and .most_recent_instance.analysis_key != $actions)]'
          }

          assert_live_default
          for _ in $(seq 1 1000); do
            assert_live_default
            obsolete="$(obsolete_analyses)"
            count="$(jq 'length' <<<"${obsolete}")"
            if [[ "${count}" == "0" ]]; then
              break
            fi
            target_id="$(jq -r '[.[] | select(.deletable == true)] | sort_by(.created_at) | last | .id // empty' <<<"${obsolete}")"
            if [[ -z "${target_id}" ]]; then
              echo "::error::obsolete CodeQL analyses remain but none is deletable"
              jq -c '.[] | {id,analysis_key,category,commit_sha,deletable}' <<<"${obsolete}" >&2
              exit 1
            fi
            assert_live_default
            gh api --method DELETE \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/analyses/${target_id}?confirm_delete=true" >/dev/null
            deleted=$((deleted + 1))
          done

          assert_live_default
          remaining="$(obsolete_analyses)"
          remaining_count="$(jq 'length' <<<"${remaining}")"
          if [[ "${remaining_count}" != "0" ]]; then
            echo "::error::obsolete CodeQL analyses remain after cleanup: ${remaining_count}"
            exit 1
          fi

          remaining_alerts='[]'
          for attempt in $(seq 1 12); do
            assert_live_default
            remaining_alerts="$(obsolete_open_alerts)"
            [[ "$(jq 'length' <<<"${remaining_alerts}")" == "0" ]] && break
            [[ "${attempt}" == "12" ]] || sleep 5
          done
          remaining_alert_count="$(jq 'length' <<<"${remaining_alerts}")"
          if [[ "${remaining_alert_count}" != "0" ]]; then
            echo "::error::open alerts from obsolete CodeQL analysis keys remain"
            jq -r '.[].number' <<<"${remaining_alerts}" >&2
            exit 1
          fi

          {
            echo "### CodeQL hygiene result"
            echo "- Candidate: \`${CANDIDATE_SHA}\`"
            echo "- Deleted obsolete analyses: \`${deleted}\`"
            echo "- Remaining obsolete analyses: \`0\`"
            echo "- Remaining open alerts from obsolete keys: \`0\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish hygiene summary
        if: ${{ always() }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.target.outputs.sha }}
          LIVE_DEFAULT: ${{ steps.target.outputs.live_default }}
          SUPERSEDED: ${{ steps.target.outputs.superseded }}
        run: |
          {
            echo "### CodeQL Metadata Hygiene"
            echo "- Candidate: \`${CANDIDATE_SHA:-unresolved}\`"
            echo "- Live default branch: \`${LIVE_DEFAULT:-unresolved}\`"
            echo "- Superseded without mutation: \`${SUPERSEDED:-unknown}\`"
            echo "- Repository source is never checked out or executed by this privileged metadata workflow."
            echo "- Canonical scanner authority remains \`.github/workflows/codeql.yml\`."
          } >> "${GITHUB_STEP_SUMMARY}"
