name: CodeQL Metadata Hygiene

on:
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-metadata-hygiene-master
  cancel-in-progress: true

jobs:
  hygiene:
    name: Retire obsolete CodeQL configuration
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'master')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Resolve exact live master candidate
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            candidate_sha="${TRIGGER_SHA}"
          else
            candidate_sha="${DISPATCH_SHA}"
          fi
          [[ "${candidate_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::CodeQL hygiene candidate must be a full SHA"
            exit 1
          }
          live_master="$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/branches/master" \
            --jq '.commit.sha')"
          superseded=false
          if [[ "${candidate_sha}" != "${live_master}" ]]; then
            superseded=true
            echo "Candidate ${candidate_sha} is superseded by live master ${live_master}; no CodeQL metadata will be mutated."
          fi
          {
            echo "sha=${candidate_sha}"
            echo "live_master=${live_master}"
            echo "superseded=${superseded}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout exact canonical candidate
        if: ${{ steps.target.outputs.superseded != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up locked Node runtime
        if: ${{ steps.target.outputs.superseded != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Remove only proven obsolete CodeQL analysis keys
        if: ${{ steps.target.outputs.superseded != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_HYGIENE_SHA: ${{ steps.target.outputs.sha }}
          CODEQL_HYGIENE_REF: refs/heads/master
        run: node tools/scripts/codeql-hygiene.mjs

      - name: Publish hygiene summary
        if: ${{ always() }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.target.outputs.sha }}
          LIVE_MASTER: ${{ steps.target.outputs.live_master }}
          SUPERSEDED: ${{ steps.target.outputs.superseded }}
        run: |
          {
            echo "### CodeQL Metadata Hygiene"
            echo "- Candidate: \`${CANDIDATE_SHA:-unresolved}\`"
            echo "- Live master: \`${LIVE_MASTER:-unresolved}\`"
            echo "- Superseded without mutation: \`${SUPERSEDED:-unknown}\`"
            echo "- Canonical scanner authority remains \`.github/workflows/codeql.yml\`."
          } >> "${GITHUB_STEP_SUMMARY}"
