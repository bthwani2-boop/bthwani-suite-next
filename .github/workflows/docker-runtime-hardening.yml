name: Docker Runtime Hardening exact-h

on:
  workflow_call:
    inputs:
      head_sha: {type: string, required: true}
      base_sha: {type: string, required: true}

permissions:
  contents: read

concurrency:
  group: docker-runtime-hardening-h-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Enforce canonical Docker policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact h candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Verify exact h candidate and base
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "h" ]] || {
            echo "::error::Docker hardening authority is h only"
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${HEAD_SHA}" ]] || {
            echo "::error::Docker hardening candidate drift"
            exit 1
          }
          [[ "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Docker hardening exact base SHA required"
            exit 1
          }
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          package-manager-cache: false

      - name: Enforce Docker hardening invariants
        run: node tools/guards/docker-runtime-hardening-gate.mjs

      - name: Parse Docker-related PowerShell authorities
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @()
          foreach ($root in @("infra/docker/scripts","tools/scripts","services","apps")) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            $candidates += @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter "*.ps1" | Select-Object -ExpandProperty FullName)
          }
          $files = @($candidates | Select-Object -Unique | Where-Object {
            $raw = Get-Content -LiteralPath $_ -Raw
            $raw -match '(?i)\bdocker\b|compose|runtime\.ps1|Invoke-[A-Za-z0-9_-]*Compose'
          })
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }; exit 1 }
          }

      - name: Validate canonical Compose model
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file infra/docker/env/runtime.env.example \
            -f infra/docker/compose.runtime.yml \
            -f infra/docker/compose.financial-simulators.yml \
            -f infra/docker/compose.observability.yml config >/dev/null
