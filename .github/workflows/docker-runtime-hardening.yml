name: Docker Runtime Hardening

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "infra/docker/**"
      - "tools/scripts/**/*.ps1"
      - "services/**/database/scripts/**/*.ps1"
      - "apps/**/runtime/**/*.ps1"
      - "core/**/Dockerfile"
      - "services/**/Dockerfile"
      - "tools/scripts/docker-context-local.ps1"
      - "tools/guards/docker-runtime-hardening-gate.mjs"
      - "services/dsh/database/scripts/invoke-dsh-database.ps1"
      - "tools/scripts/run-lian-full-runtime-closure-v2.ps1"
      - ".github/workflows/docker-runtime-hardening.yml"
  push:
    branches: ["**"]
    paths:
      - ".dockerignore"
      - "infra/docker/**"
      - "tools/scripts/**/*.ps1"
      - "services/**/database/scripts/**/*.ps1"
      - "apps/**/runtime/**/*.ps1"
      - "core/**/Dockerfile"
      - "services/**/Dockerfile"
      - "tools/scripts/docker-context-local.ps1"
      - "tools/guards/docker-runtime-hardening-gate.mjs"
      - "services/dsh/database/scripts/invoke-dsh-database.ps1"
      - "tools/scripts/run-lian-full-runtime-closure-v2.ps1"
      - ".github/workflows/docker-runtime-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-runtime-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Enforce canonical Docker policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Enforce Docker hardening invariants
        run: node tools/guards/docker-runtime-hardening-gate.mjs

      - name: Parse canonical Docker PowerShell authorities
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @()
          foreach ($root in @(
            "infra/docker/scripts",
            "tools/scripts",
            "services",
            "apps"
          )) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            $candidates += @(
              Get-ChildItem -LiteralPath $root -Recurse -File -Filter "*.ps1" |
                Select-Object -ExpandProperty FullName
            )
          }

          $files = @(
            $candidates |
              Select-Object -Unique |
              Where-Object {
                $raw = Get-Content -LiteralPath $_ -Raw
                $raw -match '(?i)\bdocker\b|compose|runtime\.ps1|Invoke-[A-Za-z0-9_-]*Compose'
              }
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              exit 1
            }
          }
      - name: Validate canonical Compose model
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --env-file infra/docker/env/runtime.env.example \
            -f infra/docker/compose.runtime.yml \
            -f infra/docker/compose.financial-simulators.yml \
            -f infra/docker/compose.observability.yml \
            config >/dev/null
