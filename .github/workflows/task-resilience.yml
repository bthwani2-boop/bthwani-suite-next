name: BThwani Task Resilience Verification

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Task/gap id this run verifies, e.g. GAP-0001.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: remediation-resilience-${{ inputs.task_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Resilience proof (read-only; dimension planned for wave P1-C)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record resilience proof coverage limitation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .diagnostics/remediation/evidence/${{ inputs.task_id }}
          cat > .diagnostics/remediation/evidence/${{ inputs.task_id }}/resilience-results.json <<'EOF'
          {
            "schemaVersion": 1,
            "activation": "PLANNED",
            "plannedWave": "P1-C",
            "decision": "NEEDS_EVIDENCE",
            "note": "Resilience proof (provider 500, timeout, slow DB, network loss, duplicated events, process restart, malformed response, partial write, unavailable cache, queue replay) is not yet activated per governance/remediation/verification-profiles.json. This workflow exists as a registered, honest placeholder — it never claims resilience proof it did not perform."
          }
          EOF

      - name: Reject any tracked source mutation
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- . ':(exclude).diagnostics'; then
            echo "Task verification workflows are read-only." >&2
            git status --short -- . ':(exclude).diagnostics' >&2
            exit 1
          fi

      - name: Export resilience placeholder evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-resilience-${{ inputs.task_id }}-${{ github.run_id }}
          path: .diagnostics/remediation/evidence/${{ inputs.task_id }}
          if-no-files-found: warn
          retention-days: 14
