name: SMSM one-shot partner team role binding

on:
  push:
    branches: [smsm]
    paths:
      - .github/workflows/smsm-one-shot-partner-team-role.yml

permissions:
  contents: write

concurrency:
  group: smsm-one-shot-partner-team-role
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smsm
          fetch-depth: 0

      - name: Bind invite role through shared frontend brain
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected pattern not found in {path}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "services/dsh/frontend/shared/partner/partner.api.ts",
              '''export function invitePartnerTeamMember(
            storeId: string,
            identity: string,
            mutation?: PartnerMutationContext,
          ): Promise<{ success: boolean }> {
            return request(`/dsh/partner/stores/${storeId}/team/invites`, {
              method: "POST",
              body: { identity },
              mutation,
            });
          }''',
              '''export type PartnerTeamInviteRole = "manager" | "supervisor" | "staff" | "courier";

          export type PartnerTeamInvitationResponse = {
            readonly memberId: string;
            readonly actorId: string;
            readonly role: PartnerTeamInviteRole;
            readonly replayed: boolean;
            readonly activationState: "issued" | "unknown";
            readonly activation?: {
              readonly activationId: string;
              readonly code: string;
              readonly maskedPhone: string;
              readonly expiresAt: string;
            };
          };

          export function invitePartnerTeamMember(
            storeId: string,
            identity: string,
            role: PartnerTeamInviteRole,
            mutation?: PartnerMutationContext,
          ): Promise<PartnerTeamInvitationResponse> {
            return request(`/dsh/partner/stores/${storeId}/team/invites`, {
              method: "POST",
              body: { identity, role },
              mutation,
            });
          }''',
          )

          replace(
              "services/dsh/frontend/shared/partner/use-partner-team-controller.ts",
              '''import { fetchPartnerTeam, invitePartnerTeamMember, executePartnerTeamMemberAction } from './partner.api';''',
              '''import {
            fetchPartnerTeam,
            invitePartnerTeamMember,
            executePartnerTeamMemberAction,
            type PartnerTeamInviteRole,
          } from './partner.api';''',
          )
          replace(
              "services/dsh/frontend/shared/partner/use-partner-team-controller.ts",
              '''  const onInviteMember = React.useCallback(async (identity: string): Promise<PartnerTeamMutationResult> => {
            if (!activeStoreId) {
              return { ok: false, error: 'لا يوجد فرع محدد لإرسال الدعوة.' };
            }
            return invitePartnerTeamMember(activeStoreId, identity).then((): PartnerTeamMutationResult => {
              loadTeam();
              return { ok: true };
            }).catch((err: unknown): PartnerTeamMutationResult => {
              return { ok: false, error: resolveErrorMessage(err) };
            });
          }, [activeStoreId, loadTeam]);''',
              '''  const onInviteMember = React.useCallback(async (
            identity: string,
            role: PartnerTeamInviteRole,
          ): Promise<PartnerTeamMutationResult> => {
            if (!activeStoreId) {
              return { ok: false, error: 'لا يوجد فرع محدد لإرسال الدعوة.' };
            }
            return invitePartnerTeamMember(activeStoreId, identity, role).then((): PartnerTeamMutationResult => {
              loadTeam();
              return { ok: true };
            }).catch((err: unknown): PartnerTeamMutationResult => {
              return { ok: false, error: resolveErrorMessage(err) };
            });
          }, [activeStoreId, loadTeam]);''',
          )

          replace(
              "services/dsh/frontend/app-partner/DshPartnerRouteRenderer.tsx",
              '''  onInviteMember: (
            identity: string,
          ) => Promise<import("./team/usePartnerTeamModel").PartnerTeamMutationResult>;''',
              '''  onInviteMember: (
            identity: string,
            role: import("../shared/partner/partner.api").PartnerTeamInviteRole,
          ) => Promise<import("./team/usePartnerTeamModel").PartnerTeamMutationResult>;''',
          )

          screen = Path("services/dsh/frontend/app-partner/team/PartnerTeamManagementScreen.tsx")
          text = screen.read_text(encoding="utf-8")
          text = text.replace(
              '''import type { PartnerTeamMutationResult } from "./usePartnerTeamModel";''',
              '''import type { PartnerTeamMutationResult } from "./usePartnerTeamModel";
          import type { PartnerTeamInviteRole } from "../../shared/partner/partner.api";''',
              1,
          )
          text = text.replace(
              '''  readonly onInviteMember: (identity: string) => Promise<PartnerTeamMutationResult>;''',
              '''  readonly onInviteMember: (
            identity: string,
            role: PartnerTeamInviteRole,
          ) => Promise<PartnerTeamMutationResult>;''',
              1,
          )
          text = text.replace(
              '''const sections: readonly { id: PartnerTeamSection; label: string }[] = [''',
              '''const inviteRoles: readonly { id: PartnerTeamInviteRole; label: string }[] = [
            { id: "manager", label: "مدير" },
            { id: "supervisor", label: "مشرف" },
            { id: "staff", label: "موظف" },
            { id: "courier", label: "موصل" },
          ];

          const sections: readonly { id: PartnerTeamSection; label: string }[] = [''',
              1,
          )
          text = text.replace(
              '''  const [inviteIdentity, setInviteIdentity] = React.useState("");
            const [mutation, setMutation] = React.useState<MutationState>({ kind: "idle" });''',
              '''  const [inviteIdentity, setInviteIdentity] = React.useState("");
            const [inviteRole, setInviteRole] = React.useState<PartnerTeamInviteRole>("staff");
            const [mutation, setMutation] = React.useState<MutationState>({ kind: "idle" });''',
              1,
          )
          text = text.replace(
              '''    const result = await onInviteMember(identity);''',
              '''    const result = await onInviteMember(identity, inviteRole);''',
              1,
          )
          text = text.replace(
              '''        <Button
                  label={mutation.kind === "submitting" && mutation.target === "invite" ? "جارٍ الإرسال…" : "إرسال الدعوة"}
                  tone="primary"
                  disabled={busy || inviteIdentity.trim().length < 5}
                  onPress={() => void submitInvite()}
                />''',
              '''        <Text role="caption" tone="muted" style={styles.rtl}>حزمة الدور داخل هذا المتجر</Text>
                <View style={styles.inviteRoleOptions}>
                  {inviteRoles.map((role) => (
                    <Button
                      key={role.id}
                      label={role.label}
                      tone={inviteRole === role.id ? "primary" : "ghost"}
                      size="sm"
                      disabled={busy}
                      onPress={() => setInviteRole(role.id)}
                    />
                  ))}
                </View>
                <Button
                  label={mutation.kind === "submitting" && mutation.target === "invite" ? "جارٍ الإرسال…" : "إرسال الدعوة"}
                  tone="primary"
                  disabled={busy || inviteIdentity.trim().length < 5}
                  onPress={() => void submitInvite()}
                />''',
              1,
          )
          text = text.replace(
              '''  inviteCard: { padding: spacing[4], gap: spacing[3] },''',
              '''  inviteCard: { padding: spacing[4], gap: spacing[3] },
            inviteRoleOptions: { flexDirection: "row", flexWrap: "wrap", gap: spacing[2], justifyContent: "flex-end" },''',
              1,
          )
          required = [
              'onInviteMember(identity, inviteRole)',
              'PartnerTeamInviteRole>("staff")',
              'inviteRoleOptions',
          ]
          if any(fragment not in text for fragment in required):
              raise SystemExit("partner team screen role binding incomplete")
          screen.write_text(text, encoding="utf-8")

          Path(".github/workflows/smsm-one-shot-partner-team-role.yml").unlink()

      - name: Commit one-shot result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bthwani-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/dsh/frontend/shared/partner/partner.api.ts \
                  services/dsh/frontend/shared/partner/use-partner-team-controller.ts \
                  services/dsh/frontend/app-partner/DshPartnerRouteRenderer.tsx \
                  services/dsh/frontend/app-partner/team/PartnerTeamManagementScreen.tsx \
                  .github/workflows/smsm-one-shot-partner-team-role.yml
          git diff --cached --check
          git commit -m "fix(dsh): bind partner team invitation roles"
          git push origin HEAD:smsm
