name: BThwani h Verification
run-name: h verify ${{ inputs.expected_head_sha || github.sha }} @ ${{ inputs.expected_base_sha || 'parent' }}

on:
  workflow_call:
    inputs:
      full_scope: {type: boolean, required: false, default: false}
      expected_head_sha: {type: string, required: false, default: ""}
      expected_base_sha: {type: string, required: false, default: ""}
  workflow_dispatch:
    inputs:
      expected_head_sha: {description: Exact h candidate SHA; defaults to dispatched h SHA, required: false, type: string}
      expected_base_sha: {description: Exact ancestor base SHA; defaults to candidate first parent, required: false, type: string}
      full_scope: {description: Run full repository verification, required: false, default: false, type: boolean}

permissions:
  actions: read
  contents: read
  statuses: read

concurrency:
  group: bthwani-h-verify-${{ inputs.expected_head_sha || github.sha }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  TRUSTED_H_BRANCH: h

jobs:
  context:
    name: Resolve exact h candidate and affected scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      head_sha: ${{ steps.identity.outputs.head_sha }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
      full_scope: ${{ steps.scope.outputs.full_scope }}
      dependency_changed: ${{ steps.scope.outputs.dependency_changed }}
      platform: ${{ steps.scope.outputs.platform }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
      ci_control_plane: ${{ steps.scope.outputs.ci_control_plane }}
      contracts: ${{ steps.scope.outputs.contracts }}
      dsh: ${{ steps.scope.outputs.dsh }}
      wlt: ${{ steps.scope.outputs.wlt }}
      identity: ${{ steps.scope.outputs.identity }}
      identity_client: ${{ steps.scope.outputs.identity_client }}
      workforce: ${{ steps.scope.outputs.workforce }}
      providers: ${{ steps.scope.outputs.providers }}
      database_changed: ${{ steps.scope.outputs.database_changed }}
      runtime_required: ${{ steps.scope.outputs.runtime_required }}
      diagnostics_required: ${{ steps.scope.outputs.diagnostics_required }}
      verification_required: ${{ steps.scope.outputs.verification_required }}
      backend_required: ${{ steps.scope.outputs.backend_required }}
      backend_database_changed: ${{ steps.scope.outputs.backend_database_changed }}
      node_contracts: ${{ steps.scope.outputs.node_contracts }}
      node_ci_control_plane: ${{ steps.scope.outputs.node_ci_control_plane }}
      node_dependency_changed: ${{ steps.scope.outputs.node_dependency_changed }}
      node_platform: ${{ steps.scope.outputs.node_platform }}
      node_typed_lint_required: ${{ steps.scope.outputs.node_typed_lint_required }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.expected_head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          package-manager-cache: false
      - name: Verify exact h identity
        id: identity
        shell: bash
        env:
          INPUT_HEAD_SHA: ${{ inputs.expected_head_sha }}
          INPUT_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "${TRUSTED_H_BRANCH}" ]] || {
            echo "::error::h verification must be dispatched/called from h; got ${GITHUB_REF_NAME}"
            exit 1
          }
          actual_head="$(git rev-parse HEAD)"
          expected_head="${INPUT_HEAD_SHA:-${GITHUB_SHA}}"
          [[ "${expected_head}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::exact candidate SHA required"; exit 1; }
          [[ "${actual_head}" == "${expected_head}" ]] || { echo "::error::candidate checkout drift"; exit 1; }
          base_sha="${INPUT_BASE_SHA:-}"
          if [[ -z "${base_sha}" ]]; then
            base_sha="$(git rev-parse "${expected_head}^")"
          fi
          [[ "${base_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::exact base SHA required"; exit 1; }
          git cat-file -e "${base_sha}^{commit}"
          git merge-base --is-ancestor "${base_sha}" "${expected_head}" || {
            echo "::error::verification base is not an ancestor of candidate"
            exit 1
          }
          {
            echo "head_sha=${expected_head}"
            echo "base_sha=${base_sha}"
          } >> "${GITHUB_OUTPUT}"
      - name: Resolve affected scope from exact Git window
        id: scope
        shell: bash
        env:
          CI_BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          CI_HEAD_SHA: ${{ steps.identity.outputs.head_sha }}
          CI_FULL_SCOPE: ${{ inputs.full_scope }}
        run: |
          set -euo pipefail
          classification="${RUNNER_TEMP}/h-ci-scope.json"
          GITHUB_OUTPUT="" node tools/scripts/detect-ci-context.mjs > "${classification}"
          emit() {
            local key="$1"
            local value
            value="$(jq -r --arg key "${key}" '.[$key] | if type == "array" then join(",") elif . == null then "" else tostring end' "${classification}")"
            echo "${key}=${value}" >> "${GITHUB_OUTPUT}"
          }
          for key in \
            full_scope dependency_changed platform infrastructure ci_control_plane contracts \
            dsh wlt identity identity_client workforce providers database_changed backend_database_changed \
            runtime_required diagnostics_required verification_required backend_required \
            node_contracts node_ci_control_plane node_dependency_changed node_platform node_typed_lint_required; do
            emit "${key}"
          done
          {
            echo "### h exact verification scope"
            echo "- base: ${{ steps.identity.outputs.base_sha }}"
            echo "- head: ${{ steps.identity.outputs.head_sha }}"
            echo "- full scope: $(jq -r '.full_scope' "${classification}")"
          } >> "${GITHUB_STEP_SUMMARY}"

  diagnostics:
    name: Contract diagnostics
    needs: [context]
    if: ${{ needs.context.result == 'success' && needs.context.outputs.diagnostics_required == 'true' }}
    uses: ./.github/workflows/ci-node-diagnostics.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      candidate_sha: ${{ needs.context.outputs.head_sha }}
      full_scope: ${{ needs.context.outputs.full_scope }}
      contracts: ${{ needs.context.outputs.contracts }}

  verification:
    name: Node verification
    needs: [context]
    if: ${{ needs.context.result == 'success' && needs.context.outputs.verification_required == 'true' }}
    uses: ./.github/workflows/ci-node-verification.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      candidate_sha: ${{ needs.context.outputs.head_sha }}
      full_scope: ${{ needs.context.outputs.full_scope }}
      contracts: ${{ needs.context.outputs.node_contracts }}
      ci_control_plane: ${{ needs.context.outputs.node_ci_control_plane }}
      dependency_changed: ${{ needs.context.outputs.node_dependency_changed }}
      platform: ${{ needs.context.outputs.node_platform }}
      typed_lint_required: ${{ needs.context.outputs.node_typed_lint_required }}

  backends:
    name: Backend verification
    needs: [context]
    if: ${{ needs.context.result == 'success' && needs.context.outputs.backend_required == 'true' }}
    uses: ./.github/workflows/ci-backends.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      candidate_sha: ${{ needs.context.outputs.head_sha }}
      full_scope: ${{ needs.context.outputs.full_scope }}
      database_changed: ${{ needs.context.outputs.backend_database_changed }}
      dsh: ${{ needs.context.outputs.dsh }}
      wlt: ${{ needs.context.outputs.wlt }}
      identity: ${{ needs.context.outputs.identity }}
      identity_client: ${{ needs.context.outputs.identity_client }}
      workforce: ${{ needs.context.outputs.workforce }}
      platform: ${{ needs.context.outputs.platform }}
      providers: ${{ needs.context.outputs.providers }}

  runtime:
    name: Runtime verification
    needs: [context]
    if: ${{ needs.context.result == 'success' && needs.context.outputs.runtime_required == 'true' }}
    uses: ./.github/workflows/ci-runtime.yml
    with:
      candidate_sha: ${{ needs.context.outputs.head_sha }}

  result:
    name: BThwani / h Verification
    needs: [context, diagnostics, verification, backends, runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Enforce exact h verification result
        shell: bash
        env:
          CONTEXT_RESULT: ${{ needs.context.result }}
          DIAGNOSTICS_RESULT: ${{ needs.diagnostics.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          BACKENDS_RESULT: ${{ needs.backends.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          DIAGNOSTICS_REQUIRED: ${{ needs.context.outputs.diagnostics_required }}
          VERIFICATION_REQUIRED: ${{ needs.context.outputs.verification_required }}
          BACKEND_REQUIRED: ${{ needs.context.outputs.backend_required }}
          RUNTIME_REQUIRED: ${{ needs.context.outputs.runtime_required }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha || inputs.expected_head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "${TRUSTED_H_BRANCH}" ]] || { echo "::error::status authority is h only"; exit 1; }
          context='BThwani / h Verification'
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          publish() {
            gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state="$1" -f context="${context}" -f description="$2" -f target_url="${target_url}" >/dev/null
          }
          [[ "${CONTEXT_RESULT}" == "success" ]] || { publish failure "Exact h candidate identity/scope failed"; exit 1; }
          failures=()
          check() {
            local name="$1" result="$2" required="$3"
            if [[ "${required}" != "true" ]]; then
              [[ "${result}" == "skipped" || "${result}" == "success" ]] || failures+=("${name}:${result}")
              return
            fi
            [[ "${result}" == "success" ]] || failures+=("${name}:${result}")
          }
          check diagnostics "${DIAGNOSTICS_RESULT}" "${DIAGNOSTICS_REQUIRED}"
          check node "${VERIFICATION_RESULT}" "${VERIFICATION_REQUIRED}"
          check backends "${BACKENDS_RESULT}" "${BACKEND_REQUIRED}"
          check runtime "${RUNTIME_RESULT}" "${RUNTIME_REQUIRED}"
          if (( ${#failures[@]} )); then
            detail="h verification failed: $(IFS=,; echo "${failures[*]}")"
            publish failure "${detail}"
            echo "::error::${detail}"
            exit 1
          fi
          publish success "Exact h candidate passed applicable verification"
          echo "Exact h candidate ${HEAD_SHA} passed applicable verification."
