name: BThwani Task Discovery

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Ref to diagnose (defaults to the work branch head).
        type: string
        required: false
        default: reemsam

permissions:
  contents: read

concurrency:
  group: task-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Progressive remediation discovery (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Freeze source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/remediation-discovery"
          git rev-parse HEAD > "${RUNNER_TEMP}/remediation-discovery/source-sha.txt"
          echo "${{ inputs.base_ref }}" > "${RUNNER_TEMP}/remediation-discovery/source-ref.txt"

      - name: Run parallel read-only inventory
        shell: bash
        run: |
          set -euo pipefail
          pnpm run remediation:discover
          pnpm run remediation:baseline:before

      - name: Reject any source mutation during discovery
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- . ':(exclude).diagnostics'; then
            echo "Task discovery must never mutate tracked source." >&2
            git status --short -- . ':(exclude).diagnostics' >&2
            exit 1
          fi

      - name: Package discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          cp -r .diagnostics/remediation "${RUNNER_TEMP}/remediation-discovery/"

      - name: Export discovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/remediation-discovery
          if-no-files-found: error
          retention-days: 14
