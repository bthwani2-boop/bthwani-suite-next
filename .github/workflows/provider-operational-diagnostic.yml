name: Provider Operational Diagnostic

on:
  push:
    branches:
      - feature/smar-provider-operational-core-20260727
  pull_request:
    branches:
      - smar
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-operational-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NX_SKIP_NX_CACHE: "true"
      NX_DAEMON: "false"
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Capture database contracts
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '=== local media contract ==='
            node tools/scripts/check-local-media-contract.mjs
            echo '=== dsh database contract ==='
            node tools/scripts/check-dsh-database-contract.mjs
          } 2>&1 | tee provider-db-contract.log
      - name: Capture frontend diagnostics
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '=== ui kit diagnostics ==='
            pnpm run diagnostics:ui-kit
            echo '=== accessibility guard ==='
            pnpm run guard:a11y
            echo '=== dependency graph guard ==='
            pnpm run guard:dependency-graph
            echo '=== ast grep rules ==='
            pnpm run guard:ast-grep-rules
          } 2>&1 | tee provider-frontend-diagnostics.log
      - name: Capture contracts and bindings
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '=== no broken imports ==='
            pnpm run guard:no-broken-imports
            echo '=== contracts typecheck ==='
            pnpm --dir contracts typecheck
            echo '=== api binding ==='
            pnpm run guard:api-binding
            echo '=== backend api binding ==='
            pnpm run guard:backend-api-binding
            echo '=== service manifest drift ==='
            pnpm run guard:service-manifest-drift
            echo '=== frontend feature binding ==='
            pnpm run guard:frontend-feature-binding
            echo '=== runtime real bindings ==='
            pnpm run guard:runtime-real-bindings
            echo '=== live cross journey integrity ==='
            pnpm run guard:live-cross-journey-integrity
          } 2>&1 | tee provider-contract-bindings.log
      - name: Capture affected Node verification
        shell: bash
        continue-on-error: true
        env:
          NX_BASE: origin/smar
          NX_HEAD: HEAD
        run: |
          set -o pipefail
          node tools/scripts/run-affected-verification.mjs typecheck lint test build 2>&1 | tee provider-node-verification.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-operational-diagnostic-${{ github.run_id }}
          path: |
            provider-db-contract.log
            provider-frontend-diagnostics.log
            provider-contract-bindings.log
            provider-node-verification.log
          if-no-files-found: error
          retention-days: 3
