name: Mobile Lockfile Sync One Shot

on:
  push:
    branches: [c]
    paths:
      - .github/workflows/mobile-lockfile-sync-one-shot.yml

permissions:
  contents: write

concurrency:
  group: mobile-lockfile-sync-c
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact c candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.34.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          check-latest: false

      - name: Regenerate canonical lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.17.0"
          test "$(pnpm --version)" = "10.34.0"
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "pnpm-lock.yaml" ]]; then
            printf 'Unexpected generated changes:\n%s\n' "${changed[*]:-<none>}"
            exit 1
          fi

      - name: Prove frozen workspace and mobile dependency governance
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          node tools/scripts/guard-mobile-expo-sdk56-versions.mjs
          node --test apps/app-partner/runtime/tests/*.test.mjs
          for app in app-client app-partner app-captain app-field; do
            pnpm --dir "apps/${app}/runtime" exec expo config --type public >/dev/null
          done

      - name: Commit lockfile and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin c --depth=1
          remote_head="$(git rev-parse origin/c)"
          local_head="$(git rev-parse HEAD)"
          if [[ "${remote_head}" != "${local_head}" ]]; then
            echo "c moved while lockfile verification was running: remote=${remote_head} local=${local_head}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/mobile-lockfile-sync-one-shot.yml
          git diff --cached --check
          git commit -m "chore(mobile): synchronize Expo Router lockfile"
          git push origin HEAD:c
