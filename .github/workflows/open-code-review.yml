---
name: OpenCodeReview Exact-Candidate Inspection

run-name: >-
  ${{ github.event_name == 'pull_request' && format('OpenCodeReview PR {0}', github.event.pull_request.number)
  || format('OpenCodeReview dispatched candidate {0}', inputs.head_sha) }}

"on":
  workflow_dispatch:
    inputs:
      pr_number: {description: Exact open PR number, required: true, type: string}
      base_ref: {description: Trusted base ref, required: true, type: string}
      head_sha: {description: Exact candidate SHA, required: true, type: string}
      base_sha: {description: Exact base SHA, required: true, type: string}
  workflow_call:
    inputs:
      pr_number: {type: string, required: true}
      base_ref: {type: string, required: true}
      head_sha: {type: string, required: true}
      base_sha: {type: string, required: true}
    outputs:
      context_sha256:
        value: ${{ jobs.delegation-context.outputs.context_sha256 }}
      artifact_identity:
        value: ${{ jobs.delegation-context.outputs.artifact_identity }}
      package_integrity:
        value: ${{ jobs.delegation-context.outputs.package_integrity }}
      tool_version:
        value: ${{ jobs.delegation-context.outputs.tool_version }}

permissions:
  contents: read

concurrency:
  group: opencodereview-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  delegation-context:
    name: Prepare deterministic OCR delegation context
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      context_sha256: ${{ steps.delegate.outputs.context_sha256 }}
      artifact_identity: ${{ steps.delegate.outputs.artifact_identity }}
      package_integrity: ${{ steps.delegate.outputs.package_integrity }}
      tool_version: ${{ steps.delegate.outputs.tool_version }}
    env:
      GH_TOKEN: ${{ github.token }}
      OCR_PACKAGE_INTEGRITY: /p+9mE+gEG1HrkGZu25ocKxrPWPJbdLhqfbKgG7idMJEc6gLF3RpS/u+2V3lpnKKVallXj7IHW4sSjNFQO1F9w==

    steps:
      - name: Resolve exact candidate
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            head_sha="${PR_HEAD_SHA,,}"
            base_ref="${PR_BASE_REF}"
            expected_base_sha="${PR_BASE_SHA,,}"
          else
            head_sha="${INPUT_HEAD_SHA,,}"
            base_ref="${INPUT_BASE_REF}"
            expected_base_sha="${INPUT_BASE_SHA,,}"
          fi

          [[ "${head_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::head_sha must be a full SHA"
            exit 1
          }
          [[ -n "${base_ref}" ]] || {
            echo "::error::base_ref is required"
            exit 1
          }

          {
            echo "head_sha=${head_sha}"
            echo "base_ref=${base_ref}"
            echo "expected_base_sha=${expected_base_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24.17.0"
          package-manager-cache: false

      - name: Install pinned OpenCodeReview
        shell: bash
        run: |
          set -euo pipefail
          engine_dir="${RUNNER_TEMP}/review-engines"
          ocr_prefix="${RUNNER_TEMP}/open-code-review-cli"
          mkdir -p "${engine_dir}"
          rm -rf "${ocr_prefix}"

          ocr_package="$(
            npm pack --silent --ignore-scripts --pack-destination "${engine_dir}" \
              @alibaba-group/open-code-review@1.9.9
          )"
          ocr_tgz="${engine_dir}/${ocr_package}"
          expected="${OCR_PACKAGE_INTEGRITY}"
          actual="$(sha512sum "${ocr_tgz}" | awk '{print $1}' | xxd -r -p | base64 -w0)"

          [[ "${actual}" == "${expected}" ]] || {
            echo "::error::OpenCodeReview package integrity mismatch"
            exit 1
          }

          npm install --global --prefix "${ocr_prefix}" --ignore-scripts "${ocr_tgz}"
          "${ocr_prefix}/bin/ocr" --version
          echo "${ocr_prefix}/bin" >> "${GITHUB_PATH}"

      - name: Initialize object-only review repository
        shell: bash
        env:
          OCR_REPO: ${{ runner.temp }}/ocr-repo
        run: |
          set -euo pipefail
          mkdir -p "${OCR_REPO}"
          git -C "${OCR_REPO}" init --quiet
          git -C "${OCR_REPO}" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

      - name: Fetch exact candidate and trusted base rules
        id: target
        shell: bash
        env:
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          BASE_REF: ${{ steps.request.outputs.base_ref }}
          EXPECTED_BASE_SHA: ${{ steps.request.outputs.expected_base_sha }}
          OCR_REPO: ${{ runner.temp }}/ocr-repo
        run: |
          set -euo pipefail

          if [[ "${BASE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            git -C "${OCR_REPO}" fetch --no-tags origin "${BASE_REF}" "${HEAD_SHA}"
          else
            git -C "${OCR_REPO}" fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" "${HEAD_SHA}"
          fi

          candidate="$(git -C "${OCR_REPO}" rev-parse --verify "${HEAD_SHA}^{commit}")"
          [[ "${candidate}" == "${HEAD_SHA}" ]] || {
            echo "::error::candidate object drift: expected=${HEAD_SHA} actual=${candidate}"
            exit 1
          }

          base="$(git -C "${OCR_REPO}" rev-parse --verify "${BASE_REF}^{commit}" 2>/dev/null || git -C \
          "${OCR_REPO}" rev-parse --verify "refs/remotes/origin/${BASE_REF}^{commit}" 2>/dev/null || true)"
          [[ "${base}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::unable to resolve trusted base ${BASE_REF}"
            exit 1
          }

          if [[ -n "${EXPECTED_BASE_SHA}" && "${base}" != "${EXPECTED_BASE_SHA}" ]]; then
            echo "::error::trusted base SHA drift: expected=${EXPECTED_BASE_SHA} actual=${base}"
            exit 1
          fi

          merge_base="$(git -C "${OCR_REPO}" merge-base "${base}" "${HEAD_SHA}")"
          git -C "${OCR_REPO}" switch --detach --quiet "${HEAD_SHA}"
          mkdir -p "${OCR_REPO}/tools/scripts"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/tools/scripts/invoke-open-code-review-toolchain.ps1" \
            -f "ref=${GITHUB_SHA}" --jq '.content' | base64 --decode > "${OCR_REPO}/tools/scripts/invoke-open-code-review-toolchain.ps1"
          git -C "${OCR_REPO}" show "${base}:.opencodereview/rule.json" > "${OCR_REPO}/.opencodereview/rule.json"

          {
            echo "base_sha=${base}"
            echo "merge_base=${merge_base}"
          } >> "${GITHUB_OUTPUT}"

      - name: Produce deterministic delegation scope, rules, and diff
        id: delegate
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || '' }}
          BASE_REF: ${{ steps.request.outputs.base_ref }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          MERGE_BASE: ${{ steps.target.outputs.merge_base }}
          OCR_REPO: ${{ runner.temp }}/ocr-repo
        run: |
          set -euo pipefail

          evidence="${RUNNER_TEMP}/ocr-evidence"
          mkdir -p "${evidence}"

          pushd "${OCR_REPO}" >/dev/null

          ocr delegate preview \
            --format json \
            --from "${MERGE_BASE}" \
            --to "${HEAD_SHA}" \
            --rule "${OCR_REPO}/.opencodereview/rule.json" \
            > "${evidence}/preview.txt"

          jq . "${evidence}/preview.txt" > "${evidence}/preview.pretty.txt"

          mapfile -t files < <(jq -r '.reviewable_files[]?.path // empty' "${evidence}/preview.txt")
          count="${#files[@]}"

          printf '%s\n' "${files[@]}" | sed '/^$/d' > "${evidence}/reviewable-files.txt"

          if ((count == 0)); then
            printf '{}\n' > "${evidence}/rules.txt"
            : > "${evidence}/diff.patch"
          else
            ocr delegate rule \
              --format json \
              --rule "${OCR_REPO}/.opencodereview/rule.json" \
              "${files[@]}" \
              > "${evidence}/rules.txt"

            jq . "${evidence}/rules.txt" > "${evidence}/rules.pretty.txt"

            git diff \
              --no-ext-diff \
              --find-renames \
              --find-copies \
              --unified=80 \
              "${MERGE_BASE}" \
              "${HEAD_SHA}" \
              -- "${files[@]}" \
              > "${evidence}/diff.patch"
          fi

          {
            echo "===== OpenCodeReview toolchain verification ====="
            pwsh -NoProfile -ExecutionPolicy Bypass -File "${OCR_REPO}/tools/scripts/invoke-open-code-review-toolchain.ps1" -Mode Verify -From "${MERGE_BASE}" -To "${HEAD_SHA}" -SkipInstall
            echo "===== OpenCodeReview deterministic audit ====="
            pwsh -NoProfile -ExecutionPolicy Bypass -File "${OCR_REPO}/tools/scripts/invoke-open-code-review-toolchain.ps1" -Mode DelegateAudit -From "${MERGE_BASE}" -To "${HEAD_SHA}" -SkipInstall
          } > "${evidence}/toolchain.log" 2>&1

          (
            cd "${evidence}"
            sha256sum preview.txt rules.txt diff.patch reviewable-files.txt toolchain.log > context-files.sha256
          )
          rule_source_sha256="$(sha256sum "${OCR_REPO}/.opencodereview/rule.json" | awk '{print $1}')"
          preview_sha256="$(sha256sum "${evidence}/preview.txt" | awk '{print $1}')"
          rules_sha256="$(sha256sum "${evidence}/rules.txt" | awk '{print $1}')"
          diff_sha256="$(sha256sum "${evidence}/diff.patch" | awk '{print $1}')"
          files_sha256="$(sha256sum "${evidence}/reviewable-files.txt" | awk '{print $1}')"
          context_sha256="$(sha256sum "${evidence}/context-files.sha256" | awk '{print $1}')"
          files_json="$(jq -R -s 'split("\n") | map(select(length > 0))' "${evidence}/reviewable-files.txt")"
          artifact_identity="opencodereview-delegation-${HEAD_SHA}-${context_sha256}"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg prNumber "${PR_NUMBER}" \
            --arg head "${HEAD_SHA}" \
            --arg base "${BASE_SHA}" \
            --arg baseRef "${BASE_REF}" \
            --arg mergeBase "${MERGE_BASE}" \
            --arg workflowRunId "${GITHUB_RUN_ID}" \
            --arg artifactIdentity "${artifact_identity}" \
            --arg toolVersion "1.9.9" \
            --arg packageIntegrity "${OCR_PACKAGE_INTEGRITY}" \
            --arg ruleSourceSha256 "${rule_source_sha256}" \
            --arg previewSha256 "${preview_sha256}" \
            --arg rulesSha256 "${rules_sha256}" \
            --arg diffSha256 "${diff_sha256}" \
            --arg filesSha256 "${files_sha256}" \
            --arg contextSha256 "${context_sha256}" \
            --argjson reviewableFiles "${files_json}" \
            '{
              schemaVersion: 3,
              mode: "deterministic-delegation-context",
              repository: $repository,
              prNumber: (if $prNumber == "" then null else ($prNumber | tonumber) end),
              headSha: $head,
              baseRef: $baseRef,
              baseSha: $base,
              mergeBase: $mergeBase,
              reviewableFiles: $reviewableFiles,
              ruleSourceSha256: $ruleSourceSha256,
              resolvedRulesSha256: $rulesSha256,
              previewSha256: $previewSha256,
              diffSha256: $diffSha256,
              reviewableFilesSha256: $filesSha256,
              contextSha256: $contextSha256,
              workflowRunId: $workflowRunId,
              artifactIdentity: $artifactIdentity,
              toolVersion: $toolVersion,
              packageIntegrity: $packageIntegrity,
              analyzer: "opencodereview-context",
              candidateSha: $head,
              outcome: "PASS",
              log: "toolchain.log",
              deterministicOnly: true
            }' > "${evidence}/delegation-contract.json"

          capture_dir="${RUNNER_TEMP}/ocr-capture"
          mkdir -p "${capture_dir}/lib"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/tools/scripts/capture-tool-evidence.mjs" \
            -f "ref=${GITHUB_SHA}" --jq '.content' | base64 --decode > "${capture_dir}/capture-tool-evidence.mjs"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/tools/scripts/lib/evidence-envelope.mjs" \
            -f "ref=${GITHUB_SHA}" --jq '.content' | base64 --decode > "${capture_dir}/lib/evidence-envelope.mjs"
          node "${capture_dir}/capture-tool-evidence.mjs" \
            --tool-id opencodereview-context --status PASS --exit-code 0 \
            --raw-file "${evidence}/toolchain.log" \
            --native-file "${evidence}/delegation-contract.json" \
            --output "${evidence}/opencodereview-context.evidence.json" \
            --head-sha "${HEAD_SHA}" --base-sha "${BASE_SHA}" \
            --scope "exact candidate deterministic OpenCodeReview scope/rules/diff"

          {
            echo "# OpenCodeReview delegation context"
            echo
            echo "- exact head: \`${HEAD_SHA}\`"
            echo "- trusted base: \`${BASE_SHA}\`"
            echo "- merge base: \`${MERGE_BASE}\`"
            echo "- reviewable files: \`${count}\`"
            echo "- context SHA-256: \`${context_sha256}\`"
            echo "- workflow run: \`${GITHUB_RUN_ID}\`"
            echo
            echo "This workflow executes only the pinned deterministic OpenCodeReview scope/rule/diff toolchain."
            echo "It does not claim semantic reasoning or a synthetic semantic PASS."
            echo "The captured toolchain output and cryptographic context are consumed by Final Closure."
          } > "${evidence}/README.md"

          {
            echo "count=${count}"
            echo "context_sha256=${context_sha256}"
            echo "artifact_identity=${artifact_identity}"
            echo "package_integrity=${OCR_PACKAGE_INTEGRITY}"
            echo "tool_version=1.9.9"
          } >> "${GITHUB_OUTPUT}"
          popd >/dev/null

      - name: Publish delegation summary
        shell: bash
        run: |
          cat "${RUNNER_TEMP}/ocr-evidence/README.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload complete delegation context
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.delegate.outputs.artifact_identity }}
          path: ${{ runner.temp }}/ocr-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Enforce deterministic preparation
        shell: bash
        env:
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_OUTCOME}" == "success" ]] || {
            echo "::error::OpenCodeReview delegation artifact was not published"
            exit 1
          }
          echo "OpenCodeReview deterministic delegation context prepared successfully."
