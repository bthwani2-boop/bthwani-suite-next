name: OpenCodeReview

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Trusted base commit/ref
        required: true
        type: string
      head_sha:
        description: Exact candidate SHA to review
        required: true
        type: string
      model:
        description: Optional model override; repository variable OCR_LLM_MODEL is canonical default
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: opencodereview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Deep semantic review
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Resolve candidate and governed remote model
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_MODEL: ${{ inputs.model }}
          CONFIG_MODEL: ${{ vars.OCR_LLM_MODEL }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            head_sha="${PR_HEAD_SHA}"
            base_ref="${PR_BASE_SHA}"
          else
            head_sha="${INPUT_HEAD_SHA}"
            base_ref="${INPUT_BASE_REF}"
          fi
          model="${INPUT_MODEL:-${CONFIG_MODEL:-}}"
          [[ "${head_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::head_sha must be a full SHA"; exit 1; }
          [[ -n "${base_ref}" ]] || { echo "::error::base_ref is required"; exit 1; }
          [[ -n "${model}" ]] || { echo "::error::OCR_LLM_MODEL repository variable is required unless model input is supplied"; exit 1; }
          {
            echo "head_sha=${head_sha}"
            echo "base_ref=${base_ref}"
            echo "model=${model}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout immutable candidate with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.request.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Validate exact candidate and load trusted review rules
        id: target
        shell: bash
        env:
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          BASE_REF: ${{ steps.request.outputs.base_ref }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "${actual}" == "${HEAD_SHA}" ]] || { echo "::error::OCR checkout drift: expected=${HEAD_SHA} actual=${actual}"; exit 1; }
          git fetch --no-tags origin "${BASE_REF}" || true
          base="$(git rev-parse "${BASE_REF}^{commit}" 2>/dev/null || git rev-parse "origin/${BASE_REF}^{commit}" 2>/dev/null || true)"
          [[ "${base}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::unable to resolve trusted base ${BASE_REF}"; exit 1; }
          merge_base="$(git merge-base "${base}" "${HEAD_SHA}")"
          git show "${base}:.opencodereview/rule.json" > "${RUNNER_TEMP}/ocr-rule.json"
          {
            echo "base_sha=${base}"
            echo "merge_base=${merge_base}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Install pinned OpenCodeReview on remote runner
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @alibaba-group/open-code-review@1.9.9
          ocr --version

      - name: Validate governed remote LLM configuration
        id: llm
        continue-on-error: true
        shell: bash
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ steps.request.outputs.model }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          OCR_LLM_AUTH_HEADER: ${{ vars.OCR_LLM_AUTH_HEADER }}
          OCR_LLM_EXTRA_HEADERS: ${{ secrets.OCR_LLM_EXTRA_HEADERS }}
          OCR_LLM_TIMEOUT: "180"
        run: |
          set -euo pipefail
          [[ -n "${OCR_LLM_URL}" ]] || { echo "::error::GitHub Actions secret OCR_LLM_URL is required"; exit 1; }
          [[ -n "${OCR_LLM_TOKEN}" ]] || { echo "::error::GitHub Actions secret OCR_LLM_AUTH_TOKEN is required"; exit 1; }
          [[ -n "${OCR_LLM_MODEL}" ]] || { echo "::error::OCR_LLM_MODEL is required"; exit 1; }
          [[ "${OCR_USE_ANTHROPIC}" == "true" || "${OCR_USE_ANTHROPIC}" == "false" ]] || {
            echo "::error::Repository variable OCR_LLM_USE_ANTHROPIC must be true or false"
            exit 1
          }
          ocr config set llm.extra_body '{"thinking":{"type":"disabled"}}'
          ocr config set language English
          ocr llm test

      - name: Run OpenCodeReview against exact candidate
        id: ocr
        continue-on-error: true
        shell: bash
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ steps.request.outputs.model }}
          OCR_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          OCR_LLM_AUTH_HEADER: ${{ vars.OCR_LLM_AUTH_HEADER }}
          OCR_LLM_EXTRA_HEADERS: ${{ secrets.OCR_LLM_EXTRA_HEADERS }}
          OCR_LLM_TIMEOUT: "180"
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          MERGE_BASE: ${{ steps.target.outputs.merge_base }}
        run: |
          set +e
          mkdir -p "${RUNNER_TEMP}/ocr-evidence"
          if [[ "${{ steps.llm.outcome }}" != "success" ]]; then
            echo "OpenCodeReview remote LLM preflight failed; review was not executed." > "${RUNNER_TEMP}/ocr-evidence/stderr.log"
            echo '{"status":"failed","reason":"remote_llm_preflight_failed"}' > "${RUNNER_TEMP}/ocr-evidence/result.json"
            exit 1
          fi
          ocr review \
            --from "${MERGE_BASE}" \
            --to "${HEAD_SHA}" \
            --format json \
            --audience agent \
            --concurrency 4 \
            --rule "${RUNNER_TEMP}/ocr-rule.json" \
            > "${RUNNER_TEMP}/ocr-evidence/result.json" \
            2> "${RUNNER_TEMP}/ocr-evidence/stderr.log"
          status=$?
          set -e
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          if [[ -s "${RUNNER_TEMP}/ocr-evidence/result.json" ]]; then
            jq . "${RUNNER_TEMP}/ocr-evidence/result.json" > "${RUNNER_TEMP}/ocr-evidence/result.pretty.json" || true
          fi
          cat "${RUNNER_TEMP}/ocr-evidence/stderr.log" || true
          exit "${status}"

      - name: Record review provenance
        if: ${{ always() }}
        shell: bash
        env:
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          MERGE_BASE: ${{ steps.target.outputs.merge_base }}
          MODEL: ${{ steps.request.outputs.model }}
          LLM_OUTCOME: ${{ steps.llm.outcome }}
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ocr-evidence"
          jq -n \
            --arg head "${HEAD_SHA}" \
            --arg base "${BASE_SHA}" \
            --arg mergeBase "${MERGE_BASE}" \
            --arg model "${MODEL}" \
            --arg llmOutcome "${LLM_OUTCOME}" \
            --arg outcome "${OCR_OUTCOME}" \
            '{schemaVersion:2,headSha:$head,baseSha:$base,mergeBase:$mergeBase,model:$model,llmPreflight:$llmOutcome,outcome:$outcome}' \
            > "${RUNNER_TEMP}/ocr-evidence/provenance.json"

      - name: Upload complete OpenCodeReview evidence
        id: artifact
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencodereview-evidence-${{ steps.request.outputs.head_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ocr-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Enforce review execution and evidence capture
        if: ${{ always() }}
        shell: bash
        env:
          LLM_OUTCOME: ${{ steps.llm.outcome }}
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          set -euo pipefail
          [[ "${LLM_OUTCOME}" == "success" ]] || { echo "::error::OpenCodeReview remote LLM preflight failed"; exit 1; }
          [[ "${OCR_OUTCOME}" == "success" ]] || { echo "::error::OpenCodeReview execution failed"; exit 1; }
          [[ "${ARTIFACT_OUTCOME}" == "success" ]] || { echo "::error::OpenCodeReview evidence upload failed"; exit 1; }
          echo "OpenCodeReview completed. Findings are evidence inputs and must be normalized under proven roots before closure."
