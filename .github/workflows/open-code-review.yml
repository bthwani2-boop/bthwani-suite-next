name: OpenCodeReview Delegation Context

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Trusted base commit/ref
        required: true
        type: string
      head_sha:
        description: Exact candidate SHA to prepare
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: opencodereview-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  delegation-context:
    name: Prepare deterministic OCR delegation context
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Resolve exact candidate
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            head_sha="${PR_HEAD_SHA}"
            base_ref="${PR_BASE_SHA}"
          else
            head_sha="${INPUT_HEAD_SHA}"
            base_ref="${INPUT_BASE_REF}"
          fi

          [[ "${head_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::head_sha must be a full SHA"
            exit 1
          }
          [[ -n "${base_ref}" ]] || {
            echo "::error::base_ref is required"
            exit 1
          }

          {
            echo "head_sha=${head_sha}"
            echo "base_ref=${base_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          package-manager-cache: false

      - name: Install pinned OpenCodeReview
        shell: bash
        run: |
          set -euo pipefail
          engine_dir="${RUNNER_TEMP}/review-engines"
          mkdir -p "${engine_dir}"

          ocr_tgz="${engine_dir}/$(npm pack --silent --ignore-scripts --pack-destination "${engine_dir}" @alibaba-group/open-code-review@1.9.9)"
          expected="/p+9mE+gEG1HrkGZu25ocKxrPWPJbdLhqfbKgG7idMJEc6gLF3RpS/u+2V3lpnKKVallXj7IHW4sSjNFQO1F9w=="
          actual="$(sha512sum "${ocr_tgz}" | awk '{print $1}' | xxd -r -p | base64 -w0)"

          [[ "${actual}" == "${expected}" ]] || {
            echo "::error::OpenCodeReview package integrity mismatch"
            exit 1
          }

          npm install --global --ignore-scripts "${ocr_tgz}"
          ocr --version

      - name: Initialize object-only review repository
        shell: bash
        env:
          OCR_REPO: ${{ runner.temp }}/ocr-repo
        run: |
          set -euo pipefail
          mkdir -p "${OCR_REPO}"
          git -C "${OCR_REPO}" init --quiet
          git -C "${OCR_REPO}" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

      - name: Fetch exact candidate and trusted base rules
        id: target
        shell: bash
        env:
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          BASE_REF: ${{ steps.request.outputs.base_ref }}
          OCR_REPO: ${{ runner.temp }}/ocr-repo
        run: |
          set -euo pipefail

          git -C "${OCR_REPO}" fetch --no-tags origin "${BASE_REF}" "${HEAD_SHA}"

          candidate="$(git -C "${OCR_REPO}" rev-parse "${HEAD_SHA}^{commit}")"
          [[ "${candidate}" == "${HEAD_SHA}" ]] || {
            echo "::error::candidate object drift: expected=${HEAD_SHA} actual=${candidate}"
            exit 1
          }

          base="$(git -C "${OCR_REPO}" rev-parse "${BASE_REF}^{commit}" 2>/dev/null || git -C "${OCR_REPO}" rev-parse "origin/${BASE_REF}^{commit}" 2>/dev/null || true)"
          [[ "${base}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::unable to resolve trusted base ${BASE_REF}"
            exit 1
          }

          merge_base="$(git -C "${OCR_REPO}" merge-base "${base}" "${HEAD_SHA}")"
          git -C "${OCR_REPO}" show "${base}:.opencodereview/rule.json" > "${RUNNER_TEMP}/ocr-rule.json"

          {
            echo "base_sha=${base}"
            echo "merge_base=${merge_base}"
          } >> "${GITHUB_OUTPUT}"

      - name: Produce deterministic delegation scope, rules, and diff
        id: delegate
        shell: bash
        env:
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          MERGE_BASE: ${{ steps.target.outputs.merge_base }}
          OCR_REPO: ${{ runner.temp }}/ocr-repo
        run: |
          set -euo pipefail

          evidence="${RUNNER_TEMP}/ocr-evidence"
          mkdir -p "${evidence}"

          pushd "${OCR_REPO}" >/dev/null

          ocr delegate preview \
            --format json \
            --from "${MERGE_BASE}" \
            --to "${HEAD_SHA}" \
            --rule "${RUNNER_TEMP}/ocr-rule.json" \
            > "${evidence}/preview.json"

          jq . "${evidence}/preview.json" > "${evidence}/preview.pretty.json"

          mapfile -t files < <(jq -r '.reviewable_files[]?.path // empty' "${evidence}/preview.json")
          count="${#files[@]}"

          printf '%s\n' "${files[@]}" | sed '/^$/d' > "${evidence}/reviewable-files.txt"

          if ((count == 0)); then
            printf '{}\n' > "${evidence}/rules.json"
            : > "${evidence}/diff.patch"
          else
            ocr delegate rule \
              --format json \
              --rule "${RUNNER_TEMP}/ocr-rule.json" \
              "${files[@]}" \
              > "${evidence}/rules.json"

            jq . "${evidence}/rules.json" > "${evidence}/rules.pretty.json"

            git diff \
              --no-ext-diff \
              --find-renames \
              --find-copies \
              --unified=80 \
              "${MERGE_BASE}" \
              "${HEAD_SHA}" \
              -- "${files[@]}" \
              > "${evidence}/diff.patch"
          fi

          jq -n \
            --arg head "${HEAD_SHA}" \
            --arg base "${BASE_SHA}" \
            --arg mergeBase "${MERGE_BASE}" \
            --argjson reviewableFiles "${count}" \
            '{
              schemaVersion: 1,
              mode: "deterministic-delegation-context",
              headSha: $head,
              baseSha: $base,
              mergeBase: $mergeBase,
              reviewableFiles: $reviewableFiles,
              hostAgentRequired: true,
              hostAgentExecutedByThisWorkflow: false,
              semanticReviewClaimedByThisWorkflow: false
            }' \
            > "${evidence}/delegation-contract.json"

          {
            echo "# OpenCodeReview delegation context"
            echo
            echo "- exact head: \`${HEAD_SHA}\`"
            echo "- trusted base: \`${BASE_SHA}\`"
            echo "- merge base: \`${MERGE_BASE}\`"
            echo "- reviewable files: \`${count}\`"
            echo
            echo "This workflow performs deterministic OpenCodeReview scope/rule/diff preparation only."
            echo "It intentionally does not call Copilot, OpenAI, Anthropic, or any OCR LLM endpoint."
            echo "Semantic reasoning belongs to the external host agent (for example Codex/ChatGPT) that consumes this context."
            echo "This workflow therefore does not claim an AI semantic review pass/fail."
          } > "${evidence}/README.md"

          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          popd >/dev/null

      - name: Publish delegation summary
        shell: bash
        run: |
          cat "${RUNNER_TEMP}/ocr-evidence/README.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload complete delegation context
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencodereview-delegation-${{ steps.request.outputs.head_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ocr-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Enforce deterministic preparation
        shell: bash
        env:
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_OUTCOME}" == "success" ]] || {
            echo "::error::OpenCodeReview delegation artifact was not published"
            exit 1
          }
          echo "OpenCodeReview deterministic delegation context prepared successfully."