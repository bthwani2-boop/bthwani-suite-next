name: JRN-029 Remote Remediation

on:
  push:
    branches: [reemsam]
    paths: [.github/workflows/jrn029-remote-remediation.yml]
  pull_request:
    branches: [master]
    paths: [.github/workflows/jrn029-remote-remediation.yml]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: jrn029-remote-remediation-reemsam
  cancel-in-progress: true

jobs:
  remediate:
    name: Commit generated OpenAPI remediation
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Commit verified JRN-029 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone bthwani2-boop/bthwani-suite-next workspace -- --depth 1 --branch reemsam --single-branch --quiet
          cd workspace
          artifact_dir="${RUNNER_TEMP}/jrn029-openapi"
          gh run download 30147430390 --repo bthwani2-boop/bthwani-suite-next --name jrn029-openapi-remediation-30147430390 --dir "${artifact_dir}"
          cp -a "${artifact_dir}/contracts/." services/dsh/contracts/
          cp -a "${artifact_dir}/clients/generated/dsh-api.ts" services/dsh/clients/generated/dsh-api.ts
          git add services/dsh/contracts services/dsh/clients/generated/dsh-api.ts
          git rm tools/scripts/integrate-jrn029-openapi.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(openapi): integrate JRN-029 operational policy contracts"
          git push origin HEAD:reemsam
