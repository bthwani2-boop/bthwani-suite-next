name: BThwani PR Closure Request

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  pull-requests: read

concurrency:
  group: bthwani-pr-closure-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    name: Validate exact PR closure request
    if: ${{ contains(github.event.pull_request.body || '', '<!-- bthwani:closure-request -->') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Revalidate read-only request identity
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || { echo "::error::PR is not open"; exit 1; }
          [[ "$(jq -r '.head.sha' <<<"${pr}")" == "${HEAD_SHA}" ]] || { echo "::error::PR head SHA drift"; exit 1; }
          [[ "$(jq -r '.base.sha' <<<"${pr}")" == "${BASE_SHA}" ]] || { echo "::error::PR base SHA drift"; exit 1; }
          jq -e '(.body // "") | contains("<!-- bthwani:closure-request -->")' <<<"${pr}" >/dev/null
          {
            echo "### PR closure request"
            echo "- Candidate: ${HEAD_SHA}"
            echo "- Base: ${BASE_SHA}"
            echo "- Request marker is present."
            echo "- A maintainer must apply the bthwani:closure-request label to authorize exact-SHA dispatch."
          } >> "${GITHUB_STEP_SUMMARY}"
