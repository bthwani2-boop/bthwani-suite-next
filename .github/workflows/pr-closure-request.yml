name: BThwani PR Closure Request

on:
  pull_request:
    branches: ["**"]
    types: [synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: bthwani-pr-closure-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    name: Dispatch exact PR closure
    if: ${{ contains(github.event.pull_request.body || '', '<!-- bthwani:closure-request -->') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 195
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Revalidate exact live PR before dispatch
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || { echo "::error::PR is not open"; exit 1; }
          [[ "$(jq -r '.head.ref' <<<"${pr}")" == "${HEAD_REF}" ]] || { echo "::error::PR head ref drift"; exit 1; }
          [[ "$(jq -r '.head.sha' <<<"${pr}")" == "${HEAD_SHA}" ]] || { echo "::error::PR head SHA drift"; exit 1; }
          [[ "$(jq -r '.base.ref' <<<"${pr}")" == "${BASE_REF}" ]] || { echo "::error::PR base ref drift"; exit 1; }
          [[ "$(jq -r '.base.sha' <<<"${pr}")" == "${BASE_SHA}" ]] || { echo "::error::PR base SHA drift"; exit 1; }

      - name: Snapshot existing closure dispatch runs
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(jq -rn --arg v "${HEAD_REF}" '$v|@uri')"
          gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${encoded}&event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id' > "${RUNNER_TEMP}/before.txt"

      - name: Dispatch canonical full PR closure
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg ref "${HEAD_REF}" --arg pr "${PR_NUMBER}" --arg head "${HEAD_SHA}" --arg base "${BASE_SHA}" '{ref:$ref,inputs:{mode:"full",journey:"",runtime_proof:true,target_kind:"pull_request",pr_number:$pr,expected_head_sha:$head,expected_base_sha:$base}}')"
          printf '%s' "${payload}" | gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" --input - >/dev/null

      - name: Correlate exact closure run
        id: run
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(jq -rn --arg v "${HEAD_REF}" '$v|@uri')"
          run_id=""
          for _ in $(seq 1 60); do
            while IFS= read -r candidate; do
              [[ -n "${candidate}" ]] || continue
              grep -qx "${candidate}" "${RUNNER_TEMP}/before.txt" && continue
              run="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}")"
              if [[ "$(jq -r '.head_sha' <<<"${run}")" == "${HEAD_SHA}" ]]; then run_id="${candidate}"; break; fi
            done < <(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${encoded}&event=workflow_dispatch&per_page=20" --jq '.workflow_runs[].id')
            [[ -n "${run_id}" ]] && break
            sleep 3
          done
          [[ -n "${run_id}" ]] || { echo "::error::unable to correlate exact PR closure run"; exit 1; }
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for canonical closure result
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          conclusion=""
          for _ in $(seq 1 1140); do
            run="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
            [[ "$(jq -r '.head_sha' <<<"${run}")" == "${HEAD_SHA}" ]] || { echo "::error::closure run SHA drift"; exit 1; }
            if [[ "$(jq -r '.status' <<<"${run}")" == "completed" ]]; then conclusion="$(jq -r '.conclusion // "unknown"' <<<"${run}")"; break; fi
            sleep 10
          done
          [[ "${conclusion}" == "success" ]] || { echo "::error::canonical PR closure result=${conclusion:-timeout}"; exit 1; }
          echo "Canonical PR closure passed: ${{ steps.run.outputs.run_url }}"
