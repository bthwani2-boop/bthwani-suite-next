name: BThwani PR Assurance Trigger
run-name: PR Assurance Trigger #${{ github.event.pull_request.number }} ${{ github.event.action }}

on:
  pull_request_target:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - auto_merge_enabled

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: bthwani-pr-assurance-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  dispatch:
    name: Dispatch trusted assurance from default branch
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve live PR and dispatch exact trusted workflow
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]] || {
            echo "::error::PR assurance trigger must run from the protected default branch"
            exit 1
          }
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::invalid PR number"
            exit 1
          }

          pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || {
            echo "::notice::PR is no longer open; nothing to dispatch"
            exit 0
          }
          [[ "$(jq -r '.draft' <<<"${pr}")" == "false" ]] || {
            echo "::notice::PR is draft; assurance dispatch deferred"
            exit 0
          }
          [[ "$(jq -r '.base.ref' <<<"${pr}")" == "${DEFAULT_BRANCH}" ]] || {
            echo "::notice::PR does not target the protected default branch; assurance dispatch skipped"
            exit 0
          }
          [[ "$(jq -r '.head.repo.full_name // ""' <<<"${pr}")" == "${GITHUB_REPOSITORY}" ]] || {
            echo "::notice::fork PRs are not eligible for privileged assurance dispatch"
            exit 0
          }

          head_sha="$(jq -r '.head.sha' <<<"${pr}")"
          base_sha="$(jq -r '.base.sha' <<<"${pr}")"
          [[ "${head_sha}" =~ ^[0-9a-fA-F]{40}$ && "${base_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::exact PR head/base SHAs are required"
            exit 1
          }

          auto_merge_enabled="$(jq -r 'if .auto_merge == null then "false" else "true" end' <<<"${pr}")"
          if [[ "${auto_merge_enabled}" == "true" ]]; then
            payload="$(jq -cn \
              --arg ref "${DEFAULT_BRANCH}" \
              --arg pr_number "${PR_NUMBER}" \
              --arg head_sha "${head_sha}" \
              --arg base_sha "${base_sha}" \
              '{ref:$ref,inputs:{pr_number:$pr_number,expected_head_sha:$head_sha,expected_base_sha:$base_sha}}')"
            gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/final-closure.yml/dispatches" \
              --input - <<<"${payload}"
            echo "Dispatched Final Closure for PR #${PR_NUMBER} at ${head_sha}"
            exit 0
          fi

          verify_from_sha=""
          mapfile -t parent_shas < <(gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/commits/${head_sha}" --jq '.parents[].sha')
          for parent_sha in "${parent_shas[@]}"; do
            [[ "${parent_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || continue
            [[ "${parent_sha}" != "${base_sha}" ]] || continue
            comparison="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/compare/${base_sha}...${parent_sha}" 2>/dev/null || true)"
            [[ -n "${comparison}" ]] || continue
            if jq -e --arg base "${base_sha}" \
              '.merge_base_commit.sha == $base and (.status == "ahead" or .status == "identical")' \
              <<<"${comparison}" >/dev/null; then
              verify_from_sha="${parent_sha}"
              break
            fi
          done

          payload="$(jq -cn \
            --arg ref "${DEFAULT_BRANCH}" \
            --arg pr_number "${PR_NUMBER}" \
            --arg head_sha "${head_sha}" \
            --arg base_sha "${base_sha}" \
            --arg verify_from_sha "${verify_from_sha}" \
            '{ref:$ref,inputs:{pr_number:$pr_number,expected_head_sha:$head_sha,expected_base_sha:$base_sha,verify_from_sha:$verify_from_sha,full_scope:"false"}}')"
          gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci-check.yml/dispatches" \
            --input - <<<"${payload}"
          echo "Dispatched affected CI for PR #${PR_NUMBER} at ${head_sha}; verify_from_sha=${verify_from_sha:-closure-base}"
