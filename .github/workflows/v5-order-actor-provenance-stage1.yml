name: V5 Order Actor Provenance Stage 1

on:
  push:
    branches:
      - task/v5-first-top-logic-gap-20260815

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: dsh_runtime
          POSTGRES_PASSWORD: dsh_runtime_password
          POSTGRES_DB: dsh_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U dsh_runtime -d dsh_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://dsh_runtime:dsh_runtime_password@localhost:5432/dsh_runtime?sslmode=disable
      PGPASSWORD: dsh_runtime_password
      BTHWANI_ENVIRONMENT: ci
      DSH_REQUIRE_DB_TESTS: "true"
      DSH_TEST_operator_context_id: ci-dsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/v5-first-top-logic-gap-20260815
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/dsh/backend/go.mod
          cache: false

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Apply canonical DSH migrations
        shell: pwsh
        run: ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action migrate -Transport url -DatabaseUrl $env:DATABASE_URL

      - name: Prove V5 execute gate before mutation
        run: node plans/diagnose-implementing/orchestrator.mjs check --package plans/diagnose-implementing/v5-first-top-logic-gap-20260815/PACKAGE.md --phase execute

      - name: Apply canonical actor provenance cutover fail-closed
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} exact matches, found {actual}: {old!r}")
              p.write_text(text.replace(old, new))

          def regex_replace(path, pattern, repl, expected):
              p = Path(path)
              text = p.read_text()
              new_text, actual = re.subn(pattern, repl, text, flags=re.MULTILINE)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} regex matches, found {actual}: {pattern!r}")
              p.write_text(new_text)

          def replace_in_function(path, function_name, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              marker = f"func {function_name}("
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"{path}: function {function_name} not found")
              end = text.find("\nfunc ", start + len(marker))
              if end < 0:
                  end = len(text)
              segment = text[start:end]
              actual = segment.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}:{function_name}: expected {expected} matches, found {actual}: {old!r}")
              p.write_text(text[:start] + segment.replace(old, new) + text[end:])

          lifecycle = "services/dsh/backend/internal/orders/lifecycle.go"
          replace(lifecycle,
              "func TransitionDispatchOrder(\n\tdb *sql.Tx,\n\torderID,\n\tactorRole string,",
              "func TransitionDispatchOrder(\n\tdb *sql.Tx,\n\torderID,\n\tactorID,\n\tactorRole string,")
          replace(lifecycle,
              "return transitionOrderTx(db, orderID, actorRole, allowedFrom, toStatus, note)",
              "return transitionOrderTx(db, orderID, actorID, actorRole, allowedFrom, toStatus, note)")
          replace(lifecycle,
              "order, err := transitionOrderTx(tx, orderID, actorRole, allowedFrom, toStatus, note)",
              "order, err := transitionOrderTx(tx, orderID, actorID, actorRole, allowedFrom, toStatus, note)")
          replace(lifecycle,
              "func transitionOrderTx(\n\ttx *sql.Tx,\n\torderID,\n\tactorRole string,",
              "func transitionOrderTx(\n\ttx *sql.Tx,\n\torderID,\n\tactorID,\n\tactorRole string,")
          replace(lifecycle,
              ") (*Order, error) {\n\tvar fromStatus string\n\terr := tx.QueryRow(`",
              ") (*Order, error) {\n\tactorID = strings.TrimSpace(actorID)\n\tactorRole = strings.TrimSpace(actorRole)\n\tif strings.TrimSpace(orderID) == \"\" || actorID == \"\" || actorRole == \"\" || len(allowedFrom) == 0 {\n\t\treturn nil, ErrInvalid\n\t}\n\tvar fromStatus string\n\terr := tx.QueryRow(`")
          replace(lifecycle,
              "\t\tINSERT INTO dsh_order_status_events (order_id, actor_role, from_status, to_status, note)\n\t\tVALUES ($1::uuid, $2, $3, $4, NULLIF($5, ''))`,\n\t\torder.ID,\n\t\tactorRole,\n\t\tfromStatus,\n\t\tstring(toStatus),\n\t\tnote,",
              "\t\tINSERT INTO dsh_order_status_events (order_id, actor_id, actor_role, from_status, to_status, note)\n\t\tVALUES ($1::uuid, $2, $3, $4, $5, NULLIF($6, ''))`,\n\t\torder.ID,\n\t\tactorID,\n\t\tactorRole,\n\t\tfromStatus,\n\t\tstring(toStatus),\n\t\tnote,")

          dispatch = "services/dsh/backend/internal/dispatch/dispatch.go"
          replace(dispatch, 'orders.TransitionDispatchOrder(tx, input.OrderID, "operator",', 'orders.TransitionDispatchOrder(tx, input.OrderID, input.ActorID, "operator",')
          replace(dispatch, 'orders.TransitionDispatchOrder(tx, current.OrderID, "captain",', 'orders.TransitionDispatchOrder(tx, current.OrderID, captainID, "captain",', expected=3)

          handoff = "services/dsh/backend/internal/dispatch/store_captain_handoff.go"
          replace(handoff, '\t\t\tcurrent.OrderID,\n\t\t\t"captain",', '\t\t\tcurrent.OrderID,\n\t\t\tcaptainID,\n\t\t\t"captain",')
          replace(handoff, '\t\t\torderID,\n\t\t\t"partner",', '\t\t\torderID,\n\t\t\tactorID,\n\t\t\t"partner",')

          partner = "services/dsh/backend/internal/partnerdelivery/service.go"
          regex_replace(partner,
              r'(orders\.TransitionDispatchOrder\(\n(?P<i>\t+)tx,\n(?P=i)current\.OrderID,\n)(?P=i)actorRole,',
              lambda m: m.group(1) + m.group('i') + 'actorID,\n' + m.group('i') + 'actorRole,',
              expected=2)

          pickup = "services/dsh/backend/internal/pickup/service.go"
          replace(pickup, 'orders.TransitionDispatchOrder(tx, orderID, actorRole,', 'orders.TransitionDispatchOrder(tx, orderID, actorID, actorRole,', expected=2)

          governance = "services/dsh/backend/internal/dispatch/assignment_governance.go"
          replace_in_function(governance, "CreateGovernedAssignment", 'orders.TransitionDispatchOrder(tx, input.OrderID, "operator",', 'orders.TransitionDispatchOrder(tx, input.OrderID, input.ActorID, "operator",')
          replace_in_function(governance, "DeclineGovernedAssignment", 'orders.TransitionDispatchOrder(tx, current.OrderID, "captain",', 'orders.TransitionDispatchOrder(tx, current.OrderID, captainID, "captain",')
          replace_in_function(governance, "expireAssignmentTx", 'orders.TransitionDispatchOrder(tx, current.OrderID, "operator",', 'orders.TransitionDispatchOrder(tx, current.OrderID, actorID, actorRole,')
          replace_in_function(governance, "CancelGovernedAssignment", 'orders.TransitionDispatchOrder(tx, current.OrderID, "operator",', 'orders.TransitionDispatchOrder(tx, current.OrderID, actorID, "operator",')
          replace_in_function(governance, "ReassignGovernedAssignment", 'orders.TransitionDispatchOrder(tx, current.OrderID, "operator",', 'orders.TransitionDispatchOrder(tx, current.OrderID, input.ActorID, "operator",', expected=2)

          proof = "services/dsh/backend/internal/dispatch/delivery_proof.go"
          replace(proof, 'orders.TransitionDispatchOrder(tx, current.OrderID, "captain",', 'orders.TransitionDispatchOrder(tx, current.OrderID, captainID, "captain",')
          PY

          gofmt -w \
            services/dsh/backend/internal/orders/lifecycle.go \
            services/dsh/backend/internal/dispatch/dispatch.go \
            services/dsh/backend/internal/dispatch/store_captain_handoff.go \
            services/dsh/backend/internal/dispatch/assignment_governance.go \
            services/dsh/backend/internal/dispatch/delivery_proof.go \
            services/dsh/backend/internal/partnerdelivery/service.go \
            services/dsh/backend/internal/pickup/service.go

      - name: Compile and test all DSH backend consumers on migrated PostgreSQL
        working-directory: services/dsh/backend
        run: go test ./...

      - name: Adversarial transition-call inventory
        shell: bash
        run: |
          set -euo pipefail
          rg -n 'TransitionDispatchOrder\(' services/dsh/backend/internal
          python3 <<'PY'
          from pathlib import Path
          lifecycle = Path('services/dsh/backend/internal/orders/lifecycle.go').read_text()
          required = [
              'return transitionOrderTx(db, orderID, actorID, actorRole, allowedFrom, toStatus, note)',
              'order, err := transitionOrderTx(tx, orderID, actorID, actorRole, allowedFrom, toStatus, note)',
              'INSERT INTO dsh_order_status_events (order_id, actor_id, actor_role, from_status, to_status, note)',
          ]
          for item in required:
              if item not in lifecycle:
                  raise SystemExit(f'missing canonical actor provenance invariant: {item}')
          PY

      - name: Stage only allowed files and self-remove executor
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v5-order-actor-provenance-stage1.yml
          git add \
            services/dsh/backend/internal/orders/lifecycle.go \
            services/dsh/backend/internal/dispatch/dispatch.go \
            services/dsh/backend/internal/dispatch/store_captain_handoff.go \
            services/dsh/backend/internal/dispatch/assignment_governance.go \
            services/dsh/backend/internal/dispatch/delivery_proof.go \
            services/dsh/backend/internal/partnerdelivery/service.go \
            services/dsh/backend/internal/pickup/service.go
          allowed='^(\.github/workflows/v5-order-actor-provenance-stage1\.yml|services/dsh/backend/internal/orders/lifecycle\.go|services/dsh/backend/internal/dispatch/(dispatch|store_captain_handoff|assignment_governance|delivery_proof)\.go|services/dsh/backend/internal/partnerdelivery/service\.go|services/dsh/backend/internal/pickup/service\.go)$'
          git diff --cached --name-only | tee /tmp/staged.txt
          if grep -Ev "$allowed" /tmp/staged.txt | grep -q .; then
            echo 'unexpected staged path' >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'dsh: preserve actor identity in canonical order transitions'
          git push origin HEAD:task/v5-first-top-logic-gap-20260815
