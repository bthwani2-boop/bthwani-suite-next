name: Provider Core Diagnostic

on:
  push:
    branches:
      - feature/smar-provider-operational-core-20260727
  pull_request:
    branches:
      - smar
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-core-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NX_SKIP_NX_CACHE: "true"
      NX_DAEMON: "false"
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Capture Node verification
        shell: bash
        continue-on-error: true
        env:
          NX_BASE: origin/smar
          NX_HEAD: HEAD
        run: |
          set -o pipefail
          node tools/scripts/run-affected-verification.mjs typecheck lint test build 2>&1 | tee provider-node.log
      - name: Capture contract bindings
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm run guard:no-broken-imports
            pnpm --dir contracts typecheck
            pnpm run guard:api-binding
            pnpm run guard:backend-api-binding
            pnpm run guard:service-manifest-drift
            pnpm run guard:frontend-feature-binding
            pnpm run guard:runtime-real-bindings
            pnpm run guard:live-cross-journey-integrity
          } 2>&1 | tee provider-bindings.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-core-diagnostic-${{ github.run_id }}
          path: |
            provider-node.log
            provider-bindings.log
          if-no-files-found: error
          retention-days: 3
