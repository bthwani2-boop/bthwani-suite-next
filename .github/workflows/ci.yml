name: BThwani Contextual CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification depth
        required: true
        default: affected
        type: choice
        options: [affected, full]
      journey:
        description: Optional capability identifier
        required: false
        type: string
      runtime_proof:
        description: Execute the router-selected runtime profile
        required: true
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  push:
    branches: ["**"]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: contextual-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  context:
    name: Detect affected code scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      full_verification: ${{ steps.scope.outputs.full_verification }}
      full_scope: ${{ steps.scope.outputs.full_scope }}
      workflow: ${{ steps.scope.outputs.workflow }}
      frontend: ${{ steps.scope.outputs.frontend }}
      mobile: ${{ steps.scope.outputs.mobile }}
      contracts: ${{ steps.scope.outputs.contracts }}
      contracts_changed: ${{ steps.scope.outputs.contracts_changed }}
      journey: ${{ steps.scope.outputs.journey }}
      journey_scope: ${{ steps.scope.outputs.journey_scope }}
      node: ${{ steps.scope.outputs.node }}
      node_scope: ${{ steps.scope.outputs.node_scope }}
      dsh: ${{ steps.scope.outputs.dsh }}
      wlt: ${{ steps.scope.outputs.wlt }}
      identity: ${{ steps.scope.outputs.identity }}
      workforce: ${{ steps.scope.outputs.workforce }}
      platform: ${{ steps.scope.outputs.platform }}
      providers: ${{ steps.scope.outputs.providers }}
      database_changed: ${{ steps.scope.outputs.database_changed }}
      runtime_required: ${{ steps.scope.outputs.runtime_required }}
      runtime_profile: ${{ steps.scope.outputs.runtime_profile }}
      heavy: ${{ steps.scope.outputs.heavy }}
      verification_tier: ${{ steps.scope.outputs.verification_tier }}
      diagnostics_required: ${{ steps.scope.outputs.diagnostics_required }}
      verification_required: ${{ steps.scope.outputs.verification_required }}
      backend_required: ${{ steps.scope.outputs.backend_required }}
      platform_change_sets: ${{ steps.scope.outputs.platform_change_sets }}
      skip_duplicate_push: ${{ steps.scope.outputs.skip_duplicate_push }}
      execution_phase: ${{ steps.scope.outputs.execution_phase }}
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          fetch-tags: false
          filter: blob:none
          persist-credentials: false
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
      - name: Verify router behavior
        run: |
          node --test tools/scripts/detect-ci-context.test.mjs
          node --test tools/scripts/ci-runtime-bootstrap-policy.test.mjs
      - name: Resolve execution phase and affected scope
        id: scope
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_JOURNEY: ${{ inputs.journey }}
          DISPATCH_RUNTIME_PROOF: ${{ inputs.runtime_proof }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          base_sha="${PR_BASE_SHA:-${EVENT_BEFORE:-}}"
          phase="pr"
          mode=affected
          skip_duplicate=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            phase=closure
            mode="${DISPATCH_MODE:-affected}"
          elif [[ "${EVENT_NAME}" == "push" && ( "${GITHUB_REF_NAME}" == "master" || "${GITHUB_REF_NAME}" == "b" ) ]]; then
            phase=master
            verified_base=""
            while IFS= read -r candidate; do
              [[ -n "${candidate}" && "${candidate}" != "${head_sha}" ]] || continue
              if git merge-base --is-ancestor "${candidate}" "${head_sha}" 2>/dev/null; then
                verified_base="${candidate}"
                break
              fi
            done < <(gh api --method GET \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch="${GITHUB_REF_NAME}" \
              -f event=push \
              -f status=success \
              -f per_page=100 \
              --jq '.workflow_runs[].head_sha')
            if [[ -n "${verified_base}" ]]; then base_sha="${verified_base}"; else mode=full; fi
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            phase=development
            open_pr_count="$(gh api --method GET \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open \
              -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
              -f per_page=1 \
              --jq 'length')"
            if [[ "${open_pr_count}" != "0" ]]; then skip_duplicate=true; fi
          fi

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "${head_sha}")"
          fi

          echo "skip_duplicate_push=${skip_duplicate}" >> "${GITHUB_OUTPUT}"
          echo "execution_phase=${phase}" >> "${GITHUB_OUTPUT}"
          CI_BASE_SHA="${base_sha}" \
          CI_HEAD_SHA="${head_sha}" \
          CI_MODE="${mode}" \
          CI_EXECUTION_PHASE="${phase}" \
          CI_JOURNEY="${DISPATCH_JOURNEY:-}" \
          CI_RUNTIME_PROOF="${DISPATCH_RUNTIME_PROOF:-false}" \
          node tools/scripts/detect-ci-context.mjs
      - name: Set up Go only for workflow lint fallback
        if: ${{ steps.scope.outputs.workflow == 'true' && steps.scope.outputs.skip_duplicate_push != 'true' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.7"
          cache: false
      - name: Verify changed workflow code
        if: ${{ steps.scope.outputs.workflow == 'true' && steps.scope.outputs.skip_duplicate_push != 'true' }}
        run: |
          node tools/scripts/run-actionlint.mjs
          node tools/scripts/run-zizmor.mjs
          node tools/scripts/run-pinact.mjs --verify
      - name: Publish routing summary
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          NODE_SCOPE: ${{ steps.scope.outputs.node_scope }}
          JOURNEY_SCOPE: ${{ steps.scope.outputs.journey_scope }}
          VERIFICATION_TIER: ${{ steps.scope.outputs.verification_tier }}
          RUNTIME_PROFILE: ${{ steps.scope.outputs.runtime_profile }}
          FULL_VERIFICATION: ${{ steps.scope.outputs.full_verification }}
          EXECUTION_PHASE: ${{ steps.scope.outputs.execution_phase }}
          SKIP_DUPLICATE_PUSH: ${{ steps.scope.outputs.skip_duplicate_push }}
        run: |
          {
            echo "### Contextual code verification"
            echo "- Base: ${BASE_SHA}"
            echo "- Head: ${HEAD_SHA}"
            echo "- Phase: ${EXECUTION_PHASE}"
            echo "- Duplicate push suppressed: ${SKIP_DUPLICATE_PUSH}"
            echo "- Full verification: ${FULL_VERIFICATION}"
            echo "- Tier: ${VERIFICATION_TIER}"
            echo "- Runtime: ${RUNTIME_PROFILE}"
            echo "- Node scope: ${NODE_SCOPE}"
            echo "- Journey: ${JOURNEY_SCOPE:-none}"
          } >> "${GITHUB_STEP_SUMMARY}"

  diagnostics:
    name: Contract diagnostics
    needs: [context]
    if: ${{ needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.diagnostics_required == 'true' }}
    uses: ./.github/workflows/ci-node-diagnostics.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      frontend: ${{ needs.context.outputs.frontend }}
      contracts: ${{ needs.context.outputs.contracts }}
      contracts_changed: ${{ needs.context.outputs.contracts_changed }}
      node: ${{ needs.context.outputs.node }}
      verification_tier: ${{ needs.context.outputs.verification_tier }}
      execution_phase: ${{ needs.context.outputs.execution_phase }}

  verification:
    name: Node verification
    needs: [context]
    if: ${{ needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.verification_required == 'true' }}
    uses: ./.github/workflows/ci-node-verification.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_scope: ${{ needs.context.outputs.full_scope }}
      frontend: ${{ needs.context.outputs.frontend }}
      mobile: ${{ needs.context.outputs.mobile }}
      heavy: ${{ needs.context.outputs.heavy }}
      verification_tier: ${{ needs.context.outputs.verification_tier }}
      execution_phase: ${{ needs.context.outputs.execution_phase }}
      journey: ${{ needs.context.outputs.journey }}
      journey_scope: ${{ needs.context.outputs.journey_scope }}
      platform_change_sets: ${{ needs.context.outputs.platform_change_sets }}

  backends:
    name: Backend verification
    needs: [context]
    if: ${{ needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.backend_required == 'true' }}
    uses: ./.github/workflows/ci-backends.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_scope: ${{ needs.context.outputs.full_scope }}
      verification_tier: ${{ needs.context.outputs.verification_tier }}
      execution_phase: ${{ needs.context.outputs.execution_phase }}
      database_changed: ${{ needs.context.outputs.database_changed }}
      dsh: ${{ needs.context.outputs.dsh }}
      wlt: ${{ needs.context.outputs.wlt }}
      identity: ${{ needs.context.outputs.identity }}
      workforce: ${{ needs.context.outputs.workforce }}
      platform: ${{ needs.context.outputs.platform }}
      providers: ${{ needs.context.outputs.providers }}

  runtime:
    name: Runtime proof
    needs: [context]
    if: ${{ needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.runtime_required == 'true' }}
    uses: ./.github/workflows/ci-runtime.yml
    with:
      full_verification: ${{ needs.context.outputs.full_verification }}
      runtime: ${{ needs.context.outputs.runtime_required }}
      runtime_profile: ${{ needs.context.outputs.runtime_profile }}
      runtime_proof: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true }}

  result:
    name: BThwani CI result
    needs: [context, diagnostics, verification, backends, runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce applicable results
        shell: bash
        env:
          CONTEXT_RESULT: ${{ needs.context.result }}
          DIAGNOSTICS_RESULT: ${{ needs.diagnostics.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          BACKENDS_RESULT: ${{ needs.backends.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          DIAGNOSTICS_REQUIRED: ${{ needs.context.outputs.diagnostics_required }}
          VERIFICATION_REQUIRED: ${{ needs.context.outputs.verification_required }}
          BACKEND_REQUIRED: ${{ needs.context.outputs.backend_required }}
          RUNTIME_REQUIRED: ${{ needs.context.outputs.runtime_required }}
          SKIP_DUPLICATE_PUSH: ${{ needs.context.outputs.skip_duplicate_push }}
        run: |
          set -euo pipefail
          if [[ "${SKIP_DUPLICATE_PUSH}" == "true" ]]; then
            echo "development push skipped because an open PR owns verification"
            exit 0
          fi
          failures=()
          check_result() {
            local name="$1" result="$2" applicable="$3"
            if [[ "${result}" == "success" ]]; then return; fi
            if [[ "${result}" == "skipped" && "${applicable}" != "true" ]]; then return; fi
            failures+=("${name}:${result}")
          }
          check_result context "${CONTEXT_RESULT}" true
          check_result diagnostics "${DIAGNOSTICS_RESULT}" "${DIAGNOSTICS_REQUIRED}"
          check_result verification "${VERIFICATION_RESULT}" "${VERIFICATION_REQUIRED}"
          check_result backends "${BACKENDS_RESULT}" "${BACKEND_REQUIRED}"
          check_result runtime "${RUNTIME_RESULT}" "${RUNTIME_REQUIRED}"
          if [[ "${#failures[@]}" -ne 0 ]]; then
            echo "::error title=BThwani CI failed::$(IFS=,; echo "${failures[*]}")"
            exit 1
          fi
          echo "all applicable code verification passed"
