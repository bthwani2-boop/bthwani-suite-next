name: BThwani Contextual CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification depth
        required: true
        default: affected
        type: choice
        options: [affected, full]
      journey:
        description: Optional governed capability identifier
        required: false
        type: string
      runtime_proof:
        description: Execute the router-selected runtime profile
        required: true
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  push:
    branches: ["**"]
    paths:
      - "AGENTS.md"
      - "GEMINI.md"
      - ".agents/**"
      - ".github/**"
      - "governance/**"
      - "tools/**"
      - "contracts/**"
      - "core/**"
      - "services/**"
      - "apps/**"
      - "shared/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: contextual-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FULL_VERIFICATION_TRIGGER: governance/contracts/full-verification-policy.json
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  context:
    name: Detect affected scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      full_verification: ${{ steps.scope.outputs.full_verification }}
      governance: ${{ steps.scope.outputs.governance }}
      workflow: ${{ steps.scope.outputs.workflow }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
      security: ${{ steps.scope.outputs.security }}
      policy: ${{ steps.scope.outputs.policy }}
      governance_policy: ${{ steps.scope.outputs.governance_policy }}
      workflow_policy: ${{ steps.scope.outputs.workflow_policy }}
      security_policy: ${{ steps.scope.outputs.security_policy }}
      infrastructure_policy: ${{ steps.scope.outputs.infrastructure_policy }}
      nomenclature_required: ${{ steps.scope.outputs.nomenclature_required }}
      frontend: ${{ steps.scope.outputs.frontend }}
      contracts: ${{ steps.scope.outputs.contracts }}
      journey: ${{ steps.scope.outputs.journey }}
      journey_scope: ${{ steps.scope.outputs.journey_scope }}
      node: ${{ steps.scope.outputs.node }}
      node_scope: ${{ steps.scope.outputs.node_scope }}
      dsh: ${{ steps.scope.outputs.dsh }}
      wlt: ${{ steps.scope.outputs.wlt }}
      identity: ${{ steps.scope.outputs.identity }}
      workforce: ${{ steps.scope.outputs.workforce }}
      platform: ${{ steps.scope.outputs.platform }}
      providers: ${{ steps.scope.outputs.providers }}
      database: ${{ steps.scope.outputs.database }}
      runtime: ${{ steps.scope.outputs.runtime }}
      runtime_profile: ${{ steps.scope.outputs.runtime_profile }}
      shared_brain: ${{ steps.scope.outputs.shared_brain }}
      heavy: ${{ steps.scope.outputs.heavy }}
      verification_tier: ${{ steps.scope.outputs.verification_tier }}
      diagnostics: ${{ steps.scope.outputs.diagnostics }}
      platform_change_sets: ${{ steps.scope.outputs.platform_change_sets }}
      skip_duplicate_push: ${{ steps.scope.outputs.skip_duplicate_push }}
      execution_phase: ${{ steps.scope.outputs.execution_phase }}
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
      - name: Verify contextual router decisions
        run: node --test tools/scripts/detect-ci-context.test.mjs
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_JOURNEY: ${{ inputs.journey }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          BASE_SHA="${PR_BASE_SHA:-${EVENT_BEFORE:-}}"
          VERIFIED_PUSH_BASE=false
          SKIP_DUPLICATE_PUSH=false
          EXECUTION_PHASE="pr"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            EXECUTION_PHASE="closure"
          elif [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "master" ]]; then
            EXECUTION_PHASE="master"

            # Master remains fail-closed: carry verification debt from the most
            # recent successful contextual CI ancestor. Failed/cancelled master
            # runs are not accepted as evidence.
            if ! SUCCESSFUL_RUN_SHAS="$(
              gh api --method GET \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f branch="${GITHUB_REF_NAME}" \
                -f event=push \
                -f status=success \
                -f per_page=100 \
                --jq '.workflow_runs[].head_sha'
            )"; then
              echo "::error title=CI verification base unavailable::failed to query successful contextual CI runs"
              exit 1
            fi

            while IFS= read -r candidate; do
              if [[ -z "${candidate}" || "${candidate}" == "${HEAD_SHA}" ]]; then
                continue
              fi
              if git merge-base --is-ancestor "${candidate}" "${HEAD_SHA}" 2>/dev/null; then
                BASE_SHA="${candidate}"
                VERIFIED_PUSH_BASE=true
                break
              fi
            done <<< "${SUCCESSFUL_RUN_SHAS}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            EXECUTION_PHASE="development"

            # Development feedback is intentionally commit-local. Closure/PR
            # verification is responsible for the complete base..HEAD delta.
            BASE_SHA="${EVENT_BEFORE:-}"

            # A branch with an open PR already receives pull_request verification.
            # Keep this push run as a tiny routing receipt and suppress duplicated
            # heavy work for the same source branch.
            if ! OPEN_PR_COUNT="$(
              gh api --method GET \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/pulls" \
                -f state=open \
                -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
                -f per_page=1 \
                --jq 'length'
            )"; then
              echo "::error title=PR deduplication lookup failed::unable to query open pull requests for ${GITHUB_REF_NAME}"
              exit 1
            fi
            if [[ "${OPEN_PR_COUNT}" != "0" ]]; then
              SKIP_DUPLICATE_PUSH=true
            fi
          fi

          echo "skip_duplicate_push=${SKIP_DUPLICATE_PUSH}" >> "${GITHUB_OUTPUT}"
          echo "execution_phase=${EXECUTION_PHASE}" >> "${GITHUB_OUTPUT}"
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "${HEAD_SHA}")"
          fi

          FULL_VERIFICATION=false
          if [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "master" && "${VERIFIED_PUSH_BASE}" != "true" ]]; then
            # No trusted successful ancestor means there is no safe affected-only
            # baseline. Establish one by running the full verification contract.
            FULL_VERIFICATION=true
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_MODE:-affected}" == "full" ]]; then
            FULL_VERIFICATION=true
          elif git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -Fxq "${FULL_VERIFICATION_TRIGGER}"; then
            FULL_VERIFICATION=true
          elif git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -Eq '^\.github/workflows/'; then
            # Verification machinery cannot certify itself with a partial run.
            FULL_VERIFICATION=true
          fi
          echo "full_verification=${FULL_VERIFICATION}" >> "${GITHUB_OUTPUT}"

          printf '%s\n' "verification base=${BASE_SHA} head=${HEAD_SHA} trusted_push_base=${VERIFIED_PUSH_BASE} full=${FULL_VERIFICATION}"

          MODE="${DISPATCH_MODE:-affected}"
          if [[ "${FULL_VERIFICATION}" == "true" ]]; then MODE="full"; fi
          CI_BASE_SHA="${BASE_SHA}" \
          CI_HEAD_SHA="${HEAD_SHA}" \
          CI_MODE="${MODE}" \
          CI_JOURNEY="${DISPATCH_JOURNEY:-}" \
          node tools/scripts/detect-ci-context.mjs
      - name: Publish routing summary
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          NODE_SCOPE: ${{ steps.scope.outputs.node_scope }}
          JOURNEY_SCOPE: ${{ steps.scope.outputs.journey_scope }}
          VERIFICATION_TIER: ${{ steps.scope.outputs.verification_tier }}
          RUNTIME_PROFILE: ${{ steps.scope.outputs.runtime_profile }}
          DIAGNOSTICS_REQUIRED: ${{ steps.scope.outputs.diagnostics }}
          FULL_VERIFICATION: ${{ steps.scope.outputs.full_verification }}
          EXECUTION_PHASE: ${{ steps.scope.outputs.execution_phase }}
          SKIP_DUPLICATE_PUSH: ${{ steps.scope.outputs.skip_duplicate_push }}
        run: |
          {
            echo "### Contextual CI routing"
            echo "- Base: ${BASE_SHA}"
            echo "- Head: ${HEAD_SHA}"
            echo "- Execution phase: ${EXECUTION_PHASE}"
            echo "- Duplicate push suppressed: ${SKIP_DUPLICATE_PUSH}"
            echo "- Full verification: ${FULL_VERIFICATION}"
            echo "- Verification tier: ${VERIFICATION_TIER}"
            echo "- Runtime profile: ${RUNTIME_PROFILE}"
            echo "- Node scope: ${NODE_SCOPE}"
            echo "- Journey scope: ${JOURNEY_SCOPE:-none}"
            echo "- Static diagnostics: ${DIAGNOSTICS_REQUIRED}"
          } >> "${GITHUB_STEP_SUMMARY}"

  policy:
    name: Policy and governance
    needs: [context]
    if: ${{ needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.policy == 'true' }}
    uses: ./.github/workflows/ci-policy.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      governance_policy: ${{ needs.context.outputs.governance_policy }}
      workflow_policy: ${{ needs.context.outputs.workflow_policy }}
      security_policy: ${{ needs.context.outputs.security_policy }}
      infrastructure_policy: ${{ needs.context.outputs.infrastructure_policy }}
      nomenclature_required: ${{ needs.context.outputs.nomenclature_required }}

  diagnostics:
    name: Static diagnostics
    needs: [context]
    if: ${{ needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.diagnostics == 'true' }}
    uses: ./.github/workflows/ci-node-diagnostics.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      frontend: ${{ needs.context.outputs.frontend }}
      contracts: ${{ needs.context.outputs.contracts }}
      node: ${{ needs.context.outputs.node }}
      verification_tier: ${{ needs.context.outputs.verification_tier }}

  verification:
    name: Node verification
    needs: [context]
    if: ${{ needs.context.outputs.skip_duplicate_push != 'true' && (needs.context.outputs.full_verification == 'true' || needs.context.outputs.frontend == 'true' || needs.context.outputs.node == 'true' || needs.context.outputs.journey == 'true' || needs.context.outputs.platform_change_sets == 'true') }}
    uses: ./.github/workflows/ci-node-verification.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      frontend: ${{ needs.context.outputs.frontend }}
      heavy: ${{ needs.context.outputs.heavy }}
      verification_tier: ${{ needs.context.outputs.verification_tier }}
      journey: ${{ needs.context.outputs.journey }}
      journey_scope: ${{ needs.context.outputs.journey_scope }}
      platform_change_sets: ${{ needs.context.outputs.platform_change_sets }}

  backends:
    name: Backend verification
    needs: [context]
    if: ${{ needs.context.outputs.skip_duplicate_push != 'true' && (needs.context.outputs.full_verification == 'true' || needs.context.outputs.dsh == 'true' || needs.context.outputs.wlt == 'true' || needs.context.outputs.identity == 'true' || needs.context.outputs.workforce == 'true' || needs.context.outputs.platform == 'true' || needs.context.outputs.providers == 'true') }}
    uses: ./.github/workflows/ci-backends.yml
    with:
      dsh: ${{ needs.context.outputs.dsh }}
      wlt: ${{ needs.context.outputs.wlt }}
      identity: ${{ needs.context.outputs.identity }}
      workforce: ${{ needs.context.outputs.workforce }}
      platform: ${{ needs.context.outputs.platform }}
      providers: ${{ needs.context.outputs.providers }}

  runtime:
    name: Runtime proof
    needs: [context]
    if: ${{ needs.context.outputs.skip_duplicate_push != 'true' && (needs.context.outputs.full_verification == 'true' || needs.context.outputs.runtime == 'true' || (github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true)) }}
    uses: ./.github/workflows/ci-runtime.yml
    with:
      full_verification: ${{ needs.context.outputs.full_verification }}
      runtime: ${{ needs.context.outputs.runtime }}
      runtime_profile: ${{ (github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true && needs.context.outputs.runtime_profile == 'none') && 'full' || needs.context.outputs.runtime_profile }}
      runtime_proof: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true }}

  result:
    name: BThwani CI result
    needs: [context, policy, diagnostics, verification, backends, runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce fail-closed aggregate result
        shell: bash
        env:
          CONTEXT_RESULT: ${{ needs.context.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          DIAGNOSTICS_RESULT: ${{ needs.diagnostics.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          BACKENDS_RESULT: ${{ needs.backends.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          FULL_VERIFICATION: ${{ needs.context.outputs.full_verification }}
          POLICY_REQUIRED: ${{ needs.context.outputs.policy }}
          DIAGNOSTICS_REQUIRED: ${{ needs.context.outputs.diagnostics }}
          FRONTEND_REQUIRED: ${{ needs.context.outputs.frontend }}
          NODE_REQUIRED: ${{ needs.context.outputs.node }}
          JOURNEY_REQUIRED: ${{ needs.context.outputs.journey }}
          PLATFORM_CHANGE_SETS_REQUIRED: ${{ needs.context.outputs.platform_change_sets }}
          BACKEND_REQUIRED: ${{ needs.context.outputs.dsh == 'true' || needs.context.outputs.wlt == 'true' || needs.context.outputs.identity == 'true' || needs.context.outputs.workforce == 'true' || needs.context.outputs.platform == 'true' || needs.context.outputs.providers == 'true' }}
          RUNTIME_REQUIRED: ${{ needs.context.outputs.runtime }}
          EXPLICIT_RUNTIME_PROOF: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true }}
          SKIP_DUPLICATE_PUSH: ${{ needs.context.outputs.skip_duplicate_push }}
          EXECUTION_PHASE: ${{ needs.context.outputs.execution_phase }}
        run: |
          set -euo pipefail

          if [[ "${SKIP_DUPLICATE_PUSH}" == "true" ]]; then
            printf '%s\n' "duplicate development push suppressed because an open PR owns verification for this branch"
            exit 0
          fi

          printf '%s\n' "execution phase=${EXECUTION_PHASE}"
          failed=0
          failures=()

          check_result() {
            local name="$1"
            local result="$2"
            local applicable="$3"
            if [[ "${result}" == "success" ]]; then return 0; fi
            if [[ "${result}" == "skipped" && "${applicable}" != "true" ]]; then return 0; fi
            failures+=("${name}:${result}")
            failed=1
          }

          verification_applicable=false
          if [[ "${FULL_VERIFICATION}" == "true" || "${FRONTEND_REQUIRED}" == "true" || "${NODE_REQUIRED}" == "true" || "${JOURNEY_REQUIRED}" == "true" || "${PLATFORM_CHANGE_SETS_REQUIRED}" == "true" ]]; then
            verification_applicable=true
          fi
          runtime_applicable=false
          if [[ "${FULL_VERIFICATION}" == "true" || "${RUNTIME_REQUIRED}" == "true" || "${EXPLICIT_RUNTIME_PROOF}" == "true" ]]; then
            runtime_applicable=true
          fi

          check_result context "${CONTEXT_RESULT}" true
          check_result policy "${POLICY_RESULT}" "${POLICY_REQUIRED}"
          check_result diagnostics "${DIAGNOSTICS_RESULT}" "${DIAGNOSTICS_REQUIRED}"
          check_result verification "${VERIFICATION_RESULT}" "${verification_applicable}"
          check_result backends "${BACKENDS_RESULT}" "${BACKEND_REQUIRED}"
          check_result runtime "${RUNTIME_RESULT}" "${runtime_applicable}"

          if [[ "${failed}" -ne 0 ]]; then
            message="failed or unjustifiably skipped bundles: $(IFS=,; echo "${failures[*]}")"
            echo "::error title=BThwani CI failed::${message}"
            printf '%s\n' "${message}"
            exit 1
          fi
          printf '%s\n' "all required bundles passed; skipped bundles were proven non-applicable by the router"
