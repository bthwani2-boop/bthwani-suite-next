name: BThwani CI
run-name: >-
  ${{ inputs.target_kind == 'pull_request' && 'BThwani CI / PR result' || 'BThwani CI / check result' }}

on:
  workflow_call:
    inputs:
      mode: {type: string, required: false, default: affected}
      target_kind: {type: string, required: false, default: branch}
      pr_number: {type: string, required: false, default: ""}
      expected_head_sha: {type: string, required: false, default: ""}
      expected_base_sha: {type: string, required: false, default: ""}
  workflow_dispatch:
    inputs:
      mode:
        description: Internal verification scope
        required: true
        default: affected
        type: choice
        options: [affected, full]
      target_kind:
        description: Internal target identity
        required: false
        default: branch
        type: choice
        options: [branch, pull_request]
      pr_number:
        description: Pull request number for a PR candidate
        required: false
        type: string
      expected_head_sha:
        description: Exact candidate SHA
        required: false
        type: string
      expected_base_sha:
        description: Exact base SHA
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: bthwani-ci-${{ inputs.target_kind || 'branch' }}-${{ inputs.pr_number || inputs.expected_head_sha || github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  context:
    name: Resolve exact live candidate and affected scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      target_kind: ${{ steps.target.outputs.target_kind }}
      pr_number: ${{ steps.target.outputs.pr_number }}
      head_ref: ${{ steps.target.outputs.head_ref }}
      base_ref: ${{ steps.target.outputs.base_ref }}
      base_sha: ${{ steps.target.outputs.base_sha }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      full_scope: ${{ steps.scope.outputs.full_scope }}
      dependency_changed: ${{ steps.scope.outputs.dependency_changed }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
      ci_control_plane: ${{ steps.scope.outputs.ci_control_plane }}
      frontend: ${{ steps.scope.outputs.frontend }}
      contracts: ${{ steps.scope.outputs.contracts }}
      dsh: ${{ steps.scope.outputs.dsh }}
      wlt: ${{ steps.scope.outputs.wlt }}
      identity: ${{ steps.scope.outputs.identity }}
      workforce: ${{ steps.scope.outputs.workforce }}
      platform: ${{ steps.scope.outputs.platform }}
      providers: ${{ steps.scope.outputs.providers }}
      database_changed: ${{ steps.scope.outputs.database_changed }}
      runtime_required: ${{ steps.scope.outputs.runtime_required }}
      diagnostics_required: ${{ steps.scope.outputs.diagnostics_required }}
      verification_required: ${{ steps.scope.outputs.verification_required }}
      backend_required: ${{ steps.scope.outputs.backend_required }}
    steps:
      - name: Checkout exact requested candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.expected_head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: false
          filter: blob:none
          persist-credentials: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Resolve live branch and PR identity
        id: target
        shell: bash
        env:
          TARGET_KIND: ${{ inputs.target_kind }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          target_kind="${TARGET_KIND:-branch}"
          pr_number="${PR_NUMBER_INPUT:-}"
          head_ref="${GITHUB_REF_NAME}"
          base_ref="${DEFAULT_BRANCH}"
          base_sha=""

          if [[ "${target_kind}" == "pull_request" ]]; then
            [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::a PR number is required"; exit 1; }
            pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || { echo "::error::PR is not open"; exit 1; }
            pr_head="$(jq -r '.head.sha' <<<"${pr}")"
            base_sha="$(jq -r '.base.sha' <<<"${pr}")"
            head_ref="$(jq -r '.head.ref' <<<"${pr}")"
            base_ref="$(jq -r '.base.ref' <<<"${pr}")"
            [[ "${actual_head}" == "${pr_head}" ]] || { echo "::error::live checkout is not the PR HEAD"; exit 1; }
            [[ -z "${EXPECTED_HEAD_SHA}" || "${EXPECTED_HEAD_SHA}" == "${pr_head}" ]] || { echo "::error::stale head identity"; exit 1; }
            [[ -z "${EXPECTED_BASE_SHA}" || "${EXPECTED_BASE_SHA}" == "${base_sha}" ]] || { echo "::error::stale base identity"; exit 1; }
          else
            [[ -z "${EXPECTED_HEAD_SHA}" || "${EXPECTED_HEAD_SHA}" == "${actual_head}" ]] || { echo "::error::stale branch identity"; exit 1; }
            base_sha="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/branches/${base_ref}" --jq '.commit.sha')"
            if [[ "${base_sha}" == "${actual_head}" ]]; then
              echo "::error::branch HEAD equals base; no candidate delta"; exit 1
            fi
          fi
          [[ "${base_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::invalid base SHA"; exit 1; }
          [[ "${actual_head}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::invalid head SHA"; exit 1; }
          git cat-file -e "${base_sha}^{commit}"
          git merge-base --is-ancestor "${base_sha}" "${actual_head}" || { echo "::error::base is not an ancestor of candidate"; exit 1; }
          {
            echo "target_kind=${target_kind}"
            echo "pr_number=${pr_number}"
            echo "head_ref=${head_ref}"
            echo "base_ref=${base_ref}"
            echo "base_sha=${base_sha}"
            echo "head_sha=${actual_head}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Exact candidate"
            echo "- Target: ${target_kind}"
            echo "- PR: ${pr_number:-none}"
            echo "- Head: ${head_ref}@${actual_head}"
            echo "- Base: ${base_ref}@${base_sha}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Resolve affected owners from exact Git diff
        id: scope
        shell: bash
        env:
          CI_BASE_SHA: ${{ steps.target.outputs.base_sha }}
          CI_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          CI_MODE: ${{ inputs.mode }}
        run: node tools/scripts/detect-ci-context.mjs

  diagnostics:
    name: Contract diagnostics
    needs: [context]
    if: ${{ needs.context.outputs.diagnostics_required == 'true' }}
    uses: ./.github/workflows/ci-node-diagnostics.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      candidate_sha: ${{ needs.context.outputs.head_sha }}
      full_scope: ${{ needs.context.outputs.full_scope }}
      contracts: ${{ needs.context.outputs.contracts }}

  verification:
    name: Node verification
    needs: [context]
    if: ${{ needs.context.outputs.verification_required == 'true' }}
    uses: ./.github/workflows/ci-node-verification.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      candidate_sha: ${{ needs.context.outputs.head_sha }}
      full_scope: ${{ needs.context.outputs.full_scope }}
      contracts: ${{ needs.context.outputs.contracts }}
      ci_control_plane: ${{ needs.context.outputs.ci_control_plane }}
      dependency_changed: ${{ needs.context.outputs.dependency_changed }}

  backends:
    name: Backend verification
    needs: [context]
    if: ${{ needs.context.outputs.backend_required == 'true' }}
    uses: ./.github/workflows/ci-backends.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      candidate_sha: ${{ needs.context.outputs.head_sha }}
      full_scope: ${{ needs.context.outputs.full_scope }}
      database_changed: ${{ needs.context.outputs.database_changed }}
      dsh: ${{ needs.context.outputs.dsh }}
      wlt: ${{ needs.context.outputs.wlt }}
      identity: ${{ needs.context.outputs.identity }}
      workforce: ${{ needs.context.outputs.workforce }}
      platform: ${{ needs.context.outputs.platform }}
      providers: ${{ needs.context.outputs.providers }}

  runtime:
    name: Runtime verification
    needs: [context]
    if: ${{ needs.context.outputs.runtime_required == 'true' }}
    uses: ./.github/workflows/ci-runtime.yml
    with:
      candidate_sha: ${{ needs.context.outputs.head_sha }}

  result:
    name: ${{ inputs.target_kind == 'pull_request' && 'BThwani CI / PR result' || 'BThwani CI / check result' }}
    needs: [context, diagnostics, verification, backends, runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce applicable results on the exact candidate
        shell: bash
        env:
          CONTEXT_RESULT: ${{ needs.context.result }}
          DIAGNOSTICS_RESULT: ${{ needs.diagnostics.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          BACKENDS_RESULT: ${{ needs.backends.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          DIAGNOSTICS_REQUIRED: ${{ needs.context.outputs.diagnostics_required }}
          VERIFICATION_REQUIRED: ${{ needs.context.outputs.verification_required }}
          BACKEND_REQUIRED: ${{ needs.context.outputs.backend_required }}
          RUNTIME_REQUIRED: ${{ needs.context.outputs.runtime_required }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          TARGET_KIND: ${{ needs.context.outputs.target_kind }}
        run: |
          set -euo pipefail
          [[ "${CONTEXT_RESULT}" == "success" ]] || { echo "::error::candidate context failed"; exit 1; }
          failures=()
          check_result() {
            local name="$1" result="$2" required="$3"
            [[ "${required}" != "true" && "${result}" == "skipped" ]] && return 0
            [[ "${result}" == "success" ]] || failures+=("${name}:${result}")
          }
          check_result diagnostics "${DIAGNOSTICS_RESULT}" "${DIAGNOSTICS_REQUIRED}"
          check_result node "${VERIFICATION_RESULT}" "${VERIFICATION_REQUIRED}"
          check_result backends "${BACKENDS_RESULT}" "${BACKEND_REQUIRED}"
          check_result runtime "${RUNTIME_RESULT}" "${RUNTIME_REQUIRED}"
          if (( ${#failures[@]} )); then
            echo "::error::BThwani CI failed for ${HEAD_SHA}: $(IFS=,; echo "${failures[*]}")"
            exit 1
          fi
          echo "Exact candidate ${HEAD_SHA} passed applicable verification (${TARGET_KIND})."
