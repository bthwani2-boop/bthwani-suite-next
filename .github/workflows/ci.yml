name: BThwani Contextual CI

run-name: >- # closure-pr-run-name
  ${{ github.event_name == 'workflow_dispatch' && inputs.target_kind == 'pull_request' &&
  format('closure-pr-{0}-head-{1}-base-{2}', inputs.pr_number, inputs.expected_head_sha,
  inputs.expected_base_sha) || format('bthwani-ci-{0}-{1}', github.event_name, github.sha) }}

on:
  workflow_call:
    inputs:
      mode: {type: string, required: false, default: affected}
      journey: {type: string, required: false, default: ""}
      runtime_proof: {type: boolean, required: false, default: false}
      target_kind: {type: string, required: false, default: branch}
      pr_number: {type: string, required: false, default: ""}
      expected_head_sha: {type: string, required: false, default: ""}
      expected_base_sha: {type: string, required: false, default: ""}
      run_analyzers: {type: boolean, required: false, default: false}
      run_assurance: {type: boolean, required: false, default: false}
  workflow_dispatch:
    inputs:
      mode:
        description: Verification depth
        required: true
        default: affected
        type: choice
        options: [affected, full]
      journey:
        description: Optional capability identifier
        required: false
        type: string
      runtime_proof:
        description: Execute the router-selected runtime profile
        required: true
        default: false
        type: boolean
      run_assurance:
        description: Run heavy assurance workers
        required: false
        default: false
        type: boolean
      target_kind:
        description: Explicit target identity for remote closure
        required: false
        default: branch
        type: choice
        options: [branch, pull_request]
      pr_number:
        description: Pull request number when target_kind=pull_request
        required: false
        type: string
      expected_head_sha:
        description: Exact expected candidate SHA
        required: false
        type: string
      expected_base_sha:
        description: Exact expected PR base SHA
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: ${{ github.event.repository.default_branch }}

concurrency:
  group: bthwani-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  context:
    name: Resolve canonical target and affected scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      target_kind: ${{ steps.target.outputs.target_kind }}
      pr_number: ${{ steps.target.outputs.pr_number }}
      head_ref: ${{ steps.target.outputs.head_ref }}
      base_ref: ${{ steps.target.outputs.base_ref }}
      # base_sha is the exact delta base consumed by affected verification.
      base_sha: ${{ steps.scope.outputs.base_sha }}
      canonical_base_sha: ${{ steps.target.outputs.base_sha }}
      scope_base_sha: ${{ steps.scope.outputs.base_sha }}
      scope_kind: ${{ steps.target.outputs.scope_kind }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      full_verification: ${{ steps.scope.outputs.full_verification }}
      full_scope: ${{ steps.scope.outputs.full_scope }}
      workflow: ${{ steps.scope.outputs.workflow }}
      workspace: ${{ steps.scope.outputs.workspace }}
      dependency_changed: ${{ steps.scope.outputs.dependency_changed }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
      frontend: ${{ steps.scope.outputs.frontend }}
      mobile: ${{ steps.scope.outputs.mobile }}
      contracts: ${{ steps.scope.outputs.contracts }}
      contracts_changed: ${{ steps.scope.outputs.contracts_changed }}
      security: ${{ steps.scope.outputs.security }}
      journey: ${{ steps.scope.outputs.journey }}
      journey_scope: ${{ steps.scope.outputs.journey_scope }}
      node: ${{ steps.scope.outputs.node }}
      node_scope: ${{ steps.scope.outputs.node_scope }}
      dsh: ${{ steps.scope.outputs.dsh }}
      wlt: ${{ steps.scope.outputs.wlt }}
      identity: ${{ steps.scope.outputs.identity }}
      workforce: ${{ steps.scope.outputs.workforce }}
      platform: ${{ steps.scope.outputs.platform }}
      providers: ${{ steps.scope.outputs.providers }}
      database_changed: ${{ steps.scope.outputs.database_changed }}
      runtime_required: ${{ steps.scope.outputs.runtime_required }}
      runtime_profile: ${{ steps.scope.outputs.runtime_profile }}
      heavy: ${{ steps.scope.outputs.heavy }}
      verification_tier: ${{ steps.scope.outputs.verification_tier }}
      diagnostics_required: ${{ steps.scope.outputs.diagnostics_required }}
      verification_required: ${{ steps.scope.outputs.verification_required }}
      backend_required: ${{ steps.scope.outputs.backend_required }}
      platform_change_sets: ${{ steps.scope.outputs.platform_change_sets }}
      skip_duplicate_push: ${{ steps.target.outputs.skip_duplicate_push }}
      execution_phase: ${{ steps.target.outputs.execution_phase }}
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.expected_head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: false
          filter: blob:none
          persist-credentials: false

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Verify router behavior
        run: |
          node --test tools/scripts/detect-ci-context.test.mjs
          node --test tools/scripts/ci-routing.test.mjs
          node --test tools/scripts/ci-runtime-bootstrap-policy.test.mjs

      - name: Resolve canonical branch/PR identity
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          PR_HEAD_REF_EVENT: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA_EVENT: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF_EVENT: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA_EVENT: ${{ github.event.pull_request.base.sha }}
          PR_ACTION_EVENT: ${{ github.event.action }}
          PR_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REQUEST_TARGET_KIND: ${{ inputs.target_kind }}
          REQUEST_PR_NUMBER: ${{ inputs.pr_number }}
          REQUEST_HEAD_SHA: ${{ inputs.expected_head_sha }}
          REQUEST_BASE_SHA: ${{ inputs.expected_base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          target_kind=branch
          pr_number=""
          head_ref="${GITHUB_REF_NAME}"
          base_ref="${DEFAULT_BRANCH}"
          base_sha=""
          phase=development
          skip_duplicate=false
          scope_base_sha=""
          scope_kind="canonical"
          previous_head_sha=""

          resolve_pr() {
            local number="$1"
            gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${number}"
          }

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            [[ "${actual_head}" == "${PR_HEAD_SHA_EVENT}" ]] || {
              echo "::error::PR checkout drift: expected=${PR_HEAD_SHA_EVENT} actual=${actual_head}"
              exit 1
            }
            target_kind=pull_request
            pr_number="${PR_NUMBER_EVENT}"
            head_ref="${PR_HEAD_REF_EVENT}"
            base_ref="${PR_BASE_REF_EVENT}"
            base_sha="${PR_BASE_SHA_EVENT}"
            phase="pr"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "workflow_call" ]] && [[ "${REQUEST_TARGET_KIND:-branch}" == "pull_request" ]]; then
            [[ "${REQUEST_PR_NUMBER}" =~ ^[0-9]+$ ]] || { echo \
            "::error::pr_number is required for pull_request target"; exit 1; }
            pr="$(resolve_pr "${REQUEST_PR_NUMBER}")"
            [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || { echo "::error::target PR is not open"; exit 1; }
            pr_head="$(jq -r '.head.sha' <<<"${pr}")"
            pr_base="$(jq -r '.base.sha' <<<"${pr}")"
            [[ "${actual_head}" == "${pr_head}" ]] || { echo \
            "::error::dispatch checkout is not PR head: expected=${pr_head} actual=${actual_head}"; exit 1; }
            [[ -z "${REQUEST_HEAD_SHA:-}" || "${REQUEST_HEAD_SHA}" == "${pr_head}" ]] || { echo \
            "::error::requested head SHA is stale"; exit 1; }
            [[ -z "${REQUEST_BASE_SHA:-}" || "${REQUEST_BASE_SHA}" == "${pr_base}" ]] || { echo \
            "::error::requested base SHA is stale"; exit 1; }
            target_kind=pull_request
            pr_number="${REQUEST_PR_NUMBER}"
            head_ref="$(jq -r '.head.ref' <<<"${pr}")"
            base_ref="$(jq -r '.base.ref' <<<"${pr}")"
            base_sha="${pr_base}"
            phase="closure"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "workflow_call" ]]; then
            [[ -z "${REQUEST_HEAD_SHA:-}" || "${REQUEST_HEAD_SHA}" == "${actual_head}" ]] || { echo \
            "::error::requested branch SHA is stale"; exit 1; }
            phase="closure"
          elif [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            phase="default-branch"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            mapfile -t prs < <(gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" -f \
              base="${DEFAULT_BRANCH}" -f per_page=100 \
              --jq '.[].number')
            if (( ${#prs[@]} > 1 )); then
              echo "::error::PR_IDENTITY_CONFLICT: multiple open PRs own ${GITHUB_REF_NAME} -> ${DEFAULT_BRANCH}"
              exit 1
            fi
            if (( ${#prs[@]} == 1 )); then
              pr="$(resolve_pr "${prs[0]}")"
              [[ "$(jq -r '.head.sha' <<<"${pr}")" == "${actual_head}" ]] || { echo \
              "::error::open PR head does not match push candidate"; exit 1; }
              target_kind=pull_request
              pr_number="${prs[0]}"
              head_ref="$(jq -r '.head.ref' <<<"${pr}")"
              base_ref="$(jq -r '.base.ref' <<<"${pr}")"
              base_sha="$(jq -r '.base.sha' <<<"${pr}")"
              phase="pr"
              skip_duplicate=true
            fi
          fi

          if [[ -z "${base_sha}" ]]; then
            if [[ "${phase}" == "default-branch" ]]; then
              base_sha="${{ github.event.before }}"
            else
              base_sha="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/branches/${base_ref}" --jq '.commit.sha')"
            fi
          fi
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "${actual_head}")"
          fi

          scope_base_sha="${base_sha}"
          if [[ "${EVENT_NAME}" == "pull_request" && "${PR_ACTION_EVENT}" == "synchronize" ]]; then
            if [[ "${PR_BEFORE_SHA:-}" =~ ^[0-9a-fA-F]{40}$ && "${PR_BEFORE_SHA}" != "${actual_head}" ]]; then
              previous_head_sha="${PR_BEFORE_SHA}"
              scope_kind="incremental-event-before"
            else
              current_run="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${CURRENT_RUN_ID}")"
              current_created_at="$(jq -r '.created_at' <<<"${current_run}")"
              runs="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
                --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs" \
                -f event=pull_request -f per_page=100)"
              previous_head_sha="$(jq -r \
                --arg branch "${head_ref}" \
                --arg pr "${pr_number}" \
                --arg current "${actual_head}" \
                --arg run_id "${CURRENT_RUN_ID}" \
                --arg created "${current_created_at}" '
                [.workflow_runs[]
                  | select((.name // "") | startswith("bthwani-ci-pull_request-"))
                  | select((.id | tostring) != $run_id)
                  | select((.head_sha // "") != $current)
                  | select((.created_at // "") < $created)
                  | select((.head_branch == $branch) or ((.pull_requests // []) | any(.number == ($pr | tonumber))))]
                | sort_by(.created_at)
                | last
                | .head_sha // empty' <<<"${runs}")"
              if [[ "${previous_head_sha}" =~ ^[0-9a-fA-F]{40}$ && "${previous_head_sha}" != "${actual_head}" ]]; then
                scope_kind="incremental-run-history"
              else
                echo "::error::Unable to resolve the exact previous PR HEAD for synchronize; refusing to widen to base→head"
                exit 1
              fi
            fi
            scope_base_sha="${previous_head_sha}"
          fi

          {
            echo "target_kind=${target_kind}"
            echo "pr_number=${pr_number}"
            echo "head_ref=${head_ref}"
            echo "base_ref=${base_ref}"
            echo "base_sha=${base_sha}"
            echo "scope_base_sha=${scope_base_sha}"
            echo "scope_kind=${scope_kind}"
            echo "previous_head_sha=${previous_head_sha}"
            echo "head_sha=${actual_head}"
            echo "execution_phase=${phase}"
            echo "skip_duplicate_push=${skip_duplicate}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve affected scope from canonical identity
        id: scope
        shell: bash
        env:
          CI_BASE_SHA: ${{ steps.target.outputs.scope_base_sha }}
          CI_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          CI_EXECUTION_PHASE: ${{ steps.target.outputs.execution_phase }}
          DISPATCH_MODE: ${{ inputs.mode }}
          CI_JOURNEY: ${{ inputs.journey }}
          CI_RUNTIME_PROOF: ${{ inputs.runtime_proof }}
          CI_RUN_ASSURANCE: ${{ inputs.run_assurance }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mode=affected
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "workflow_call" ]]; then mode="${DISPATCH_MODE:-affected}"; fi
          CI_MODE="${mode}" node tools/scripts/detect-ci-context.mjs

      - name: Publish canonical identity summary
        env:
          TARGET_KIND: ${{ steps.target.outputs.target_kind }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          BASE_REF: ${{ steps.target.outputs.base_ref }}
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          CANONICAL_BASE_SHA: ${{ steps.target.outputs.base_sha }}
          SCOPE_KIND: ${{ steps.target.outputs.scope_kind }}
          PHASE: ${{ steps.target.outputs.execution_phase }}
          SKIP_DUPLICATE: ${{ steps.target.outputs.skip_duplicate_push }}
          TIER: ${{ steps.scope.outputs.verification_tier }}
        run: |
          {
            echo "### Canonical execution context"
            echo "- Target: ${TARGET_KIND}"
            echo "- PR: ${PR_NUMBER:-none}"
            echo "- Head: ${HEAD_REF}@${HEAD_SHA}"
            echo "- Scope base: ${BASE_REF}@${BASE_SHA}"
            echo "- Canonical PR base: ${BASE_REF}@${CANONICAL_BASE_SHA}"
            echo "- Scope selection: ${SCOPE_KIND}"
            echo "- Phase: ${PHASE}"
            echo "- Verification tier: ${TIER}"
            echo "- Duplicate push suppressed: ${SKIP_DUPLICATE}"
          } >> "${GITHUB_STEP_SUMMARY}"

  diagnostics:
    name: Contract diagnostics
    needs: [context]
    if: >-
      ${{ needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.diagnostics_required ==
      'true' && inputs.run_assurance == true }}
    uses: ./.github/workflows/ci-node-diagnostics.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      candidate_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      frontend: ${{ needs.context.outputs.frontend }}
      contracts: ${{ needs.context.outputs.contracts }}
      contracts_changed: ${{ needs.context.outputs.contracts_changed }}
      node: ${{ needs.context.outputs.node }}
      verification_tier: ${{ needs.context.outputs.verification_tier }}

  verification:
    name: Node verification
    needs: [context]
    if: >-
      ${{ needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.verification_required
      == 'true' }}
    uses: ./.github/workflows/ci-node-verification.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      candidate_sha: ${{ needs.context.outputs.head_sha }}
      full_scope: ${{ needs.context.outputs.full_scope }}
      frontend: ${{ needs.context.outputs.frontend }}
      mobile: ${{ needs.context.outputs.mobile }}
      heavy: ${{ needs.context.outputs.heavy }}
      verification_tier: ${{ needs.context.outputs.verification_tier }}
      journey: ${{ needs.context.outputs.journey }}
      journey_scope: ${{ needs.context.outputs.journey_scope }}
      platform_change_sets: ${{ needs.context.outputs.platform_change_sets }}

  backends:
    name: Backend verification
    needs: [context]
    if: ${{ needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.backend_required == 'true' && inputs.run_assurance == true }}
    uses: ./.github/workflows/ci-backends.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      candidate_sha: ${{ needs.context.outputs.head_sha }}
      full_scope: ${{ needs.context.outputs.full_scope }}
      verification_tier: ${{ needs.context.outputs.verification_tier }}
      database_changed: ${{ needs.context.outputs.database_changed }}
      dsh: ${{ needs.context.outputs.dsh }}
      wlt: ${{ needs.context.outputs.wlt }}
      identity: ${{ needs.context.outputs.identity }}
      workforce: ${{ needs.context.outputs.workforce }}
      platform: ${{ needs.context.outputs.platform }}
      providers: ${{ needs.context.outputs.providers }}

  runtime:
    name: Runtime proof
    needs: [context]
    if: ${{ needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.runtime_required == 'true' && inputs.run_assurance == true }}
    uses: ./.github/workflows/ci-runtime.yml
    with:
      candidate_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      runtime: ${{ needs.context.outputs.runtime_required }}
      runtime_profile: ${{ needs.context.outputs.runtime_profile }}
      runtime_proof: ${{ inputs.runtime_proof == true }}

  codeql:
    name: CodeQL applicable analysis
    needs: [context]
    if: ${{ inputs.run_analyzers == true && needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.workflow == 'true' }}
    uses: ./.github/workflows/codeql.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      base_ref: ${{ needs.context.outputs.base_ref }}
      full_scope: ${{ needs.context.outputs.full_verification == 'true' }}

  sonar:
    name: SonarQube PR analysis
    needs: [context]
    if: ${{ inputs.run_analyzers == true && needs.context.outputs.skip_duplicate_push != 'true' }}
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      base_ref: ${{ needs.context.outputs.base_ref }}

  semgrep:
    name: Semgrep applicable analysis
    needs: [context]
    if: ${{ inputs.run_analyzers == true && needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.security == 'true' }}
    uses: ./.github/workflows/semgrep.yml
    with:
      mode: diff
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_sha: ${{ needs.context.outputs.base_sha }}
      base_ref: ${{ needs.context.outputs.base_ref }}
      head_ref: ${{ needs.context.outputs.head_ref }}

  security:
    name: Security applicable analysis
    needs: [context]
    if: ${{ inputs.run_analyzers == true && needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.security == 'true' }}
    uses: ./.github/workflows/security-remote.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      base_ref: ${{ needs.context.outputs.base_ref }}

  dependency:
    name: Dependency review when applicable
    needs: [context]
    if: ${{ inputs.run_analyzers == true && needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.dependency_changed == 'true' }}
    uses: ./.github/workflows/dependency-review.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_sha: ${{ needs.context.outputs.base_sha }}
      base_ref: ${{ needs.context.outputs.base_ref }}
      head_ref: ${{ needs.context.outputs.head_ref }}
      expected_sha: ${{ needs.context.outputs.head_sha }}

  lockfile:
    name: Lockfile integrity when applicable
    needs: [context]
    if: ${{ inputs.run_analyzers == true && needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.dependency_changed == 'true' }}
    uses: ./.github/workflows/lockfile-integrity.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_sha: ${{ needs.context.outputs.base_sha }}

  docker:
    name: Docker policy when applicable
    needs: [context]
    if: ${{ inputs.run_analyzers == true && needs.context.outputs.skip_duplicate_push != 'true' && needs.context.outputs.infrastructure == 'true' }}
    uses: ./.github/workflows/docker-runtime-hardening.yml
    with:
      pr_number: ${{ needs.context.outputs.pr_number }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      base_sha: ${{ needs.context.outputs.base_sha }}

  result:
    name: >-
      ${{ github.event_name == 'pull_request' && 'BThwani CI / PR result' || github.event_name == 'push' &&
      'BThwani CI / push result' || 'BThwani CI / dispatched result' }}
    needs: [context, diagnostics, verification, backends, runtime, codeql, sonar, semgrep, security, dependency, lockfile, docker]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce applicable results
        shell: bash
        env:
          CONTEXT_RESULT: ${{ needs.context.result }}
          DIAGNOSTICS_RESULT: ${{ needs.diagnostics.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          BACKENDS_RESULT: ${{ needs.backends.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          DIAGNOSTICS_REQUIRED: ${{ inputs.run_assurance == true && needs.context.outputs.diagnostics_required == 'true' }}
          VERIFICATION_REQUIRED: ${{ needs.context.outputs.verification_required == 'true' }}
          BACKEND_REQUIRED: ${{ inputs.run_assurance == true && needs.context.outputs.backend_required == 'true' }}
          RUNTIME_REQUIRED: ${{ inputs.run_assurance == true && needs.context.outputs.runtime_required == 'true' }}
          RUN_ANALYZERS: ${{ inputs.run_analyzers == true }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          WORKFLOW_REQUIRED: ${{ needs.context.outputs.workflow }}
          DEPENDENCY_RESULT: ${{ needs.dependency.result }}
          LOCKFILE_RESULT: ${{ needs.lockfile.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          INFRASTRUCTURE_REQUIRED: ${{ needs.context.outputs.infrastructure }}
          DEPENDENCY_REQUIRED: ${{ needs.context.outputs.dependency_changed }}
          LOCKFILE_REQUIRED: ${{ needs.context.outputs.dependency_changed }}
          DOCKER_REQUIRED: ${{ needs.context.outputs.infrastructure }}
          SKIP_DUPLICATE_PUSH: ${{ needs.context.outputs.skip_duplicate_push }}
        run: |
          set -euo pipefail
          [[ "${CONTEXT_RESULT}" == "success" ]] || { echo "::error::canonical context failed"; exit 1; }
          if [[ "${SKIP_DUPLICATE_PUSH}" == "true" ]]; then
            echo "development push suppressed because the canonical PR event owns verification"
            exit 0
          fi
          failures=()
          check_result() {
            local name="$1" result="$2" applicable="$3"
            [[ "${result}" == "success" ]] && return
            [[ "${result}" == "skipped" && "${applicable}" != "true" ]] && return
            failures+=("${name}:${result}")
          }
          check_result diagnostics "${DIAGNOSTICS_RESULT}" "${DIAGNOSTICS_REQUIRED}"
          check_result verification "${VERIFICATION_RESULT}" "${VERIFICATION_REQUIRED}"
          check_result backends "${BACKENDS_RESULT}" "${BACKEND_REQUIRED}"
          check_result runtime "${RUNTIME_RESULT}" "${RUNTIME_REQUIRED}"
          if [[ "${RUN_ANALYZERS}" == "true" && "${WORKFLOW_REQUIRED}" == "true" ]]; then
            check_result codeql "${CODEQL_RESULT}" "true"
            check_result sonar "${SONAR_RESULT}" "true"
            check_result semgrep "${SEMGREP_RESULT}" "true"
            check_result security "${SECURITY_RESULT}" "true"
          fi
          dependency_applicable=false
          lockfile_applicable=false
          docker_applicable=false
          [[ "${RUN_ANALYZERS}" == "true" && "${DEPENDENCY_REQUIRED}" == "true" ]] && dependency_applicable=true
          [[ "${RUN_ANALYZERS}" == "true" && "${LOCKFILE_REQUIRED}" == "true" ]] && lockfile_applicable=true
          [[ "${RUN_ANALYZERS}" == "true" && "${DOCKER_REQUIRED}" == "true" ]] && docker_applicable=true
          check_result dependency "${DEPENDENCY_RESULT}" "${dependency_applicable}"
          check_result lockfile "${LOCKFILE_RESULT}" "${lockfile_applicable}"
          check_result docker "${DOCKER_RESULT}" "${docker_applicable}"
          if (( ${#failures[@]} )); then
            echo "::error title=BThwani CI failed::$(IFS=,; echo "${failures[*]}")"
            exit 1
          fi
          echo "all applicable contextual verification passed"
