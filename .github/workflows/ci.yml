name: BThwani Contextual CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification depth
        required: true
        default: affected
        type: choice
        options: [affected, full]
      journey:
        description: Optional governed capability identifier
        required: false
        type: string
      runtime_proof:
        description: Start the scoped runtime and execute smoke proof
        required: true
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "AGENTS.md"
      - "GEMINI.md"
      - ".agents/**"
      - ".github/**"
      - "governance/**"
      - "tools/**"
      - "contracts/**"
      - "core/**"
      - "services/**"
      - "apps/**"
      - "shared/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
  push:
    branches: [master]
    paths:
      - "AGENTS.md"
      - "GEMINI.md"
      - ".agents/**"
      - ".github/**"
      - "governance/**"
      - "tools/**"
      - "contracts/**"
      - "core/**"
      - "services/**"
      - "apps/**"
      - "shared/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"

permissions:
  contents: read

concurrency:
  group: contextual-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FULL_VERIFICATION_TRIGGER: governance/github/full-verification.trigger.json
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  context:
    name: Detect affected scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      full_verification: ${{ steps.scope.outputs.full_verification }}
      governance: ${{ steps.scope.outputs.governance }}
      workflow: ${{ steps.scope.outputs.workflow }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
      security: ${{ steps.scope.outputs.security }}
      policy: ${{ steps.scope.outputs.policy }}
      frontend: ${{ steps.scope.outputs.frontend }}
      contracts: ${{ steps.scope.outputs.contracts }}
      journey: ${{ steps.scope.outputs.journey }}
      journey_scope: ${{ steps.scope.outputs.journey_scope }}
      node: ${{ steps.scope.outputs.node }}
      node_scope: ${{ steps.scope.outputs.node_scope }}
      dsh: ${{ steps.scope.outputs.dsh }}
      wlt: ${{ steps.scope.outputs.wlt }}
      identity: ${{ steps.scope.outputs.identity }}
      workforce: ${{ steps.scope.outputs.workforce }}
      platform: ${{ steps.scope.outputs.platform }}
      providers: ${{ steps.scope.outputs.providers }}
      database: ${{ steps.scope.outputs.database }}
      runtime: ${{ steps.scope.outputs.runtime }}
      shared_brain: ${{ steps.scope.outputs.shared_brain }}
      heavy: ${{ steps.scope.outputs.heavy }}
      platform_change_sets: ${{ steps.scope.outputs.platform_change_sets }}
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
      - name: Verify contextual router decisions
        run: node --test tools/scripts/detect-ci-context.test.mjs
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_JOURNEY: ${{ inputs.journey }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          HEAD_SHA="${PR_HEAD_SHA:-${GITHUB_SHA}}"
          BASE_SHA="${PR_BASE_SHA:-${EVENT_BEFORE:-}}"
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || printf '%s' "${HEAD_SHA}")"
          fi

          FULL_VERIFICATION=false
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_MODE:-affected}" == "full" ]]; then
            FULL_VERIFICATION=true
          elif git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -Fxq "${FULL_VERIFICATION_TRIGGER}"; then
            FULL_VERIFICATION=true
          fi
          echo "full_verification=${FULL_VERIFICATION}" >> "${GITHUB_OUTPUT}"

          MODE="${DISPATCH_MODE:-affected}"
          if [[ "${FULL_VERIFICATION}" == "true" ]]; then MODE="full"; fi
          CI_BASE_SHA="${BASE_SHA}" \
          CI_HEAD_SHA="${HEAD_SHA}" \
          CI_MODE="${MODE}" \
          CI_JOURNEY="${DISPATCH_JOURNEY:-}" \
          node tools/scripts/detect-ci-context.mjs
      - name: Publish routing summary
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          NODE_SCOPE: ${{ steps.scope.outputs.node_scope }}
          JOURNEY_SCOPE: ${{ steps.scope.outputs.journey_scope }}
          HEAVY_CHECKS: ${{ steps.scope.outputs.heavy }}
          FULL_VERIFICATION: ${{ steps.scope.outputs.full_verification }}
        run: |
          {
            echo "### Contextual CI routing"
            echo "- Base: ${BASE_SHA}"
            echo "- Head: ${HEAD_SHA}"
            echo "- Full verification: ${FULL_VERIFICATION}"
            echo "- Node scope: ${NODE_SCOPE}"
            echo "- Journey scope: ${JOURNEY_SCOPE:-none}"
            echo "- Heavy checks: ${HEAVY_CHECKS}"
          } >> "${GITHUB_STEP_SUMMARY}"

  policy:
    name: Policy and governance
    needs: [context]
    uses: ./.github/workflows/ci-policy.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      policy: ${{ needs.context.outputs.policy }}
      workflow: ${{ needs.context.outputs.workflow }}
      security: ${{ needs.context.outputs.security }}
      infrastructure: ${{ needs.context.outputs.infrastructure }}

  diagnostics:
    name: Static diagnostics
    needs: [context]
    uses: ./.github/workflows/ci-node-diagnostics.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      frontend: ${{ needs.context.outputs.frontend }}
      contracts: ${{ needs.context.outputs.contracts }}
      node: ${{ needs.context.outputs.node }}

  verification:
    name: Node verification
    needs: [context]
    uses: ./.github/workflows/ci-node-verification.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      frontend: ${{ needs.context.outputs.frontend }}
      heavy: ${{ needs.context.outputs.heavy }}
      journey: ${{ needs.context.outputs.journey }}
      journey_scope: ${{ needs.context.outputs.journey_scope }}
      platform_change_sets: ${{ needs.context.outputs.platform_change_sets }}

  backends:
    name: Backend verification
    needs: [context]
    uses: ./.github/workflows/ci-backends.yml
    with:
      dsh: ${{ needs.context.outputs.dsh }}
      wlt: ${{ needs.context.outputs.wlt }}
      identity: ${{ needs.context.outputs.identity }}
      workforce: ${{ needs.context.outputs.workforce }}
      platform: ${{ needs.context.outputs.platform }}
      providers: ${{ needs.context.outputs.providers }}

  runtime:
    name: Runtime proof
    needs: [context]
    uses: ./.github/workflows/ci-runtime.yml
    with:
      full_verification: ${{ needs.context.outputs.full_verification }}
      runtime: ${{ needs.context.outputs.runtime }}
      runtime_proof: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true }}

  result:
    name: BThwani CI result
    needs: [context, policy, diagnostics, verification, backends, runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce fail-closed aggregate result
        shell: bash
        env:
          CONTEXT_RESULT: ${{ needs.context.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          DIAGNOSTICS_RESULT: ${{ needs.diagnostics.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          BACKENDS_RESULT: ${{ needs.backends.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          set -euo pipefail
          failed=0
          failures=()

          check_result() {
            local name="$1"
            local result="$2"
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              failures+=("${name}:${result}")
              failed=1
            fi
          }

          check_result context "${CONTEXT_RESULT}"
          check_result policy "${POLICY_RESULT}"
          check_result diagnostics "${DIAGNOSTICS_RESULT}"
          check_result verification "${VERIFICATION_RESULT}"
          check_result backends "${BACKENDS_RESULT}"
          check_result runtime "${RUNTIME_RESULT}"

          if [[ "${failed}" -ne 0 ]]; then
            message="failed bundles: $(IFS=,; echo "${failures[*]}")"
            echo "::error title=BThwani CI failed::${message}"
            printf '%s\n' "${message}"
            exit 1
          fi

          printf '%s\n' "all required bundles passed or were intentionally skipped"
