name: BThwani Contextual CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification depth
        required: true
        default: affected
        type: choice
        options: [affected, full]
      journey:
        description: Optional journey such as JRN-040
        required: false
        type: string
      runtime_proof:
        description: Start the full runtime and execute smoke proof
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [master, lianbassam]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "AGENTS.md"
      - "GEMINI.md"
      - ".agents/**"
      - ".github/**"
      - "governance/**"
      - "tools/**"
      - "contracts/**"
      - "core/**"
      - "services/**"
      - "apps/**"
      - "shared/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
  push:
    branches: [master, lianbassam]
    paths:
      - "AGENTS.md"
      - "GEMINI.md"
      - ".agents/**"
      - ".github/**"
      - "governance/**"
      - "tools/**"
      - "contracts/**"
      - "core/**"
      - "services/**"
      - "apps/**"
      - "shared/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"

permissions:
  contents: read
  statuses: write

concurrency:
  group: contextual-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FULL_VERIFICATION_TRIGGER: governance/github/lianbassam-full-verification.trigger.json
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  context:
    name: Detect affected scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      full_verification: ${{ steps.scope.outputs.full_verification }}
      governance: ${{ steps.scope.outputs.governance }}
      workflow: ${{ steps.scope.outputs.workflow }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
      security: ${{ steps.scope.outputs.security }}
      policy: ${{ steps.scope.outputs.policy }}
      frontend: ${{ steps.scope.outputs.frontend }}
      contracts: ${{ steps.scope.outputs.contracts }}
      journey: ${{ steps.scope.outputs.journey }}
      journey_scope: ${{ steps.scope.outputs.journey_scope }}
      node: ${{ steps.scope.outputs.node }}
      node_scope: ${{ steps.scope.outputs.node_scope }}
      dsh: ${{ steps.scope.outputs.dsh }}
      wlt: ${{ steps.scope.outputs.wlt }}
      identity: ${{ steps.scope.outputs.identity }}
      workforce: ${{ steps.scope.outputs.workforce }}
      platform: ${{ steps.scope.outputs.platform }}
      providers: ${{ steps.scope.outputs.providers }}
      database: ${{ steps.scope.outputs.database }}
      runtime: ${{ steps.scope.outputs.runtime }}
      shared_brain: ${{ steps.scope.outputs.shared_brain }}
      heavy: ${{ steps.scope.outputs.heavy }}
      platform_change_sets: ${{ steps.scope.outputs.platform_change_sets }}
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
      - name: Publish contextual CI run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --arg state pending \
            --arg context bthwani/contextual-ci \
            --arg description "contextual CI routing and verification are running" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/contextual-ci-status.json
          curl --fail-with-body --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/contextual-ci-status.json
      - name: Verify contextual router decisions
        run: node --test tools/scripts/detect-ci-context.test.mjs
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_JOURNEY: ${{ inputs.journey }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          HEAD_SHA="${PR_HEAD_SHA:-${GITHUB_SHA}}"
          BASE_SHA="${PR_BASE_SHA:-${EVENT_BEFORE:-}}"
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || printf '%s' "${HEAD_SHA}")"
          fi

          FULL_VERIFICATION=false
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_MODE:-affected}" == "full" ]]; then
            FULL_VERIFICATION=true
          elif git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -Fxq "${FULL_VERIFICATION_TRIGGER}"; then
            FULL_VERIFICATION=true
          fi
          echo "full_verification=${FULL_VERIFICATION}" >> "${GITHUB_OUTPUT}"

          MODE="${DISPATCH_MODE:-affected}"
          if [[ "${FULL_VERIFICATION}" == "true" ]]; then MODE="full"; fi
          CI_BASE_SHA="${BASE_SHA}" \
          CI_HEAD_SHA="${HEAD_SHA}" \
          CI_MODE="${MODE}" \
          CI_JOURNEY="${DISPATCH_JOURNEY:-}" \
          node tools/scripts/detect-ci-context.mjs
      - name: Publish routing summary
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          NODE_SCOPE: ${{ steps.scope.outputs.node_scope }}
          JOURNEY_SCOPE: ${{ steps.scope.outputs.journey_scope }}
          HEAVY_CHECKS: ${{ steps.scope.outputs.heavy }}
          FULL_VERIFICATION: ${{ steps.scope.outputs.full_verification }}
        run: |
          {
            echo "### Contextual CI routing"
            echo "- Base: ${BASE_SHA}"
            echo "- Head: ${HEAD_SHA}"
            echo "- Full verification: ${FULL_VERIFICATION}"
            echo "- Node scope: ${NODE_SCOPE}"
            echo "- Journey scope: ${JOURNEY_SCOPE:-none}"
            echo "- Heavy checks: ${HEAVY_CHECKS}"
          } >> "${GITHUB_STEP_SUMMARY}"

  policy_bundle:
    needs: [context]
    uses: ./.github/workflows/reusable/policy.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      governance: ${{ needs.context.outputs.governance }}
      workflow: ${{ needs.context.outputs.workflow }}
      infrastructure: ${{ needs.context.outputs.infrastructure }}
      security: ${{ needs.context.outputs.security }}
      policy: ${{ needs.context.outputs.policy }}
      frontend: ${{ needs.context.outputs.frontend }}
      contracts: ${{ needs.context.outputs.contracts }}
      journey: ${{ needs.context.outputs.journey }}
      journey_scope: ${{ needs.context.outputs.journey_scope }}
      node: ${{ needs.context.outputs.node }}
      node_scope: ${{ needs.context.outputs.node_scope }}
      dsh: ${{ needs.context.outputs.dsh }}
      wlt: ${{ needs.context.outputs.wlt }}
      identity: ${{ needs.context.outputs.identity }}
      workforce: ${{ needs.context.outputs.workforce }}
      platform: ${{ needs.context.outputs.platform }}
      providers: ${{ needs.context.outputs.providers }}
      database: ${{ needs.context.outputs.database }}
      runtime: ${{ needs.context.outputs.runtime }}
      shared_brain: ${{ needs.context.outputs.shared_brain }}
      heavy: ${{ needs.context.outputs.heavy }}
      platform_change_sets: ${{ needs.context.outputs.platform_change_sets }}
      runtime_proof: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true }}

  node_diagnostics_bundle:
    needs: [context]
    uses: ./.github/workflows/reusable/node-diagnostics.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      governance: ${{ needs.context.outputs.governance }}
      workflow: ${{ needs.context.outputs.workflow }}
      infrastructure: ${{ needs.context.outputs.infrastructure }}
      security: ${{ needs.context.outputs.security }}
      policy: ${{ needs.context.outputs.policy }}
      frontend: ${{ needs.context.outputs.frontend }}
      contracts: ${{ needs.context.outputs.contracts }}
      journey: ${{ needs.context.outputs.journey }}
      journey_scope: ${{ needs.context.outputs.journey_scope }}
      node: ${{ needs.context.outputs.node }}
      node_scope: ${{ needs.context.outputs.node_scope }}
      dsh: ${{ needs.context.outputs.dsh }}
      wlt: ${{ needs.context.outputs.wlt }}
      identity: ${{ needs.context.outputs.identity }}
      workforce: ${{ needs.context.outputs.workforce }}
      platform: ${{ needs.context.outputs.platform }}
      providers: ${{ needs.context.outputs.providers }}
      database: ${{ needs.context.outputs.database }}
      runtime: ${{ needs.context.outputs.runtime }}
      shared_brain: ${{ needs.context.outputs.shared_brain }}
      heavy: ${{ needs.context.outputs.heavy }}
      platform_change_sets: ${{ needs.context.outputs.platform_change_sets }}
      runtime_proof: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true }}

  node_verification_bundle:
    needs: [context]
    uses: ./.github/workflows/reusable/node-verification.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      governance: ${{ needs.context.outputs.governance }}
      workflow: ${{ needs.context.outputs.workflow }}
      infrastructure: ${{ needs.context.outputs.infrastructure }}
      security: ${{ needs.context.outputs.security }}
      policy: ${{ needs.context.outputs.policy }}
      frontend: ${{ needs.context.outputs.frontend }}
      contracts: ${{ needs.context.outputs.contracts }}
      journey: ${{ needs.context.outputs.journey }}
      journey_scope: ${{ needs.context.outputs.journey_scope }}
      node: ${{ needs.context.outputs.node }}
      node_scope: ${{ needs.context.outputs.node_scope }}
      dsh: ${{ needs.context.outputs.dsh }}
      wlt: ${{ needs.context.outputs.wlt }}
      identity: ${{ needs.context.outputs.identity }}
      workforce: ${{ needs.context.outputs.workforce }}
      platform: ${{ needs.context.outputs.platform }}
      providers: ${{ needs.context.outputs.providers }}
      database: ${{ needs.context.outputs.database }}
      runtime: ${{ needs.context.outputs.runtime }}
      shared_brain: ${{ needs.context.outputs.shared_brain }}
      heavy: ${{ needs.context.outputs.heavy }}
      platform_change_sets: ${{ needs.context.outputs.platform_change_sets }}
      runtime_proof: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true }}

  backends_bundle:
    needs: [context]
    uses: ./.github/workflows/reusable/backends.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      governance: ${{ needs.context.outputs.governance }}
      workflow: ${{ needs.context.outputs.workflow }}
      infrastructure: ${{ needs.context.outputs.infrastructure }}
      security: ${{ needs.context.outputs.security }}
      policy: ${{ needs.context.outputs.policy }}
      frontend: ${{ needs.context.outputs.frontend }}
      contracts: ${{ needs.context.outputs.contracts }}
      journey: ${{ needs.context.outputs.journey }}
      journey_scope: ${{ needs.context.outputs.journey_scope }}
      node: ${{ needs.context.outputs.node }}
      node_scope: ${{ needs.context.outputs.node_scope }}
      dsh: ${{ needs.context.outputs.dsh }}
      wlt: ${{ needs.context.outputs.wlt }}
      identity: ${{ needs.context.outputs.identity }}
      workforce: ${{ needs.context.outputs.workforce }}
      platform: ${{ needs.context.outputs.platform }}
      providers: ${{ needs.context.outputs.providers }}
      database: ${{ needs.context.outputs.database }}
      runtime: ${{ needs.context.outputs.runtime }}
      shared_brain: ${{ needs.context.outputs.shared_brain }}
      heavy: ${{ needs.context.outputs.heavy }}
      platform_change_sets: ${{ needs.context.outputs.platform_change_sets }}
      runtime_proof: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true }}

  runtime_bundle:
    needs: [context]
    uses: ./.github/workflows/reusable/runtime.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      governance: ${{ needs.context.outputs.governance }}
      workflow: ${{ needs.context.outputs.workflow }}
      infrastructure: ${{ needs.context.outputs.infrastructure }}
      security: ${{ needs.context.outputs.security }}
      policy: ${{ needs.context.outputs.policy }}
      frontend: ${{ needs.context.outputs.frontend }}
      contracts: ${{ needs.context.outputs.contracts }}
      journey: ${{ needs.context.outputs.journey }}
      journey_scope: ${{ needs.context.outputs.journey_scope }}
      node: ${{ needs.context.outputs.node }}
      node_scope: ${{ needs.context.outputs.node_scope }}
      dsh: ${{ needs.context.outputs.dsh }}
      wlt: ${{ needs.context.outputs.wlt }}
      identity: ${{ needs.context.outputs.identity }}
      workforce: ${{ needs.context.outputs.workforce }}
      platform: ${{ needs.context.outputs.platform }}
      providers: ${{ needs.context.outputs.providers }}
      database: ${{ needs.context.outputs.database }}
      runtime: ${{ needs.context.outputs.runtime }}
      shared_brain: ${{ needs.context.outputs.shared_brain }}
      heavy: ${{ needs.context.outputs.heavy }}
      platform_change_sets: ${{ needs.context.outputs.platform_change_sets }}
      runtime_proof: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true }}

  result:
    name: BThwani CI result
    needs: [context, policy_bundle, node_diagnostics_bundle, node_verification_bundle, backends_bundle, runtime_bundle]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce result and publish immutable commit status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          FULL_VERIFICATION: ${{ needs.context.outputs.full_verification }}
          PUBLISH_STATUS: ${{ github.event_name != 'pull_request' }}
          CONTEXT_RESULT: ${{ needs.context.result }}
          POLICY_RESULT: ${{ needs.policy_bundle.result }}
          DIAGNOSTICS_RESULT: ${{ needs.node_diagnostics_bundle.result }}
          VERIFICATION_RESULT: ${{ needs.node_verification_bundle.result }}
          BACKENDS_RESULT: ${{ needs.backends_bundle.result }}
          RUNTIME_RESULT: ${{ needs.runtime_bundle.result }}
        run: |
          set -euo pipefail
          
          # Run the absolute compliance guardian
          node tools/guards/workflow-compliance-gate.mjs
          
          # If it exits successfully, we publish the green status
          state=success
          description="all required scopes passed"
          
          # In case of failure, node script will process.exit(1) which halts the pipeline here.

          context="bthwani/contextual-verification"
          if [[ "${FULL_VERIFICATION}" == "true" ]]; then context="bthwani/full-verification"; fi

          if [[ "${PUBLISH_STATUS}" == "true" ]]; then
            jq -n \
              --arg state "${state}" \
              --arg context "${context}" \
              --arg description "${description}" \
              --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
            curl --fail-with-body --retry 3 \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              --data-binary @/tmp/status.json
          fi
          printf '%s\n' "${description}"
