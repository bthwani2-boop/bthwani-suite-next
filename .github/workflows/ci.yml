name: BThwani Contextual CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification depth
        required: true
        default: affected
        type: choice
        options: [affected, full]
      journey:
        description: Optional governed capability identifier
        required: false
        type: string
      runtime_proof:
        description: Start the scoped runtime and execute smoke proof
        required: true
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "AGENTS.md"
      - "GEMINI.md"
      - ".agents/**"
      - ".github/**"
      - "governance/**"
      - "tools/**"
      - "contracts/**"
      - "core/**"
      - "services/**"
      - "apps/**"
      - "shared/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
  push:
    branches: [master, smar, "work/**"]
    paths:
      - "AGENTS.md"
      - "GEMINI.md"
      - ".agents/**"
      - ".github/**"
      - "governance/**"
      - "tools/**"
      - "contracts/**"
      - "core/**"
      - "services/**"
      - "apps/**"
      - "shared/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"

permissions:
  contents: read

concurrency:
  group: contextual-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FULL_VERIFICATION_TRIGGER: governance/github/full-verification.trigger.json
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  context:
    name: Detect affected scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      full_verification: ${{ steps.scope.outputs.full_verification }}
      governance: ${{ steps.scope.outputs.governance }}
      workflow: ${{ steps.scope.outputs.workflow }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
      security: ${{ steps.scope.outputs.security }}
      policy: ${{ steps.scope.outputs.policy }}
      frontend: ${{ steps.scope.outputs.frontend }}
      contracts: ${{ steps.scope.outputs.contracts }}
      journey: ${{ steps.scope.outputs.journey }}
      journey_scope: ${{ steps.scope.outputs.journey_scope }}
      node: ${{ steps.scope.outputs.node }}
      node_scope: ${{ steps.scope.outputs.node_scope }}
      dsh: ${{ steps.scope.outputs.dsh }}
      wlt: ${{ steps.scope.outputs.wlt }}
      identity: ${{ steps.scope.outputs.identity }}
      workforce: ${{ steps.scope.outputs.workforce }}
      platform: ${{ steps.scope.outputs.platform }}
      providers: ${{ steps.scope.outputs.providers }}
      database: ${{ steps.scope.outputs.database }}
      runtime: ${{ steps.scope.outputs.runtime }}
      shared_brain: ${{ steps.scope.outputs.shared_brain }}
      heavy: ${{ steps.scope.outputs.heavy }}
      verification_tier: ${{ steps.scope.outputs.verification_tier }}
      diagnostics: ${{ steps.scope.outputs.diagnostics }}
      platform_change_sets: ${{ steps.scope.outputs.platform_change_sets }}
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
      - name: Verify contextual router decisions
        run: node --test tools/scripts/detect-ci-context.test.mjs
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_JOURNEY: ${{ inputs.journey }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          HEAD_SHA="${PR_HEAD_SHA:-${GITHUB_SHA}}"
          BASE_SHA="${PR_BASE_SHA:-${EVENT_BEFORE:-}}"
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || printf '%s' "${HEAD_SHA}")"
          fi

          FULL_VERIFICATION=false
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_MODE:-affected}" == "full" ]]; then
            FULL_VERIFICATION=true
          elif git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -Fxq "${FULL_VERIFICATION_TRIGGER}"; then
            FULL_VERIFICATION=true
          fi
          echo "full_verification=${FULL_VERIFICATION}" >> "${GITHUB_OUTPUT}"

          MODE="${DISPATCH_MODE:-affected}"
          if [[ "${FULL_VERIFICATION}" == "true" ]]; then MODE="full"; fi
          CI_BASE_SHA="${BASE_SHA}" \
          CI_HEAD_SHA="${HEAD_SHA}" \
          CI_MODE="${MODE}" \
          CI_JOURNEY="${DISPATCH_JOURNEY:-}" \
          node tools/scripts/detect-ci-context.mjs
      - name: Publish routing summary
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          NODE_SCOPE: ${{ steps.scope.outputs.node_scope }}
          JOURNEY_SCOPE: ${{ steps.scope.outputs.journey_scope }}
          VERIFICATION_TIER: ${{ steps.scope.outputs.verification_tier }}
          DIAGNOSTICS_REQUIRED: ${{ steps.scope.outputs.diagnostics }}
          HEAVY_CHECKS: ${{ steps.scope.outputs.heavy }}
          FULL_VERIFICATION: ${{ steps.scope.outputs.full_verification }}
        run: |
          {
            echo "### Contextual CI routing"
            echo "- Base: ${BASE_SHA}"
            echo "- Head: ${HEAD_SHA}"
            echo "- Full verification: ${FULL_VERIFICATION}"
            echo "- Verification tier: ${VERIFICATION_TIER}"
            echo "- Node scope: ${NODE_SCOPE}"
            echo "- Journey scope: ${JOURNEY_SCOPE:-none}"
            echo "- Static diagnostics: ${DIAGNOSTICS_REQUIRED}"
            echo "- Heavy checks: ${HEAVY_CHECKS}"
          } >> "${GITHUB_STEP_SUMMARY}"

  policy:
    name: Policy and governance
    needs: [context]
    if: ${{ needs.context.outputs.policy == 'true' }}
    uses: ./.github/workflows/ci-policy.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      policy: ${{ needs.context.outputs.policy }}
      workflow: ${{ needs.context.outputs.workflow }}
      security: ${{ needs.context.outputs.security }}
      infrastructure: ${{ needs.context.outputs.infrastructure }}

  diagnostics:
    name: Static diagnostics
    needs: [context]
    if: ${{ needs.context.outputs.diagnostics == 'true' }}
    uses: ./.github/workflows/ci-node-diagnostics.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      frontend: ${{ needs.context.outputs.frontend }}
      contracts: ${{ needs.context.outputs.contracts }}
      node: ${{ needs.context.outputs.node }}

  verification:
    name: Node verification
    needs: [context]
    if: ${{ needs.context.outputs.full_verification == 'true' || needs.context.outputs.frontend == 'true' || needs.context.outputs.node == 'true' || needs.context.outputs.journey == 'true' || needs.context.outputs.platform_change_sets == 'true' }}
    uses: ./.github/workflows/ci-node-verification.yml
    with:
      base_sha: ${{ needs.context.outputs.base_sha }}
      head_sha: ${{ needs.context.outputs.head_sha }}
      full_verification: ${{ needs.context.outputs.full_verification }}
      frontend: ${{ needs.context.outputs.frontend }}
      heavy: ${{ needs.context.outputs.heavy }}
      verification_tier: ${{ needs.context.outputs.verification_tier }}
      journey: ${{ needs.context.outputs.journey }}
      journey_scope: ${{ needs.context.outputs.journey_scope }}
      platform_change_sets: ${{ needs.context.outputs.platform_change_sets }}

  backends:
    name: Backend verification
    needs: [context]
    if: ${{ needs.context.outputs.full_verification == 'true' || needs.context.outputs.dsh == 'true' || needs.context.outputs.wlt == 'true' || needs.context.outputs.identity == 'true' || needs.context.outputs.workforce == 'true' || needs.context.outputs.platform == 'true' || needs.context.outputs.providers == 'true' }}
    uses: ./.github/workflows/ci-backends.yml
    with:
      dsh: ${{ needs.context.outputs.dsh }}
      wlt: ${{ needs.context.outputs.wlt }}
      identity: ${{ needs.context.outputs.identity }}
      workforce: ${{ needs.context.outputs.workforce }}
      platform: ${{ needs.context.outputs.platform }}
      providers: ${{ needs.context.outputs.providers }}

  runtime:
    name: Runtime proof
    needs: [context]
    if: ${{ needs.context.outputs.full_verification == 'true' || needs.context.outputs.runtime == 'true' || (github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true) }}
    uses: ./.github/workflows/ci-runtime.yml
    with:
      full_verification: ${{ needs.context.outputs.full_verification }}
      runtime: ${{ needs.context.outputs.runtime }}
      runtime_proof: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true }}

  result:
    name: BThwani CI result
    needs: [context, policy, diagnostics, verification, backends, runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce fail-closed aggregate result
        shell: bash
        env:
          CONTEXT_RESULT: ${{ needs.context.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          DIAGNOSTICS_RESULT: ${{ needs.diagnostics.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          BACKENDS_RESULT: ${{ needs.backends.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          FULL_VERIFICATION: ${{ needs.context.outputs.full_verification }}
          POLICY_REQUIRED: ${{ needs.context.outputs.policy }}
          DIAGNOSTICS_REQUIRED: ${{ needs.context.outputs.diagnostics }}
          FRONTEND_REQUIRED: ${{ needs.context.outputs.frontend }}
          CONTRACTS_REQUIRED: ${{ needs.context.outputs.contracts }}
          NODE_REQUIRED: ${{ needs.context.outputs.node }}
          JOURNEY_REQUIRED: ${{ needs.context.outputs.journey }}
          PLATFORM_CHANGE_SETS_REQUIRED: ${{ needs.context.outputs.platform_change_sets }}
          DSH_REQUIRED: ${{ needs.context.outputs.dsh }}
          WLT_REQUIRED: ${{ needs.context.outputs.wlt }}
          IDENTITY_REQUIRED: ${{ needs.context.outputs.identity }}
          WORKFORCE_REQUIRED: ${{ needs.context.outputs.workforce }}
          PLATFORM_REQUIRED: ${{ needs.context.outputs.platform }}
          PROVIDERS_REQUIRED: ${{ needs.context.outputs.providers }}
          RUNTIME_REQUIRED: ${{ needs.context.outputs.runtime }}
          EXPLICIT_RUNTIME_PROOF: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_proof == true }}
        run: |
          set -euo pipefail
          failed=0
          failures=()

          is_true() {
            [[ "${1:-false}" == "true" ]]
          }

          check_result() {
            local name="$1"
            local result="$2"
            local allow_skipped="$3"
            if [[ "${result}" == "success" ]]; then
              return 0
            fi
            if [[ "${result}" == "skipped" && "${allow_skipped}" == "true" ]]; then
              return 0
            fi
            failures+=("${name}:${result}")
            failed=1
          }

          policy_applicable=false
          diagnostics_applicable=false
          verification_applicable=false
          backends_applicable=false
          runtime_applicable=false

          if is_true "${POLICY_REQUIRED}"; then
            policy_applicable=true
          fi
          if is_true "${DIAGNOSTICS_REQUIRED}"; then
            diagnostics_applicable=true
          fi
          if is_true "${FULL_VERIFICATION}" || is_true "${FRONTEND_REQUIRED}" || is_true "${NODE_REQUIRED}" || is_true "${JOURNEY_REQUIRED}" || is_true "${PLATFORM_CHANGE_SETS_REQUIRED}"; then
            verification_applicable=true
          fi
          if is_true "${FULL_VERIFICATION}" || is_true "${DSH_REQUIRED}" || is_true "${WLT_REQUIRED}" || is_true "${IDENTITY_REQUIRED}" || is_true "${WORKFORCE_REQUIRED}" || is_true "${PLATFORM_REQUIRED}" || is_true "${PROVIDERS_REQUIRED}"; then
            backends_applicable=true
          fi
          if is_true "${FULL_VERIFICATION}" || is_true "${RUNTIME_REQUIRED}" || is_true "${EXPLICIT_RUNTIME_PROOF}"; then
            runtime_applicable=true
          fi

          check_result context "${CONTEXT_RESULT}" false
          check_result policy "${POLICY_RESULT}" "$([[ "${policy_applicable}" == "false" ]] && echo true || echo false)"
          check_result diagnostics "${DIAGNOSTICS_RESULT}" "$([[ "${diagnostics_applicable}" == "false" ]] && echo true || echo false)"
          check_result verification "${VERIFICATION_RESULT}" "$([[ "${verification_applicable}" == "false" ]] && echo true || echo false)"
          check_result backends "${BACKENDS_RESULT}" "$([[ "${backends_applicable}" == "false" ]] && echo true || echo false)"
          check_result runtime "${RUNTIME_RESULT}" "$([[ "${runtime_applicable}" == "false" ]] && echo true || echo false)"

          if [[ "${failed}" -ne 0 ]]; then
            message="failed or unjustifiably skipped bundles: $(IFS=,; echo "${failures[*]}")"
            echo "::error title=BThwani CI failed::${message}"
            printf '%s\n' "${message}"
            exit 1
          fi

          printf '%s\n' "all required bundles passed; skipped bundles were proven non-applicable by the router"
