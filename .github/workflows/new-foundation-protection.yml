name: New Branch Foundation Protection

on:
  push:
    branches:
      - new
  pull_request:
    branches:
      - new

permissions:
  contents: read

concurrency:
  group: new-foundation-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-protection:
    name: Verify preserved engineering foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup locked Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0

      - name: Verify foundation policy
        run: node tools/guards/foundation-protection-gate.mjs
