name: BThwani Lockfile Snapshot

on:
  push:
    branches: [reemsam]
    paths:
      - "package.json"
      - "apps/**/package.json"
      - "core/**/package.json"
      - "services/**/package.json"
      - "shared/**/package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/lockfile-snapshot.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: lockfile-snapshot-reemsam
  cancel-in-progress: true

jobs:
  generate:
    name: Generate frozen lockfile candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Setup PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          cache: pnpm
      - name: Generate lockfile from workspace manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts --reporter=append-only
      - name: Verify regenerated lockfile is frozen-install compatible
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts --offline --reporter=append-only
      - name: Upload lockfile candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lockfile-candidate-${{ github.run_id }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 2
      - name: Publish snapshot run identifier
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/157/comments" \
            --method POST \
            -f body="LOCKFILE_SNAPSHOT_RUN=${SNAPSHOT_RUN_ID}"
