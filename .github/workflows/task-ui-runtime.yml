name: BThwani Task UI and Runtime Verification

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Task/gap id this run verifies, e.g. GAP-0001.
        type: string
        required: true
      runtime_proof:
        description: Also run the Docker runtime smoke profile.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: remediation-ui-runtime-${{ inputs.task_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: UI and runtime proof (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Run UI static verification profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .diagnostics/remediation/evidence/${{ inputs.task_id }}
          pnpm run affected:typecheck
          pnpm run affected:lint
          pnpm run affected:test

      - name: Run scoped runtime proof
        if: ${{ inputs.runtime_proof == true }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm run runtime:full:up
          pnpm run runtime:full:bootstrap-dev
          pnpm run runtime:full:smoke
          pnpm run runtime:full:down

      - name: Reject any tracked source mutation
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- . ':(exclude).diagnostics'; then
            echo "Task verification workflows are read-only." >&2
            git status --short -- . ':(exclude).diagnostics' >&2
            exit 1
          fi

      - name: Export UI and runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-ui-runtime-${{ inputs.task_id }}-${{ github.run_id }}
          path: .diagnostics/remediation/evidence/${{ inputs.task_id }}
          if-no-files-found: warn
          retention-days: 14
