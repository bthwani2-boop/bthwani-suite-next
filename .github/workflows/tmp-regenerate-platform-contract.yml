name: Temporary Platform Contract Regeneration

on:
  pull_request:
    paths:
      - .github/workflows/tmp-regenerate-platform-contract.yml
      - core/platform-control/contracts/**
      - tools/scripts/compose-openapi-context.mjs
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Regenerate platform-control contract and client
        run: pnpm run openapi:generate:platform-control

      - name: Upload regenerated platform-control outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-control-generated-${{ github.sha }}
          path: |
            core/platform-control/contracts/generated/platform-control.bundle.openapi.yaml
            core/platform-control/clients/generated/platform-control-api.ts
          if-no-files-found: error
          retention-days: 1
