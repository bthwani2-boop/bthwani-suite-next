name: BThwani PR Closure Evidence

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      closure_approver:
        required: true
        type: string
      default_sha:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions: {}

concurrency:
  group: bthwani-pr-closure-evidence-${{ inputs.pr_number }}-${{ inputs.head_sha }}-${{ inputs.base_sha }}
  cancel-in-progress: false

jobs:
  evidence:
    name: BThwani / PR Closure Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      security-events: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_REF: ${{ inputs.head_ref }}
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_REF: ${{ inputs.base_ref }}
      BASE_SHA: ${{ inputs.base_sha }}
      CLOSURE_APPROVER: ${{ inputs.closure_approver }}
      DEFAULT_SHA: ${{ inputs.default_sha }}
    steps:
      - name: Revalidate structurally trusted label approval and immutable identity
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::invalid closure PR number"; exit 1; }
          [[ "${HEAD_SHA}" =~ ^[0-9a-fA-F]{40}$ && "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ && "${DEFAULT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::closure SHAs must be full immutable commit identifiers"
            exit 1
          }
          [[ "${GITHUB_ACTOR,,}" == "${CLOSURE_APPROVER,,}" ]] || { echo "::error::reusable closure caller actor drift"; exit 1; }
          [[ "${GITHUB_SHA}" == "${DEFAULT_SHA}" ]] || { echo "::error::reusable closure definition is not the approved default SHA"; exit 1; }

          pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || { echo "::error::PR is not open"; exit 1; }
          [[ "$(jq -r '.head.repo.full_name' <<<"${pr}")" == "${GITHUB_REPOSITORY}" ]] || { echo "::error::closure candidate must be in the canonical repository"; exit 1; }
          [[ "$(jq -r '.head.sha' <<<"${pr}")" == "${HEAD_SHA}" ]] || { echo "::error::PR head drift"; exit 1; }
          [[ "$(jq -r '.base.sha' <<<"${pr}")" == "${BASE_SHA}" ]] || { echo "::error::PR base drift"; exit 1; }
          [[ "$(jq -r '.head.ref' <<<"${pr}")" == "${HEAD_REF}" ]] || { echo "::error::PR head ref drift"; exit 1; }
          [[ "$(jq -r '.base.ref' <<<"${pr}")" == "${BASE_REF}" && "${BASE_REF}" == "${DEFAULT_BRANCH}" ]] || { echo "::error::closure base is not the repository default branch"; exit 1; }
          jq -e '(.body // "") | contains("<!-- bthwani:closure-request -->")' <<<"${pr}" >/dev/null || { echo "::error::closure request marker is absent"; exit 1; }
          jq -e '[.labels[]?.name | select(. == "bthwani:closure-request")] | length == 1' <<<"${pr}" >/dev/null || { echo "::error::closure approval label is absent"; exit 1; }

          encoded_default="$(jq -rn --arg value "${DEFAULT_BRANCH}" '$value|@uri')"
          live_default="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/branches/${encoded_default}" --jq '.commit.sha')"
          [[ "${live_default}" == "${DEFAULT_SHA}" ]] || {
            echo "::error::trusted default definition moved after human approval; rerun is required"
            exit 1
          }

          {
            echo "pr_number=${PR_NUMBER}"
            echo "head_sha=${HEAD_SHA,,}"
            echo "base_sha=${BASE_SHA,,}"
            echo "head_ref=${HEAD_REF}"
            echo "base_ref=${BASE_REF}"
            echo "default_sha=${DEFAULT_SHA,,}"
            echo "pr_author=$(jq -r '.user.login' <<<"${pr}")"
            echo "head_owner=$(jq -r '.head.repo.owner.login' <<<"${pr}")"
            echo "closure_approver=${CLOSURE_APPROVER}"
          } >> "${GITHUB_OUTPUT}"

      - name: Dispatch and wait for exact unprivileged full CI
        id: internal
        if: ${{ steps.scope.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          PR_NUMBER: ${{ steps.scope.outputs.pr_number }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          DEFAULT_SHA: ${{ steps.scope.outputs.default_sha }}
        run: |
          set -euo pipefail
          encoded_default="$(jq -rn --arg value "${DEFAULT_BRANCH}" '$value|@uri')"
          before="${RUNNER_TEMP}/before-ci.txt"
          gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${encoded_default}&event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id' > "${before}"
          payload="$(jq -n --arg ref "${DEFAULT_BRANCH}" --arg pr "${PR_NUMBER}" --arg head "${HEAD_SHA}" --arg base "${BASE_SHA}" '{ref:$ref,inputs:{mode:"full",journey:"",runtime_proof:true,target_kind:"pull_request",pr_number:$pr,expected_head_sha:$head,expected_base_sha:$base}}')"
          printf '%s' "${payload}" | gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" --input - >/dev/null
          expected_title="closure-pr-${PR_NUMBER}-head-${HEAD_SHA}-base-${BASE_SHA}"
          run_id=""
          for _ in $(seq 1 60); do
            while IFS= read -r candidate; do
              [[ -n "${candidate}" ]] || continue
              grep -qx "${candidate}" "${before}" && continue
              run="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}")"
              if [[ "$(jq -r '.head_sha' <<<"${run}")" == "${DEFAULT_SHA}" && "$(jq -r '.display_title' <<<"${run}")" == "${expected_title}" ]]; then
                run_id="${candidate}"
                break
              fi
            done < <(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${encoded_default}&event=workflow_dispatch&per_page=20" --jq '.workflow_runs[].id')
            [[ -n "${run_id}" ]] && break
            sleep 3
          done
          [[ "${run_id}" =~ ^[0-9]+$ ]] || { echo "::error::unable to correlate trusted full CI dispatch"; exit 1; }
          conclusion=""
          for _ in $(seq 1 720); do
            run="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            [[ "$(jq -r '.head_sha' <<<"${run}")" == "${DEFAULT_SHA}" && "$(jq -r '.display_title' <<<"${run}")" == "${expected_title}" ]] || { echo "::error::full CI identity drift"; exit 1; }
            if [[ "$(jq -r '.status' <<<"${run}")" == "completed" ]]; then conclusion="$(jq -r '.conclusion // "unknown"' <<<"${run}")"; break; fi
            sleep 10
          done
          [[ "${conclusion}" == "success" ]] || { echo "::error::full exact-candidate CI result=${conclusion:-timeout}"; exit 1; }
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch exact analyzers from trusted default definitions
        id: dispatch
        if: ${{ steps.scope.outcome == 'success' && steps.internal.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          PR_NUMBER: ${{ steps.scope.outputs.pr_number }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          HEAD_REF: ${{ steps.scope.outputs.head_ref }}
          DEFAULT_SHA: ${{ steps.scope.outputs.default_sha }}
        run: |
          set -euo pipefail
          state="${RUNNER_TEMP}/closure-runs.tsv"
          : > "${state}"

          dispatch_one() {
            local workflow="$1" expected_title="$2" inputs_json="$3"
            local encoded_default before payload run_id run
            encoded_default="$(jq -rn --arg value "${DEFAULT_BRANCH}" '$value|@uri')"
            live_default="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/branches/${encoded_default}" --jq '.commit.sha')"
            [[ "${live_default}" == "${DEFAULT_SHA}" ]] || { echo "::error::default branch moved before ${workflow} dispatch"; return 1; }
            before="${RUNNER_TEMP}/before-${workflow//\//_}.txt"
            gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${encoded_default}&event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id' > "${before}"
            payload="$(jq -n --arg ref "${DEFAULT_BRANCH}" --argjson inputs "${inputs_json}" '{ref:$ref,inputs:$inputs}')"
            printf '%s' "${payload}" | gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" --input - >/dev/null
            run_id=""
            for _ in $(seq 1 60); do
              while IFS= read -r candidate; do
                [[ -n "${candidate}" ]] || continue
                grep -qx "${candidate}" "${before}" && continue
                run="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}")"
                if [[ "$(jq -r '.head_sha' <<<"${run}")" == "${DEFAULT_SHA}" &&
                      "$(jq -r '.head_branch' <<<"${run}")" == "${DEFAULT_BRANCH}" &&
                      "$(jq -r '.display_title' <<<"${run}")" == "${expected_title}" ]]; then
                  run_id="${candidate}"
                  break
                fi
              done < <(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${encoded_default}&event=workflow_dispatch&per_page=20" --jq '.workflow_runs[].id')
              [[ -n "${run_id}" ]] && break
              sleep 3
            done
            [[ -n "${run_id}" ]] || { echo "::error::unable to correlate ${workflow} to immutable inputs"; return 1; }
            printf '%s\t%s\t%s\n' "${workflow}" "${run_id}" "${expected_title}" >> "${state}"
          }

          common="$(jq -cn --arg pr "${PR_NUMBER}" --arg head "${HEAD_SHA}" --arg base "${BASE_SHA}" '{pr_number:$pr,head_sha:$head,base_sha:$base}')"
          dispatch_one codeql.yml "CodeQL dispatched candidate ${HEAD_SHA}" "$(jq -cn --arg pr "${PR_NUMBER}" --arg head "${HEAD_SHA}" --arg base "${BASE_SHA}" --arg head_ref "${HEAD_REF}" '{pr_number:$pr,head_sha:$head,base_sha:$base,head_ref:$head_ref}')"
          dispatch_one sonarqube.yml "SonarQube dispatched candidate ${HEAD_SHA}" "$(jq -cn --arg pr "${PR_NUMBER}" --arg head "${HEAD_SHA}" --arg base "${BASE_SHA}" --arg head_ref "${HEAD_REF}" '{pr_number:$pr,head_sha:$head,base_sha:$base,head_ref:$head_ref}')"
          dispatch_one security-remote.yml "Remote Security dispatched candidate ${HEAD_SHA}" "${common}"
          dispatch_one semgrep.yml "Semgrep dispatched candidate ${HEAD_SHA}" "$(jq -cn --arg pr "${PR_NUMBER}" --arg head "${HEAD_SHA}" --arg base "${BASE_SHA}" '{mode:"full",base_ref:$base,pr_number:$pr,head_sha:$head,base_sha:$base}')"
          dispatch_one open-code-review.yml "OpenCodeReview dispatched candidate ${HEAD_SHA}" "$(jq -cn --arg pr "${PR_NUMBER}" --arg base "${BASE_SHA}" --arg head "${HEAD_SHA}" '{pr_number:$pr,base_ref:$base,base_sha:$base,head_sha:$head}')"
          dispatch_one dependency-review.yml "Dependency Review dispatched candidate ${HEAD_SHA}" "$(jq -cn --arg pr "${PR_NUMBER}" --arg base "${BASE_SHA}" --arg head "${HEAD_SHA}" '{pr_number:$pr,head_sha:$head,base_sha:$base,base_ref:$base,head_ref:$head,expected_sha:$head}')"
          dispatch_one docker-runtime-hardening.yml "Docker Runtime Hardening dispatched candidate ${HEAD_SHA}" "${common}"
          dispatch_one lockfile-integrity.yml "Lockfile Integrity dispatched candidate ${HEAD_SHA}" "${common}"

      - name: Wait for every exact analyzer run
        id: analyzer_runs
        if: ${{ steps.dispatch.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          DEFAULT_SHA: ${{ steps.scope.outputs.default_sha }}
        run: |
          set -euo pipefail
          failures=()
          while IFS=$'\t' read -r workflow run_id expected_title; do
            [[ -n "${workflow}" && -n "${run_id}" ]] || continue
            conclusion=""
            for _ in $(seq 1 1080); do
              run="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              [[ "$(jq -r '.head_sha' <<<"${run}")" == "${DEFAULT_SHA}" ]] || { failures+=("${workflow}:trusted-definition-drift"); break; }
              [[ "$(jq -r '.display_title' <<<"${run}")" == "${expected_title}" ]] || { failures+=("${workflow}:input-correlation-drift"); break; }
              if [[ "$(jq -r '.status' <<<"${run}")" == "completed" ]]; then
                conclusion="$(jq -r '.conclusion // "unknown"' <<<"${run}")"
                break
              fi
              sleep 10
            done
            [[ "${conclusion}" == "success" ]] || failures+=("${workflow}:${conclusion:-timeout}")
          done < "${RUNNER_TEMP}/closure-runs.tsv"
          (( ${#failures[@]} == 0 )) || {
            echo "::error title=Closure analyzer failure::$(IFS=,; echo "${failures[*]}")"
            exit 1
          }

      - name: Verify raw CodeQL analyses categories alerts and check-runs
        id: codeql
        if: ${{ steps.analyzer_runs.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          codeql_run="$(awk -F '\t' '$1=="codeql.yml"{print $2}' "${RUNNER_TEMP}/closure-runs.tsv")"
          [[ "${codeql_run}" =~ ^[0-9]+$ ]] || { echo "::error::CodeQL run id missing"; exit 1; }

          jobs="$(gh api --paginate -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${codeql_run}/jobs?per_page=100" --slurp)"
          required_jobs='["Detect CodeQL scope","Analyze javascript-typescript","Analyze go (dsh)","Analyze go (wlt)","Analyze go (identity)","Analyze go (workforce)","Analyze go (platform-control)","Analyze go (providers)","Analyze actions","Upload trusted CodeQL SARIF","CodeQL / dispatched result"]'
          missing_jobs="$(jq --argjson required "${required_jobs}" '[.[] | .jobs[]?.name] as $actual | [$required[] as $name | select(($actual | index($name)) == null) | $name] | length' <<<"${jobs}")"
          failed_jobs="$(jq --argjson required "${required_jobs}" '[.[] | .jobs[]? | select((.name as $name | $required | index($name)) != null and (.conclusion != "success" or ((.check_run_url // "") | length) == 0))] | length' <<<"${jobs}")"
          [[ "${missing_jobs}" == "0" && "${failed_jobs}" == "0" ]] || { echo "::error::CodeQL raw job/check-run baseline is incomplete"; exit 1; }

          analyses="$(gh api --paginate -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/code-scanning/analyses?tool_name=CodeQL&per_page=100" --slurp)"
          required_categories='["/language:javascript-typescript","/language:actions","/language:go-dsh","/language:go-wlt","/language:go-identity","/language:go-workforce","/language:go-platform-control","/language:go-providers"]'
          missing_categories="$(jq --arg sha "${HEAD_SHA}" --argjson required "${required_categories}" '[.[][] | select(.commit_sha == $sha and ((.error // "") == "")) | .category] as $actual | [$required[] as $category | select(($actual | index($category)) == null) | $category] | length' <<<"${analyses}")"
          [[ "${missing_categories}" == "0" ]] || { echo "::error::CodeQL exact-SHA baseline categories missing=${missing_categories}"; exit 1; }

          alerts="$(gh api --paginate -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=CodeQL&per_page=100" --slurp)"
          open_alerts="$(jq --arg sha "${HEAD_SHA}" '[.[][] | select(.most_recent_instance.commit_sha == $sha)] | length' <<<"${alerts}")"
          [[ "${open_alerts}" == "0" ]] || { echo "::error::CodeQL exact candidate has ${open_alerts} open alerts"; exit 1; }

      - name: Verify raw Semgrep evidence
        id: semgrep
        if: ${{ steps.analyzer_runs.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          run_id="$(awk -F '\t' '$1=="semgrep.yml"{print $2}' "${RUNNER_TEMP}/closure-runs.tsv")"
          artifacts="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_id="$(jq -r --arg prefix "semgrep-evidence-${HEAD_SHA}-" '[.artifacts[] | select(.name | startswith($prefix))] | max_by(.created_at).id // empty' <<<"${artifacts}")"
          [[ "${artifact_id}" =~ ^[0-9]+$ ]] || { echo "::error::Semgrep evidence artifact missing"; exit 1; }
          mkdir -p "${RUNNER_TEMP}/semgrep-raw"
          gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${RUNNER_TEMP}/semgrep.zip"
          while IFS= read -r entry; do
            [[ -n "${entry}" && "${entry}" != /* && "${entry}" != ../* && "${entry}" != */../* && "${entry}" != */.. ]] || {
              echo "::error::unsafe Semgrep artifact path"
              exit 1
            }
          done < <(unzip -Z1 "${RUNNER_TEMP}/semgrep.zip")
          unzip -q "${RUNNER_TEMP}/semgrep.zip" -d "${RUNNER_TEMP}/semgrep-raw"
          summary="$(find "${RUNNER_TEMP}/semgrep-raw" -name summary.json -print -quit)"
          jq -e --arg sha "${HEAD_SHA}" '.headSha==$sha and .totalFindings==0 and .unknownEngineErrors==0 and .allRawFindingsAccounted==true' "${summary}" >/dev/null

      - name: Verify raw Remote Security evidence
        id: security
        if: ${{ steps.analyzer_runs.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          run_id="$(awk -F '\t' '$1=="security-remote.yml"{print $2}' "${RUNNER_TEMP}/closure-runs.tsv")"
          artifacts="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          mkdir -p "${RUNNER_TEMP}/security-raw"
          mapfile -t artifact_ids < <(jq -r '.artifacts[] | select(.name | startswith("remote-security-")) | .id' <<<"${artifacts}")
          [[ "${#artifact_ids[@]}" -eq 9 ]] || { echo "::error::expected 9 independent Remote Security artifacts"; exit 1; }
          for artifact_id in "${artifact_ids[@]}"; do
            mkdir -p "${RUNNER_TEMP}/security-raw/${artifact_id}"
            gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${RUNNER_TEMP}/security-${artifact_id}.zip"
            while IFS= read -r entry; do
              [[ -n "${entry}" && "${entry}" != /* && "${entry}" != ../* && "${entry}" != */../* && "${entry}" != */.. ]] || {
                echo "::error::unsafe Remote Security artifact path"
                exit 1
              }
            done < <(unzip -Z1 "${RUNNER_TEMP}/security-${artifact_id}.zip")
            unzip -q "${RUNNER_TEMP}/security-${artifact_id}.zip" -d "${RUNNER_TEMP}/security-raw/${artifact_id}"
          done
          mapfile -t result_files < <(find "${RUNNER_TEMP}/security-raw" -name '*.json' -type f)
          [[ "${#result_files[@]}" -eq 9 ]] || { echo "::error::Remote Security result documents are incomplete"; exit 1; }
          jq -s -e --arg sha "${HEAD_SHA}" 'length==9 and all(.[]; .candidateSha==$sha and .outcome=="PASS")' "${result_files[@]}" >/dev/null

      - name: Verify exact Sonar analysis and quality gate
        id: sonar
        if: ${{ steps.analyzer_runs.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          HEAD_REF: ${{ steps.scope.outputs.head_ref }}
          DEFAULT_SHA: ${{ steps.scope.outputs.default_sha }}
        run: |
          set -euo pipefail
          [[ -n "${SONAR_TOKEN}" ]] || { echo "::error::SONAR_TOKEN is required for trusted read-back"; exit 1; }
          properties="$(gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/contents/sonar-project.properties" -f "ref=${DEFAULT_SHA}" --jq '.content' | base64 --decode)"
          project_key="$(awk -F= '$1=="sonar.projectKey"{print $2}' <<<"${properties}")"
          [[ -n "${project_key}" ]] || { echo "::error::trusted sonar.projectKey missing"; exit 1; }
          api='https://sonarcloud.io/api'
          analyses="$(curl -fsS -H "Authorization: Bearer ${SONAR_TOKEN}" --get "${api}/project_analyses/search" --data-urlencode "project=${project_key}" --data-urlencode "branch=${HEAD_REF}" --data-urlencode 'ps=100')"
          analysis_key="$(jq -r --arg sha "${HEAD_SHA}" '[.analyses[] | select(.revision==$sha)] | sort_by(.date) | reverse | .[0].key // ""' <<<"${analyses}")"
          [[ -n "${analysis_key}" ]] || { echo "::error::Sonar exact-SHA analysis missing"; exit 1; }
          gate="$(curl -fsS -H "Authorization: Bearer ${SONAR_TOKEN}" --get "${api}/qualitygates/project_status" --data-urlencode "analysisId=${analysis_key}")"
          [[ "$(jq -r '.projectStatus.status // "UNKNOWN"' <<<"${gate}")" == "OK" ]] || { echo "::error::Sonar quality gate is not OK"; exit 1; }
          issues="$(curl -fsS -H "Authorization: Bearer ${SONAR_TOKEN}" --get "${api}/issues/search" --data-urlencode "componentKeys=${project_key}" --data-urlencode "branch=${HEAD_REF}" --data-urlencode 'resolved=false' --data-urlencode 'ps=500')"
          material="$(jq '[.issues[]? | select((.type=="VULNERABILITY") or (.severity=="BLOCKER") or (.severity=="CRITICAL") or any(.impacts[]?; .severity=="BLOCKER" or .severity=="HIGH"))] | length' <<<"${issues}")"
          [[ "${material}" == "0" ]] || { echo "::error::Sonar has ${material} unresolved material findings"; exit 1; }

      - name: Require exact-head semantic review attestation
        id: semantic_review
        if: ${{ steps.scope.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          PR_NUMBER: ${{ steps.scope.outputs.pr_number }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          reviews="$(gh api --paginate -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" --slurp)"
          matches="$(jq --arg sha "${HEAD_SHA}" '[.[][] | select(.commit_id==$sha and (.body // "" | contains("BTHWANI_SEMANTIC_REVIEW:v1")) and (.body // "" | contains("verdict=PASS")))] | length' <<<"${reviews}")"
          [[ "${matches}" -gt 0 ]] || { echo "::error::missing exact-head BTHWANI_SEMANTIC_REVIEW:v1 verdict=PASS"; exit 1; }

      - name: Final live identity revalidation
        id: final_identity
        if: ${{ steps.scope.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          PR_NUMBER: ${{ steps.scope.outputs.pr_number }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          DEFAULT_SHA: ${{ steps.scope.outputs.default_sha }}
        run: |
          set -euo pipefail
          pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          [[ "$(jq -r '.head.sha' <<<"${pr}")" == "${HEAD_SHA}" ]] || { echo "::error::candidate superseded during closure"; exit 1; }
          [[ "$(jq -r '.base.sha' <<<"${pr}")" == "${BASE_SHA}" ]] || { echo "::error::base moved during closure"; exit 1; }
          encoded_default="$(jq -rn --arg value "${DEFAULT_BRANCH}" '$value|@uri')"
          live_default="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/branches/${encoded_default}" --jq '.commit.sha')"
          [[ "${live_default}" == "${DEFAULT_SHA}" ]] || { echo "::error::trusted default definition moved during closure"; exit 1; }

      - name: Publish canonical closure status
        id: publish
        if: ${{ always() && steps.scope.outcome == 'success' }}
        shell: bash
        env:
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          INTERNAL_OUTCOME: ${{ steps.internal.outcome }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          RUNS_OUTCOME: ${{ steps.analyzer_runs.outcome }}
          CODEQL_OUTCOME: ${{ steps.codeql.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
          SONAR_OUTCOME: ${{ steps.sonar.outcome }}
          REVIEW_OUTCOME: ${{ steps.semantic_review.outcome }}
          IDENTITY_OUTCOME: ${{ steps.final_identity.outcome }}
        run: |
          set -euo pipefail
          failures=()
          for pair in \
            "internal:${INTERNAL_OUTCOME}" \
            "dispatch:${DISPATCH_OUTCOME}" \
            "runs:${RUNS_OUTCOME}" \
            "codeql:${CODEQL_OUTCOME}" \
            "semgrep:${SEMGREP_OUTCOME}" \
            "security:${SECURITY_OUTCOME}" \
            "sonar:${SONAR_OUTCOME}" \
            "semantic-review:${REVIEW_OUTCOME}" \
            "identity:${IDENTITY_OUTCOME}"; do
            [[ "${pair#*:}" == "success" ]] || failures+=("${pair}")
          done
          state=failure
          description='PR closure evidence incomplete or failed'
          if (( ${#failures[@]} == 0 )); then
            state=success
            description='Exact PR/head/base closure evidence passed'
          else
            echo "::error title=PR closure evidence failed::$(IFS=,; echo "${failures[*]}")"
          fi
          gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${state}" \
            -f context='BThwani / PR Closure Evidence' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "state=${state}" >> "${GITHUB_OUTPUT}"

      - name: Enforce published closure status
        if: ${{ always() }}
        shell: bash
        env:
          PUBLISHED_STATE: ${{ steps.publish.outputs.state }}
        run: |
          set -euo pipefail
          [[ "${PUBLISHED_STATE}" == "success" ]] || exit 1
