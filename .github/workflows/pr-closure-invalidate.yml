name: BThwani PR Closure Invalidation

on:
  push:
    branches: ["**"]
  workflow_run:
    workflows: ["BThwani PR Closure Request"]
    types: [completed]

permissions: {}

concurrency:
  group: bthwani-pr-closure-invalidate-${{ github.event.workflow_run.id || github.sha }}
  cancel-in-progress: false

jobs:
  invalidate:
    name: Invalidate stale PR closure evidence
    if: >-
      ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EVENT_NAME: ${{ github.event_name }}
      WORKFLOW_RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Resolve live same-repository PRs requiring reapproval
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          targets="${RUNNER_TEMP}/closure-invalidation-targets.tsv"
          : > "${targets}"
          append_live_pr() {
            local number="$1" pr
            [[ "${number}" =~ ^[1-9][0-9]*$ ]] || return 0
            pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${number}")"
            [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || return 0
            [[ "$(jq -r '.head.repo.full_name' <<<"${pr}")" == "${GITHUB_REPOSITORY}" ]] || return 0
            printf '%s\t%s\t%s\n' \
              "${number}" \
              "$(jq -r '.head.sha' <<<"${pr}")" \
              "$(jq -r '.base.sha' <<<"${pr}")" >> "${targets}"
          }

          if [[ "${EVENT_NAME}" == "push" ]]; then
            while IFS= read -r number; do append_live_pr "${number}"; done < <(
              gh api --paginate --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
                "/repos/${GITHUB_REPOSITORY}/pulls" \
                -f state=open -f base="${DEFAULT_BRANCH}" -f per_page=100 \
                --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY) | .number'
            )
          else
            append_live_pr "${WORKFLOW_RUN_PR:-}"
          fi
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"

      - name: Publish fail-closed invalidation for every live head
        shell: bash
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r pr_number head_sha base_sha; do
            [[ "${head_sha}" =~ ^[0-9a-fA-F]{40}$ && "${base_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || continue
            gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
              -f state=failure \
              -f context='BThwani / PR Closure Evidence' \
              -f description="PR/base changed; independent closure reapproval required" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
            echo "Invalidated PR #${pr_number} head=${head_sha} base=${base_sha}"
          done < "${TARGETS}"
