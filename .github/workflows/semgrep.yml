name: Semgrep Code Remote

on:
  workflow_call:
    inputs:
      head_sha: {type: string, required: true}
      base_sha: {type: string, required: true}

permissions:
  contents: read

concurrency:
  group: semgrep-code-${{ inputs.head_sha }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ inputs.head_sha }}
  BASE_SHA: ${{ inputs.base_sha }}

jobs:
  scan:
    name: Semgrep exact diff
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate with base history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${HEAD_SHA}" ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          package-manager-cache: false
      - name: Validate Semgrep evidence classifier
        run: node --test tools/scripts/classify-semgrep-evidence.test.mjs
      - name: Install pinned Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/semgrep-1.172.0"
          "${RUNNER_TEMP}/semgrep-1.172.0/bin/python" -m pip install --disable-pip-version-check --no-input semgrep==1.172.0
          echo "${RUNNER_TEMP}/semgrep-1.172.0/bin" >> "${GITHUB_PATH}"
      - name: Run Semgrep on the exact diff
        id: semgrep
        continue-on-error: true
        shell: bash
        run: |
          set +e
          evidence="${RUNNER_TEMP}/semgrep-evidence"
          mkdir -p "${evidence}"
          semgrep scan --config p/default --config p/security-audit --json --metrics=off \
            --exclude=".github/workflows/**" --baseline-commit "${BASE_SHA}" . \
            > "${evidence}/semgrep.json" 2> "${evidence}/stderr.log"
          status=$?
          set -e
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Normalize every raw finding and engine condition
        id: policy
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/semgrep-evidence/semgrep.json"
          [[ "${SCAN_OUTCOME}" == "success" ]] || { echo "::error::Semgrep execution failed"; exit 1; }
          [[ -s "${src}" ]] || { echo "::error::Semgrep JSON evidence missing"; exit 1; }
          node tools/scripts/classify-semgrep-evidence.mjs \
            --input "${src}" \
            --output-dir "${RUNNER_TEMP}/semgrep-evidence" \
            --head-sha "${HEAD_SHA}" \
            --mode diff \
            --base-sha "${BASE_SHA}"
          summary="${RUNNER_TEMP}/semgrep-evidence/summary.json"
          total="$(jq -r '.totalFindings' "${summary}")"
          unknown="$(jq -r '.unknownEngineErrors' "${summary}")"
          accounted="$(jq -r '.allRawFindingsAccounted' "${summary}")"
          {
            echo "### Semgrep exact diff"
            echo "- Candidate: \`${HEAD_SHA}\`"
            echo "- Base: \`${BASE_SHA}\`"
            echo "- Raw findings: \`${total}\`"
            echo "- Unknown engine errors: \`${unknown}\`"
            echo "- All raw engine conditions accounted: \`${accounted}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          [[ "${accounted}" == "true" ]] || { echo "::error::Semgrep raw engine conditions were not fully accounted"; exit 1; }
          [[ "${unknown}" == "0" ]] || { echo "::error::Semgrep unknown engine errors=${unknown}"; exit 1; }
          [[ "${total}" == "0" ]] || { echo "::error::Semgrep findings require diagnosis/disposition before closure: total=${total}"; exit 1; }
      - name: Upload complete Semgrep evidence
        if: ${{ always() }}
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-evidence-${{ env.HEAD_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/semgrep-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Enforce exact Semgrep result
        if: ${{ always() }}
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.semgrep.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          set -euo pipefail
          [[ "${SCAN_OUTCOME}" == "success" ]]
          [[ "${POLICY_OUTCOME}" == "success" ]]
          [[ "${ARTIFACT_OUTCOME}" == "success" ]]
