name: Semgrep exact-h baseline

on:
  workflow_call:
    inputs:
      head_sha: {type: string, required: true}
      base_sha: {type: string, required: true}

permissions:
  contents: read

concurrency:
  group: semgrep-h-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  scan:
    name: Semgrep full exact-h repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - name: Checkout exact h candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
          show-progress: false

      - name: Verify exact h identity and ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "h" ]] || {
            echo "::error::Semgrep baseline authority is h only"
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${HEAD_SHA}" ]] || {
            echo "::error::Semgrep candidate drift"
            exit 1
          }
          [[ "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Semgrep exact base SHA required"
            exit 1
          }
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"

      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
          package-manager-cache: false

      - name: Install pinned Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/semgrep-1.172.0"
          "${RUNNER_TEMP}/semgrep-1.172.0/bin/python" -m pip install \
            --disable-pip-version-check --no-input semgrep==1.172.0
          echo "${RUNNER_TEMP}/semgrep-1.172.0/bin" >> "${GITHUB_PATH}"

      - name: Run full repository Semgrep
        id: semgrep
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/semgrep-evidence"
          mkdir -p "${evidence}"
          set +e
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --json \
            --metrics=off \
            --exclude=".github/workflows/**" \
            . > "${evidence}/semgrep.json" 2> "${evidence}/stderr.log"
          status=$?
          set -e
          if (( status != 0 && status != 1 )); then
            echo "::error::Semgrep engine failed with status ${status}"
            exit 1
          fi
          jq -e 'type == "object" and (.results | type == "array")' \
            "${evidence}/semgrep.json" >/dev/null || {
            echo "::error::Semgrep did not produce valid JSON evidence"
            exit 1
          }

      - name: Classify and enforce zero repository findings
        id: policy
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.semgrep.outcome }}" == "success" ]] || {
            echo "::error::Semgrep collection did not complete"
            exit 1
          }
          evidence="${RUNNER_TEMP}/semgrep-evidence"
          node tools/scripts/classify-semgrep-evidence.mjs \
            --input "${evidence}/semgrep.json" \
            --output-dir "${evidence}" \
            --head-sha "${HEAD_SHA}" \
            --base-sha "${BASE_SHA}" \
            --mode full

          summary="${evidence}/summary.json"
          jq -e '
            .mode == "full" and
            .evidenceComplete == true and
            .allRawFindingsAccounted == true and
            .unknownRequiredCoverage == 0 and
            .totalFindings == 0 and
            .findingStatus == "CLEAN"
          ' "${summary}" >/dev/null || {
            echo "::error::Semgrep exact-h baseline has open findings or incomplete evidence"
            cat "${summary}"
            exit 1
          }

          {
            echo "### Semgrep exact-h baseline"
            echo "- Candidate: \`${HEAD_SHA}\`"
            echo "- Base: \`${BASE_SHA}\`"
            echo "- Findings: \`$(jq -r '.totalFindings' "${summary}")\`"
            echo "- Unknown coverage: \`$(jq -r '.unknownRequiredCoverage' "${summary}")\`"
            echo "- Result: CLEAN"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload complete Semgrep evidence
        if: ${{ always() }}
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-evidence-${{ env.HEAD_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/semgrep-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Enforce complete Semgrep result
        if: ${{ always() }}
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.semgrep.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          set -euo pipefail
          [[ "${SCAN_OUTCOME}" == "success" ]]
          [[ "${POLICY_OUTCOME}" == "success" ]]
          [[ "${ARTIFACT_OUTCOME}" == "success" ]]
