name: BThwani Contract Diagnostics

on:
  workflow_call:
    inputs:
      base_sha: {type: string, required: true}
      candidate_sha: {type: string, required: true}
      full_scope: {type: string, required: true}
      contracts: {type: string, required: true}

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  contracts:
    name: Contract and binding integrity
    if: ${{ inputs.contracts == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ && "${ROUTED_CANDIDATE_SHA}" == "${CANDIDATE_SHA}" ]] || {
            echo "::error::Invalid routed candidate SHA"; exit 1;
          }
      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact candidate and fetch base
        uses: ./.github/actions/fetch-exact-commits
        with:
          base_sha: ${{ inputs.base_sha }}
          head_sha: ${{ env.CANDIDATE_SHA }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Materialize and verify contract integrity
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec nx run contracts:materialize
          pnpm run contracts:lint
          node --test tools/guards/*.test.mjs
          node tools/scripts/run-guard-suite.mjs --concurrency 2 \
            tools/guards/no-broken-imports.mjs \
            tools/guards/api-binding-gate.mjs \
            tools/guards/backend-api-binding-gate.mjs \
            tools/guards/generated-client-provenance-gate.mjs \
            tools/guards/contract-scope-binding-gate.mjs \
            tools/guards/runtime-real-bindings-gate.mjs
      - name: Run full contract guards
        if: ${{ inputs.full_scope == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/scripts/run-guard-suite.mjs --concurrency 2 \
            tools/guards/service-manifest-drift-gate.mjs \
            tools/guards/openapi-bundle-provenance-gate.mjs \
            tools/guards/frontend-feature-binding-gate.mjs \
            tools/guards/dsh-openapi-modular-gate.mjs \
            tools/guards/wlt-openapi-bundle-gate.mjs
