name: BThwani Contract Diagnostics

on:
  workflow_call:
    inputs:
      base_sha: { type: string, required: true }
      head_sha: { type: string, required: true }
      full_verification: { type: string, required: true }
      frontend: { type: string, required: true }
      contracts: { type: string, required: true }
      contracts_changed: { type: string, required: true }
      node: { type: string, required: true }
      verification_tier: { type: string, required: true }
      execution_phase: { type: string, required: true }

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contracts:
    name: Contract and binding integrity
    if: ${{ inputs.contracts == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${CANDIDATE_SHA}" || "${ROUTED_HEAD_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "::error::Routed head SHA mismatch: routed=${ROUTED_HEAD_SHA:-<empty>} event=${CANDIDATE_SHA:-<empty>}"
            exit 1
          fi
      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact candidate and fetch base
        uses: ./.github/actions/fetch-exact-commits
        with:
          base_sha: ${{ inputs.base_sha }}
          head_sha: ${{ env.CANDIDATE_SHA }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Materialize contracts
        run: pnpm exec nx run contracts:materialize
      - name: Verify contract and binding integrity
        shell: bash
        run: |
          set -euo pipefail
          node tools/scripts/run-guard-suite.mjs --concurrency 2 \
            tools/guards/no-broken-imports.mjs \
            tools/guards/api-binding-gate.mjs \
            tools/guards/backend-api-binding-gate.mjs \
            tools/guards/generated-client-provenance-gate.mjs \
            tools/guards/contract-scope-binding-gate.mjs \
            tools/guards/runtime-real-bindings-gate.mjs
      - name: Verify specialized binding integrity on full verification
        if: ${{ inputs.full_verification == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/scripts/run-guard-suite.mjs --concurrency 2 \
            tools/guards/service-manifest-drift-gate.mjs \
            tools/guards/openapi-bundle-provenance-gate.mjs \
            tools/guards/frontend-feature-binding-gate.mjs
