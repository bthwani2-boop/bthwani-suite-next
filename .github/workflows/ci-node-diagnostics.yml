name: BThwani Contract Diagnostics

on:
  workflow_call:
    inputs:
      base_sha: { type: string, required: true }
      head_sha: { type: string, required: true }
      full_verification: { type: string, required: true }
      frontend: { type: string, required: true }
      contracts: { type: string, required: true }
      contracts_changed: { type: string, required: true }
      node: { type: string, required: true }
      verification_tier: { type: string, required: true }
      execution_phase: { type: string, required: true }

permissions:
  contents: read

jobs:
  contracts:
    name: Contract and binding integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch exact verification commits
        uses: ./.github/actions/fetch-exact-commits
        with:
          base_sha: ${{ inputs.base_sha }}
          head_sha: ${{ inputs.head_sha }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Materialize contracts
        run: pnpm exec nx run contracts:materialize
      - name: Verify contract and binding integrity
        shell: bash
        run: |
          set -euo pipefail
          pnpm run guard:no-broken-imports
          pnpm run guard:api-binding
          pnpm run guard:backend-api-binding
          pnpm run guard:service-manifest-drift
          pnpm run guard:generated-client-provenance
          pnpm run guard:contract-scope-binding
          pnpm run guard:openapi-bundle-provenance
          pnpm run guard:frontend-feature-binding
          pnpm run guard:runtime-real-bindings
