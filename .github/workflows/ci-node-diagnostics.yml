name: BThwani Node Diagnostics

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      full_verification:
        type: string
        required: true
      frontend:
        type: string
        required: true
      contracts:
        type: string
        required: true
      node:
        type: string
        required: true
      verification_tier:
        type: string
        required: true

permissions:
  contents: read

jobs:
  affected:
    name: Affected diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify immutable diff
        run: git diff --check "${{ inputs.base_sha }}" "${{ inputs.head_sha }}"
      - name: Verify affected frontend diagnostics
        if: ${{ inputs.frontend == 'true' }}
        run: |
          set +e
          log="${RUNNER_TEMP}/frontend-diagnostics.log"
          {
            pnpm run diagnostics:ui-kit
            pnpm run guard:a11y
            pnpm run guard:dependency-graph
            pnpm run guard:ast-grep-rules
          } >"${log}" 2>&1
          status=$?
          tail -n 250 "${log}"
          exit "${status}"
      - name: Upload frontend diagnostic evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/frontend-diagnostics.log
          if-no-files-found: error
          retention-days: 1
      - name: Verify affected contracts and bindings
        if: ${{ inputs.contracts == 'true' }}
        run: |
          pnpm run guard:no-broken-imports
          pnpm --dir contracts typecheck
          pnpm run guard:api-binding
          pnpm run guard:backend-api-binding
          pnpm run guard:service-manifest-drift
          pnpm run guard:frontend-feature-binding
          pnpm run guard:runtime-real-bindings
          pnpm run guard:live-cross-journey-integrity
      - name: Run deep repository diagnostics
        if: ${{ inputs.full_verification == 'true' || inputs.verification_tier == 'deep' }}
        run: |
          set +e
          log="${RUNNER_TEMP}/deep-diagnostics.log"
          {
            pnpm exec knip --config knip.json --reporter compact --reporter github-actions
            pnpm run guard:logic-all
            pnpm run guard:repo-all
            pnpm run guard:performance-all
          } >"${log}" 2>&1
          status=$?
          tail -n 250 "${log}"
          exit "${status}"
      - name: Upload deep diagnostic evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/deep-diagnostics.log
          if-no-files-found: error
          retention-days: 1
      - name: Record strict dead-code backlog without allowing new closure claims
        if: ${{ inputs.full_verification == 'true' || inputs.verification_tier == 'deep' }}
        continue-on-error: true
        run: pnpm exec knip --config knip.strict.json --reporter compact
