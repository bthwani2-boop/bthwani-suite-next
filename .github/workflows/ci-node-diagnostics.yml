name: BThwani Node Diagnostics

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      full_verification:
        type: string
        required: true
      frontend:
        type: string
        required: true
      contracts:
        type: string
        required: true
      node:
        type: string
        required: true
      verification_tier:
        type: string
        required: true

permissions:
  contents: read

jobs:
  affected:
    name: Affected diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify immutable diff
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"
      - name: Verify affected frontend diagnostics
        if: ${{ inputs.frontend == 'true' }}
        run: |
          pnpm run diagnostics:ui-kit
          pnpm run guard:a11y
          pnpm run guard:dependency-graph
          pnpm run guard:ast-grep-rules
      - name: Verify affected contracts and bindings
        id: contract_diagnostics
        if: ${{ inputs.contracts == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/contract-diagnostics.log"
          : >"${log}"
          status=0
          run_check() {
            echo "===== $* =====" | tee -a "${log}"
            "$@" 2>&1 | tee -a "${log}"
            code=${PIPESTATUS[0]}
            if [[ "${code}" -ne 0 ]]; then status="${code}"; fi
          }
          run_check pnpm run guard:no-broken-imports
          run_check pnpm --dir contracts typecheck
          run_check pnpm run guard:api-binding
          run_check pnpm run guard:backend-api-binding
          run_check pnpm run guard:service-manifest-drift
          run_check pnpm run guard:frontend-feature-binding
          run_check pnpm run guard:runtime-real-bindings
          run_check pnpm run guard:live-cross-journey-integrity
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Upload contract diagnostics
        if: ${{ steps.contract_diagnostics.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/contract-diagnostics.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce contract diagnostics result
        if: ${{ steps.contract_diagnostics.outcome == 'failure' }}
        run: exit 1
      - name: Run deep repository diagnostics
        if: ${{ inputs.full_verification == 'true' || inputs.verification_tier == 'deep' }}
        run: |
          pnpm exec knip --config knip.json --reporter compact --reporter github-actions
          pnpm run guard:logic-all
          pnpm run guard:repo-all
          pnpm run guard:performance-all
      - name: Record strict dead-code backlog without allowing new closure claims
        if: ${{ inputs.full_verification == 'true' || inputs.verification_tier == 'deep' }}
        continue-on-error: true
        run: pnpm exec knip --config knip.strict.json --reporter compact
