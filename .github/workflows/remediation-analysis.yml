name: BThwani Failure Analysis

on:
  workflow_run:
    workflows:
      - BThwani Contextual CI
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: failure-analysis-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Build immutable failure diagnostics
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Collect failed jobs and diagnostic excerpts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100" \
            --jq '.jobs[]' | jq -s '.' > /tmp/jobs.json

          jq \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg runId "${SOURCE_RUN_ID}" \
            --arg runUrl "${SOURCE_RUN_URL}" \
            --arg headSha "${SOURCE_HEAD_SHA}" \
            --arg headBranch "${SOURCE_HEAD_BRANCH}" \
            '{
              schemaVersion: 2,
              repository: $repository,
              sourceRunId: $runId,
              sourceRunUrl: $runUrl,
              headSha: $headSha,
              headBranch: $headBranch,
              failedJobs: [
                .[]
                | select(.conclusion != "success" and .conclusion != "skipped")
                | {
                    id,
                    name,
                    status,
                    conclusion,
                    htmlUrl: .html_url,
                    failedSteps: [
                      .steps[]?
                      | select(.conclusion != "success" and .conclusion != "skipped")
                      | {number, name, status, conclusion}
                    ]
                  }
              ]
            }' /tmp/jobs.json > failure-map.json

          failed_count="$(jq '.failedJobs | length' failure-map.json)"
          if [[ "${failed_count}" -eq 0 ]]; then
            echo "No failed job was returned for failed workflow run ${SOURCE_RUN_ID}." >&2
            exit 1
          fi

          mkdir -p failure-logs
          : > failure-diagnostics.txt

          while IFS=$'\t' read -r job_id job_name job_url; do
            raw_log="failure-logs/${job_id}.raw.log"
            clean_log="failure-logs/${job_id}.log"
            excerpt="failure-logs/${job_id}.excerpt.log"

            curl --fail-with-body --location --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
              --output "${raw_log}"

            sed -E \
              -e $'s/\x1b\[[0-9;]*m//g' \
              -e 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z[[:space:]]+//' \
              "${raw_log}" > "${clean_log}"

            grep -E -i \
              '##\[error\]|(^|[[:space:]])(error|fatal|fail(ed|ure)?|assertionerror|panic|unused|unlisted|missing|violation|forbidden|cannot|not found|invalid)(:|[[:space:]]|$)|^-[[:space:]]' \
              "${clean_log}" | tail -n 120 > "${excerpt}" || true

            if [[ ! -s "${excerpt}" ]]; then
              tail -n 120 "${clean_log}" > "${excerpt}"
            fi

            {
              echo "## ${job_name}"
              echo "Job: ${job_url}"
              echo
              cat "${excerpt}"
              echo
            } >> failure-diagnostics.txt
          done < <(jq -r '.failedJobs[] | [.id, .name, .htmlUrl] | @tsv' failure-map.json)

          {
            echo "### Immutable failure diagnostics"
            echo "- Source run: ${SOURCE_RUN_URL}"
            echo "- Branch: ${SOURCE_HEAD_BRANCH}"
            echo "- Commit: ${SOURCE_HEAD_SHA}"
            echo "- Failed jobs: ${failed_count}"
            echo
            jq -r '.failedJobs[] | "- **\(.name)** — \(.conclusion)\n" + ((.failedSteps // []) | map("  - \(.name): \(.conclusion)") | join("\n"))' failure-map.json
            echo
            echo "### First diagnostic excerpts"
            sed -n '1,180p' failure-diagnostics.txt
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload immutable failure diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-diagnostics-${{ github.event.workflow_run.id }}
          path: |
            failure-map.json
            failure-diagnostics.txt
            failure-logs/*.excerpt.log
          if-no-files-found: error
          retention-days: 7
