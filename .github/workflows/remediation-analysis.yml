name: BThwani Live Code Remediation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to repair; defaults to the selected workflow ref
        required: false
        default: ""
        type: string
      mode:
        description: Repair and verification depth
        required: true
        default: full
        type: choice
        options: [full, affected]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: live-code-remediation-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    name: Repair and verify live code
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BASE_BRANCH: master
      SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
      REMEDIATION_BRANCH: automation/live-code-remediation-${{ github.run_id }}-${{ github.run_attempt }}
      NX_BASE: origin/master
      NX_HEAD: HEAD
    steps:
      - name: Checkout requested live source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Set up locked Go runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache-dependency-path: |
            services/dsh/backend/go.sum
            services/wlt/backend/go.sum
            core/identity/backend/go.sum
            core/workforce/backend/go.sum
            core/platform-control/backend/go.sum
            core/providers/backend/go.sum

      - name: Create isolated remediation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_BRANCH}"
          git switch -c "${REMEDIATION_BRANCH}"
          {
            echo "### Live-code remediation"
            echo "- Source ref: ${SOURCE_REF}"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Repair mode: ${{ inputs.mode }}"
            echo "- Output branch: ${REMEDIATION_BRANCH}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply deterministic code repairs
        id: repair
        shell: bash
        run: |
          set +e
          mobile_status=0
          openapi_status=0
          lint_status=0
          gofmt_status=0

          pnpm run mobile:apps:sync
          mobile_status=$?

          pnpm run openapi:generate
          openapi_status=$?

          if [[ "${{ inputs.mode }}" == "full" ]]; then
            pnpm exec nx run-many -t lint --all --fix --outputStyle=stream
          else
            pnpm exec nx affected -t lint --fix --outputStyle=stream
          fi
          lint_status=$?

          mapfile -t go_files < <(git ls-files '*.go')
          if [[ "${#go_files[@]}" -gt 0 ]]; then
            gofmt -w "${go_files[@]}"
            gofmt_status=$?
          fi

          set -e
          {
            echo "- Mobile source synchronization exit: ${mobile_status}"
            echo "- OpenAPI generation exit: ${openapi_status}"
            echo "- Lint auto-fix exit: ${lint_status}"
            echo "- Go formatting exit: ${gofmt_status}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Exclude documents, governance records, and logs
        shell: bash
        run: |
          set -euo pipefail

          is_non_code_record() {
            local path="$1"
            [[ "${path}" == *.md ]] ||
              [[ "${path}" == docs/* ]] ||
              [[ "${path}" == governance/* ]] ||
              [[ "${path}" == .agents/* ]] ||
              [[ "${path}" == AGENTS.md ]] ||
              [[ "${path}" == GEMINI.md ]] ||
              [[ "${path}" == *.log ]] ||
              [[ "${path}" == .diagnostics/* ]]
          }

          while IFS= read -r -d '' path; do
            if is_non_code_record "${path}"; then
              git restore --source=HEAD --staged --worktree -- "${path}"
            fi
          done < <(git diff --name-only -z)

          while IFS= read -r -d '' path; do
            if is_non_code_record "${path}"; then
              rm -rf -- "${path}"
            fi
          done < <(git ls-files --others --exclude-standard -z)

          invalid=0
          while IFS= read -r path; do
            [[ -z "${path}" ]] && continue
            case "${path}" in
              apps/*|core/*|services/*|shared/*|contracts/*|infra/*|tools/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|nx.json)
                ;;
              *)
                echo "::error title=Non-code remediation blocked::${path} is outside the live-code allowlist."
                invalid=1
                ;;
            esac
          done < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)

          if [[ "${invalid}" -ne 0 ]]; then
            exit 1
          fi

      - name: Verify live bindings and imports
        id: bindings
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm run guard:no-broken-imports
          pnpm run guard:api-binding
          pnpm run guard:backend-api-binding
          pnpm run guard:frontend-feature-binding
          pnpm run guard:runtime-real-bindings
          pnpm run guard:live-cross-journey-integrity
          pnpm run mobile:expo:verify
          pnpm --dir contracts typecheck

      - name: Verify Node code
        id: node_verification
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "full" ]]; then
            pnpm run nx:typecheck
            pnpm run nx:lint
            pnpm run nx:test
            pnpm run nx:build
          else
            pnpm run affected:typecheck
            pnpm run affected:lint
            pnpm run affected:test
            pnpm run affected:build
          fi

      - name: Verify Go code
        id: go_verification
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < <(git ls-files | grep '/go.mod$' | sort)
          for module in "${modules[@]}"; do
            module_dir="$(dirname "${module}")"
            echo "=== ${module_dir} ==="
            (
              cd "${module_dir}"
              go test ./... -count=1
              go build ./...
            )
          done

      - name: Commit repaired live code
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git add --all -- apps core services shared contracts infra tools package.json pnpm-lock.yaml pnpm-workspace.yaml nx.json
          if git diff --cached --quiet; then
            echo "created=false" >> "${GITHUB_OUTPUT}"
            echo "No deterministic live-code change was produced." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git config user.name "bthwani-live-code-remediation[bot]"
          git config user.email "bthwani-live-code-remediation[bot]@users.noreply.github.com"
          git commit -m "fix: apply deterministic live-code remediation"
          echo "created=true" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Push remediation branch and open pull request
        if: ${{ steps.commit.outputs.created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BINDINGS_RESULT: ${{ steps.bindings.outcome }}
          NODE_RESULT: ${{ steps.node_verification.outcome }}
          GO_RESULT: ${{ steps.go_verification.outcome }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --force-with-lease origin "HEAD:${REMEDIATION_BRANCH}"

          cat > /tmp/remediation-pr.md <<EOF
          ## Live-code remediation

          This pull request contains deterministic repairs applied to executable source only.

          - Source ref: \`${SOURCE_REF}\`
          - Mode: \`${{ inputs.mode }}\`
          - Live bindings/imports: \`${BINDINGS_RESULT}\`
          - Node verification: \`${NODE_RESULT}\`
          - Go verification: \`${GO_RESULT}\`

          Markdown documents, governance records, diagnostic folders, and log files were explicitly excluded from automatic modification.
          EOF

          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${REMEDIATION_BRANCH}" \
            --title "fix: remediate live-code failures" \
            --body-file /tmp/remediation-pr.md

      - name: Enforce remediation result
        if: ${{ always() }}
        shell: bash
        env:
          CREATED: ${{ steps.commit.outputs.created }}
          BINDINGS_RESULT: ${{ steps.bindings.outcome }}
          NODE_RESULT: ${{ steps.node_verification.outcome }}
          GO_RESULT: ${{ steps.go_verification.outcome }}
        run: |
          set -euo pipefail
          if [[ "${CREATED}" != "true" ]]; then
            echo "::error title=No safe automatic repair::The workflow found no deterministic code change to commit. Semantic repair is still required."
            exit 1
          fi

          if [[ "${BINDINGS_RESULT}" != "success" || "${NODE_RESULT}" != "success" || "${GO_RESULT}" != "success" ]]; then
            echo "::error title=Remediation PR created with unresolved checks::Review the created pull request and finish the remaining semantic fixes in live code."
            exit 1
          fi

          echo "Deterministic live-code remediation completed and all verification bundles passed."
