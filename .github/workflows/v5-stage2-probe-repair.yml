name: V5 Stage2 Probe Repair

on:
  push:
    branches:
      - task/v5-first-top-logic-gap-20260815

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/v5-first-top-logic-gap-20260815
          fetch-depth: 0

      - name: Reconcile and patch only the faulty DB probe
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin A --quiet
          test "$(git rev-parse origin/A)" = "babc873b6b2e712efbe082e37d1bcec977fc3d8d"
          git diff --quiet a616289043d90f5e8ccf8cb2c4c13dcc43859b1f..HEAD -- .github/workflows/v5-order-actor-provenance-stage2.yml
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/v5-order-actor-provenance-stage2.yml')
          s = p.read_text()
          start = "          BEGIN;\n          ALTER TABLE dsh_order_status_events DISABLE TRIGGER trg_dsh_enrich_order_event;"
          end = "          SELECT CASE\n"
          if s.count(start) != 1 or s.count(end) != 1:
              raise SystemExit('Stage2 DB probe anchors drifted')
          a = s.index(start)
          b = s.index(end, a)
          replacement = '''          BEGIN;\n          CREATE TEMP TABLE dsh_order_status_events_actor_guard_probe\n            (LIKE dsh_order_status_events INCLUDING DEFAULTS INCLUDING CONSTRAINTS);\n          DO $$\n          DECLARE\n            expected_constraint text;\n            raised_constraint text;\n          BEGIN\n            SELECT conname INTO expected_constraint\n            FROM pg_constraint\n            WHERE conrelid='dsh_order_status_events_actor_guard_probe'::regclass\n              AND contype='c'\n              AND position('actor_id' in lower(pg_get_constraintdef(oid))) > 0;\n            IF expected_constraint IS NULL THEN\n              RAISE EXCEPTION 'actor provenance constraint absent from isolated probe';\n            END IF;\n            BEGIN\n              INSERT INTO dsh_order_status_events_actor_guard_probe(\n                order_id,operator_context_id,actor_id,actor_role,from_status,to_status,note\n              ) VALUES (gen_random_uuid(),'ci-dsh','','system','','pending','guard probe');\n              RAISE EXCEPTION 'blank actor_id unexpectedly accepted';\n            EXCEPTION WHEN check_violation THEN\n              GET STACKED DIAGNOSTICS raised_constraint = CONSTRAINT_NAME;\n              IF raised_constraint <> expected_constraint THEN\n                RAISE EXCEPTION 'wrong check constraint: expected %, got %', expected_constraint, raised_constraint;\n              END IF;\n            END;\n          END $$;\n          ROLLBACK;\n\n'''
          p.write_text(s[:a] + replacement + s[b:])
          PY
          git diff --check

      - name: Commit patch and remove repair harness
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v5-stage2-probe-repair.yml
          git add .github/workflows/v5-order-actor-provenance-stage2.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ci: isolate actor provenance DB constraint probe'
          git push origin HEAD:task/v5-first-top-logic-gap-20260815
