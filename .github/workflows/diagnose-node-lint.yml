name: Diagnose Node Lint

on:
  push:
    branches: [reemsam]
    paths: [.github/workflows/diagnose-node-lint.yml]
  pull_request:
    branches: [master]
    paths: [.github/workflows/diagnose-node-lint.yml]

permissions:
  contents: read

jobs:
  diagnose:
    name: Capture affected lint output
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Run affected lint with evidence
        id: lint
        continue-on-error: true
        shell: bash
        env:
          NX_BASE: af26a5979430a8943b70d5539b5e6b2d7c2247aa
          NX_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/lint-diagnostic"
          pnpm run affected:lint 2>&1 | tee "${RUNNER_TEMP}/lint-diagnostic/affected-lint.log"
      - name: Upload lint diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-lint-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/lint-diagnostic/affected-lint.log
          if-no-files-found: error
          retention-days: 2
      - name: Preserve lint result
        if: ${{ steps.lint.outcome == 'failure' }}
        run: exit 1
