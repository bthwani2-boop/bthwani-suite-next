name: FOUNDATION-00 Git Bundle

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["**"]
    paths:
      - ".github/workflows/foundation-00-git-bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    name: Export auditable full-history head bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch reachable pull-request history and create bundle
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if test "$(git rev-parse --is-shallow-repository)" = "true"; then
            git fetch --no-tags --prune --unshallow origin "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          else
            git fetch --no-tags --prune origin "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          fi
          git checkout --detach "${EXPECTED_HEAD_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "$(git rev-list --count HEAD)" -gt 1
          test "$(git rev-list --parents --max-count=1 HEAD | awk '{ print NF }')" -gt 1
          git bundle create "${RUNNER_TEMP}/foundation-00.bundle" HEAD
          git bundle verify "${RUNNER_TEMP}/foundation-00.bundle"
      - name: Upload Git bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-00-git-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/foundation-00.bundle
          if-no-files-found: error
          retention-days: 1
