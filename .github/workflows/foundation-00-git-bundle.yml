name: FOUNDATION-00 Remote Apply

on:
  push:
    branches: [ala]
    paths:
      - ".github/workflows/foundation-00-git-bundle.yml"

permissions:
  contents: write

concurrency:
  group: foundation-00-remote-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply FOUNDATION-00 control-panel contract fix
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ala
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply archived patch, restore workflow, verify and push
        shell: bash
        run: |
          set -euo pipefail
          expected_head="$(git rev-parse HEAD)"
          echo "expected_head=${expected_head}"
          test "${expected_head}" = "${GITHUB_SHA}"

          archived_workflow="${RUNNER_TEMP}/foundation-00-archived-apply.yml"
          patch_file="${RUNNER_TEMP}/foundation-00-control-panel.patch"
          git show c2bc35115473e0b3441d17f3ccb004e8633615ad:.github/workflows/foundation-00-git-bundle.yml > "${archived_workflow}"
          sed -n '/^diff --git /,/^BTHWANI_PATCH_EOF$/p' "${archived_workflow}" | sed '$d' > "${patch_file}"
          test -s "${patch_file}"

          git apply --3way "${patch_file}"
          git show 018da0aa5e4df70ee78c0928301ea34e9d55a90a:.github/workflows/foundation-00-git-bundle.yml > .github/workflows/foundation-00-git-bundle.yml

          pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          pnpm run openapi:generate:all
          node tools/guards/control-panel-architecture-gate.mjs
          node tools/guards/service-workspace-gate.mjs
          node tools/guards/generated-client-provenance-gate.mjs
          pnpm --dir contracts typecheck
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/control-panel/runtime/next.config.ts \
            apps/control-panel/runtime/package.json \
            apps/control-panel/runtime/src/app/dsh \
            apps/control-panel/runtime/src/app/providers.tsx \
            apps/control-panel/runtime/src/components \
            apps/control-panel/runtime/src/shell \
            apps/control-panel/runtime/tsconfig.json \
            apps/control-panel/runtime/tsconfig.cancellation-journey.json \
            apps/control-panel/runtime/tsconfig.order-journey.json \
            apps/control-panel/runtime/tsconfig.partner-journey.json \
            core/identity/package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            services/dsh/frontend/control-panel \
            services/dsh/frontend/shared/_kernel/cp-state.ts \
            services/dsh/package.json \
            shared/control-panel \
            tools/guards/control-panel-architecture-gate.mjs \
            tsconfig.base.json \
            .github/workflows/foundation-00-git-bundle.yml
          git status --short
          git commit -m "fix(control-panel): close DSH architecture contract"
          git push origin HEAD:ala
