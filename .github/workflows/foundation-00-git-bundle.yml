name: FOUNDATION-00 Git Bundle

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["**"]
    paths:
      - ".github/workflows/foundation-00-git-bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    name: Export exact head bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create Git bundle
        shell: bash
        run: git bundle create "${RUNNER_TEMP}/foundation-00.bundle" HEAD
      - name: Upload Git bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-00-git-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/foundation-00.bundle
          if-no-files-found: error
          retention-days: 1
