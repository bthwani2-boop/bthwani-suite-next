name: FOUNDATION-00 Git Bundle

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["**"]
    paths:
      - ".github/workflows/foundation-00-git-bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    name: Export auditable full-history head bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request branch with reachable history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and create self-contained Git bundle
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git rev-list --parents HEAD | grep -q ' '
          git bundle create "${RUNNER_TEMP}/foundation-00.bundle" HEAD
          git bundle verify "${RUNNER_TEMP}/foundation-00.bundle"
      - name: Upload Git bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-00-git-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/foundation-00.bundle
          if-no-files-found: error
          retention-days: 1
