name: BThwani Lockfile Integrity

on:
  pull_request:
    branches: [master]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/**/package.json"
      - "services/**/package.json"
      - "shared/**/package.json"
      - "core/**/package.json"

permissions:
  contents: read

concurrency:
  group: lockfile-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup repository-pinned PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.0

      - name: Setup repository-pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify frozen lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Reject tracked source mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
