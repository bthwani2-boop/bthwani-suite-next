name: BThwani Lockfile Integrity

run-name: ${{ github.event_name == 'pull_request' && format('Lockfile Integrity PR {0}', github.event.pull_request.number) || format('Lockfile Integrity dispatched candidate {0}', inputs.head_sha || github.sha) }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number for exact closure verification
        required: false
        type: string
      head_sha:
        description: Immutable candidate SHA
        required: false
        type: string
      base_sha:
        description: Immutable PR base SHA
        required: false
        type: string
  pull_request:
    branches: ["**"]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/**/package.json"
      - "services/**/package.json"
      - "shared/**/package.json"
      - "core/**/package.json"

permissions:
  contents: read

concurrency:
  group: lockfile-integrity-${{ inputs.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SOURCE_SHA}" ]] || { echo "::error::Lockfile candidate drift"; exit 1; }

      - name: Setup repository-pinned PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.0

      - name: Setup repository-pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify frozen lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Reject tracked source mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
