name: Lockfile Integrity exact-h

on:
  workflow_call:
    inputs:
      head_sha: {type: string, required: true}
      base_sha: {type: string, required: true}

permissions:
  contents: read

concurrency:
  group: lockfile-integrity-h-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frozen lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact h candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Verify exact h candidate and base
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "h" ]] || {
            echo "::error::Lockfile authority is h only"
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${HEAD_SHA}" ]] || {
            echo "::error::Lockfile candidate drift"
            exit 1
          }
          [[ "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Lockfile exact base SHA required"
            exit 1
          }
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"

      - name: Set up immutable Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Reject tracked source mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
