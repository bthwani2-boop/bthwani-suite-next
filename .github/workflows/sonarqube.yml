name: SonarQube Cloud

on:
  pull_request:
    branches: [master, b, c]
    types: [opened, synchronize, reopened]
  push:
    branches: [master, b, c]

permissions:
  contents: read

concurrency:
  group: sonarqube-cloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SonarQube Cloud scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout immutable candidate source with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 0

      - name: Validate SonarQube Cloud token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is not configured. Add the SonarQube Cloud token in GitHub Actions secrets."
            exit 1
          fi

      - name: Set up locked Node runtime for scope routing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Determine affected Sonar coverage scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ -z "${EXPECTED_HEAD_SHA}" || "${HEAD_SHA}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::Sonar checkout SHA mismatch: expected=${EXPECTED_HEAD_SHA:-<empty>} actual=${HEAD_SHA}"
            exit 1
          fi

          BASE_SHA="${PR_BASE_SHA:-}"
          MODE=affected

          if [[ "${EVENT_NAME}" == "push" ]]; then
            MODE=full
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "${HEAD_SHA}")"
          elif [[ -z "${BASE_SHA}" ]]; then
            echo "::error::PR base SHA is required for affected Sonar analysis"
            exit 1
          fi

          CI_BASE_SHA="${BASE_SHA}" \
          CI_HEAD_SHA="${HEAD_SHA}" \
          CI_MODE="${MODE}" \
          node tools/scripts/detect-ci-context.mjs

      - name: Test and plan affected Node coverage
        id: node_coverage_plan
        shell: bash
        env:
          CI_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          CI_HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
          CI_MODE: ${{ steps.scope.outputs.mode }}
        run: |
          set -euo pipefail
          node --test tools/scripts/generate-sonar-node-coverage.test.mjs
          node tools/scripts/generate-sonar-node-coverage.mjs --plan

      - name: Set up immutable Node workspace for affected coverage
        if: ${{ steps.node_coverage_plan.outputs.required == 'true' }}
        uses: ./.github/actions/setup-node-workspace

      - name: Materialize contracts through the Nx owner
        if: ${{ steps.node_coverage_plan.outputs.required == 'true' }}
        run: pnpm exec nx run contracts:materialize

      - name: Generate affected Node LCOV
        id: node_coverage
        if: ${{ steps.node_coverage_plan.outputs.required == 'true' }}
        shell: bash
        env:
          SONAR_NODE_COVERAGE_SUITES: ${{ steps.node_coverage_plan.outputs.suites }}
        run: node tools/scripts/generate-sonar-node-coverage.mjs

      - name: Set up Go for affected coverage
        if: ${{ steps.scope.outputs.dsh == 'true' || steps.scope.outputs.wlt == 'true' || steps.scope.outputs.identity == 'true' || steps.scope.outputs.workforce == 'true' || steps.scope.outputs.platform == 'true' || steps.scope.outputs.providers == 'true' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache: false

      - name: Generate affected Go coverage reports
        id: go_coverage
        if: ${{ steps.scope.outputs.dsh == 'true' || steps.scope.outputs.wlt == 'true' || steps.scope.outputs.identity == 'true' || steps.scope.outputs.workforce == 'true' || steps.scope.outputs.platform == 'true' || steps.scope.outputs.providers == 'true' }}
        shell: bash
        env:
          DSH: ${{ steps.scope.outputs.dsh }}
          WLT: ${{ steps.scope.outputs.wlt }}
          IDENTITY: ${{ steps.scope.outputs.identity }}
          WORKFORCE: ${{ steps.scope.outputs.workforce }}
          PLATFORM: ${{ steps.scope.outputs.platform }}
          PROVIDERS: ${{ steps.scope.outputs.providers }}
        run: |
          set -euo pipefail
          modules=()
          [[ "${WORKFORCE}" == "true" ]] && modules+=(core/workforce/backend)
          [[ "${PROVIDERS}" == "true" ]] && modules+=(core/providers/backend)
          [[ "${IDENTITY}" == "true" ]] && modules+=(core/identity/backend)
          [[ "${PLATFORM}" == "true" ]] && modules+=(core/platform-control/backend)
          [[ "${DSH}" == "true" ]] && modules+=(services/dsh/backend)
          [[ "${WLT}" == "true" ]] && modules+=(services/wlt/backend)

          printf 'Sonar Go coverage modules (%s): %s\n' "${#modules[@]}" "${modules[*]}"
          for module in "${modules[@]}"; do
            report="$GITHUB_WORKSPACE/$module/.sonar/coverage.out"
            raw_report="$GITHUB_WORKSPACE/$module/.sonar/coverage.raw.out"
            mkdir -p "$(dirname "$report")"
            (
              cd "$module"
              go test ./... -coverprofile="$raw_report"
            )
            module_name="$(cd "$module" && go list -m)"
            : > "$report"
            while IFS= read -r coverage_line; do
              case "$coverage_line" in
                "${module_name}/"*)
                  printf '%s/%s\n' "$module" "${coverage_line#"${module_name}/"}" >> "$report"
                  ;;
                *)
                  printf '%s\n' "$coverage_line" >> "$report"
                  ;;
              esac
            done < "$raw_report"
          done
          echo 'scan_args=-Dsonar.go.coverage.reportPaths=**/.sonar/coverage.out' >> "$GITHUB_OUTPUT"

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          args: ${{ steps.node_coverage.outputs.scan_args }} ${{ steps.go_coverage.outputs.scan_args }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
