name: SonarQube exact-h baseline

on:
  workflow_call:
    inputs:
      head_sha: {type: string, required: true}
      base_sha: {type: string, required: true}
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: sonar-h-${{ inputs.head_sha }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ inputs.head_sha }}
  BASE_SHA: ${{ inputs.base_sha }}

jobs:
  baseline:
    name: Sonar full exact-h analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact h candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
          show-progress: false

      - name: Verify exact h identity and ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "h" ]] || {
            echo "::error::Sonar baseline authority is h only"
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${HEAD_SHA}" ]] || {
            echo "::error::Sonar candidate drift"
            exit 1
          }
          [[ "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Sonar exact base SHA required"
            exit 1
          }
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"
          [[ -s sonar-project.properties ]] || {
            echo "::error::Candidate-owned sonar-project.properties is missing"
            exit 1
          }
          project_key="$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties | head -n 1)"
          [[ -n "${project_key}" ]] || {
            echo "::error::Candidate-owned Sonar project key is missing"
            exit 1
          }
          echo "SONAR_PROJECT_KEY=${project_key}" >> "${GITHUB_ENV}"

      - name: Set up immutable Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Verify Sonar coverage ownership
        run: |
          node --test tools/guards/sonar-coverage-ownership-gate.test.mjs
          node tools/guards/sonar-coverage-ownership-gate.mjs
          node --test tools/scripts/generate-sonar-node-coverage.test.mjs

      - name: Materialize canonical contracts
        run: pnpm exec nx run contracts:materialize

      - name: Generate full Node coverage
        shell: bash
        env:
          CI_BASE_SHA: ${{ inputs.base_sha }}
          CI_HEAD_SHA: ${{ inputs.head_sha }}
          CI_MODE: full
        run: |
          set -euo pipefail
          node tools/scripts/generate-sonar-node-coverage.mjs
          [[ -s .sonar/node-coverage/lcov.info ]] || {
            echo "::error::Full Node LCOV evidence is missing"
            exit 1
          }

      - name: Set up locked Go runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache: true
          cache-dependency-path: |
            services/dsh/backend/go.sum
            services/wlt/backend/go.sum
            core/identity/backend/go.sum
            core/workforce/backend/go.sum
            core/platform-control/backend/go.sum
            core/providers/backend/go.sum

      - name: Generate honest full Go coverage
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            services/dsh/backend
            services/wlt/backend
            core/identity/backend
            core/workforce/backend
            core/platform-control/backend
            core/providers/backend
          )
          for module in "${modules[@]}"; do
            mkdir -p "${module}/.sonar"
            raw="${GITHUB_WORKSPACE}/${module}/.sonar/coverage.raw.out"
            report="${GITHUB_WORKSPACE}/${module}/.sonar/coverage.out"
            (
              cd "${module}"
              GOWORK=off go test ./... -count=1 -coverprofile="${raw}"
            )
            [[ -s "${raw}" ]] || {
              echo "::error::Go coverage missing for ${module}"
              exit 1
            }
            module_name="$(cd "${module}" && GOWORK=off go list -m)"
            : > "${report}"
            while IFS= read -r line; do
              case "${line}" in
                "${module_name}/"*)
                  printf '%s/%s\n' "${module}" "${line#"${module_name}/"}" >> "${report}"
                  ;;
                *) printf '%s\n' "${line}" >> "${report}" ;;
              esac
            done < "${raw}"
            grep -q '^mode:' "${report}"
            grep -qv '^mode:' "${report}" || {
              echo "::error::Go coverage has no executable records for ${module}"
              exit 1
            }
          done

      - name: Validate Sonar token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${SONAR_TOKEN}" ]] || {
            echo "::error::SONAR_TOKEN is not configured"
            exit 1
          }

      - name: Scan exact h candidate with candidate-owned configuration
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          args: >-
            -Dsonar.branch.name=h
            -Dsonar.scm.revision=${{ env.HEAD_SHA }}
            -Dsonar.javascript.lcov.reportPaths=.sonar/node-coverage/lcov.info
            -Dsonar.go.coverage.reportPaths=**/.sonar/coverage.out
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Bind Sonar result to exact h SHA and require zero open findings
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          [[ -s .scannerwork/report-task.txt ]] || {
            echo "::error::Sonar report-task.txt is missing"
            exit 1
          }
          ce_task_id="$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt | head -n 1)"
          [[ -n "${ce_task_id}" ]] || {
            echo "::error::Sonar CE task id is missing"
            exit 1
          }
          evidence="${RUNNER_TEMP}/sonar-evidence"
          mkdir -p "${evidence}"

          api_get() {
            local output="$1" endpoint="$2"
            shift 2
            curl --fail-with-body --silent --show-error --retry 4 --retry-delay 3 \
              --connect-timeout 20 --max-time 120 --user "${SONAR_TOKEN}:" \
              --get "https://sonarcloud.io/${endpoint}" "$@" > "${output}"
            jq -e 'type == "object"' "${output}" >/dev/null
          }

          api_get "${evidence}/ce-task.json" api/ce/task --data-urlencode "id=${ce_task_id}"
          jq -e \
            --arg task_id "${ce_task_id}" \
            --arg project "${SONAR_PROJECT_KEY}" \
            '.task.id == $task_id and .task.status == "SUCCESS" and .task.componentKey == $project and (.task.analysisId | type == "string" and length > 0)' \
            "${evidence}/ce-task.json" >/dev/null || {
            echo "::error::Sonar CE task is not a successful exact-project task"
            exit 1
          }
          analysis_id="$(jq -r '.task.analysisId' "${evidence}/ce-task.json")"

          api_get "${evidence}/analyses.json" api/project_analyses/search \
            --data-urlencode "project=${SONAR_PROJECT_KEY}" \
            --data-urlencode "branch=h" \
            --data-urlencode "ps=100"
          jq -e \
            --arg id "${analysis_id}" \
            --arg head "${HEAD_SHA}" \
            '[.analyses[]? | select(.key == $id and .revision == $head)] | length == 1' \
            "${evidence}/analyses.json" >/dev/null || {
            echo "::error::Sonar analysis is not uniquely bound to the exact h candidate"
            exit 1
          }

          api_get "${evidence}/quality-gate.json" api/qualitygates/project_status \
            --data-urlencode "analysisId=${analysis_id}"
          jq -e '.projectStatus.status == "OK"' "${evidence}/quality-gate.json" >/dev/null || {
            echo "::error::Sonar Quality Gate is not OK"
            exit 1
          }

          api_get "${evidence}/issues.json" api/issues/search \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "branch=h" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=1"
          api_get "${evidence}/hotspots.json" api/hotspots/search \
            --data-urlencode "projectKey=${SONAR_PROJECT_KEY}" \
            --data-urlencode "branch=h" \
            --data-urlencode "ps=1"
          issues="$(jq -r '.paging.total // -1' "${evidence}/issues.json")"
          hotspots="$(jq -r '.paging.total // -1' "${evidence}/hotspots.json")"
          [[ "${issues}" == "0" && "${hotspots}" == "0" ]] || {
            echo "::error::Sonar exact-h baseline has unresolved issues=${issues}, hotspots=${hotspots}"
            exit 1
          }

          jq -n \
            --arg headSha "${HEAD_SHA}" \
            --arg baseSha "${BASE_SHA}" \
            --arg analysisId "${analysis_id}" \
            --arg projectKey "${SONAR_PROJECT_KEY}" \
            --argjson issues "${issues}" \
            --argjson hotspots "${hotspots}" \
            '{schema:"bthwani-sonar-exact-h/1",headSha:$headSha,baseSha:$baseSha,analysisId:$analysisId,projectKey:$projectKey,qualityGate:"OK",openIssues:$issues,openHotspots:$hotspots,evidenceComplete:true}' \
            > "${evidence}/summary.json"
          cat "${evidence}/summary.json"

      - name: Upload exact Sonar evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-evidence-${{ env.HEAD_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sonar-evidence
          if-no-files-found: error
          retention-days: 14
