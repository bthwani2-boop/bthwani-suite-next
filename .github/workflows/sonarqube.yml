name: SonarQube Cloud

run-name: >-
  ${{ github.event_name == 'pull_request' && format('SonarQube PR {0}', github.event.pull_request.number) ||
  github.event_name == 'push' && format('SonarQube push {0}', github.sha) || format('SonarQube dispatched
  candidate {0}', inputs.head_sha || github.sha) }}

on:
  workflow_call:
    inputs:
      pr_number: {type: string, required: false, default: ""}
      head_sha: {type: string, required: true}
      base_sha: {type: string, required: true}
      head_ref: {type: string, required: false, default: ""}
      base_ref: {type: string, required: false, default: ""}
      trusted_scan: {type: boolean, required: false, default: false}
      full_scope: {type: boolean, required: false, default: false}
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarqube-cloud-${{ inputs.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Resolve exact Sonar candidate scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      base_sha: ${{ steps.ci_scope.outputs.base_sha }}
      head_sha: ${{ steps.ci_scope.outputs.head_sha }}
      mode: ${{ steps.ci_scope.outputs.mode }}
      dsh: ${{ steps.ci_scope.outputs.dsh }}
      wlt: ${{ steps.ci_scope.outputs.wlt }}
      identity: ${{ steps.ci_scope.outputs.identity }}
      workforce: ${{ steps.ci_scope.outputs.workforce }}
      platform: ${{ steps.ci_scope.outputs.platform }}
      providers: ${{ steps.ci_scope.outputs.providers }}
      node_required: ${{ steps.node_plan.outputs.required }}
      node_suites: ${{ steps.node_plan.outputs.suites }}
      go_required: ${{ steps.go_plan.outputs.required }}
      go_matrix: ${{ steps.go_plan.outputs.matrix }}
      sonar_required: ${{ steps.ci_scope.outputs.sonar_required }}
    steps:
      - name: Checkout immutable candidate source with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 0
      - name: Materialize exact candidate without untrusted checkout action
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::candidate SHA must be exact"; exit 1; }
          git fetch --no-tags origin "${CANDIDATE_SHA}" --depth=1
          git checkout --detach "${CANDIDATE_SHA}"
          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]] || { echo "::error::candidate materialization drift"; exit 1; }

      - name: Set up locked Node runtime for scope routing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"

      - name: Verify Sonar coverage ownership and configuration
        run: node --test tools/guards/sonar-coverage-ownership-gate.test.mjs && node tools/guards/sonar-coverage-ownership-gate.mjs

      - name: Determine exact affected Sonar scope
        id: ci_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          INPUT_FULL_SCOPE: ${{ inputs.full_scope }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          [[ -n "${EXPECTED_HEAD_SHA}" && "${head_sha}" == "${EXPECTED_HEAD_SHA}" ]] || {
            echo "::error::Sonar checkout SHA mismatch: expected=${EXPECTED_HEAD_SHA:-<empty>} actual=${head_sha}"
            exit 1
          }

          base_sha="${PR_BASE_SHA:-${EVENT_BEFORE:-}}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "${head_sha}")"
          fi
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${base_sha}" --depth=1
          fi
          git cat-file -e "${base_sha}^{commit}" 2>/dev/null || {
            echo "::error::Sonar base SHA cannot be resolved: ${base_sha}"
            exit 1
          }

          mode=affected
          if [[ "${INPUT_FULL_SCOPE}" == "true" || \
                ( "${EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ) || \
                ( "${EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ) ]]; then
            mode=full
          fi

          CI_BASE_SHA="${base_sha}" \
          CI_HEAD_SHA="${head_sha}" \
          CI_MODE="${mode}" \
          node tools/scripts/detect-ci-context.mjs
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Test and plan exact Node coverage
        id: node_plan
        shell: bash
        env:
          CI_BASE_SHA: ${{ steps.ci_scope.outputs.base_sha }}
          CI_HEAD_SHA: ${{ steps.ci_scope.outputs.head_sha }}
          CI_MODE: ${{ steps.ci_scope.outputs.mode }}
        run: |
          set -euo pipefail
          node --test tools/scripts/generate-sonar-node-coverage.test.mjs
          node tools/scripts/generate-sonar-node-coverage.mjs --plan

      - name: Plan exact Go coverage matrix
        id: go_plan
        shell: bash
        env:
          MODE: ${{ steps.ci_scope.outputs.mode }}
          TRUSTED_SCAN: ${{ inputs.trusted_scan }}
          DSH: ${{ steps.ci_scope.outputs.dsh }}
          WLT: ${{ steps.ci_scope.outputs.wlt }}
          IDENTITY: ${{ steps.ci_scope.outputs.identity }}
          WORKFORCE: ${{ steps.ci_scope.outputs.workforce }}
          PLATFORM: ${{ steps.ci_scope.outputs.platform }}
          PROVIDERS: ${{ steps.ci_scope.outputs.providers }}
        run: |
          set -euo pipefail
          services=()
          if [[ "${MODE}" == "full" && "${TRUSTED_SCAN}" == "true" ]]; then
            services=(dsh wlt identity workforce platform providers)
          else
            [[ "${DSH}" == "true" ]] && services+=(dsh)
            [[ "${WLT}" == "true" ]] && services+=(wlt)
            [[ "${IDENTITY}" == "true" ]] && services+=(identity)
            [[ "${WORKFORCE}" == "true" ]] && services+=(workforce)
            [[ "${PLATFORM}" == "true" ]] && services+=(platform)
            [[ "${PROVIDERS}" == "true" ]] && services+=(providers)
          fi

          if (( ${#services[@]} == 0 )); then
            echo 'required=false' >> "${GITHUB_OUTPUT}"
            echo 'matrix=["none"]' >> "${GITHUB_OUTPUT}"
          else
            matrix="$(printf '%s\n' "${services[@]}" | jq -R . | jq -s -c .)"
            echo 'required=true' >> "${GITHUB_OUTPUT}"
            echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish Sonar scope summary
        shell: bash
        env:
          BASE_SHA: ${{ steps.ci_scope.outputs.base_sha }}
          HEAD_SHA: ${{ steps.ci_scope.outputs.head_sha }}
          MODE: ${{ steps.ci_scope.outputs.mode }}
          NODE_REQUIRED: ${{ steps.node_plan.outputs.required }}
          NODE_SUITES: ${{ steps.node_plan.outputs.suites }}
          GO_REQUIRED: ${{ steps.go_plan.outputs.required }}
          GO_MATRIX: ${{ steps.go_plan.outputs.matrix }}
        run: |
          {
            echo "### Exact Sonar scope"
            echo "- Base: ${BASE_SHA}"
            echo "- Head: ${HEAD_SHA}"
            echo "- Mode: ${MODE}"
            echo "- Node coverage required: ${NODE_REQUIRED}"
            echo "- Node suites: ${NODE_SUITES:-none}"
            echo "- Go coverage required: ${GO_REQUIRED}"
            echo "- Go services: ${GO_MATRIX}"
          } >> "${GITHUB_STEP_SUMMARY}"

  node_coverage:
    name: Sonar Node coverage
    needs: [scope]
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.sonar_required == 'true' && needs.scope.outputs.node_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable Node coverage candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Materialize exact Node candidate without untrusted checkout action
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${CANDIDATE_SHA}" --depth=1
          git checkout --detach "${CANDIDATE_SHA}"
          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]] || { echo "::error::candidate materialization drift"; exit 1; }

      - name: Verify exact Node coverage candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SHA}" ]] || {
            echo "::error::Node coverage candidate drift"
            exit 1
          }

      - name: Set up immutable Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Restore Sonar Node Nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: sonar-node-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'tools/verification/ownership.manifest.json') }}-${{ needs.scope.outputs.head_sha }}
          restore-keys: |
            sonar-node-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'tools/verification/ownership.manifest.json') }}-
            nx-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-

      - name: Materialize contracts through the Nx owner
        run: pnpm exec nx run contracts:materialize

      - name: Generate exact affected Node LCOV
        shell: bash
        env:
          SONAR_NODE_COVERAGE_SUITES: ${{ needs.scope.outputs.node_suites }}
        run: |
          set -euo pipefail
          node tools/scripts/generate-sonar-node-coverage.mjs
          [[ -s .sonar/node-coverage/lcov.info ]] || {
            echo "::error::Node coverage report is missing or empty"
            exit 1
          }

      - name: Collect exact Node coverage artifact
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.scope.outputs.head_sha }}
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
          MODE: ${{ needs.scope.outputs.mode }}
          SUITES: ${{ needs.scope.outputs.node_suites }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sonar-node-evidence"
          mkdir -p "${evidence}/reports/.sonar/node-coverage"
          cp -a .sonar/node-coverage/. "${evidence}/reports/.sonar/node-coverage/"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg candidateSha "${CANDIDATE_SHA}" \
            --arg baseSha "${BASE_SHA}" \
            --arg mode "${MODE}" \
            --arg suites "${SUITES}" \
            '{schemaVersion:1,kind:"node",repository:$repository,candidateSha:$candidateSha,baseSha:$baseSha,mode:$mode,suites:($suites|split(",")|map(select(length>0)))}' \
            > "${evidence}/manifest.json"

      - name: Upload exact Node coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-node-coverage-${{ needs.scope.outputs.head_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sonar-node-evidence
          if-no-files-found: error
          # Reports live under hidden .sonar/ paths; preserve them in the artifact.
          include-hidden-files: true
          retention-days: 2

  go_coverage:
    name: Sonar Go coverage (${{ matrix.service }})
    needs: [scope]
    if: ${{ needs.scope.result == 'success' && needs.scope.outputs.sonar_required == 'true' && needs.scope.outputs.go_required == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.scope.outputs.go_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable Go coverage candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Materialize exact Go candidate without untrusted checkout action
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${CANDIDATE_SHA}" --depth=1
          git checkout --detach "${CANDIDATE_SHA}"
          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]] || { echo "::error::candidate materialization drift"; exit 1; }

      - name: Verify exact Go coverage candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SHA}" ]] || {
            echo "::error::Go coverage candidate drift"
            exit 1
          }

      - name: Set up locked Go runtime with dependency cache
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache: true
          cache-dependency-path: |
            services/dsh/backend/go.sum
            services/wlt/backend/go.sum
            core/identity/backend/go.sum
            core/workforce/backend/go.sum
            core/platform-control/backend/go.sum
            core/providers/backend/go.sum

      - name: Provision only the selected governed database topology
        id: database
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          CANDIDATE_SHA: ${{ needs.scope.outputs.head_sha }}
          PASSWORD: bthwani_ci_ephemeral_coverage
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

          start_db() {
            local container="$1" image="$2" user="$3" database="$4" port="$5"
            docker run -d --rm \
              --name "${container}" \
              -e POSTGRES_USER="${user}" \
              -e POSTGRES_PASSWORD="${PASSWORD}" \
              -e POSTGRES_DB="${database}" \
              -p "${port}:5432" \
              "${image}" >/dev/null
            ready=false
            for _ in $(seq 1 40); do
              if docker exec "${container}" pg_isready -U "${user}" -d "${database}" >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 2
            done
            [[ "${ready}" == "true" ]] || {
              echo "::error::Database ${database} did not become ready"
              docker logs "${container}" || true
              exit 1
            }
          }

          migrate() {
            local service="$1" directory="$2" database_url="$3" identity_database_url="${4:-}"
            if [[ "${service}" == "workforce" ]]; then
              pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-service-migrations.ps1 \
                -ServiceKey "${service}" -MigrationDirectory "${directory}" \
                -DatabaseUrl "${database_url}" -IdentityDatabaseUrl "${identity_database_url}" \
                -SourceCommitSha "${CANDIDATE_SHA}"
            else
              pwsh -NoProfile -ExecutionPolicy Bypass -File tools/scripts/invoke-service-migrations.ps1 \
                -ServiceKey "${service}" -MigrationDirectory "${directory}" \
                -DatabaseUrl "${database_url}" -SourceCommitSha "${CANDIDATE_SHA}"
            fi
          }

          actor_placeholders="${RUNNER_TEMP}/go-coverage-actor-placeholders.json"
          cat > "${actor_placeholders}" <<'JSON'
          {
            "FIELD_ACTOR_ID": "ci-field-actor-001",
            "CAPTAIN_ACTOR_ID": "ci-captain-actor-001",
            "WLT_PAYOUT_ENCRYPTION_KEY": "ci-sonar-coverage-payout-encryption-key"
          }
          JSON

          case "${SERVICE}" in
            dsh)
              start_db sonar-dsh-db postgis/postgis:16-3.4-alpine dsh_runtime dsh_runtime 5433
              database_url="postgres://dsh_runtime:${PASSWORD}@127.0.0.1:5433/dsh_runtime?sslmode=disable"
              migrate dsh services/dsh/database/migrations "${database_url}"
              BTHWANI_ENVIRONMENT=ci pwsh -NoProfile -ExecutionPolicy Bypass -File \
                tools/scripts/invoke-service-seeds.ps1 \
                -ServiceKey dsh -SeedDirectory services/dsh/database/seeds/local -Transport url \
                -DatabaseUrl "${database_url}" -PlaceholderFile "${actor_placeholders}" \
                -AllowLocalSeeds -SourceCommitSha "${CANDIDATE_SHA}"
              ;;
            wlt)
              start_db sonar-wlt-db postgres:16-alpine wlt_runtime wlt_runtime 5434
              database_url="postgres://wlt_runtime:${PASSWORD}@127.0.0.1:5434/wlt_runtime?sslmode=disable"
              migrate wlt services/wlt/database/migrations "${database_url}"
              BTHWANI_ENVIRONMENT=ci pwsh -NoProfile -ExecutionPolicy Bypass -File \
                tools/scripts/invoke-service-seeds.ps1 \
                -ServiceKey wlt -SeedDirectory services/wlt/database/seeds/local -Transport url \
                -DatabaseUrl "${database_url}" -PlaceholderFile "${actor_placeholders}" \
                -AllowLocalSeeds -SourceCommitSha "${CANDIDATE_SHA}"
              ;;
            identity)
              start_db sonar-identity-db postgres:16-alpine identity_runtime identity_runtime 5435
              database_url="postgres://identity_runtime:${PASSWORD}@127.0.0.1:5435/identity_runtime?sslmode=disable"
              migrate identity core/identity/database/migrations "${database_url}"
              ;;
            workforce)
              start_db sonar-workforce-identity-db postgres:16-alpine identity_runtime identity_runtime 5435
              start_db sonar-workforce-db postgres:16-alpine workforce_runtime workforce_runtime 5436
              identity_url="postgres://identity_runtime:${PASSWORD}@127.0.0.1:5435/identity_runtime?sslmode=disable"
              database_url="postgres://workforce_runtime:${PASSWORD}@127.0.0.1:5436/workforce_runtime?sslmode=disable"
              migrate identity core/identity/database/migrations "${identity_url}"
              migrate workforce core/workforce/database/migrations "${database_url}" "${identity_url}"
              ;;
            platform)
              start_db sonar-platform-db postgres:16-alpine platform_control_runtime platform_control_runtime 5437
              database_url="postgres://platform_control_runtime:${PASSWORD}@127.0.0.1:5437/platform_control_runtime?sslmode=disable"
              migrate platform-control core/platform-control/database/migrations "${database_url}"
              ;;
            providers)
              start_db sonar-providers-db postgres:16-alpine providers_runtime providers_runtime 5438
              database_url="postgres://providers_runtime:${PASSWORD}@127.0.0.1:5438/providers_runtime?sslmode=disable"
              migrate providers core/providers/database/migrations "${database_url}"
              ;;
            *)
              echo "::error::Unknown Sonar Go coverage service: ${SERVICE}"
              exit 1
              ;;
          esac

          echo "database_url=${database_url}" >> "${GITHUB_OUTPUT}"

      - name: Generate normalized exact Go coverage report
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          DATABASE_URL: ${{ steps.database.outputs.database_url }}
        run: |
          set -euo pipefail
          case "${SERVICE}" in
            dsh) module="services/dsh/backend" ;;
            wlt) module="services/wlt/backend" ;;
            identity) module="core/identity/backend" ;;
            workforce) module="core/workforce/backend" ;;
            platform) module="core/platform-control/backend" ;;
            providers) module="core/providers/backend" ;;
            *) echo "::error::Unknown Go module service ${SERVICE}"; exit 1 ;;
          esac

          report="${GITHUB_WORKSPACE}/${module}/.sonar/coverage.out"
          raw_report="${GITHUB_WORKSPACE}/${module}/.sonar/coverage.raw.out"
          mkdir -p "$(dirname "${report}")"

          (
            cd "${module}"
            case "${SERVICE}" in
              identity)
                IDENTITY_REQUIRE_DB_TESTS=true DATABASE_URL="${DATABASE_URL}" \
                  go test ./... -coverprofile="${raw_report}"
                ;;
              workforce)
                WORKFORCE_REQUIRE_DB_TESTS=true DATABASE_URL="${DATABASE_URL}" \
                  go test ./... -coverprofile="${raw_report}"
                ;;
              dsh)
                DSH_REQUIRE_DB_TESTS=true DSH_TEST_operator_context_id=local-dsh DATABASE_URL="${DATABASE_URL}" \
                  go test ./... -coverprofile="${raw_report}"
                ;;
              wlt)
                WLT_REQUIRE_DB_TESTS=true BTHWANI_OPERATOR_CONTEXT_ID=local-dsh DATABASE_URL="${DATABASE_URL}" \
                  go test ./... -coverprofile="${raw_report}"
                ;;
              platform)
                DATABASE_URL="${DATABASE_URL}" go test ./... -coverprofile="${raw_report}"
                ;;
              providers)
                DATABASE_TEST=1 DATABASE_URL="${DATABASE_URL}" go test ./... -coverprofile="${raw_report}"
                ;;
            esac
          )

          [[ -s "${raw_report}" ]] || {
            echo "::error::Go coverage report is empty for ${module}"
            exit 1
          }
          grep -qv '^mode:' "${raw_report}" || {
            echo "::error::Go coverage report has no executable records for ${module}"
            exit 1
          }
          raw_summary="$(cd "${module}" && go tool cover -func="${raw_report}")"
          grep -q '^total:' <<<"${raw_summary}" || {
            echo "::error::Go coverage report has no total summary for ${module}"
            exit 1
          }

          module_name="$(cd "${module}" && go list -m)"
          : > "${report}"
          while IFS= read -r coverage_line; do
            case "${coverage_line}" in
              "${module_name}/"*)
                printf '%s/%s\n' "${module}" "${coverage_line#"${module_name}/"}" >> "${report}"
                ;;
              *)
                printf '%s\n' "${coverage_line}" >> "${report}"
                ;;
            esac
          done < "${raw_report}"

          [[ -s "${report}" ]] || {
            echo "::error::Normalized Go coverage report is empty for ${module}"
            exit 1
          }
          grep -qv '^mode:' "${report}" || {
            echo "::error::Normalized Go coverage report has no executable records for ${module}"
            exit 1
          }
          normalized_summary="$(go tool cover -func="${report}")"
          grep -q '^total:' <<<"${normalized_summary}" || {
            echo "::error::Normalized Go coverage report has no total summary for ${module}"
            exit 1
          }

          evidence="${RUNNER_TEMP}/sonar-go-evidence"
          mkdir -p "${evidence}/reports/${module}/.sonar"
          cp -- "${report}" "${evidence}/reports/${module}/.sonar/coverage.out"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg candidateSha "${{ needs.scope.outputs.head_sha }}" \
            --arg baseSha "${{ needs.scope.outputs.base_sha }}" \
            --arg mode "${{ needs.scope.outputs.mode }}" \
            --arg service "${SERVICE}" \
            --arg module "${module}" \
            '{schemaVersion:1,kind:"go",repository:$repository,candidateSha:$candidateSha,baseSha:$baseSha,mode:$mode,service:$service,module:$module}' \
            > "${evidence}/manifest.json"

      - name: Upload exact Go coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-go-coverage-${{ matrix.service }}-${{ needs.scope.outputs.head_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sonar-go-evidence
          if-no-files-found: error
          # Reports live under hidden .sonar/ paths; preserve them in the artifact.
          include-hidden-files: true
          retention-days: 2

  assemble:
    name: Assemble exact Sonar coverage evidence
    needs: [scope, node_coverage, go_coverage]
    if: >-
      ${{ always() && needs.scope.result == 'success' &&
      (needs.scope.outputs.sonar_required != 'true' ||
      ((needs.scope.outputs.node_required != 'true' || needs.node_coverage.result == 'success') &&
      (needs.scope.outputs.go_required != 'true' || needs.go_coverage.result == 'success'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download, bind, and merge exact coverage parts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
          MODE: ${{ needs.scope.outputs.mode }}
          NODE_REQUIRED: ${{ needs.scope.outputs.node_required }}
          GO_REQUIRED: ${{ needs.scope.outputs.go_required }}
          GO_MATRIX: ${{ needs.scope.outputs.go_matrix }}
          SONAR_REQUIRED: ${{ needs.scope.outputs.sonar_required }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sonar-coverage-evidence"
          parts_file="${RUNNER_TEMP}/sonar-coverage-parts.jsonl"
          mkdir -p "${evidence}/reports"
          : > "${parts_file}"
          if [[ "${SONAR_REQUIRED}" != "true" ]]; then
            NODE_REQUIRED=false
            GO_REQUIRED=false
            GO_MATRIX='[]'
          fi

          artifacts_json() {
            gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
          }

          download_exact() {
            local name="$1" kind="$2" service="${3:-}"
            local artifact_id=""
            for _ in $(seq 1 20); do
              artifact_id="$(artifacts_json | jq -r --arg name "${name}" \
                '[.artifacts[] | select(.name == $name)] | if length == 1 then .[0].id else empty end')"
              [[ "${artifact_id}" =~ ^[0-9]+$ ]] && break
              sleep 2
            done
            [[ "${artifact_id}" =~ ^[0-9]+$ ]] || {
              echo "::error::Expected Sonar coverage artifact not found exactly once: ${name}"
              exit 1
            }

            archive="${RUNNER_TEMP}/${name}.zip"
            destination="${RUNNER_TEMP}/${name}"
            mkdir -p "${destination}"
            gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${archive}"

            while IFS= read -r entry; do
              [[ -n "${entry}" && "${entry}" != ".." && "${entry}" != /* && "${entry}" != ../* && \
                 "${entry}" != */../* && "${entry}" != */.. ]] || {
                echo "::error::Unsafe Sonar artifact path in ${name}"
                exit 1
              }
            done < <(unzip -Z1 "${archive}")
            unzip -q "${archive}" -d "${destination}"
            if find "${destination}" -type l -print -quit | grep -q .; then
              echo "::error::Symlink found in Sonar coverage artifact ${name}"
              exit 1
            fi

            if [[ "${kind}" == "node" ]]; then
              jq -e \
                --arg repository "${GITHUB_REPOSITORY}" \
                --arg head "${HEAD_SHA}" \
                --arg base "${BASE_SHA}" \
                '.schemaVersion==1 and .kind=="node" and .repository==$repository and .candidateSha==$head and .baseSha==$base' \
                "${destination}/manifest.json" >/dev/null
            else
              jq -e \
                --arg repository "${GITHUB_REPOSITORY}" \
                --arg head "${HEAD_SHA}" \
                --arg base "${BASE_SHA}" \
                --arg service "${service}" \
                '.schemaVersion==1 and .kind=="go" and .repository==$repository and .candidateSha==$head and .baseSha==$base and .service==$service' \
                "${destination}/manifest.json" >/dev/null
            fi

            if [[ -d "${destination}/reports" ]]; then
              cp -a "${destination}/reports/." "${evidence}/reports/"
            fi
            sha256="$(sha256sum "${archive}" | awk '{print $1}')"
            jq -nc --arg name "${name}" --arg kind "${kind}" --arg service "${service}" --arg sha256 "${sha256}" \
              '{name:$name,kind:$kind,service:($service|select(length>0)),sha256:$sha256}' >> "${parts_file}"
          }

          if [[ "${NODE_REQUIRED}" == "true" ]]; then
            download_exact "sonar-node-coverage-${HEAD_SHA}-${GITHUB_RUN_ID}" node
          fi

          if [[ "${GO_REQUIRED}" == "true" ]]; then
            while IFS= read -r service; do
              [[ -n "${service}" && "${service}" != "none" ]] || continue
              download_exact "sonar-go-coverage-${service}-${HEAD_SHA}-${GITHUB_RUN_ID}" go "${service}"
            done < <(jq -r '.[]' <<<"${GO_MATRIX}")
          fi

          jq -s '.' "${parts_file}" > "${RUNNER_TEMP}/parts.json"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg candidateSha "${HEAD_SHA}" \
            --arg baseSha "${BASE_SHA}" \
            --arg mode "${MODE}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg nodeRequired "${NODE_REQUIRED}" \
            --argjson goServices "${GO_MATRIX}" \
            --slurpfile parts "${RUNNER_TEMP}/parts.json" \
            '{schemaVersion:2,repository:$repository,candidateSha:$candidateSha,baseSha:$baseSha,mode:$mode,workflowRunId:$runId,nodeRequired:($nodeRequired=="true"),goServices:$goServices,parts:$parts[0]}' \
            > "${evidence}/manifest.json"

      - name: Upload canonical exact coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-coverage-${{ needs.scope.outputs.head_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sonar-coverage-evidence
          if-no-files-found: error
          # Reports live under hidden .sonar/ paths; preserve them in the artifact.
          include-hidden-files: true
          retention-days: 2

  scan:
    name: SonarQube trusted static analysis
    needs: [scope, assemble]
    if: ${{ always() && inputs.trusted_scan && needs.scope.result == 'success' && needs.scope.outputs.sonar_required == 'true' && needs.assemble.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout immutable candidate without executing repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          # Sonar needs complete history for SCM blame and new-code accuracy.
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Materialize exact scan candidate without untrusted checkout action
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::candidate SHA must be exact"; exit 1; }
          git fetch --no-tags origin "${CANDIDATE_SHA}" --depth=1
          git checkout --detach "${CANDIDATE_SHA}"
          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]] || { echo "::error::candidate materialization drift"; exit 1; }

      - name: Revalidate trusted definition and candidate
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.scope.outputs.base_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_call" ]]; then
            [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]] || {
              echo "::error::secret-bearing Sonar analysis requires the default-branch workflow definition"
              exit 1
            }
          fi
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_HEAD_SHA}" ]] || {
            echo "::error::Sonar trusted scan checkout drift"
            exit 1
          }
          if [[ -n "${PR_NUMBER:-}" ]]; then
            pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            [[ "$(jq -r '.head.sha' <<<"${pr}")" == "${EXPECTED_HEAD_SHA}" ]] || {
              echo "::error::Sonar PR head drift"
              exit 1
            }
            [[ "$(jq -r '.base.sha' <<<"${pr}")" == "${EXPECTED_BASE_SHA}" ]] || {
              echo "::error::Sonar PR base drift"
              exit 1
            }
          fi

      - name: Download and validate canonical exact coverage evidence
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.scope.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="sonar-coverage-${EXPECTED_HEAD_SHA}-${GITHUB_RUN_ID}"
          artifacts="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(jq -r --arg name "${name}" \
            '[.artifacts[] | select(.name == $name)] | if length == 1 then .[0].id else empty end' <<<"${artifacts}")"
          [[ "${artifact_id}" =~ ^[0-9]+$ ]] || {
            echo "::error::Canonical Sonar coverage artifact missing or ambiguous"
            exit 1
          }

          archive="${RUNNER_TEMP}/sonar-coverage.zip"
          destination="${RUNNER_TEMP}/sonar-coverage"
          mkdir -p "${destination}"
          gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${archive}"
          while IFS= read -r entry; do
            [[ -n "${entry}" && "${entry}" != ".." && "${entry}" != /* && "${entry}" != ../* && \
               "${entry}" != */../* && "${entry}" != */.. ]] || {
              echo "::error::unsafe canonical Sonar coverage artifact path"
              exit 1
            }
          done < <(unzip -Z1 "${archive}")
          unzip -q "${archive}" -d "${destination}"
          if find "${destination}" -type l -print -quit | grep -q .; then
            echo "::error::canonical Sonar coverage artifact contains a symlink"
            exit 1
          fi
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg head "${EXPECTED_HEAD_SHA}" \
            --arg base "${EXPECTED_BASE_SHA}" \
            '.schemaVersion==2 and .repository==$repository and .candidateSha==$head and .baseSha==$base' \
            "${destination}/manifest.json" >/dev/null
          if [[ -d "${destination}/reports" ]]; then
            cp -a "${destination}/reports/." "${GITHUB_WORKSPACE}/"
          fi

      - name: Fetch trusted Sonar project settings without checkout
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted="${RUNNER_TEMP}/trusted-sonar-project.properties"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/sonar-project.properties" -f "ref=${DEFAULT_BRANCH}" --jq '.content' |
            base64 --decode > "${trusted}"
          [[ -s "${trusted}" ]] || {
            echo "::error::trusted Sonar settings missing"
            exit 1
          }
          rm -f -- "${GITHUB_WORKSPACE}/sonar-project.properties"
          install -m 0600 -- "${trusted}" "${GITHUB_WORKSPACE}/sonar-project.properties"
          [[ -f "${GITHUB_WORKSPACE}/sonar-project.properties" && ! -L "${GITHUB_WORKSPACE}/sonar-project.properties" ]] || {
            echo "::error::trusted Sonar settings were not installed as a regular file"
            exit 1
          }
          if find "${GITHUB_WORKSPACE}" -type l -print -quit | grep -q .; then
            echo "::error::candidate or coverage artifact contains a symlink; secret-bearing Sonar scan refused"
            exit 1
          fi

      - name: Validate SonarQube Cloud token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          [[ -n "${SONAR_TOKEN}" ]] || {
            echo "::error::SONAR_TOKEN is not configured"
            exit 1
          }

      - name: SonarQube Cloud trusted scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          args: >-
            ${{ inputs.pr_number && format('-Dsonar.pullrequest.key={0}', inputs.pr_number) || '' }}
            ${{ inputs.base_ref && format('-Dsonar.pullrequest.base={0}', inputs.base_ref) || '' }}
            ${{ inputs.head_ref && format('-Dsonar.pullrequest.branch={0}', inputs.head_ref) || '' }}
            ${{ inputs.head_sha && format('-Dsonar.scm.revision={0}', inputs.head_sha) || '' }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            ${{ needs.scope.outputs.node_required == 'true' && '-Dsonar.javascript.lcov.reportPaths=.sonar/node-coverage/lcov.info' || '' }}
            ${{ needs.scope.outputs.go_required == 'true' && '-Dsonar.go.coverage.reportPaths=**/.sonar/coverage.out' || '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  evidence:
    name: Consume Sonar evidence
    needs: [scope, scan]
    # Consume the remote API evidence even when the scanner failed; the result
    # job still requires a successful scanner and a clean consumed evidence set.
    if: ${{ always() && inputs.trusted_scan && needs.scope.result == 'success' && needs.scope.outputs.sonar_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
      BASE_SHA: ${{ needs.scope.outputs.base_sha }}
      MODE: ${{ needs.scope.outputs.mode }}
      PR_NUMBER: ${{ inputs.pr_number }}
      BRANCH_NAME: ${{ inputs.head_ref || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Load trusted Sonar evidence classifier
        shell: bash
        run: |
          set -euo pipefail
          trusted_classifier="${RUNNER_TEMP}/classify-sonar-evidence.mjs"
          trusted_properties="${RUNNER_TEMP}/sonar-project.properties"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/tools/scripts/classify-sonar-evidence.mjs" \
            -f "ref=${DEFAULT_BRANCH}" --jq '.content' | base64 --decode > "${trusted_classifier}"
          gh api --method GET -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/contents/sonar-project.properties" \
            -f "ref=${DEFAULT_BRANCH}" --jq '.content' | base64 --decode > "${trusted_properties}"
          [[ -s "${trusted_classifier}" ]] || { echo "::error::trusted Sonar evidence classifier missing"; exit 1; }
          [[ -s "${trusted_properties}" ]] || { echo "::error::trusted Sonar project settings missing"; exit 1; }
          node --check "${trusted_classifier}"
          project_key="$(sed -n 's/^sonar\.projectKey=//p' "${trusted_properties}" | head -n 1)"
          [[ -n "${project_key}" ]] || { echo "::error::trusted Sonar project key missing"; exit 1; }
          echo "TRUSTED_SONAR_CLASSIFIER=${trusted_classifier}" >> "${GITHUB_ENV}"
          echo "SONAR_PROJECT_KEY=${project_key}" >> "${GITHUB_ENV}"

      - name: Retrieve raw Sonar evidence for the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sonar-evidence"
          mkdir -p "${evidence}/raw"
          : > "${evidence}/warnings.log"
          [[ -n "${SONAR_TOKEN}" ]] || { echo "::error::SONAR_TOKEN is not configured"; exit 1; }

          quality_gate_args=(--data-urlencode "projectKey=${SONAR_PROJECT_KEY}")
          issues_args=(--data-urlencode "componentKeys=${SONAR_PROJECT_KEY}")
          hotspots_args=(--data-urlencode "projectKey=${SONAR_PROJECT_KEY}")
          measures_args=(--data-urlencode "component=${SONAR_PROJECT_KEY}")
          analysis_args=(--data-urlencode "project=${SONAR_PROJECT_KEY}")
          if [[ -n "${PR_NUMBER}" ]]; then
            quality_gate_args+=(--data-urlencode "pullRequest=${PR_NUMBER}")
            issues_args+=(--data-urlencode "pullRequest=${PR_NUMBER}")
            hotspots_args+=(--data-urlencode "pullRequest=${PR_NUMBER}")
            measures_args+=(--data-urlencode "pullRequest=${PR_NUMBER}")
            analysis_args+=(--data-urlencode "pullRequest=${PR_NUMBER}")
          else
            quality_gate_args+=(--data-urlencode "branch=${BRANCH_NAME}")
            issues_args+=(--data-urlencode "branch=${BRANCH_NAME}")
            hotspots_args+=(--data-urlencode "branch=${BRANCH_NAME}")
            measures_args+=(--data-urlencode "branch=${BRANCH_NAME}")
            analysis_args+=(--data-urlencode "branch=${BRANCH_NAME}")
          fi

          request_json() {
            local target="$1" name="$2" endpoint="$3"
            shift 3
            if ! curl --fail-with-body --silent --show-error --retry 4 --retry-delay 3 \
              --connect-timeout 20 --max-time 120 --user "${SONAR_TOKEN}:" \
              --get "https://sonarcloud.io/${endpoint}" "$@" > "${target}"; then
              echo "${name}: Sonar API request failed" >> "${evidence}/warnings.log"
              printf '%s\n' '{}' > "${target}"
              return 1
            fi
            if ! jq -e 'type == "object"' "${target}" >/dev/null 2>&1; then
              echo "${name}: Sonar API response was not a JSON object" >> "${evidence}/warnings.log"
              printf '%s\n' '{}' > "${target}"
              return 1
            fi
            return 0
          }

          fetch_json() {
            local name="$1" endpoint="$2"
            shift 2
            request_json "${evidence}/raw/${name}.json" "${name}" "${endpoint}" "$@" || true
          }

          fetch_paged_json() {
            local name="$1" endpoint="$2" array_key="$3"
            shift 3
            local page=1 page_size=500 total=0 collected='[]' collected_count=0 current_count=0
            while :; do
              local page_file="${evidence}/raw/${name}.page-${page}.json"
              if ! request_json "${page_file}" "${name}[page=${page}]" "${endpoint}" \
                "$@" --data-urlencode "ps=${page_size}" --data-urlencode "p=${page}"; then
                cp "${page_file}" "${evidence}/raw/${name}.json"
                return 0
              fi
              if ! jq -e --arg key "${array_key}" \
                '.paging and (.paging.total | numbers) and (.[$key] | type == "array")' \
                "${page_file}" >/dev/null; then
                echo "${name}[page=${page}]: paging.total or ${array_key} array is missing" >> "${evidence}/warnings.log"
                cp "${page_file}" "${evidence}/raw/${name}.json"
                return 0
              fi
              total="$(jq -r '.paging.total' "${page_file}")"
              page_items="$(jq -c --arg key "${array_key}" '.[$key]' "${page_file}")"
              collected="$(jq -cn --argjson left "${collected}" --argjson right "${page_items}" '$left + $right')"
              current_count="$(jq -r 'length' <<<"${collected}")"
              if (( current_count <= collected_count && current_count < total )); then
                echo "${name}[page=${page}]: pagination made no progress (${current_count}/${total})" >> "${evidence}/warnings.log"
                cp "${page_file}" "${evidence}/raw/${name}.json"
                return 0
              fi
              collected_count="${current_count}"
              if (( current_count >= total )); then
                jq -c --arg key "${array_key}" --argjson values "${collected}" --argjson total "${total}" \
                  '.[$key]=$values | .paging.total=$total | .paging.page=1 | .paging.pageSize=($values | length)' \
                  "${evidence}/raw/${name}.page-1.json" > "${evidence}/raw/${name}.json"
                return 0
              fi
              if (( page >= 1000 )); then
                echo "${name}: pagination exceeded 1000 pages" >> "${evidence}/warnings.log"
                cp "${page_file}" "${evidence}/raw/${name}.json"
                return 0
              fi
              page=$((page + 1))
            done
          }

          fetch_json quality-gate api/qualitygates/project_status "${quality_gate_args[@]}"
          fetch_paged_json issues api/issues/search issues "${issues_args[@]}" --data-urlencode "resolved=false"
          fetch_paged_json hotspots api/hotspots/search hotspots "${hotspots_args[@]}"
          # Sonar's measures/component response is finite over this explicit metricKeys
          # list and has no paging envelope; the classifier validates every metric.
          fetch_json measures api/measures/component "${measures_args[@]}" --data-urlencode "metricKeys=bugs,vulnerabilities,code_smells,security_hotspots,coverage,duplicated_lines_density,ncloc"
          fetch_json analysis api/project_analyses/search "${analysis_args[@]}" --data-urlencode "ps=1"

          warnings="$(jq -Rsc 'split("\n") | map(select(length > 0))' "${evidence}/warnings.log")"
          jq -n \
            --slurpfile qualityGate "${evidence}/raw/quality-gate.json" \
            --slurpfile issues "${evidence}/raw/issues.json" \
            --slurpfile hotspots "${evidence}/raw/hotspots.json" \
            --slurpfile measures "${evidence}/raw/measures.json" \
            --slurpfile analysis "${evidence}/raw/analysis.json" \
            --argjson warnings "${warnings}" \
            '{qualityGate:$qualityGate[0],issues:$issues[0],hotspots:$hotspots[0],measures:$measures[0],analysis:$analysis[0],warnings:$warnings}' \
            > "${evidence}/input.json"

      - name: Normalize and consume Sonar findings and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/sonar-evidence"
          classifier_exit=0
          node "${TRUSTED_SONAR_CLASSIFIER}" \
            --input "${evidence}/input.json" \
            --output-dir "${evidence}/classified" \
            --head-sha "${HEAD_SHA}" \
            --base-sha "${BASE_SHA}" \
            --mode "${MODE}" \
            --execution-status success || classifier_exit=$?
          [[ -s "${evidence}/classified/summary.json" ]] || {
            echo "::error::Sonar evidence classifier did not produce a summary"
            exit 1
          }
          cat "${evidence}/classified/summary.json"
          [[ "${classifier_exit}" == "0" ]] || {
            echo "::error::Sonar evidence is incomplete; raw API output remains in the artifact"
            exit 1
          }
          jq -e '.status == "PASS" and .qualityGate.status == "OK" and .evidenceComplete == true and .counts.materialFindings == 0' \
            "${evidence}/classified/summary.json" >/dev/null || {
            echo "::error::Sonar quality gate, evidence consumption, or material-finding disposition is not closed"
            exit 1
          }

      - name: Upload consumed Sonar evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-evidence-${{ env.HEAD_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sonar-evidence
          if-no-files-found: error
          retention-days: 14

  result:
    name: >-
      ${{ github.event_name == 'pull_request' && 'SonarQube / PR result' || github.event_name == 'push' &&
      'SonarQube / push result' || 'SonarQube / dispatched result' }}
    needs: [scope, node_coverage, go_coverage, assemble, scan, evidence]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce progressive exact Sonar results
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          NODE_REQUIRED: ${{ needs.scope.outputs.node_required }}
          NODE_RESULT: ${{ needs.node_coverage.result }}
          GO_REQUIRED: ${{ needs.scope.outputs.go_required }}
          GO_RESULT: ${{ needs.go_coverage.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          TRUSTED_SCAN: ${{ inputs.trusted_scan }}
          SONAR_REQUIRED: ${{ needs.scope.outputs.sonar_required }}
        run: |
          set -euo pipefail
          failures=()
          [[ "${SCOPE_RESULT}" == "success" ]] || failures+=("scope:${SCOPE_RESULT}")
          if [[ "${SONAR_REQUIRED}" == "true" ]]; then
            if [[ "${NODE_REQUIRED}" == "true" ]]; then
              [[ "${NODE_RESULT}" == "success" ]] || failures+=("node-coverage:${NODE_RESULT}")
            else
              [[ "${NODE_RESULT}" == "skipped" ]] || failures+=("node-coverage-unexpected:${NODE_RESULT}")
            fi
            if [[ "${GO_REQUIRED}" == "true" ]]; then
              [[ "${GO_RESULT}" == "success" ]] || failures+=("go-coverage:${GO_RESULT}")
            else
              [[ "${GO_RESULT}" == "skipped" ]] || failures+=("go-coverage-unexpected:${GO_RESULT}")
            fi
          else
            [[ "${NODE_RESULT}" == "skipped" ]] || failures+=("node-coverage-unexpected:${NODE_RESULT}")
            [[ "${GO_RESULT}" == "skipped" ]] || failures+=("go-coverage-unexpected:${GO_RESULT}")
          fi
          [[ "${ASSEMBLE_RESULT}" == "success" ]] || failures+=("assemble:${ASSEMBLE_RESULT}")

          trusted_scan_required="${TRUSTED_SCAN}"
          if [[ "${SONAR_REQUIRED}" != "true" ]]; then
            trusted_scan_required=false
          fi
          if [[ "${trusted_scan_required}" == "true" ]]; then
            [[ "${SCAN_RESULT}" == "success" ]] || failures+=("trusted-scan:${SCAN_RESULT}")
            [[ "${EVIDENCE_RESULT}" == "success" ]] || failures+=("evidence-consumption:${EVIDENCE_RESULT}")
          else
            [[ "${SCAN_RESULT}" == "skipped" ]] || failures+=("untrusted-scan-unexpected:${SCAN_RESULT}")
            [[ "${EVIDENCE_RESULT}" == "skipped" ]] || failures+=("evidence-unexpected:${EVIDENCE_RESULT}")
          fi

          if (( ${#failures[@]} != 0 )); then
            echo "::error::Sonar progressive verification failed: $(IFS=,; echo "${failures[*]}")"
            exit 1
          fi

