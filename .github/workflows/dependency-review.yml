name: Dependency Review exact-h

on:
  workflow_call:
    inputs:
      head_sha: {type: string, required: true}
      base_sha: {type: string, required: true}

permissions:
  contents: read

concurrency:
  group: dependency-review-h-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency delta ${{ inputs.base_sha }}..${{ inputs.head_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact h candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Verify exact h candidate and base
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == "h" ]] || {
            echo "::error::Dependency Review authority is h only"
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${HEAD_SHA}" ]] || {
            echo "::error::Dependency Review candidate drift"
            exit 1
          }
          [[ "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Dependency Review exact base SHA required"
            exit 1
          }
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"

      - name: Reject introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ inputs.base_sha }}
          head-ref: ${{ inputs.head_sha }}
          fail-on-severity: low
          show-patched-versions: true
