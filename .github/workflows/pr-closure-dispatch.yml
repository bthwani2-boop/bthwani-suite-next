name: BThwani PR Closure Dispatch

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: bthwani-pr-closure-dispatch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    name: Bind independent human closure approval
    if: ${{ github.event.issue.pull_request && github.event.label.name == 'bthwani:closure-request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      head_ref: ${{ steps.target.outputs.head_ref }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      base_ref: ${{ steps.target.outputs.base_ref }}
      base_sha: ${{ steps.target.outputs.base_sha }}
      approver: ${{ steps.target.outputs.approver }}
      default_sha: ${{ steps.target.outputs.default_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      APPROVER: ${{ github.actor }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Resolve trusted approval and immutable live PR identity
        id: target
        shell: bash
        run: |
          set -euo pipefail
          permission="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
          "/repos/${GITHUB_REPOSITORY}/collaborators/${APPROVER}/permission" --jq '.permission')"
          case "${permission}" in admin|maintain|write) ;; *) echo \
          "::error::closure approval requires write, maintain, or admin permission"; exit 1;; esac

          pr="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          [[ "$(jq -r '.state' <<<"${pr}")" == "open" ]] || { echo "::error::PR is not open"; exit 1; }
          [[ "$(jq -r '.head.repo.full_name' <<<"${pr}")" == "${GITHUB_REPOSITORY}" ]] || { echo \
          "::error::closure dispatch is limited to same-repository candidates"; exit 1; }
          author="$(jq -r '.user.login' <<<"${pr}")"
          head_owner="$(jq -r '.head.repo.owner.login' <<<"${pr}")"
          [[ "${APPROVER,,}" != "${author,,}" ]] || { echo \
          "::error::closure approval must be independent from the PR author"; exit 1; }
          [[ "${APPROVER,,}" != "${head_owner,,}" ]] || { echo \
          "::error::closure approval must be independent from the head repository owner"; exit 1; }
          head_ref="$(jq -r '.head.ref' <<<"${pr}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr}")"
          base_sha="$(jq -r '.base.sha' <<<"${pr}")"
          [[ "${head_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::PR head SHA is invalid"; exit 1; }
          [[ "${base_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::PR base SHA is invalid"; exit 1; }
          [[ "${base_ref}" == "${DEFAULT_BRANCH}" ]] || { echo \
          "::error::closure base must be the repository default branch"; exit 1; }
          encoded_default="$(jq -rn --arg value "${DEFAULT_BRANCH}" '$value|@uri')"
          default_sha="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
          "/repos/${GITHUB_REPOSITORY}/branches/${encoded_default}" --jq '.commit.sha')"
          [[ "${GITHUB_SHA}" == "${default_sha}" ]] || { echo \
          "::error::closure approval must execute the live default-branch definition"; exit 1; }
          jq -e '(.body // "") | contains("<!-- bthwani:closure-request -->")' <<<"${pr}" >/dev/null || {
            echo "::error::closure request marker was removed before approval"
            exit 1
          }
          approved="$(jq '[.labels[]?.name | select(. == "bthwani:closure-request")] | length' <<<"${pr}")"
          [[ "${approved}" == "1" ]] || { echo "::error::trusted closure approval label is missing"; exit 1; }
          {
            echo "head_ref=${head_ref}"
            echo "head_sha=${head_sha}"
            echo "base_ref=${base_ref}"
            echo "base_sha=${base_sha}"
            echo "approver=${APPROVER}"
            echo "default_sha=${default_sha}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Trusted PR closure approval"
            echo "- Approver: ${APPROVER}"
            echo "- PR author: ${author}"
            echo "- Candidate SHA: ${head_sha}"
            echo "- Base SHA: ${base_sha}"
            echo "- Trusted definition SHA: ${default_sha}"
            echo "- Draft state remains unchanged: $(jq -r '.draft' <<<"${pr}")"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Invalidate any prior closure success before verification
        shell: bash
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
        run: |
          set -euo pipefail
          gh api --method POST -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context='BThwani / PR Closure Evidence' \
            -f description="Exact closure is running for base ${BASE_SHA:0:12}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

  evidence:
    name: Run trusted exact closure evidence
    needs: [approve]
    uses: ./.github/workflows/pr-closure-evidence.yml
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      security-events: read
      statuses: write
    with:
      pr_number: ${{ github.event.issue.number }}
      head_ref: ${{ needs.approve.outputs.head_ref }}
      head_sha: ${{ needs.approve.outputs.head_sha }}
      base_ref: ${{ needs.approve.outputs.base_ref }}
      base_sha: ${{ needs.approve.outputs.base_sha }}
      closure_approver: ${{ needs.approve.outputs.approver }}
      default_sha: ${{ needs.approve.outputs.default_sha }}
    secrets: inherit
