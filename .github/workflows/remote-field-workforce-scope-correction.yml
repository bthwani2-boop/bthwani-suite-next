name: Remote Field Workforce Scope Correction

on:
  push:
    branches:
      - fix/smar-field-production-blockers-20260727
    paths:
      - ".github/workflows/remote-field-workforce-scope-correction.yml"

permissions:
  contents: write

concurrency:
  group: remote-field-workforce-scope-correction
  cancel-in-progress: false

jobs:
  correct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dsh_test
          POSTGRES_PASSWORD: dsh_test
          POSTGRES_DB: dsh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsh_test -d dsh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://dsh_test:dsh_test@127.0.0.1:5432/dsh_test?sslmode=disable
      DSH_REQUIRE_DB_TESTS: "true"
      DSH_TEST_TENANT_ID: local-dsh
      EVIDENCE_FILE: governance/evidence/app-field-workforce-scope-correction.md

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: services/dsh/backend/go.sum

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Correct platform workforce scope semantics
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          queue = "services/dsh/frontend/shared/field-readiness/field-offline-queue.ts"
          replace_once(
              queue,
              " * Durable, account-scoped queue for authenticated field operations during\n"
              " * network loss. Mobile runtimes must configure an encrypted storage adapter.\n",
              " * Durable queue scoped to the authenticated platform-workforce actor and the\n"
              " * current app installation. Mobile runtimes must use encrypted storage.\n",
          )
          replace_once(
              queue,
              "export type FieldOfflineQueueScope = {\n"
              "  readonly tenantId: string;\n"
              "  readonly actorId: string;\n"
              "};",
              "export type FieldOfflineQueueScope = {\n"
              "  readonly actorId: string;\n"
              "  readonly installationId: string;\n"
              "};",
          )
          replace_once(
              queue,
              "  readonly tenantId: string;\n"
              "  readonly actorId: string;\n"
              "  readonly payload: P;",
              "  readonly actorId: string;\n"
              "  readonly installationId: string;\n"
              "  readonly payload: P;",
          )
          replace_once(queue, 'const STORAGE_PREFIX = "bthwani.field-offline-queue.v2";',
                             'const STORAGE_PREFIX = "bthwani.field-offline-queue.v3";')
          replace_once(
              queue,
              "  return {\n"
              "    tenantId: requireNonEmpty(scope.tenantId, \"field offline queue tenant id\"),\n"
              "    actorId: requireNonEmpty(scope.actorId, \"field offline queue actor id\"),\n"
              "  };",
              "  return {\n"
              "    actorId: requireNonEmpty(scope.actorId, \"field offline queue actor id\"),\n"
              "    installationId: requireNonEmpty(\n"
              "      scope.installationId,\n"
              "      \"field offline queue installation id\",\n"
              "    ),\n"
              "  };",
          )
          replace_once(
              queue,
              "  return stableHash(`${scope.tenantId}|${scope.actorId}`);",
              "  return stableHash(`${scope.actorId}|${scope.installationId}`);",
          )
          replace_once(
              queue,
              "    typeof candidate.tenantId === \"string\" &&\n"
              "    candidate.tenantId === scope.tenantId &&\n"
              "    typeof candidate.actorId === \"string\" &&\n"
              "    candidate.actorId === scope.actorId &&",
              "    typeof candidate.actorId === \"string\" &&\n"
              "    candidate.actorId === scope.actorId &&\n"
              "    typeof candidate.installationId === \"string\" &&\n"
              "    candidate.installationId === scope.installationId &&",
          )
          replace_once(
              queue,
              "      operation.tenantId === scope.tenantId &&\n"
              "      operation.actorId === scope.actorId &&\n"
              "      operation.idempotencyKey === normalizedKey,",
              "      operation.actorId === scope.actorId &&\n"
              "      operation.installationId === scope.installationId &&\n"
              "      operation.operationType === operationType &&\n"
              "      operation.idempotencyKey === normalizedKey,",
          )
          replace_once(
              queue,
              "  const fingerprint = stableHash(`${scope.tenantId}|${scope.actorId}|${operationType}|${normalizedKey}`);",
              "  const fingerprint = stableHash(\n"
              "    `${scope.actorId}|${scope.installationId}|${operationType}|${normalizedKey}`,\n"
              "  );",
          )
          replace_once(
              queue,
              "    tenantId: scope.tenantId,\n"
              "    actorId: scope.actorId,",
              "    actorId: scope.actorId,\n"
              "    installationId: scope.installationId,",
          )

          replace_once(
              "services/dsh/frontend/shared/field-readiness/use-field-offline-sync.ts",
              '  const scopeKey = scope ? `${scope.tenantId}:${scope.actorId}` : "signed-out";',
              '  const scopeKey = scope ? `${scope.actorId}:${scope.installationId}` : "signed-out";',
          )

          replace_once(
              "services/dsh/frontend/app-field/dsh-field.routes.ts",
              "export type DshFieldSurfaceProps = {\n"
              "  command?: DshFieldNavigationCommand;\n"
              "  onExit?: () => void;\n"
              "};",
              "export type DshFieldSurfaceProps = {\n"
              "  command?: DshFieldNavigationCommand;\n"
              "  onExit?: () => void;\n"
              "  installationId?: string;\n"
              "};",
          )

          surface = "services/dsh/frontend/app-field/components/DshFieldSurface.tsx"
          replace_once(
              surface,
              "export function DshFieldSurface({ command, onExit }: DshFieldSurfaceProps = {}) {",
              "export function DshFieldSurface({ command, onExit, installationId }: DshFieldSurfaceProps = {}) {",
          )
          replace_once(
              surface,
              "  const offlineScope = identity.state.kind === 'authenticated'\n"
              "    ? {\n"
              "        tenantId: identity.state.identity.tenantId,\n"
              "        actorId: identity.state.identity.subject,\n"
              "      }\n"
              "    : undefined;",
              "  const offlineScope = identity.state.kind === 'authenticated' && installationId\n"
              "    ? {\n"
              "        actorId: identity.state.identity.subject,\n"
              "        installationId,\n"
              "      }\n"
              "    : undefined;",
          )

          app = "apps/app-field/runtime/src/App.tsx"
          replace_once(
              app,
              'import { Linking, Platform, StyleSheet, View } from "react-native";',
              'import { ActivityIndicator, Linking, Platform, StyleSheet, Text, View } from "react-native";',
          )
          replace_once(
              app,
              "function AppContent() {\n"
              "  const identity = useIdentitySession();\n"
              "  useDshMobilePushRegistration(identity.state.kind, \"app-field\", FIELD_APP_SCHEME);\n\n"
              "  const [navCommand, setNavCommand] = useState<DshFieldNavigationCommand | undefined>();",
              "function AppContent() {\n"
              "  const identity = useIdentitySession();\n"
              "  useDshMobilePushRegistration(identity.state.kind, \"app-field\", FIELD_APP_SCHEME);\n\n"
              "  const [installationState, setInstallationState] = useState<\n"
              "    | { kind: \"loading\" }\n"
              "    | { kind: \"ready\"; installationId: string }\n"
              "    | { kind: \"error\" }\n"
              "  >({ kind: \"loading\" });\n"
              "  const [navCommand, setNavCommand] = useState<DshFieldNavigationCommand | undefined>();\n\n"
              "  useEffect(() => {\n"
              "    let active = true;\n"
              "    const installationPromise = Platform.OS === \"web\"\n"
              "      ? Promise.resolve(`field-web:${Crypto.randomUUID()}`)\n"
              "      : getOrCreateFieldDeviceFingerprint();\n"
              "    void installationPromise\n"
              "      .then((installationId) => {\n"
              "        if (active) setInstallationState({ kind: \"ready\", installationId });\n"
              "      })\n"
              "      .catch(() => {\n"
              "        if (active) setInstallationState({ kind: \"error\" });\n"
              "      });\n"
              "    return () => {\n"
              "      active = false;\n"
              "    };\n"
              "  }, []);",
          )
          replace_once(
              app,
              "  const logout = () => {\n"
              "    void identity.logout();\n"
              "  };\n\n"
              "  return (",
              "  const logout = () => {\n"
              "    void identity.logout();\n"
              "  };\n\n"
              "  if (installationState.kind !== \"ready\") {\n"
              "    return (\n"
              "      <View style={styles.installationState}>\n"
              "        {installationState.kind === \"loading\" ? (\n"
              "          <ActivityIndicator accessibilityLabel=\"تهيئة هوية تثبيت التطبيق\" />\n"
              "        ) : (\n"
              "          <Text style={styles.installationError}>\n"
              "            تعذر تهيئة هوية الجهاز الآمنة. أعد فتح التطبيق قبل تنفيذ أي عمل ميداني.\n"
              "          </Text>\n"
              "        )}\n"
              "      </View>\n"
              "    );\n"
              "  }\n\n"
              "  return (",
          )
          replace_once(
              app,
              "            <DshFieldSurface {...(navCommand ? { command: navCommand } : {})} />",
              "            <DshFieldSurface\n"
              "              {...(navCommand ? { command: navCommand } : {})}\n"
              "              installationId={installationState.installationId}\n"
              "            />",
          )
          replace_once(
              app,
              "const styles = StyleSheet.create({\n"
              "  root: { flex: 1, backgroundColor: colorRoles.surfaceMuted },\n"
              "  screen: { flex: 1 },\n"
              "});",
              "const styles = StyleSheet.create({\n"
              "  root: { flex: 1, backgroundColor: colorRoles.surfaceMuted },\n"
              "  screen: { flex: 1 },\n"
              "  installationState: {\n"
              "    flex: 1,\n"
              "    alignItems: \"center\",\n"
              "    justifyContent: \"center\",\n"
              "    padding: 24,\n"
              "    backgroundColor: colorRoles.surfaceMuted,\n"
              "  },\n"
              "  installationError: { textAlign: \"center\" },\n"
              "});",
          )

          mutation = "services/dsh/backend/internal/fieldreadiness/mutation_idempotency.go"
          replace_once(
              mutation,
              '\tErrIdempotencyRequired = errors.New("field readiness idempotency context is required")\n'
              '\tErrIdempotencyConflict = errors.New("idempotency key was already used with different field readiness inputs")\n'
              '\tErrTenantContext       = errors.New("trusted tenant context is required for field readiness mutation")',
              '\tErrIdempotencyRequired = errors.New("field readiness idempotency context is required")\n'
              '\tErrIdempotencyConflict = errors.New("idempotency key was already used with different field readiness inputs")',
          )
          replace_once(
              mutation,
              "func trustedTenantIDTx(ctx context.Context, tx *sql.Tx) (string, error) {\n"
              "\tvar tenant sql.NullString\n"
              "\tif err := tx.QueryRowContext(ctx, `SELECT NULLIF(current_setting('bthwani.tenant_id', TRUE), '')`).Scan(&tenant); err != nil {\n"
              "\t\treturn \"\", err\n"
              "\t}\n"
              "\tif !tenant.Valid || strings.TrimSpace(tenant.String) == \"\" {\n"
              "\t\treturn \"\", ErrTenantContext\n"
              "\t}\n"
              "\treturn strings.TrimSpace(tenant.String), nil\n"
              "}\n\n",
              "",
          )
          replace_once(
              mutation,
              "\ttenantID, err := trustedTenantIDTx(ctx, tx)\n"
              "\tif err != nil {\n"
              "\t\treturn false, err\n"
              "\t}\n"
              "\tlockIdentity := strings.Join([]string{tenantID, actorID, string(operation), mutation.IdempotencyKey}, \"|\")",
              "\tlockIdentity := strings.Join([]string{actorID, string(operation), mutation.IdempotencyKey}, \"|\")",
          )
          replace_once(
              mutation,
              "\terr = tx.QueryRowContext(ctx, `\n"
              "\t\tSELECT request_hash, response_json\n"
              "\t\tFROM dsh_field_readiness_operation_receipts\n"
              "\t\tWHERE tenant_id = $1 AND actor_id = $2 AND operation = $3 AND idempotency_key = $4`,\n"
              "\t\ttenantID, actorID, operation, mutation.IdempotencyKey,\n"
              "\t).Scan(&storedHash, &storedResponse)",
              "\terr := tx.QueryRowContext(ctx, `\n"
              "\t\tSELECT request_hash, response_json\n"
              "\t\tFROM dsh_field_readiness_operation_receipts\n"
              "\t\tWHERE actor_id = $1 AND operation = $2 AND idempotency_key = $3`,\n"
              "\t\tactorID, operation, mutation.IdempotencyKey,\n"
              "\t).Scan(&storedHash, &storedResponse)",
          )
          replace_once(
              mutation,
              "\ttenantID, err := trustedTenantIDTx(ctx, tx)\n"
              "\tif err != nil {\n"
              "\t\treturn err\n"
              "\t}\n"
              "\tencoded, err := json.Marshal(response)",
              "\tencoded, err := json.Marshal(response)",
          )
          replace_once(
              mutation,
              "\t_, err = tx.ExecContext(ctx, `\n"
              "\t\tINSERT INTO dsh_field_readiness_operation_receipts\n"
              "\t\t  (tenant_id, actor_id, operation, resource_id, idempotency_key, request_hash, correlation_id, response_json)\n"
              "\t\tVALUES ($1, $2, $3, $4, $5, $6, $7, $8::jsonb)`,\n"
              "\t\ttenantID,\n"
              "\t\tactorID,\n"
              "\t\toperation,\n"
              "\t\tresourceID,\n"
              "\t\tmutation.IdempotencyKey,\n"
              "\t\tmutation.RequestHash,\n"
              "\t\tmutation.CorrelationID,\n"
              "\t\tstring(encoded),\n"
              "\t)",
              "\t_, err = tx.ExecContext(ctx, `\n"
              "\t\tINSERT INTO dsh_field_readiness_operation_receipts\n"
              "\t\t  (actor_id, operation, resource_id, idempotency_key, request_hash, correlation_id, response_json)\n"
              "\t\tVALUES ($1, $2, $3, $4, $5, $6, $7::jsonb)`,\n"
              "\t\tactorID,\n"
              "\t\toperation,\n"
              "\t\tresourceID,\n"
              "\t\tmutation.IdempotencyKey,\n"
              "\t\tmutation.RequestHash,\n"
              "\t\tmutation.CorrelationID,\n"
              "\t\tstring(encoded),\n"
              "\t)",
          )

          Path("services/dsh/database/migrations/dsh-961_field_readiness_operation_receipts.sql").write_text(
              dedent("""\
              -- DSH-961 / JRN-024: append-only receipts for replayable platform-workforce field mutations.
          -- The field actor is globally owned by core/workforce. Merchant tenant context belongs
          -- to the target store/partner resource and is not part of the actor's mutation identity.

          BEGIN;

          CREATE TABLE IF NOT EXISTS dsh_field_readiness_operation_receipts (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            actor_id TEXT NOT NULL,
            operation TEXT NOT NULL,
            resource_id TEXT NOT NULL,
            idempotency_key TEXT NOT NULL,
            request_hash TEXT NOT NULL,
            correlation_id TEXT NOT NULL,
            response_json JSONB NOT NULL,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            CONSTRAINT dsh_field_readiness_receipts_actor_chk CHECK (length(btrim(actor_id)) > 0),
            CONSTRAINT dsh_field_readiness_receipts_key_chk CHECK (
              length(btrim(idempotency_key)) BETWEEN 8 AND 200
            ),
            CONSTRAINT dsh_field_readiness_receipts_correlation_chk CHECK (
              length(btrim(correlation_id)) BETWEEN 1 AND 200
            ),
            CONSTRAINT dsh_field_readiness_receipts_operation_chk CHECK (
              operation IN ('create_visit', 'complete_visit', 'upsert_readiness_check', 'create_escalation')
            )
          );

          CREATE UNIQUE INDEX IF NOT EXISTS dsh_field_readiness_receipts_identity_uq
            ON dsh_field_readiness_operation_receipts
              (actor_id, operation, idempotency_key);

          CREATE INDEX IF NOT EXISTS dsh_field_readiness_receipts_resource_idx
            ON dsh_field_readiness_operation_receipts
              (actor_id, operation, resource_id, created_at DESC);

          CREATE INDEX IF NOT EXISTS dsh_field_readiness_receipts_correlation_idx
            ON dsh_field_readiness_operation_receipts
              (actor_id, correlation_id, created_at DESC);

          COMMIT;
              """),
              encoding="utf-8",
          )

          guard = "services/dsh/tests/jrn-024-field-readiness.test.mjs"
          replace_once(
              guard,
              'test("JRN-024 stores atomic tenant and actor scoped replay receipts", () => {\n'
              "  assert.match(mutationReceipts, /current_setting\\('bthwani\\.tenant_id', TRUE\\)/);\n"
              "  assert.match(mutationReceipts, /pg_advisory_xact_lock/);\n"
              "  assert.match(mutationReceipts, /dsh_field_readiness_operation_receipts/);\n"
              "  assert.match(mutationReceipts, /tenantID, actorID, operation, mutation\\.IdempotencyKey/);\n"
              "  assert.match(idempotentDomain, /storeMutationReceiptTx/);\n"
              "  assert.match(idempotentDomain, /fieldcommissionoutbox\\.Enqueue/);\n"
              "  assert.match(mutationMigration, /create_idempotency_key/);\n"
              "  assert.match(mutationMigration, /completion_idempotency_key/);\n"
              "  assert.match(receiptMigration, /UNIQUE INDEX[\\s\\S]*tenant_id, actor_id, operation, idempotency_key/);\n"
              "});",
              'test("JRN-024 stores atomic platform-workforce actor scoped replay receipts", () => {\n'
              "  assert.doesNotMatch(mutationReceipts, /bthwani\\.tenant_id|tenantID/);\n"
              "  assert.match(mutationReceipts, /pg_advisory_xact_lock/);\n"
              "  assert.match(mutationReceipts, /dsh_field_readiness_operation_receipts/);\n"
              "  assert.match(mutationReceipts, /actorID, string\\(operation\\), mutation\\.IdempotencyKey/);\n"
              "  assert.match(idempotentDomain, /storeMutationReceiptTx/);\n"
              "  assert.match(idempotentDomain, /fieldcommissionoutbox\\.Enqueue/);\n"
              "  assert.match(mutationMigration, /create_idempotency_key/);\n"
              "  assert.match(mutationMigration, /completion_idempotency_key/);\n"
              "  assert.doesNotMatch(receiptMigration, /tenant_id/);\n"
              "  assert.match(receiptMigration, /UNIQUE INDEX[\\s\\S]*actor_id, operation, idempotency_key/);\n"
              "});",
          )
          replace_once(
              guard,
              '    "dshFieldCreateVisit",\n'
              '    "dshFieldCompleteVisit",\n'
              '    "dshFieldUpsertReadinessCheck",\n'
              '    "dshFieldCreateEscalation",',
              '    "createDshFieldVisit",\n'
              '    "completeDshFieldVisit",\n'
              '    "upsertDshReadinessCheck",\n'
              '    "createDshReadinessEscalation",',
          )
          replace_once(
              guard,
              'test("JRN-024 isolates and clears encrypted offline work per tenant and actor", () => {\n'
              "  assert.match(offlineQueue, /readonly tenantId: string/);\n"
              "  assert.match(offlineQueue, /readonly actorId: string/);\n"
              "  assert.match(offlineQueue, /configureFieldOfflineQueueStorage/);\n"
              "  assert.match(offlineQueue, /scope\\.tenantId/);\n"
              "  assert.match(offlineQueue, /scope\\.actorId/);\n"
              "  assert.doesNotMatch(offlineQueue, /submit_payout_request|upload_media_evidence/);\n"
              "  assert.match(appIndex, /SecureStore\\.setItemAsync/);\n"
              "  assert.match(appIndex, /clearFieldOfflineQueue\\(\\)/);\n"
              "});",
              'test("JRN-024 isolates and clears encrypted offline work per workforce actor and installation", () => {\n'
              "  assert.doesNotMatch(offlineQueue, /tenantId/);\n"
              "  assert.match(offlineQueue, /readonly actorId: string/);\n"
              "  assert.match(offlineQueue, /readonly installationId: string/);\n"
              "  assert.match(offlineQueue, /configureFieldOfflineQueueStorage/);\n"
              "  assert.match(offlineQueue, /scope\\.actorId/);\n"
              "  assert.match(offlineQueue, /scope\\.installationId/);\n"
              "  assert.doesNotMatch(offlineQueue, /submit_payout_request|upload_media_evidence/);\n"
              "  assert.match(appRuntime, /installationId=\\{installationState\\.installationId\\}/);\n"
              "  assert.match(appIndex, /SecureStore\\.setItemAsync/);\n"
              "  assert.match(appIndex, /clearFieldOfflineQueue\\(\\)/);\n"
              "});",
          )

          field_paths = Path("services/dsh/contracts/paths/field.paths.yaml")
          text = field_paths.read_text(encoding="utf-8")
          for operation in (
              "createDshFieldVisit",
              "completeDshFieldVisit",
              "upsertDshReadinessCheck",
              "createDshReadinessEscalation",
          ):
              marker = f"    operationId: {operation}\n"
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"operation not found: {operation}")
              request_body = text.find("    requestBody:\n", start)
              if request_body < 0:
                  raise SystemExit(f"requestBody not found: {operation}")
              block = text[start:request_body]
              if "#/components/parameters/IdempotencyKey" in block:
                  continue
              parameters = text.find("    parameters:\n", start, request_body)
              if parameters < 0:
                  raise SystemExit(f"parameters block not found: {operation}")
              additions = (
                  '      - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKey"\n'
                  '      - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationId"\n'
              )
              text = text[:request_body] + additions + text[request_body:]
          field_paths.write_text(text, encoding="utf-8")

      - name: Format Go
        run: gofmt -w services/dsh/backend/internal/fieldreadiness/mutation_idempotency.go

      - name: Regenerate DSH OpenAPI artifacts
        run: pnpm --dir services/dsh openapi:generate

      - name: Verify modular OpenAPI
        run: pnpm --dir services/dsh openapi:test

      - name: Verify app-field TypeScript
        run: pnpm --dir apps/app-field/runtime typecheck

      - name: Verify identity TypeScript
        run: pnpm exec tsc --noEmit -p core/identity/tsconfig.json

      - name: Verify JRN-024 source guard
        run: node --test services/dsh/tests/jrn-024-field-readiness.test.mjs

      - name: Verify DSH database contract
        run: node tools/scripts/check-dsh-database-contract.mjs

      - name: Verify Go formatting
        run: test -z "$(gofmt -d services/dsh/backend/internal/fieldreadiness services/dsh/backend/internal/http/field_readiness_governed_handlers.go)"

      - name: Apply PostgreSQL migrations
        run: |
          for file in $(find services/dsh/database/migrations -maxdepth 1 -type f -name "*.sql" | sort -V); do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Verify all field readiness Go tests
        run: |
          cd services/dsh/backend
          go test ./internal/fieldreadiness -count=1

      - name: Write immutable correction evidence
        run: |
          mkdir -p "$(dirname "$EVIDENCE_FILE")"
          cat > "$EVIDENCE_FILE" <<EOF
          # App Field Workforce Scope Correction — Remote Verification

          - Repository: \`${GITHUB_REPOSITORY}\`
          - Branch: \`${GITHUB_REF_NAME}\`
          - Source commit: \`${GITHUB_SHA}\`
          - Workflow run: \`${GITHUB_RUN_ID}\`
          - Verified at: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`

          ## Corrected architecture

