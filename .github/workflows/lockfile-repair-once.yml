name: Canonical Lockfile Repair Once

on:
  push:
    branches: [g]
    paths:
      - .github/workflows/lockfile-repair-once.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable trigger candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/g | awk '{print $1}')"
          [[ "${remote_head}" == "${GITHUB_SHA}" ]] || {
            echo "::error::g advanced before lockfile repair: trigger=${GITHUB_SHA} remote=${remote_head}"
            exit 1
          }

      - name: Setup repository-pinned PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.0

      - name: Setup repository-pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0

      - name: Regenerate canonical lockfile only
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts --reporter=append-only
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed by pnpm:\n%s\n' "${changed[*]:-<none>}"
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "pnpm-lock.yaml" ]] || {
            echo "::error::Lockfile regeneration changed unexpected tracked files"
            git status --short
            exit 1
          }

      - name: Prove frozen workspace installation
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only

      - name: Commit verified lockfile and remove one-shot executor
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/g | awk '{print $1}')"
          [[ "${remote_head}" == "${GITHUB_SHA}" ]] || {
            echo "::error::g advanced during lockfile verification: trigger=${GITHUB_SHA} remote=${remote_head}"
            exit 1
          }
          git rm .github/workflows/lockfile-repair-once.yml
          git add pnpm-lock.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(lockfile): regenerate canonical pnpm 10.34.0 snapshot"
          git push origin HEAD:g
          new_sha="$(git rev-parse HEAD)"
          echo "sha=${new_sha}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch full-scope CI from trusted g control plane
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci-check.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref g \
            -f expected_head_sha="${CANDIDATE_SHA}" \
            -f verify_from_sha="${GITHUB_SHA}" \
            -f full_scope=true
          echo "Dispatched BThwani CI for ${CANDIDATE_SHA} from g"
