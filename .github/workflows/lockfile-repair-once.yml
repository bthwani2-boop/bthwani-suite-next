name: Canonical Lockfile Repair Once

on:
  push:
    branches: [g]
    paths:
      - .github/workflows/lockfile-repair-once.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout latest live g
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: g
          fetch-depth: 0
          persist-credentials: true

      - name: Setup repository-pinned PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.0

      - name: Setup repository-pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0

      - name: Repair dependency graph without weakening global trust policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')

          function npmField(spec, field) {
            const raw = execFileSync('npm', ['view', spec, field, '--json'], {encoding:'utf8'}).trim()
            return raw ? JSON.parse(raw) : null
          }
          function assertLegacyException(spec, expectedLicense) {
            const license = npmField(spec, 'license')
            const attest = npmField(spec, 'dist.attestations')
            if (license !== expectedLicense) throw new Error(`${spec} license changed: ${license}`)
            if (attest && typeof attest === 'object' && Object.keys(attest).length) {
              throw new Error(`${spec} gained attestations; remove its trustPolicyExclude entry`)
            }
          }

          const fbjsRange = npmField('fbjs@3.0.5', 'dependencies.ua-parser-js')
          if (fbjsRange !== '^1.0.35') throw new Error(`unexpected fbjs parser range: ${fbjsRange}`)
          assertLegacyException('ua-parser-js@1.0.41', 'MIT')
          assertLegacyException('semver@6.3.1', 'ISC')

          const packagePath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          pkg.devDependencies['@size-limit/file'] = '13.0.3'
          pkg.devDependencies['size-limit'] = '13.0.3'
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n')

          const workspacePath = 'pnpm-workspace.yaml'
          let workspace = fs.readFileSync(workspacePath, 'utf8')
          workspace = workspace.replace(/^  ua-parser-js: .*\n/m, '')
          workspace = workspace.replace(/^  'fbjs@3\.0\.5>ua-parser-js': .*\n/m, '')
          const overrideAnchor = "  shell-quote@<=1.8.4: '>=1.9.0'\n"
          if (!workspace.includes(overrideAnchor)) throw new Error('pnpm override anchor not found')
          workspace = workspace.replace(overrideAnchor, "  'fbjs@3.0.5>ua-parser-js': 1.0.41\n" + overrideAnchor)

          workspace = workspace.replace(/\ntrustPolicyExclude:\n(?:  - .*\n)*/g, '\n')
          const trustAnchor = 'trustPolicy: no-downgrade\n'
          if (!workspace.includes(trustAnchor)) throw new Error('trustPolicy anchor not found')
          workspace = workspace.replace(
            trustAnchor,
            trustAnchor + "trustPolicyExclude:\n  - 'ua-parser-js@1.0.41'\n  - 'semver@6.3.1'\n",
          )
          fs.writeFileSync(workspacePath, workspace)
          NODE

      - name: Regenerate canonical pnpm 10.34.0 lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts --reporter=append-only
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Changed by canonical regeneration:\n%s\n' "${changed[*]:-<none>}"
          expected=(package.json pnpm-lock.yaml pnpm-workspace.yaml)
          [[ "${#changed[@]}" -eq 3 ]] || { echo "::error::Unexpected changed-file count"; git status --short; exit 1; }
          for i in 0 1 2; do [[ "${changed[$i]}" == "${expected[$i]}" ]] || { echo "::error::Unexpected changed files"; git status --short; exit 1; }; done
          grep -F "ua-parser-js@1.0.41" pnpm-lock.yaml >/dev/null
          grep -F "semver@6.3.1" pnpm-lock.yaml >/dev/null

      - name: Prove frozen workspace installation and dependency executable
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
          pnpm exec size-limit --help >/dev/null
          grep -F "ua-parser-js@1.0.41" pnpm-lock.yaml >/dev/null
          grep -F "semver@6.3.1" pnpm-lock.yaml >/dev/null

      - name: Commit, rebase over unrelated live advances, reverify, and push
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/lockfile-repair-once.yml
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(deps): restore strict trusted lockfile resolution"

          for attempt in 1 2 3 4; do
            git fetch origin g
            remote_head="$(git rev-parse origin/g)"
            parent="$(git rev-parse HEAD^)"
            if [[ "${remote_head}" != "${parent}" ]]; then
              echo "Rebasing verified dependency repair over live g=${remote_head} (attempt ${attempt})"
              git rebase origin/g
              pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
              pnpm exec size-limit --help >/dev/null
              grep -F "ua-parser-js@1.0.41" pnpm-lock.yaml >/dev/null
              grep -F "semver@6.3.1" pnpm-lock.yaml >/dev/null
            fi
            if git push origin HEAD:g; then
              break
            fi
            if [[ "${attempt}" -eq 4 ]]; then
              echo "::error::g kept advancing and verified repair could not be pushed safely"
              exit 1
            fi
          done

          new_sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse HEAD^)"
          echo "sha=${new_sha}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch full-scope CI from trusted g control plane
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.commit.outputs.sha }}
          BASE_SHA: ${{ steps.commit.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci-check.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref g \
            -f expected_head_sha="${CANDIDATE_SHA}" \
            -f verify_from_sha="${BASE_SHA}" \
            -f full_scope=true
          echo "Dispatched BThwani CI for ${CANDIDATE_SHA} from g"
