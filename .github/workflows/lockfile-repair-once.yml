name: Canonical Lockfile Repair Once

on:
  push:
    branches: [g]
    paths:
      - .github/workflows/lockfile-repair-once.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable trigger candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/g | awk '{print $1}')"
          [[ "${remote_head}" == "${GITHUB_SHA}" ]] || {
            echo "::error::g advanced before dependency repair: trigger=${GITHUB_SHA} remote=${remote_head}"
            exit 1
          }

      - name: Setup repository-pinned PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.0

      - name: Setup repository-pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0

      - name: Resolve attested MIT ua-parser v1 and remove trust-downgraded dependency paths
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')

          function npmJson(args) {
            const out = execFileSync('npm', ['view', ...args, '--json'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim()
            return out ? JSON.parse(out) : null
          }
          function semverParts(v) {
            return v.split('.').map((x) => Number(x))
          }
          function compareDesc(a, b) {
            const aa = semverParts(a), bb = semverParts(b)
            for (let i = 0; i < 3; i++) if (aa[i] !== bb[i]) return bb[i] - aa[i]
            return 0
          }

          const fbjsRange = npmJson(['fbjs@3.0.5', 'dependencies.ua-parser-js'])
          console.log(`fbjs@3.0.5 ua-parser-js range: ${fbjsRange}`)
          if (typeof fbjsRange !== 'string' || !fbjsRange.includes('1.0.')) {
            throw new Error(`unexpected fbjs ua-parser-js range: ${JSON.stringify(fbjsRange)}`)
          }

          const versions = npmJson(['ua-parser-js', 'versions'])
            .filter((v) => /^1\.0\.\d+$/.test(v))
            .sort(compareDesc)

          let selected = null
          for (const version of versions) {
            let license, attestations
            try {
              license = npmJson([`ua-parser-js@${version}`, 'license'])
              attestations = npmJson([`ua-parser-js@${version}`, 'dist.attestations'])
            } catch {
              continue
            }
            const hasAttestations = attestations && typeof attestations === 'object' && Object.keys(attestations).length > 0
            console.log(`candidate ua-parser-js@${version}: license=${license} attestations=${hasAttestations ? 'yes' : 'no'}`)
            if (license === 'MIT' && hasAttestations) {
              selected = version
              break
            }
          }
          if (!selected) throw new Error('no MIT ua-parser-js v1 release with npm provenance attestations was found')
          console.log(`selected ua-parser-js@${selected}`)

          const packagePath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          pkg.devDependencies['@size-limit/file'] = '13.0.3'
          pkg.devDependencies['size-limit'] = '13.0.3'
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n')

          const workspacePath = 'pnpm-workspace.yaml'
          let workspace = fs.readFileSync(workspacePath, 'utf8')
          workspace = workspace.replace(/^  ua-parser-js: .*\n/m, '')
          const anchor = "  shell-quote@<=1.8.4: '>=1.9.0'\n"
          if (!workspace.includes(anchor)) throw new Error('pnpm override anchor not found')
          workspace = workspace.replace(anchor, `  ua-parser-js: ${selected}\n${anchor}`)
          fs.writeFileSync(workspacePath, workspace)
          NODE

      - name: Regenerate canonical pnpm 10.34.0 lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts --reporter=append-only
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Changed by canonical regeneration:\n%s\n' "${changed[*]:-<none>}"
          expected=(package.json pnpm-lock.yaml pnpm-workspace.yaml)
          [[ "${#changed[@]}" -eq 3 ]] || { echo "::error::Unexpected changed-file count"; git status --short; exit 1; }
          for i in 0 1 2; do [[ "${changed[$i]}" == "${expected[$i]}" ]] || { echo "::error::Unexpected changed files"; git status --short; exit 1; }; done

      - name: Prove frozen workspace installation and dependency executables
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
          pnpm exec size-limit --help >/dev/null
          pnpm exec node -e "require('ua-parser-js')"

      - name: Commit verified dependency repair and remove one-shot executor
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/g | awk '{print $1}')"
          [[ "${remote_head}" == "${GITHUB_SHA}" ]] || {
            echo "::error::g advanced during dependency verification: trigger=${GITHUB_SHA} remote=${remote_head}"
            exit 1
          }
          git rm .github/workflows/lockfile-repair-once.yml
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(deps): restore attested dependency graph and canonical lockfile"
          git push origin HEAD:g
          new_sha="$(git rev-parse HEAD)"
          echo "sha=${new_sha}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch full-scope CI from trusted g control plane
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci-check.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref g \
            -f expected_head_sha="${CANDIDATE_SHA}" \
            -f verify_from_sha="${GITHUB_SHA}" \
            -f full_scope=true
          echo "Dispatched BThwani CI for ${CANDIDATE_SHA} from g"
