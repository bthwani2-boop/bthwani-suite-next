name: V5 DSH Manifest Generator

on:
  push:
    branches:
      - task/v5-all-surfaces-root-20260815-2216
    paths:
      - ".github/workflows/v5-dsh-manifest-generator.yml"
      - "services/dsh/database/migrations/**"

permissions:
  contents: write

concurrency:
  group: v5-dsh-manifest-generator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: task/v5-all-surfaces-root-20260815-2216
          fetch-depth: 0

      - name: Generate canonical DSH migration manifest
        run: node tools/scripts/generate-migration-manifest.mjs --service dsh

      - name: Commit canonical generator output when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/dsh/database/migrations/manifest.json; then
            echo "Canonical manifest already matches the governed migration set."
            exit 0
          fi
          git config user.name "bthwani-v5-orchestrator"
          git config user.email "actions@users.noreply.github.com"
          git add -- services/dsh/database/migrations/manifest.json
          git diff --cached --check
          git commit -m "dsh: regenerate governed migration manifest"
          git push origin HEAD:task/v5-all-surfaces-root-20260815-2216
