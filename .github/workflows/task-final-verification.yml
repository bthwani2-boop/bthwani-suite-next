name: BThwani Task Final Verification

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Task/gap id this run verifies, e.g. GAP-0001.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: remediation-final-verification-${{ inputs.task_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Aggregate same-commit closure evidence (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Validate governed remediation contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .diagnostics/remediation/evidence/${{ inputs.task_id }}
          pnpm run guard:remediation-governance
          pnpm run guard:task-contract
          pnpm run guard:gap-ledger
          pnpm run guard:same-commit-evidence

      - name: Reconcile task state and render the decision summary
        shell: bash
        run: |
          set -euo pipefail
          node tools/remediation/orchestrator/reconcile-task-state.mjs "${{ inputs.task_id }}" \
            > .diagnostics/remediation/evidence/${{ inputs.task_id }}/reconcile-result.json || true
          bucket_path=""
          for bucket in active blocked completed archived; do
            candidate="governance/remediation/tasks/${bucket}/${{ inputs.task_id }}.json"
            if [ -f "$candidate" ]; then
              bucket_path="$candidate"
            fi
          done
          if [ -n "$bucket_path" ]; then
            node tools/remediation/evidence/render-decision-summary.mjs "$bucket_path" \
              > .diagnostics/remediation/evidence/${{ inputs.task_id }}/decision.json
          else
            echo "No task contract found for ${{ inputs.task_id }}; decision stays NEEDS_EVIDENCE." >&2
          fi

      - name: Reject any tracked source mutation
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- . ':(exclude).diagnostics'; then
            echo "Task verification workflows are read-only." >&2
            git status --short -- . ':(exclude).diagnostics' >&2
            exit 1
          fi

      - name: Export final verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-final-verification-${{ inputs.task_id }}-${{ github.run_id }}
          path: .diagnostics/remediation/evidence/${{ inputs.task_id }}
          if-no-files-found: warn
          retention-days: 14
