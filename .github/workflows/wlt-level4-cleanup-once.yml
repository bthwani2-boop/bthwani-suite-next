name: WLT Level4 Cleanup Once

on:
  push:
    branches:
      - g
    paths:
      - .github/workflows/wlt-level4-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable trigger candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/g | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA" || {
            echo "::error::g advanced concurrently: trigger=$GITHUB_SHA remote=$remote_sha"
            exit 1
          }

      - name: Set up canonical WLT Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/wlt/backend/go.mod
          cache-dependency-path: services/wlt/backend/go.sum

      - name: Apply exact residue cleanup
        run: python3 tools/scripts/wlt-level4-cleanup-once.py

      - name: Install pinned golangci-lint
        shell: bash
        run: |
          set -euo pipefail
          version="2.13.2"
          archive="${RUNNER_TEMP}/golangci-lint-${version}-linux-amd64.tar.gz"
          curl -fsSL "https://github.com/golangci/golangci-lint/releases/download/v${version}/golangci-lint-${version}-linux-amd64.tar.gz" -o "$archive"
          echo "2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/golangci-lint-${version}-linux-amd64" >> "$GITHUB_PATH"

      - name: Verify WLT backend after cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cd services/wlt/backend
          golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml" ./...
          go test ./... -count=1
          go build ./...

      - name: Commit only verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -n "$(git status --porcelain)" || {
            echo "::error::cleanup produced no changes"
            exit 1
          }
          remote_sha="$(git ls-remote origin refs/heads/g | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA" || {
            echo "::error::g advanced during verification: trigger=$GITHUB_SHA remote=$remote_sha"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/wlt/backend
          git commit -m "cleanup(wlt): remove proven lint residue and explicit cleanup discards"
          git push origin HEAD:refs/heads/g
