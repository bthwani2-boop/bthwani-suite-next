name: FOUNDATION-00 Architecture Snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["**"]
    paths:
      - ".github/workflows/foundation-00-snapshot.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - "nx.json"
      - "apps/control-panel/runtime/**"
      - "services/dsh/package.json"
      - "services/dsh/tsconfig.json"
      - "services/dsh/frontend/**"
      - "services/dsh/clients/**"
      - "shared/ui-kit/**"
      - "core/identity/package.json"
      - "core/platform-control/package.json"

permissions:
  contents: read

concurrency:
  group: foundation-00-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Export bounded architecture source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Upload bounded source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-00-architecture-${{ github.event.pull_request.head.sha }}
          path: |
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            tsconfig.base.json
            nx.json
            apps/control-panel/runtime
            services/dsh/package.json
            services/dsh/tsconfig.json
            services/dsh/frontend
            services/dsh/clients
            shared/ui-kit
            core/identity/package.json
            core/platform-control/package.json
          if-no-files-found: error
          retention-days: 1
