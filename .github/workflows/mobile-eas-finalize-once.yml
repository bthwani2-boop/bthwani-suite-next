name: One-time mobile EAS finalization

on:
  push:
    branches: [reemsam]
    paths:
      - ".github/workflows/mobile-eas-finalize-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reemsam
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: reemsam
          fetch-depth: 0

      - name: Remove non-build FCM dependency
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tools/scripts/mobile-eas.ps1';
          let text = fs.readFileSync(file, 'utf8');
          const removals = [
            "$FcmHelperPath = Join-Path $RepoRoot 'tools\\scripts\\google-cloud\\prepare-fcm-v1-service-account.ps1'\n",
            "$FcmServiceAccountPath = 'C:\\bthwani-secrets\\firebase\\bthwani-platform-fcm-v1-service-account.json'\n",
            "        if (-not (Test-Path -LiteralPath $FcmServiceAccountPath -PathType Leaf)) {\n            Invoke-Checked -Command 'pwsh' -Arguments @(\n                '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $FcmHelperPath, '-Apply'\n            ) | Out-Null\n        }\n",
            "    $FcmHelperPath,\n",
          ];
          for (const value of removals) {
            if (!text.includes(value)) throw new Error(`Expected mobile EAS fragment was not found: ${value}`);
            text = text.replace(value, '');
          }
          if (/FcmHelperPath|FcmServiceAccountPath/.test(text)) {
            throw new Error('FCM sending credential is still coupled to the build workflow.');
          }
          fs.writeFileSync(file, text);
          NODE

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'tools/scripts/mobile-eas.ps1',
            'tools/scripts/mobile-eas/ensure-firebase-app.ps1',
            'tools/scripts/google-cloud/create-android-maps-api-key.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if (@($errors).Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file: $($_.Message)" }
              exit 1
            }
          }

      - name: Validate JavaScript and contracts
        run: |
          node --check tools/scripts/eas-build-mobile.mjs
          node --check tools/scripts/sync-mobile-apps.mjs
          node --check tools/scripts/guard-mobile-apps.mjs
          node --check tools/scripts/verify-mobile-prebuild.mjs
          node --test apps/app-client/runtime/tests/mobile-development-provider-contract.test.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8'))"

      - name: Reject obsolete mobile EAS paths
        shell: bash
        run: |
          set -euo pipefail
          forbidden='bootstrap-mobile-eas-android-development\.ps1|setup-mobile-firebase-development\.ps1|prepare-google-platform-all-surfaces\.ps1|configure-eas-fcm-v1-all-apps\.ps1|mobile:eas:build:all:dev|mobile:eas:preflight:all:dev'
          if git grep -n -E "${forbidden}" -- ':!governance/evidence/**'; then
            echo 'Obsolete mobile EAS references remain.' >&2
            exit 1
          fi

      - name: Remove this one-time workflow
        run: rm .github/workflows/mobile-eas-finalize-once.yml

      - name: Commit finalization
        run: |
          git config user.name "bthwani-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/scripts/mobile-eas.ps1 .github/workflows/mobile-eas-finalize-once.yml
          git commit -m "fix(mobile): decouple push sending from EAS build"
          git push origin HEAD:reemsam
