name: BThwani Node Verification

on:
  workflow_call:
    inputs:
      base_sha: { type: string, required: true }
      head_sha: { type: string, required: true }
      full_scope: { type: string, required: true }
      frontend: { type: string, required: true }
      mobile: { type: string, required: true }
      heavy: { type: string, required: true }
      verification_tier: { type: string, required: true }
      execution_phase: { type: string, required: true }
      journey: { type: string, required: true }
      journey_scope: { type: string, required: false, default: "" }
      platform_change_sets: { type: string, required: true }

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: ${{ inputs.verification_tier }} Node verification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${CANDIDATE_SHA}" || "${ROUTED_HEAD_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "::error::Routed head SHA mismatch: routed=${ROUTED_HEAD_SHA:-<empty>} event=${CANDIDATE_SHA:-<empty>}"
            exit 1
          fi
      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact candidate and fetch base
        uses: ./.github/actions/fetch-exact-commits
        with:
          base_sha: ${{ inputs.base_sha }}
          head_sha: ${{ env.CANDIDATE_SHA }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Verify patch whitespace
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ env.CANDIDATE_SHA }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ inputs.verification_tier }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ env.CANDIDATE_SHA }}
          restore-keys: |
            nx-${{ inputs.verification_tier }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
            nx-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - name: Verify exact affected or full Node graph
        id: node_graph
        continue-on-error: true
        env:
          NX_BASE: ${{ inputs.base_sha }}
          NX_HEAD: ${{ env.CANDIDATE_SHA }}
          FULL_SCOPE: ${{ inputs.full_scope }}
          MOBILE: ${{ inputs.mobile }}
          VERIFICATION_TIER: ${{ inputs.verification_tier }}
          EXECUTION_PHASE: ${{ inputs.execution_phase }}
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/node-graph-verification.log"
          : >"${log}"
          run_check() {
            echo "===== $* =====" | tee -a "${log}"
            "$@" 2>&1 | tee -a "${log}"
            return "${PIPESTATUS[0]}"
          }
          status=0
          if [[ "${MOBILE}" == "true" ]]; then
            run_check node --test apps/mobile/tests/*.test.mjs || status=$?
          fi
          if [[ "${FULL_SCOPE}" == "true" && ( "${EXECUTION_PHASE}" == "closure" || "${EXECUTION_PHASE}" == "master" || "${EXECUTION_PHASE}" == "b" ) ]]; then
            run_check pnpm exec nx run-many -t typecheck lint test build --all --outputStyle=stream || status=$?
          elif [[ "${VERIFICATION_TIER}" == "fast" ]]; then
            run_check node tools/scripts/run-affected-verification.mjs typecheck lint test || status=$?
          else
            run_check node tools/scripts/run-affected-verification.mjs typecheck lint test build || status=$?
          fi
          exit "${status}"
      - name: Upload Node graph diagnostics
        if: ${{ steps.node_graph.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-graph-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/node-graph-verification.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Node graph result
        if: ${{ steps.node_graph.outcome == 'failure' }}
        run: exit 1
      - name: Verify Expo configuration for deep frontend changes
        if: ${{ inputs.frontend == 'true' && inputs.verification_tier == 'deep' }}
        run: pnpm run mobile:expo:verify

  journeys:
    name: Run detected journey gates
    if: ${{ inputs.journey == 'true' && inputs.journey_scope != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${CANDIDATE_SHA}" || "${ROUTED_HEAD_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "::error::Routed head SHA mismatch: routed=${ROUTED_HEAD_SHA:-<empty>} event=${CANDIDATE_SHA:-<empty>}"
            exit 1
          fi
      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact candidate and fetch base
        uses: ./.github/actions/fetch-exact-commits
        with:
          base_sha: ${{ inputs.base_sha }}
          head_sha: ${{ env.CANDIDATE_SHA }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Materialize contracts through the Nx owner
        run: pnpm exec nx run contracts:materialize
      - name: Run detected journey gates
        id: journey_gates
        continue-on-error: true
        shell: pwsh
        env:
          JOURNEY_SCOPE: ${{ inputs.journey_scope }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP "journey-gates.log"
          Set-Content -Path $log -Value ""
          $journeys = @($env:JOURNEY_SCOPE -split ',' | Where-Object { $_ -and $_.Trim() } | ForEach-Object { $_.Trim().ToUpperInvariant() } | Select-Object -Unique)
          $journeyOutput = & ./tools/scripts/run-journey-gate.ps1 -Journey ($journeys -join ',') 2>&1
          $exitCode = if ($null -eq $LASTEXITCODE) { 1 } else { $LASTEXITCODE }
          $journeyOutput | Tee-Object -FilePath $log -Append
          exit $exitCode
      - name: Upload journey gate diagnostics
        if: ${{ steps.journey_gates.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journey-gates-${{ github.run_id }}
          path: ${{ runner.temp }}/journey-gates.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce journey gate result
        if: ${{ steps.journey_gates.outcome == 'failure' }}
        run: exit 1

  platform_change_sets:
    name: Verify platform change-set binding
    if: ${{ inputs.platform_change_sets == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${CANDIDATE_SHA}" || "${ROUTED_HEAD_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "::error::Routed head SHA mismatch: routed=${ROUTED_HEAD_SHA:-<empty>} event=${CANDIDATE_SHA:-<empty>}"
            exit 1
          fi
      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact candidate and fetch base
        uses: ./.github/actions/fetch-exact-commits
        with:
          base_sha: ${{ inputs.base_sha }}
          head_sha: ${{ env.CANDIDATE_SHA }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Materialize contracts through the Nx owner
        run: pnpm exec nx run contracts:materialize
      - name: Verify platform change-set binding
        id: platform_change_sets
        continue-on-error: true
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/platform-change-sets.log"
          status=0
          run_check() {
            echo "===== $* =====" | tee -a "${log}"
            "$@" 2>&1 | tee -a "${log}"
            code=${PIPESTATUS[0]}
            if [[ "${code}" -ne 0 ]]; then status="${code}"; fi
          }
          run_check pnpm --dir services/dsh exec tsc -p tsconfig.platform-change-sets.json --noEmit --pretty false
          run_check git diff --exit-code -- \
            core/platform-control/contracts/generated/platform-control.bundle.openapi.yaml \
            core/platform-control/clients/generated/platform-control-api.ts
          run_check node tools/guards/platform-change-sets-gate.mjs
          exit "${status}"
      - name: Upload platform change-set diagnostics
        if: ${{ steps.platform_change_sets.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-change-sets-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-change-sets.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce platform change-set result
        if: ${{ steps.platform_change_sets.outcome == 'failure' }}
        run: exit 1
