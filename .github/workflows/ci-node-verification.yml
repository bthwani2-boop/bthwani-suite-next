name: BThwani Node Verification

on:
  workflow_call:
    inputs:
      base_sha: {type: string, required: true}
      candidate_sha: {type: string, required: true}
      full_scope: {type: string, required: true}
      contracts: {type: string, required: true}
      ci_control_plane: {type: string, required: true}
      dependency_changed: {type: string, required: true}
      platform: {type: string, required: true}

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  verify:
    name: Node verification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ && "${ROUTED_CANDIDATE_SHA}" == "${CANDIDATE_SHA}" ]] || {
            echo "::error::Invalid routed candidate SHA"; exit 1;
          }
      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact candidate and fetch base
        uses: ./.github/actions/fetch-exact-commits
        with:
          base_sha: ${{ inputs.base_sha }}
          head_sha: ${{ env.CANDIDATE_SHA }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Verify patch whitespace
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ env.CANDIDATE_SHA }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Restore Nx computation cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ env.CANDIDATE_SHA }}
          restore-keys: |
            nx-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
            nx-
      - name: Materialize contracts when affected
        if: ${{ inputs.contracts == 'true' }}
        run: pnpm exec nx run contracts:materialize
      - name: Verify affected or full Node graph
        id: node_graph
        continue-on-error: true
        env:
          NX_BASE: ${{ inputs.base_sha }}
          NX_HEAD: ${{ env.CANDIDATE_SHA }}
          FULL_SCOPE: ${{ inputs.full_scope }}
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/node-graph-verification.log"
          : >"${log}"
          run_check() {
            echo "===== $* =====" | tee -a "${log}"
            "$@" 2>&1 | tee -a "${log}"
            return "${PIPESTATUS[0]}"
          }
          status=0
          if [[ "${FULL_SCOPE}" == "true" ]]; then
            run_check pnpm exec nx run-many -t typecheck lint test build --all --outputStyle=stream || status=$?
          else
            run_check node tools/scripts/run-affected-verification.mjs typecheck lint test || status=$?
          fi
          exit "${status}"
      - name: Upload Node graph diagnostics
        if: ${{ steps.node_graph.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-graph-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/node-graph-verification.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Node graph result
        if: ${{ steps.node_graph.outcome == 'failure' }}
        run: exit 1
      - name: Verify CI control-plane tests
        if: ${{ inputs.ci_control_plane == 'true' }}
        run: |
          node --test tools/scripts/detect-ci-context.test.mjs
          node --test tools/scripts/ci-routing.test.mjs
          node --test tools/scripts/ci-runtime-bootstrap-policy.test.mjs
      - name: Verify Platform contract and generated client when affected
        if: ${{ inputs.platform == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm run openapi:generate:platform-control
          pnpm --dir services/dsh exec tsc -p tsconfig.platform-change-sets.json --noEmit --pretty false
          node tools/guards/platform-change-sets-gate.mjs
          git diff --exit-code -- core/platform-control/contracts/generated/platform-control.bundle.openapi.yaml core/platform-control/clients/generated/platform-control-api.ts
          test -z "$(git status --porcelain -- core/platform-control/contracts/generated/platform-control.bundle.openapi.yaml core/platform-control/clients/generated/platform-control-api.ts)"

      - name: Verify dependency integrity when affected
        if: ${{ inputs.dependency_changed == 'true' }}
        run: pnpm install --frozen-lockfile --ignore-scripts
