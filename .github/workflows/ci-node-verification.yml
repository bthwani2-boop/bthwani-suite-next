name: BThwani Node Verification

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      full_verification:
        type: string
        required: true
      frontend:
        type: string
        required: true
      heavy:
        type: string
        required: true
      journey:
        type: string
        required: true
      journey_scope:
        type: string
        required: false
        default: ""
      platform_change_sets:
        type: string
        required: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Verify Node typecheck
    if: ${{ inputs.full_verification == 'true' || inputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-typecheck-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-typecheck-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - name: Verify Node typecheck
        env:
          NX_BASE: ${{ inputs.base_sha }}
          NX_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.full_verification }}" == "true" ]]; then
            pnpm run nx:typecheck
          else
            pnpm run affected:typecheck
          fi

  lint:
    name: Verify Node lint
    if: ${{ inputs.full_verification == 'true' || inputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-lint-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-lint-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - name: Verify Node lint
        env:
          NX_BASE: ${{ inputs.base_sha }}
          NX_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.full_verification }}" == "true" ]]; then
            pnpm run nx:lint
          else
            pnpm run affected:lint
          fi

  test:
    name: Verify Node tests
    if: ${{ inputs.full_verification == 'true' || inputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-test-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-test-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - name: Verify Node tests
        env:
          NX_BASE: ${{ inputs.base_sha }}
          NX_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.full_verification }}" == "true" ]]; then
            pnpm run nx:test
          else
            pnpm run affected:test
          fi

  build:
    name: Verify Node build
    if: ${{ inputs.full_verification == 'true' || (inputs.frontend == 'true' && inputs.heavy == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-build-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-build-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - name: Verify Node build
        env:
          NX_BASE: ${{ inputs.base_sha }}
          NX_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.full_verification }}" == "true" ]]; then
            pnpm run nx:build
          else
            pnpm run affected:build
          fi

  journeys:
    name: Run detected journey gates
    if: ${{ inputs.journey == 'true' && inputs.journey_scope != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Run detected journey gates
        shell: pwsh
        env:
          JOURNEY_SCOPE: ${{ inputs.journey_scope }}
        run: |
          $journeys = $env:JOURNEY_SCOPE -split ',' | Where-Object { $_ -and $_.Trim() }
          foreach ($journey in $journeys) {
            ./tools/scripts/run-journey-gate.ps1 -Journey $journey.Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  platform_change_sets:
    name: Verify platform change-set binding
    if: ${{ inputs.platform_change_sets == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify platform change-set binding
        run: |
          pnpm --dir services/dsh exec tsc -p tsconfig.jrn-040.json --noEmit --pretty false
          pnpm --dir services/dsh exec openapi-typescript ../../core/platform-control/contracts/jrn-040-platform-change-sets.openapi.yaml -o /tmp/platform-change-sets-api.ts
          node tools/guards/jrn-040-platform-change-sets-gate.mjs
