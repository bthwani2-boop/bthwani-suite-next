name: BThwani Node Verification

on:
  workflow_call:
    inputs:
      base_sha: { type: string, required: true }
      head_sha: { type: string, required: true }
      full_verification: { type: string, required: true }
      frontend: { type: string, required: true }
      heavy: { type: string, required: true }
      verification_tier: { type: string, required: true }
      journey: { type: string, required: true }
      journey_scope: { type: string, required: false, default: "" }
      platform_change_sets: { type: string, required: true }

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.verification_tier }} Node verification
    if: ${{ inputs.full_verification == 'true' || inputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Restore Nx computation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ inputs.verification_tier }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ inputs.verification_tier }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
            nx-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - name: Verify immutable diff
        run: git diff --check "${{ inputs.base_sha }}" "${{ inputs.head_sha }}"
      - name: Verify exact affected or full Node graph
        env:
          NX_BASE: ${{ inputs.base_sha }}
          NX_HEAD: ${{ inputs.head_sha }}
          FULL_VERIFICATION: ${{ inputs.full_verification }}
          VERIFICATION_TIER: ${{ inputs.verification_tier }}
        run: |
          set +e
          log="${RUNNER_TEMP}/node-verification.log"
          status=0
          if [[ "${FULL_VERIFICATION}" == "true" ]]; then
            {
              pnpm run nx:typecheck
              pnpm run nx:lint
              pnpm run nx:test
              pnpm run nx:build
            } >"${log}" 2>&1 || status=$?
          elif [[ "${VERIFICATION_TIER}" == "fast" ]]; then
            node tools/scripts/run-affected-verification.mjs typecheck lint test >"${log}" 2>&1 || status=$?
          else
            node tools/scripts/run-affected-verification.mjs typecheck lint test build >"${log}" 2>&1 || status=$?
          fi
          tail -n 200 "${log}"
          exit "${status}"
      - name: Upload Node verification log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/node-verification.log
          if-no-files-found: error
          retention-days: 1
      - name: Verify Expo configuration for deep frontend changes
        if: ${{ inputs.frontend == 'true' && inputs.verification_tier == 'deep' }}
        run: pnpm run mobile:expo:verify

  journeys:
    name: Run detected journey gates
    if: ${{ inputs.journey == 'true' && inputs.journey_scope != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Run detected journey gates
        shell: pwsh
        env:
          JOURNEY_SCOPE: ${{ inputs.journey_scope }}
        run: |
          $journeys = $env:JOURNEY_SCOPE -split ',' | Where-Object { $_ -and $_.Trim() }
          foreach ($journey in $journeys) {
            & ./tools/scripts/run-journey-gate.ps1 -Journey $journey.Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  platform_change_sets:
    name: Verify platform change-set binding
    if: ${{ inputs.platform_change_sets == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify platform change-set binding
        run: pnpm exec tsc --noEmit -p services/dsh/tsconfig.jrn-040.json
