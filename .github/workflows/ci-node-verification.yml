name: BThwani Node Verification

on:
  workflow_call:
    inputs:
      base_sha: {type: string, required: true}
      candidate_sha: {type: string, required: true}
      full_scope: {type: string, required: true}
      contracts: {type: string, required: true}
      ci_control_plane: {type: string, required: true}
      dependency_changed: {type: string, required: true}
      platform: {type: string, required: true}
      typed_lint_required: {type: string, required: true}

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  verify:
    name: Node verification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ && "${ROUTED_CANDIDATE_SHA}" == "${CANDIDATE_SHA}" ]] || {
            echo "::error::Invalid routed candidate SHA"; exit 1;
          }
      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact candidate and fetch base
        uses: ./.github/actions/fetch-exact-commits
        with:
          base_sha: ${{ inputs.base_sha }}
          head_sha: ${{ env.CANDIDATE_SHA }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Check patch whitespace
        id: whitespace
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ env.CANDIDATE_SHA }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Run typed ESLint through Project Service
        id: typed_lint
        if: ${{ inputs.typed_lint_required == 'true' }}
        continue-on-error: true
        run: pnpm run lint:typed

      - name: Restore Nx computation cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ env.CANDIDATE_SHA }}
          restore-keys: |
            nx-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
            nx-
      - name: Materialize contracts when affected
        id: materialize
        if: ${{ inputs.contracts == 'true' }}
        continue-on-error: true
        run: pnpm exec nx run contracts:materialize
      - name: Verify generated contract provenance and Identity ownership
        id: contract_provenance
        if: ${{ inputs.contracts == 'true' && steps.materialize.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node tools/guards/generated-client-provenance-gate.mjs
          node tools/guards/identity-contract-ownership-gate.mjs
          node tools/guards/go-module-topology-gate.mjs
      - name: Verify all applicable Node targets without first-failure masking
        id: node_graph
        if: ${{ inputs.contracts != 'true' || steps.materialize.outcome == 'success' }}
        continue-on-error: true
        env:
          NX_BASE: ${{ inputs.base_sha }}
          NX_HEAD: ${{ env.CANDIDATE_SHA }}
          FULL_SCOPE: ${{ inputs.full_scope }}
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/node-graph-verification.log"
          : >"${log}"
          failures=()
          run_check() {
            local label="$1"
            shift
            echo "===== ${label}: $* =====" | tee -a "${log}"
            "$@" 2>&1 | tee -a "${log}"
            local code="${PIPESTATUS[0]}"
            if (( code != 0 )); then
              failures+=("${label}:${code}")
            fi
          }
          if [[ "${FULL_SCOPE}" == "true" ]]; then
            for target in typecheck lint test build; do
              run_check "${target}" pnpm exec nx run-many -t "${target}" --all --outputStyle=stream --skip-nx-cache
            done
          else
            for target in typecheck lint test; do
              run_check "${target}" node tools/scripts/run-affected-verification.mjs "${target}"
            done
          fi
          if (( ${#failures[@]} )); then
            echo "Node target failures collected: $(IFS=,; echo "${failures[*]}")" | tee -a "${log}"
            exit 1
          fi
          echo "All applicable Node targets passed." | tee -a "${log}"
      - name: Verify CI control-plane tests
        id: ci_control
        if: ${{ inputs.ci_control_plane == 'true' }}
        continue-on-error: true
        run: |
          node --test tools/scripts/detect-ci-context.test.mjs
          node --test tools/scripts/ci-routing.test.mjs
          node --test tools/scripts/ci-verification-window.test.mjs
          node --test tools/scripts/ci-runtime-bootstrap-policy.test.mjs
          node --test tools/scripts/detect-ci-context.property.test.mjs
      - name: Verify Platform contract and generated client when affected
        id: platform_contract
        if: ${{ inputs.platform == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm run openapi:generate:platform-control
          pnpm --dir services/dsh exec tsc -p tsconfig.platform-change-sets.json --noEmit --pretty false
          node tools/guards/platform-change-sets-gate.mjs
          git diff --exit-code -- core/platform-control/contracts/generated/platform-control.bundle.openapi.yaml core/platform-control/clients/generated/platform-control-api.ts
          test -z "$(git status --porcelain -- core/platform-control/contracts/generated/platform-control.bundle.openapi.yaml core/platform-control/clients/generated/platform-control-api.ts)"
      - name: Verify dependency integrity when affected
        id: dependency_integrity
        if: ${{ inputs.dependency_changed == 'true' }}
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Upload Node graph diagnostics
        if: ${{ always() && steps.node_graph.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-graph-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/node-graph-verification.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce complete Node verification collection
        if: ${{ always() }}
        shell: bash
        env:
          WHITESPACE: ${{ steps.whitespace.outcome }}
          CONTRACTS_REQUIRED: ${{ inputs.contracts }}
          MATERIALIZE: ${{ steps.materialize.outcome }}
          CONTRACT_PROVENANCE: ${{ steps.contract_provenance.outcome }}
          NODE_GRAPH: ${{ steps.node_graph.outcome }}
          TYPED_LINT: ${{ steps.typed_lint.outcome }}
          TYPED_LINT_REQUIRED: ${{ inputs.typed_lint_required }}
          CI_CONTROL_REQUIRED: ${{ inputs.ci_control_plane }}
          CI_CONTROL: ${{ steps.ci_control.outcome }}
          PLATFORM_REQUIRED: ${{ inputs.platform }}
          PLATFORM_CONTRACT: ${{ steps.platform_contract.outcome }}
          DEPENDENCY_REQUIRED: ${{ inputs.dependency_changed }}
          DEPENDENCY_INTEGRITY: ${{ steps.dependency_integrity.outcome }}
        run: |
          set -euo pipefail
          failures=()
          [[ "${WHITESPACE}" == "success" ]] || failures+=("whitespace:${WHITESPACE}")
          if [[ "${TYPED_LINT_REQUIRED}" == "true" ]]; then
            [[ "${TYPED_LINT}" == "success" ]] || failures+=("typed-lint:${TYPED_LINT}")
          else
            [[ "${TYPED_LINT}" == "skipped" ]] || failures+=("typed-lint-unexpected:${TYPED_LINT}")
          fi
          if [[ "${CONTRACTS_REQUIRED}" == "true" ]]; then
            [[ "${MATERIALIZE}" == "success" ]] || failures+=("contract-materialization:${MATERIALIZE}")
            if [[ "${MATERIALIZE}" == "success" ]]; then
              [[ "${CONTRACT_PROVENANCE}" == "success" ]] || failures+=("contract-provenance:${CONTRACT_PROVENANCE}")
              [[ "${NODE_GRAPH}" == "success" ]] || failures+=("node-graph:${NODE_GRAPH}")
            else
              echo "Contract provenance and node graph BLOCKED_BY contract-materialization:${MATERIALIZE}"
            fi
          else
            [[ "${MATERIALIZE}" == "skipped" ]] || failures+=("contract-materialization-unexpected:${MATERIALIZE}")
            [[ "${CONTRACT_PROVENANCE}" == "skipped" ]] || failures+=("contract-provenance-unexpected:${CONTRACT_PROVENANCE}")
            [[ "${NODE_GRAPH}" == "success" ]] || failures+=("node-graph:${NODE_GRAPH}")
          fi
          if [[ "${CI_CONTROL_REQUIRED}" == "true" ]]; then
            [[ "${CI_CONTROL}" == "success" ]] || failures+=("ci-control:${CI_CONTROL}")
          else
            [[ "${CI_CONTROL}" == "skipped" ]] || failures+=("ci-control-unexpected:${CI_CONTROL}")
          fi
          if [[ "${PLATFORM_REQUIRED}" == "true" ]]; then
            [[ "${PLATFORM_CONTRACT}" == "success" ]] || failures+=("platform-contract:${PLATFORM_CONTRACT}")
          else
            [[ "${PLATFORM_CONTRACT}" == "skipped" ]] || failures+=("platform-contract-unexpected:${PLATFORM_CONTRACT}")
          fi
          if [[ "${DEPENDENCY_REQUIRED}" == "true" ]]; then
            [[ "${DEPENDENCY_INTEGRITY}" == "success" ]] || failures+=("dependency-integrity:${DEPENDENCY_INTEGRITY}")
          else
            [[ "${DEPENDENCY_INTEGRITY}" == "skipped" ]] || failures+=("dependency-integrity-unexpected:${DEPENDENCY_INTEGRITY}")
          fi
          if (( ${#failures[@]} )); then
            echo "::error::Node verification failed after collecting all independently executable checks: $(IFS=,; echo "${failures[*]}")"
            exit 1
          fi
          echo "Complete Node verification collection passed."
