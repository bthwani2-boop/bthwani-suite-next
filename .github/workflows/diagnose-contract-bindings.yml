name: Diagnose Contract Bindings

on:
  push:
    branches: [reemsam]
    paths: [.github/workflows/diagnose-contract-bindings.yml]
  pull_request:
    branches: [master]
    paths: [.github/workflows/diagnose-contract-bindings.yml]

permissions:
  contents: read

jobs:
  diagnose:
    name: Capture contract and lint diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Run contract lint diagnostics
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/contract-diagnostic"
          pnpm --dir contracts lint 2>&1 | tee "${RUNNER_TEMP}/contract-diagnostic/contracts-lint.log"
      - name: Run backend binding diagnostics
        id: backend
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tools/guards/backend-api-binding-gate.mjs 2>&1 | tee "${RUNNER_TEMP}/contract-diagnostic/backend-api-binding.log"
      - name: Upload contract diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-binding-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/contract-diagnostic/*.log
          if-no-files-found: error
          retention-days: 2
      - name: Preserve diagnostic result
        if: ${{ steps.contracts.outcome == 'failure' || steps.backend.outcome == 'failure' }}
        run: exit 1
