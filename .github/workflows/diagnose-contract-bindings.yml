name: Repair Contract Registry

on:
  push:
    branches: [reemsam]
    paths: [.github/workflows/diagnose-contract-bindings.yml]
  pull_request:
    branches: [master]
    paths: [.github/workflows/diagnose-contract-bindings.yml]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: repair-contract-registry-reemsam
  cancel-in-progress: true

jobs:
  repair:
    name: Remove superseded JRN-029 registration
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          ref: reemsam
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Repair and verify registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
from pathlib import Path
path = Path('services/dsh/contracts/contract-registry.ts')
text = path.read_text()
union = '    | "dsh-operational-policy"\n'
block = '''  {
    id: "dsh-operational-policy",
    path: "contracts/dsh.jrn-029.openapi.yaml",
    state: "CONTRACT_ACTIVE",
    runtimeDependency: true,
    clientStrategy: "STANDALONE_MANUAL_TYPED_ADAPTER",
    adapterOwner: "frontend/shared/platform",
  },
'''
if text.count(union) != 1:
    raise SystemExit('expected exactly one dsh-operational-policy union registration')
if text.count(block) != 1:
    raise SystemExit('expected exactly one dsh-operational-policy registry entry')
path.write_text(text.replace(union, '').replace(block, ''))
PY
          pnpm --dir contracts lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/dsh/contracts/contract-registry.ts
          git commit -m "fix(contracts): remove superseded JRN-029 registry entry"
          git push origin HEAD:reemsam
