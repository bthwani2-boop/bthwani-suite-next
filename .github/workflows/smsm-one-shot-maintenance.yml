name: SMSM one-shot manifest finalization

on:
  push:
    branches: [smsm]
    paths:
      - .github/workflows/smsm-one-shot-maintenance.yml

permissions:
  contents: write

concurrency:
  group: smsm-one-shot-maintenance
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smsm
          fetch-depth: 0

      - name: Finalize DSH migration manifest and command formatting
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          migration_dir = Path("services/dsh/database/migrations")
          migration_name = "dsh-969_partner_team_manager_role.sql"
          migration_path = migration_dir / migration_name
          manifest_path = migration_dir / "manifest.json"

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest["migrations"][-1]["file"] != "dsh-968_cod_operator_context_isolation.sql":
              raise SystemExit("unexpected DSH migration cutover; refusing one-shot mutation")
          if any(entry["file"] == migration_name for entry in manifest["migrations"]):
              raise SystemExit("DSH-969 is already registered; refusing duplicate mutation")

          manifest["migrations"][-1]["state"] = "HISTORICAL_IMMUTABLE"
          manifest["migrations"].append({
              "ordinal": len(manifest["migrations"]) + 1,
              "file": migration_name,
              "sha256": hashlib.sha256(migration_path.read_bytes()).hexdigest(),
              "historicalPrefix": "969",
              "state": "ACTIVE",
          })
          manifest["cutover"] = migration_name
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          command_path = Path("tools/BThwani-unified-execution-command-final-authoritative.md")
          command_text = command_path.read_text(encoding="utf-8")
          command_path.write_text(command_text.rstrip("\n") + "\n", encoding="utf-8")

          Path(".github/workflows/smsm-one-shot-maintenance.yml").unlink()

      - name: Commit one-shot result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bthwani-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/dsh/database/migrations/manifest.json \
                  tools/BThwani-unified-execution-command-final-authoritative.md \
                  .github/workflows/smsm-one-shot-maintenance.yml
          git diff --cached --check
          git commit -m "chore(governance): finalize migration manifest and command formatting"
          git push origin HEAD:smsm
