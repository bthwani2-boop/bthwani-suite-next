name: Captain Router Verify One Shot

on:
  push:
    branches: [c]
    paths:
      - .github/workflows/captain-router-verify-one-shot.yml

permissions:
  contents: write

concurrency:
  group: captain-router-verify-c
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact c candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.34.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          check-latest: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Execute exact Captain verification and record every gate
        id: verify
        shell: bash
        run: |
          set -uo pipefail
          report="${RUNNER_TEMP}/captain-router-verification.log"
          : >"${report}"
          failed=0

          run_gate() {
            local name="$1"
            shift
            {
              echo
              echo "===== ${name} ====="
              echo "+ $*"
            } | tee -a "${report}"
            "$@" >>"${report}" 2>&1
            local rc=$?
            echo "exit=${rc}" | tee -a "${report}"
            if [[ ${rc} -ne 0 ]]; then
              failed=1
            fi
            return 0
          }

          run_gate "node-version" bash -lc 'test "$(node --version)" = "v24.17.0"'
          run_gate "pnpm-version" bash -lc 'test "$(pnpm --version)" = "10.34.0"'
          run_gate "frozen-install" pnpm install --frozen-lockfile --ignore-scripts

          if [[ ${failed} -eq 0 ]]; then
            run_gate "sdk56-guard" node tools/scripts/guard-mobile-expo-sdk56-versions.mjs
            run_gate "captain-typecheck" pnpm --dir apps/app-captain/runtime run typecheck
            run_gate "captain-lint" pnpm --dir apps/app-captain/runtime run lint
            run_gate "captain-tests" pnpm --dir apps/app-captain/runtime run test
            run_gate "dsh-typecheck" pnpm --dir services/dsh run typecheck
            run_gate "dsh-tests" pnpm --dir services/dsh run test
            run_gate "captain-export" pnpm --dir apps/app-captain/runtime run build
            for app in app-client app-partner app-captain app-field; do
              run_gate "expo-config-${app}" pnpm --dir "apps/${app}/runtime" exec expo config --type public
            done
          fi

          echo "failed=${failed}" >>"${GITHUB_OUTPUT}"
          cp "${report}" captain-router-verification.log
          exit 0

      - name: Publish durable result and retire verifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin c --depth=1
          remote_head="$(git rev-parse origin/c)"
          local_head="$(git rev-parse HEAD)"
          if [[ "${remote_head}" != "${local_head}" ]]; then
            echo "c moved while Captain verification was running: remote=${remote_head} local=${local_head}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/captain-router-verify-one-shot.yml

          if [[ "${{ steps.verify.outputs.failed }}" == "1" ]]; then
            mkdir -p plans/diagnose-implementing
            mv captain-router-verification.log plans/diagnose-implementing/captain-router-verification-failure.log
            git add plans/diagnose-implementing/captain-router-verification-failure.log
            message="diagnose(captain): record Router verification failure"
          else
            rm -f captain-router-verification.log
            message="chore(ci): retire successful Captain Router verification"
          fi

          git diff --cached --check
          git commit -m "${message}"
          git push origin HEAD:c
