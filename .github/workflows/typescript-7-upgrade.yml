name: TypeScript 7 One-Shot Upgrade

on:
  push:
    branches:
      - task/typescript-7-readiness

permissions:
  contents: write

concurrency:
  group: typescript-7-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Upgrade workspace manifests and isolate Compiler API consumers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const ts7 = '7.0.2';
          const ts6 = '6.0.3';
          const tracked = execFileSync('git', ['ls-files'], { encoding: 'utf8' })
            .split(/\r?\n/u)
            .filter(Boolean);

          const packageFiles = tracked.filter((file) => file === 'package.json' || file.endsWith('/package.json'));
          let manifestUpdates = 0;

          for (const file of packageFiles) {
            const text = fs.readFileSync(file, 'utf8');
            const pkg = JSON.parse(text);
            let changed = false;

            for (const sectionName of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              const section = pkg[sectionName];
              if (section && Object.prototype.hasOwnProperty.call(section, 'typescript')) {
                if (section.typescript !== ts7) {
                  section.typescript = ts7;
                  changed = true;
                }
              }
            }

            if (file === 'package.json') {
              pkg.devDependencies ??= {};
              if (pkg.devDependencies['@typescript/typescript6'] !== ts6) {
                pkg.devDependencies['@typescript/typescript6'] = ts6;
                changed = true;
              }
            }

            if (changed) {
              fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`, 'utf8');
              manifestUpdates += 1;
            }
          }

          const codeExtensions = /\.(?:[cm]?[jt]sx?|mjs|cjs)$/u;
          const codeFiles = tracked.filter((file) => codeExtensions.test(file));
          let apiConsumerUpdates = 0;

          for (const file of codeFiles) {
            const original = fs.readFileSync(file, 'utf8');
            let updated = original
              .replace(/(\bfrom\s+)(["'])typescript\2/gu, '$1$2@typescript/typescript6$2')
              .replace(/(\bimport\s*)(["'])typescript\2/gu, '$1$2@typescript/typescript6$2')
              .replace(/(\bimport\s*\(\s*)(["'])typescript\2(\s*\))/gu, '$1$2@typescript/typescript6$2$3')
              .replace(/(\brequire\s*\(\s*)(["'])typescript\2(\s*\))/gu, '$1$2@typescript/typescript6$2$3');

            if (updated !== original) {
              fs.writeFileSync(file, updated, 'utf8');
              apiConsumerUpdates += 1;
            }
          }

          const verificationScript = 'tools/scripts/verify-typescript-7-readiness.ps1';
          if (fs.existsSync(verificationScript)) {
            const original = fs.readFileSync(verificationScript, 'utf8');
            const updated = original
              .replace('$expectedTypeScriptVersion = "6.0.3"', '$expectedTypeScriptVersion = "7.0.2"')
              .replace('if ($declaredTypeScript -ne "~$expectedTypeScriptVersion")', 'if ($declaredTypeScript -ne $expectedTypeScriptVersion)')
              .replace("Expected package.json to keep TypeScript at '~$expectedTypeScriptVersion'", "Expected package.json to declare TypeScript '$expectedTypeScriptVersion'")
              .replace('Decision: READY_FOR_TYPESCRIPT_7_EXPERIMENT', 'Decision: TYPESCRIPT_7_UPGRADE_VERIFIED');
            if (updated !== original) {
              fs.writeFileSync(verificationScript, updated, 'utf8');
            }
          }

          console.log(`Updated TypeScript declarations in ${manifestUpdates} package manifests.`);
          console.log(`Redirected ${apiConsumerUpdates} Compiler API consumers to @typescript/typescript6.`);
          NODE

      - name: Regenerate deterministic lockfile
        shell: bash
        run: pnpm install --lockfile-only --reporter=append-only

      - name: Install upgraded workspace
        shell: bash
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Verify dual TypeScript toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm exec tsc --version)" = "Version 7.0.2"
          test "$(pnpm exec tsc6 --version)" = "Version 6.0.3"
          node -e "import('@typescript/typescript6').then((ts) => { if (ts.version !== '6.0.3') process.exit(1); console.log('Compiler API compatibility:', ts.version); })"

      - name: Verify TypeScript configuration governance
        shell: bash
        run: node tools/guards/_typescript-readiness-config-gate.mjs

      - name: Typecheck upgraded workspace
        shell: bash
        run: pnpm run typecheck

      - name: Lint upgraded workspace
        shell: bash
        run: pnpm run lint

      - name: Build upgraded workspace
        shell: bash
        run: pnpm run build

      - name: Commit verified TypeScript 7 upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No upgrade changes to commit."
            exit 0
          fi
          git commit -m "feat(ts): upgrade workspace compiler to TypeScript 7.0.2"
          git push origin HEAD:task/typescript-7-readiness
