name: DSH Database Contract

on:
  push:
    branches: ["**"]
    paths:
      - "package.json"
      - "services/dsh/database/**"
      - "services/dsh/backend/go.mod"
      - "services/dsh/backend/go.sum"
      - "services/dsh/package.json"
      - "tools/scripts/check-dsh-database-contract.mjs"
      - "tools/scripts/check-local-media-contract.mjs"
      - ".github/workflows/dsh-database.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "package.json"
      - "services/dsh/database/**"
      - "services/dsh/backend/go.mod"
      - "services/dsh/backend/go.sum"
      - "services/dsh/package.json"
      - "tools/scripts/check-dsh-database-contract.mjs"
      - "tools/scripts/check-local-media-contract.mjs"
      - ".github/workflows/dsh-database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify canonical DSH database path
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dsh_runtime
          POSTGRES_PASSWORD: dsh_runtime_password
          POSTGRES_DB: dsh_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsh_runtime -d dsh_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://dsh_runtime:dsh_runtime_password@localhost:5432/dsh_runtime?sslmode=disable
      PGPASSWORD: dsh_runtime_password
      BTHWANI_ENVIRONMENT: ci
      DSH_REQUIRE_DB_TESTS: "true"
      DSH_TEST_TENANT_ID: ci-dsh

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache-dependency-path: services/dsh/backend/go.sum

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Validate governed database contracts
        run: |
          node tools/scripts/check-local-media-contract.mjs
          node tools/scripts/check-dsh-database-contract.mjs

      - name: Apply canonical DSH migrations
        shell: pwsh
        run: ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action migrate -Transport url -DatabaseUrl $env:DATABASE_URL

      - name: Re-run canonical DSH migrations
        shell: pwsh
        run: ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action migrate -Transport url -DatabaseUrl $env:DATABASE_URL

      - name: Verify DSH migration runner failure contracts
        shell: pwsh
        run: ./services/dsh/database/scripts/test-dsh-migration-runner.ps1 -DatabaseUrl $env:DATABASE_URL

      - name: Run DSH schema database contracts
        shell: pwsh
        run: ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action test -Transport url -DatabaseUrl $env:DATABASE_URL -TestSuite schema

      - name: Apply DSH local seeds twice
        shell: pwsh
        run: |
          ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action seed -Transport url -DatabaseUrl $env:DATABASE_URL -AllowLocalSeeds
          ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action seed -Transport url -DatabaseUrl $env:DATABASE_URL -AllowLocalSeeds

      - name: Run DSH seed database contracts
        shell: pwsh
        run: ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action test -Transport url -DatabaseUrl $env:DATABASE_URL -TestSuite seed
