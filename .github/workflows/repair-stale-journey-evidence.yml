name: Repair Stale Journey Evidence

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/repair-stale-journey-evidence.yml
      - tools/scripts/repair-stale-journey-evidence.py

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: repair-stale-journey-evidence-reemsam
  cancel-in-progress: true

jobs:
  repair:
    name: Update JRN-011 through JRN-015 evidence
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reemsam
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: reemsam
          fetch-depth: 0
          persist-credentials: true
      - name: Correct transformation compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/scripts/repair-stale-journey-evidence.py')
          text = path.read_text()
          old_call = "text, count = re.subn(r'test\\(\"JRN-011 CI is required[\\s\\S]*?\\n\\}\\);\\s*$', replacement, text)"
          new_call = "text, count = re.subn(r'test\\(\"JRN-011 CI is required[\\s\\S]*?\\n\\}\\);\\s*$', lambda _match: replacement, text)"
          if old_call in text:
              text = text.replace(old_call, new_call)
          elif new_call not in text:
              raise SystemExit('JRN-011 transformation call not found')
          text = text.replace(
              'same-commit BThwani Contextual CI and detected JRN-012 journey gate must be success',
              'same-commit CI status for BThwani Contextual CI and detected JRN-012 journey gate must be success',
          )
          old_guard = '''if old not in text:
              raise SystemExit("unable to locate stale JRN-014 adapter marker")
          path.write_text(text.replace(old, new))'''
          new_guard = '''if old in text:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit("JRN-014 adapter marker is neither legacy nor canonical")'''
          if old_guard in text:
              text = text.replace(old_guard, new_guard)
          path.write_text(text)
          PY
      - name: Align journey evidence with contextual architecture
        id: align
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/journey-evidence"
          set +e
          set -o pipefail
          python tools/scripts/repair-stale-journey-evidence.py 2>&1 | tee "${RUNNER_TEMP}/journey-evidence/transform.log"
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Verify repaired journey evidence
        id: verify
        if: ${{ steps.align.outputs.status == '0' }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          node --test \
            services/dsh/tests/jrn-011-slice-closure.test.mjs \
            services/dsh/tests/jrn-012-order-preparation-closure.test.mjs \
            services/dsh/tests/jrn-012-slice-closure.test.mjs \
            services/dsh/tests/jrn-013-primary-contract-sync.test.mjs \
            services/dsh/tests/jrn-013-slice-closure.test.mjs \
            services/dsh/tests/jrn-014-dispatch-integrity.test.mjs \
            services/dsh/tests/jrn-015-pickup-closure.test.mjs \
            2>&1 | tee "${RUNNER_TEMP}/journey-evidence/tests.log"
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Upload journey evidence diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stale-journey-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/journey-evidence/*.log
          if-no-files-found: error
          retention-days: 2
      - name: Fail when transformation or verification failed
        if: ${{ steps.align.outputs.status != '0' || steps.verify.outputs.status != '0' }}
        run: exit 1
      - name: Commit verified evidence repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/dsh tools/guards
          git commit -m "fix(ci): align journey evidence with contextual architecture"
          git push origin HEAD:reemsam
