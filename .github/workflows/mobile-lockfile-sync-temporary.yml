name: Temporary Mobile Lockfile Sync

on:
  pull_request:
    branches: [c]
    paths:
      - "apps/app-*/runtime/package.json"
      - "shared/data-runtime/package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: >-
      github.head_ref == 'automation/mobile-dependency-closure-20260821' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout governed dependency-closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup repository-pinned PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.0

      - name: Setup repository-pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0

      - name: Regenerate only the canonical pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile only when dependency metadata changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          test "$(git diff --cached --name-only)" = "pnpm-lock.yaml"
          git commit -m "chore(mobile): synchronize dependency lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
