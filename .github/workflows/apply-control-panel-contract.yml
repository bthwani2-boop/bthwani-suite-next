name: Apply Control Panel Contract Fix

on:
  push:
    branches: [ala]
    paths:
      - .github/workflows/apply-control-panel-contract.yml

permissions:
  contents: write

concurrency:
  group: apply-control-panel-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ala
          fetch-depth: 1
          persist-credentials: true

      - name: Setup PNPM
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.34.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply control-panel architecture contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const repo = process.cwd();
          const p = (...parts) => path.join(repo, ...parts);
          const exists = (file) => fs.existsSync(p(file));
          const read = (file) => fs.readFileSync(p(file), 'utf8');
          const write = (file, content) => {
            fs.mkdirSync(path.dirname(p(file)), { recursive: true });
            fs.writeFileSync(p(file), content);
          };
          const remove = (file) => fs.rmSync(p(file), { recursive: true, force: true });
          const move = (from, to) => {
            if (!exists(from)) return;
            fs.mkdirSync(path.dirname(p(to)), { recursive: true });
            fs.renameSync(p(from), p(to));
          };
          const json = (file) => JSON.parse(read(file));
          const writeJson = (file, value) => write(file, `${JSON.stringify(value, null, 2)}\n`);
          const walk = (dir) => {
            if (!exists(dir)) return [];
            const out = [];
            for (const entry of fs.readdirSync(p(dir), { withFileTypes: true })) {
              const rel = `${dir}/${entry.name}`;
              if (entry.isDirectory()) out.push(...walk(rel));
              else out.push(rel);
            }
            return out;
          };
          const codeFiles = () => walk('.').filter((file) => /\.(mjs|js|jsx|ts|tsx)$/.test(file) && !file.includes('/node_modules/') && !file.includes('/.next/'));

          const cpFiles = [
            'CpAmountDisplay.tsx','CpBadge.tsx','CpButton.tsx','CpCommonLabels.ts','CpDescriptionList.tsx','CpDetailPanel.tsx','CpExternalLink.tsx','CpFilterBar.tsx','CpInlineCode.tsx','CpKpi.tsx','CpLaneTabs.tsx','CpPageHeader.tsx','CpSearchInput.tsx','CpSelect.tsx','CpStatePanel.tsx','CpStateView.tsx','CpTable.tsx','CpTabs.tsx','CpTextInput.tsx','cpScale.ts','cpTokens.ts','index.ts'
          ];
          for (const file of cpFiles) move(`apps/control-panel/runtime/src/components/cp/${file}`, `shared/control-panel/src/components/${file}`);
          remove('apps/control-panel/runtime/src/components/index.ts');
          remove('apps/control-panel/runtime/src/components/cp');
          remove('apps/control-panel/runtime/src/components');

          const shellFiles = ['DataTablePageFrame.tsx','DetailPageFrame.tsx','EditorPageFrame.tsx','FinanceReadOnlyFrame.tsx','MetricsPageFrame.tsx','OperationsRoomFrame.tsx','OverviewPageFrame.tsx','PaginationToolbar.tsx','QueuePageFrame.tsx','ReviewPageFrame.tsx','SettingsPageFrame.tsx','frameTokens.ts'];
          for (const file of shellFiles) move(`apps/control-panel/runtime/src/shell/${file}`, `shared/control-panel/src/shell/${file}`);

          write('shared/control-panel/package.json', JSON.stringify({
            name: '@bthwani/control-panel',
            version: '0.0.0',
            private: true,
            type: 'module',
            sideEffects: false,
            main: 'src/index.ts',
            types: 'src/index.ts',
            exports: { '.': './src/index.ts', './components': './src/components/index.ts', './shell': './src/shell/index.ts' },
            scripts: { typecheck: 'tsc --noEmit -p tsconfig.json', build: 'tsc --noEmit -p tsconfig.json', lint: 'pnpm --dir ../.. run guard:ui-kit-boundary' },
            dependencies: { '@bthwani/ui-kit': 'workspace:*' },
            peerDependencies: { react: '19.2.3' },
            devDependencies: { '@types/react': '19.2.17', typescript: '~6.0.3' }
          }, null, 2) + '\n');
          write('shared/control-panel/project.json', JSON.stringify({
            name: 'control-panel-shared',
            root: 'shared/control-panel',
            sourceRoot: 'shared/control-panel/src',
            projectType: 'library',
            targets: {
              typecheck: { executor: 'nx:run-commands', options: { command: 'pnpm --dir shared/control-panel typecheck' } },
              build: { executor: 'nx:run-commands', options: { command: 'pnpm --dir shared/control-panel build' } }
            },
            tags: ['scope:control-panel', 'type:ui-library']
          }, null, 2) + '\n');
          write('shared/control-panel/src/index.ts', 'export * from "./components";\nexport * from "./shell";\n');
          write('shared/control-panel/src/shell/index.ts', shellFiles.map((file) => `export * from "./${file.replace(/\.tsx?$|\.ts$/,'')}";`).join('\n') + '\n');
          write('shared/control-panel/tsconfig.json', JSON.stringify({ extends: '../../tsconfig.base.json', compilerOptions: { noEmit: true }, include: ['src/**/*.ts', 'src/**/*.tsx'] }, null, 2) + '\n');

          if (exists('shared/control-panel/src/components/CpStateView.tsx')) {
            let cpStateView = read('shared/control-panel/src/components/CpStateView.tsx');
            cpStateView = cpStateView.replace('import type { CpStateKind } from "@dsh-shared/_kernel/cp-state";\n', '');
            cpStateView = cpStateView.replace('driven by `CpStateKind` (`shared/_kernel/cp-state.ts`).', 'driven by the presentation-only `CpStateKind` owned by this package.');
            if (!cpStateView.includes('export type CpStateKind =')) {
              cpStateView = cpStateView.replace('export type CpStateViewProps = {', 'export type CpStateKind =\n  | "loading"\n  | "empty"\n  | "error"\n  | "offline"\n  | "unauthenticated"\n  | "forbidden"\n  | "blocked";\n\nexport type CpStateViewProps = {');
            }
            write('shared/control-panel/src/components/CpStateView.tsx', cpStateView);
          }
          if (exists('shared/control-panel/src/components/cpScale.ts')) {
            write('shared/control-panel/src/components/cpScale.ts', read('shared/control-panel/src/components/cpScale.ts').replace('apps/control-panel/runtime/src/components/cp/**', 'shared/control-panel/src/components/**'));
          }

          write('services/dsh/frontend/control-panel/navigation.ts', `/** Ordered public navigation contract for the DSH control-panel surface. */
export const DSH_NAV_ITEMS = [
  { section: "dashboard", label: "الرئيسية", route: "/dsh/dashboard" },
  { section: "operations", label: "العمليات", route: "/dsh/operations" },
  { section: "analytics", label: "التحليلات", route: "/dsh/analytics" },
  { section: "partners", label: "الشركاء والمتاجر", route: "/dsh/partners" },
  { section: "catalogs", label: "اعتماد الكتالوجات", route: "/dsh/catalogs" },
  { section: "marketing", label: "التسويق والاكتشاف", route: "/dsh/marketing" },
  { section: "finance", label: "المالية والتسويات", route: "/dsh/finance" },
  { section: "support", label: "الدعم والمساعدة", route: "/dsh/support" },
  { section: "platform", label: "المنصة السيادية", route: "/dsh/platform" },
  { section: "administration", label: "الإدارة والصلاحيات", route: "/dsh/administration" },
  { section: "hr", label: "الموارد البشرية", route: "/dsh/hr" },
] as const;

export type DshSection = (typeof DSH_NAV_ITEMS)[number]["section"];
`);
          write('services/dsh/frontend/control-panel/session.ts', `export { ControlPanelAuthBoundary } from "../shared/session/ControlPanelAuthBoundary";
export { ControlPanelNotificationsBell } from "../shared/session/ControlPanelNotificationsBell";
export { ControlPanelUserMenu } from "../shared/session/ControlPanelUserMenu";
export { ControlPanelSessionProvider, useControlPanelSession } from "../shared/session/control-panel-session";
export type { ControlPanelSession, ControlPanelSessionState } from "../shared/session/control-panel-session";
export { hasControlPanelPermission, hasServiceControlPanelPermission } from "../shared/session/control-panel-permissions";
export type { ControlPanelPermissionIdentity } from "../shared/session/control-panel-permissions";
export { useControlPanelServiceHealth } from "../shared/session/use-control-panel-service-health";
export type { ControlPanelServiceHealth } from "../shared/session/use-control-panel-service-health";
export { resolveIdentityApiBaseUrl } from "../shared/_kernel/identity-api-base-url";
`);
          write('services/dsh/frontend/control-panel/index.ts', ['navigation','session','administration','analytics','catalogs','dashboard','finance','hr','marketing','operations','partners','platform','support'].map((name) => `export * from "./${name}";`).join('\n') + '\n');
          remove('services/dsh/frontend/shared/_kernel/cp-state.ts');

          const routeFiles = walk('apps/control-panel/runtime/src/app').filter((file) => /\.(ts|tsx)$/.test(file));
          for (const file of routeFiles) {
            let c = read(file);
            c = c.replaceAll('@dsh-cp/', '@bthwani/dsh/control-panel/');
            c = c.replace(/from ["']@dsh-shared\/session\/[^"']+["']/g, 'from "@bthwani/dsh/control-panel/session"');
            c = c.replace(/from ["']@dsh-shared\/_kernel\/identity-api-base-url["']/g, 'from "@bthwani/dsh/control-panel/session"');
            if (file.endsWith('/dsh/layout.tsx') && !c.includes('@bthwani/dsh/control-panel/navigation')) {
              c = c.replace('import { usePathname } from "next/navigation";\n', 'import { usePathname } from "next/navigation";\nimport { DSH_NAV_ITEMS } from "@bthwani/dsh/control-panel/navigation";\n');
              c = c.replace('  useDshNavigation,\n  DSH_NAV_ITEMS,\n} from "../../shell";', '  useDshNavigation,\n} from "../../shell";');
            }
            write(file, c);
          }

          write('apps/control-panel/runtime/src/shell/index.ts', 'export * from "./ControlPanelShell";\nexport * from "./ControlPanelNavigation";\nexport * from "./ControlPanelTopBar";\nexport * from "./useDshNavigation";\n');
          write('apps/control-panel/runtime/src/shell/useDshNavigation.ts', `"use client";

import { useMemo } from "react";
import { useRouter } from "next/navigation";
import { DSH_NAV_ITEMS } from "@bthwani/dsh/control-panel/navigation";
import { hasControlPanelPermission, useControlPanelSession } from "@bthwani/dsh/control-panel/session";

/** Returns only the DSH sections authorized for the restored operator session. */
export function useDshNavigation() {
  const router = useRouter();
  const { state } = useControlPanelSession();
  const canReadPlatform =
    state.status === "authenticated" &&
    hasControlPanelPermission(state.identity, "platform:read");

  const visibleItems = useMemo(
    () => DSH_NAV_ITEMS.filter((item) => item.section !== "platform" || canReadPlatform),
    [canReadPlatform],
  );

  return {
    items: visibleItems,
    navigate: (route: string) => router.push(route),
  };
}
`);

          const appPkg = json('apps/control-panel/runtime/package.json');
          appPkg.name = '@bthwani/control-panel-runtime';
          appPkg.private = true;
          delete appPkg.exports;
          delete appPkg.dependencies['@bthwani/app-shell'];
          appPkg.dependencies['@bthwani/core-identity'] = 'workspace:*';
          appPkg.dependencies['@bthwani/dsh'] = 'workspace:*';
          appPkg.dependencies['@bthwani/ui-kit'] = 'workspace:*';
          appPkg.dependencies['@bthwani/control-panel'] = 'workspace:*';
          writeJson('apps/control-panel/runtime/package.json', appPkg);

          write('apps/control-panel/runtime/tsconfig.json', JSON.stringify({
            compilerOptions: {
              target: 'ES2022', lib: ['DOM', 'DOM.Iterable', 'ES2022'], allowJs: false, skipLibCheck: true, strict: true,
              noEmit: true, esModuleInterop: true, module: 'ESNext', moduleResolution: 'Bundler', resolveJsonModule: true,
              isolatedModules: true, jsx: 'react-jsx', incremental: false, types: ['node', 'react', 'react-dom'], plugins: [{ name: 'next' }]
            },
            include: ['next-env.d.ts', 'src/**/*.ts', 'src/**/*.tsx', '.next/types/**/*.ts', '.next/dev/types/**/*.ts'],
            exclude: ['node_modules', '.next', 'dist', 'build']
          }, null, 2) + '\n');
          remove('apps/control-panel/runtime/tsconfig.cancellation-journey.json');
          remove('apps/control-panel/runtime/tsconfig.order-journey.json');
          remove('apps/control-panel/runtime/tsconfig.partner-journey.json');

          let nextConfig = read('apps/control-panel/runtime/next.config.ts');
          nextConfig = nextConfig.replace(/transpilePackages:\s*\[[^\]]+\]/s, 'transpilePackages: [\n    "tamagui",\n    "@tamagui/core",\n    "@tamagui/config",\n    "@bthwani/ui-kit",\n    "@bthwani/control-panel",\n    "@bthwani/dsh",\n  ]');
          write('apps/control-panel/runtime/next.config.ts', nextConfig);

          const idPkg = json('core/identity/package.json');
          idPkg.exports = { '.': './clients/index.ts', './server': './clients/identity-client.ts' };
          writeJson('core/identity/package.json', idPkg);

          const dshPkg = json('services/dsh/package.json');
          dshPkg.dependencies['@bthwani/control-panel'] = 'workspace:*';
          dshPkg.dependencies['@bthwani/core-providers'] = 'workspace:*';
          dshPkg.dependencies['@bthwani/data-runtime'] = 'workspace:*';
          dshPkg.exports = {
            './control-panel': './frontend/control-panel/index.ts',
            './control-panel/navigation': './frontend/control-panel/navigation.ts',
            './control-panel/session': './frontend/control-panel/session.ts',
            './control-panel/administration': './frontend/control-panel/administration/index.ts',
            './control-panel/analytics': './frontend/control-panel/analytics/index.ts',
            './control-panel/catalogs': './frontend/control-panel/catalogs/index.ts',
            './control-panel/dashboard': './frontend/control-panel/dashboard/index.ts',
            './control-panel/finance': './frontend/control-panel/finance/index.ts',
            './control-panel/hr': './frontend/control-panel/hr/index.ts',
            './control-panel/marketing': './frontend/control-panel/marketing/index.ts',
            './control-panel/operations': './frontend/control-panel/operations/index.ts',
            './control-panel/partners': './frontend/control-panel/partners/index.ts',
            './control-panel/partners/stores': './frontend/control-panel/partners/stores/index.ts',
            './control-panel/platform': './frontend/control-panel/platform/index.ts',
            './control-panel/support': './frontend/control-panel/support/index.ts'
          };
          writeJson('services/dsh/package.json', dshPkg);

          let workspace = read('pnpm-workspace.yaml');
          if (!workspace.includes('shared/control-panel')) workspace = workspace.replace('  - "shared/app-shell"\n', '  - "shared/app-shell"\n  - "shared/control-panel"\n');
          write('pnpm-workspace.yaml', workspace);

          const baseTs = json('tsconfig.base.json');
          baseTs.compilerOptions.paths['@bthwani/core-identity/server'] = ['core/identity/clients/identity-client.ts'];
          baseTs.compilerOptions.paths['@bthwani/dsh/control-panel'] = ['services/dsh/frontend/control-panel/index.ts'];
          baseTs.compilerOptions.paths['@bthwani/dsh/control-panel/*'] = ['services/dsh/frontend/control-panel/*'];
          baseTs.compilerOptions.paths['@bthwani/control-panel'] = ['shared/control-panel/src/index.ts'];
          baseTs.compilerOptions.paths['@bthwani/control-panel/components'] = ['shared/control-panel/src/components/index.ts'];
          baseTs.compilerOptions.paths['@bthwani/control-panel/shell'] = ['shared/control-panel/src/shell/index.ts'];
          writeJson('tsconfig.base.json', baseTs);

          const serviceFiles = walk('services/dsh/frontend/control-panel').filter((file) => /\.(ts|tsx)$/.test(file));
          for (const file of serviceFiles) {
            let c = read(file);
            c = c.replace("import { DSH_NAV_ITEMS, OverviewPageFrame } from '@bthwani/control-panel/shell';", "import { OverviewPageFrame } from \"@bthwani/control-panel/shell\";\nimport { DSH_NAV_ITEMS } from \"../navigation\";");
            c = c.replace("import { DSH_NAV_ITEMS } from '@bthwani/control-panel/shell';", "import { DSH_NAV_ITEMS } from \"../navigation\";");
            c = c.replace(/from ["']@dsh-shared\/session\/control-panel-session["']/g, 'from "../../shared/session/control-panel-session"');
            c = c.replace("from '../../../../../apps/control-panel/runtime/src/shell/frameTokens'", "from '@bthwani/control-panel/shell'");
            write(file, c);
          }
          const catalogs = 'services/dsh/frontend/control-panel/catalogs/index.ts';
          if (exists(catalogs) && !read(catalogs).includes('CatalogGovernanceScreen')) {
            write(catalogs, read(catalogs) + 'export * from "./CatalogGovernanceScreen";\n');
          }

          write('tools/guards/control-panel-architecture-gate.mjs', `import fs from "node:fs";
import path from "node:path";
import { fail, findImportSpecifiers, listCodeFiles, read, repoRoot, toPosix } from "./_guard-utils.mjs";

const guardId = "control-panel-architecture-contract";
const appRoot = "apps/control-panel/runtime";
const sharedRoot = "shared/control-panel";
const dshRoot = "services/dsh";
const dshControlPanelRoot = `${dshRoot}/frontend/control-panel`;
const appPackage = "@bthwani/control-panel-runtime";
const sharedPackage = "@bthwani/control-panel";
const dshPackage = "@bthwani/dsh";
const retiredAliases = ["@dsh-cp/", "@dsh-shared/", "@dsh-clients/", "@platform-control/"];
const forbiddenCrossServiceImports = [];
const unownedSharedModules = [];
const unexplainedArchitectureExceptions = [];

function packageRoot(specifier) {
  if (!specifier.startsWith("@")) return specifier.split("/")[0];
  return specifier.split("/").slice(0, 2).join("/");
}
function dependencyNames(manifest) {
  return new Set([...Object.keys(manifest.dependencies ?? {}), ...Object.keys(manifest.devDependencies ?? {}), ...Object.keys(manifest.peerDependencies ?? {})]);
}
function publicExportKey(specifier, packageName) {
  return specifier === packageName ? "." : `.${specifier.slice(packageName.length)}`;
}
function resolveRelativeImport(file, specifier) {
  return toPosix(path.relative(repoRoot, path.resolve(path.dirname(path.join(repoRoot, file)), specifier)));
}
function declared(file, specifier, deps) {
  const root = packageRoot(specifier);
  if (root.startsWith("@bthwani/") && !deps.has(root)) unownedSharedModules.push({ file, message: `workspace import '${specifier}' is not owned by a declared dependency` });
}
function exported(file, specifier, packageName, exportsMap, label) {
  if (specifier !== packageName && !specifier.startsWith(`${packageName}/`)) return;
  const key = publicExportKey(specifier, packageName);
  if (!Object.prototype.hasOwnProperty.call(exportsMap, key)) unownedSharedModules.push({ file, message: `${label} import '${specifier}' is not a declared public package export` });
}
const appManifest = JSON.parse(read(`${appRoot}/package.json`));
const sharedManifest = JSON.parse(read(`${sharedRoot}/package.json`));
const dshManifest = JSON.parse(read(`${dshRoot}/package.json`));
const appDeps = dependencyNames(appManifest);
const sharedDeps = dependencyNames(sharedManifest);
const dshDeps = dependencyNames(dshManifest);
if (appManifest.name !== appPackage) unownedSharedModules.push({ file: `${appRoot}/package.json`, message: `runtime application must be named '${appPackage}'` });
if (sharedManifest.name !== sharedPackage) unownedSharedModules.push({ file: `${sharedRoot}/package.json`, message: `shared control-panel package must own '${sharedPackage}'` });
if (appManifest.exports !== undefined) unownedSharedModules.push({ file: `${appRoot}/package.json`, message: "runtime application must not expose source-library exports" });
for (const file of listCodeFiles().filter((candidate) => candidate.startsWith(`${appRoot}/`))) {
  for (const { specifier } of findImportSpecifiers(read(file))) {
    if (specifier.startsWith(".")) {
      const resolved = resolveRelativeImport(file, specifier);
      if (!resolved.startsWith(`${appRoot}/`) && resolved !== appRoot) forbiddenCrossServiceImports.push({ file, message: `relative import escapes control-panel runtime boundary: ${specifier}` });
      continue;
    }
    if (retiredAliases.some((prefix) => specifier.startsWith(prefix))) forbiddenCrossServiceImports.push({ file, message: `retired source alias '${specifier}' bypasses a public package boundary` });
    if (specifier === appPackage || specifier.startsWith(`${appPackage}/`)) forbiddenCrossServiceImports.push({ file, message: `runtime application self-import '${specifier}' exposes application internals` });
    exported(file, specifier, sharedPackage, sharedManifest.exports ?? {}, "control-panel shared UI");
    exported(file, specifier, dshPackage, dshManifest.exports ?? {}, "DSH control-panel");
    declared(file, specifier, appDeps);
  }
}
for (const file of listCodeFiles().filter((candidate) => candidate.startsWith(`${sharedRoot}/`))) {
  for (const { specifier } of findImportSpecifiers(read(file))) {
    if (specifier.startsWith(".")) {
      const resolved = resolveRelativeImport(file, specifier);
      if (!resolved.startsWith(`${sharedRoot}/`) && resolved !== sharedRoot) forbiddenCrossServiceImports.push({ file, message: `relative import escapes shared control-panel package: ${specifier}` });
      continue;
    }
    if (specifier === appPackage || specifier.startsWith(`${appPackage}/`) || specifier === dshPackage || specifier.startsWith(`${dshPackage}/`) || retiredAliases.some((prefix) => specifier.startsWith(prefix))) forbiddenCrossServiceImports.push({ file, message: `shared package import '${specifier}' crosses application/service ownership` });
    declared(file, specifier, sharedDeps);
  }
}
for (const file of listCodeFiles().filter((candidate) => candidate.startsWith(`${dshControlPanelRoot}/`))) {
  for (const { specifier } of findImportSpecifiers(read(file))) {
    if (specifier === appPackage || specifier.startsWith(`${appPackage}/`) || specifier.includes("apps/control-panel/runtime")) forbiddenCrossServiceImports.push({ file, message: `DSH control-panel imports runtime internals through '${specifier}'` });
    if (specifier.startsWith("@bthwani/wlt/") && !specifier.startsWith("@bthwani/wlt/control-panel")) forbiddenCrossServiceImports.push({ file, message: `WLT import '${specifier}' bypasses public financial boundary` });
    if (!specifier.startsWith(".")) {
      exported(file, specifier, sharedPackage, sharedManifest.exports ?? {}, "control-panel shared UI");
      declared(file, specifier, dshDeps);
    }
  }
}
const appTsconfig = JSON.parse(read(`${appRoot}/tsconfig.json`));
if (appTsconfig.compilerOptions?.paths !== undefined) forbiddenCrossServiceImports.push({ file: `${appRoot}/tsconfig.json`, message: "runtime app tsconfig must not define cross-workspace source aliases" });
for (const file of [...listCodeFiles(), ...walkTextFiles([appRoot, sharedRoot, dshControlPanelRoot])]) {
  const content = read(file);
  if (/architecture-(exceptions|allowlist)/i.test(content)) unexplainedArchitectureExceptions.push({ file, message: "architecture exception or allowlist is not permitted for the control-panel contract" });
}
function walkTextFiles(roots) {
  const files = [];
  for (const root of roots) if (fs.existsSync(path.join(repoRoot, root))) walk(root);
  return files;
  function walk(relative) {
    for (const entry of fs.readdirSync(path.join(repoRoot, relative), { withFileTypes: true })) {
      const next = toPosix(path.join(relative, entry.name));
      if (entry.isDirectory()) walk(next);
      else if (/\.(json|md|yml|yaml|txt)$/.test(next)) files.push(next);
    }
  }
}
const counts = {
  forbidden_cross_service_imports: forbiddenCrossServiceImports.length,
  unowned_shared_modules: unownedSharedModules.length,
  unexplained_architecture_exceptions: unexplainedArchitectureExceptions.length,
};
console.log(JSON.stringify({ guard: guardId, ...counts }, null, 2));
const violations = [...forbiddenCrossServiceImports, ...unownedSharedModules, ...unexplainedArchitectureExceptions];
if (violations.length > 0) fail(guardId, violations.map((violation) => `${violation.file}: ${violation.message}`));
console.log("control_panel_architecture_contract: PASS");
`);

          remove('.github/workflows/apply-control-panel-contract.yml');
          NODE

      - name: Refresh PNPM lockfile
        shell: bash
        run: pnpm install --lockfile-only --no-frozen-lockfile --reporter=append-only

      - name: Verify architecture before commit
        shell: bash
        run: |
          set -euo pipefail
          node tools/guards/control-panel-architecture-gate.mjs
          node tools/guards/service-workspace-gate.mjs
          git diff --check

      - name: Commit and push final fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(control-panel): close public architecture contract"
          git push origin HEAD:ala
