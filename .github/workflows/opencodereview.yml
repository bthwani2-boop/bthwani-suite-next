name: OpenCodeReview

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Semantic review depth
        required: true
        default: full
        type: choice
        options: [full, diff]
      base_ref:
        description: Base branch/ref for diff mode; empty resolves to the repository default branch
        required: false
        default: ""
        type: string
      expected_sha:
        description: Exact candidate SHA expected at the dispatched ref
        required: true
        type: string
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["**"]
  schedule:
    - cron: "23 5 * * 4"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: opencodereview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Resolve immutable semantic review scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.scope.outputs.head_sha }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      mode: ${{ steps.scope.outputs.mode }}
      skip_duplicate_push: ${{ steps.scope.outputs.skip_duplicate_push }}
      same_repo_pr: ${{ steps.scope.outputs.same_repo_pr }}
    steps:
      - name: Checkout immutable candidate history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Resolve exact head, base, and execution mode
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_BASE_REF: ${{ inputs.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          mode=diff
          base_sha="${PR_BASE_SHA:-${EVENT_BEFORE:-}}"
          skip_duplicate=false
          same_repo_pr=false

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            [[ "${head_sha}" == "${PR_HEAD_SHA}" ]] || { echo "::error::PR head mismatch"; exit 1; }
            [[ "${PR_HEAD_REPO}" == "${GITHUB_REPOSITORY}" ]] && same_repo_pr=true
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::expected_sha must be a full SHA"; exit 1; }
            [[ "${head_sha}" == "${EXPECTED_SHA}" ]] || { echo "::error::dispatch SHA mismatch"; exit 1; }
            mode="${REQUESTED_MODE}"
            if [[ "${mode}" == "diff" ]]; then
              base_ref="${REQUESTED_BASE_REF:-${DEFAULT_BRANCH}}"
              git fetch --no-tags origin "${base_ref}"
              base_sha="$(git merge-base "$(git rev-parse FETCH_HEAD)" "${head_sha}")"
            else
              base_sha=""
            fi
          elif [[ "${EVENT_NAME}" == "schedule" ]]; then
            mode=full
            base_sha=""
          elif [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            open_pr_count="$(gh api --method GET -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GITHUB_REPOSITORY}/pulls" -f state=open \
              -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" -f per_page=1 --jq 'length')"
            [[ "${open_pr_count}" == "0" ]] || skip_duplicate=true
          fi

          if [[ "${mode}" == "diff" ]]; then
            if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
              base_sha="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "${head_sha}")"
            fi
            git cat-file -e "${base_sha}^{commit}"
          fi
          {
            echo "head_sha=${head_sha}"
            echo "base_sha=${base_sha}"
            echo "mode=${mode}"
            echo "skip_duplicate_push=${skip_duplicate}"
            echo "same_repo_pr=${same_repo_pr}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### OpenCodeReview scope"
            echo "- Candidate: ${head_sha}"
            echo "- Mode: ${mode}"
            echo "- Base: ${base_sha:-n/a}"
            echo "- Duplicate development push skipped: ${skip_duplicate}"
          } >> "${GITHUB_STEP_SUMMARY}"

  review:
    name: Remote semantic review
    needs: [scope]
    if: ${{ needs.scope.outputs.skip_duplicate_push != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      models: read
      pull-requests: write
    env:
      OCR_VERSION: "1.9.5"
      OCR_LLM_MODEL: "openai/gpt-5"
      OCR_LLM_URL: "https://models.github.ai/inference/chat/completions"
      OCR_USE_ANTHROPIC: "false"
      OCR_LLM_TIMEOUT: "180"
      OCR_LLM_EXTRA_HEADERS: "X-GitHub-Api-Version=2026-03-10"
    steps:
      - name: Checkout immutable candidate history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
      - name: Install pinned OpenCodeReview on the hosted runner
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --no-audit --no-fund "@alibaba-group/open-code-review@${OCR_VERSION}"
          ocr version 2>&1 | tee /tmp/ocr-version.log
          grep -q "v${OCR_VERSION}" /tmp/ocr-version.log || { echo "::error::OpenCodeReview version mismatch"; exit 1; }
      - name: Validate GitHub Models connectivity
        id: llm
        continue-on-error: true
        shell: bash
        env:
          OCR_LLM_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ocr config set telemetry.enabled false
          ocr config set language English
          ocr llm test
      - name: Run OpenCodeReview against the exact candidate
        id: review
        continue-on-error: true
        shell: bash
        env:
          OCR_LLM_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
          MODE: ${{ needs.scope.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p .diagnostics/opencodereview
          set +e
          if [[ "${MODE}" == "full" ]]; then
            ocr scan --rule .opencodereview/rule.json --format json --audience agent \
              > .diagnostics/opencodereview/result.json \
              2> >(tee .diagnostics/opencodereview/stderr.log >&2)
          else
            ocr review --from "${BASE_SHA}" --to "${HEAD_SHA}" \
              --rule .opencodereview/rule.json --format json --audience agent \
              > .diagnostics/opencodereview/result.json \
              2> >(tee .diagnostics/opencodereview/stderr.log >&2)
          fi
          status=$?
          set -e
          exit "${status}"
      - name: Adjudicate semantic findings
        id: adjudicate
        if: ${{ always() && hashFiles('.diagnostics/opencodereview/result.json') != '' }}
        continue-on-error: true
        env:
          OCR_TARGET_SHA: ${{ needs.scope.outputs.head_sha }}
          OCR_BASE_SHA: ${{ needs.scope.outputs.base_sha }}
          OCR_MODE: ${{ needs.scope.outputs.mode }}
          OCR_MODEL: ${{ env.OCR_LLM_MODEL }}
        run: >-
          node tools/scripts/evaluate-opencodereview.mjs
          --input .diagnostics/opencodereview/result.json
          --summary-json .diagnostics/opencodereview/summary.json
          --markdown .diagnostics/opencodereview/summary.md
          --block-severity high
      - name: Publish semantic review to the pull request
        id: publish
        if: >-
          ${{ always() && github.event_name == 'pull_request' && needs.scope.outputs.same_repo_pr == 'true' &&
              hashFiles('.diagnostics/opencodereview/summary.md') != '' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          jq -n --rawfile body .diagnostics/opencodereview/summary.md '{event:"COMMENT",body:$body}' \
            | gh api --method POST -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --input - >/dev/null
      - name: Upload OpenCodeReview evidence
        id: artifact
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencodereview-${{ needs.scope.outputs.head_sha }}
          path: .diagnostics/opencodereview/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce OpenCodeReview execution and findings policy
        if: ${{ always() }}
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          LLM: ${{ steps.llm.outcome }}
          REVIEW: ${{ steps.review.outcome }}
          ADJUDICATE: ${{ steps.adjudicate.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
          SAME_REPO_PR: ${{ needs.scope.outputs.same_repo_pr }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          failures=()
          [[ "${INSTALL}" == "success" ]] || failures+=("install=${INSTALL}")
          [[ "${LLM}" == "success" ]] || failures+=("llm=${LLM}")
          [[ "${REVIEW}" == "success" ]] || failures+=("review=${REVIEW}")
          [[ "${ADJUDICATE}" == "success" ]] || failures+=("adjudicate=${ADJUDICATE}")
          [[ "${ARTIFACT}" == "success" ]] || failures+=("artifact=${ARTIFACT}")
          if [[ "${EVENT_NAME}" == "pull_request" && "${SAME_REPO_PR}" == "true" && "${PUBLISH}" != "success" ]]; then
            failures+=("pr_publish=${PUBLISH}")
          fi
          if ((${#failures[@]})); then
            printf '::error title=OpenCodeReview failed::%s\n' "${failures[*]}"
            exit 1
          fi
          echo "OpenCodeReview completed remotely and retained exact-candidate evidence."

  result:
    name: OpenCodeReview result
    needs: [scope, review]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce semantic review ownership
        shell: bash
        env:
          SCOPE: ${{ needs.scope.result }}
          REVIEW: ${{ needs.review.result }}
          SKIP_DUPLICATE_PUSH: ${{ needs.scope.outputs.skip_duplicate_push }}
        run: |
          set -euo pipefail
          [[ "${SCOPE}" == "success" ]] || { echo "::error::OpenCodeReview scope=${SCOPE}"; exit 1; }
          if [[ "${SKIP_DUPLICATE_PUSH}" == "true" ]]; then echo "Open PR owns semantic review."; exit 0; fi
          [[ "${REVIEW}" == "success" ]] || { echo "::error::OpenCodeReview review=${REVIEW}"; exit 1; }
          echo "OpenCodeReview remote semantic review passed."
