name: Reusable Policy Verification

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: false
      head_sha:
        type: string
        required: false
      policy:
        type: string
        required: false
      workflow:
        type: string
        required: false
      security:
        type: string
        required: false
      infrastructure:
        type: string
        required: false

permissions:
  contents: read

jobs:
  objective_nomenclature:
    name: Ensure objective nomenclature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify objective nomenclature
        env:
          CI_BASE_SHA: ${{ inputs.base_sha }}
          CI_HEAD_SHA: ${{ inputs.head_sha }}
        run: pnpm run guard:nomenclature

  affected_policy:
    name: Verify affected governance and workflow policy
    if: ${{ inputs.policy == 'true' || inputs.workflow == 'true' || inputs.security == 'true' || inputs.infrastructure == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Enforce verification-only CI source policy
        if: ${{ inputs.workflow == 'true' || inputs.security == 'true' }}
        run: node tools/scripts/check-ci-source-immutability.mjs
      - name: Verify governance contracts
        if: ${{ inputs.policy == 'true' }}
        run: |
          pnpm run guard:governance-schema
          pnpm run guard:agent-governance
          pnpm run guard:authority-separation
          pnpm run guard:saas-governance
          pnpm run guard:guard-registry
          pnpm run guard:sdlc
          pnpm run guard:cleanup-policy
          pnpm run guard:required-command-integrity
      - name: Verify workflow supply chain
        if: ${{ inputs.workflow == 'true' || inputs.security == 'true' }}
        run: |
          pnpm run guard:actions-pin
          pnpm run guard:workflow-lint
          pnpm run guard:workflow-security
          pnpm run guard:opa-policies
      - name: Verify infrastructure policy
        if: ${{ inputs.infrastructure == 'true' }}
        run: |
          pnpm run guard:runtime-config
          pnpm run guard:opa-policies

  immutable_diff:
    name: Verify immutable diff hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable diff hygiene
        run: git diff --check
