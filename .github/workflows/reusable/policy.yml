name: Reusable Workflow

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: false
      head_sha:
        type: string
        required: false
      full_verification:
        type: string
        required: false
      governance:
        type: string
        required: false
      workflow:
        type: string
        required: false
      infrastructure:
        type: string
        required: false
      security:
        type: string
        required: false
      policy:
        type: string
        required: false
      frontend:
        type: string
        required: false
      contracts:
        type: string
        required: false
      journey:
        type: string
        required: false
      journey_scope:
        type: string
        required: false
      node:
        type: string
        required: false
      node_scope:
        type: string
        required: false
      dsh:
        type: string
        required: false
      wlt:
        type: string
        required: false
      identity:
        type: string
        required: false
      workforce:
        type: string
        required: false
      platform:
        type: string
        required: false
      providers:
        type: string
        required: false
      database:
        type: string
        required: false
      runtime:
        type: string
        required: false
      shared_brain:
        type: string
        required: false
      heavy:
        type: string
        required: false
      platform_change_sets:
        type: string
        required: false
      runtime_proof:
        type: boolean
        required: false

jobs:
  objective_nomenclature:
    name: Ensure objective nomenclature
    needs: []
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify objective nomenclature
        env:
          CI_BASE_SHA: ${{ inputs.base_sha }}
          CI_HEAD_SHA: ${{ inputs.head_sha }}
        run: pnpm run guard:nomenclature

  policy:
    name: Verify affected policy
    needs: []
    if: ${{ inputs.policy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify governance schema
        run: pnpm run guard:governance-schema
      - name: Verify agent governance
        run: pnpm run guard:agent-governance
      - name: Verify authority separation
        run: pnpm run guard:authority-separation
      - name: Verify SaaS governance
        run: pnpm run guard:saas-governance
      - name: Verify guard registry
        run: pnpm run guard:guard-registry
      - name: Verify SDLC governance
        run: pnpm run guard:sdlc
      - name: Verify cleanup policy
        run: pnpm run guard:cleanup-policy
      - name: Verify required command integrity
        run: pnpm run guard:required-command-integrity
      - name: Verify workflow supply chain
        if: ${{ inputs.workflow == 'true' || inputs.security == 'true' }}
        run: |
          pnpm run guard:actions-pin
          pnpm run guard:workflow-lint
          pnpm run guard:workflow-security
          pnpm run guard:opa-policies
      - name: Verify infrastructure policy
        if: ${{ inputs.infrastructure == 'true' }}
        run: |
          pnpm run guard:runtime-config
          pnpm run guard:opa-policies
      - name: Verify immutable diff hygiene
        run: git diff --check

