name: Reusable Workflow

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: false
      head_sha:
        type: string
        required: false
      full_verification:
        type: string
        required: false
      governance:
        type: string
        required: false
      workflow:
        type: string
        required: false
      infrastructure:
        type: string
        required: false
      security:
        type: string
        required: false
      policy:
        type: string
        required: false
      frontend:
        type: string
        required: false
      contracts:
        type: string
        required: false
      journey:
        type: string
        required: false
      journey_scope:
        type: string
        required: false
      node:
        type: string
        required: false
      node_scope:
        type: string
        required: false
      dsh:
        type: string
        required: false
      wlt:
        type: string
        required: false
      identity:
        type: string
        required: false
      workforce:
        type: string
        required: false
      platform:
        type: string
        required: false
      providers:
        type: string
        required: false
      database:
        type: string
        required: false
      runtime:
        type: string
        required: false
      shared_brain:
        type: string
        required: false
      heavy:
        type: string
        required: false
      platform_change_sets:
        type: string
        required: false
      runtime_proof:
        type: boolean
        required: false

jobs:
  dsh:
    name: Verify DSH backend and database
    needs: []
    if: ${{ inputs.dsh == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dsh_runtime
          POSTGRES_PASSWORD: dsh_runtime_password
          POSTGRES_DB: dsh_runtime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dsh_runtime -d dsh_runtime"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://dsh_runtime:dsh_runtime_password@localhost:5432/dsh_runtime?sslmode=disable
      DSH_REQUIRE_DB_TESTS: "true"
      PGPASSWORD: dsh_runtime_password
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false, show-progress: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache-dependency-path: services/dsh/backend/go.sum
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Apply DSH migrations
        run: |
          set -euo pipefail
          for migration in services/dsh/database/migrations/*.sql; do psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f "$migration" >/dev/null; done
      - name: Test and build DSH
        working-directory: services/dsh/backend
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/dsh-go-verification.log"
          if ! go test ./... -count=1 >"${log}" 2>&1; then
            echo "::error title=DSH Go verification failed::The complete log is stored as an artifact."
            grep -E '^--- FAIL:|^FAIL([[:space:]]|$)|panic:|undefined:|cannot use|build failed|Error Trace:' "${log}" | tail -n 80 || true
            echo "--- DSH final log lines ---"
            tail -n 160 "${log}"
            exit 1
          fi
          go build ./... >"${log}" 2>&1 || { tail -n 160 "${log}"; exit 1; }
      - name: Upload DSH verification log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-go-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/dsh-go-verification.log
          if-no-files-found: warn
          retention-days: 7

  wlt:
    name: Verify WLT backend and database
