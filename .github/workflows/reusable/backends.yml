name: Reusable Backend Verification

on:
  workflow_call:
    inputs:
      dsh:
        type: string
        required: false
      wlt:
        type: string
        required: false
      identity:
        type: string
        required: false
      workforce:
        type: string
        required: false
      platform:
        type: string
        required: false
      providers:
        type: string
        required: false

permissions:
  contents: read

jobs:
  dsh:
    name: Verify DSH backend and database
    if: ${{ inputs.dsh == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dsh_runtime
          POSTGRES_PASSWORD: dsh_runtime_password
          POSTGRES_DB: dsh_runtime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dsh_runtime -d dsh_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://dsh_runtime:dsh_runtime_password@localhost:5432/dsh_runtime?sslmode=disable
      PGPASSWORD: dsh_runtime_password
      BTHWANI_ENVIRONMENT: ci
      DSH_REQUIRE_DB_TESTS: "true"
      DSH_TEST_TENANT_ID: ci-dsh
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up locked Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.17.0"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache-dependency-path: services/dsh/backend/go.sum
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Validate governed local media contract
        run: node tools/scripts/check-local-media-contract.mjs
      - name: Validate static DSH database contract
        run: node tools/scripts/check-dsh-database-contract.mjs
      - name: Apply canonical DSH migrations twice
        shell: pwsh
        run: |
          ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action migrate -Transport url -DatabaseUrl $env:DATABASE_URL
          ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action migrate -Transport url -DatabaseUrl $env:DATABASE_URL
      - name: Verify DSH migration runner failure contracts
        shell: pwsh
        run: ./services/dsh/database/scripts/test-dsh-migration-runner.ps1 -DatabaseUrl $env:DATABASE_URL
      - name: Run DSH schema database contracts
        shell: pwsh
        run: ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action test -Transport url -DatabaseUrl $env:DATABASE_URL -TestSuite schema
      - name: Test and build DSH backend on clean schema
        working-directory: services/dsh/backend
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/dsh-backend-verification.log"
          : >"${log}"
          if ! go test ./... -count=1 >"${log}" 2>&1; then
            echo "::error title=DSH Go tests failed::The complete backend log is uploaded as an artifact."
            grep -E '^--- FAIL:|^FAIL([[:space:]]|$)|panic:|undefined:|cannot use|build failed|Error Trace:' "${log}" | tail -n 120 || true
            tail -n 200 "${log}"
            exit 1
          fi
          if ! go build ./... >>"${log}" 2>&1; then
            tail -n 200 "${log}"
            exit 1
          fi
      - name: Apply DSH local seeds twice
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "dsh-seed-verification.log"
          try {
            ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action seed -Transport url -DatabaseUrl $env:DATABASE_URL -AllowLocalSeeds *>&1 |
              Tee-Object -FilePath $log
            ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action seed -Transport url -DatabaseUrl $env:DATABASE_URL -AllowLocalSeeds *>&1 |
              Tee-Object -FilePath $log -Append
          } catch {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 240 }
            throw
          }
      - name: Run DSH seed database contracts
        shell: pwsh
        run: ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action test -Transport url -DatabaseUrl $env:DATABASE_URL -TestSuite seed
      - name: Upload DSH failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dsh-backend-verification.log
            ${{ runner.temp }}/dsh-seed-verification.log
          if-no-files-found: ignore
          retention-days: 7

  wlt:
    name: Verify WLT backend and database
    if: ${{ inputs.wlt == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wlt_runtime
          POSTGRES_PASSWORD: wlt_runtime_password
          POSTGRES_DB: wlt_runtime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wlt_runtime -d wlt_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://wlt_runtime:wlt_runtime_password@localhost:5432/wlt_runtime?sslmode=disable
      WLT_REQUIRE_DB_TESTS: "true"
      PGPASSWORD: wlt_runtime_password
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/wlt/backend/go.mod
          cache-dependency-path: services/wlt/backend/go.sum
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Apply WLT migrations twice
        run: |
          set -euo pipefail
          for pass in 1 2; do
            for migration in services/wlt/database/migrations/*.sql; do
              psql "${DATABASE_URL}" -q -v ON_ERROR_STOP=1 -f "${migration}" >/dev/null
            done
          done
      - name: Test and build WLT
        working-directory: services/wlt/backend
        run: go test ./... -count=1 && go build ./...

  identity:
    name: Verify Identity backend and database
    if: ${{ inputs.identity == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identity_runtime
          POSTGRES_PASSWORD: identity_runtime_password
          POSTGRES_DB: identity_runtime
        ports: ["5432:5432"]
        options: >-
