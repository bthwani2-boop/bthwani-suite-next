            done
          done
      - name: Test and build Workforce
        working-directory: core/workforce/backend
        run: go test ./... -count=1 && go build ./...

  platform:
    name: Verify Platform Control backend and database
    if: ${{ inputs.platform == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://platform:platform@localhost:5432/platform?sslmode=disable
      PGPASSWORD: platform
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: core/platform-control/backend/go.mod
          cache-dependency-path: core/platform-control/backend/go.sum
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Apply Platform Control migrations twice
        run: |
          set -euo pipefail
          for pass in 1 2; do
            for migration in core/platform-control/database/migrations/*.sql; do
              psql "${DATABASE_URL}" -q -v ON_ERROR_STOP=1 -f "${migration}" >/dev/null
            done
          done
      - name: Test and build Platform Control
        working-directory: core/platform-control/backend
        run: go test ./... -count=1 && go build ./...

  providers:
    name: Verify Providers backend and database
    if: ${{ inputs.providers == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: providers_runtime
          POSTGRES_PASSWORD: providers_runtime_password
          POSTGRES_DB: providers_runtime
        ports: ["5432:5432"]
        options: >-
