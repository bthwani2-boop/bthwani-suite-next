name: Temporary App Field Verification

on:
  push:
    branches:
      - abdo
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify-app-field:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Set up locked Go runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache-dependency-path: services/dsh/backend/go.sum
      - name: Verify app-field and DSH batch runtime
        shell: bash
        run: |
          pnpm --filter @bthwani/app-field-runtime typecheck
          pnpm --filter @bthwani/app-field-runtime lint
          pnpm --filter @bthwani/app-field-runtime test
          pnpm --dir services/dsh build
          node --test --test-name-pattern="field onboarding validation" services/dsh/tests/field-onboarding-validation.test.mjs
          cd services/dsh/backend
          go test ./internal/http ./internal/centralcatalog -count=1
      - name: Patch, compose, and verify OpenAPI
        run: |
          python3 tools/scripts/patch-app-field-batch-openapi-temporary.py
          pnpm --dir services/dsh openapi:compose
          pnpm --dir services/dsh openapi:verify
      - name: Collect verified outputs
        shell: bash
        run: |
          mkdir -p .artifacts/openapi/contracts/paths
          mkdir -p .artifacts/openapi/contracts/generated
          mkdir -p .artifacts/openapi/clients/generated
          cp services/dsh/contracts/paths/catalog.paths.yaml .artifacts/openapi/contracts/paths/catalog.paths.yaml
          cp services/dsh/contracts/dsh.openapi.yaml .artifacts/openapi/contracts/dsh.openapi.yaml
          cp services/dsh/contracts/dsh.modular.manifest.json .artifacts/openapi/contracts/dsh.modular.manifest.json
          cp services/dsh/contracts/dsh.contract-ownership.json .artifacts/openapi/contracts/dsh.contract-ownership.json
          cp services/dsh/contracts/generated/dsh.bundle.openapi.yaml .artifacts/openapi/contracts/generated/dsh.bundle.openapi.yaml
          cp services/dsh/clients/generated/dsh-api.ts .artifacts/openapi/clients/generated/dsh-api.ts
      - name: Upload verified outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-field-verified-outputs-${{ github.run_id }}
          path: .artifacts/openapi
          if-no-files-found: error
          retention-days: 7
