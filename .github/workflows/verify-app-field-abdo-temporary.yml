name: Temporary App Field Verification

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout abdo head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: abdo
          fetch-depth: 1
          persist-credentials: true
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Set up locked Go runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache-dependency-path: services/dsh/backend/go.sum
      - name: Verify app-field and DSH batch runtime
        shell: bash
        run: |
          pnpm --filter @bthwani/app-field-runtime typecheck
          pnpm --filter @bthwani/app-field-runtime lint
          pnpm --filter @bthwani/app-field-runtime test
          pnpm --dir services/dsh build
          node --test --test-name-pattern="field onboarding validation" services/dsh/tests/field-onboarding-validation.test.mjs
          cd services/dsh/backend
          go test ./internal/http ./internal/centralcatalog -count=1
      - name: Patch, compose, and verify OpenAPI
        run: |
          python3 tools/scripts/patch-app-field-batch-openapi-temporary.py
          pnpm --dir services/dsh openapi:compose
          pnpm --dir services/dsh openapi:verify
      - name: Commit verified outputs and remove temporary verification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/dsh/contracts/paths/catalog.paths.yaml \
            services/dsh/contracts/dsh.openapi.yaml \
            services/dsh/contracts/dsh.modular.manifest.json \
            services/dsh/contracts/generated/dsh.bundle.openapi.yaml \
            services/dsh/clients/generated/dsh-api.ts
          git rm \
            .github/workflows/verify-app-field-abdo-temporary.yml \
            .github/workflows/verify-app-field-openapi-temporary.yml \
            tools/scripts/patch-app-field-batch-openapi-temporary.py
          git diff --cached --check
          git commit -m "feat(dsh): finalize field partner bulk catalog onboarding"
          git push origin HEAD:abdo
