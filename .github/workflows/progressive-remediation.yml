name: BThwani Progressive Remediation Orchestrator

on:
  workflow_dispatch:
    inputs:
      work_branch:
        description: Work branch this task belongs to.
        type: string
        required: true
      task_id:
        description: Gap/task id, e.g. GAP-0001.
        type: string
        required: true
      phase:
        description: Orchestrator phase to evaluate for this run.
        type: choice
        options:
          - select-next
          - validate-contract
          - required-proof
          - reconcile-state
        default: reconcile-state

permissions:
  contents: read

concurrency:
  group: remediation-${{ inputs.work_branch }}-${{ inputs.task_id }}-${{ inputs.phase }}
  cancel-in-progress: true

jobs:
  orchestrate:
    name: Orchestrator decision (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.work_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Validate governed remediation contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm run guard:remediation-governance
          pnpm run guard:task-contract
          pnpm run guard:gap-ledger

      - name: Select next task (informational when task_id is not queued)
        if: ${{ inputs.phase == 'select-next' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/remediation/orchestrator/select-next-task.mjs || true

      - name: Reconcile task state
        if: ${{ inputs.phase == 'reconcile-state' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/remediation/orchestrator/reconcile-task-state.mjs "${{ inputs.task_id }}"

      - name: Reject any source mutation during orchestration
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- . ':(exclude).diagnostics'; then
            echo "The orchestrator must never mutate tracked source; it only reads and decides." >&2
            git status --short -- . ':(exclude).diagnostics' >&2
            exit 1
          fi

      - name: Export orchestrator decision evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: progressive-remediation-${{ inputs.task_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .diagnostics/remediation
          if-no-files-found: warn
          retention-days: 14
