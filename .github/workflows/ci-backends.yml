name: BThwani Backend Verification

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: true
      candidate_sha:
        type: string
        required: true
      full_scope:
        type: string
        required: true
      database_changed:
        type: string
        required: true
      dsh:
        type: string
        required: true
      wlt:
        type: string
        required: true
      identity:
        type: string
        required: true
      workforce:
        type: string
        required: true
      platform:
        type: string
        required: true
      providers:
        type: string
        required: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  plan:
    name: Select affected backends
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Build immutable backend matrix
        id: matrix
        shell: bash
        env:
          DSH: ${{ inputs.dsh }}
          WLT: ${{ inputs.wlt }}
          IDENTITY: ${{ inputs.identity }}
          WORKFORCE: ${{ inputs.workforce }}
          PLATFORM: ${{ inputs.platform }}
          PROVIDERS: ${{ inputs.providers }}
        run: |
          set -euo pipefail
          entries='[]'

          add_backend() {
            local enabled="$1"
            local key="$2"
            local go_mod="$3"
            local migrations="$4"
            local workdir="$5"
            local postgres_image="$6"
            local tests="$7"
            if [[ "${enabled}" != "true" ]]; then return; fi
            entries="$(jq -c \
              --arg key "${key}" \
              --arg go_mod "${go_mod}" \
              --arg migrations "${migrations}" \
              --arg workdir "${workdir}" \
              --arg postgres_image "${postgres_image}" \
              --arg tests "${tests}" \
              '. + [{key:$key,go_mod:$go_mod,migrations:$migrations,workdir:$workdir,postgres_image:$postgres_image,tests:$tests}]' \
              <<< "${entries}")"
          }

          add_backend "${DSH}" dsh services/dsh/backend/go.mod services/dsh/database/migrations \
          services/dsh/backend postgis/postgis:16-3.4-alpine services/dsh/database/tests
          add_backend "${WLT}" wlt services/wlt/backend/go.mod services/wlt/database/migrations \
          services/wlt/backend postgres:16-alpine services/wlt/database/tests
          add_backend "${IDENTITY}" identity core/identity/backend/go.mod \
          core/identity/database/migrations core/identity/backend postgres:16-alpine ""
          add_backend "${WORKFORCE}" workforce core/workforce/backend/go.mod \
          core/workforce/database/migrations core/workforce/backend postgres:16-alpine ""
          add_backend "${PLATFORM}" platform-control core/platform-control/backend/go.mod \
          core/platform-control/database/migrations core/platform-control/backend postgres:16-alpine ""
          add_backend "${PROVIDERS}" providers core/providers/backend/go.mod \
          core/providers/database/migrations core/providers/backend postgres:16-alpine ""

          count="$(jq 'length' <<< "${entries}")"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "matrix={\"include\":${entries}}" >> "${GITHUB_OUTPUT}"
          if [[ "${count}" == "0" ]]; then
            echo "packages=none reason=no-package-in-semantic-cone" >> "${GITHUB_STEP_SUMMARY}"
          fi

  verify:
    name: Verify ${{ matrix.key }} backend
    needs: [plan]
    if: ${{ needs.plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_BASE_SHA: ${{ inputs.base_sha }}
      CI_HEAD_SHA: ${{ inputs.candidate_sha }}
      CI_FULL_SCOPE: ${{ inputs.full_scope }}
      GOWORK: off
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ || "${ROUTED_CANDIDATE_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo \
            "::error::Invalid routed candidate SHA: routed=${ROUTED_CANDIDATE_SHA:-<empty>} candidate=${CA\
            NDIDATE_SHA:-<empty>}"
            exit 1
          fi
      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact candidate and fetch base
        uses: ./.github/actions/fetch-exact-commits
        with:
          base_sha: ${{ inputs.base_sha }}
          head_sha: ${{ env.CANDIDATE_SHA }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Set up locked Go runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache-dependency-path: ${{ matrix.workdir }}/go.sum
      - name: Install pinned golangci-lint
        shell: bash
        run: |
          set -euo pipefail
          version="2.13.2"
          archive="${RUNNER_TEMP}/golangci-lint-${version}-linux-amd64.tar.gz"
          curl -fsSL \
            "https://github.com/golangci/golangci-lint/releases/download/v${version}/golangci-lint-${version}-linux-amd64.tar.gz" \
            -o "${archive}"
          echo "2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/golangci-lint-${version}-linux-amd64" >> "${GITHUB_PATH}"

      - name: Collect Go test and build evidence
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/${{ matrix.key }}-go-verification.log"
          : >"${log}"
          failures=()

          printf '===== golangci-lint run =====\n' | tee -a "${log}"
          golangci-lint run --config "${GITHUB_WORKSPACE}/.golangci.yml" ./... >>"${log}" 2>&1
          lint_code=$?
          (( lint_code == 0 )) || failures+=("go-lint:${lint_code}")

          printf '\n===== go test ./... -count=1 =====\n' | tee -a "${log}"
          go test ./... -count=1 >>"${log}" 2>&1
          test_code=$?
          (( test_code == 0 )) || failures+=("go-test:${test_code}")

          printf '\n===== go build ./... =====\n' | tee -a "${log}"
          go build ./... >>"${log}" 2>&1
          build_code=$?
          (( build_code == 0 )) || failures+=("go-build:${build_code}")

          if (( ${#failures[@]} )); then
            echo "::error title=${{ matrix.key }} Go verification failed::Collected $(IFS=,; echo "${failures[*]}"). Complete log is stored as an artifact."
            grep -E \
            '^--- FAIL:|^FAIL([[:space:]]|$)|panic:|undefined:|cannot use|build failed|Error Trace:' \
            "${log}" | tail -n 120 || true
            tail -n 220 "${log}"
            exit 1
          fi
          echo "Go test and build both passed." | tee -a "${log}"
      - name: Upload verification logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.key }}-backend-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/${{ matrix.key }}-migration.log
            ${{ runner.temp }}/${{ matrix.key }}-go-verification.log
          if-no-files-found: warn
          retention-days: 7

  database:
    name: Verify ${{ matrix.key }} database safety
    needs: [plan]
    if: ${{ needs.plan.outputs.count != '0' && (inputs.database_changed == 'true' || inputs.full_scope == 'true') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_USER: ci_runtime
          POSTGRES_PASSWORD: ci_runtime_password
          POSTGRES_DB: ci_runtime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci_runtime -d ci_runtime"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://ci_runtime:ci_runtime_password@localhost:5432/ci_runtime?sslmode=disable
      PGPASSWORD: ci_runtime_password
      DSH_REQUIRE_DB_TESTS: ${{ matrix.key == 'dsh' && 'true' || 'false' }}
      WLT_REQUIRE_DB_TESTS: ${{ matrix.key == 'wlt' && 'true' || 'false' }}
      BTHWANI_OPERATOR_CONTEXT_ID: ${{ matrix.key == 'wlt' && 'ci-wlt' || '' }}
      GOWORK: off
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ || "${ROUTED_CANDIDATE_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo \
            "::error::Invalid routed candidate SHA: routed=${ROUTED_CANDIDATE_SHA:-<empty>} candidate=${CA\
            NDIDATE_SHA:-<empty>}"
            exit 1
          fi
      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact candidate and fetch base for database analysis
        uses: ./.github/actions/fetch-exact-commits
        with:
          base_sha: ${{ inputs.base_sha }}
          head_sha: ${{ env.CANDIDATE_SHA }}
          token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Set up locked Go runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ matrix.go_mod }}
          cache-dependency-path: ${{ matrix.workdir }}/go.sum
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
      - name: Install pinned Eugene migration analyzer
        shell: bash
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/eugene"
          curl -fsSL \
            "https://github.com/kaaveland/eugene/releases/download/0.8.3/eugene-x86_64-unknown-linux-musl" \
            -o "${bin}"
          echo "444c4bb101a86e917b73779dbc9be8f50039c53c54dce4be3544d1b3d186d845  ${bin}" | sha256sum -c -
          chmod +x "${bin}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Lint applicable SQL migrations with Eugene
        id: eugene_lint
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.candidate_sha }}
          MIGRATION_DIRECTORY: ${{ matrix.migrations }}
          FULL_SCOPE: ${{ inputs.full_scope }}
        run: |
          set -euo pipefail
          files=()
          if [[ "${FULL_SCOPE}" == "true" ]]; then
            while IFS= read -r file; do
              files+=("${file}")
            done < <(find "${MIGRATION_DIRECTORY}" -type f -name '*.sql' -print | sort)
          else
            while IFS= read -r file; do
              [[ -f "${file}" ]] && files+=("${file}")
            done < <(git diff --name-only --diff-filter=ACMR "${BASE_SHA}" "${HEAD_SHA}" -- "${MIGRATION_DIRECTORY}" | grep -E '\.sql$' || true)
          fi

          if (( ${#files[@]} == 0 )); then
            echo "Eugene: no applicable SQL migrations."
            exit 0
          fi

          failures=()
          for file in "${files[@]}"; do
            echo "===== eugene lint ${file} ====="
            set +e
            eugene lint "${file}"
            code=$?
            set -e
            (( code == 0 )) || failures+=("${file}:${code}")
          done

          if (( ${#failures[@]} )); then
            echo "::error::Eugene migration findings: $(IFS=,; echo "${failures[*]}")"
            exit 1
          fi

      - name: Apply migrations and verify safety contracts
        shell: pwsh
        env:
          MIGRATION_DIRECTORY: ${{ matrix.migrations }}
          BACKEND_KEY: ${{ matrix.key }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP "$env:BACKEND_KEY-migration.log"
          $output = & pwsh -NoProfile -ExecutionPolicy Bypass `
            -File tools/scripts/test-service-migration-runner.ps1 `
            -ServiceKey $env:BACKEND_KEY `
            -MigrationDirectory $env:MIGRATION_DIRECTORY `
            -DatabaseUrl $env:DATABASE_URL 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) {
            Write-Error `
            "$env:BACKEND_KEY migration safety verification failed; complete output is retained as an artifact."
            exit $exitCode
          }
      - name: Prove clean-install database truth and invariants
        if: ${{ matrix.tests != '' }}
        shell: pwsh
        env:
          MIGRATION_DIRECTORY: ${{ matrix.migrations }}
          TESTS_DIRECTORY: ${{ matrix.tests }}
          BACKEND_KEY: ${{ matrix.key }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "$env:BACKEND_KEY-upgrade-truth.log"
          $databaseName = "ci_" + ($env:BACKEND_KEY -replace '[^a-z0-9_]', '_') + "_truth"
          & psql $env:DATABASE_URL -X -q -v ON_ERROR_STOP=1 -c "CREATE DATABASE $databaseName;"
          if ($LASTEXITCODE -ne 0) { throw "unable to create the clean-install truth database for $env:BACKEND_KEY" }
          $uri = [System.Uri]$env:DATABASE_URL
          $truthUrl = "$($uri.Scheme)://$($uri.UserInfo)@$($uri.Host):$($uri.Port)/$databaseName$($uri.Query)"
          try {
            $output = & pwsh -NoProfile -ExecutionPolicy Bypass `
              -File tools/scripts/invoke-database-upgrade-truth.ps1 `
              -ServiceName $env:BACKEND_KEY `
              -MigrationDirectory $env:MIGRATION_DIRECTORY `
              -TestsDirectory $env:TESTS_DIRECTORY `
              -DatabaseUrl $truthUrl `
              -SourceCommitSha $env:CANDIDATE_SHA 2>&1
            $exitCode = $LASTEXITCODE
            $output | Tee-Object -FilePath $log
            if ($exitCode -ne 0) {
              Write-Error "$env:BACKEND_KEY clean-install database truth failed; complete output is retained as an artifact."
              exit $exitCode
            }
          } finally {
            & psql $env:DATABASE_URL -X -q -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $databaseName;" | Out-Null
          }
      - name: Execute WLT shell invariant proofs
        if: ${{ matrix.key == 'wlt' }}
        shell: bash
        env:
          PGHOST: localhost
          PGUSER: ci_runtime
          PGDATABASE: ci_runtime
          PGPASSWORD: ci_runtime_password
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/wlt-shell-invariants.log"
          for proof in promotion-funding-integrity.sh promotion-funding-concurrency.sh; do
            echo "WLT shell invariant: ${proof}" | tee -a "${log}"
            bash "services/wlt/database/tests/${proof}" >>"${log}" 2>&1
          done
          echo "WLT shell invariant proofs passed" | tee -a "${log}"
      - name: Run WLT database integration tests
        if: ${{ matrix.key == 'wlt' }}
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/wlt-database-go-verification.log"
          printf 'database verification mode=integration packages=./...\n' | tee "${log}"
          if ! go test ./... -count=1 >>"${log}" 2>&1; then
            echo \
            "::error title=WLT database integration verification failed::The complete log is stored as an artifact."
            grep -E \
            '^--- FAIL:|^FAIL([[:space:]]|$)|panic:|undefined:|cannot use|build failed|Error Trace:' \
            "${log}" | tail -n 80 || true
            tail -n 160 "${log}"
            exit 1
          fi
      - name: Enforce Eugene migration analysis
        if: ${{ always() }}
        shell: bash
        env:
          EUGENE: ${{ steps.eugene_lint.outcome }}
        run: |
          set -euo pipefail
          [[ "${EUGENE}" == "success" ]] || {
            echo "::error::Eugene migration analysis failed: ${EUGENE}"
            exit 1
          }

      - name: Upload database verification log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.key }}-database-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/${{ matrix.key }}-migration.log
            ${{ runner.temp }}/${{ matrix.key }}-upgrade-truth.log
            ${{ runner.temp }}/wlt-shell-invariants.log
            ${{ runner.temp }}/wlt-database-go-verification.log
          if-no-files-found: warn
          retention-days: 7

  dsh-database-contract:
    name: Verify DSH schema and seed contracts
    if: ${{ inputs.dsh == 'true' && (inputs.database_changed == 'true' || inputs.full_scope == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: dsh_runtime
          POSTGRES_PASSWORD: dsh_runtime_password
          POSTGRES_DB: dsh_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U dsh_runtime -d dsh_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://dsh_runtime:dsh_runtime_password@localhost:5432/dsh_runtime?sslmode=disable
      PGPASSWORD: dsh_runtime_password
      BTHWANI_ENVIRONMENT: ci
      DSH_REQUIRE_DB_TESTS: "true"
      DSH_TEST_operator_context_id: ci-dsh
    steps:
      - name: Verify routed candidate identity
        shell: bash
        env:
          ROUTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ || "${ROUTED_CANDIDATE_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo \
            "::error::Invalid routed candidate SHA: routed=${ROUTED_CANDIDATE_SHA:-<empty>} candidate=${CA\
            NDIDATE_SHA:-<empty>}"
            exit 1
          fi
      - name: Checkout immutable source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/dsh/backend/go.mod
          cache-dependency-path: services/dsh/backend/go.sum
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
      - name: Validate governed DSH database contracts
        run: |
          node tools/scripts/check-dsh-database-contract.mjs
      - name: Apply canonical DSH migrations
        shell: pwsh
        run: >-
          ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action migrate -Transport url -DatabaseUrl
          $env:DATABASE_URL
      - name: Re-run canonical DSH migrations
        shell: pwsh
        run: >-
          ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action migrate -Transport url -DatabaseUrl
          $env:DATABASE_URL
      - name: Verify DSH migration runner failure contracts
        shell: pwsh
        run: ./services/dsh/database/scripts/test-dsh-migration-runner.ps1 -DatabaseUrl $env:DATABASE_URL
      - name: Run DSH schema database contracts
        shell: pwsh
        run: >-
          ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action test -Transport url -DatabaseUrl
          $env:DATABASE_URL -TestSuite schema
      - name: Apply DSH local seeds twice
        shell: pwsh
        run: |
          $placeholderFile = Join-Path $env:RUNNER_TEMP "dsh-seed-placeholders.json"
          @{
            FIELD_ACTOR_ID = "ci-field-actor-001"
            CAPTAIN_ACTOR_ID = "ci-captain-actor-001"
          } | ConvertTo-Json | Set-Content -LiteralPath $placeholderFile -Encoding utf8NoBOM
          ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action seed -Transport url -DatabaseUrl `
          $env:DATABASE_URL -AllowLocalSeeds -PlaceholderFile $placeholderFile
          ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action seed -Transport url -DatabaseUrl `
          $env:DATABASE_URL -AllowLocalSeeds -PlaceholderFile $placeholderFile
      - name: Run DSH seed database contracts
        shell: pwsh
        run: >-
          ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action test -Transport url -DatabaseUrl
          $env:DATABASE_URL -TestSuite seed
      - name: Run DSH database integration tests
        working-directory: services/dsh/backend
        shell: bash
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DSH_REQUIRE_DB_TESTS: "true"
          DSH_TEST_operator_context_id: ci-dsh
        run: |
          set -euo pipefail
          go test ./... -count=1
