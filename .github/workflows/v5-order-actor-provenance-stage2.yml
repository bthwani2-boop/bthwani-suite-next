name: V5 Order Actor Provenance Stage 2

on:
  push:
    branches:
      - task/v5-first-top-logic-gap-20260815

permissions:
  contents: write

jobs:
  close-provenance-boundaries:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: dsh_runtime
          POSTGRES_PASSWORD: dsh_runtime_password
          POSTGRES_DB: dsh_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U dsh_runtime -d dsh_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://dsh_runtime:dsh_runtime_password@localhost:5432/dsh_runtime?sslmode=disable
      PGPASSWORD: dsh_runtime_password
      BTHWANI_ENVIRONMENT: ci
      DSH_REQUIRE_DB_TESTS: "true"
      DSH_TEST_operator_context_id: ci-dsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/v5-first-top-logic-gap-20260815
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/dsh/backend/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0

      - name: Enable governed pnpm
        run: corepack enable && corepack prepare pnpm@10.34.0 --activate

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Reconcile exact integration baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin A --quiet
          actual="$(git rev-parse origin/A)"
          expected="babc873b6b2e712efbe082e37d1bcec977fc3d8d"
          test "$actual" = "$expected" || { echo "FOREIGN_DELTA: A moved expected=$expected actual=$actual" >&2; exit 42; }

      - name: V5 execute gate before mutation
        run: node plans/diagnose-implementing/orchestrator.mjs check --package plans/diagnose-implementing/v5-first-top-logic-gap-20260815/PACKAGE.md --phase execute

      - name: Apply governed root-cause treatment
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prompting/bthwani-orchestrator/.tmp-v5-order-actor-provenance-stage2.py
          gofmt -w \
            services/dsh/backend/internal/orders/decision.go \
            services/dsh/backend/internal/orders/preparation.go \
            services/dsh/backend/internal/orders/cancellation_saga.go \
            services/dsh/backend/internal/orders/order_truth.go \
            services/dsh/backend/internal/orders/order_truth_queries.go \
            services/dsh/backend/internal/orders/actor_provenance_redaction_test.go \
            services/dsh/backend/internal/dispatch/delivery_exceptions.go

      - name: Adversarial inventory of production event writers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          failures=[]
          count=0
          pattern=re.compile(r'INSERT\s+INTO\s+dsh_order_status_events\s*\(([^)]*)\)', re.I|re.S)
          for path in Path('services/dsh/backend/internal').rglob('*.go'):
              if path.name.endswith('_test.go'):
                  continue
              text=path.read_text()
              for match in pattern.finditer(text):
                  count += 1
                  columns={c.strip().lower() for c in match.group(1).split(',')}
                  if 'actor_id' not in columns:
                      failures.append(f'{path}: writer omits actor_id')
          if count == 0:
              failures.append('no production dsh_order_status_events writers discovered')
          if failures:
              raise SystemExit('\n'.join(failures))
          print(f'actor-provenance-writer-inventory: PASS writers={count}')
          PY

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration manifest authority
        run: node tools/guards/migration-manifest-drift-gate.mjs --service dsh

      - name: Apply governed DSH migrations
        shell: pwsh
        run: ./services/dsh/database/scripts/invoke-dsh-database.ps1 -Action migrate -Transport url -DatabaseUrl $env:DATABASE_URL

      - name: Prove forward-only actor guard and outbox contract
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            validated boolean;
            definition text;
          BEGIN
            SELECT convalidated, pg_get_constraintdef(oid)
              INTO validated, definition
            FROM pg_constraint
            WHERE conrelid='dsh_order_status_events'::regclass
              AND conname='dsh_order_status_events_actor_id_required';
            IF NOT FOUND THEN
              RAISE EXCEPTION 'actor provenance constraint missing';
            END IF;
            IF validated THEN
              RAISE EXCEPTION 'historical rows were unexpectedly validated/backfilled';
            END IF;
            IF position('btrim' in lower(definition)) = 0 OR position('actor_id' in lower(definition)) = 0 THEN
              RAISE EXCEPTION 'actor provenance constraint definition drift: %', definition;
            END IF;
          END $$;

          BEGIN;
          CREATE TEMP TABLE dsh_order_status_events_actor_guard_probe
            (LIKE dsh_order_status_events INCLUDING DEFAULTS INCLUDING CONSTRAINTS);
          DO $$
          DECLARE
            expected_constraint text;
            raised_constraint text;
          BEGIN
            SELECT conname INTO expected_constraint
            FROM pg_constraint
            WHERE conrelid='dsh_order_status_events_actor_guard_probe'::regclass
              AND contype='c'
              AND position('actor_id' in lower(pg_get_constraintdef(oid))) > 0;
            IF expected_constraint IS NULL THEN
              RAISE EXCEPTION 'actor provenance constraint absent from isolated probe';
            END IF;
            BEGIN
              INSERT INTO dsh_order_status_events_actor_guard_probe(
                order_id,operator_context_id,actor_id,actor_role,from_status,to_status,note
              ) VALUES (gen_random_uuid(),'ci-dsh','','system','','pending','guard probe');
              RAISE EXCEPTION 'blank actor_id unexpectedly accepted';
            EXCEPTION WHEN check_violation THEN
              GET STACKED DIAGNOSTICS raised_constraint = CONSTRAINT_NAME;
              IF raised_constraint <> expected_constraint THEN
                RAISE EXCEPTION 'wrong check constraint: expected %, got %', expected_constraint, raised_constraint;
              END IF;
            END;
          END $$;
          ROLLBACK;

          DO $$
          DECLARE
            definition text;
          BEGIN
            definition := lower(pg_get_functiondef('dsh_publish_order_event_to_outbox()'::regprocedure));
            IF position('actorid' in definition) = 0 OR position('new.actor_id' in definition) = 0 THEN
              RAISE EXCEPTION 'outbox actor provenance missing';
            END IF;
          END $$;
          SQL

      - name: Compile and test all DSH backend consumers
        working-directory: services/dsh/backend
        run: go test ./...

      - name: Verify OpenAPI and shared/generated consumers
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir services/dsh openapi:verify
          pnpm --dir services/dsh openapi:generate
          pnpm --dir services/dsh typecheck
          grep -q 'readonly actorId?: string' services/dsh/frontend/shared/order-truth/order-truth.types.ts
          grep -q 'actorId' services/dsh/contracts/generated/dsh.bundle.openapi.yaml
          grep -q 'actorId' services/dsh/clients/generated/dsh-api.ts

      - name: Governed staging and product commit
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/prompting/bthwani-orchestrator/.tmp-v5-order-actor-provenance-stage2.py
          git add \
            services/dsh/backend/internal/orders/decision.go \
            services/dsh/backend/internal/orders/preparation.go \
            services/dsh/backend/internal/orders/cancellation_saga.go \
            services/dsh/backend/internal/orders/order_truth.go \
            services/dsh/backend/internal/orders/order_truth_queries.go \
            services/dsh/backend/internal/orders/actor_provenance_redaction_test.go \
            services/dsh/backend/internal/dispatch/delivery_exceptions.go \
            services/dsh/frontend/shared/order-truth/order-truth.types.ts \
            services/dsh/contracts/dsh.order-truth.openapi.yaml \
            services/dsh/contracts/generated/dsh.bundle.openapi.yaml \
            services/dsh/clients/generated/dsh-api.ts \
            services/dsh/database/migrations/dsh-1008_order_event_actor_provenance.sql \
            services/dsh/database/migrations/manifest.extensions.json

          allowed='^(tools/prompting/bthwani-orchestrator/\.tmp-v5-order-actor-provenance-stage2\.py|services/dsh/backend/internal/orders/(decision|preparation|cancellation_saga|order_truth|order_truth_queries|actor_provenance_redaction_test)\.go|services/dsh/backend/internal/dispatch/delivery_exceptions\.go|services/dsh/frontend/shared/order-truth/order-truth\.types\.ts|services/dsh/contracts/(dsh\.order-truth\.openapi\.yaml|generated/dsh\.bundle\.openapi\.yaml)|services/dsh/clients/generated/dsh-api\.ts|services/dsh/database/migrations/(dsh-1008_order_event_actor_provenance\.sql|manifest\.extensions\.json))$'
          git diff --cached --name-only | tee /tmp/staged.txt
          if grep -Ev "$allowed" /tmp/staged.txt | grep -q .; then
            echo 'unexpected staged path' >&2
            exit 1
          fi
          git diff --cached --check
          if git status --porcelain | grep '^??'; then
            echo 'unexpected untracked files remain' >&2
            git status --porcelain
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'dsh: close order actor provenance across writers and readback'
          git push origin HEAD:task/v5-first-top-logic-gap-20260815
