name: BThwani Policy Verification

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      governance_policy:
        type: string
        required: true
      workflow_policy:
        type: string
        required: true
      security_policy:
        type: string
        required: true
      infrastructure_policy:
        type: string
        required: true
      nomenclature_required:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify affected policy domains
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Verify objective nomenclature
        if: ${{ inputs.nomenclature_required == 'true' }}
        env:
          CI_BASE_SHA: ${{ inputs.base_sha }}
          CI_HEAD_SHA: ${{ inputs.head_sha }}
        run: pnpm run guard:nomenclature

      - name: Test direct work-branch execution guard
        if: ${{ inputs.governance_policy == 'true' || inputs.workflow_policy == 'true' }}
        run: node --test tools/guards/direct-work-branch-execution-gate.test.mjs

      - name: Enforce direct work-branch execution policy
        if: ${{ inputs.governance_policy == 'true' || inputs.workflow_policy == 'true' }}
        run: node tools/guards/direct-work-branch-execution-gate.mjs

      - name: Verify governance schema
        if: ${{ inputs.governance_policy == 'true' }}
        run: pnpm run guard:governance-schema

      - name: Verify agent governance
        if: ${{ inputs.governance_policy == 'true' }}
        run: pnpm run guard:agent-governance

      - name: Verify authority separation
        if: ${{ inputs.governance_policy == 'true' }}
        run: pnpm run guard:authority-separation

      - name: Verify guard registry
        id: guard_registry
        if: ${{ inputs.governance_policy == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/guard-registry.log"
          pnpm run guard:guard-registry 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          exit "${status}"

      - name: Upload guard registry diagnostics
        if: ${{ steps.guard_registry.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-registry-${{ github.run_id }}
          path: ${{ runner.temp }}/guard-registry.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce guard registry result
        if: ${{ steps.guard_registry.outcome == 'failure' }}
        run: exit 1

      - name: Verify SDLC governance
        if: ${{ inputs.governance_policy == 'true' }}
        run: pnpm run guard:sdlc

      - name: Verify cleanup policy
        if: ${{ inputs.governance_policy == 'true' }}
        run: pnpm run guard:cleanup-policy

      - name: Verify contract registry drift
        run: pnpm run guard:contract-registry-drift

      - name: Verify migration manifest drift
        run: pnpm run guard:migration-manifest-drift

      - name: Verify generated client provenance
        id: generated_client_provenance
        continue-on-error: true
        run: pnpm run guard:generated-client-provenance

      - name: Materialize generated contract diagnostics
        if: ${{ steps.generated_client_provenance.outcome == 'failure' }}
        run: pnpm run openapi:generate:all

      - name: Upload generated contract diagnostics
        if: ${{ steps.generated_client_provenance.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-contract-candidates-${{ github.run_id }}
          path: |
            core/identity/contracts/generated/identity.bundle.openapi.yaml
            core/identity/clients/generated/identity-api.ts
            core/workforce/contracts/generated/workforce.bundle.openapi.yaml
            core/workforce/clients/generated/workforce-api.ts
            core/platform-control/contracts/generated/platform-control.bundle.openapi.yaml
            core/platform-control/clients/generated/platform-control-api.ts
            core/providers/contracts/generated/providers.bundle.openapi.yaml
            core/providers/clients/generated/providers-api.ts
            services/dsh/contracts/generated/dsh.bundle.openapi.yaml
            services/dsh/clients/generated/dsh-api.ts
            services/wlt/contracts/generated/wlt.bundle.openapi.yaml
            services/wlt/clients/generated/wlt-api.ts
          if-no-files-found: error
          retention-days: 7

      - name: Enforce generated client provenance result
        if: ${{ steps.generated_client_provenance.outcome == 'failure' }}
        run: exit 1

      - name: Verify contract scope binding
        run: pnpm run guard:contract-scope-binding

      - name: Verify OpenAPI bundle provenance (identity, workforce, platform-control, providers)
        run: pnpm run guard:openapi-bundle-provenance

      - name: Verify DSH OpenAPI bundle provenance
        run: pnpm run openapi:lint:dsh

      - name: Verify every registered DSH route is declared or a reviewed exception
        run: pnpm run guard:dsh-route-declaration

      - name: Verify WLT OpenAPI bundle provenance
        run: pnpm run guard:wlt-openapi-bundle

      - name: Verify portable tracked configuration
        if: ${{ inputs.governance_policy == 'true' }}
        run: node tools/scripts/check-portable-tracked-config.mjs

      - name: Analyze tracked repository hygiene
        if: ${{ inputs.governance_policy == 'true' }}
        run: node tools/scripts/check-repository-hygiene.mjs

      - name: Verify required command integrity
        id: required_command_integrity
        if: ${{ inputs.governance_policy == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP}/required-command-integrity.log"
          pnpm run guard:required-command-integrity 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          exit "${status}"

      - name: Upload required command diagnostics
        if: ${{ steps.required_command_integrity.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: required-command-integrity-${{ github.run_id }}
          path: ${{ runner.temp }}/required-command-integrity.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce required command integrity result
        if: ${{ steps.required_command_integrity.outcome == 'failure' }}
        run: exit 1

      - name: Verify workflow security preflight
        id: workflow_security
        if: ${{ inputs.workflow_policy == 'true' || inputs.security_policy == 'true' }}
        continue-on-error: true
        run: pnpm run guard:workflow-security

      - name: Upload workflow security report
        if: ${{ steps.workflow_security.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-security-${{ github.run_id }}
          path: .diagnostics/workflow-security/zizmor.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce workflow security result
        if: ${{ steps.workflow_security.outcome == 'failure' }}
        run: exit 1

      - name: Test CI source immutability guard
        if: ${{ inputs.workflow_policy == 'true' || inputs.security_policy == 'true' }}
        run: node --test tools/scripts/check-ci-source-immutability.test.mjs

      - name: Enforce verification-only CI source policy
        if: ${{ inputs.workflow_policy == 'true' || inputs.security_policy == 'true' }}
        run: node tools/scripts/check-ci-source-immutability.mjs

      - name: Verify pinned actions
        if: ${{ inputs.workflow_policy == 'true' || inputs.security_policy == 'true' }}
        run: pnpm run guard:actions-pin

      - name: Verify workflow syntax
        id: workflow_lint
        if: ${{ inputs.workflow_policy == 'true' || inputs.security_policy == 'true' }}
        continue-on-error: true
        run: pnpm run guard:workflow-lint

      - name: Upload workflow syntax diagnostics
        if: ${{ steps.workflow_lint.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-lint-${{ github.run_id }}
          path: .diagnostics/workflow/actionlint.jsonl
          if-no-files-found: error
          retention-days: 7

      - name: Enforce workflow syntax result
        if: ${{ steps.workflow_lint.outcome == 'failure' }}
        run: exit 1

      - name: Verify workflow policy
        if: ${{ inputs.workflow_policy == 'true' || inputs.security_policy == 'true' }}
        run: pnpm run guard:opa-policies

      - name: Verify runtime configuration policy
        if: ${{ inputs.infrastructure_policy == 'true' }}
        run: pnpm run guard:runtime-config

      - name: Verify infrastructure policy
        if: ${{ inputs.infrastructure_policy == 'true' }}
        run: pnpm run guard:opa-policies

      - name: Verify immutable commit diff
        id: immutable_diff
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set +e
          log="${RUNNER_TEMP}/immutable-policy-diff.log"
          git diff --check "${BASE_SHA}" "${HEAD_SHA}" 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          exit "${status}"

      - name: Upload immutable policy diff diagnostics
        if: ${{ steps.immutable_diff.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immutable-policy-diff-${{ github.run_id }}
          path: ${{ runner.temp }}/immutable-policy-diff.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce immutable policy diff result
        if: ${{ steps.immutable_diff.outcome == 'failure' }}
        run: exit 1
