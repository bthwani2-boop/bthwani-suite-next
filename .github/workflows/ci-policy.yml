name: BThwani Policy Verification

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      policy:
        type: string
        required: true
      workflow:
        type: string
        required: true
      security:
        type: string
        required: true
      infrastructure:
        type: string
        required: true

permissions:
  contents: read

jobs:
  nomenclature:
    name: Ensure objective nomenclature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify objective nomenclature
        env:
          CI_BASE_SHA: ${{ inputs.base_sha }}
          CI_HEAD_SHA: ${{ inputs.head_sha }}
        run: pnpm run guard:nomenclature

  affected_policy:
    name: Verify affected governance and workflow policy
    if: ${{ inputs.policy == 'true' || inputs.workflow == 'true' || inputs.security == 'true' || inputs.infrastructure == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify workflow security preflight (guard:workflow-security)
        id: workflow_security
        if: ${{ inputs.workflow == 'true' || inputs.security == 'true' }}
        continue-on-error: true
        env:
          BTHWANI_ZIZMOR_REPORT: ${{ runner.temp }}/zizmor/zizmor.json
        run: node tools/scripts/run-zizmor.mjs
      - name: Upload workflow security findings
        if: ${{ steps.workflow_security.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-security-${{ github.run_id }}
          path: ${{ runner.temp }}/zizmor/zizmor.json
          if-no-files-found: error
          retention-days: 14
      - name: Fail closed on workflow security findings
        if: ${{ steps.workflow_security.outcome == 'failure' }}
        run: |
          echo "::error title=Workflow security failed::Review the machine-readable Zizmor artifact."
          exit 1
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Test CI source immutability guard
        if: ${{ inputs.workflow == 'true' || inputs.security == 'true' }}
        run: node --test tools/scripts/check-ci-source-immutability.test.mjs
      - name: Enforce verification-only CI source policy
        if: ${{ inputs.workflow == 'true' || inputs.security == 'true' }}
        run: node tools/scripts/check-ci-source-immutability.mjs
      - name: Verify governance schema
        if: ${{ inputs.policy == 'true' }}
        run: pnpm run guard:governance-schema
      - name: Verify agent governance
        if: ${{ inputs.policy == 'true' }}
        run: pnpm run guard:agent-governance
      - name: Verify authority separation
        if: ${{ inputs.policy == 'true' }}
        run: pnpm run guard:authority-separation
      - name: Verify SaaS governance
        if: ${{ inputs.policy == 'true' }}
        run: pnpm run guard:saas-governance
      - name: Verify guard registry
        id: guard_registry
        if: ${{ inputs.policy == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/guard-registry"
          set -o pipefail
          pnpm run guard:guard-registry 2>&1 | tee "${RUNNER_TEMP}/guard-registry/guard-registry.log"
      - name: Upload guard registry evidence
        if: ${{ inputs.policy == 'true' && steps.guard_registry.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-registry-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/guard-registry/guard-registry.log
            governance/guards/guard-registry.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify SDLC governance
        id: sdlc
        if: ${{ inputs.policy == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/sdlc"
          set -o pipefail
          pnpm run guard:sdlc 2>&1 | tee "${RUNNER_TEMP}/sdlc/sdlc.log"
      - name: Upload SDLC governance evidence
        if: ${{ inputs.policy == 'true' && steps.sdlc.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdlc-governance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sdlc/sdlc.log
            governance/operational_journey_protocol_package/sdlc/**
            governance/26_SDLC_TEAM_AND_STAGE_GATES.md
          if-no-files-found: error
          retention-days: 14
      - name: Verify cleanup policy
        if: ${{ inputs.policy == 'true' }}
        run: pnpm run guard:cleanup-policy
      - name: Verify portable tracked configuration
        if: ${{ inputs.policy == 'true' }}
        run: node tools/scripts/check-portable-tracked-config.mjs
      - name: Analyze tracked repository hygiene
        id: repository_hygiene
        if: ${{ inputs.policy == 'true' }}
        continue-on-error: true
        env:
          BTHWANI_HYGIENE_REPORT: ${{ runner.temp }}/repository-hygiene/report.json
        run: node tools/scripts/check-repository-hygiene.mjs
      - name: Upload repository hygiene report
        if: ${{ inputs.policy == 'true' && steps.repository_hygiene.outcome != 'skipped' && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-hygiene-${{ github.run_id }}
          path: ${{ runner.temp }}/repository-hygiene/report.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify required command integrity
        if: ${{ inputs.policy == 'true' }}
        run: pnpm run guard:required-command-integrity
      - name: Verify pinned actions
        if: ${{ inputs.workflow == 'true' || inputs.security == 'true' }}
        run: pnpm run guard:actions-pin
      - name: Verify workflow syntax
        if: ${{ inputs.workflow == 'true' || inputs.security == 'true' }}
        run: pnpm run guard:workflow-lint
      - name: Verify workflow policy
        if: ${{ inputs.workflow == 'true' || inputs.security == 'true' }}
        run: pnpm run guard:opa-policies
      - name: Verify runtime configuration policy
        if: ${{ inputs.infrastructure == 'true' }}
        run: pnpm run guard:runtime-config
      - name: Verify infrastructure policy
        if: ${{ inputs.infrastructure == 'true' }}
        run: pnpm run guard:opa-policies
      - name: Verify immutable commit diff
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"
      - name: Fail closed on deferred policy violations
        if: ${{ always() && (steps.guard_registry.outcome == 'failure' || steps.sdlc.outcome == 'failure' || steps.repository_hygiene.outcome == 'failure') }}
        run: |
          echo "::error title=Policy verification failed::Review the guard-registry, SDLC, and repository-hygiene artifacts."
          exit 1
