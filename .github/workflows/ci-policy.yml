name: BThwani Policy Verification

on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      governance_policy:
        type: string
        required: true
      workflow_policy:
        type: string
        required: true
      security_policy:
        type: string
        required: true
      infrastructure_policy:
        type: string
        required: true
      nomenclature_required:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify affected policy domains
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace

      - name: Verify objective nomenclature
        if: ${{ inputs.nomenclature_required == 'true' }}
        env:
          CI_BASE_SHA: ${{ inputs.base_sha }}
          CI_HEAD_SHA: ${{ inputs.head_sha }}
        run: pnpm run guard:nomenclature

      - name: Test direct work-branch execution guard
        if: ${{ inputs.governance_policy == 'true' || inputs.workflow_policy == 'true' }}
        run: node --test tools/guards/direct-work-branch-execution-gate.test.mjs

      - name: Enforce direct work-branch execution policy
        if: ${{ inputs.governance_policy == 'true' || inputs.workflow_policy == 'true' }}
        run: node tools/guards/direct-work-branch-execution-gate.mjs

      - name: Verify governance schema
        if: ${{ inputs.governance_policy == 'true' }}
        run: pnpm run guard:governance-schema

      - name: Verify agent governance
        if: ${{ inputs.governance_policy == 'true' }}
        run: pnpm run guard:agent-governance

      - name: Verify authority separation
        if: ${{ inputs.governance_policy == 'true' }}
        run: pnpm run guard:authority-separation

      - name: Verify SaaS governance
        if: ${{ inputs.governance_policy == 'true' }}
        run: pnpm run guard:saas-governance

      - name: Verify guard registry
        if: ${{ inputs.governance_policy == 'true' }}
        run: |
          set +e
          log="${RUNNER_TEMP}/guard-registry.log"
          pnpm run guard:guard-registry >"${log}" 2>&1
          status=$?
          cat "${log}"
          exit "${status}"

      - name: Upload guard registry diagnostic
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-registry-${{ github.run_id }}
          path: ${{ runner.temp }}/guard-registry.log
          if-no-files-found: error
          retention-days: 1

      - name: Verify SDLC governance
        if: ${{ inputs.governance_policy == 'true' }}
        run: pnpm run guard:sdlc

      - name: Verify cleanup policy
        if: ${{ inputs.governance_policy == 'true' }}
        run: pnpm run guard:cleanup-policy

      - name: Verify portable tracked configuration
        if: ${{ inputs.governance_policy == 'true' }}
        run: node tools/scripts/check-portable-tracked-config.mjs

      - name: Analyze tracked repository hygiene
        if: ${{ inputs.governance_policy == 'true' }}
        run: node tools/scripts/check-repository-hygiene.mjs

      - name: Verify required command integrity
        if: ${{ inputs.governance_policy == 'true' }}
        run: pnpm run guard:required-command-integrity

      - name: Verify workflow security preflight
        if: ${{ inputs.workflow_policy == 'true' || inputs.security_policy == 'true' }}
        run: node tools/scripts/run-zizmor.mjs

      - name: Test CI source immutability guard
        if: ${{ inputs.workflow_policy == 'true' || inputs.security_policy == 'true' }}
        run: node --test tools/scripts/check-ci-source-immutability.test.mjs

      - name: Enforce verification-only CI source policy
        if: ${{ inputs.workflow_policy == 'true' || inputs.security_policy == 'true' }}
        run: node tools/scripts/check-ci-source-immutability.mjs

      - name: Verify pinned actions
        if: ${{ inputs.workflow_policy == 'true' || inputs.security_policy == 'true' }}
        run: pnpm run guard:actions-pin

      - name: Verify workflow syntax
        if: ${{ inputs.workflow_policy == 'true' || inputs.security_policy == 'true' }}
        run: pnpm run guard:workflow-lint

      - name: Verify workflow policy
        if: ${{ inputs.workflow_policy == 'true' || inputs.security_policy == 'true' }}
        run: pnpm run guard:opa-policies

      - name: Verify runtime configuration policy
        if: ${{ inputs.infrastructure_policy == 'true' }}
        run: pnpm run guard:runtime-config

      - name: Verify infrastructure policy
        if: ${{ inputs.infrastructure_policy == 'true' }}
        run: pnpm run guard:opa-policies

      - name: Verify immutable commit diff
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"
