name: Temporary Contract Source Export

on:
  pull_request:
    paths:
      - '.github/workflows/contract-source-export.yml'
      - 'tools/scripts/repair-workforce-refund-contracts.mjs'
      - 'tools/scripts/repair-cod-catalog-bindings.py'
      - 'tools/scripts/repair-field-catalog-detail.py'
      - 'tools/scripts/consolidate-dsh-cod-contract.py'
      - 'tools/scripts/repair-payment-remit-bindings.py'
      - 'tools/scripts/normalize-refund-fragment-refs.py'
      - 'core/workforce/contracts/**'
      - 'services/dsh/**'
      - 'services/wlt/contracts/**'

permissions:
  contents: read

jobs:
  export:
    name: Verify canonical OpenAPI and runtime repair
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Transform contract and runtime sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workforce = Path('tools/scripts/repair-workforce-refund-contracts.mjs')
          source = workforce.read_text(encoding='utf-8')
          old = 'source = source.replace(anchor, block + anchor);'
          new = 'source = source.replace(anchor, () => block + anchor);'
          if old in source:
              workforce.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('Expected Workforce replacement statement is missing')

          cod = Path('tools/scripts/repair-cod-catalog-bindings.py')
          source = cod.read_text(encoding='utf-8')
          old = 'remove_unused_catalog_detail_read()\n'
          new = 'print("catalog detail read preserved for field-scoped repair")\n'
          if old in source:
              cod.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('Expected catalog removal call is missing')

          field = Path('tools/scripts/repair-field-catalog-detail.py')
          source = field.read_text(encoding='utf-8')
          old_block = '    source = replace_once(\n        source,\n        "`/dsh/operator/catalog/master-products/${encodeURIComponent(productId)}`",\n        "`/dsh/field/catalog/master-products/${encodeURIComponent(productId)}`",\n        "field product detail path",\n    )'
          new_block = '    old_path = "`/dsh/operator/catalog/master-products/${encodeURIComponent(productId)}`"\n    head, separator, tail = source.rpartition(old_path)\n    if not separator:\n        raise RuntimeError("field product detail path is missing")\n    source = head + "`/dsh/field/catalog/master-products/${encodeURIComponent(productId)}`" + tail'
          if old_block in source:
              field.write_text(source.replace(old_block, new_block, 1), encoding='utf-8')
          elif new_block not in source:
              raise SystemExit('Expected field path replacement block is missing')
          PY
          node tools/scripts/repair-workforce-refund-contracts.mjs
          python tools/scripts/normalize-refund-fragment-refs.py
          python tools/scripts/repair-cod-catalog-bindings.py
          python tools/scripts/consolidate-dsh-cod-contract.py
          python tools/scripts/repair-field-catalog-detail.py
          python tools/scripts/repair-payment-remit-bindings.py
          gofmt -w \
            services/dsh/backend/internal/http/server.go \
            services/dsh/backend/internal/http/catalog_unified_routes.go \
            services/dsh/backend/internal/http/cod_finance_handlers.go \
            services/dsh/backend/internal/http/cod_finance_routes.go \
            services/dsh/backend/internal/http/cod_reconciliation_routes_test.go \
            services/dsh/backend/internal/http/field_catalog_detail_route_test.go \
            services/dsh/backend/internal/http/payment_partner_cod_routes_test.go \
            services/dsh/backend/internal/wlt/finance_proxy.go \
            services/dsh/backend/internal/wlt/finance_proxy_test.go
      - name: Regenerate canonical artifacts
        run: |
          pnpm run openapi:generate:workforce
          pnpm run openapi:generate:dsh
          pnpm run openapi:generate:wlt
          pnpm run contracts:registry
      - name: Verify contract and runtime repair
        run: |
          git diff --check
          pnpm run guard:contract-registry-drift
          pnpm run guard:openapi-bundle-provenance
          pnpm run guard:generated-client-provenance
          pnpm run guard:contract-scope-binding
          pnpm run guard:api-binding
          pnpm run guard:backend-api-binding
          pnpm --dir services/dsh test
          (cd services/dsh/backend && go test ./...)
          (cd core/workforce/backend && go test ./...)
      - name: Upload verified repair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-contract-runtime-repair-${{ github.run_id }}
          path: |
            core/workforce/contracts/workforce.sovereign-leadership.openapi.yaml
            core/workforce/contracts/generated/workforce.bundle.openapi.yaml
            core/workforce/clients/generated/workforce-api.ts
            services/dsh/frontend/shared/catalog/central-catalog.api.ts
            services/dsh/frontend/app-field/components/DshFieldAssortmentPauseScreen.tsx
            services/dsh/backend/internal/http/server.go
            services/dsh/backend/internal/http/catalog_unified_routes.go
            services/dsh/backend/internal/http/cod_finance_handlers.go
            services/dsh/backend/internal/http/cod_finance_routes.go
            services/dsh/backend/internal/http/cod_reconciliation_routes_test.go
            services/dsh/backend/internal/http/field_catalog_detail_route_test.go
            services/dsh/backend/internal/http/payment_partner_cod_routes_test.go
            services/dsh/backend/internal/wlt/finance_proxy.go
            services/dsh/backend/internal/wlt/finance_proxy_test.go
            services/dsh/contracts/dsh.openapi.yaml
            services/dsh/contracts/dsh.catalog.openapi.yaml
            services/dsh/contracts/dsh.payment-sessions.openapi.yaml
            services/dsh/contracts/contract.manifest.yaml
            services/dsh/contracts/contract-registry.ts
            services/dsh/contracts/paths/catalog.paths.yaml
            services/dsh/contracts/paths/cod-custody.paths.yaml
            services/dsh/contracts/paths/misc.paths.yaml
            services/dsh/contracts/paths/refunds.paths.yaml
            services/dsh/contracts/components/cod-custody.parameters.yaml
            services/dsh/contracts/components/schemas/cod-custody.schemas.yaml
            services/dsh/contracts/components/refunds.components.yaml
            services/dsh/contracts/generated/dsh.bundle.openapi.yaml
            services/dsh/clients/generated/dsh-api.ts
            services/wlt/clients/generated/wlt-api.ts
            contracts/generated/contract-registry.json
          if-no-files-found: error
          retention-days: 1
