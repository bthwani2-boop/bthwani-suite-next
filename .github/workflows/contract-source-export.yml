name: Temporary Contract Source Export

on:
  pull_request:
    paths:
      - '.github/workflows/contract-source-export.yml'
      - 'tools/scripts/repair-workforce-refund-contracts.mjs'
      - 'tools/scripts/repair-cod-catalog-bindings.py'
      - 'tools/scripts/repair-field-catalog-detail.py'
      - 'tools/scripts/consolidate-dsh-cod-contract.py'
      - 'tools/scripts/repair-payment-remit-bindings.py'
      - 'tools/scripts/normalize-refund-fragment-refs.py'
      - 'tools/scripts/remove-unowned-settlement-ui.py'
      - 'tools/scripts/repair-final-backend-bindings.py'
      - 'tools/scripts/repair-reconciliation-bindings.py'
      - 'core/workforce/contracts/**'
      - 'services/dsh/**'
      - 'services/wlt/contracts/**'

permissions:
  contents: read

jobs:
  export:
    name: Verify canonical OpenAPI and runtime repair
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Transform contract and runtime sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workforce = Path('tools/scripts/repair-workforce-refund-contracts.mjs')
          source = workforce.read_text(encoding='utf-8')
          old = 'source = source.replace(anchor, block + anchor);'
          new = 'source = source.replace(anchor, () => block + anchor);'
          if old in source:
              workforce.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('Expected Workforce replacement statement is missing')

          cod = Path('tools/scripts/repair-cod-catalog-bindings.py')
          source = cod.read_text(encoding='utf-8')
          old = 'remove_unused_catalog_detail_read()\n'
          new = 'print("catalog detail read preserved for field-scoped repair")\n'
          if old in source:
              cod.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('Expected catalog removal call is missing')

          field = Path('tools/scripts/repair-field-catalog-detail.py')
          source = field.read_text(encoding='utf-8')
          old_block = '    source = replace_once(\n        source,\n        "`/dsh/operator/catalog/master-products/${encodeURIComponent(productId)}`",\n        "`/dsh/field/catalog/master-products/${encodeURIComponent(productId)}`",\n        "field product detail path",\n    )'
          new_block = '    old_path = "`/dsh/operator/catalog/master-products/${encodeURIComponent(productId)}`"\n    head, separator, tail = source.rpartition(old_path)\n    if not separator:\n        raise RuntimeError("field product detail path is missing")\n    source = head + "`/dsh/field/catalog/master-products/${encodeURIComponent(productId)}`" + tail'
          if old_block in source:
              field.write_text(source.replace(old_block, new_block, 1), encoding='utf-8')
          elif new_block not in source:
              raise SystemExit('Expected field path replacement block is missing')

          final = Path('tools/scripts/repair-final-backend-bindings.py')
          source = final.read_text(encoding='utf-8')
          old = 'append_payout_transition_handlers()\n'
          new = 'print("existing payout handlers preserved; registrar added after transformations")\n'
          if old in source:
              final.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('Expected payout handler generation call is missing')

          reconciliation = Path('tools/scripts/repair-reconciliation-bindings.py')
          source = reconciliation.read_text(encoding='utf-8')
          old = 'write_handlers()\n'
          new = 'print("existing reconciliation handlers preserved; registrar added after transformations")\n'
          if old in source:
              reconciliation.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('Expected reconciliation handler generation call is missing')
          PY
          node tools/scripts/repair-workforce-refund-contracts.mjs
          python tools/scripts/normalize-refund-fragment-refs.py
          python tools/scripts/repair-cod-catalog-bindings.py
          python tools/scripts/consolidate-dsh-cod-contract.py
          python tools/scripts/repair-field-catalog-detail.py
          python tools/scripts/repair-payment-remit-bindings.py
          python tools/scripts/remove-unowned-settlement-ui.py
          python tools/scripts/repair-final-backend-bindings.py
          python tools/scripts/repair-reconciliation-bindings.py
          python - <<'PY'
          from pathlib import Path

          payout = Path('services/dsh/backend/internal/http/payout_routes.go')
          source = payout.read_text(encoding='utf-8')
          registrar = '''

          func registerPayoutFinanceRoutes(mux *http.ServeMux, s *protectedStoreServer) {
          \tmux.HandleFunc("POST /dsh/control-panel/finance/payout-requests/{payoutId}/approve", s.handleApproveFinancePayoutRequest)
          \tmux.HandleFunc("POST /dsh/control-panel/finance/payout-requests/{payoutId}/reject", s.handleRejectFinancePayoutRequest)
          \tmux.HandleFunc("POST /dsh/control-panel/finance/payout-requests/{payoutId}/process", s.handleProcessFinancePayoutRequest)
          \tmux.HandleFunc("POST /dsh/control-panel/finance/payout-requests/{payoutId}/complete", s.handleCompleteFinancePayoutRequest)
          \tmux.HandleFunc("POST /dsh/control-panel/finance/payout-requests/{payoutId}/fail", s.handleFailFinancePayoutRequest)
          }
          '''
          if 'func registerPayoutFinanceRoutes' not in source:
              source = source.rstrip() + registrar + '\n'

          old = '''func (s *protectedStoreServer) handleReconcileFinancePayoutRequest(w http.ResponseWriter, r *http.Request) {
          \tactor, ok := s.requirePermission(w, r, "control-panel", FinancePermissionManage, "operator")
          \tif !ok { return }
          \tpayoutID := strings.TrimSpace(r.PathValue("payoutId"))'''
          new = '''func (s *protectedStoreServer) handleReconcileFinancePayoutRequest(w http.ResponseWriter, r *http.Request) {
          \tactor, ok := s.requirePermission(w, r, "control-panel", FinancePermissionManage, "operator")
          \tif !ok { return }
          \toperatorContextID, ok := requiredPaymentPlatformContext(w, actor.OperatorContextID)
          \tif !ok { return }
          \tpayoutID := strings.TrimSpace(r.PathValue("payoutId"))'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('Expected payout reconciliation handler is missing')
          old = '''\tstatus, responseBody, err := s.wlt.FinanceWrite(
          \t\tr.Context(),
          \t\thttp.MethodPost,
          \t\t"/wlt/payout-requests/"+url.PathEscape(payoutID)+"/reconcile",
          \t\toperatorWriteBody(actor.ID),
          \t\tcorrelationForActorMutation(r, "payout-reconcile-"+payoutID),
          \t)'''
          new = '''\tstatus, responseBody, err := s.wlt.FinanceWriteWithOperatorContext(
          \t\tr.Context(),
          \t\thttp.MethodPost,
          \t\t"/wlt/payout-requests/"+url.PathEscape(payoutID)+"/reconcile",
          \t\toperatorWriteBody(actor.ID),
          \t\tcorrelationForActorMutation(r, "payout-reconcile-"+payoutID),
          \t\toperatorContextID,
          \t)'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('Expected payout reconciliation write is missing')
          payout.write_text(source, encoding='utf-8')

          transitions = Path('services/dsh/backend/internal/http/financeproxy_payout_transitions.go')
          source = transitions.read_text(encoding='utf-8')
          old = '''\tif !ok {
          \t\treturn
          \t}
          \tif !s.wlt.Configured() {'''
          new = '''\tif !ok {
          \t\treturn
          \t}
          \toperatorContextID, ok := requiredPaymentPlatformContext(w, actor.OperatorContextID)
          \tif !ok {
          \t\treturn
          \t}
          \tif !s.wlt.Configured() {'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('Expected payout transition permission block is missing')
          old = '''\tstatus, body, err := s.wlt.FinanceWrite(
          \t\tr.Context(),
          \t\thttp.MethodPost,
          \t\t"/wlt/payout-requests/"+url.PathEscape(payoutID)+"/"+action,
          \t\toperatorWriteBody(actor.ID),
          \t\tr.Header.Get("X-Correlation-ID"),
          \t)'''
          new = '''\tstatus, body, err := s.wlt.FinanceWriteWithOperatorContext(
          \t\tr.Context(),
          \t\thttp.MethodPost,
          \t\t"/wlt/payout-requests/"+url.PathEscape(payoutID)+"/"+action,
          \t\toperatorWriteBody(actor.ID),
          \t\tr.Header.Get("X-Correlation-ID"),
          \t\toperatorContextID,
          \t)'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('Expected payout transition write is missing')
          transitions.write_text(source, encoding='utf-8')

          reconciliation = Path('services/dsh/backend/internal/http/reconciliation_finance_routes.go')
          reconciliation.write_text('''package http

          import "net/http"

          func registerReconciliationFinanceRoutes(mux *http.ServeMux, s *protectedStoreServer) {
          \tmux.HandleFunc("POST /dsh/control-panel/finance/reconciliation-cases/{caseId}/assign", s.handleAssignFinanceReconciliationCase)
          \tmux.HandleFunc("POST /dsh/control-panel/finance/reconciliation-cases/{caseId}/resolve", s.handleResolveFinanceReconciliationCase)
          }
          ''', encoding='utf-8')
          PY
          gofmt -w \
            services/dsh/backend/internal/http/server.go \
            services/dsh/backend/internal/http/catalog_unified_routes.go \
            services/dsh/backend/internal/http/cod_finance_handlers.go \
            services/dsh/backend/internal/http/cod_finance_routes.go \
            services/dsh/backend/internal/http/payout_routes.go \
            services/dsh/backend/internal/http/financeproxy_payout_transitions.go \
            services/dsh/backend/internal/http/reconciliation_finance_routes.go \
            services/dsh/backend/internal/http/cod_reconciliation_routes_test.go \
            services/dsh/backend/internal/http/field_catalog_detail_route_test.go \
            services/dsh/backend/internal/http/payment_partner_cod_routes_test.go \
            services/dsh/backend/internal/http/final_finance_routes_test.go \
            services/dsh/backend/internal/http/reconciliation_finance_routes_test.go \
            services/dsh/backend/internal/wlt/finance_proxy.go \
            services/dsh/backend/internal/wlt/finance_proxy_test.go
      - name: Regenerate canonical artifacts
        run: |
          pnpm run openapi:generate:workforce
          pnpm run openapi:generate:dsh
          pnpm run openapi:generate:wlt
          pnpm run contracts:registry
      - name: Verify contract and runtime repair
        run: |
          git diff --check
          pnpm run guard:contract-registry-drift
          pnpm run guard:openapi-bundle-provenance
          pnpm run guard:generated-client-provenance
          pnpm run guard:contract-scope-binding
          pnpm run guard:api-binding
          pnpm run guard:backend-api-binding
          pnpm --dir services/dsh test
          (cd services/dsh/backend && go test ./...)
          (cd core/workforce/backend && go test ./...)
      - name: Upload verified repair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-contract-runtime-repair-${{ github.run_id }}
          path: |
            core/workforce/contracts/workforce.sovereign-leadership.openapi.yaml
            core/workforce/contracts/generated/workforce.bundle.openapi.yaml
            core/workforce/clients/generated/workforce-api.ts
            services/dsh/frontend/shared/catalog/central-catalog.api.ts
            services/dsh/frontend/shared/finance-wlt-link/finance/finance-hub-runtime.api.ts
            services/dsh/frontend/shared/finance-wlt-link/finance/finance.controller.ts
            services/dsh/frontend/control-panel/finance/PayoutRequestsPanel.tsx
            services/dsh/frontend/control-panel/finance/GovernedSettlementPanel.tsx
            services/dsh/frontend/app-field/components/DshFieldAssortmentPauseScreen.tsx
            services/dsh/backend/internal/http/server.go
            services/dsh/backend/internal/http/catalog_unified_routes.go
            services/dsh/backend/internal/http/cod_finance_handlers.go
            services/dsh/backend/internal/http/cod_finance_routes.go
            services/dsh/backend/internal/http/payout_routes.go
            services/dsh/backend/internal/http/financeproxy_payout_transitions.go
            services/dsh/backend/internal/http/reconciliation_finance_routes.go
            services/dsh/backend/internal/http/cod_reconciliation_routes_test.go
            services/dsh/backend/internal/http/field_catalog_detail_route_test.go
            services/dsh/backend/internal/http/payment_partner_cod_routes_test.go
            services/dsh/backend/internal/http/final_finance_routes_test.go
            services/dsh/backend/internal/http/reconciliation_finance_routes_test.go
            services/dsh/backend/internal/wlt/finance_proxy.go
            services/dsh/backend/internal/wlt/finance_proxy_test.go
            services/dsh/contracts/dsh.openapi.yaml
            services/dsh/contracts/dsh.catalog.openapi.yaml
            services/dsh/contracts/dsh.payment-sessions.openapi.yaml
            services/dsh/contracts/contract.manifest.yaml
            services/dsh/contracts/contract-registry.ts
            services/dsh/contracts/paths/catalog.paths.yaml
            services/dsh/contracts/paths/captain.paths.yaml
            services/dsh/contracts/paths/cod-custody.paths.yaml
            services/dsh/contracts/paths/field.paths.yaml
            services/dsh/contracts/paths/misc.paths.yaml
            services/dsh/contracts/paths/refunds.paths.yaml
            services/dsh/contracts/components/cod-custody.parameters.yaml
            services/dsh/contracts/components/schemas/cod-custody.schemas.yaml
            services/dsh/contracts/components/refunds.components.yaml
            services/dsh/contracts/generated/dsh.bundle.openapi.yaml
            services/dsh/clients/generated/dsh-api.ts
            services/wlt/clients/generated/wlt-api.ts
            contracts/generated/contract-registry.json
          if-no-files-found: error
          retention-days: 1
