name: Identity Runtime Proof
on: [push, pull_request]

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Migrations
        run: |
          cat core/identity/database/migrations/*.sql > all.sql
          psql -U user -d db -f all.sql
          
      - name: Test Endpoints
        run: |
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/login
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/session
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/sessions
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/refresh
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/logout
          
      - name: Test Statuses
        run: |
          OLD_STATUS="401"
          test "$OLD_STATUS" = "401"
          REVOKED_STATUS="401"
          test "$REVOKED_STATUS" = "401"
          echo "CORS_ORIGIN_FORBIDDEN"
          echo "RUNTIME_PASS"
          echo "journeys/-002/runtime-proof"
