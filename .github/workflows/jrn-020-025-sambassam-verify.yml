name: JRN-020-025 Sambassam Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/dsh/**"
      - "services/wlt/**"
      - "tools/guards/**"
      - ".github/workflows/jrn-020-025-sambassam-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify JRN-020 through JRN-025 boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Verify full-stack sovereign boundary
        run: pnpm run guard:fullstack-boundary
      - name: Verify WLT financial boundary
        run: pnpm run guard:wlt-financial-boundary
      - name: Verify governed DSH routes
        working-directory: services/dsh/backend
        run: go test ./... -run TestJourneys020To025ExposeGovernedRoutes -count=1
