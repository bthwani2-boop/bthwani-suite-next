name: BThwani Master Sonar

"on":
  push:
    branches: [master]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarQube master analysis
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit
    with:
      head_sha: ${{ github.sha }}
      base_sha: ${{ github.event.before }}
      trusted_scan: true
      full_scope: true
