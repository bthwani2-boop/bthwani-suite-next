name: Fetch exact verification commits
description: >-
  Verify the checked-out immutable candidate and fetch only the base commit required for diff-based
  verification.

inputs:
  base_sha:
    description: Exact verification base commit.
    required: true
  head_sha:
    description: Exact verification head commit expected to already be checked out from the GitHub event.
    required: true
  token:
    description: Read-only GitHub token used when the shallow checkout lacks the base commit.
    required: true
  repository:
    description: GitHub repository in owner/name form.
    required: true

runs:
  using: composite
  steps:
    - name: Verify candidate checkout and fetch immutable base
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
        GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY_NAME: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        if [[ -z "${HEAD_SHA}" || "${HEAD_SHA}" =~ ^0+$ ]]; then
          echo "::error::Exact verification head SHA is required."
          exit 1
        fi

        checked_out_sha="$(git rev-parse HEAD)"
        if [[ "${checked_out_sha}" != "${HEAD_SHA}" ]]; then
          echo "::error::Verification checkout SHA mismatch: expected=${HEAD_SHA} actual=${checked_out_sha}"
          exit 1
        fi

        if [[ -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]] && ! git cat-file -e "${BASE_SHA}^{commit}" \
        2>/dev/null; then
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY_NAME}.git"
          git fetch --no-tags --depth=1 "${remote_url}" "${BASE_SHA}"
        fi

        if [[ -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]] && ! git cat-file -e "${BASE_SHA}^{commit}" \
        2>/dev/null; then
          echo "::error::Exact verification base commit is unavailable after fetch: ${BASE_SHA}"
          exit 1
        fi
