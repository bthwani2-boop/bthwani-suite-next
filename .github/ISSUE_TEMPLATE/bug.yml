name: Bug Report
description: Report reproducible incorrect behavior against a known repository/runtime candidate.
labels: ["bug", "fix-required"]
body:
  - type: markdown
    attributes:
      value: |
        Describe observable behavior without secrets, access tokens, raw personal data, payment/provider
        payloads, or private production logs.
  - type: input
    id: branch
    attributes:
      label: Branch or ref
      placeholder: e.g. abbas
    validations:
      required: true
  - type: input
    id: candidate
    attributes:
      label: Candidate commit SHA
      description: Exact commit where the behavior was observed, if repository-backed.
      placeholder: 40-character SHA or N/A with reason
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Actual behavior
      placeholder: What is observably wrong? Include sanitized status/error codes and correlation IDs when useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen according to current Product Truth/contract/owner behavior?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      placeholder: Reproduction steps using sanitized or synthetic data. Do not paste credentials or PII.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Affected actors, surfaces, and owner boundary
      placeholder: Customer/partner/captain/field/operator; app/control-panel/backend; suspected authoritative owner.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence references
      description: Link or identify candidate-bound runs/events without pasting sensitive raw logs.
      placeholder: CI/run ID, sanitized correlation ID, screenshot reference, runtime check, or N/A.
    validations:
      required: false
