packages:
  - "apps/*/runtime"
  - "shared/control-panel"
  - "shared/data-runtime"
  - "shared/ui-kit"
  - "services/*"
  - "core/identity"
  - "core/platform-control"
  - "core/providers"
  - "core/workforce"
  - "contracts"

allowBuilds:
  "@ast-grep/cli": false
  "@sentry/cli": true
  nx: true
  sharp: true
autoInstallPeers: false
blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 10080
nodeLinker: isolated
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'ua-parser-js@1.0.41'
  - 'semver@6.3.1'

# BEGIN BTHWANI_RUNTIME_VERSION_POLICY
overrides:
  '@eslint/eslintrc@*>js-yaml': 4.3.1
  '@opentelemetry/core@<2.8.0': '>=2.8.0'
  "@opentelemetry/exporter-prometheus": "^0.217.0"
  "@opentelemetry/exporter-trace-otlp-http": "^0.217.0"
  '@opentelemetry/propagator-jaeger@<2.9.0': '>=2.9.0'
  "@opentelemetry/sdk-node": "^0.217.0"
  "@react-native/metro-config": 0.86.2
  '@redocly/openapi-core@*>js-yaml': 4.3.1
  '@yarnpkg/parsers@*>js-yaml': 5.2.2
  brace-expansion@>=2.0.0 <3.0.0: 2.1.4
  brace-expansion@>=5.0.0 <5.0.9: 5.0.9
  fast-uri@>=3.0.0 <3.1.3: '>=3.1.3'
  fast-uri@>=3.0.0 <=3.1.3: '>=3.1.4'
  'front-matter@*>js-yaml': 5.2.2
  js-yaml@<3.15.1: 3.15.1
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  js-yaml@>=5.0.0 <5.2.2: 5.2.2
  minimatch: "^9.0.7"
  nanoid@<3.3.18: 3.3.18
  next: 16.2.11
  postcss@<8.5.23: 8.5.23
  protobufjs: "^8.4.1"
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.2
  react-native-worklets: 0.10.1
  sharp@<0.35.0: '>=0.35.0'
  'fbjs@3.0.5>ua-parser-js': 1.0.41
  shell-quote@<=1.8.4: '>=1.9.0'
  uuid@<11.1.1: '>=11.1.1'
patchedDependencies:
  image-size@1.2.1: tools/patches/image-size-1.2.1.patch
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: false

verifyDepsBeforeRun: false

# END BTHWANI_RUNTIME_VERSION_POLICY
