version: 1
authority: governance/policies/release.md
default_strategy: affected_only
checks_by_impact:
  docs_only:
    - git_diff_check
  backend_logic:
    - targeted_type_or_build
    - unit
  api_contract:
    - schema
    - generated_client
    - contract
  visible_ui:
    - targeted_typecheck
    - requested_visual_or_runtime_when_applicable
  security_sensitive:
    - secure_design
    - security_verification
    - threat_model_when_applicable
    - operator_context_isolation_negative_tests_when_applicable
    - independent_retest_for_critical_or_high
  release:
    - release_profile
    - rollback_procedure
    - monitoring_owner
    - unresolved_blocker_review
  operator_context:
    - operator_context_boundary
    - operator_context_propagation_matrix
    - operator_context_isolation_matrix
    - operator_context_resource_isolation_matrix
    - wlt_operator_context_financial_isolation_when_applicable
stop_on_blocking_failure: true
