# SonarQube Cloud project identity is supplied by GitHub Actions via
# SONAR_ORGANIZATION and SONAR_PROJECT_KEY repository variables.
# Keep this file focused on repository-wide analysis scope.

sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/.diagnostics/**,**/graphify-out/**,**/vendor/**,**/clients/generated/**
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*_test.go
sonar.sourceEncoding=UTF-8
