sonar.organization=bthwani2-boop
sonar.projectKey=bthwani2-boop_bthwani-suite-next
sonar.projectName=bthwani-suite-next

# Keep the scanner on authoritative product/infrastructure roots instead of the
# repository root. This preserves analyzable production, governance and infra
# code while avoiding traversal of root dependency/tooling trees that are not
# part of Sonar's source authority.
sonar.sources=apps,contracts,core,governance,infra,services,shared
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/.sonar/**,**/.diagnostics/**,**/graphify-out/**,**/vendor/**,**/clients/generated/**,**/*.sql,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.webp,**/*.ico
# Tests can coexist below source roots. sonar.test.inclusions classifies these
# paths as test code and Sonar automatically excludes them from main code.
# tools is test-only here because tool implementation is intentionally outside
# Sonar source authority and is covered by repository CI/security guards.
sonar.tests=apps,contracts,core,services,shared,tools
sonar.test.inclusions=**/tests/**,**/*.test.*,**/*.spec.*,**/*_test.go
sonar.test.exclusions=**/*.sql
# Go and JavaScript/TypeScript coverage paths are passed dynamically by the
# Sonar workflow only when the corresponding executable coverage evidence was
# generated. Source files without executed coverage remain visible to Sonar and
# are not globally excluded from the metric.
# Duplicate detection intentionally remains enabled repository-wide within the
# authoritative source roots. Generated, vendored, build, planning and binary
# asset content is outside the metric; handwritten multi-surface code must prove
# that duplication is acceptable rather than being hidden globally.
# S2077 cannot distinguish constant query fragments from input-built SQL in
# database/sql. CodeQL and the repository SQL guards remain authoritative for
# injection, while local HTTP defaults are runtime-development fallbacks whose
# production values are configuration-owned.
sonar.issue.ignore.multicriteria=safeConstantSql,localApiHttp,localBrokerHttp,localIdentityHttp
sonar.issue.ignore.multicriteria.safeConstantSql.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.safeConstantSql.resourceKey=**/*.go
sonar.issue.ignore.multicriteria.localApiHttp.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.localApiHttp.resourceKey=**/*api-base-url.ts
sonar.issue.ignore.multicriteria.localBrokerHttp.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.localBrokerHttp.resourceKey=**/dev-session-broker.adapter.ts
sonar.issue.ignore.multicriteria.localIdentityHttp.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.localIdentityHttp.resourceKey=**/identity-api-config.ts
sonar.sourceEncoding=UTF-8
