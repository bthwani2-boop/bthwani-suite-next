sonar.organization=bthwani2-boop
sonar.projectKey=bthwani2-boop_bthwani-suite-next
sonar.projectName=bthwani-suite-next
# The scanner is a release gate, not fire-and-forget analysis: CI must fail when
# SonarQube reports a failed Quality Gate for the exact analyzed candidate.
sonar.qualitygate.wait=true

# Keep the scanner on authoritative product/infrastructure roots instead of the
# repository root. Explicit root JavaScript configuration files remain in scope
# without forcing Sonar to traverse every root dependency/tooling directory.
sonar.sources=apps,contracts,core,infra,services,shared,.pnpmfile.cjs,eslint.config.mjs
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/.sonar/**,**/.diagnostics/**,**/graphify-out/**,**/vendor/**,**/clients/generated/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.webp,**/*.ico
# Tests and governed verification programs can coexist below source roots.
# tools/mobile is transport/verification tooling rather than shipped application
# source, so its JavaScript modules are classified as test code instead of
# silently appearing as uncovered product code. Product runtime src/ remains main.
# tools is test-only here because tool implementation is intentionally outside
# Sonar source authority and is covered by repository CI/security guards.
sonar.tests=apps,contracts,core,services,shared,tools
sonar.test.inclusions=**/tests/**,**/*.test.*,**/*.spec.*,**/*_test.go,tools/mobile/**/*.mjs
sonar.test.exclusions=**/*.sql
# Go and JavaScript/TypeScript coverage paths are passed dynamically by the
# Sonar workflow only when the corresponding executable coverage evidence was
# generated. Source files without executed coverage remain visible to Sonar and
# are not globally excluded from the metric.
# Duplicate detection intentionally remains enabled repository-wide within the
# authoritative source roots. Generated, vendored, build, planning and binary
# asset content is outside the metric; handwritten multi-surface code must prove
# that duplication is acceptable rather than being hidden globally.
# Local HTTP defaults are runtime-development fallbacks whose production values
# are configuration-owned. SQL remains in the analyzed source set so Sonar can
# report injection findings; CodeQL and repository SQL guards provide additional
# evidence for the same risk.
sonar.issue.ignore.multicriteria=localApiHttp,localBrokerHttp,localIdentityHttp
sonar.issue.ignore.multicriteria.localApiHttp.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.localApiHttp.resourceKey=**/*api-base-url.ts
sonar.issue.ignore.multicriteria.localBrokerHttp.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.localBrokerHttp.resourceKey=**/dev-session-broker.adapter.ts
sonar.issue.ignore.multicriteria.localIdentityHttp.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.localIdentityHttp.resourceKey=**/identity-api-config.ts
# Every concrete product TypeScript project is listed. Generated clients remain
# excluded from source analysis, while their owning configs stay visible to the
# TypeScript analyzer for drift detection.
sonar.typescript.tsconfigPaths=apps/app-captain/runtime/tsconfig.json,apps/app-client/runtime/tsconfig.json,apps/app-field/runtime/tsconfig.json,apps/app-partner/runtime/tsconfig.json,apps/control-panel/runtime/tsconfig.json,core/identity/tsconfig.json,core/platform-control/tsconfig.json,core/providers/tsconfig.json,core/workforce/tsconfig.json,services/dsh/tsconfig.json,services/dsh/tsconfig.platform-change-sets.json,services/wlt/tsconfig.json,shared/control-panel/tsconfig.json,shared/data-runtime/tsconfig.json,shared/ui-kit/tsconfig.json,shared/ui-kit/tsconfig.contracts.json
sonar.sourceEncoding=UTF-8
