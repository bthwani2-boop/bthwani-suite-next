# Bounded-context contract manifest.
#
# Declares what this context asserts about its own contract surface. The
# master indexes `entry` and nothing below it; `modules` must match the
# entry's x-bthwani-contracts exactly. Enforced by contracts-foundation.mjs.

context: core/identity
entry: ./identity.openapi.yaml
owner: core/identity
contractState: CONTRACT_ACTIVE
layout: INDEXED
bundle: ./generated/identity.bundle.openapi.yaml
client: ../clients/generated/identity-api.ts
regenerateScript: pnpm run openapi:generate:identity
modules:
  - ./employee-access.openapi.yaml
  - ./identity.rbac-admin.openapi.yaml
  - ./identity.support-sessions.openapi.yaml
overlays:
  - ./identity.actor-admin.overlay.yaml
  - ./identity.runtime-readiness.overlay.yaml
  - ./identity.refresh-concurrency.overlay.yaml
  - ./identity.device-binding.overlay.yaml
