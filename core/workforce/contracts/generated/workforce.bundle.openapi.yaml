components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ActorId:
      in: path
      name: actorId
      required: true
      schema:
        type: string
        minLength: 1
    ReferenceCode:
      in: path
      name: code
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKeyRequired:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
    CorrelationId:
      in: header
      name: X-Correlation-ID
      required: false
      schema:
        type: string
    IncludeInactive:
      in: query
      name: includeInactive
      required: false
      description: Operators only; ignored for other roles.
      schema:
        type: boolean
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthenticated:
      description: Authentication failed or the session expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated actor is not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Requested workforce resource was not found (PROFILE_NOT_PROVISIONED for /me).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Request was rate limited.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Conflict such as duplicate provider code, stale version, or invalid status transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: Workforce runtime or a sovereign dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ErrorResponse:
      description: Governed error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OperationalCoreResponse:
      description: Provider operational core and server activation readiness.
      content:
        application/json:
          schema:
            type: object
            required:
              - operationalCore
              - activationReadiness
            properties:
              operationalCore:
                $ref: "#/components/schemas/ProviderOperationalCore"
              activationReadiness:
                $ref: "#/components/schemas/ActivationReadiness"
    IncidentResponse:
      description: Provider incident.
      content:
        application/json:
          schema:
            type: object
            required:
              - incident
            properties:
              incident:
                $ref: "#/components/schemas/ProviderIncident"
    IncidentListResponse:
      description: Provider incidents.
      content:
        application/json:
          schema:
            type: object
            required:
              - incidents
            properties:
              incidents:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderIncident"
  schemas:
    RuntimeStatus:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
        service:
          type: string
    EngagementStatus:
      type: string
      enum:
        - pending_activation
        - active
        - suspended
        - terminated
    EngagementType:
      type: string
      enum:
        - independent_contractor
        - employee
    CreateFieldAgentRequest:
      type: object
      additionalProperties: false
      required:
        - fullNameAr
        - phoneE164
        - serviceZoneId
        - shiftCode
      properties:
        fullNameAr:
          type: string
          minLength: 1
        fullNameEn:
          type: string
        phoneE164:
          type: string
          minLength: 8
          maxLength: 20
        engagementType:
          $ref: "#/components/schemas/EngagementType"
        engagementStartDate:
          type: string
          format: date
        serviceZoneId:
          type: string
        shiftCode:
          type: string
        supervisorActorId:
          type: string
        photoMediaRef:
          type: string
        documentMediaRefs:
          type: array
          items:
            type: string
    UpdateFieldAgentRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        fullNameAr:
          type: string
        fullNameEn:
          type: string
        engagementType:
          $ref: "#/components/schemas/EngagementType"
        engagementStartDate:
          type: string
          format: date
        serviceZoneId:
          type: string
        shiftCode:
          type: string
        supervisorActorId:
          type: string
        photoMediaRef:
          type: string
    CreateCaptainRequest:
