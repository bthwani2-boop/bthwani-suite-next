openapi: 3.1.0
x-bthwani-owner: core/workforce
x-bthwani-contract-state: CONTRACT_ACTIVE
info:
  title: Workforce Reference and Affiliation Mutations Contract
  version: 1.2.0
paths:
  /workforce/reference/cities:
    post:
      tags: [ "workforce-reference" ]
      operationId: createWorkforceCity
      summary: Create Workforce-local display metadata for a city code
      description: >-
        Maintains local reference/display metadata only. DSH owns platform zones
        and operational zone validity; this mutation cannot authorize or block a
        field/captain service-zone assignment.
      x-bthwani-required-scope: reference:manage
      responses:
        '201': { description: Created }
        '400': { description: Invalid city reference input. }
        '401': { description: Authentication required. }
        '403': { description: reference:manage permission required. }
        '409': { description: City code conflicts with existing local metadata. }
      security:
        - bearerAuth: []
  /workforce/reference/cities/{code}:
    patch:
      tags: [ "workforce-reference" ]
      operationId: updateWorkforceCity
      summary: Update Workforce-local city display metadata
      description: >-
        Updates local labels/visibility only. The active flag is presentation
        state and is not an operational service-zone gate; DSH zone truth remains
        authoritative.
      x-bthwani-required-scope: reference:manage
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid city reference update. }
        '401': { description: Authentication required. }
        '403': { description: reference:manage permission required. }
        '404': { description: City reference not found. }
      security:
        - bearerAuth: []
  /workforce/field-agents/{actorId}/affiliations:
    patch:
      tags: [ "workforce-affiliation" ]
      operationId: replaceFieldAgentAffiliations
      summary: Replace a field agent's Workforce-owned affiliation scopes
      description: >-
        Canonical writer for field-agent Workforce affiliation/eligibility scopes
        such as store, service area, partner, and shift. This is not DSH order
        dispatch or delivery assignment truth. The complete affiliation set
        replaces the currently active set atomically. X-Correlation-ID is required
        and is the idempotency identity for an otherwise identical replacement request.
      x-bthwani-required-scope: provider:update
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceAffiliationsRequest'
      responses:
        '200':
          description: Canonical active affiliation set after replacement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorAffiliationsResponse'
        '400': { description: "Invalid actor, correlation id, scope type, target, or time range." }
        '401': { description: Authentication required. }
        '403': { description: provider:update permission required. }
        '404': { description: Workforce profile not found. }
        '409': { description: Correlation id replayed with different affiliation content. }
      security:
        - bearerAuth: []
  /workforce/captains/{actorId}/affiliations:
    patch:
      tags: [ "workforce-affiliation" ]
      operationId: replaceCaptainAffiliations
      summary: Replace a captain's Workforce-owned affiliation scopes
      description: >-
        Canonical writer for captain Workforce affiliation/eligibility scopes such
        as store, service area, partner, and shift. This is not DSH order dispatch
        or delivery assignment truth. The complete affiliation set replaces the
        currently active set atomically. X-Correlation-ID is required and is the
        idempotency identity for an otherwise identical replacement request.
      x-bthwani-required-scope: provider:update
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceAffiliationsRequest'
      responses:
        '200':
          description: Canonical active affiliation set after replacement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorAffiliationsResponse'
        '400': { description: "Invalid actor, correlation id, scope type, target, or time range." }
        '401': { description: Authentication required. }
        '403': { description: provider:update permission required. }
        '404': { description: Workforce profile not found. }
        '409': { description: Correlation id replayed with different affiliation content. }
      security:
        - bearerAuth: []
  /workforce/employees/{actorId}/affiliations:
    patch:
      tags: [ "workforce-affiliation" ]
      operationId: replaceEmployeeAffiliations
      summary: Replace an employee's Workforce-owned affiliation scopes
      description: >-
        Canonical writer for employee Workforce affiliation/eligibility scopes such
        as store, service area, partner, and shift. This is not DSH order dispatch
        or delivery assignment truth. The complete affiliation set replaces the
        currently active set atomically. X-Correlation-ID is required and is the
        idempotency identity for an otherwise identical replacement request.
      x-bthwani-required-scope: provider:update
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceAffiliationsRequest'
      responses:
        '200':
          description: Canonical active affiliation set after replacement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorAffiliationsResponse'
        '400': { description: "Invalid actor, correlation id, scope type, target, or time range." }
        '401': { description: Authentication required. }
        '403': { description: provider:update permission required. }
        '404': { description: Workforce profile not found. }
        '409': { description: Correlation id replayed with different affiliation content. }
      security:
        - bearerAuth: []
  /workforce/{collection}/{actorId}/documents:
    post:
      tags: [ "workforce-collection" ]
      operationId: appendWorkforceProviderDocument
      summary: Link an opaque DSH media reference to a Workforce profile
      x-bthwani-required-scope: provider:update
      parameters:
        - in: path
          name: collection
          required: true
          schema:
            type: string
            enum: [ field-agents, captains, employees ]
        - in: path
          name: actorId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ expectedVersion, mediaRef ]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                mediaRef: { type: string, minLength: 1 }
      responses:
        '200': { description: Linked }
        '400': { description: "Invalid collection, actor, version, or media reference." }
        '401': { description: Authentication required. }
        '403': { description: provider:update permission required. }
        '404': { description: Workforce profile not found. }
        '409': { description: Workforce profile version conflict. }
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ActorId:
      in: path
      name: actorId
      required: true
      schema: { type: string, minLength: 1 }
    CorrelationId:
      in: header
      name: X-Correlation-ID
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    ReplaceAffiliationsRequest:
      type: object
      additionalProperties: false
      required: [ affiliations ]
      properties:
        affiliations:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/AffiliationInput'
    ActorAffiliationsResponse:
      type: object
      additionalProperties: false
      required: [ affiliations ]
      properties:
        affiliations:
          $ref: '#/components/schemas/ActorAffiliations'
    AffiliationInput:
      type: object
      additionalProperties: false
      required: [ scopeType, scopeTargetId, startsOn ]
      properties:
        scopeType:
          type: string
          enum: [ store, area, partner, shift ]
        scopeTargetId:
          type: string
          minLength: 1
        startsOn:
          type: string
          format: date-time
        endsOn:
          type: string
          format: date-time
    ActorAffiliations:
      type: object
      additionalProperties: false
      required: [ actorId, role, operatorContextId, storeIds, serviceAreaCodes, partnerIds, shiftCodes ]
      properties:
        actorId: { type: string }
        role:
          type: string
          enum: [ field, captain, employee ]
        operatorContextId: { type: string }
        storeIds:
          type: array
          items: { type: string }
        serviceAreaCodes:
          type: array
          items: { type: string }
        partnerIds:
          type: array
          items: { type: string }
        shiftCodes:
          type: array
          items: { type: string }
