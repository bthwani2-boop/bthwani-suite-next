openapi: 3.1.0
info:
  title: BThwani Workforce Operational Core API
  version: 1.0.0
  description: Progressive independent-provider onboarding, availability,
    incidents, appeals, and evidence-backed captain classification.
x-bthwani-owner: core/workforce
servers:
  - url: http://localhost:58086
paths:
  /workforce/field-agents/{actorId}/operational-core:
    parameters:
      - $ref: '#/components/parameters/ActorId'
    get:
      operationId: getFieldOperationalCore
      responses:
        '200': { $ref: '#/components/responses/OperationalCoreResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
    patch:
      operationId: patchFieldOperationalCore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationalCorePatch' }
      responses:
        '200': { $ref: '#/components/responses/OperationalCoreResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /workforce/captains/{actorId}/operational-core:
    parameters:
      - $ref: '#/components/parameters/ActorId'
    get:
      operationId: getCaptainOperationalCore
      responses:
        '200': { $ref: '#/components/responses/OperationalCoreResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
    patch:
      operationId: patchCaptainOperationalCore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationalCorePatch' }
      responses:
        '200': { $ref: '#/components/responses/OperationalCoreResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /workforce/captains/{actorId}/classification/basic:
    parameters:
      - $ref: '#/components/parameters/ActorId'
    post:
      operationId: promoteCaptainToBasic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteCaptainInput' }
      responses:
        '200':
          description: Captain classification promoted or replayed as already basic.
          content:
            application/json:
              schema:
                type: object
                required: [ operationalCore ]
                properties:
                  operationalCore: { $ref: '#/components/schemas/ProviderOperationalCore' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /workforce/me/operational-core:
    get:
      operationId: getOwnProviderOperationalCore
      responses:
        '200': { $ref: '#/components/responses/OperationalCoreResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /workforce/me/availability-notices:
    get:
      operationId: listOwnAvailabilityNotices
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Provider availability notices.
          content:
            application/json:
              schema:
                type: object
                required: [ availabilityNotices ]
                properties:
                  availabilityNotices:
                    type: array
                    items: { $ref: '#/components/schemas/AvailabilityNotice' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
    post:
      operationId: createOwnAvailabilityNotice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAvailabilityNoticeInput' }
      responses:
        '201':
          description: Availability notice created.
          content:
            application/json:
              schema:
                type: object
                required: [ availabilityNotice ]
                properties:
                  availabilityNotice: { $ref: '#/components/schemas/AvailabilityNotice' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /workforce/me/incidents:
    get:
      operationId: listOwnProviderIncidents
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { $ref: '#/components/responses/IncidentListResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /workforce/me/incidents/{incidentId}/appeal:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    post:
      operationId: appealOwnProviderIncident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ note ]
              properties:
                note: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/IncidentResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /workforce/provider-incidents:
    get:
      operationId: listProviderIncidentsForOperator
      parameters:
        - name: actorId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { $ref: '#/components/responses/IncidentListResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
    post:
      operationId: createProviderIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProviderIncidentInput' }
      responses:
        '201': { $ref: '#/components/responses/IncidentResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /workforce/provider-incidents/{incidentId}/status:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    patch:
      operationId: transitionProviderIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionProviderIncidentInput' }
      responses:
        '200': { $ref: '#/components/responses/IncidentResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
  /workforce/provider-incidents/{incidentId}/transitions:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    get:
      operationId: listProviderIncidentTransitions
      responses:
        '200':
          description: Append-only incident transition history.
          content:
            application/json:
              schema:
                type: object
                required: [ transitions ]
                properties:
                  transitions:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderIncidentTransition' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ActorId:
      name: actorId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ErrorResponse:
      description: Governed error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OperationalCoreResponse:
      description: Provider operational core and server activation readiness.
      content:
        application/json:
          schema:
            type: object
            required: [ operationalCore, activationReadiness ]
            properties:
              operationalCore: { $ref: '#/components/schemas/ProviderOperationalCore' }
              activationReadiness: { $ref: '#/components/schemas/ActivationReadiness' }
    IncidentResponse:
      description: Provider incident.
      content:
        application/json:
          schema:
            type: object
            required: [ incident ]
            properties:
              incident: { $ref: '#/components/schemas/ProviderIncident' }
    IncidentListResponse:
      description: Provider incidents.
      content:
        application/json:
          schema:
            type: object
            required: [ incidents ]
            properties:
              incidents:
                type: array
                items: { $ref: '#/components/schemas/ProviderIncident' }
  schemas:
    Error:
      type: object
      required: [ code, message ]
      properties:
        code: { type: string }
        message: { type: string }
    ActivationReadiness:
      type: object
      required: [ ready, missing ]
      properties:
        ready: { type: boolean }
        missing:
          type: array
          items: { type: string }
    CaptainActivationCore:
      type: object
      required:
        - classification
        - financialGuaranteeMinorUnits
        - financialGuaranteeCurrency
        - financialGuaranteeStatus
        - deliveryBagCustodyStatus
        - mandatoryPurchasesStatus
        - trainingStatus
        - operationsAccreditationStatus
        - version
      properties:
        classification: { type: string, enum: [ joker, basic ] }
        financialGuaranteeMinorUnits: { type: integer, format: int64, minimum: 0 }
        financialGuaranteeCurrency: { type: string, minLength: 3, maxLength: 3 }
        financialGuaranteeStatus:
          {
            type: string,
            enum: [ not_funded, pending_review, funded, released, forfeited ]
          }
        financialGuaranteeReference: { type: string }
        deliveryBagCustodyStatus: { type: string, enum: [ not_issued, issued, returned, lost, damaged ] }
        deliveryBagCustodyReference: { type: string }
        mandatoryPurchasesStatus:
          {
            type: string,
            enum: [ not_required, pending_payment, paid, paid_and_delivered, cancelled ]
          }
        mandatoryPurchasesReference: { type: string }
        trainingStatus: { type: string, enum: [ pending, in_progress, passed, failed ] }
        operationsAccreditationStatus: { type: string, enum: [ pending, approved, suspended, expired ] }
        version: { type: integer, minimum: 1 }
    ProviderOperationalCore:
      type: object
      required:
        - actorId
        - workforceKind
        - referralSourceType
        - identityVerificationStatus
        - contractReviewStatus
        - onboardingStage
        - version
      properties:
        actorId: { type: string }
        workforceKind: { type: string, enum: [ field, captain ] }
        referralSourceType:
          {
            type: string,
            enum:
              [
                employee,
                captain,
                field,
                partner,
                advertisement,
                social_media,
                public_referral,
                direct,
                other
              ]
          }
        referralSourceActorId: { type: string }
        referralPartnerId: { type: string }
        referralChannel: { type: string }
        referralNote: { type: string }
        guarantorFullName: { type: string }
        guarantorRelationship: { type: string }
        guarantorPhoneE164: { type: string }
        guarantorPhoneVerifiedAt: { type: string, format: date-time }
        nationalIdNumber: { type: string }
        identityFrontMediaRef: { type: string }
        identityBackMediaRef: { type: string }
        identityVerificationStatus:
          {
            type: string,
            enum: [ pending, under_review, approved, rejected, expired, needs_resubmission ]
          }
        identityRejectionReason: { type: string }
        contractMediaRef: { type: string }
        contractReviewStatus:
          {
            type: string,
            enum: [ pending, under_review, approved, rejected, needs_resubmission ]
          }
        contractRejectionReason: { type: string }
        onboardingStage:
          {
            type: string,
            enum:
              [
                basic_profile,
                documents_pending,
                documents_review,
                training_pending,
                partnerships_review,
                operations_review,
                activation_ready,
                active
              ]
          }
        partnershipsApprovedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        captain: { $ref: '#/components/schemas/CaptainActivationCore' }
    OperationalCorePatch:
      type: object
      additionalProperties: false
      properties:
        referralSourceType:
          {
            type: string,
            enum:
              [
                employee,
                captain,
                field,
                partner,
                advertisement,
                social_media,
                public_referral,
                direct,
                other
              ]
          }
        referralSourceActorId: { type: string }
        referralPartnerId: { type: string }
        referralChannel: { type: string }
        referralNote: { type: string }
        guarantorFullName: { type: string }
        guarantorRelationship: { type: string }
        guarantorPhoneE164: { type: string }
        guarantorPhoneVerified: { type: boolean }
        nationalIdNumber: { type: string }
        identityFrontMediaRef: { type: string }
        identityBackMediaRef: { type: string }
        identityVerificationStatus:
          {
            type: string,
            enum: [ pending, under_review, approved, rejected, expired, needs_resubmission ]
          }
        identityRejectionReason: { type: string }
        contractMediaRef: { type: string }
        contractReviewStatus:
          {
            type: string,
            enum: [ pending, under_review, approved, rejected, needs_resubmission ]
          }
        contractRejectionReason: { type: string }
        onboardingStage:
          {
            type: string,
            enum:
              [
                basic_profile,
                documents_pending,
                documents_review,
                training_pending,
                partnerships_review,
                operations_review,
                activation_ready,
                active
              ]
          }
        partnershipsApproved: { type: boolean }
        captain:
          type: object
          additionalProperties: false
          properties:
            classification:
              {
                type: string,
                enum: [ joker, basic ],
                description: Direct promotion is rejected; use the evidence-backed
                  classification command.
              }
            financialGuaranteeMinorUnits: { type: integer, format: int64, minimum: 0 }
            financialGuaranteeCurrency: { type: string, minLength: 3, maxLength: 3 }
            financialGuaranteeStatus:
              {
                type: string,
                enum: [ not_funded, pending_review, funded, released, forfeited ]
              }
            financialGuaranteeReference: { type: string }
            deliveryBagCustodyStatus: { type: string, enum: [ not_issued, issued, returned, lost, damaged ] }
            deliveryBagCustodyReference: { type: string }
            mandatoryPurchasesStatus:
              {
                type: string,
                enum: [ not_required, pending_payment, paid, paid_and_delivered, cancelled ]
              }
            mandatoryPurchasesReference: { type: string }
            trainingStatus: { type: string, enum: [ pending, in_progress, passed, failed ] }
            operationsAccreditationStatus: { type: string, enum: [ pending, approved, suspended, expired ] }
    PromoteCaptainInput:
      type: object
      additionalProperties: false
      required:
        [
          completedDeliveries,
          completionRateBasisPoints,
          severeIncidentFree,
          evidenceMediaRefs,
          decisionNote
        ]
      properties:
        completedDeliveries: { type: integer, minimum: 1 }
        completionRateBasisPoints: { type: integer, minimum: 1, maximum: 10000 }
        severeIncidentFree: { type: boolean, const: true }
        evidenceMediaRefs:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
        decisionNote: { type: string, minLength: 3, maxLength: 1000 }
    CreateAvailabilityNoticeInput:
      type: object
      additionalProperties: false
      required: [ noticeType, startsAt, endsAt, reasonCode ]
      properties:
        noticeType:
          {
            type: string,
            enum:
              [
                planned_unavailability,
                immediate_unavailability,
                short_break,
                emergency,
                temporary_restriction
              ]
          }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        serviceZoneId: { type: string }
        reasonCode: { type: string, minLength: 1 }
        note: { type: string, maxLength: 1000 }
    AvailabilityNotice:
      allOf:
        - $ref: '#/components/schemas/CreateAvailabilityNoticeInput'
        - type: object
          required: [ id, actorId, status, createdByActorId, createdAt, updatedAt ]
          properties:
            id: { type: string, format: uuid }
            actorId: { type: string }
            status: { type: string, enum: [ scheduled, active, completed, cancelled ] }
            createdByActorId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    IncidentStatus:
      type: string
      enum:
        [
          reported,
          under_review,
          provider_notified,
          appeal_window,
          approved,
          rejected,
          financial_action_posted,
          closed,
          reversed
        ]
    CreateProviderIncidentInput:
      type: object
      additionalProperties: false
      required: [ actorId, incidentCode, description, severity ]
      properties:
        actorId: { type: string, minLength: 1 }
        incidentCode: { type: string, minLength: 1 }
        sourceType: { type: string }
        sourceId: { type: string }
        description: { type: string, minLength: 1 }
        evidenceMediaRefs:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        severity: { type: string, enum: [ minor, major, critical ] }
        policyId: { type: string }
        proposedPenaltyMinorUnits: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, default: YER }
    ProviderIncident:
      allOf:
        - $ref: '#/components/schemas/CreateProviderIncidentInput'
        - type: object
          required: [ id, status, currency, reportedByActorId, version, createdAt, updatedAt ]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/IncidentStatus' }
            wltLedgerReference: { type: string }
            appealNote: { type: string }
            appealedAt: { type: string, format: date-time }
            resolutionNote: { type: string }
            reportedByActorId: { type: string }
            reviewedByActorId: { type: string }
            resolvedAt: { type: string, format: date-time }
            version: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    TransitionProviderIncidentInput:
      type: object
      additionalProperties: false
      required: [ toStatus ]
      properties:
        toStatus: { $ref: '#/components/schemas/IncidentStatus' }
        resolutionNote: { type: string, minLength: 3, maxLength: 1000 }
        wltLedgerReference: { type: string, minLength: 1 }
    ProviderIncidentTransition:
      type: object
      required: [ id, incidentId, fromStatus, toStatus, changedByActorId, createdAt ]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        fromStatus: { $ref: '#/components/schemas/IncidentStatus' }
        toStatus: { $ref: '#/components/schemas/IncidentStatus' }
        resolutionNote: { type: string }
        wltLedgerReference: { type: string }
        changedByActorId: { type: string }
        createdAt: { type: string, format: date-time }
x-bthwani-service: workforce
x-bthwani-contract-state: CONTRACT_ACTIVE
