openapi: 3.1.0
info:
  title: Workforce Internal DSH API
  version: 2.0.0
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-owner: core/workforce
paths:
  /internal/captains/{actorId}/readiness:
    get:
      operationId: getInternalCaptainReadiness
      summary: Read governed captain activation readiness through DSH service identity.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
      responses:
        '200':
          description: Governed captain activation readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalActivationReadinessResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
          serviceCaller: []
  /internal/fields/{actorId}/readiness:
    get:
      operationId: getInternalFieldReadiness
      summary: Read governed field activation readiness through DSH service identity.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
      responses:
        '200':
          description: Governed field activation readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalActivationReadinessResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
          serviceCaller: []
  /internal/assignments/{actorId}/scopes:
    get:
      operationId: getInternalActorScopes
      summary: Read Workforce-owned active operational scopes in a trusted platform context.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/Role'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/OperatorContext'
      responses:
        '200':
          description: Active actor scopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorScopes'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
          serviceCaller: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: DSH-to-Workforce service credential for read-only internal consumption.
    serviceCaller:
      type: apiKey
      in: header
      name: X-Service-Caller
  parameters:
    ActorId:
      in: path
      name: actorId
      required: true
      schema:
        type: string
        minLength: 1
    Role:
      in: query
      name: role
      required: true
      schema:
        type: string
        enum: [field, captain, employee]
    Authorization:
      in: header
      name: Authorization
      required: true
      schema:
        type: string
        minLength: 8
    ServiceCaller:
      in: header
      name: X-Service-Caller
      required: true
      schema:
        type: string
        const: dsh
    OperatorContext:
      in: header
      name: X-Operator-Context-ID
      required: true
      description: Context assertion resolved by DSH from Identity and independently attested by Workforce against Identity before use.
      schema:
        type: string
        minLength: 1
  responses:
    InvalidRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: Valid DSH service identity is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: The asserted actor or operator context is not a verified Identity relationship.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Provider is not present for the requested Workforce kind.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Workforce readiness truth cannot currently be evaluated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Workforce could not complete the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    InternalActivationReadinessResponse:
      type: object
      additionalProperties: false
      required: [activationReadiness]
      properties:
        activationReadiness:
          $ref: '#/components/schemas/InternalActivationReadiness'
    InternalActivationReadiness:
      type: object
      additionalProperties: false
      required: [isActive, missing]
      properties:
        isActive:
          type: boolean
          description: True only when all governed Workforce activation requirements are satisfied.
        missing:
          type: array
          items:
            type: string
    ActorScopes:
      type: object
      additionalProperties: false
      required: [actorId, role, operatorContextId, storeIds, serviceAreaCodes, partnerIds, shiftCodes]
      properties:
        actorId:
          type: string
        role:
          type: string
          enum: [field, captain, employee]
        operatorContextId:
          type: string
        storeIds:
          type: array
          items:
            type: string
        serviceAreaCodes:
          type: array
          items:
            type: string
        partnerIds:
          type: array
          items:
            type: string
        shiftCodes:
          type: array
          items:
            type: string
